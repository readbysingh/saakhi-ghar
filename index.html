pa:{t:["ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਗੰਗਾ ਕੰਢੇ ਵਸੇ ਪਵਿੱਤਰ ਸ਼ਹਿਰ ਬਨਾਰਸ ਪਹੁੰਚੇ। ਉੱਥੇ ਭਾਈ ਜਵੇਹਰੀ ਮੱਲ ਨਾਂ ਦਾ ਇੱਕ ਸਿੱਖ ਕਈ ਸਾਲਾਂ ਤੋਂ ਗੁਰੂ ਨਾਨਕ ਦਾ ਉਪਦੇਸ਼ ਪ੍ਰਚਾਰ ਰਿਹਾ ਸੀ।","ਇੱਕ ਸਵੇਰ ਗੁਰੂ ਜੀ ਨੇ ਭਾਈ ਜਵੇਹਰੀ ਮੱਲ ਨੂੰ ਤੌਲੀਆ ਅਤੇ ਸਾਫ਼ ਕੱਪੜੇ ਲੈ ਕੇ ਕਾਹਲੀ ਨਾਲ ਜਾਂਦਿਆਂ ਵੇਖਿਆ। ਗੁਰੂ ਜੀ ਨੇ ਪੁੱਛਿਆ, 'ਕਿੱਥੇ ਚੱਲੇ ਹੋ?' ਉਸ ਨੇ ਕਿਹਾ, 'ਪਵਿੱਤਰ ਗੰਗਾ ਵਿੱਚ ਇਸ਼ਨਾਨ ਕਰਨ।'","ਗੁਰੂ ਜੀ ਮੁਸਕਰਾਏ, 'ਸਿੱਖ ਦਾ ਸੱਚਾ ਤੀਰਥ ਸਾਧਸੰਗਤ ਹੈ, ਜਿੱਥੇ ਰੱਬ ਦੀ ਸਿਫ਼ਤ ਗਾਈ ਜਾਂਦੀ ਹੈ। ਸਿੱਖਾਂ ਨੂੰ ਗੰਗਾ ਕੋਲ ਜਾਣ ਦੀ ਲੋੜ ਨਹੀਂ। ਗੰਗਾ ਉਨ੍ਹਾਂ ਕੋਲ ਆਉਂਦੀ ਹੈ। ਉਹ ਪੱਥਰ ਚੁੱਕ ਕੇ ਵੇਖ।' ਜਦੋਂ ਭਾਈ ਜਵੇਹਰੀ ਮੱਲ ਨੇ ਪੱਥਰ ਹਟਾਏ, ਸਾਫ਼ ਪਾਣੀ ਫੁੱਟ ਪਿਆ। ਕਹਿੰਦੇ ਹਨ ਕਿ ਉਹ ਪਾਣੀ ਅੱਜ ਵੀ ਵਗਦਾ ਹੈ।","ਸਾਰੇ ਬਨਾਰਸ ਵਿੱਚ ਗੱਲ ਫੈਲ ਗਈ, ਅਤੇ ਬਹੁਤ ਲੋਕ ਗੁਰੂ ਜੀ ਦੇ ਦਰਸ਼ਨਾਂ ਨੂੰ ਆਏ। ਕੁਝ ਵਿਦਵਾਨ ਪੰਡਿਤਾਂ ਨੇ ਆ ਕੇ ਪੁੱਛਿਆ, 'ਅਸੀਂ ਸਿਆਣੇ ਹਾਂ ਅਤੇ ਹਰ ਰੋਜ਼ ਧਰਮ ਗ੍ਰੰਥ ਪੜ੍ਹਦੇ ਹਾਂ। ਫਿਰ ਵੀ ਲੋਕ ਮਾੜੇ ਕੰਮ ਕਿਉਂ ਕਰਦੇ ਹਨ?'","ਗੁਰੂ ਜੀ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, 'ਕਿਉਂਕਿ ਮਨ ਨੂੰ ਪੰਜ ਚੋਰਾਂ ਨੇ ਘੇਰਿਆ ਹੋਇਆ ਹੈ: ਕਾਮ, ਕ੍ਰੋਧ, ਲੋਭ, ਮੋਹ ਅਤੇ ਹੰਕਾਰ। ਧਰਮ ਗ੍ਰੰਥ ਪੜ੍ਹਨਾ ਚੰਗਾ ਹੈ, ਪਰ ਸਭ ਤੋਂ ਜ਼ਰੂਰੀ ਸਾਡੀ ਕਰਨੀ ਹੈ। ਪੜ੍ਹੋ, ਸਮਝੋ, ਅਤੇ ਉਸ ਅਨੁਸਾਰ ਜੀਵਨ ਢਾਲੋ। ਤਾਂ ਹੀ ਇਹ ਮਦਦ ਕਰਦੇ ਹਨ।'"],l:"ਪਵਿੱਤਰਤਾ ਸਿਰਫ਼ ਖ਼ਾਸ ਥਾਵਾਂ ਉੱਤੇ ਨਹੀਂ ਮਿਲਦੀ। ਉਹ ਉੱਥੇ ਮਿਲਦੀ ਹੈ ਜਿੱਥੇ ਲੋਕ ਰੱਬ ਨੂੰ ਯਾਦ ਕਰਨ ਲਈ ਜੁੜਦੇ ਹਨ, ਅਤੇ ਸਿੱਖੀ ਗੱਲ ਨੂੰ ਜੀਵਨ ਵਿੱਚ ਉਤਾਰਨ ਵਿੱਚ।"}},

{id:"bhai-phaggu",title:"Bhai Phaggu's Wide Door",gur:"ਭਾਈ ਫੱਗੂ",cat:"Guru Tegh Bahadur Ji",age:"Kids",where:"Sasaram",mins:3,c:"#F2B229",c2:"#2FA45A",h:395,art:"tree",
year:1666,approx:1,loc:[],themes:["Faith","Humility"],
summary:"Bhai Phaggu builds his house with an extra-wide door, just in case the Guru ever rides in on horseback.",
text:["Bhai Phaggu was a devoted Sikh who lived in Sasaram, far from Punjab. When he built his house, he made the doorway extra wide and the courtyard very big. Neighbours asked, 'Why such a wide door?'","'So that when my Guru comes, he won't have to get off his horse to come in,' said Bhai Phaggu. 'And the courtyard is for all the sangat who will come to see him.' People laughed. 'Your Guru lives far away in Punjab. Why would he ever come here?' Bhai Phaggu said, 'He knows what is in my heart. One day he will come.'","And one day, Guru Tegh Bahadur Ji rode right through that wide doorway! Bhai Phaggu was overjoyed. Sikhs filled the courtyard, and Bhai Phaggu offered Guru Ji all the gifts the sangat had collected. Then Guru Ji asked, 'Has anything a Sikh gave for me been left out?'","Bhai Phaggu was puzzled. Then Guru Ji pointed to a ber tree in the courtyard, heavy with fruit. Bhai Phaggu remembered. 'Once I went to collect an offering from a very poor Sikh family. They had nothing to give, so the wife gave me a handful of sweepings instead. I washed them and found a ber seed, and I planted it. I never sent you the fruit of this tree.'","Guru Ji was very pleased. 'Phaggu, you didn't look down on that poor family's tiny gift. You planted it and cared for it. Sikhs like you help the Sikh faith grow from a tiny seed into a great tree.'"],
lesson:"No gift given with love is too small. Faith and care can make a tiny seed grow into something great.",
think:["Why did Bhai Phaggu build such a wide door?","What does the ber tree show about small gifts?"],
words:[["Ber","A small, sweet fruit that grows on a thorny tree."],["Dasvandh","Giving a tenth of what we earn to help others."]],
quiz:[["Why did Bhai Phaggu build a wide door?",["So the Guru could ride in on his horse","To keep the house cool","For a big cart"],0],["What grew from the poor family's gift?",["A ber tree","A rose bush","A mango tree"],0],["What did Guru Ji say about Sikhs like Bhai Phaggu?",["They help the faith grow from a seed into a great tree","They should build bigger houses","They should sell the fruit"],0]],
pa:{t:["ਭਾਈ ਫੱਗੂ ਪੰਜਾਬ ਤੋਂ ਦੂਰ ਸਾਸਾਰਾਮ ਵਿੱਚ ਰਹਿਣ ਵਾਲਾ ਇੱਕ ਸ਼ਰਧਾਵਾਨ ਸਿੱਖ ਸੀ। ਘਰ ਬਣਾਉਣ ਵੇਲੇ ਉਸ ਨੇ ਦਰਵਾਜ਼ਾ ਬਹੁਤ ਚੌੜਾ ਅਤੇ ਵਿਹੜਾ ਬਹੁਤ ਵੱਡਾ ਬਣਾਇਆ। ਗੁਆਂਢੀਆਂ ਨੇ ਪੁੱਛਿਆ, 'ਇੰਨਾ ਚੌੜਾ ਦਰਵਾਜ਼ਾ ਕਿਉਂ?'","ਭਾਈ ਫੱਗੂ ਨੇ ਕਿਹਾ, 'ਤਾਂ ਜੋ ਜਦੋਂ ਮੇਰੇ ਗੁਰੂ ਜੀ ਆਉਣ, ਉਨ੍ਹਾਂ ਨੂੰ ਘੋੜੇ ਤੋਂ ਉਤਰਨਾ ਨਾ ਪਵੇ। ਅਤੇ ਵਿਹੜਾ ਦਰਸ਼ਨਾਂ ਨੂੰ ਆਉਣ ਵਾਲੀ ਸੰਗਤ ਲਈ ਹੈ।' ਲੋਕ ਹੱਸੇ, 'ਤੇਰੇ ਗੁਰੂ ਤਾਂ ਦੂਰ ਪੰਜਾਬ ਵਿੱਚ ਹਨ। ਉਹ ਇੱਥੇ ਕਿਉਂ ਆਉਣਗੇ?' ਭਾਈ ਫੱਗੂ ਨੇ ਕਿਹਾ, 'ਉਹ ਮੇਰੇ ਦਿਲ ਦੀ ਜਾਣਦੇ ਹਨ। ਇੱਕ ਦਿਨ ਜ਼ਰੂਰ ਆਉਣਗੇ।'","ਅਤੇ ਇੱਕ ਦਿਨ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਘੋੜੇ ਉੱਤੇ ਸਵਾਰ ਉਸੇ ਚੌੜੇ ਦਰਵਾਜ਼ੇ ਵਿੱਚੋਂ ਅੰਦਰ ਆਏ! ਭਾਈ ਫੱਗੂ ਦੀ ਖ਼ੁਸ਼ੀ ਦਾ ਕੋਈ ਅੰਤ ਨਾ ਰਿਹਾ। ਵਿਹੜਾ ਸੰਗਤ ਨਾਲ ਭਰ ਗਿਆ, ਅਤੇ ਭਾਈ ਫੱਗੂ ਨੇ ਸੰਗਤ ਦੀ ਸਾਰੀ ਭੇਟਾ ਗੁਰੂ ਜੀ ਅੱਗੇ ਰੱਖੀ। ਫਿਰ ਗੁਰੂ ਜੀ ਨੇ ਪੁੱਛਿਆ, 'ਕਿਸੇ ਸਿੱਖ ਦੀ ਭੇਜੀ ਕੋਈ ਚੀਜ਼ ਰਹਿ ਤਾਂ ਨਹੀਂ ਗਈ?'","ਭਾਈ ਫੱਗੂ ਸੋਚੀਂ ਪੈ ਗਿਆ। ਫਿਰ ਗੁਰੂ ਜੀ ਨੇ ਵਿਹੜੇ ਵਿੱਚ ਫਲਾਂ ਨਾਲ ਲੱਦੀ ਬੇਰੀ ਵੱਲ ਇਸ਼ਾਰਾ ਕੀਤਾ। ਭਾਈ ਫੱਗੂ ਨੂੰ ਯਾਦ ਆਇਆ, 'ਇੱਕ ਵਾਰ ਮੈਂ ਇੱਕ ਬਹੁਤ ਗਰੀਬ ਸਿੱਖ ਪਰਿਵਾਰ ਤੋਂ ਭੇਟਾ ਲੈਣ ਗਿਆ। ਉਨ੍ਹਾਂ ਕੋਲ ਦੇਣ ਨੂੰ ਕੁਝ ਨਹੀਂ ਸੀ, ਇਸ ਲਈ ਬੀਬੀ ਨੇ ਇੱਕ ਮੁੱਠੀ ਕੂੜਾ ਹੀ ਦੇ ਦਿੱਤਾ। ਮੈਂ ਉਸ ਨੂੰ ਧੋਤਾ ਤਾਂ ਵਿੱਚੋਂ ਬੇਰ ਦੀ ਗੁਠਲੀ ਨਿਕਲੀ, ਜੋ ਮੈਂ ਬੀਜ ਦਿੱਤੀ। ਇਸ ਬੇਰੀ ਦਾ ਫਲ ਮੈਂ ਤੁਹਾਨੂੰ ਕਦੇ ਨਹੀਂ ਭੇਜਿਆ।'","ਗੁਰੂ ਜੀ ਬਹੁਤ ਖ਼ੁਸ਼ ਹੋਏ, 'ਫੱਗੂ, ਤੂੰ ਉਸ ਗਰੀਬ ਪਰਿਵਾਰ ਦੀ ਛੋਟੀ ਜਿਹੀ ਭੇਟਾ ਨੂੰ ਨੀਵਾਂ ਨਹੀਂ ਸਮਝਿਆ। ਤੂੰ ਉਸ ਨੂੰ ਬੀਜਿਆ ਅਤੇ ਪਾਲਿਆ। ਤੇਰੇ ਵਰਗੇ ਸਿੱਖ ਹੀ ਸਿੱਖੀ ਨੂੰ ਨਿੱਕੇ ਜਿਹੇ ਬੀਜ ਤੋਂ ਵੱਡਾ ਰੁੱਖ ਬਣਾਉਂਦੇ ਹਨ।'"],l:"ਪਿਆਰ ਨਾਲ ਦਿੱਤੀ ਕੋਈ ਭੇਟਾ ਛੋਟੀ ਨਹੀਂ ਹੁੰਦੀ। ਸ਼ਰਧਾ ਅਤੇ ਸੰਭਾਲ ਨਿੱਕੇ ਜਿਹੇ ਬੀਜ ਨੂੰ ਵੀ ਵੱਡਾ ਰੁੱਖ ਬਣਾ ਸਕਦੀ ਹੈ।"}},

{id:"gaya-pind",title:"Balls of Flour at Gaya",gur:"ਗਯਾ ਦੇ ਪੰਡੇ",cat:"Guru Tegh Bahadur Ji",age:"Kids",where:"Gaya, on the Phalgu river",mins:2,c:"#E8743A",c2:"#3B5BDB",h:390,art:"eclipse",
year:1666,loc:["gaya"],themes:["Honesty","Faith"],
summary:"At Gaya, priests tell Guru Tegh Bahadur Ji that balls of flour thrown into the river will feed his ancestors in the next world.",
text:["Guru Tegh Bahadur Ji camped by the Phalgu river at Gaya. The priests there came to him with a sacred cotton thread and asked him to wear it. Guru Ji said kindly, 'Rather than a cotton thread, tie yourselves to the thread of God's true Name. That thread never breaks.'","Then they asked him to perform pind. In this ritual, balls of barley flour are thrown into the river, and the priests say they will reach the person's ancestors in the next world. Of course, the priests are paid for the ritual.","Guru Ji said, 'My ancestors are already one with God. They don't need balls of flour. And you yourselves say that anyone who sets foot in this river frees their ancestors. So why ask us to do pind at all?'","The priests admitted the truth. 'You're right,' they said. 'But if we don't do these rituals, how will we earn a living and feed our children?' Guru Ji felt sorry for them. He gave them some money and said, 'I'm giving you this out of kindness, not as payment for a ritual.'","Further on, at another river, priests told Guru Ji that bathing there would wipe out all his bad deeds. Guru Ji said, 'A dip in a river doesn't change our deeds. What changes us is the company of good people, where God's praises are sung.'"],
lesson:"Rituals done for money can't help anyone. What helps us is remembering God and living truthfully, and we can still show kindness to those who are struggling.",
think:["Why did Guru Ji say his ancestors didn't need balls of flour?","Why did Guru Ji still give the priests money?"],
words:[["Pind","A ritual of throwing balls of flour into a river for one's ancestors."],["Ancestors","Family members who lived long before us."]],
quiz:[["What did the priests first ask Guru Ji to wear?",["A sacred cotton thread","A crown","A garland"],0],["What are thrown into the river in the pind ritual?",["Balls of barley flour","Flowers","Coins"],0],["Why did Guru Ji give the priests money?",["Out of kindness","To pay for pind","To buy a boat"],0]],
pa:{t:["ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਨੇ ਗਯਾ ਵਿਖੇ ਫਲਗੂ ਨਦੀ ਕੰਢੇ ਡੇਰਾ ਲਾਇਆ। ਉੱਥੋਂ ਦੇ ਪੰਡੇ ਜਨੇਊ ਲੈ ਕੇ ਆਏ ਅਤੇ ਗੁਰੂ ਜੀ ਨੂੰ ਪਹਿਨਣ ਲਈ ਕਿਹਾ। ਗੁਰੂ ਜੀ ਨੇ ਪਿਆਰ ਨਾਲ ਕਿਹਾ, 'ਸੂਤ ਦੇ ਧਾਗੇ ਦੀ ਥਾਂ ਰੱਬ ਦੇ ਸੱਚੇ ਨਾਮ ਦੇ ਧਾਗੇ ਨਾਲ ਜੁੜੋ। ਉਹ ਧਾਗਾ ਕਦੇ ਨਹੀਂ ਟੁੱਟਦਾ।'","ਫਿਰ ਉਨ੍ਹਾਂ ਨੇ ਪਿੰਡ ਭਰਾਉਣ ਲਈ ਕਿਹਾ। ਇਸ ਰਸਮ ਵਿੱਚ ਜੌਂ ਦੇ ਆਟੇ ਦੇ ਪਿੰਨੇ ਨਦੀ ਵਿੱਚ ਸੁੱਟੇ ਜਾਂਦੇ ਹਨ, ਅਤੇ ਪੰਡੇ ਕਹਿੰਦੇ ਹਨ ਕਿ ਇਹ ਅਗਲੇ ਜਹਾਨ ਵਿੱਚ ਪਿਤਰਾਂ ਤੱਕ ਪਹੁੰਚਦੇ ਹਨ। ਬੇਸ਼ੱਕ ਪੰਡਿਆਂ ਨੂੰ ਇਸ ਰਸਮ ਦੇ ਪੈਸੇ ਮਿਲਦੇ ਹਨ।","ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਸਾਡੇ ਪਿਤਰ ਪਹਿਲਾਂ ਹੀ ਰੱਬ ਵਿੱਚ ਸਮਾਏ ਹੋਏ ਹਨ। ਉਨ੍ਹਾਂ ਨੂੰ ਆਟੇ ਦੇ ਪਿੰਨਿਆਂ ਦੀ ਲੋੜ ਨਹੀਂ। ਅਤੇ ਤੁਸੀਂ ਆਪ ਕਹਿੰਦੇ ਹੋ ਕਿ ਜੋ ਇਸ ਨਦੀ ਵਿੱਚ ਪੈਰ ਪਾਵੇ ਉਸ ਦੇ ਪਿਤਰ ਮੁਕਤ ਹੋ ਜਾਂਦੇ ਹਨ। ਫਿਰ ਪਿੰਡ ਭਰਾਉਣ ਲਈ ਕਿਉਂ ਕਹਿੰਦੇ ਹੋ?'","ਪੰਡਿਆਂ ਨੇ ਸੱਚ ਮੰਨ ਲਿਆ, 'ਤੁਸੀਂ ਠੀਕ ਕਹਿੰਦੇ ਹੋ। ਪਰ ਜੇ ਅਸੀਂ ਇਹ ਰਸਮਾਂ ਨਾ ਕਰੀਏ ਤਾਂ ਰੋਜ਼ੀ ਕਿਵੇਂ ਕਮਾਈਏ ਅਤੇ ਬੱਚੇ ਕਿਵੇਂ ਪਾਲੀਏ?' ਗੁਰੂ ਜੀ ਨੂੰ ਉਨ੍ਹਾਂ ਉੱਤੇ ਤਰਸ ਆਇਆ। ਉਨ੍ਹਾਂ ਨੇ ਕੁਝ ਪੈਸੇ ਦਿੱਤੇ ਅਤੇ ਕਿਹਾ, 'ਇਹ ਮੈਂ ਤਰਸ ਖਾ ਕੇ ਦੇ ਰਿਹਾ ਹਾਂ, ਕਿਸੇ ਰਸਮ ਦੇ ਬਦਲੇ ਨਹੀਂ।'","ਅੱਗੇ ਇੱਕ ਹੋਰ ਨਦੀ ਉੱਤੇ ਪੰਡਿਆਂ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਕਿਹਾ ਕਿ ਇੱਥੇ ਨਹਾਉਣ ਨਾਲ ਸਾਰੇ ਮਾੜੇ ਕਰਮ ਮਿਟ ਜਾਂਦੇ ਹਨ। ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਨਦੀ ਵਿੱਚ ਡੁਬਕੀ ਲਾਉਣ ਨਾਲ ਕਰਮ ਨਹੀਂ ਬਦਲਦੇ। ਸਾਨੂੰ ਬਦਲਦੀ ਹੈ ਸਾਧਸੰਗਤ, ਜਿੱਥੇ ਰੱਬ ਦੀ ਸਿਫ਼ਤ ਗਾਈ ਜਾਂਦੀ ਹੈ।'"],l:"ਪੈਸੇ ਲਈ ਕੀਤੀਆਂ ਰਸਮਾਂ ਕਿਸੇ ਦੀ ਮਦਦ ਨਹੀਂ ਕਰ ਸਕਦੀਆਂ। ਸਾਡੀ ਮਦਦ ਰੱਬ ਨੂੰ ਯਾਦ ਕਰਨਾ ਅਤੇ ਸੱਚਾ ਜੀਵਨ ਕਰਦਾ ਹੈ, ਅਤੇ ਔਖੇ ਵੇਲੇ ਲੋੜਵੰਦਾਂ ਉੱਤੇ ਤਰਸ ਵੀ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ।"}},

{id:"bhai-jagta",title:"Bhai Jagta, the Sweet-Maker",gur:"ਭਾਈ ਜਗਤਾ",cat:"Guru Tegh Bahadur Ji",age:"Kids",where:"Patna",mins:2,c:"#F0702A",c2:"#8E3FB8",h:390,art:"langar",
year:1666,loc:["patna"],themes:["Sewa","Humility"],
summary:"In Patna, Guru Tegh Bahadur Ji stays with a sweet-maker whose clothes are always greasy. Some people think that's very wrong.",
text:["In 1666 Guru Tegh Bahadur Ji reached Patna. A Sikh named Bhai Jagta, who ran a sweet shop, invited Guru Ji to stay at his house, and the sangat began gathering there every day.","Bhai Jagta got up very early every morning, bathed, recited Gurbani, and then put on his work clothes to make sweets. Because he worked over hot oil and syrup all day, his clothes always looked greasy. Anyone in need who came to his shop was given help with his whole heart.","Some people grumbled to Guru Ji. 'Why are you staying with this man? He never bathes, and he never even comes to the sangat!'","Guru Ji said, 'You don't know this man. He doesn't make a show of bathing, praying or going to the sangat. If you doubt him, stay one night at his house and see for yourself. He remembers God's Name every day. He bathes, he works honestly, and he serves the poor from what he earns.'","'Bhai Jagta is not a pretend Sikh,' said Guru Ji. 'He is a true and complete Sikh.' The people who had grumbled felt ashamed, and they learned not to judge someone by the way they look."],
lesson:"Don't judge people by their clothes or appearance. A true Sikh is known by honest work, kindness and remembering God, not by showing off.",
think:["Why were Bhai Jagta's clothes greasy?","Why did Guru Ji call him a true and complete Sikh?"],
words:[["Kirat karni","Earning a living by honest work."],["Sangat","The community of people who gather together."]],
quiz:[["What did Bhai Jagta do for a living?",["Made and sold sweets","Built houses","Grew wheat"],0],["Why did some people grumble?",["They thought he never bathed or prayed","He was too loud","He charged too much"],0],["What did Guru Ji call Bhai Jagta?",["A true and complete Sikh","A lazy man","A great soldier"],0]],
pa:{t:["1666 ਵਿੱਚ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਪਟਨੇ ਪਹੁੰਚੇ। ਮਠਿਆਈ ਦੀ ਦੁਕਾਨ ਚਲਾਉਣ ਵਾਲੇ ਭਾਈ ਜਗਤਾ ਨਾਂ ਦੇ ਇੱਕ ਸਿੱਖ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਆਪਣੇ ਘਰ ਠਹਿਰਨ ਦੀ ਬੇਨਤੀ ਕੀਤੀ, ਅਤੇ ਸੰਗਤ ਹਰ ਰੋਜ਼ ਉੱਥੇ ਜੁੜਨ ਲੱਗੀ।","ਭਾਈ ਜਗਤਾ ਹਰ ਰੋਜ਼ ਬਹੁਤ ਸਵੇਰੇ ਉੱਠਦੇ, ਇਸ਼ਨਾਨ ਕਰਦੇ, ਗੁਰਬਾਣੀ ਪੜ੍ਹਦੇ, ਅਤੇ ਫਿਰ ਮਠਿਆਈ ਬਣਾਉਣ ਲਈ ਕੰਮ ਵਾਲੇ ਕੱਪੜੇ ਪਾ ਲੈਂਦੇ। ਸਾਰਾ ਦਿਨ ਗਰਮ ਤੇਲ ਅਤੇ ਚਾਸ਼ਣੀ ਉੱਤੇ ਕੰਮ ਕਰਨ ਕਰਕੇ ਉਨ੍ਹਾਂ ਦੇ ਕੱਪੜੇ ਹਮੇਸ਼ਾ ਥਿੰਧੇ ਦਿਸਦੇ। ਦੁਕਾਨ ਉੱਤੇ ਆਏ ਹਰ ਲੋੜਵੰਦ ਦੀ ਉਹ ਪੂਰੇ ਦਿਲ ਨਾਲ ਮਦਦ ਕਰਦੇ।","ਕੁਝ ਲੋਕਾਂ ਨੇ ਗੁਰੂ ਜੀ ਕੋਲ ਸ਼ਿਕਾਇਤ ਕੀਤੀ, 'ਤੁਸੀਂ ਇਸ ਬੰਦੇ ਦੇ ਘਰ ਕਿਉਂ ਠਹਿਰੇ ਹੋ? ਇਹ ਨਾ ਕਦੇ ਨਹਾਉਂਦਾ ਹੈ, ਨਾ ਸੰਗਤ ਵਿੱਚ ਆਉਂਦਾ ਹੈ!'","ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਤੁਸੀਂ ਇਸ ਨੂੰ ਨਹੀਂ ਜਾਣਦੇ। ਇਹ ਇਸ਼ਨਾਨ, ਪਾਠ ਜਾਂ ਸੰਗਤ ਦਾ ਦਿਖਾਵਾ ਨਹੀਂ ਕਰਦਾ। ਜੇ ਸ਼ੱਕ ਹੈ, ਤਾਂ ਇੱਕ ਰਾਤ ਇਸ ਦੇ ਘਰ ਰਹਿ ਕੇ ਆਪ ਵੇਖ ਲਓ। ਇਹ ਹਰ ਰੋਜ਼ ਨਾਮ ਜਪਦਾ ਹੈ, ਇਸ਼ਨਾਨ ਕਰਦਾ ਹੈ, ਈਮਾਨਦਾਰੀ ਨਾਲ ਕਿਰਤ ਕਰਦਾ ਹੈ, ਅਤੇ ਆਪਣੀ ਕਮਾਈ ਵਿੱਚੋਂ ਗਰੀਬਾਂ ਦੀ ਸੇਵਾ ਕਰਦਾ ਹੈ।'","ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਭਾਈ ਜਗਤਾ ਦਿਖਾਵੇ ਦਾ ਸਿੱਖ ਨਹੀਂ। ਇਹ ਪੂਰਨ ਗੁਰਸਿੱਖ ਹੈ।' ਸ਼ਿਕਾਇਤ ਕਰਨ ਵਾਲੇ ਸ਼ਰਮਿੰਦੇ ਹੋਏ, ਅਤੇ ਉਨ੍ਹਾਂ ਨੇ ਸਿੱਖਿਆ ਕਿ ਕਿਸੇ ਨੂੰ ਉਸ ਦੀ ਦਿੱਖ ਤੋਂ ਨਹੀਂ ਪਰਖਣਾ ਚਾਹੀਦਾ।"],l:"ਕਿਸੇ ਨੂੰ ਕੱਪੜਿਆਂ ਜਾਂ ਦਿੱਖ ਤੋਂ ਨਾ ਪਰਖੋ। ਸੱਚਾ ਸਿੱਖ ਈਮਾਨਦਾਰ ਕਿਰਤ, ਦਇਆ ਅਤੇ ਨਾਮ ਸਿਮਰਨ ਨਾਲ ਪਛਾਣਿਆ ਜਾਂਦਾ ਹੈ, ਦਿਖਾਵੇ ਨਾਲ ਨਹੀਂ।"}},

{id:"assam-peace",title:"Peace by the Brahmaputra",gur:"ਆਸਾਮ ਵਿੱਚ ਸੁਲ੍ਹਾ",cat:"Guru Tegh Bahadur Ji",age:"Kids",where:"Dhaka and Assam",mins:3,c:"#1590B0",c2:"#F2B229",h:400,art:"boat",
year:1668,loc:["dhaka","assam"],themes:["Courage","Equality"],
summary:"An army marches to conquer Assam, and Guru Tegh Bahadur Ji goes along. Instead of a battle, he helps bring peace.",
text:["In 1667 Guru Tegh Bahadur Ji reached Dhaka, where Sikhs had been sharing Guru Nanak's message for many years. Crowds came to see him every day. One devoted old woman even asked if an artist could paint Guru Ji's picture before he left.","While Guru Ji was in Dhaka, Raja Ram Singh arrived with an army. The emperor had sent him to conquer Assam. Raja Ram Singh had great faith in the Guru, and people said frightening things about magic in Assam, so he asked Guru Ji to come with him. Guru Ji agreed.","At the great Brahmaputra river, Guru Ji camped on a raised mound, where Gurdwara Damdama Sahib stands today. He saw the river rising and told the soldiers to move their tents to higher ground. That night the river flooded, but Raja Ram Singh's camp was safe.","On the other side of the river was the army of the Raja of Assam. When he heard that Guru Nanak's ninth successor was in the camp, he came to meet Guru Ji too. Guru Ji spoke to both Rajas together: 'You are both warriors. A warrior's true duty is to protect faith and protect the weak, not to kill his own brothers or shed the blood of the poor.'","His words touched both their hearts. Instead of fighting, the two Rajas became friends and agreed on a fair border between their lands. Then Guru Ji began the long journey home to Punjab."],
lesson:"Wise words can stop a war. Peacemakers bring people together instead of letting them hurt each other.",
think:["What did Guru Ji say a warrior's true duty is?","How can you help two friends who are quarrelling make peace?"],
words:[["Brahmaputra","A great river that flows through Assam."],["Border","The line where one land ends and another begins."]],
quiz:[["Who asked Guru Ji to come to Assam?",["Raja Ram Singh","Emperor Akbar","Bhai Jagta"],0],["Why was Raja Ram Singh's camp safe from the flood?",["Guru Ji told them to move to higher ground","They had boats","It didn't rain"],0],["What happened between the two Rajas?",["They made peace and became friends","They fought a big battle","They both ran away"],0]],
pa:{t:["1667 ਵਿੱਚ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਢਾਕੇ ਪਹੁੰਚੇ, ਜਿੱਥੇ ਸਿੱਖ ਕਈ ਸਾਲਾਂ ਤੋਂ ਗੁਰੂ ਨਾਨਕ ਦਾ ਸੁਨੇਹਾ ਪ੍ਰਚਾਰ ਰਹੇ ਸਨ। ਹਰ ਰੋਜ਼ ਭੀੜਾਂ ਦਰਸ਼ਨਾਂ ਨੂੰ ਆਉਂਦੀਆਂ। ਇੱਕ ਸ਼ਰਧਾਲੂ ਬਜ਼ੁਰਗ ਮਾਈ ਨੇ ਤਾਂ ਜਾਣ ਤੋਂ ਪਹਿਲਾਂ ਕਿਸੇ ਚਿੱਤਰਕਾਰ ਤੋਂ ਗੁਰੂ ਜੀ ਦਾ ਚਿੱਤਰ ਬਣਵਾਉਣ ਦੀ ਬੇਨਤੀ ਵੀ ਕੀਤੀ।","ਜਦੋਂ ਗੁਰੂ ਜੀ ਢਾਕੇ ਵਿੱਚ ਸਨ, ਰਾਜਾ ਰਾਮ ਸਿੰਘ ਫ਼ੌਜ ਲੈ ਕੇ ਪਹੁੰਚਿਆ। ਬਾਦਸ਼ਾਹ ਨੇ ਉਸ ਨੂੰ ਆਸਾਮ ਜਿੱਤਣ ਭੇਜਿਆ ਸੀ। ਰਾਜਾ ਰਾਮ ਸਿੰਘ ਦੀ ਗੁਰੂ ਘਰ ਵਿੱਚ ਬਹੁਤ ਸ਼ਰਧਾ ਸੀ, ਅਤੇ ਲੋਕ ਆਸਾਮ ਦੇ ਜਾਦੂ-ਟੂਣਿਆਂ ਦੀਆਂ ਡਰਾਉਣੀਆਂ ਗੱਲਾਂ ਕਰਦੇ ਸਨ, ਇਸ ਲਈ ਉਸ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਨਾਲ ਚੱਲਣ ਦੀ ਬੇਨਤੀ ਕੀਤੀ। ਗੁਰੂ ਜੀ ਮੰਨ ਗਏ।","ਵੱਡੇ ਬ੍ਰਹਮਪੁੱਤਰ ਦਰਿਆ ਉੱਤੇ ਗੁਰੂ ਜੀ ਨੇ ਇੱਕ ਉੱਚੇ ਥੜ੍ਹੇ ਉੱਤੇ ਡੇਰਾ ਲਾਇਆ, ਜਿੱਥੇ ਅੱਜ ਗੁਰਦੁਆਰਾ ਦਮਦਮਾ ਸਾਹਿਬ ਹੈ। ਉਨ੍ਹਾਂ ਨੇ ਦਰਿਆ ਚੜ੍ਹਦਾ ਵੇਖਿਆ ਅਤੇ ਸਿਪਾਹੀਆਂ ਨੂੰ ਤੰਬੂ ਉੱਚੀ ਥਾਂ ਲਾਉਣ ਲਈ ਕਿਹਾ। ਉਸ ਰਾਤ ਦਰਿਆ ਵਿੱਚ ਹੜ੍ਹ ਆਇਆ, ਪਰ ਰਾਜਾ ਰਾਮ ਸਿੰਘ ਦਾ ਡੇਰਾ ਸੁਰੱਖਿਅਤ ਰਿਹਾ।","ਦਰਿਆ ਦੇ ਦੂਜੇ ਪਾਸੇ ਆਸਾਮ ਦੇ ਰਾਜੇ ਦੀ ਫ਼ੌਜ ਸੀ। ਜਦੋਂ ਉਸ ਨੇ ਸੁਣਿਆ ਕਿ ਗੁਰੂ ਨਾਨਕ ਦੀ ਨੌਵੀਂ ਜੋਤ ਡੇਰੇ ਵਿੱਚ ਹੈ, ਉਹ ਵੀ ਗੁਰੂ ਜੀ ਨੂੰ ਮਿਲਣ ਆਇਆ। ਗੁਰੂ ਜੀ ਨੇ ਦੋਹਾਂ ਰਾਜਿਆਂ ਨੂੰ ਇਕੱਠਿਆਂ ਕਿਹਾ, 'ਤੁਸੀਂ ਦੋਵੇਂ ਯੋਧੇ ਹੋ। ਯੋਧੇ ਦਾ ਸੱਚਾ ਧਰਮ ਧਰਮ ਦੀ ਅਤੇ ਕਮਜ਼ੋਰਾਂ ਦੀ ਰੱਖਿਆ ਕਰਨਾ ਹੈ, ਆਪਣੇ ਭਰਾਵਾਂ ਨੂੰ ਮਾਰਨਾ ਜਾਂ ਗਰੀਬਾਂ ਦਾ ਖ਼ੂਨ ਵਹਾਉਣਾ ਨਹੀਂ।'","ਉਨ੍ਹਾਂ ਦੇ ਬਚਨ ਦੋਹਾਂ ਦੇ ਦਿਲਾਂ ਨੂੰ ਛੂਹ ਗਏ। ਲੜਨ ਦੀ ਥਾਂ ਦੋਵੇਂ ਰਾਜੇ ਮਿੱਤਰ ਬਣ ਗਏ ਅਤੇ ਆਪਣੀਆਂ ਧਰਤੀਆਂ ਵਿਚਕਾਰ ਨਿਆਂਪੂਰਨ ਹੱਦ ਉੱਤੇ ਸਹਿਮਤ ਹੋ ਗਏ। ਫਿਰ ਗੁਰੂ ਜੀ ਪੰਜਾਬ ਵੱਲ ਲੰਮੇ ਸਫ਼ਰ ਉੱਤੇ ਤੁਰ ਪਏ।"],l:"ਸਿਆਣੇ ਬਚਨ ਜੰਗ ਰੋਕ ਸਕਦੇ ਹਨ। ਸੁਲ੍ਹਾ ਕਰਾਉਣ ਵਾਲੇ ਲੋਕਾਂ ਨੂੰ ਇੱਕ-ਦੂਜੇ ਦਾ ਨੁਕਸਾਨ ਕਰਨ ਦੀ ਥਾਂ ਨੇੜੇ ਲਿਆਉਂਦੇ ਹਨ।"}},

{id:"narain-das-worry",title:"The Way to Peace",gur:"ਸ਼ਾਂਤੀ ਦਾ ਰਾਹ",cat:"Guru Tegh Bahadur Ji",age:"Kids",where:"Anandpur Sahib",mins:3,c:"#2FA45A",c2:"#3B5BDB",h:395,art:"mountains",
year:1670,approx:1,loc:["anandpur"],themes:["Faith","Sewa"],
summary:"A worried father hasn't come to the sangat for a long time. He tells Guru Tegh Bahadur Ji about his lazy sons and his sleepless nights.",
text:["One morning Guru Tegh Bahadur Ji noticed a Sikh named Narain Das in the sangat for the first time in many days. 'Where have you been?' Guru Ji asked kindly.","Narain Das sighed. 'Guru Ji, I've been so busy. My wife died two years ago, and the whole family depends on me. My two grown-up sons are happy to sit around doing nothing, but they're always first at mealtimes! My savings are running out. I'm so worried that I can't sleep, while my sons sleep soundly every night.'","Guru Ji said, 'Your worry is not helping anyone. Because of your love for your children, you have started thinking the wrong way. You have done your duty. Now let your sons take care of themselves. Give some of your time to serving others, and you will find peace.'","Narain Das listened. He handed the responsibility of the farm to his sons and began doing sewa at the Guru's home. His sons, now that it was up to them, started working hard. And Narain Das found the peace and sleep he had lost.","Another day, a man came to Guru Ji by the river Sutlej. 'I've done prayers and read holy books for years, but I have no peace,' he said. Guru Ji said, 'Praying and reading are the first steps. But if you don't think about what you read and shape your life by it, peace won't come. Keep climbing the steps.'"],
lesson:"Worrying doesn't solve problems. Letting others take responsibility, serving those around us, and living by what we learn brings peace.",
think:["Why couldn't Narain Das sleep?","What changed when he gave his sons the responsibility?"],
words:[["Worry","Feeling troubled about something that might happen."],["Sewa","Selfless service, done without expecting a reward."]],
quiz:[["Why hadn't Narain Das come to the sangat?",["He was busy and worried about his family","He was travelling","He was ill"],0],["What did Guru Ji advise him to do?",["Let his sons take care of themselves and do sewa","Sell his farm","Move to a new town"],0],["What happened to his sons?",["They started working hard","They ran away","They became soldiers"],0]],
pa:{t:["ਇੱਕ ਸਵੇਰ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਨੇ ਕਈ ਦਿਨਾਂ ਬਾਅਦ ਨਰਾਇਣ ਦਾਸ ਨਾਂ ਦੇ ਸਿੱਖ ਨੂੰ ਸੰਗਤ ਵਿੱਚ ਵੇਖਿਆ। ਗੁਰੂ ਜੀ ਨੇ ਪਿਆਰ ਨਾਲ ਪੁੱਛਿਆ, 'ਕਿੱਥੇ ਸੀ ਇੰਨੇ ਦਿਨ?'","ਨਰਾਇਣ ਦਾਸ ਨੇ ਹਉਕਾ ਭਰਿਆ, 'ਗੁਰੂ ਜੀ, ਮੈਂ ਬਹੁਤ ਰੁੱਝਿਆ ਰਿਹਾ। ਦੋ ਸਾਲ ਪਹਿਲਾਂ ਮੇਰੀ ਘਰਵਾਲੀ ਚੜ੍ਹਾਈ ਕਰ ਗਈ, ਅਤੇ ਸਾਰਾ ਟੱਬਰ ਮੇਰੇ ਉੱਤੇ ਨਿਰਭਰ ਹੈ। ਮੇਰੇ ਦੋਵੇਂ ਜਵਾਨ ਪੁੱਤਰ ਵਿਹਲੇ ਬੈਠੇ ਖ਼ੁਸ਼ ਰਹਿੰਦੇ ਹਨ, ਪਰ ਰੋਟੀ ਵੇਲੇ ਸਭ ਤੋਂ ਅੱਗੇ ਹੁੰਦੇ ਹਨ! ਮੇਰੀ ਜਮ੍ਹਾਂ-ਪੂੰਜੀ ਮੁੱਕ ਰਹੀ ਹੈ। ਫ਼ਿਕਰ ਨਾਲ ਮੈਨੂੰ ਨੀਂਦ ਨਹੀਂ ਆਉਂਦੀ, ਜਦਕਿ ਪੁੱਤਰ ਹਰ ਰਾਤ ਘੂਕ ਸੌਂਦੇ ਹਨ।'","ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਤੇਰਾ ਫ਼ਿਕਰ ਕਿਸੇ ਦੀ ਮਦਦ ਨਹੀਂ ਕਰ ਰਿਹਾ। ਬੱਚਿਆਂ ਦੇ ਮੋਹ ਵਿੱਚ ਤੂੰ ਗ਼ਲਤ ਸੋਚਣ ਲੱਗ ਪਿਆ ਹੈਂ। ਤੂੰ ਆਪਣਾ ਫ਼ਰਜ਼ ਨਿਭਾ ਦਿੱਤਾ ਹੈ। ਹੁਣ ਪੁੱਤਰਾਂ ਨੂੰ ਆਪਣੀ ਸੰਭਾਲ ਆਪ ਕਰਨ ਦੇ। ਆਪਣਾ ਕੁਝ ਸਮਾਂ ਦੂਜਿਆਂ ਦੀ ਸੇਵਾ ਵਿੱਚ ਲਾ, ਤੈਨੂੰ ਸ਼ਾਂਤੀ ਮਿਲੇਗੀ।'","ਨਰਾਇਣ ਦਾਸ ਨੇ ਗੱਲ ਮੰਨੀ। ਉਸ ਨੇ ਖੇਤੀ ਦੀ ਜ਼ਿੰਮੇਵਾਰੀ ਪੁੱਤਰਾਂ ਨੂੰ ਸੌਂਪ ਦਿੱਤੀ ਅਤੇ ਗੁਰੂ ਘਰ ਵਿੱਚ ਸੇਵਾ ਕਰਨ ਲੱਗਾ। ਜਦੋਂ ਗੱਲ ਆਪਣੇ ਸਿਰ ਪਈ, ਪੁੱਤਰ ਮਿਹਨਤ ਕਰਨ ਲੱਗੇ। ਅਤੇ ਨਰਾਇਣ ਦਾਸ ਨੂੰ ਗੁਆਚੀ ਸ਼ਾਂਤੀ ਅਤੇ ਨੀਂਦ ਮੁੜ ਮਿਲ ਗਈ।","ਇੱਕ ਹੋਰ ਦਿਨ ਸਤਲੁਜ ਕੰਢੇ ਇੱਕ ਆਦਮੀ ਗੁਰੂ ਜੀ ਕੋਲ ਆਇਆ। ਉਸ ਨੇ ਕਿਹਾ, 'ਮੈਂ ਸਾਲਾਂ ਤੋਂ ਪੂਜਾ-ਪਾਠ ਕਰਦਾ ਹਾਂ, ਪਰ ਸ਼ਾਂਤੀ ਨਹੀਂ ਮਿਲੀ।' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਪੂਜਾ ਅਤੇ ਪਾਠ ਪਹਿਲੀਆਂ ਪੌੜੀਆਂ ਹਨ। ਪਰ ਜੇ ਤੂੰ ਪੜ੍ਹੇ ਉੱਤੇ ਵਿਚਾਰ ਨਹੀਂ ਕਰਦਾ ਅਤੇ ਉਸ ਅਨੁਸਾਰ ਜੀਵਨ ਨਹੀਂ ਢਾਲਦਾ, ਤਾਂ ਸ਼ਾਂਤੀ ਨਹੀਂ ਆਵੇਗੀ। ਪੌੜੀਆਂ ਚੜ੍ਹਦਾ ਰਹੁ।'"],l:"ਫ਼ਿਕਰ ਨਾਲ ਮੁਸ਼ਕਲਾਂ ਹੱਲ ਨਹੀਂ ਹੁੰਦੀਆਂ। ਦੂਜਿਆਂ ਨੂੰ ਜ਼ਿੰਮੇਵਾਰੀ ਲੈਣ ਦੇਣਾ, ਆਲੇ-ਦੁਆਲੇ ਦੀ ਸੇਵਾ ਕਰਨਾ, ਅਤੇ ਸਿੱਖੀ ਗੱਲ ਉੱਤੇ ਚੱਲਣਾ ਸ਼ਾਂਤੀ ਦਿੰਦਾ ਹੈ।"}},

{id:"hind-di-chadar",title:"Hind Di Chadar",gur:"ਹਿੰਦ ਦੀ ਚਾਦਰ",cat:"Guru Tegh Bahadur Ji",age:"Youth",where:"Chandni Chowk, Delhi",mins:3,c:"#1E1E24",c2:"#F0702A",h:410,art:"khanda",
year:1675,loc:["delhi"],themes:["Courage","Faith"],
summary:"Guru Tegh Bahadur Ji gives his life so that everyone can be free to follow their own faith.",
text:["Guru Tegh Bahadur Ji had gone to Delhi to stand up for the Kashmiri Pandits, who were being forced to give up their religion. He was arrested and kept in a cage. In front of his eyes, his three brave companions, Bhai Mati Das Ji, Bhai Sati Das Ji and Bhai Dayala Ji, were killed for refusing to give up their faith. But the Guru stayed calm and firm.","The Qazi, on the emperor's orders, offered him great riches if he would change his religion. Guru Ji said, 'I have no wish for riches. My path is dearer to me than anything.' Then the Qazi said, 'Then show us a miracle.' Guru Ji refused. 'I will not compete with God by showing miracles.'","'Then be ready to die,' said the Qazi. 'I am ready,' said Guru Ji. On 11 November 1675, in Chandni Chowk, in front of a huge crowd, Guru Tegh Bahadur Ji was asked one last time to give up his faith. He refused, and he was martyred.","At that moment, a great storm of dust blew up. In the confusion, Bhai Jaita Ji quietly carried the Guru's sacred head all the way to Anandpur, to the young Guru Gobind Rai. Bhai Lakhi Shah hid the Guru's body in his cart and cremated it with honour by setting his own house on fire. Today Gurdwara Sis Ganj Sahib and Gurdwara Rakab Ganj Sahib stand at these places in Delhi.","Guru Tegh Bahadur Ji did not give his life for his own religion alone. He gave it so that everyone, of every faith, would be free to worship in their own way. That is why he is lovingly called Hind Di Chadar: the shield and cover of India."],
lesson:"Everyone has the right to follow their own faith. Guru Tegh Bahadur Ji gave his life to protect that freedom for all people.",
think:["Why is Guru Tegh Bahadur Ji called Hind Di Chadar?","Why is it important to protect other people's freedom, not just our own?"],
words:[["Martyr","Someone who gives their life for what is right."],["Hind Di Chadar","'The shield of India', a loving title for Guru Tegh Bahadur Ji."],["Chandni Chowk","A famous market street in Old Delhi."]],
quiz:[["Whom had Guru Ji gone to Delhi to stand up for?",["The Kashmiri Pandits","The emperor's army","Some traders"],0],["Who carried the Guru's head to Anandpur?",["Bhai Jaita Ji","Bhai Lakhi Shah","Raja Ram Singh"],0],["Which Gurdwara stands where Guru Ji was martyred?",["Gurdwara Sis Ganj Sahib","Gurdwara Bangla Sahib","Harmandir Sahib"],0]],
pa:{t:["ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਕਸ਼ਮੀਰੀ ਪੰਡਿਤਾਂ ਦੇ ਹੱਕ ਵਿੱਚ ਖੜ੍ਹਨ ਲਈ ਦਿੱਲੀ ਗਏ ਸਨ, ਜਿਨ੍ਹਾਂ ਨੂੰ ਜ਼ਬਰਦਸਤੀ ਧਰਮ ਛੁਡਾਇਆ ਜਾ ਰਿਹਾ ਸੀ। ਉਨ੍ਹਾਂ ਨੂੰ ਗ੍ਰਿਫ਼ਤਾਰ ਕਰ ਕੇ ਪਿੰਜਰੇ ਵਿੱਚ ਰੱਖਿਆ ਗਿਆ। ਉਨ੍ਹਾਂ ਦੀਆਂ ਅੱਖਾਂ ਸਾਹਮਣੇ ਉਨ੍ਹਾਂ ਦੇ ਤਿੰਨ ਬਹਾਦਰ ਸਾਥੀਆਂ, ਭਾਈ ਮਤੀ ਦਾਸ ਜੀ, ਭਾਈ ਸਤੀ ਦਾਸ ਜੀ ਅਤੇ ਭਾਈ ਦਿਆਲਾ ਜੀ, ਨੂੰ ਧਰਮ ਨਾ ਛੱਡਣ ਕਰਕੇ ਸ਼ਹੀਦ ਕਰ ਦਿੱਤਾ ਗਿਆ। ਪਰ ਗੁਰੂ ਜੀ ਸ਼ਾਂਤ ਅਤੇ ਅਡੋਲ ਰਹੇ।","ਬਾਦਸ਼ਾਹ ਦੇ ਹੁਕਮ ਉੱਤੇ ਕਾਜ਼ੀ ਨੇ ਧਰਮ ਬਦਲਣ ਦੇ ਬਦਲੇ ਵੱਡੀਆਂ ਜਗੀਰਾਂ ਦਾ ਲਾਲਚ ਦਿੱਤਾ। ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਮੈਨੂੰ ਧਨ-ਦੌਲਤ ਦੀ ਕੋਈ ਇੱਛਾ ਨਹੀਂ। ਮੈਨੂੰ ਆਪਣਾ ਧਰਮ ਸਭ ਤੋਂ ਪਿਆਰਾ ਹੈ।' ਫਿਰ ਕਾਜ਼ੀ ਨੇ ਕਿਹਾ, 'ਤਾਂ ਕੋਈ ਕਰਾਮਾਤ ਵਿਖਾਓ।' ਗੁਰੂ ਜੀ ਨੇ ਇਨਕਾਰ ਕੀਤਾ, 'ਮੈਂ ਕਰਾਮਾਤ ਵਿਖਾ ਕੇ ਰੱਬ ਨਾਲ ਸ਼ਰੀਕਾ ਨਹੀਂ ਕਰਾਂਗਾ।'","ਕਾਜ਼ੀ ਨੇ ਕਿਹਾ, 'ਫਿਰ ਮਰਨ ਲਈ ਤਿਆਰ ਹੋ ਜਾਓ।' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਮੈਂ ਤਿਆਰ ਹਾਂ।' 11 ਨਵੰਬਰ 1675 ਨੂੰ ਚਾਂਦਨੀ ਚੌਕ ਵਿੱਚ, ਭਾਰੀ ਭੀੜ ਦੇ ਸਾਹਮਣੇ, ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਨੂੰ ਆਖ਼ਰੀ ਵਾਰ ਧਰਮ ਛੱਡਣ ਲਈ ਕਿਹਾ ਗਿਆ। ਉਨ੍ਹਾਂ ਨੇ ਇਨਕਾਰ ਕੀਤਾ, ਅਤੇ ਸ਼ਹੀਦੀ ਪਾਈ।","ਉਸੇ ਵੇਲੇ ਜ਼ੋਰਦਾਰ ਹਨੇਰੀ ਚੱਲ ਪਈ। ਹਫ਼ੜਾ-ਦਫ਼ੜੀ ਵਿੱਚ ਭਾਈ ਜੈਤਾ ਜੀ ਗੁਰੂ ਜੀ ਦਾ ਪਵਿੱਤਰ ਸੀਸ ਚੁੱਪ-ਚਾਪ ਚੁੱਕ ਕੇ ਅਨੰਦਪੁਰ, ਬਾਲ ਗੁਰੂ ਗੋਬਿੰਦ ਰਾਇ ਜੀ ਕੋਲ ਲੈ ਗਏ। ਭਾਈ ਲੱਖੀ ਸ਼ਾਹ ਨੇ ਗੁਰੂ ਜੀ ਦਾ ਧੜ ਆਪਣੇ ਗੱਡੇ ਵਿੱਚ ਲੁਕਾਇਆ ਅਤੇ ਆਪਣੇ ਘਰ ਨੂੰ ਅੱਗ ਲਾ ਕੇ ਸਤਿਕਾਰ ਨਾਲ ਸਸਕਾਰ ਕੀਤਾ। ਅੱਜ ਦਿੱਲੀ ਵਿੱਚ ਇਨ੍ਹਾਂ ਥਾਵਾਂ ਉੱਤੇ ਗੁਰਦੁਆਰਾ ਸੀਸ ਗੰਜ ਸਾਹਿਬ ਅਤੇ ਗੁਰਦੁਆਰਾ ਰਕਾਬ ਗੰਜ ਸਾਹਿਬ ਸੁਸ਼ੋਭਿਤ ਹਨ।","ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਨੇ ਸਿਰਫ਼ ਆਪਣੇ ਧਰਮ ਲਈ ਸ਼ਹੀਦੀ ਨਹੀਂ ਦਿੱਤੀ। ਉਨ੍ਹਾਂ ਨੇ ਇਸ ਲਈ ਦਿੱਤੀ ਕਿ ਹਰ ਧਰਮ ਦਾ ਹਰ ਮਨੁੱਖ ਆਪਣੇ ਢੰਗ ਨਾਲ ਪੂਜਾ ਕਰਨ ਲਈ ਆਜ਼ਾਦ ਰਹੇ। ਇਸੇ ਲਈ ਉਨ੍ਹਾਂ ਨੂੰ ਪਿਆਰ ਨਾਲ ਹਿੰਦ ਦੀ ਚਾਦਰ ਕਿਹਾ ਜਾਂਦਾ ਹੈ।"],l:"ਹਰ ਮਨੁੱਖ ਨੂੰ ਆਪਣਾ ਧਰਮ ਮੰਨਣ ਦਾ ਹੱਕ ਹੈ। ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਨੇ ਸਭ ਲੋਕਾਂ ਦੀ ਇਸ ਆਜ਼ਾਦੀ ਦੀ ਰੱਖਿਆ ਲਈ ਸ਼ਹੀਦੀ ਦਿੱਤੀ।"}}
]);

{id:"tapa-of-khadur",title:"The Rain at Khadur",gur:"ਖਡੂਰ ਦਾ ਤਪਾ",cat:"Guru Angad Dev Ji",age:"Kids",where:"Khadur Sahib",mins:3,c:"#E8743A",c2:"#1590B0",h:395,art:"hut",
year:1550,approx:1,loc:["khadur"],themes:["Humility","Faith"],
summary:"A jealous holy man tells the farmers that their village has no rain because of Guru Angad Dev Ji. The Guru quietly leaves.",
text:["A holy man named Shiv Nath, known as the Tapa, lived in Khadur. People said he knew magic, so the villagers were afraid of him and gave him whatever he asked for. When Guru Angad Dev Ji came to live in Khadur, crowds of Sikhs came to see the Guru, and the Tapa grew very jealous.","One summer there was no rain, and the crops were drying up. The worried farmers went to the Tapa. He said, 'It won't rain while you let that householder be worshipped in your village. Send him away, and the rain will come.'","The farmers told Guru Angad Dev Ji what the Tapa had said. Guru Ji did not argue. 'If my leaving will bring you rain, I'll go,' he said, and he quietly moved to a nearby village. But days passed, and still no rain fell.","When Amar Das, who was later to become the third Guru, came to Khadur and heard the story, he was upset. 'You sent the Guru away because of a jealous man's words!' he said. The angry farmers turned on the Tapa and dragged him roughly from field to field, and the Tapa was badly hurt. Then the rain came.","When Amar Das told Guru Ji what had happened, Guru Ji was not pleased. 'We should not take revenge or try to prove ourselves,' he said gently. 'When someone makes a mistake, it is our duty to forgive them, and to accept God's will.' Amar Das asked forgiveness and remembered this lesson all his life."],
lesson:"Jealousy hurts the jealous person most. Instead of taking revenge on those who wrong us, we should forgive and trust God.",
think:["Why did the Tapa blame the Guru for the lack of rain?","Why was Guru Ji unhappy about what happened to the Tapa?"],
words:[["Tapa","Someone who does hard religious practices to show their holiness."],["Householder","Someone who lives with a family and works for a living."]],
