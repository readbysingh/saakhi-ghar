{id:"live-what-you-teach",title:"Live What You Teach",gur:"ਕਹਿਣੀ ਤੇ ਕਰਨੀ",cat:"Guru Arjan Dev Ji",age:"Kids",where:"Amritsar",mins:2,c:"#DC3B32",c2:"#F2B229",h:390,art:"granth",
year:1600,approx:1,loc:["amritsar"],themes:["Honesty","Humility"],
summary:"Two famous preachers explain Gurbani beautifully, but they can't find peace. They ask Guru Arjan Dev Ji why.",
text:["Bhai Bala and Bhai Krishna were two learned Sikhs. They explained Gurbani so well that people from many villages invited them to speak, and gave them generous gifts of money. They were so busy that they hardly had a moment to spare.","One day they made time to visit Guru Arjan Dev Ji at Amritsar. After the morning kirtan they said, 'Guru Ji, people listen to us with great respect. But our own minds are never at peace. Please tell us what we are doing wrong.'","Guru Ji said kindly, 'You explain the Guru's words beautifully to others. But you don't shape your own lives by those words. When people give you money, you forget that the teachings are for you too.'","'To meditate truly,' Guru Ji said, 'is to live by the Guru's teachings, not just to talk about them. When your life matches your words, your mind will find peace.'","Bhai Bala and Bhai Krishna took the advice to heart. They began to live by what they taught, and when they spoke to the sangat, they told them to do the same. Slowly, the peace they had been looking for came to them."],
lesson:"It isn't enough to know good words or say them to others. Peace comes when we live by them ourselves.",
think:["Why weren't Bhai Bala and Bhai Krishna at peace?","Is there something good you know you should do, but find hard to do?"],
words:[["Kirtan","Singing Gurbani with music."],["Meditate","To keep God in mind with love and attention."]],
quiz:[["What were Bhai Bala and Bhai Krishna famous for?",["Explaining Gurbani","Building houses","Playing the dhol"],0],["What was their problem?",["Their minds were not at peace","They had no money","They were ill"],0],["What did Guru Ji say true meditation is?",["Living by the Guru's teachings","Talking a lot","Collecting gifts"],0]],
pa:{t:["ਭਾਈ ਬਾਲਾ ਅਤੇ ਭਾਈ ਕ੍ਰਿਸ਼ਨਾ ਦੋ ਵਿਦਵਾਨ ਸਿੱਖ ਸਨ। ਉਹ ਗੁਰਬਾਣੀ ਦੀ ਇੰਨੀ ਸੋਹਣੀ ਵਿਆਖਿਆ ਕਰਦੇ ਸਨ ਕਿ ਬਹੁਤ ਸਾਰੇ ਪਿੰਡਾਂ ਦੇ ਲੋਕ ਉਨ੍ਹਾਂ ਨੂੰ ਕਥਾ ਲਈ ਸੱਦਦੇ ਅਤੇ ਖੁੱਲ੍ਹੀ ਭੇਟਾ ਦਿੰਦੇ। ਉਹ ਇੰਨੇ ਰੁੱਝੇ ਰਹਿੰਦੇ ਕਿ ਮਸਾਂ ਹੀ ਕੋਈ ਵਿਹਲ ਮਿਲਦੀ।","ਇੱਕ ਦਿਨ ਉਹ ਸਮਾਂ ਕੱਢ ਕੇ ਅੰਮ੍ਰਿਤਸਰ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਦੇ ਦਰਸ਼ਨਾਂ ਲਈ ਆਏ। ਸਵੇਰ ਦੇ ਕੀਰਤਨ ਤੋਂ ਬਾਅਦ ਉਨ੍ਹਾਂ ਬੇਨਤੀ ਕੀਤੀ, 'ਗੁਰੂ ਜੀ, ਲੋਕ ਸਾਨੂੰ ਬੜੇ ਸਤਿਕਾਰ ਨਾਲ ਸੁਣਦੇ ਹਨ। ਪਰ ਸਾਡਾ ਆਪਣਾ ਮਨ ਕਦੇ ਸ਼ਾਂਤ ਨਹੀਂ ਹੁੰਦਾ। ਦੱਸੋ ਸਾਡੀ ਕੀ ਭੁੱਲ ਹੈ।'","ਗੁਰੂ ਜੀ ਨੇ ਪਿਆਰ ਨਾਲ ਕਿਹਾ, 'ਤੁਸੀਂ ਦੂਜਿਆਂ ਨੂੰ ਗੁਰੂ ਦੇ ਬਚਨ ਬਹੁਤ ਸੋਹਣੇ ਢੰਗ ਨਾਲ ਸਮਝਾਉਂਦੇ ਹੋ। ਪਰ ਆਪਣਾ ਜੀਵਨ ਉਨ੍ਹਾਂ ਬਚਨਾਂ ਅਨੁਸਾਰ ਨਹੀਂ ਢਾਲਦੇ। ਜਦੋਂ ਲੋਕ ਪੈਸੇ ਦਿੰਦੇ ਹਨ, ਤੁਸੀਂ ਭੁੱਲ ਜਾਂਦੇ ਹੋ ਕਿ ਇਹ ਉਪਦੇਸ਼ ਤੁਹਾਡੇ ਲਈ ਵੀ ਹੈ।'","ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਸੱਚਾ ਸਿਮਰਨ ਗੁਰੂ ਦੇ ਉਪਦੇਸ਼ ਉੱਤੇ ਚੱਲਣਾ ਹੈ, ਸਿਰਫ਼ ਉਸ ਦੀਆਂ ਗੱਲਾਂ ਕਰਨਾ ਨਹੀਂ। ਜਦੋਂ ਤੁਹਾਡੀ ਕਰਨੀ ਤੁਹਾਡੀ ਕਹਿਣੀ ਵਰਗੀ ਹੋ ਜਾਵੇਗੀ, ਮਨ ਨੂੰ ਸ਼ਾਂਤੀ ਮਿਲ ਜਾਵੇਗੀ।'","ਭਾਈ ਬਾਲਾ ਅਤੇ ਭਾਈ ਕ੍ਰਿਸ਼ਨਾ ਨੇ ਇਹ ਸਿੱਖਿਆ ਦਿਲ ਵਿੱਚ ਵਸਾ ਲਈ। ਉਹ ਜੋ ਸਿਖਾਉਂਦੇ ਸਨ ਉਸ ਉੱਤੇ ਆਪ ਚੱਲਣ ਲੱਗੇ, ਅਤੇ ਸੰਗਤ ਨੂੰ ਵੀ ਇਹੀ ਕਰਨ ਲਈ ਕਹਿੰਦੇ। ਹੌਲੀ-ਹੌਲੀ ਉਨ੍ਹਾਂ ਨੂੰ ਉਹ ਸ਼ਾਂਤੀ ਮਿਲ ਗਈ ਜਿਸ ਦੀ ਭਾਲ ਸੀ।"],l:"ਚੰਗੇ ਬਚਨ ਜਾਣਨੇ ਜਾਂ ਦੂਜਿਆਂ ਨੂੰ ਸੁਣਾਉਣੇ ਕਾਫ਼ੀ ਨਹੀਂ। ਸ਼ਾਂਤੀ ਉਦੋਂ ਮਿਲਦੀ ਹੈ ਜਦੋਂ ਅਸੀਂ ਆਪ ਉਨ੍ਹਾਂ ਉੱਤੇ ਚੱਲੀਏ।"}},

{id:"bhai-kalyana",title:"Bhai Kalyana in Mandi",gur:"ਭਾਈ ਕਲਿਆਣਾ",cat:"Guru Arjan Dev Ji",age:"Kids",where:"Mandi, in the hills",mins:3,c:"#2FA45A",c2:"#F0702A",h:400,art:"palace",
year:1600,approx:1,loc:["mandi","amritsar"],themes:["Courage","Faith"],
summary:"The Raja of Mandi orders everyone to fast. A Sikh visiting from Amritsar eats his meal as usual, and is arrested.",
text:["Amritsar was growing fast, and lots of timber was needed to build new houses. Guru Arjan Dev Ji sent Bhai Kalyana to the hill state of Mandi to buy wood, and to share Guru Nanak's message there.","Bhai Kalyana was staying at an inn when a drummer marched through the streets announcing, 'Tomorrow is Janmashtami! By order of the Raja, everyone must fast. Anyone who disobeys will be punished.'","Bhai Kalyana heard the order, but the next day he ate his meals as usual. The Raja's men found out, tied his hands, and brought him to the palace. 'Why did you disobey my order?' the Raja demanded.","Bhai Kalyana answered without fear. 'Raja, I follow my Guru's teachings. My Guru says that every day is equally holy. God is not pleased by going hungry on one special day, but by remembering Him and living truthfully every day. And nobody should be forced in matters of faith.'","The Raja listened carefully. He had never heard anyone speak so calmly and honestly. He set Bhai Kalyana free, helped him get the timber for Amritsar, and decided to go and meet Guru Arjan Dev Ji himself."],
lesson:"True faith comes from the heart, not from orders or force. We should stand calmly by what we believe, and respect others' freedom too.",
think:["Why wasn't Bhai Kalyana afraid of the Raja?","Why is it wrong to force someone in matters of faith?"],
words:[["Fast","To go without food for religious reasons."],["Timber","Wood used for building."],["Raja","A king or ruler."]],
quiz:[["Why did Guru Ji send Bhai Kalyana to Mandi?",["To buy timber and share Guru Nanak's message","To fight a battle","To find a doctor"],0],["What did the Raja order everyone to do?",["Fast for a day","Sing all night","Leave the town"],0],["What did the Raja decide to do in the end?",["Meet Guru Arjan Dev Ji","Punish everyone","Build a fort"],0]],
pa:{t:["ਅੰਮ੍ਰਿਤਸਰ ਤੇਜ਼ੀ ਨਾਲ ਵਧ ਰਿਹਾ ਸੀ ਅਤੇ ਨਵੇਂ ਘਰ ਬਣਾਉਣ ਲਈ ਬਹੁਤ ਲੱਕੜ ਚਾਹੀਦੀ ਸੀ। ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਨੇ ਭਾਈ ਕਲਿਆਣਾ ਜੀ ਨੂੰ ਪਹਾੜੀ ਰਿਆਸਤ ਮੰਡੀ ਵਿੱਚ ਲੱਕੜ ਖ਼ਰੀਦਣ ਅਤੇ ਉੱਥੇ ਗੁਰੂ ਨਾਨਕ ਦਾ ਸੁਨੇਹਾ ਪਹੁੰਚਾਉਣ ਲਈ ਭੇਜਿਆ।","ਭਾਈ ਕਲਿਆਣਾ ਜੀ ਇੱਕ ਸਰਾਂ ਵਿੱਚ ਠਹਿਰੇ ਹੋਏ ਸਨ ਕਿ ਇੱਕ ਢੋਲੀ ਗਲੀਆਂ ਵਿੱਚ ਹੋਕਾ ਦਿੰਦਾ ਲੰਘਿਆ, 'ਕੱਲ੍ਹ ਜਨਮ ਅਸ਼ਟਮੀ ਹੈ! ਰਾਜੇ ਦਾ ਹੁਕਮ ਹੈ ਕਿ ਹਰ ਕੋਈ ਵਰਤ ਰੱਖੇ। ਹੁਕਮ ਨਾ ਮੰਨਣ ਵਾਲੇ ਨੂੰ ਸਜ਼ਾ ਮਿਲੇਗੀ।'","ਭਾਈ ਕਲਿਆਣਾ ਜੀ ਨੇ ਹੁਕਮ ਸੁਣਿਆ, ਪਰ ਅਗਲੇ ਦਿਨ ਰੋਜ਼ ਵਾਂਗ ਭੋਜਨ ਛਕਿਆ। ਰਾਜੇ ਦੇ ਬੰਦਿਆਂ ਨੂੰ ਪਤਾ ਲੱਗ ਗਿਆ, ਉਨ੍ਹਾਂ ਨੇ ਉਨ੍ਹਾਂ ਦੇ ਹੱਥ ਬੰਨ੍ਹੇ ਅਤੇ ਮਹਿਲ ਵਿੱਚ ਲੈ ਆਏ। ਰਾਜੇ ਨੇ ਪੁੱਛਿਆ, 'ਤੂੰ ਮੇਰਾ ਹੁਕਮ ਕਿਉਂ ਨਹੀਂ ਮੰਨਿਆ?'","ਭਾਈ ਕਲਿਆਣਾ ਜੀ ਨੇ ਨਿਡਰ ਹੋ ਕੇ ਜਵਾਬ ਦਿੱਤਾ, 'ਰਾਜਾ ਜੀ, ਮੈਂ ਆਪਣੇ ਗੁਰੂ ਦੀ ਸਿੱਖਿਆ ਉੱਤੇ ਚੱਲਦਾ ਹਾਂ। ਮੇਰੇ ਗੁਰੂ ਕਹਿੰਦੇ ਹਨ ਕਿ ਹਰ ਦਿਨ ਇੱਕੋ ਜਿਹਾ ਪਵਿੱਤਰ ਹੈ। ਰੱਬ ਕਿਸੇ ਖ਼ਾਸ ਦਿਨ ਭੁੱਖੇ ਰਹਿਣ ਨਾਲ ਨਹੀਂ, ਸਗੋਂ ਹਰ ਰੋਜ਼ ਉਸ ਨੂੰ ਯਾਦ ਕਰਨ ਅਤੇ ਸੱਚਾ ਜੀਵਨ ਜੀਣ ਨਾਲ ਖ਼ੁਸ਼ ਹੁੰਦਾ ਹੈ। ਅਤੇ ਧਰਮ ਦੇ ਮਾਮਲੇ ਵਿੱਚ ਕਿਸੇ ਨਾਲ ਜ਼ਬਰਦਸਤੀ ਨਹੀਂ ਹੋਣੀ ਚਾਹੀਦੀ।'","ਰਾਜੇ ਨੇ ਧਿਆਨ ਨਾਲ ਸੁਣਿਆ। ਉਸ ਨੇ ਕਦੇ ਕਿਸੇ ਨੂੰ ਇੰਨੀ ਸ਼ਾਂਤੀ ਅਤੇ ਸੱਚਾਈ ਨਾਲ ਬੋਲਦਿਆਂ ਨਹੀਂ ਸੁਣਿਆ ਸੀ। ਉਸ ਨੇ ਭਾਈ ਕਲਿਆਣਾ ਜੀ ਨੂੰ ਛੱਡ ਦਿੱਤਾ, ਅੰਮ੍ਰਿਤਸਰ ਲਈ ਲੱਕੜ ਦਿਵਾਉਣ ਵਿੱਚ ਮਦਦ ਕੀਤੀ, ਅਤੇ ਆਪ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਨੂੰ ਮਿਲਣ ਦਾ ਫ਼ੈਸਲਾ ਕੀਤਾ।"],l:"ਸੱਚਾ ਧਰਮ ਦਿਲ ਵਿੱਚੋਂ ਆਉਂਦਾ ਹੈ, ਹੁਕਮ ਜਾਂ ਜ਼ਬਰਦਸਤੀ ਨਾਲ ਨਹੀਂ। ਆਪਣੇ ਵਿਸ਼ਵਾਸ ਉੱਤੇ ਸ਼ਾਂਤੀ ਨਾਲ ਖੜ੍ਹੇ ਰਹੋ, ਅਤੇ ਦੂਜਿਆਂ ਦੀ ਆਜ਼ਾਦੀ ਦਾ ਵੀ ਸਤਿਕਾਰ ਕਰੋ।"}},

{id:"raja-of-mandi",title:"The Raja's Strange Dream",gur:"ਸਾਧਸੰਗਤ ਦਾ ਫਲ",cat:"Guru Arjan Dev Ji",age:"Kids",where:"Amritsar",mins:3,c:"#8E3FB8",c2:"#1FA38A",h:395,art:"stars",
year:1600,approx:1,loc:["amritsar"],themes:["Faith"],
summary:"The Raja of Mandi wonders: if our fate is already written, why come to the Guru at all? A dream gives him his answer.",
text:["After meeting Bhai Kalyana, Raja Hari Sen of Mandi came to Amritsar to meet Guru Arjan Dev Ji. At the morning kirtan, the musicians were singing a shabad that said what God has written for us cannot be erased.","A doubt came into the Raja's mind. 'If our fate cannot be changed,' he thought, 'what is the use of coming to the Guru's sangat?' After the kirtan, he asked Guru Ji. Guru Ji smiled and said, 'Stay with us for a few days, and your doubt will be answered.'","That night the Raja had a strange dream. He dreamed that he was born into a poor family, grew up, did hard work, married and had children. One day, while cutting wood high up in a tree, he fell and died. Then he woke up.","The next afternoon, the Raja went hunting and got separated from his friends. He rode into a village, and stopped in shock. It was the village from his dream, and there was the very same tree! Some children ran up to him. 'Father! You fell from that tree. How are you alive?' At that moment Guru Ji arrived and gently told the children, 'This is Raja Hari Sen of Mandi. He only looks like your father.'","The Raja understood. Guru Ji explained, 'The hard things written in your fate were meant to happen. But because you came into the company of the Guru and the sangat, you lived them only in a dream.' The Raja bowed in thanks, and went home with a peaceful heart."],
lesson:"Being in good company, with the Guru and the sangat, makes life's hardest troubles lighter.",
think:["What was the Raja's doubt?","How does being with good people help us through hard times?"],
words:[["Sangat","The community of people who gather together."],["Fate","What is going to happen in someone's life."]],
quiz:[["What doubt did the Raja have?",["Why come to the Guru if fate can't be changed?","Where to buy timber","How to win a battle"],0],["What happened in the Raja's dream?",["He was born poor and fell from a tree","He became an emperor","He flew in the sky"],0],["What did Guru Ji say the sangat had done?",["Made the troubles happen only in a dream","Made him rich","Made him forget everything"],0]],
pa:{t:["ਭਾਈ ਕਲਿਆਣਾ ਜੀ ਨੂੰ ਮਿਲਣ ਤੋਂ ਬਾਅਦ ਮੰਡੀ ਦਾ ਰਾਜਾ ਹਰੀ ਸੇਨ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਨੂੰ ਮਿਲਣ ਅੰਮ੍ਰਿਤਸਰ ਆਇਆ। ਸਵੇਰ ਦੇ ਕੀਰਤਨ ਵਿੱਚ ਰਾਗੀ ਅਜਿਹਾ ਸ਼ਬਦ ਗਾ ਰਹੇ ਸਨ ਜਿਸ ਦਾ ਭਾਵ ਸੀ ਕਿ ਰੱਬ ਦਾ ਲਿਖਿਆ ਲੇਖ ਮਿਟ ਨਹੀਂ ਸਕਦਾ।","ਰਾਜੇ ਦੇ ਮਨ ਵਿੱਚ ਸ਼ੰਕਾ ਉੱਠੀ, 'ਜੇ ਲੇਖ ਬਦਲ ਨਹੀਂ ਸਕਦਾ, ਤਾਂ ਗੁਰੂ ਦੀ ਸੰਗਤ ਵਿੱਚ ਆਉਣ ਦਾ ਕੀ ਲਾਭ?' ਕੀਰਤਨ ਤੋਂ ਬਾਅਦ ਉਸ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਪੁੱਛਿਆ। ਗੁਰੂ ਜੀ ਨੇ ਮੁਸਕਰਾ ਕੇ ਕਿਹਾ, 'ਕੁਝ ਦਿਨ ਸਾਡੇ ਕੋਲ ਰਹੋ, ਤੁਹਾਡੀ ਸ਼ੰਕਾ ਦੂਰ ਹੋ ਜਾਵੇਗੀ।'","ਉਸ ਰਾਤ ਰਾਜੇ ਨੂੰ ਇੱਕ ਅਜੀਬ ਸੁਪਨਾ ਆਇਆ। ਉਸ ਨੇ ਵੇਖਿਆ ਕਿ ਉਹ ਇੱਕ ਗਰੀਬ ਘਰ ਵਿੱਚ ਜੰਮਿਆ, ਵੱਡਾ ਹੋਇਆ, ਸਖ਼ਤ ਮਿਹਨਤ ਕੀਤੀ, ਵਿਆਹ ਕਰਾਇਆ ਅਤੇ ਬੱਚੇ ਹੋਏ। ਇੱਕ ਦਿਨ ਉੱਚੇ ਰੁੱਖ ਉੱਤੇ ਲੱਕੜ ਕੱਟਦਿਆਂ ਉਹ ਡਿੱਗ ਪਿਆ ਅਤੇ ਮਰ ਗਿਆ। ਫਿਰ ਉਸ ਦੀ ਅੱਖ ਖੁੱਲ੍ਹ ਗਈ।","ਅਗਲੀ ਦੁਪਹਿਰ ਰਾਜਾ ਸ਼ਿਕਾਰ ਖੇਡਣ ਗਿਆ ਅਤੇ ਸਾਥੀਆਂ ਤੋਂ ਵਿੱਛੜ ਗਿਆ। ਉਹ ਇੱਕ ਪਿੰਡ ਪਹੁੰਚਿਆ ਅਤੇ ਹੈਰਾਨ ਰਹਿ ਗਿਆ। ਇਹ ਸੁਪਨੇ ਵਾਲਾ ਪਿੰਡ ਸੀ, ਅਤੇ ਉਹੀ ਰੁੱਖ ਸਾਹਮਣੇ ਸੀ! ਕੁਝ ਬੱਚੇ ਦੌੜ ਕੇ ਆਏ, 'ਬਾਪੂ ਜੀ! ਤੁਸੀਂ ਤਾਂ ਉਸ ਰੁੱਖ ਤੋਂ ਡਿੱਗ ਪਏ ਸੀ। ਤੁਸੀਂ ਜਿਉਂਦੇ ਕਿਵੇਂ ਹੋ?' ਉਸੇ ਵੇਲੇ ਗੁਰੂ ਜੀ ਆ ਪਹੁੰਚੇ ਅਤੇ ਬੱਚਿਆਂ ਨੂੰ ਪਿਆਰ ਨਾਲ ਦੱਸਿਆ, 'ਇਹ ਮੰਡੀ ਦੇ ਰਾਜਾ ਹਰੀ ਸੇਨ ਹਨ। ਇਨ੍ਹਾਂ ਦੀ ਸ਼ਕਲ ਤੁਹਾਡੇ ਪਿਤਾ ਨਾਲ ਮਿਲਦੀ ਹੈ।'","ਰਾਜਾ ਸਮਝ ਗਿਆ। ਗੁਰੂ ਜੀ ਨੇ ਸਮਝਾਇਆ, 'ਤੁਹਾਡੇ ਲੇਖਾਂ ਵਿੱਚ ਲਿਖੇ ਔਖੇ ਦਿਨ ਆਉਣੇ ਹੀ ਸਨ। ਪਰ ਕਿਉਂਕਿ ਤੁਸੀਂ ਗੁਰੂ ਅਤੇ ਸੰਗਤ ਦੀ ਸ਼ਰਨ ਆਏ, ਉਹ ਸਿਰਫ਼ ਸੁਪਨੇ ਵਿੱਚ ਹੀ ਭੁਗਤੇ ਗਏ।' ਰਾਜੇ ਨੇ ਧੰਨਵਾਦ ਵਿੱਚ ਸਿਰ ਝੁਕਾਇਆ ਅਤੇ ਸ਼ਾਂਤ ਮਨ ਨਾਲ ਘਰ ਮੁੜ ਗਿਆ।"],l:"ਗੁਰੂ ਅਤੇ ਸੰਗਤ ਦੀ ਚੰਗੀ ਸੰਗਤ ਜੀਵਨ ਦੇ ਸਭ ਤੋਂ ਔਖੇ ਦੁੱਖਾਂ ਨੂੰ ਵੀ ਹੌਲਾ ਕਰ ਦਿੰਦੀ ਹੈ।"}},

{id:"tarn-taran",title:"The Healing Pool of Tarn Taran",gur:"ਤਰਨ ਤਾਰਨ",cat:"Guru Arjan Dev Ji",age:"Kids",where:"Tarn Taran",mins:2,c:"#1590B0",c2:"#F2B229",h:400,art:"sarovar",
year:1590,loc:["tarntaran"],themes:["Sewa","Equality"],
summary:"Guru Arjan Dev Ji is building a great pool. Five men walk past carrying a sick old man to throw into the river.",
text:["On his travels, Guru Arjan Dev Ji came to a peaceful place near the village of Khara, with cool breezes and a small pond. He loved it so much that he bought the land and decided to build a new town there. In 1590 he laid the foundation, and work began on a huge sarovar, a holy pool.","One morning, Guru Ji was standing by the pool when five men walked past, carrying an old man on a cot. The old man was crying out loudly. 'What's the matter with him?' Guru Ji asked.","'He is the headman of our village,' they said. 'He has had leprosy for many years. Every treatment has failed. He's in such pain that he has asked us to throw him into the river Beas.'","Guru Ji said, 'Don't throw him in the river. Bathe him here in this pool, and let him listen to the kirtan, morning and evening.' They did as Guru Ji said. Day by day, the old man grew better, until he was completely well.","Guru Ji named the town Tarn Taran, which means 'the boat that carries you across'. He also built a home there to care for people with leprosy, at a time when most people pushed them away. That caring work continued there for hundreds of years."],
lesson:"Nobody should be thrown away or given up on. Caring for the sick is a precious kind of sewa.",
think:["Why had the old man given up hope?","Why do you think Guru Ji built a home for people with leprosy?"],
words:[["Sarovar","A holy pool at a Gurdwara."],["Tarn Taran","The town Guru Arjan Dev Ji founded; its name means 'the boat that carries you across'."]],
quiz:[["What was Guru Ji building at Tarn Taran?",["A huge holy pool","A fort","A palace"],0],["Where were the men taking the sick old man?",["To throw him in the river","To a doctor","To his home"],0],["What else did Guru Ji build at Tarn Taran?",["A home for people with leprosy","A market","A school for soldiers"],0]],
pa:{t:["ਯਾਤਰਾ ਦੌਰਾਨ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਪਿੰਡ ਖਾਰਾ ਨੇੜੇ ਇੱਕ ਸੁਹਾਵਣੀ ਥਾਂ ਪਹੁੰਚੇ, ਜਿੱਥੇ ਠੰਢੀ ਹਵਾ ਚੱਲਦੀ ਸੀ ਅਤੇ ਇੱਕ ਛੋਟੀ ਢਾਬ ਸੀ। ਉਨ੍ਹਾਂ ਨੂੰ ਇਹ ਥਾਂ ਇੰਨੀ ਪਸੰਦ ਆਈ ਕਿ ਉਨ੍ਹਾਂ ਨੇ ਜ਼ਮੀਨ ਖ਼ਰੀਦ ਕੇ ਉੱਥੇ ਨਵਾਂ ਨਗਰ ਵਸਾਉਣ ਦਾ ਫ਼ੈਸਲਾ ਕੀਤਾ। 1590 ਵਿੱਚ ਉਨ੍ਹਾਂ ਨੇ ਨੀਂਹ ਰੱਖੀ, ਅਤੇ ਇੱਕ ਵੱਡੇ ਸਰੋਵਰ ਦਾ ਕੰਮ ਸ਼ੁਰੂ ਹੋਇਆ।","ਇੱਕ ਸਵੇਰ ਗੁਰੂ ਜੀ ਸਰੋਵਰ ਕੰਢੇ ਖੜ੍ਹੇ ਸਨ ਕਿ ਪੰਜ ਆਦਮੀ ਇੱਕ ਬਜ਼ੁਰਗ ਨੂੰ ਮੰਜੀ ਉੱਤੇ ਚੁੱਕੀ ਲੰਘੇ। ਬਜ਼ੁਰਗ ਉੱਚੀ-ਉੱਚੀ ਕੁਰਲਾ ਰਿਹਾ ਸੀ। ਗੁਰੂ ਜੀ ਨੇ ਪੁੱਛਿਆ, 'ਇਸ ਨੂੰ ਕੀ ਹੋਇਆ ਹੈ?'","ਉਨ੍ਹਾਂ ਨੇ ਦੱਸਿਆ, 'ਇਹ ਸਾਡੇ ਪਿੰਡ ਦਾ ਚੌਧਰੀ ਹੈ। ਕਈ ਸਾਲਾਂ ਤੋਂ ਇਸ ਨੂੰ ਕੋੜ੍ਹ ਹੈ। ਹਰ ਇਲਾਜ ਫ਼ੇਲ੍ਹ ਹੋ ਗਿਆ ਹੈ। ਇਹ ਇੰਨੀ ਤਕਲੀਫ਼ ਵਿੱਚ ਹੈ ਕਿ ਇਸ ਨੇ ਆਪ ਸਾਨੂੰ ਬਿਆਸ ਦਰਿਆ ਵਿੱਚ ਸੁੱਟਣ ਲਈ ਕਿਹਾ ਹੈ।'","ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਇਸ ਨੂੰ ਦਰਿਆ ਵਿੱਚ ਨਾ ਸੁੱਟੋ। ਇਸ ਨੂੰ ਇਸ ਸਰੋਵਰ ਵਿੱਚ ਇਸ਼ਨਾਨ ਕਰਾਓ ਅਤੇ ਸਵੇਰੇ-ਸ਼ਾਮ ਕੀਰਤਨ ਸੁਣਾਓ।' ਉਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਜੀ ਦਾ ਕਿਹਾ ਮੰਨਿਆ। ਦਿਨੋਂ-ਦਿਨ ਬਜ਼ੁਰਗ ਠੀਕ ਹੁੰਦਾ ਗਿਆ, ਅਤੇ ਅਖ਼ੀਰ ਪੂਰੀ ਤਰ੍ਹਾਂ ਤੰਦਰੁਸਤ ਹੋ ਗਿਆ।","ਗੁਰੂ ਜੀ ਨੇ ਨਗਰ ਦਾ ਨਾਂ ਤਰਨ ਤਾਰਨ ਰੱਖਿਆ, ਭਾਵ 'ਪਾਰ ਲੰਘਾਉਣ ਵਾਲੀ ਬੇੜੀ'। ਉਨ੍ਹਾਂ ਨੇ ਉੱਥੇ ਕੋੜ੍ਹ ਦੇ ਰੋਗੀਆਂ ਦੀ ਸੰਭਾਲ ਲਈ ਇੱਕ ਘਰ ਵੀ ਬਣਾਇਆ, ਉਸ ਸਮੇਂ ਜਦੋਂ ਬਹੁਤੇ ਲੋਕ ਉਨ੍ਹਾਂ ਨੂੰ ਦੁਰਕਾਰ ਦਿੰਦੇ ਸਨ। ਇਹ ਸੇਵਾ ਉੱਥੇ ਸੈਂਕੜੇ ਸਾਲ ਚੱਲਦੀ ਰਹੀ।"],l:"ਕਿਸੇ ਨੂੰ ਦੁਰਕਾਰਨਾ ਜਾਂ ਉਸ ਤੋਂ ਆਸ ਛੱਡਣੀ ਨਹੀਂ ਚਾਹੀਦੀ। ਬਿਮਾਰਾਂ ਦੀ ਸੰਭਾਲ ਇੱਕ ਅਨਮੋਲ ਸੇਵਾ ਹੈ।"}},

{id:"baba-budha-blessing",title:"Mata Ganga Ji's Missi Roti",gur:"ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਦੀ ਅਸੀਸ",cat:"Guru Arjan Dev Ji",age:"Kids",where:"Baba Budha Ji's farm, near Amritsar",mins:3,c:"#F0702A",c2:"#2FA45A",h:400,art:"langar",
year:1594,approx:1,loc:["amritsar"],themes:["Humility","Sewa"],
summary:"Mata Ganga Ji rides in a fine chariot to ask Baba Budha Ji for a blessing. She comes home disappointed, until she tries again a different way.",
text:["Guru Arjan Dev Ji and Mata Ganga Ji had been married for many years, but they had no children. One day Mata Ganga Ji asked Guru Ji for the blessing of a son. Guru Ji said, 'Go and ask Baba Budha Ji, a true and devoted Sikh. God will bless you through him.'","The next morning, Mata Ganga Ji set off in a grand chariot with her maids, carrying rich dishes. At his farm, Baba Budha Ji saw a cloud of dust and heard the rattle of wheels. 'Who is rushing here in such a hurry?' he asked. 'It's Mata Ganga Ji,' said the workers. Baba Ji said, 'What trouble has made the Guru's family come running like this?' Mata Ji felt hurt, and went home without the blessing she had hoped for.","Guru Ji listened and said gently, 'When we go to ask something of a holy person, we must leave our grandeur behind and go humbly.'","So Mata Ganga Ji ground the flour herself and made simple missi roti with her own hands. She took some lassi and onions, put everything on her head, and walked all the way to the farm on foot.","Baba Budha Ji was overjoyed. He ate the simple meal with love, and as he ate, he crushed an onion in his fist and said, 'You will have a son who will be a brave warrior. He will crush the pride of cruel people, just like this onion.' Soon afterwards, in 1595, Mata Ganga Ji gave birth to a son. He became Guru Hargobind Sahib Ji, the sixth Guru, who carried two swords."],
lesson:"Humility opens doors that pride keeps shut. When we ask for something, we should ask with a humble heart.",
think:["Why did Baba Budha Ji not give his blessing the first time?","What changed the second time?"],
words:[["Missi roti","A simple flatbread made with gram flour."],["Lassi","A drink made from yoghurt."],["Baba Budha Ji","A greatly respected Sikh who knew the first six Gurus."]],
quiz:[["How did Mata Ganga Ji travel the first time?",["In a grand chariot","On foot","By boat"],0],["What did she make with her own hands the second time?",["Missi roti","A cake","A quilt"],0],["Who was the son that was born?",["Guru Hargobind Sahib Ji","Guru Har Rai Sahib Ji","Baba Gurditta Ji"],0]],
pa:{t:["ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਅਤੇ ਮਾਤਾ ਗੰਗਾ ਜੀ ਦੇ ਵਿਆਹ ਨੂੰ ਕਈ ਸਾਲ ਹੋ ਗਏ ਸਨ, ਪਰ ਕੋਈ ਸੰਤਾਨ ਨਹੀਂ ਸੀ। ਇੱਕ ਦਿਨ ਮਾਤਾ ਗੰਗਾ ਜੀ ਨੇ ਗੁਰੂ ਜੀ ਤੋਂ ਪੁੱਤਰ ਦੀ ਦਾਤ ਮੰਗੀ। ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਬਾਬਾ ਬੁੱਢਾ ਜੀ, ਜੋ ਸੱਚੇ ਅਤੇ ਸ਼ਰਧਾਵਾਨ ਸਿੱਖ ਹਨ, ਕੋਲ ਜਾ ਕੇ ਮੰਗੋ। ਰੱਬ ਉਨ੍ਹਾਂ ਰਾਹੀਂ ਤੁਹਾਨੂੰ ਬਖ਼ਸ਼ੇਗਾ।'","ਅਗਲੀ ਸਵੇਰ ਮਾਤਾ ਗੰਗਾ ਜੀ ਸ਼ਾਨਦਾਰ ਰਥ ਵਿੱਚ ਦਾਸੀਆਂ ਨਾਲ, ਕੀਮਤੀ ਪਕਵਾਨ ਲੈ ਕੇ ਤੁਰੇ। ਆਪਣੇ ਖੇਤ ਵਿੱਚ ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਨੇ ਧੂੜ ਉੱਡਦੀ ਵੇਖੀ ਅਤੇ ਪਹੀਆਂ ਦਾ ਖੜਕਾ ਸੁਣਿਆ। ਉਨ੍ਹਾਂ ਪੁੱਛਿਆ, 'ਇੰਨੀ ਕਾਹਲੀ ਵਿੱਚ ਕੌਣ ਆ ਰਿਹਾ ਹੈ?' ਕਾਮਿਆਂ ਨੇ ਕਿਹਾ, 'ਮਾਤਾ ਗੰਗਾ ਜੀ ਹਨ।' ਬਾਬਾ ਜੀ ਨੇ ਕਿਹਾ, 'ਗੁਰੂ ਘਰ ਨੂੰ ਕਿਹੜੀ ਭਾਜੜ ਪੈ ਗਈ?' ਮਾਤਾ ਜੀ ਦਾ ਮਨ ਦੁਖੀ ਹੋਇਆ, ਅਤੇ ਉਹ ਜਿਸ ਅਸੀਸ ਦੀ ਆਸ ਲੈ ਕੇ ਗਏ ਸਨ, ਉਸ ਤੋਂ ਬਿਨਾਂ ਘਰ ਮੁੜ ਆਏ।","ਗੁਰੂ ਜੀ ਨੇ ਗੱਲ ਸੁਣ ਕੇ ਨਰਮੀ ਨਾਲ ਕਿਹਾ, 'ਜਦੋਂ ਅਸੀਂ ਕਿਸੇ ਸੰਤ ਕੋਲੋਂ ਕੁਝ ਮੰਗਣ ਜਾਈਏ, ਤਾਂ ਸ਼ਾਨ-ਸ਼ੌਕਤ ਪਿੱਛੇ ਛੱਡ ਕੇ ਨਿਮਰਤਾ ਨਾਲ ਜਾਣਾ ਚਾਹੀਦਾ ਹੈ।'","ਇਸ ਲਈ ਮਾਤਾ ਗੰਗਾ ਜੀ ਨੇ ਆਪ ਆਟਾ ਪੀਸਿਆ ਅਤੇ ਆਪਣੇ ਹੱਥਾਂ ਨਾਲ ਸਾਦੀ ਮਿੱਸੀ ਰੋਟੀ ਪਕਾਈ। ਉਨ੍ਹਾਂ ਨੇ ਲੱਸੀ ਅਤੇ ਗੰਢੇ ਲਏ, ਸਭ ਕੁਝ ਸਿਰ ਉੱਤੇ ਰੱਖਿਆ, ਅਤੇ ਪੈਦਲ ਖੇਤ ਤੱਕ ਗਏ।","ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਬਹੁਤ ਖ਼ੁਸ਼ ਹੋਏ। ਉਨ੍ਹਾਂ ਨੇ ਪਿਆਰ ਨਾਲ ਸਾਦਾ ਭੋਜਨ ਛਕਿਆ, ਅਤੇ ਛਕਦਿਆਂ ਮੁੱਠੀ ਵਿੱਚ ਗੰਢਾ ਭੰਨ ਕੇ ਕਿਹਾ, 'ਤੁਹਾਡੇ ਘਰ ਇੱਕ ਸੂਰਮਾ ਪੁੱਤਰ ਜੰਮੇਗਾ। ਉਹ ਜ਼ਾਲਮਾਂ ਦਾ ਹੰਕਾਰ ਇਸ ਗੰਢੇ ਵਾਂਗ ਭੰਨੇਗਾ।' ਛੇਤੀ ਹੀ, 1595 ਵਿੱਚ, ਮਾਤਾ ਗੰਗਾ ਜੀ ਦੇ ਘਰ ਪੁੱਤਰ ਨੇ ਜਨਮ ਲਿਆ। ਉਹ ਛੇਵੇਂ ਗੁਰੂ, ਦੋ ਤਲਵਾਰਾਂ ਧਾਰਨ ਕਰਨ ਵਾਲੇ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਬਣੇ।"],l:"ਨਿਮਰਤਾ ਉਹ ਦਰਵਾਜ਼ੇ ਖੋਲ੍ਹ ਦਿੰਦੀ ਹੈ ਜੋ ਹੰਕਾਰ ਬੰਦ ਰੱਖਦਾ ਹੈ। ਕੁਝ ਮੰਗਣਾ ਹੋਵੇ ਤਾਂ ਨਿਮਰ ਦਿਲ ਨਾਲ ਮੰਗੋ।"}},

{id:"little-hargobind-safe",title:"Little Hargobind Is Kept Safe",gur:"ਲੇਪੁ ਨ ਲਾਗੋ ਤਿਲ ਕਾ ਮੂਲਿ",cat:"Guru Arjan Dev Ji",age:"Kids",where:"Guru Ki Wadali, near Amritsar",mins:3,c:"#3B5BDB",c2:"#F2B229",h:395,art:"hands",
year:1597,approx:1,loc:["amritsar"],themes:["Faith","Courage"],
summary:"Guru Arjan Dev Ji's jealous elder brother wants his own son to be the next Guru. He tries to harm baby Hargobind, but every plan fails.",
text:["Prithi Chand was Guru Arjan Dev Ji's elder brother. He had always believed he should be the Guru, and he was bitterly disappointed when his younger brother was chosen instead. When Guru Arjan Dev Ji had no children for many years, Prithi Chand hoped that his own son would become the next Guru.","So when baby Hargobind was born, Prithi Chand was not happy at all. He did not even come to congratulate his brother. Jealousy filled his heart, and he began to plan ways to harm the child.","First he paid a servant to feed the little boy yoghurt with poison in it. But Hargobind refused to eat it and screamed until his mother, Mata Ganga Ji, came running. The plan failed, and the servant confessed that Prithi Chand had sent him.","Later, when Hargobind was about five, Prithi Chand gave a playmate two pockets of sweets, one of them poisoned, hoping the sweets would reach Hargobind. But that plan went wrong too, and it was the people who made the plan who were harmed by it. Everyone in the village learned what Prithi Chand had done, and he had to leave in shame.","Guru Arjan Dev Ji brought his son to live safely with him in Amritsar. He sang a shabad thanking God: Lep na lago til ka mool. 'Not even the smallest harm came to him.' Little Hargobind grew up strong and brave, and became the sixth Guru."],
lesson:"Jealousy can make people do terrible things. Those who are protected by God and live with truth are kept safe.",
think:["What made Prithi Chand so jealous?","How can we stop jealousy from growing in our hearts?"],
words:[["Jealousy","Being unhappy because someone else has something you want."],["Shabad","A hymn of Gurbani."]],
quiz:[["Who was Prithi Chand?",["Guru Arjan Dev Ji's elder brother","A king","A musician"],0],["Who came running when little Hargobind screamed?",["His mother, Mata Ganga Ji","Baba Budha Ji","A soldier"],0],["What did Guru Ji do after these attempts?",["Thanked God in a shabad and kept his son close","Ran away","Gave up being Guru"],0]],
pa:{t:["ਪ੍ਰਿਥੀ ਚੰਦ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਦਾ ਵੱਡਾ ਭਰਾ ਸੀ। ਉਹ ਹਮੇਸ਼ਾ ਮੰਨਦਾ ਸੀ ਕਿ ਗੁਰਗੱਦੀ ਉਸ ਨੂੰ ਮਿਲਣੀ ਚਾਹੀਦੀ ਹੈ, ਅਤੇ ਜਦੋਂ ਛੋਟੇ ਭਰਾ ਨੂੰ ਗੁਰੂ ਥਾਪਿਆ ਗਿਆ ਤਾਂ ਉਹ ਬਹੁਤ ਨਿਰਾਸ਼ ਹੋਇਆ। ਜਦੋਂ ਕਈ ਸਾਲ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਦੇ ਘਰ ਕੋਈ ਸੰਤਾਨ ਨਾ ਹੋਈ, ਪ੍ਰਿਥੀ ਚੰਦ ਨੂੰ ਆਸ ਬੱਝੀ ਕਿ ਉਸ ਦਾ ਆਪਣਾ ਪੁੱਤਰ ਅਗਲਾ ਗੁਰੂ ਬਣੇਗਾ।","ਇਸ ਲਈ ਜਦੋਂ ਬਾਲ ਹਰਿਗੋਬਿੰਦ ਦਾ ਜਨਮ ਹੋਇਆ, ਪ੍ਰਿਥੀ ਚੰਦ ਬਿਲਕੁਲ ਖ਼ੁਸ਼ ਨਾ ਹੋਇਆ। ਉਹ ਭਰਾ ਨੂੰ ਵਧਾਈ ਦੇਣ ਵੀ ਨਾ ਆਇਆ। ਉਸ ਦਾ ਦਿਲ ਈਰਖਾ ਨਾਲ ਭਰ ਗਿਆ, ਅਤੇ ਉਹ ਬੱਚੇ ਨੂੰ ਨੁਕਸਾਨ ਪਹੁੰਚਾਉਣ ਦੀਆਂ ਸਕੀਮਾਂ ਬਣਾਉਣ ਲੱਗਾ।","ਪਹਿਲਾਂ ਉਸ ਨੇ ਇੱਕ ਨੌਕਰ ਨੂੰ ਪੈਸੇ ਦੇ ਕੇ ਬੱਚੇ ਨੂੰ ਜ਼ਹਿਰ ਵਾਲਾ ਦਹੀਂ ਖੁਆਉਣ ਲਈ ਕਿਹਾ। ਪਰ ਹਰਿਗੋਬਿੰਦ ਜੀ ਨੇ ਦਹੀਂ ਨਾ ਖਾਧਾ ਅਤੇ ਇੰਨੀ ਜ਼ੋਰ ਨਾਲ ਰੋਏ ਕਿ ਮਾਤਾ ਗੰਗਾ ਜੀ ਦੌੜੇ ਆਏ। ਸਕੀਮ ਫ਼ੇਲ੍ਹ ਹੋ ਗਈ, ਅਤੇ ਨੌਕਰ ਨੇ ਮੰਨ ਲਿਆ ਕਿ ਉਸ ਨੂੰ ਪ੍ਰਿਥੀ ਚੰਦ ਨੇ ਭੇਜਿਆ ਸੀ।","ਬਾਅਦ ਵਿੱਚ, ਜਦੋਂ ਹਰਿਗੋਬਿੰਦ ਜੀ ਲਗਭਗ ਪੰਜ ਸਾਲ ਦੇ ਸਨ, ਪ੍ਰਿਥੀ ਚੰਦ ਨੇ ਉਨ੍ਹਾਂ ਦੇ ਇੱਕ ਸਾਥੀ ਦੀਆਂ ਦੋ ਜੇਬਾਂ ਵਿੱਚ ਮਠਿਆਈ ਪੁਆਈ, ਜਿਨ੍ਹਾਂ ਵਿੱਚੋਂ ਇੱਕ ਵਿੱਚ ਜ਼ਹਿਰ ਸੀ, ਇਸ ਆਸ ਨਾਲ ਕਿ ਉਹ ਮਠਿਆਈ ਹਰਿਗੋਬਿੰਦ ਜੀ ਤੱਕ ਪਹੁੰਚੇ। ਪਰ ਉਹ ਸਕੀਮ ਵੀ ਉਲਟੀ ਪੈ ਗਈ, ਅਤੇ ਨੁਕਸਾਨ ਉਨ੍ਹਾਂ ਦਾ ਹੀ ਹੋਇਆ ਜਿਨ੍ਹਾਂ ਨੇ ਸਕੀਮ ਬਣਾਈ ਸੀ। ਸਾਰੇ ਪਿੰਡ ਨੂੰ ਪਤਾ ਲੱਗ ਗਿਆ ਕਿ ਪ੍ਰਿਥੀ ਚੰਦ ਨੇ ਕੀ ਕੀਤਾ ਹੈ, ਅਤੇ ਉਸ ਨੂੰ ਸ਼ਰਮਿੰਦਾ ਹੋ ਕੇ ਪਿੰਡ ਛੱਡਣਾ ਪਿਆ।","ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਆਪਣੇ ਪੁੱਤਰ ਨੂੰ ਸੁਰੱਖਿਅਤ ਆਪਣੇ ਕੋਲ ਅੰਮ੍ਰਿਤਸਰ ਲੈ ਆਏ। ਉਨ੍ਹਾਂ ਨੇ ਰੱਬ ਦਾ ਸ਼ੁਕਰ ਕਰਦਿਆਂ ਸ਼ਬਦ ਉਚਾਰਿਆ: ਲੇਪੁ ਨ ਲਾਗੋ ਤਿਲ ਕਾ ਮੂਲਿ, ਭਾਵ ਬੱਚੇ ਨੂੰ ਤਿਲ ਜਿੰਨਾ ਵੀ ਨੁਕਸਾਨ ਨਾ ਪਹੁੰਚਿਆ। ਬਾਲ ਹਰਿਗੋਬਿੰਦ ਤਕੜੇ ਅਤੇ ਬਹਾਦਰ ਹੋ ਕੇ ਵੱਡੇ ਹੋਏ, ਅਤੇ ਛੇਵੇਂ ਗੁਰੂ ਬਣੇ।"],l:"ਈਰਖਾ ਮਨੁੱਖ ਤੋਂ ਭਿਆਨਕ ਕੰਮ ਕਰਵਾ ਸਕਦੀ ਹੈ। ਜਿਨ੍ਹਾਂ ਦੀ ਰਾਖੀ ਰੱਬ ਕਰਦਾ ਹੈ ਅਤੇ ਜੋ ਸੱਚ ਨਾਲ ਜੀਂਦੇ ਹਨ, ਉਹ ਸੁਰੱਖਿਅਤ ਰਹਿੰਦੇ ਹਨ।"}},

{id:"lahore-famine",title:"Feeding Lahore in the Famine",gur:"ਕਾਲ ਵਿੱਚ ਸੇਵਾ",cat:"Guru Arjan Dev Ji",age:"Kids",where:"Lahore",mins:2,c:"#E8743A",c2:"#1FA38A",h:390,art:"langar",
year:1595,loc:["lahore"],themes:["Sewa","Equality"],
summary:"No rain falls for three years, and people in Lahore are starving. The emperor leaves the city. Guru Arjan Dev Ji goes in.",
text:["For three years in a row, no rain fell around Lahore. The crops failed, and there was no food anywhere. People grew weak and many died of hunger. The streets were filled with crying and sorrow.","Emperor Akbar was living in Lahore at that time. He could not bear the sight and the smell of the suffering city, so he left Lahore and moved away.","When Guru Arjan Dev Ji heard what was happening, he went straight to Lahore. He sent word to Sikhs everywhere to bring their offerings there, and he set up langars so that the hungry could eat.","He also began building a baoli, a step-well. This gave work to people who had lost their jobs, so they could earn with dignity, and it gave the city water. Guru Ji himself helped to care for the sick and to give the dead a proper farewell.","When people saw the Guru working with his own hands, they joined in too, and gave whatever they could. Slowly, Lahore came back to life. The emperor had left the city, but the Guru had stayed and served."],
lesson:"In hard times, true leaders don't run away. They roll up their sleeves and serve.",
think:["What is the difference between what Akbar did and what Guru Ji did?","How can giving someone work be a kind of help?"],
words:[["Famine","A time when there is not enough food."],["Baoli","A step-well with stairs leading down to the water."]],
quiz:[["Why was there a famine?",["No rain for three years","A big flood","A war"],0],["What did Emperor Akbar do?",["Left Lahore","Opened a langar","Built a well"],0],["Why did Guru Ji build a step-well?",["To give people work and water","To make a garden","To keep horses"],0]],
pa:{t:["ਲਗਾਤਾਰ ਤਿੰਨ ਸਾਲ ਲਾਹੌਰ ਦੇ ਇਲਾਕੇ ਵਿੱਚ ਮੀਂਹ ਨਾ ਪਿਆ। ਫ਼ਸਲਾਂ ਸੁੱਕ ਗਈਆਂ ਅਤੇ ਕਿਤੇ ਵੀ ਅੰਨ ਨਾ ਰਿਹਾ। ਲੋਕ ਕਮਜ਼ੋਰ ਹੋ ਗਏ ਅਤੇ ਬਹੁਤੇ ਭੁੱਖ ਨਾਲ ਮਰ ਗਏ। ਗਲੀਆਂ ਵਿੱਚ ਰੋਣਾ-ਕੁਰਲਾਉਣਾ ਸੀ।","ਉਸ ਸਮੇਂ ਬਾਦਸ਼ਾਹ ਅਕਬਰ ਲਾਹੌਰ ਵਿੱਚ ਰਹਿ ਰਿਹਾ ਸੀ। ਦੁਖੀ ਸ਼ਹਿਰ ਦਾ ਹਾਲ ਅਤੇ ਬਦਬੂ ਉਸ ਤੋਂ ਸਹਾਰੀ ਨਾ ਗਈ, ਇਸ ਲਈ ਉਹ ਲਾਹੌਰ ਛੱਡ ਕੇ ਚਲਾ ਗਿਆ।","ਜਦੋਂ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਨੇ ਇਹ ਹਾਲ ਸੁਣਿਆ, ਉਹ ਸਿੱਧੇ ਲਾਹੌਰ ਪਹੁੰਚੇ। ਉਨ੍ਹਾਂ ਨੇ ਹਰ ਥਾਂ ਸਿੱਖਾਂ ਨੂੰ ਆਪਣੀ ਦਸਵੰਧ ਅਤੇ ਭੇਟਾ ਲਾਹੌਰ ਲਿਆਉਣ ਦਾ ਸੁਨੇਹਾ ਭੇਜਿਆ, ਅਤੇ ਭੁੱਖਿਆਂ ਲਈ ਲੰਗਰ ਲਾ ਦਿੱਤੇ।","ਉਨ੍ਹਾਂ ਨੇ ਇੱਕ ਬਾਉਲੀ ਬਣਾਉਣੀ ਵੀ ਸ਼ੁਰੂ ਕੀਤੀ। ਇਸ ਨਾਲ ਬੇਰੁਜ਼ਗਾਰ ਲੋਕਾਂ ਨੂੰ ਕੰਮ ਮਿਲਿਆ ਤਾਂ ਜੋ ਉਹ ਇੱਜ਼ਤ ਨਾਲ ਕਮਾ ਸਕਣ, ਅਤੇ ਸ਼ਹਿਰ ਨੂੰ ਪਾਣੀ ਮਿਲਿਆ। ਗੁਰੂ ਜੀ ਆਪ ਬਿਮਾਰਾਂ ਦੀ ਸੰਭਾਲ ਕਰਦੇ ਅਤੇ ਮਰਨ ਵਾਲਿਆਂ ਦੀ ਅੰਤਿਮ ਵਿਦਾਈ ਆਦਰ ਨਾਲ ਕਰਵਾਉਂਦੇ।","ਜਦੋਂ ਲੋਕਾਂ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਆਪਣੇ ਹੱਥੀਂ ਸੇਵਾ ਕਰਦਿਆਂ ਵੇਖਿਆ, ਉਹ ਵੀ ਨਾਲ ਜੁੜ ਗਏ ਅਤੇ ਜੋ ਸਰਿਆ ਦਿੱਤਾ। ਹੌਲੀ-ਹੌਲੀ ਲਾਹੌਰ ਵਿੱਚ ਮੁੜ ਜਾਨ ਪੈ ਗਈ। ਬਾਦਸ਼ਾਹ ਸ਼ਹਿਰ ਛੱਡ ਗਿਆ ਸੀ, ਪਰ ਗੁਰੂ ਜੀ ਨੇ ਰਹਿ ਕੇ ਸੇਵਾ ਕੀਤੀ।"],l:"ਔਖੇ ਸਮੇਂ ਸੱਚੇ ਆਗੂ ਭੱਜਦੇ ਨਹੀਂ। ਉਹ ਬਾਹਾਂ ਟੰਗ ਕੇ ਸੇਵਾ ਕਰਦੇ ਹਨ।"}},

{id:"bhai-bhikhari",title:"Bhai Bhikhari Accepts God's Will",gur:"ਭਾਈ ਭਿਖਾਰੀ",cat:"Guru Arjan Dev Ji",age:"Youth",where:"Gujrat",mins:3,c:"#1E1E24",c2:"#F2B229",h:400,art:"lamps",
year:1600,approx:1,loc:[],themes:["Faith","Humility"],
summary:"A Sikh asks Guru Arjan Dev Ji to show him a truly accomplished Sikh. He is sent to stay with Bhai Bhikhari.",
text:["A kind and good-hearted Sikh once asked Guru Arjan Dev Ji, 'Please let me meet a truly accomplished Sikh, so that I can learn from his life.' Guru Ji said, 'Go to Gujrat and stay with Bhai Bhikhari.'","When the Sikh arrived, Bhai Bhikhari's house was busy with preparations for his son's wedding. But Bhai Bhikhari was sitting quietly to one side, sewing a white cloth, the kind used to cover someone who has died. 'Why are you sewing that at a time like this?' asked the Sikh. Bhai Bhikhari said gently, 'Stay with me for a few days, and you will understand.'","The wedding took place with joy, and the new bride came home. But two days later, the son suddenly fell ill and passed away. Calmly, Bhai Bhikhari laid out the mats he had prepared for visitors, and gently covered his son with the cloth he had sewn.","The Sikh was amazed. 'You knew this would happen. Why didn't you ask the Guru to pray for your son's long life?' Bhai Bhikhari answered, 'Every body that is born will one day leave this world. The thing most worth asking from the Guru is the strength to accept God's will.'","The Sikh bowed his head. He understood that an accomplished Sikh is not someone whose life has no sorrow, but someone who meets both joy and sorrow with faith in Waheguru. He went back to Guru Ji with a deeper understanding."],
lesson:"Joy and sorrow both come in life. A true Sikh meets them with faith, accepting God's will (bhana) with a steady heart.",
think:["What did Bhai Bhikhari say is the best thing to ask from the Guru?","How can faith help us when something sad happens?"],
words:[["Bhana","God's will; accepting what happens with faith."],["Accomplished","Someone who has truly learned and lives what they believe."]],
quiz:[["What was Bhai Bhikhari doing when the Sikh arrived?",["Sewing a white cloth","Cooking","Sleeping"],0],["What happened to Bhai Bhikhari's son?",["He passed away two days after his wedding","He went on a journey","He became a soldier"],0],["What did Bhai Bhikhari say is most worth asking from the Guru?",["The strength to accept God's will","Riches","A long life"],0]],
pa:{t:["ਇੱਕ ਨੇਕ ਦਿਲ ਸਿੱਖ ਨੇ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਅੱਗੇ ਬੇਨਤੀ ਕੀਤੀ, 'ਮੈਨੂੰ ਕਿਸੇ ਪੂਰਨ ਗੁਰਸਿੱਖ ਨਾਲ ਮਿਲਾਓ, ਤਾਂ ਜੋ ਮੈਂ ਉਸ ਦੇ ਜੀਵਨ ਤੋਂ ਸਿੱਖ ਸਕਾਂ।' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਗੁਜਰਾਤ ਜਾ ਕੇ ਭਾਈ ਭਿਖਾਰੀ ਕੋਲ ਰਹੁ।'","ਜਦੋਂ ਸਿੱਖ ਉੱਥੇ ਪਹੁੰਚਿਆ, ਭਾਈ ਭਿਖਾਰੀ ਦੇ ਘਰ ਪੁੱਤਰ ਦੇ ਵਿਆਹ ਦੀਆਂ ਤਿਆਰੀਆਂ ਦੀ ਰੌਣਕ ਸੀ। ਪਰ ਭਾਈ ਭਿਖਾਰੀ ਇੱਕ ਪਾਸੇ ਚੁੱਪ-ਚਾਪ ਬੈਠੇ ਚਿੱਟਾ ਕੱਪੜਾ ਸੀਂ ਰਹੇ ਸਨ, ਉਹ ਕੱਪੜਾ ਜੋ ਮਰਨ ਵਾਲੇ ਉੱਤੇ ਪਾਇਆ ਜਾਂਦਾ ਹੈ। ਸਿੱਖ ਨੇ ਪੁੱਛਿਆ, 'ਇਸ ਮੌਕੇ ਤੁਸੀਂ ਇਹ ਕਿਉਂ ਸੀਂ ਰਹੇ ਹੋ?' ਭਾਈ ਭਿਖਾਰੀ ਨੇ ਨਰਮੀ ਨਾਲ ਕਿਹਾ, 'ਕੁਝ ਦਿਨ ਮੇਰੇ ਕੋਲ ਰਹੁ, ਸਮਝ ਆ ਜਾਵੇਗੀ।'","ਵਿਆਹ ਖ਼ੁਸ਼ੀ ਨਾਲ ਹੋਇਆ ਅਤੇ ਨਵੀਂ ਵਹੁਟੀ ਘਰ ਆਈ। ਪਰ ਦੋ ਦਿਨਾਂ ਬਾਅਦ ਪੁੱਤਰ ਅਚਾਨਕ ਬਿਮਾਰ ਹੋ ਕੇ ਚੜ੍ਹਾਈ ਕਰ ਗਿਆ। ਭਾਈ ਭਿਖਾਰੀ ਨੇ ਸ਼ਾਂਤੀ ਨਾਲ ਆਉਣ ਵਾਲਿਆਂ ਲਈ ਪਹਿਲਾਂ ਤਿਆਰ ਕੀਤੀਆਂ ਸਫ਼ਾਂ ਵਿਛਾਈਆਂ, ਅਤੇ ਪੁੱਤਰ ਉੱਤੇ ਆਪਣੇ ਹੱਥੀਂ ਸੀਤਾ ਕੱਪੜਾ ਪਿਆਰ ਨਾਲ ਪਾ ਦਿੱਤਾ।","ਸਿੱਖ ਹੈਰਾਨ ਸੀ। 'ਤੁਹਾਨੂੰ ਪਤਾ ਸੀ ਕਿ ਇਹ ਹੋਣਾ ਹੈ। ਤੁਸੀਂ ਗੁਰੂ ਜੀ ਤੋਂ ਪੁੱਤਰ ਦੀ ਲੰਮੀ ਉਮਰ ਦੀ ਅਰਦਾਸ ਕਿਉਂ ਨਹੀਂ ਕਰਵਾਈ?' ਭਾਈ ਭਿਖਾਰੀ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, 'ਜੋ ਸਰੀਰ ਜੰਮਿਆ ਹੈ, ਉਸ ਨੇ ਇੱਕ ਦਿਨ ਜਾਣਾ ਹੈ। ਗੁਰੂ ਤੋਂ ਮੰਗਣ ਵਾਲੀ ਸਭ ਤੋਂ ਵੱਡੀ ਦਾਤ ਰੱਬ ਦਾ ਭਾਣਾ ਮੰਨਣ ਦਾ ਬਲ ਹੈ।'","ਸਿੱਖ ਨੇ ਸਿਰ ਝੁਕਾ ਲਿਆ। ਉਹ ਸਮਝ ਗਿਆ ਕਿ ਪੂਰਨ ਗੁਰਸਿੱਖ ਉਹ ਨਹੀਂ ਜਿਸ ਦੇ ਜੀਵਨ ਵਿੱਚ ਦੁੱਖ ਨਾ ਹੋਵੇ, ਸਗੋਂ ਉਹ ਹੈ ਜੋ ਸੁੱਖ ਅਤੇ ਦੁੱਖ ਦੋਹਾਂ ਨੂੰ ਵਾਹਿਗੁਰੂ ਉੱਤੇ ਭਰੋਸੇ ਨਾਲ ਝੱਲੇ। ਉਹ ਡੂੰਘੀ ਸਮਝ ਲੈ ਕੇ ਗੁਰੂ ਜੀ ਕੋਲ ਮੁੜ ਆਇਆ।"],l:"ਜੀਵਨ ਵਿੱਚ ਸੁੱਖ ਵੀ ਆਉਂਦੇ ਹਨ ਅਤੇ ਦੁੱਖ ਵੀ। ਸੱਚਾ ਸਿੱਖ ਦੋਹਾਂ ਨੂੰ ਭਰੋਸੇ ਨਾਲ ਝੱਲਦਾ ਹੈ ਅਤੇ ਅਡੋਲ ਮਨ ਨਾਲ ਭਾਣਾ ਮੰਨਦਾ ਹੈ।"}},

{id:"adi-granth",title:"The First Parkash of the Adi Granth",gur:"ਆਦਿ ਗ੍ਰੰਥ ਦਾ ਪਹਿਲਾ ਪ੍ਰਕਾਸ਼",cat:"Guru Arjan Dev Ji",age:"Kids",where:"Harmandir Sahib, Amritsar",mins:3,c:"#F2B229",c2:"#DC3B32",h:405,art:"granth",
year:1604,loc:["amritsar"],themes:["Faith","Equality"],
summary:"Guru Arjan Dev Ji gathers the Gurus' words, and the words of saints from many backgrounds, into one great holy book.",
text:["From the very beginning, Guru Nanak Dev Ji wrote down the words that came to him in a pothi, a handwritten book. On his travels he also collected the words of other holy saints. When he passed the Guruship on, he passed the pothi on too, and each Guru after him added their own Bani.","By the time of Guru Arjan Dev Ji, some people were writing their own verses and pretending they were the Gurus' words, which confused the Sikhs. Guru Ji decided to gather all the true Bani into one carefully written book, so that nobody could ever mix false words with the true ones.","Guru Ji asked Bhai Gurdas Ji to write it out, arranging the shabads by raag, the musical measures they are sung in. Guru Ji included the words of saints from many backgrounds, Hindu and Muslim, high-caste and low-caste, like Bhagat Kabir Ji, Bhagat Ravidas Ji and Baba Sheikh Farid Ji, because truth belongs to everyone. Some people came asking for their own verses to be added, but Guru Ji only included words that matched the True Word.","In 1604 the great book, the Adi Granth, was ready. With great joy, it was carried to Harmandir Sahib and placed there with honour for the very first time. Baba Budha Ji became its first granthi, the one who reads from it and cares for it.","A hundred years later, Guru Gobind Singh Ji added the Bani of Guru Tegh Bahadur Ji and declared this holy book to be the eternal Guru of the Sikhs: Sri Guru Granth Sahib Ji, which guides Sikhs to this day."],
lesson:"Truth belongs to everyone, whatever their background. Sri Guru Granth Sahib Ji brings together the words of the Gurus and of saints from many paths.",
think:["Why did Guru Ji include the words of saints from different backgrounds?","Why was it important to write the Bani down carefully?"],
words:[["Pothi","A handwritten book of holy words."],["Raag","A musical measure in which shabads are sung."],["Granthi","Someone who reads from and cares for the Guru Granth Sahib."]],
quiz:[["Who wrote out the Adi Granth for Guru Ji?",["Bhai Gurdas Ji","Bhai Mardana Ji","Baba Sri Chand Ji"],0],["Where was it first placed in 1604?",["Harmandir Sahib","Kartarpur","Goindwal"],0],["Who was the first granthi?",["Baba Budha Ji","Bhai Gurdas Ji","Bhai Lalo Ji"],0]],
pa:{t:["ਸ਼ੁਰੂ ਤੋਂ ਹੀ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਆਪਣੀ ਉਚਾਰੀ ਬਾਣੀ ਇੱਕ ਪੋਥੀ ਵਿੱਚ ਲਿਖਦੇ ਰਹੇ। ਯਾਤਰਾਵਾਂ ਦੌਰਾਨ ਉਨ੍ਹਾਂ ਨੇ ਹੋਰ ਸੰਤਾਂ-ਭਗਤਾਂ ਦੀ ਬਾਣੀ ਵੀ ਇਕੱਠੀ ਕੀਤੀ। ਗੁਰਗੱਦੀ ਸੌਂਪਣ ਵੇਲੇ ਉਨ੍ਹਾਂ ਨੇ ਪੋਥੀ ਵੀ ਸੌਂਪ ਦਿੱਤੀ, ਅਤੇ ਉਨ੍ਹਾਂ ਤੋਂ ਬਾਅਦ ਹਰ ਗੁਰੂ ਨੇ ਆਪਣੀ ਬਾਣੀ ਉਸ ਵਿੱਚ ਜੋੜੀ।","ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਦੇ ਸਮੇਂ ਤੱਕ ਕੁਝ ਲੋਕ ਆਪਣੀਆਂ ਰਚਨਾਵਾਂ ਨੂੰ ਗੁਰੂਆਂ ਦੀ ਬਾਣੀ ਕਹਿ ਕੇ ਸਿੱਖਾਂ ਨੂੰ ਭੁਲੇਖਾ ਪਾ ਰਹੇ ਸਨ। ਗੁਰੂ ਜੀ ਨੇ ਸਾਰੀ ਸੱਚੀ ਬਾਣੀ ਨੂੰ ਇੱਕ ਗ੍ਰੰਥ ਵਿੱਚ ਧਿਆਨ ਨਾਲ ਲਿਖਵਾਉਣ ਦਾ ਫ਼ੈਸਲਾ ਕੀਤਾ, ਤਾਂ ਜੋ ਕੋਈ ਸੱਚੀ ਬਾਣੀ ਵਿੱਚ ਕੱਚੀ ਬਾਣੀ ਨਾ ਰਲਾ ਸਕੇ।","ਗੁਰੂ ਜੀ ਨੇ ਭਾਈ ਗੁਰਦਾਸ ਜੀ ਤੋਂ ਬਾਣੀ ਲਿਖਵਾਈ, ਅਤੇ ਸ਼ਬਦਾਂ ਨੂੰ ਰਾਗਾਂ ਅਨੁਸਾਰ ਤਰਤੀਬ ਦਿੱਤੀ। ਗੁਰੂ ਜੀ ਨੇ ਵੱਖ-ਵੱਖ ਪਿਛੋਕੜ ਵਾਲੇ ਸੰਤਾਂ ਦੀ ਬਾਣੀ ਸ਼ਾਮਲ ਕੀਤੀ, ਹਿੰਦੂ ਵੀ ਅਤੇ ਮੁਸਲਮਾਨ ਵੀ, ਉੱਚੀ ਜਾਤ ਵਾਲੇ ਵੀ ਅਤੇ ਨੀਵੀਂ ਸਮਝੀ ਜਾਂਦੀ ਜਾਤ ਵਾਲੇ ਵੀ, ਜਿਵੇਂ ਭਗਤ ਕਬੀਰ ਜੀ, ਭਗਤ ਰਵਿਦਾਸ ਜੀ ਅਤੇ ਬਾਬਾ ਸ਼ੇਖ਼ ਫ਼ਰੀਦ ਜੀ, ਕਿਉਂਕਿ ਸੱਚ ਸਭ ਦਾ ਸਾਂਝਾ ਹੈ। ਕੁਝ ਲੋਕ ਆਪਣੀਆਂ ਰਚਨਾਵਾਂ ਜੁੜਵਾਉਣ ਆਏ, ਪਰ ਗੁਰੂ ਜੀ ਨੇ ਸਿਰਫ਼ ਉਹੀ ਬਾਣੀ ਸ਼ਾਮਲ ਕੀਤੀ ਜੋ ਸੱਚੀ ਬਾਣੀ ਦੀ ਕਸਵੱਟੀ ਉੱਤੇ ਪੂਰੀ ਉਤਰਦੀ ਸੀ।","1604 ਵਿੱਚ ਇਹ ਮਹਾਨ ਗ੍ਰੰਥ, ਆਦਿ ਗ੍ਰੰਥ, ਤਿਆਰ ਹੋ ਗਿਆ। ਬੜੇ ਚਾਅ ਨਾਲ ਇਸ ਨੂੰ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਲਿਜਾਇਆ ਗਿਆ ਅਤੇ ਪਹਿਲੀ ਵਾਰ ਸਤਿਕਾਰ ਨਾਲ ਪ੍ਰਕਾਸ਼ ਕੀਤਾ ਗਿਆ। ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਇਸ ਦੇ ਪਹਿਲੇ ਗ੍ਰੰਥੀ ਬਣੇ।","ਸੌ ਸਾਲ ਬਾਅਦ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨੇ ਇਸ ਵਿੱਚ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਦੀ ਬਾਣੀ ਦਰਜ ਕੀਤੀ ਅਤੇ ਇਸ ਪਵਿੱਤਰ ਗ੍ਰੰਥ ਨੂੰ ਸਿੱਖਾਂ ਦਾ ਸਦੀਵੀ ਗੁਰੂ ਥਾਪਿਆ: ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਜੀ, ਜੋ ਅੱਜ ਵੀ ਸਿੱਖਾਂ ਦੀ ਅਗਵਾਈ ਕਰਦੇ ਹਨ।"],l:"ਸੱਚ ਸਭ ਦਾ ਸਾਂਝਾ ਹੈ, ਭਾਵੇਂ ਕੋਈ ਕਿਸੇ ਵੀ ਪਿਛੋਕੜ ਤੋਂ ਹੋਵੇ। ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਜੀ ਵਿੱਚ ਗੁਰੂਆਂ ਅਤੇ ਵੱਖ-ਵੱਖ ਰਾਹਾਂ ਦੇ ਸੰਤਾਂ ਦੀ ਬਾਣੀ ਇਕੱਠੀ ਹੈ।"}},

{id:"akbar-reads-granth",title:"Akbar Listens to the Granth",gur:"ਏਕ ਨੂਰ ਤੇ ਸਭੁ ਜਗੁ ਉਪਜਿਆ",cat:"Guru Arjan Dev Ji",age:"Kids",where:"Batala",mins:3,c:"#1FA38A",c2:"#F0702A",h:395,art:"granth",
year:1605,loc:["batala"],themes:["Equality","Courage"],
summary:"Some people tell Emperor Akbar that the new holy book insults other faiths. Akbar decides to hear it for himself.",
text:["When the Adi Granth was being prepared, a man named Kanha asked Guru Arjan Dev Ji to add his poems to it. Guru Ji kindly said no, because the poems did not match the True Word. Kanha was a cousin of Chandu, a powerful official, and he was offended.","After Kanha died, some people went to Emperor Akbar with a complaint. 'Guru Arjan Dev has made a book that insults Muslim saints and Hindu gods,' they said. Akbar was a fair ruler. 'I will look at this book myself,' he said.","In 1605, Akbar came to Batala in Punjab and asked for the book to be brought to him. Baba Budha Ji and Bhai Gurdas Ji carried it there with great respect. 'Open it anywhere and read,' said Akbar.","Baba Budha Ji opened it and read. Every shabad praised the one God. Akbar asked for another page, and then another. One of the shabads, by Bhagat Kabir Ji, said: Ek noor te sabh jag upjia, kaun bhale ko mande. 'From one Light the whole world was made. So who is good and who is bad?'","Akbar was deeply moved. 'This book holds nothing but praise of God,' he said. 'It speaks badly of no one.' He bowed before the Granth, made an offering of gold coins, and sent the complainers away. On his way home he went to meet Guru Arjan Dev Ji himself."],
lesson:"Don't believe a complaint without checking for yourself. Sri Guru Granth Sahib Ji teaches that we all come from one Light.",
think:["Why was Akbar right to check the book himself?","What does 'from one Light the whole world was made' mean to you?"],
words:[["Noor","Light; God's light."],["Complaint","Telling someone in charge that something is wrong."]],
quiz:[["Why was Kanha upset?",["His poems were not added to the Granth","He lost a race","He was not invited"],0],["Where did Akbar listen to the Granth?",["Batala","Delhi","Kabul"],0],["What did Bhagat Kabir Ji's shabad say?",["From one Light the whole world was made","Be afraid of kings","Gold is the best gift"],0]],
pa:{t:["ਜਦੋਂ ਆਦਿ ਗ੍ਰੰਥ ਤਿਆਰ ਹੋ ਰਿਹਾ ਸੀ, ਕਾਨ੍ਹਾ ਨਾਂ ਦੇ ਇੱਕ ਆਦਮੀ ਨੇ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਨੂੰ ਆਪਣੀਆਂ ਕਵਿਤਾਵਾਂ ਸ਼ਾਮਲ ਕਰਨ ਲਈ ਕਿਹਾ। ਗੁਰੂ ਜੀ ਨੇ ਪਿਆਰ ਨਾਲ ਨਾਂਹ ਕਰ ਦਿੱਤੀ, ਕਿਉਂਕਿ ਉਹ ਕਵਿਤਾਵਾਂ ਸੱਚੀ ਬਾਣੀ ਦੇ ਮੇਚ ਦੀਆਂ ਨਹੀਂ ਸਨ। ਕਾਨ੍ਹਾ ਇੱਕ ਤਾਕਤਵਰ ਅਹਿਲਕਾਰ ਚੰਦੂ ਦਾ ਚਚੇਰਾ ਭਰਾ ਸੀ, ਅਤੇ ਉਸ ਨੂੰ ਬੁਰਾ ਲੱਗਾ।","ਕਾਨ੍ਹੇ ਦੀ ਮੌਤ ਤੋਂ ਬਾਅਦ ਕੁਝ ਲੋਕ ਬਾਦਸ਼ਾਹ ਅਕਬਰ ਕੋਲ ਸ਼ਿਕਾਇਤ ਲੈ ਕੇ ਗਏ, 'ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਨੇ ਇੱਕ ਗ੍ਰੰਥ ਬਣਾਇਆ ਹੈ ਜਿਸ ਵਿੱਚ ਮੁਸਲਮਾਨ ਪੀਰਾਂ ਅਤੇ ਹਿੰਦੂ ਦੇਵਤਿਆਂ ਦੀ ਨਿੰਦਾ ਹੈ।' ਅਕਬਰ ਇੱਕ ਨਿਆਂ-ਪਸੰਦ ਬਾਦਸ਼ਾਹ ਸੀ। ਉਸ ਨੇ ਕਿਹਾ, 'ਮੈਂ ਇਹ ਗ੍ਰੰਥ ਆਪ ਵੇਖਾਂਗਾ।'","1605 ਵਿੱਚ ਅਕਬਰ ਪੰਜਾਬ ਵਿੱਚ ਬਟਾਲੇ ਆਇਆ ਅਤੇ ਗ੍ਰੰਥ ਮੰਗਵਾਇਆ। ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਅਤੇ ਭਾਈ ਗੁਰਦਾਸ ਜੀ ਬੜੇ ਸਤਿਕਾਰ ਨਾਲ ਗ੍ਰੰਥ ਲੈ ਕੇ ਗਏ। ਅਕਬਰ ਨੇ ਕਿਹਾ, 'ਕਿਤੋਂ ਵੀ ਖੋਲ੍ਹ ਕੇ ਪੜ੍ਹੋ।'","ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਨੇ ਗ੍ਰੰਥ ਖੋਲ੍ਹ ਕੇ ਪੜ੍ਹਿਆ। ਹਰ ਸ਼ਬਦ ਇੱਕ ਰੱਬ ਦੀ ਸਿਫ਼ਤ ਕਰਦਾ ਸੀ। ਅਕਬਰ ਨੇ ਹੋਰ ਪੰਨਾ ਪੜ੍ਹਨ ਲਈ ਕਿਹਾ, ਫਿਰ ਹੋਰ। ਭਗਤ ਕਬੀਰ ਜੀ ਦੇ ਇੱਕ ਸ਼ਬਦ ਵਿੱਚ ਆਇਆ: ਏਕ ਨੂਰ ਤੇ ਸਭੁ ਜਗੁ ਉਪਜਿਆ ਕਉਨ ਭਲੇ ਕੋ ਮੰਦੇ। ਭਾਵ ਇੱਕੋ ਨੂਰ ਤੋਂ ਸਾਰਾ ਜਗਤ ਪੈਦਾ ਹੋਇਆ ਹੈ, ਫਿਰ ਕੌਣ ਚੰਗਾ ਅਤੇ ਕੌਣ ਮਾੜਾ?","ਅਕਬਰ ਦਾ ਦਿਲ ਭਰ ਆਇਆ। ਉਸ ਨੇ ਕਿਹਾ, 'ਇਸ ਗ੍ਰੰਥ ਵਿੱਚ ਰੱਬ ਦੀ ਸਿਫ਼ਤ ਤੋਂ ਬਿਨਾਂ ਕੁਝ ਨਹੀਂ। ਇਹ ਕਿਸੇ ਦੀ ਨਿੰਦਾ ਨਹੀਂ ਕਰਦਾ।' ਉਸ ਨੇ ਗ੍ਰੰਥ ਅੱਗੇ ਸਿਰ ਝੁਕਾਇਆ, ਸੋਨੇ ਦੀਆਂ ਮੋਹਰਾਂ ਭੇਟ ਕੀਤੀਆਂ, ਅਤੇ ਸ਼ਿਕਾਇਤ ਕਰਨ ਵਾਲਿਆਂ ਨੂੰ ਮੋੜ ਦਿੱਤਾ। ਵਾਪਸੀ ਵੇਲੇ ਉਹ ਆਪ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਨੂੰ ਮਿਲਣ ਗਿਆ।"],l:"ਕਿਸੇ ਸ਼ਿਕਾਇਤ ਨੂੰ ਆਪ ਜਾਂਚੇ ਬਿਨਾਂ ਸੱਚ ਨਾ ਮੰਨੋ। ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਜੀ ਸਿਖਾਉਂਦੇ ਹਨ ਕਿ ਅਸੀਂ ਸਾਰੇ ਇੱਕੋ ਨੂਰ ਤੋਂ ਹਾਂ।"}},

{id:"chandu-pride",title:"Chandu's Proud Words",gur:"ਚੰਦੂ ਦਾ ਹੰਕਾਰ",cat:"Guru Arjan Dev Ji",age:"Kids",where:"Delhi and Amritsar",mins:3,c:"#8E3FB8",c2:"#F0702A",h:400,art:"palace",
year:1604,approx:1,loc:["delhi","amritsar"],themes:["Humility","Honesty"],
summary:"A rich minister's family chooses young Hargobind as a husband for his daughter. But the minister mocks the Guru's home.",
text:["Chandu was a rich and powerful minister in the emperor's court in Delhi. His family priests had been searching for a good husband for his daughter. When they met young Hargobind, the son of Guru Arjan Dev Ji, they were delighted, and wrote to Chandu about him.","But Chandu was very proud. Sitting in the royal court, he laughed and said, 'The priests have made a mistake. They want to take a brick from the top of a fine house and put it in a drain!' He meant that the Guru's home was lowly compared to his own.","Some Sikhs in the court heard these insulting words. They wrote at once to Guru Arjan Dev Ji: 'Please do not accept a relationship with proud Chandu. He has insulted the Guru's house.'","When the priests arrived with Chandu's offer, Guru Ji kindly said no. Just then, a humble Sikh named Bhai Narain Das stood up in the sangat and asked if his daughter, Damodari, could marry Hargobind. Guru Ji happily agreed.","Chandu was furious when he heard. He sent a huge sum of money to change Guru Ji's mind, but Guru Ji did not want money. Chandu's pride turned into anger, and he became an enemy of the Guru from that day."],
lesson:"Pride makes us look down on others, and it can turn into anger. Respect is worth more than any amount of money.",
think:["What did Chandu mean by his words about a brick and a drain?","Why didn't Guru Ji accept the money?"],
words:[["Minister","An important official in a king's court."],["Sangat","The community of people who gather together."]],
quiz:[["Who was Chandu?",["A rich minister in Delhi","A farmer","A musician"],0],["Who offered his daughter's hand instead?",["Bhai Narain Das","Baba Budha Ji","Bhai Gurdas Ji"],0],["What did Chandu send to change Guru Ji's mind?",["A huge sum of money","An army","A letter of apology"],0]],
pa:{t:["ਚੰਦੂ ਦਿੱਲੀ ਵਿੱਚ ਬਾਦਸ਼ਾਹ ਦੇ ਦਰਬਾਰ ਦਾ ਇੱਕ ਅਮੀਰ ਅਤੇ ਤਾਕਤਵਰ ਦੀਵਾਨ ਸੀ। ਉਸ ਦੇ ਪਰਿਵਾਰਕ ਪੁਰੋਹਿਤ ਉਸ ਦੀ ਧੀ ਲਈ ਚੰਗਾ ਵਰ ਲੱਭ ਰਹੇ ਸਨ। ਜਦੋਂ ਉਹ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਦੇ ਸਪੁੱਤਰ ਹਰਿਗੋਬਿੰਦ ਜੀ ਨੂੰ ਮਿਲੇ, ਉਹ ਬਹੁਤ ਖ਼ੁਸ਼ ਹੋਏ ਅਤੇ ਚੰਦੂ ਨੂੰ ਚਿੱਠੀ ਲਿਖੀ।","ਪਰ ਚੰਦੂ ਬਹੁਤ ਹੰਕਾਰੀ ਸੀ। ਸ਼ਾਹੀ ਦਰਬਾਰ ਵਿੱਚ ਬੈਠਿਆਂ ਉਹ ਹੱਸ ਕੇ ਬੋਲਿਆ, 'ਪੁਰੋਹਿਤਾਂ ਨੇ ਭੁੱਲ ਕੀਤੀ ਹੈ। ਮੇਰੀ ਧੀ ਤਾਂ ਚੁਬਾਰੇ ਦੀ ਇੱਟ ਹੈ, ਅਤੇ ਇਹ ਉਸ ਨੂੰ ਮੋਰੀ ਵਿੱਚ ਲਾਉਣਾ ਚਾਹੁੰਦੇ ਹਨ!' ਭਾਵ ਉਹ ਗੁਰੂ ਘਰ ਨੂੰ ਆਪਣੇ ਘਰ ਨਾਲੋਂ ਨੀਵਾਂ ਸਮਝਦਾ ਸੀ।","ਦਰਬਾਰ ਵਿੱਚ ਬੈਠੇ ਕੁਝ ਸਿੱਖਾਂ ਨੇ ਇਹ ਹੰਕਾਰੀ ਬੋਲ ਸੁਣੇ। ਉਨ੍ਹਾਂ ਨੇ ਝੱਟ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਨੂੰ ਲਿਖਿਆ, 'ਹੰਕਾਰੀ ਚੰਦੂ ਦਾ ਰਿਸ਼ਤਾ ਪ੍ਰਵਾਨ ਨਾ ਕਰਨਾ। ਉਸ ਨੇ ਗੁਰੂ ਘਰ ਦੀ ਨਿਰਾਦਰੀ ਕੀਤੀ ਹੈ।'","ਜਦੋਂ ਪੁਰੋਹਿਤ ਚੰਦੂ ਦਾ ਰਿਸ਼ਤਾ ਲੈ ਕੇ ਆਏ, ਗੁਰੂ ਜੀ ਨੇ ਨਿਮਰਤਾ ਨਾਲ ਨਾਂਹ ਕਰ ਦਿੱਤੀ। ਉਸੇ ਵੇਲੇ ਸੰਗਤ ਵਿੱਚੋਂ ਭਾਈ ਨਰਾਇਣ ਦਾਸ ਨਾਂ ਦਾ ਇੱਕ ਨਿਮਰ ਸਿੱਖ ਉੱਠਿਆ ਅਤੇ ਬੇਨਤੀ ਕੀਤੀ ਕਿ ਉਸ ਦੀ ਧੀ ਦਮੋਦਰੀ ਦਾ ਰਿਸ਼ਤਾ ਹਰਿਗੋਬਿੰਦ ਜੀ ਲਈ ਪ੍ਰਵਾਨ ਕੀਤਾ ਜਾਵੇ। ਗੁਰੂ ਜੀ ਨੇ ਖ਼ੁਸ਼ੀ ਨਾਲ ਪ੍ਰਵਾਨ ਕਰ ਲਿਆ।","ਇਹ ਸੁਣ ਕੇ ਚੰਦੂ ਨੂੰ ਬਹੁਤ ਗੁੱਸਾ ਆਇਆ। ਉਸ ਨੇ ਗੁਰੂ ਜੀ ਦਾ ਮਨ ਬਦਲਣ ਲਈ ਬਹੁਤ ਸਾਰਾ ਧਨ ਭੇਜਿਆ, ਪਰ ਗੁਰੂ ਜੀ ਨੂੰ ਧਨ ਦੀ ਲੋੜ ਨਹੀਂ ਸੀ। ਚੰਦੂ ਦਾ ਹੰਕਾਰ ਗੁੱਸੇ ਵਿੱਚ ਬਦਲ ਗਿਆ, ਅਤੇ ਉਸ ਦਿਨ ਤੋਂ ਉਹ ਗੁਰੂ ਜੀ ਦਾ ਵੈਰੀ ਬਣ ਗਿਆ।"],l:"ਹੰਕਾਰ ਸਾਨੂੰ ਦੂਜਿਆਂ ਨੂੰ ਨੀਵਾਂ ਸਮਝਣ ਲਾਉਂਦਾ ਹੈ, ਅਤੇ ਗੁੱਸੇ ਵਿੱਚ ਬਦਲ ਸਕਦਾ ਹੈ। ਇੱਜ਼ਤ ਕਿਸੇ ਵੀ ਧਨ ਤੋਂ ਕੀਮਤੀ ਹੈ।"}},

{id:"sulhi-khan",title:"Sulhi Khan's Plan",gur:"ਸੁਲਹੀ ਤੇ ਨਾਰਾਇਣ ਰਾਖੁ",cat:"Guru Arjan Dev Ji",age:"Kids",where:"On the way to Amritsar",mins:3,c:"#4867D6",c2:"#F2B229",h:400,art:"fort",
year:1606,approx:1,loc:["lahore","amritsar"],themes:["Faith"],
summary:"Angry Chandu sends a commander with an army to drive Guru Arjan Dev Ji out of Amritsar. The plan never reaches its goal.",
text:["When Jahangir became emperor, Chandu saw his chance for revenge. A commander named Sulhi Khan was being sent to Punjab with an army to collect taxes. Chandu told him secretly, 'Drive Guru Arjan Dev out of Amritsar, and make his brother Prithi Chand the Guru instead.'","Prithi Chand was delighted when he heard the army was coming. He rode out to welcome Sulhi Khan and invited him to stay at his village for the night. In the evening, he proudly showed Sulhi Khan around his new brick kiln, a huge oven for baking bricks.","Sulhi Khan was riding his horse beside the kiln when something frightened the horse. It reared up, slipped, and fell into the blazing kiln with its rider. Sulhi Khan's plan to attack Amritsar ended right there.","When the Sikhs brought the news, Guru Arjan Dev Ji did not celebrate. He folded his hands and thanked God in a shabad that begins: Sulhi te narain rakh. 'God has protected us from Sulhi.' The shabad is in Sri Guru Granth Sahib Ji.","Later, Sulhi Khan's nephew came with another army to take revenge. But on the way, near the river Beas, he quarrelled with one of his own officers over unpaid wages, and that plan failed too. Chandu's hopes were dashed again and again."],
lesson:"Plans made in anger and jealousy often fail. When we are in God's protection, we should thank Him, not boast.",
think:["Why did Guru Ji thank God instead of celebrating?","What does it mean to be under God's protection?"],
words:[["Kiln","A very hot oven for baking bricks."],["Commander","A leader of soldiers."]],
quiz:[["Who sent Sulhi Khan against Guru Ji?",["Chandu","Akbar","Baba Budha Ji"],0],["What happened to Sulhi Khan?",["His horse fell into a brick kiln","He became a Sikh","He went home"],0],["What did Guru Ji do when he heard the news?",["Thanked God in a shabad","Held a feast","Sent an army"],0]],
pa:{t:["ਜਦੋਂ ਜਹਾਂਗੀਰ ਬਾਦਸ਼ਾਹ ਬਣਿਆ, ਚੰਦੂ ਨੂੰ ਬਦਲਾ ਲੈਣ ਦਾ ਮੌਕਾ ਦਿਸਿਆ। ਸੁਲਹੀ ਖ਼ਾਨ ਨਾਂ ਦਾ ਇੱਕ ਸੈਨਾਪਤੀ ਮਾਲੀਆ ਇਕੱਠਾ ਕਰਨ ਲਈ ਫ਼ੌਜ ਲੈ ਕੇ ਪੰਜਾਬ ਭੇਜਿਆ ਜਾ ਰਿਹਾ ਸੀ। ਚੰਦੂ ਨੇ ਉਸ ਨੂੰ ਚੋਰੀ-ਚੋਰੀ ਕਿਹਾ, 'ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਨੂੰ ਅੰਮ੍ਰਿਤਸਰ ਤੋਂ ਕੱਢ ਦੇਵੀਂ ਅਤੇ ਉਸ ਦੇ ਭਰਾ ਪ੍ਰਿਥੀ ਚੰਦ ਨੂੰ ਗੁਰੂ ਬਣਾ ਦੇਵੀਂ।'","ਫ਼ੌਜ ਦੇ ਆਉਣ ਦੀ ਖ਼ਬਰ ਸੁਣ ਕੇ ਪ੍ਰਿਥੀ ਚੰਦ ਬਹੁਤ ਖ਼ੁਸ਼ ਹੋਇਆ। ਉਹ ਸੁਲਹੀ ਖ਼ਾਨ ਦਾ ਸੁਆਗਤ ਕਰਨ ਗਿਆ ਅਤੇ ਰਾਤ ਆਪਣੇ ਪਿੰਡ ਠਹਿਰਨ ਦਾ ਸੱਦਾ ਦਿੱਤਾ। ਸ਼ਾਮ ਨੂੰ ਉਸ ਨੇ ਬੜੇ ਮਾਣ ਨਾਲ ਸੁਲਹੀ ਖ਼ਾਨ ਨੂੰ ਆਪਣਾ ਨਵਾਂ ਇੱਟਾਂ ਦਾ ਭੱਠਾ ਵਿਖਾਇਆ।","ਸੁਲਹੀ ਖ਼ਾਨ ਘੋੜੇ ਉੱਤੇ ਭੱਠੇ ਦੇ ਕੋਲ ਘੁੰਮ ਰਿਹਾ ਸੀ ਕਿ ਕਿਸੇ ਚੀਜ਼ ਤੋਂ ਘੋੜਾ ਡਰ ਗਿਆ। ਉਹ ਉੱਛਲਿਆ, ਤਿਲਕਿਆ, ਅਤੇ ਸਵਾਰ ਸਮੇਤ ਬਲਦੇ ਭੱਠੇ ਵਿੱਚ ਜਾ ਡਿੱਗਾ। ਸੁਲਹੀ ਖ਼ਾਨ ਦੀ ਅੰਮ੍ਰਿਤਸਰ ਉੱਤੇ ਹਮਲੇ ਦੀ ਸਕੀਮ ਉੱਥੇ ਹੀ ਮੁੱਕ ਗਈ।","ਜਦੋਂ ਸਿੱਖਾਂ ਨੇ ਖ਼ਬਰ ਦਿੱਤੀ, ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਨੇ ਖ਼ੁਸ਼ੀਆਂ ਨਹੀਂ ਮਨਾਈਆਂ। ਉਨ੍ਹਾਂ ਨੇ ਹੱਥ ਜੋੜ ਕੇ ਸ਼ਬਦ ਰਾਹੀਂ ਰੱਬ ਦਾ ਸ਼ੁਕਰ ਕੀਤਾ: ਸੁਲਹੀ ਤੇ ਨਾਰਾਇਣ ਰਾਖੁ। ਇਹ ਸ਼ਬਦ ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਜੀ ਵਿੱਚ ਦਰਜ ਹੈ।","ਬਾਅਦ ਵਿੱਚ ਸੁਲਹੀ ਖ਼ਾਨ ਦਾ ਭਤੀਜਾ ਬਦਲਾ ਲੈਣ ਲਈ ਇੱਕ ਹੋਰ ਫ਼ੌਜ ਲੈ ਕੇ ਤੁਰਿਆ। ਪਰ ਰਾਹ ਵਿੱਚ ਬਿਆਸ ਦਰਿਆ ਨੇੜੇ ਉਸ ਦਾ ਆਪਣੇ ਹੀ ਇੱਕ ਅਫ਼ਸਰ ਨਾਲ ਤਨਖ਼ਾਹ ਨਾ ਮਿਲਣ ਕਰਕੇ ਝਗੜਾ ਹੋ ਗਿਆ, ਅਤੇ ਉਹ ਸਕੀਮ ਵੀ ਫ਼ੇਲ੍ਹ ਹੋ ਗਈ। ਚੰਦੂ ਦੀਆਂ ਆਸਾਂ ਵਾਰ-ਵਾਰ ਟੁੱਟਦੀਆਂ ਰਹੀਆਂ।"],l:"ਗੁੱਸੇ ਅਤੇ ਈਰਖਾ ਨਾਲ ਬਣੀਆਂ ਸਕੀਮਾਂ ਅਕਸਰ ਫ਼ੇਲ੍ਹ ਹੋ ਜਾਂਦੀਆਂ ਹਨ। ਜਦੋਂ ਰੱਬ ਰਾਖਾ ਹੋਵੇ, ਸਾਨੂੰ ਸ਼ੁਕਰ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ, ਫ਼ਖ਼ਰ ਨਹੀਂ।"}}
]);

{id:"dhir-mall-attack",title:"Forgiveness at Bakala",gur:"ਧੀਰ ਮੱਲ ਦਾ ਹਮਲਾ",cat:"Guru Tegh Bahadur Ji",age:"Kids",where:"Baba Bakala",mins:3,c:"#4867D6",c2:"#F2B229",h:400,art:"hands",
year:1664,loc:["bakala"],themes:["Humility","Courage"],
summary:"A jealous relative attacks Guru Tegh Bahadur Ji and steals from his home. When the thief is caught, the Guru does something surprising.",
text:["After Makhan Shah discovered the true Guru at Bakala, Sikhs came from everywhere to bow to Guru Tegh Bahadur Ji. But Dhir Mal, the Guru's nephew, had also wanted to be Guru. He could not bear to see the Sikhs going to his uncle, and his jealousy grew and grew.","One day, when Makhan Shah had gone back to his camp, Dhir Mal came to the Guru's home with a man named Shihan and a band of armed men. Shihan fired a gun at the Guru. The bullet grazed Guru Ji's forehead. Then Dhir Mal's men looted the house and carried away everything valuable, even the Guru's copy of the holy Granth.","Mata Nanaki Ji, the Guru's mother, said to Dhir Mal, 'If you had the qualities of a Guru, the Sikhs would follow you. Violence will never bring you any good.' When Makhan Shah heard what had happened, he rushed to Dhir Mal's camp with his men, brought back everything that had been stolen, and dragged Dhir Mal and Shihan before the Guru with their hands tied.","Everyone expected the Guru to punish them. But Guru Tegh Bahadur Ji said calmly, 'Untie them. And give back the things you took from their camp. They did all this out of greed. Let them keep what they wanted so badly.'","Makhan Shah obeyed. He returned everything except the holy Granth, which belonged with the true Guru. Everyone who saw this learned what true greatness looks like: not taking revenge, but forgiving."],
lesson:"Forgiving someone who has hurt us takes great strength. True greatness is shown by forgiveness, not revenge.",
think:["Why do you think the Guru forgave Dhir Mal?","Is it hard to forgive someone who has been unfair to you?"],
words:[["Forgive","To let go of anger towards someone who has hurt you."],["Masand","A person appointed to collect offerings for the Guru."]],
quiz:[["Why was Dhir Mal jealous?",["He wanted to be the Guru","He lost a race","He had no horse"],0],["Who brought back the stolen things?",["Makhan Shah","Bhai Jaita","Bhai Mardana"],0],["What did the Guru do with Dhir Mal?",["Forgave him and let him go","Put him in prison","Sent him far away"],0]],
pa:{t:["ਜਦੋਂ ਮੱਖਣ ਸ਼ਾਹ ਨੇ ਬਕਾਲੇ ਵਿੱਚ ਸੱਚੇ ਗੁਰੂ ਨੂੰ ਲੱਭ ਲਿਆ, ਹਰ ਪਾਸਿਓਂ ਸਿੱਖ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਅੱਗੇ ਮੱਥਾ ਟੇਕਣ ਆਉਣ ਲੱਗੇ। ਪਰ ਗੁਰੂ ਜੀ ਦਾ ਭਤੀਜਾ ਧੀਰ ਮੱਲ ਵੀ ਗੁਰੂ ਬਣਨਾ ਚਾਹੁੰਦਾ ਸੀ। ਸਿੱਖਾਂ ਨੂੰ ਆਪਣੇ ਚਾਚੇ ਕੋਲ ਜਾਂਦਿਆਂ ਵੇਖ ਕੇ ਉਸ ਤੋਂ ਜਰਿਆ ਨਾ ਗਿਆ, ਅਤੇ ਉਸ ਦੀ ਈਰਖਾ ਵਧਦੀ ਗਈ।","ਇੱਕ ਦਿਨ ਜਦੋਂ ਮੱਖਣ ਸ਼ਾਹ ਆਪਣੇ ਡੇਰੇ ਗਿਆ ਹੋਇਆ ਸੀ, ਧੀਰ ਮੱਲ ਸ਼ੀਹਾਂ ਨਾਂ ਦੇ ਬੰਦੇ ਅਤੇ ਹਥਿਆਰਬੰਦ ਟੋਲੇ ਨਾਲ ਗੁਰੂ ਜੀ ਦੇ ਘਰ ਆਇਆ। ਸ਼ੀਹਾਂ ਨੇ ਗੁਰੂ ਜੀ ਉੱਤੇ ਗੋਲੀ ਚਲਾਈ। ਗੋਲੀ ਗੁਰੂ ਜੀ ਦੇ ਮੱਥੇ ਨੂੰ ਛੂੰਹਦੀ ਲੰਘ ਗਈ। ਫਿਰ ਧੀਰ ਮੱਲ ਦੇ ਬੰਦਿਆਂ ਨੇ ਘਰ ਲੁੱਟ ਲਿਆ ਅਤੇ ਹਰ ਕੀਮਤੀ ਚੀਜ਼ ਲੈ ਗਏ, ਗੁਰੂ ਜੀ ਦੀ ਪਵਿੱਤਰ ਬੀੜ ਵੀ।","ਗੁਰੂ ਜੀ ਦੇ ਮਾਤਾ, ਮਾਤਾ ਨਾਨਕੀ ਜੀ, ਨੇ ਧੀਰ ਮੱਲ ਨੂੰ ਕਿਹਾ, 'ਜੇ ਤੇਰੇ ਵਿੱਚ ਗੁਰੂ ਵਾਲੇ ਗੁਣ ਹੁੰਦੇ, ਤਾਂ ਸਿੱਖ ਤੇਰੇ ਪਿੱਛੇ ਲੱਗਦੇ। ਹਿੰਸਾ ਨਾਲ ਤੇਰਾ ਕਦੇ ਭਲਾ ਨਹੀਂ ਹੋਣਾ।' ਜਦੋਂ ਮੱਖਣ ਸ਼ਾਹ ਨੇ ਸੁਣਿਆ, ਉਹ ਆਪਣੇ ਬੰਦਿਆਂ ਨਾਲ ਧੀਰ ਮੱਲ ਦੇ ਡੇਰੇ ਗਿਆ, ਚੋਰੀ ਦਾ ਸਾਰਾ ਸਮਾਨ ਵਾਪਸ ਲਿਆਇਆ, ਅਤੇ ਧੀਰ ਮੱਲ ਅਤੇ ਸ਼ੀਹਾਂ ਨੂੰ ਹੱਥ ਬੰਨ੍ਹ ਕੇ ਗੁਰੂ ਜੀ ਅੱਗੇ ਪੇਸ਼ ਕੀਤਾ।","ਸਭ ਨੂੰ ਲੱਗਦਾ ਸੀ ਕਿ ਗੁਰੂ ਜੀ ਸਜ਼ਾ ਦੇਣਗੇ। ਪਰ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਨੇ ਸ਼ਾਂਤੀ ਨਾਲ ਕਿਹਾ, 'ਇਨ੍ਹਾਂ ਨੂੰ ਖੋਲ੍ਹ ਦਿਓ। ਅਤੇ ਜੋ ਤੁਸੀਂ ਇਨ੍ਹਾਂ ਦੇ ਡੇਰੇ ਤੋਂ ਲਿਆਏ ਹੋ, ਉਹ ਵੀ ਮੋੜ ਦਿਓ। ਇਨ੍ਹਾਂ ਨੇ ਇਹ ਸਭ ਲਾਲਚ ਵਿੱਚ ਕੀਤਾ ਹੈ। ਜਿਸ ਚੀਜ਼ ਦੀ ਇਨ੍ਹਾਂ ਨੂੰ ਇੰਨੀ ਭੁੱਖ ਹੈ, ਉਹ ਇਨ੍ਹਾਂ ਕੋਲ ਹੀ ਰਹਿਣ ਦਿਓ।'","ਮੱਖਣ ਸ਼ਾਹ ਨੇ ਹੁਕਮ ਮੰਨਿਆ। ਉਸ ਨੇ ਪਵਿੱਤਰ ਬੀੜ ਤੋਂ ਬਿਨਾਂ ਸਭ ਕੁਝ ਮੋੜ ਦਿੱਤਾ, ਕਿਉਂਕਿ ਬੀੜ ਸੱਚੇ ਗੁਰੂ ਕੋਲ ਹੀ ਰਹਿਣੀ ਚਾਹੀਦੀ ਸੀ। ਜਿਸ ਨੇ ਵੀ ਇਹ ਵੇਖਿਆ, ਉਸ ਨੇ ਸਿੱਖਿਆ ਕਿ ਸੱਚੀ ਵਡਿਆਈ ਬਦਲਾ ਲੈਣ ਵਿੱਚ ਨਹੀਂ, ਮਾਫ਼ ਕਰਨ ਵਿੱਚ ਹੈ।"],l:"ਦੁੱਖ ਦੇਣ ਵਾਲੇ ਨੂੰ ਮਾਫ਼ ਕਰਨ ਲਈ ਬਹੁਤ ਤਾਕਤ ਚਾਹੀਦੀ ਹੈ। ਸੱਚੀ ਵਡਿਆਈ ਮਾਫ਼ੀ ਨਾਲ ਦਿਸਦੀ ਹੈ, ਬਦਲੇ ਨਾਲ ਨਹੀਂ।"}},

{id:"gurusar-hadiaya",title:"The Pond Everyone Avoided",gur:"ਗੁਰੂਸਰ",cat:"Guru Tegh Bahadur Ji",age:"Kids",where:"Hadiaya, in Malwa",mins:3,c:"#1FA38A",c2:"#F0702A",h:395,art:"well",
year:1665,loc:["hadiaya"],themes:["Equality","Humility"],
summary:"A sickness spreads through a proud village. Guru Tegh Bahadur Ji tells them where to find the cure, and they don't like the answer.",
text:["On his travels through Malwa, Guru Tegh Bahadur Ji camped under a big banyan tree outside the village of Hadiaya. Under the same tree, a sick man lay alone on a cot. He had a painful throat disease that made it hard to breathe.","'Why aren't you at home?' Guru Ji asked. The man said, 'This sickness is spreading through our village, and many people have died. I don't want my family to catch it from me, so I lie out here. Please, holy one, help me.'","Guru Ji said, 'The people of your village are proud of their high caste. They have treated the poor and the so-called low-caste people very badly. There is one cure: bathe in the pond that belongs to the leather-workers.' The people of the village had always avoided that pond, thinking it was beneath them.","The man did as Guru Ji said. His fever went down and his throat healed. When the rest of the village heard, they put their pride aside and went to bathe in the leather-workers' pond too. One by one, they got better.","The whole village came to thank Guru Ji. He told them, 'There is one God, the father of rich and poor, high and low alike. Hating others only brings suffering on ourselves.' The villagers made the pond into a beautiful pool, named it Gurusar, and promised to treat everyone as equal."],
lesson:"No one is higher or lower than anyone else. Pride and hatred make us sick inside; treating everyone as equal heals us.",
think:["Why had the villagers avoided the leather-workers' pond?","What did they have to give up before they could be healed?"],
words:[["Caste","An old system that wrongly ranked people as high or low by birth."],["Malwa","The part of Punjab south of the river Sutlej."]],
quiz:[["Where did the sick man lie?",["Under a banyan tree outside the village","In the Gurdwara","By the river"],0],["Whose pond did Guru Ji send him to?",["The leather-workers'","The king's","The temple's"],0],["What did the villagers name the pool?",["Gurusar","Ramsar","Kaulsar"],0]],
pa:{t:["ਮਾਲਵੇ ਦੀ ਯਾਤਰਾ ਦੌਰਾਨ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਨੇ ਪਿੰਡ ਹਡਿਆਇਆ ਦੇ ਬਾਹਰ ਇੱਕ ਵੱਡੇ ਬੋਹੜ ਹੇਠ ਡੇਰਾ ਲਾਇਆ। ਉਸੇ ਬੋਹੜ ਹੇਠ ਇੱਕ ਬਿਮਾਰ ਆਦਮੀ ਮੰਜੀ ਉੱਤੇ ਇਕੱਲਾ ਪਿਆ ਸੀ। ਉਸ ਦੇ ਗਲੇ ਵਿੱਚ ਦਰਦਨਾਕ ਰੋਗ ਸੀ ਜਿਸ ਨਾਲ ਸਾਹ ਲੈਣਾ ਔਖਾ ਸੀ।","ਗੁਰੂ ਜੀ ਨੇ ਪੁੱਛਿਆ, 'ਤੂੰ ਘਰ ਕਿਉਂ ਨਹੀਂ?' ਉਸ ਨੇ ਕਿਹਾ, 'ਸਾਡੇ ਪਿੰਡ ਵਿੱਚ ਇਹ ਬਿਮਾਰੀ ਫੈਲ ਰਹੀ ਹੈ, ਅਤੇ ਬਹੁਤ ਲੋਕ ਮਰ ਗਏ ਹਨ। ਮੈਂ ਨਹੀਂ ਚਾਹੁੰਦਾ ਕਿ ਮੇਰੇ ਪਰਿਵਾਰ ਨੂੰ ਇਹ ਮੈਥੋਂ ਲੱਗੇ, ਇਸ ਲਈ ਇੱਥੇ ਪਿਆ ਹਾਂ। ਸੰਤ ਜੀ, ਮੇਰੀ ਮਦਦ ਕਰੋ।'","ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਤੁਹਾਡੇ ਪਿੰਡ ਦੇ ਲੋਕਾਂ ਨੂੰ ਉੱਚੀ ਜਾਤ ਦਾ ਹੰਕਾਰ ਹੈ। ਉਨ੍ਹਾਂ ਨੇ ਗਰੀਬਾਂ ਅਤੇ ਨੀਵੀਂ ਸਮਝੀ ਜਾਂਦੀ ਜਾਤ ਵਾਲਿਆਂ ਨਾਲ ਬਹੁਤ ਮਾੜਾ ਸਲੂਕ ਕੀਤਾ ਹੈ। ਇਸ ਦਾ ਇੱਕੋ ਇਲਾਜ ਹੈ: ਚਮਿਆਰਾਂ ਦੀ ਢਾਬ ਵਿੱਚ ਇਸ਼ਨਾਨ ਕਰੋ।' ਪਿੰਡ ਦੇ ਲੋਕ ਹਮੇਸ਼ਾ ਉਸ ਢਾਬ ਤੋਂ ਦੂਰ ਰਹਿੰਦੇ ਸਨ, ਉਸ ਨੂੰ ਆਪਣੀ ਸ਼ਾਨ ਤੋਂ ਨੀਵਾਂ ਸਮਝਦੇ ਸਨ।","ਉਸ ਆਦਮੀ ਨੇ ਗੁਰੂ ਜੀ ਦਾ ਕਿਹਾ ਮੰਨਿਆ। ਉਸ ਦਾ ਬੁਖ਼ਾਰ ਉਤਰ ਗਿਆ ਅਤੇ ਗਲਾ ਠੀਕ ਹੋ ਗਿਆ। ਜਦੋਂ ਬਾਕੀ ਪਿੰਡ ਨੇ ਸੁਣਿਆ, ਉਨ੍ਹਾਂ ਨੇ ਵੀ ਹੰਕਾਰ ਛੱਡ ਕੇ ਉਸ ਢਾਬ ਵਿੱਚ ਇਸ਼ਨਾਨ ਕੀਤਾ। ਇੱਕ-ਇੱਕ ਕਰਕੇ ਸਾਰੇ ਠੀਕ ਹੋ ਗਏ।","ਸਾਰਾ ਪਿੰਡ ਗੁਰੂ ਜੀ ਦਾ ਧੰਨਵਾਦ ਕਰਨ ਆਇਆ। ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਇੱਕੋ ਰੱਬ ਅਮੀਰ-ਗਰੀਬ, ਉੱਚੇ-ਨੀਵੇਂ ਸਭ ਦਾ ਪਿਤਾ ਹੈ। ਦੂਜਿਆਂ ਨਾਲ ਨਫ਼ਰਤ ਸਾਨੂੰ ਆਪ ਨੂੰ ਹੀ ਦੁੱਖ ਦਿੰਦੀ ਹੈ।' ਪਿੰਡ ਵਾਲਿਆਂ ਨੇ ਢਾਬ ਨੂੰ ਸੋਹਣਾ ਸਰੋਵਰ ਬਣਾਇਆ, ਉਸ ਦਾ ਨਾਂ ਗੁਰੂਸਰ ਰੱਖਿਆ, ਅਤੇ ਸਭ ਨੂੰ ਬਰਾਬਰ ਸਮਝਣ ਦਾ ਪ੍ਰਣ ਕੀਤਾ।"],l:"ਕੋਈ ਕਿਸੇ ਤੋਂ ਉੱਚਾ ਜਾਂ ਨੀਵਾਂ ਨਹੀਂ। ਹੰਕਾਰ ਅਤੇ ਨਫ਼ਰਤ ਸਾਨੂੰ ਅੰਦਰੋਂ ਬਿਮਾਰ ਕਰਦੇ ਹਨ; ਸਭ ਨੂੰ ਬਰਾਬਰ ਸਮਝਣਾ ਤੰਦਰੁਸਤ ਕਰਦਾ ਹੈ।"}},

{id:"tobacco-barna",title:"The Farmer of Barna",gur:"ਤੰਬਾਕੂ ਤੋਂ ਦੂਰ",cat:"Guru Tegh Bahadur Ji",age:"Kids",where:"Village Barna, near Kaithal",mins:2,c:"#2FA45A",c2:"#F2B229",h:390,art:"hut",
year:1665,approx:1,loc:[],themes:["Faith","Honesty"],
summary:"A Sikh farmer welcomes Guru Tegh Bahadur Ji into his home. Before leaving, the Guru asks him to keep away from one thing.",
text:["On his travels, Guru Tegh Bahadur Ji came to the village of Barna. He asked a man outside the village, 'Does any Sikh of Guru Nanak live here?' The man said, 'There is one farmer who is a Sikh.' Guru Ji asked him to call the farmer.","The farmer came running and bowed with joy. 'Please come to my house and rest,' he said. 'I'll be back soon. The officials are measuring my fields today to work out my taxes.'","When he came home, the happy farmer served Guru Ji with great love. Before Guru Ji left, he gave the farmer a piece of advice. 'Dear Sikh, never use tobacco. Don't even touch it, or bring it into your home. It brings sickness, and it brings poverty too.'","In those days, smoking tobacco was spreading quickly among both rich and poor, because tobacco was cheap. Many people did not realise how much harm it did to the body and mind. Guru Ji could see clearly that it was bad for people, and he wanted his Sikhs to stay healthy.","The farmer promised never to touch tobacco, and he kept his promise. Later, Guru Gobind Singh Ji made it one of the firm rules for every Sikh of the Khalsa: tobacco is never to be used."],
lesson:"Our bodies are a gift. We should keep away from things like tobacco that harm our health.",
think:["Why did Guru Ji say tobacco brings poverty too?","What are some ways we can look after our bodies?"],
words:[["Tobacco","A plant that is smoked or chewed; it is very harmful to health."],["Khalsa","The community of initiated Sikhs, created by Guru Gobind Singh Ji."]],
quiz:[["What were the officials doing to the farmer's fields?",["Measuring them for taxes","Planting trees","Building a road"],0],["What did Guru Ji ask the farmer never to use?",["Tobacco","Salt","Sugar"],0],["Which Guru made this a firm rule for the Khalsa?",["Guru Gobind Singh Ji","Guru Nanak Dev Ji","Guru Har Rai Sahib Ji"],0]],
pa:{t:["ਯਾਤਰਾ ਦੌਰਾਨ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਪਿੰਡ ਬਰਨੇ ਪਹੁੰਚੇ। ਉਨ੍ਹਾਂ ਨੇ ਪਿੰਡੋਂ ਬਾਹਰ ਇੱਕ ਆਦਮੀ ਨੂੰ ਪੁੱਛਿਆ, 'ਕੀ ਇੱਥੇ ਗੁਰੂ ਨਾਨਕ ਦਾ ਕੋਈ ਸਿੱਖ ਰਹਿੰਦਾ ਹੈ?' ਉਸ ਨੇ ਕਿਹਾ, 'ਇੱਕ ਕਿਸਾਨ ਸਿੱਖ ਹੈ।' ਗੁਰੂ ਜੀ ਨੇ ਉਸ ਨੂੰ ਕਿਸਾਨ ਨੂੰ ਸੱਦਣ ਲਈ ਕਿਹਾ।","ਕਿਸਾਨ ਦੌੜਦਾ ਆਇਆ ਅਤੇ ਖ਼ੁਸ਼ੀ ਨਾਲ ਮੱਥਾ ਟੇਕਿਆ। ਉਸ ਨੇ ਕਿਹਾ, 'ਮੇਰੇ ਘਰ ਚੱਲ ਕੇ ਆਰਾਮ ਕਰੋ। ਮੈਂ ਛੇਤੀ ਮੁੜਦਾ ਹਾਂ। ਅੱਜ ਅਹਿਲਕਾਰ ਮਾਲੀਆ ਲਾਉਣ ਲਈ ਮੇਰੇ ਖੇਤ ਮਿਣ ਰਹੇ ਹਨ।'","ਘਰ ਮੁੜ ਕੇ ਖ਼ੁਸ਼ ਕਿਸਾਨ ਨੇ ਬੜੇ ਪਿਆਰ ਨਾਲ ਗੁਰੂ ਜੀ ਦੀ ਸੇਵਾ ਕੀਤੀ। ਜਾਣ ਤੋਂ ਪਹਿਲਾਂ ਗੁਰੂ ਜੀ ਨੇ ਉਸ ਨੂੰ ਇੱਕ ਸਿੱਖਿਆ ਦਿੱਤੀ, 'ਪਿਆਰੇ ਸਿੱਖ, ਕਦੇ ਤੰਬਾਕੂ ਨਾ ਵਰਤੀਂ। ਇਸ ਨੂੰ ਹੱਥ ਵੀ ਨਾ ਲਾਈਂ, ਨਾ ਘਰ ਲਿਆਈਂ। ਇਹ ਬਿਮਾਰੀ ਵੀ ਲਿਆਉਂਦਾ ਹੈ ਅਤੇ ਗਰੀਬੀ ਵੀ।'","ਉਨ੍ਹਾਂ ਦਿਨਾਂ ਵਿੱਚ ਤੰਬਾਕੂ ਸਸਤਾ ਹੋਣ ਕਰਕੇ ਅਮੀਰਾਂ ਅਤੇ ਗਰੀਬਾਂ ਦੋਹਾਂ ਵਿੱਚ ਇਸ ਦੀ ਵਰਤੋਂ ਤੇਜ਼ੀ ਨਾਲ ਵਧ ਰਹੀ ਸੀ। ਬਹੁਤੇ ਲੋਕ ਨਹੀਂ ਜਾਣਦੇ ਸਨ ਕਿ ਇਹ ਸਰੀਰ ਅਤੇ ਮਨ ਦਾ ਕਿੰਨਾ ਨੁਕਸਾਨ ਕਰਦਾ ਹੈ। ਗੁਰੂ ਜੀ ਸਾਫ਼ ਵੇਖ ਸਕਦੇ ਸਨ ਕਿ ਇਹ ਲੋਕਾਂ ਲਈ ਮਾੜਾ ਹੈ, ਅਤੇ ਉਹ ਚਾਹੁੰਦੇ ਸਨ ਕਿ ਸਿੱਖ ਤੰਦਰੁਸਤ ਰਹਿਣ।","ਕਿਸਾਨ ਨੇ ਤੰਬਾਕੂ ਨੂੰ ਕਦੇ ਹੱਥ ਨਾ ਲਾਉਣ ਦਾ ਪ੍ਰਣ ਕੀਤਾ, ਅਤੇ ਨਿਭਾਇਆ। ਬਾਅਦ ਵਿੱਚ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨੇ ਖ਼ਾਲਸੇ ਦੇ ਹਰ ਸਿੱਖ ਲਈ ਇਹ ਪੱਕਾ ਨਿਯਮ ਬਣਾ ਦਿੱਤਾ: ਤੰਬਾਕੂ ਕਦੇ ਨਹੀਂ ਵਰਤਣਾ।"],l:"ਸਾਡਾ ਸਰੀਰ ਇੱਕ ਦਾਤ ਹੈ। ਤੰਬਾਕੂ ਵਰਗੀਆਂ ਸਿਹਤ ਨੂੰ ਨੁਕਸਾਨ ਪਹੁੰਚਾਉਣ ਵਾਲੀਆਂ ਚੀਜ਼ਾਂ ਤੋਂ ਦੂਰ ਰਹਿਣਾ ਚਾਹੀਦਾ ਹੈ।"}},

{id:"bitter-melon",title:"The Bitter Melon",gur:"ਕੌੜਾ ਤੂੰਬਾ",cat:"Guru Tegh Bahadur Ji",age:"Kids",where:"Thanesar, on the Saraswati",mins:2,c:"#F0702A",c2:"#3B5BDB",h:395,art:"eclipse",
year:1665,approx:1,loc:["thanesar"],themes:["Honesty","Sewa"],
summary:"During an eclipse, crowds rush to bathe in the river. Guru Tegh Bahadur Ji keeps the langar going, and the priests come to complain.",
text:["Guru Tegh Bahadur Ji camped on the bank of the river Saraswati at Thanesar. He asked the musicians to sing kirtan, and asked the Sikhs to cook food and serve everyone who came.","That day there was a solar eclipse. Huge crowds rushed to bathe in the river, believing that bathing during the eclipse would wash away their sins. But at the Guru's camp, the kirtan carried on and the langar kept serving hungry people, as on any other day.","Some priests came and said, 'The eclipse has begun! Go and bathe in the river, and tell your Sikhs to bathe too, so their sins are washed away.'","Guru Ji answered, 'You can wash a bitter melon in water as many times as you like, but it will still be bitter inside. In the same way, washing the body doesn't wash away the bad deeds we have done. Worse, some people may think: I'll bathe again next year, so I can do whatever I like until then.'","'Then how can we be free of our bad deeds?' the priests asked. Guru Ji said, 'By remembering God's Name, and by changing the way we live.' The priests had no answer, and went back the way they had come."],
lesson:"Being clean on the outside doesn't make us good on the inside. Only changing how we live can make us better.",
think:["What did the bitter melon teach the priests?","Why did the langar carry on during the eclipse?"],
words:[["Eclipse","When the moon blocks the sun's light."],["Langar","The free community kitchen where everyone eats together."]],
quiz:[["What did Guru Ji compare washing away sins to?",["Washing a bitter melon","Cleaning a pot","Bathing a horse"],0],["What carried on at the Guru's camp during the eclipse?",["Kirtan and langar","A horse race","A market"],0],["What did Guru Ji say frees us from bad deeds?",["Remembering God and changing how we live","Bathing in a river","Paying priests"],0]],
pa:{t:["ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਨੇ ਥਾਨੇਸਰ ਵਿਖੇ ਸਰਸਵਤੀ ਨਦੀ ਕੰਢੇ ਡੇਰਾ ਲਾਇਆ। ਉਨ੍ਹਾਂ ਨੇ ਰਾਗੀਆਂ ਨੂੰ ਕੀਰਤਨ ਕਰਨ ਅਤੇ ਸਿੱਖਾਂ ਨੂੰ ਲੰਗਰ ਪਕਾ ਕੇ ਆਉਣ ਵਾਲੇ ਹਰ ਕਿਸੇ ਨੂੰ ਛਕਾਉਣ ਲਈ ਕਿਹਾ।","ਉਸ ਦਿਨ ਸੂਰਜ ਗ੍ਰਹਿਣ ਸੀ। ਭਾਰੀ ਭੀੜ ਨਦੀ ਵਿੱਚ ਨਹਾਉਣ ਲਈ ਦੌੜੀ, ਇਹ ਮੰਨ ਕੇ ਕਿ ਗ੍ਰਹਿਣ ਵੇਲੇ ਇਸ਼ਨਾਨ ਨਾਲ ਪਾਪ ਧੁਲ ਜਾਂਦੇ ਹਨ। ਪਰ ਗੁਰੂ ਜੀ ਦੇ ਡੇਰੇ ਵਿੱਚ ਹੋਰ ਦਿਨਾਂ ਵਾਂਗ ਕੀਰਤਨ ਚੱਲਦਾ ਰਿਹਾ ਅਤੇ ਲੰਗਰ ਵਰਤਦਾ ਰਿਹਾ।","ਕੁਝ ਪੁਜਾਰੀ ਆਏ ਅਤੇ ਬੋਲੇ, 'ਗ੍ਰਹਿਣ ਲੱਗ ਗਿਆ ਹੈ! ਨਦੀ ਵਿੱਚ ਇਸ਼ਨਾਨ ਕਰੋ, ਅਤੇ ਆਪਣੇ ਸਿੱਖਾਂ ਨੂੰ ਵੀ ਕਹੋ, ਤਾਂ ਜੋ ਉਨ੍ਹਾਂ ਦੇ ਪਾਪ ਧੁਲ ਜਾਣ।'","ਗੁਰੂ ਜੀ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, 'ਕੌੜੇ ਤੂੰਬੇ ਨੂੰ ਜਿੰਨੀ ਵਾਰ ਮਰਜ਼ੀ ਪਾਣੀ ਨਾਲ ਧੋ ਲਓ, ਅੰਦਰੋਂ ਕੌੜਾ ਹੀ ਰਹੇਗਾ। ਇਸੇ ਤਰ੍ਹਾਂ ਸਰੀਰ ਧੋਣ ਨਾਲ ਕੀਤੇ ਮਾੜੇ ਕਰਮ ਨਹੀਂ ਧੁਲਦੇ। ਸਗੋਂ ਕੁਝ ਲੋਕ ਸੋਚਣ ਲੱਗ ਪੈਂਦੇ ਹਨ ਕਿ ਅਗਲੇ ਸਾਲ ਫਿਰ ਨਹਾ ਲਵਾਂਗੇ, ਤਦ ਤੱਕ ਜੋ ਮਰਜ਼ੀ ਕਰੀਏ।'","ਪੁਜਾਰੀਆਂ ਨੇ ਪੁੱਛਿਆ, 'ਫਿਰ ਮਾੜੇ ਕਰਮਾਂ ਤੋਂ ਛੁਟਕਾਰਾ ਕਿਵੇਂ ਮਿਲੇ?' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਰੱਬ ਦਾ ਨਾਮ ਯਾਦ ਕਰ ਕੇ, ਅਤੇ ਆਪਣਾ ਜੀਵਨ ਬਦਲ ਕੇ।' ਪੁਜਾਰੀਆਂ ਕੋਲ ਕੋਈ ਜਵਾਬ ਨਾ ਸੀ, ਅਤੇ ਉਹ ਜਿਧਰੋਂ ਆਏ ਸਨ ਉਧਰ ਮੁੜ ਗਏ।"],l:"ਬਾਹਰੋਂ ਸਾਫ਼ ਹੋਣ ਨਾਲ ਅਸੀਂ ਅੰਦਰੋਂ ਚੰਗੇ ਨਹੀਂ ਬਣਦੇ। ਸਿਰਫ਼ ਜੀਵਨ ਬਦਲਣ ਨਾਲ ਹੀ ਅਸੀਂ ਬਿਹਤਰ ਬਣ ਸਕਦੇ ਹਾਂ।"}},

{id:"no-miracles",title:"No Miracles for the Emperor",gur:"ਕਰਾਮਾਤ ਤੋਂ ਇਨਕਾਰ",cat:"Guru Tegh Bahadur Ji",age:"Kids",where:"Delhi",mins:2,c:"#1E1E24",c2:"#F2B229",h:400,art:"palace",
year:1665,loc:["delhi"],themes:["Courage","Humility"],
summary:"Emperor Aurangzeb calls Guru Tegh Bahadur Ji to Delhi, hoping to see a miracle. The Guru gives him something else.",
text:["Emperor Aurangzeb had heard stories about the wonders of Ram Rai and Guru Harkrishan Sahib Ji. Now he wanted to see what the new Guru could do. He sent a messenger to bring Guru Tegh Bahadur Ji to Delhi.","The messenger found Guru Ji at the village of Dhamtan in Malwa. Guru Ji agreed to go, and along the way he kept holding sangats and teaching people about the one God. In Delhi, Raja Ram Singh, the son of Mirza Raja Jai Singh, arranged for Guru Ji to stay at his home.","In the royal court, Aurangzeb asked, 'Show me a miracle, so that I know your greatness.' Guru Ji answered calmly, 'To show off a miracle is like trying to compete with God. Everything happens by God's will. A true person of God lives humbly in His will and does not show off powers.'","Guru Ji went on, 'God has given you the rule of a great country. It is your duty to look after all your people fairly, whatever their faith, and to protect the weak.'","Aurangzeb was not pleased, but Raja Ram Singh spoke up for the Guru, and Guru Ji was allowed to leave. He set off on a long journey to the east, carrying Guru Nanak's message to the people of many lands."],
lesson:"True holy people don't show off. Living humbly in God's will is greater than any miracle.",
think:["Why did Guru Ji refuse to show a miracle?","What did Guru Ji say was the emperor's duty?"],
words:[["Miracle","Something amazing that seems impossible."],["Court","The place where a king meets people and makes decisions."]],
quiz:[["What did Aurangzeb want to see?",["A miracle","A horse race","A new book"],0],["Who arranged for Guru Ji to stay in Delhi?",["Raja Ram Singh","Chandu","Dhir Mal"],0],["What did Guru Ji say showing off a miracle is like?",["Competing with God","Playing a game","Telling a story"],0]],
pa:{t:["ਬਾਦਸ਼ਾਹ ਔਰੰਗਜ਼ੇਬ ਨੇ ਰਾਮ ਰਾਇ ਅਤੇ ਗੁਰੂ ਹਰਿਕ੍ਰਿਸ਼ਨ ਸਾਹਿਬ ਜੀ ਦੀਆਂ ਕਰਾਮਾਤਾਂ ਦੀਆਂ ਗੱਲਾਂ ਸੁਣੀਆਂ ਸਨ। ਹੁਣ ਉਹ ਵੇਖਣਾ ਚਾਹੁੰਦਾ ਸੀ ਕਿ ਨਵੇਂ ਗੁਰੂ ਕੀ ਕਰ ਸਕਦੇ ਹਨ। ਉਸ ਨੇ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਨੂੰ ਦਿੱਲੀ ਲਿਆਉਣ ਲਈ ਇੱਕ ਹਲਕਾਰਾ ਭੇਜਿਆ।","ਹਲਕਾਰੇ ਨੂੰ ਗੁਰੂ ਜੀ ਮਾਲਵੇ ਦੇ ਪਿੰਡ ਧਮਤਾਨ ਵਿੱਚ ਮਿਲੇ। ਗੁਰੂ ਜੀ ਜਾਣ ਲਈ ਮੰਨ ਗਏ, ਅਤੇ ਰਾਹ ਵਿੱਚ ਸੰਗਤਾਂ ਨੂੰ ਇੱਕ ਰੱਬ ਬਾਰੇ ਉਪਦੇਸ਼ ਦਿੰਦੇ ਗਏ। ਦਿੱਲੀ ਵਿੱਚ ਮਿਰਜ਼ਾ ਰਾਜਾ ਜੈ ਸਿੰਘ ਦੇ ਪੁੱਤਰ ਰਾਜਾ ਰਾਮ ਸਿੰਘ ਨੇ ਗੁਰੂ ਜੀ ਦੇ ਆਪਣੇ ਘਰ ਠਹਿਰਨ ਦਾ ਪ੍ਰਬੰਧ ਕੀਤਾ।","ਸ਼ਾਹੀ ਦਰਬਾਰ ਵਿੱਚ ਔਰੰਗਜ਼ੇਬ ਨੇ ਕਿਹਾ, 'ਕੋਈ ਕਰਾਮਾਤ ਵਿਖਾਓ, ਤਾਂ ਜੋ ਮੈਨੂੰ ਤੁਹਾਡੀ ਵਡਿਆਈ ਦਾ ਪਤਾ ਲੱਗੇ।' ਗੁਰੂ ਜੀ ਨੇ ਸ਼ਾਂਤੀ ਨਾਲ ਜਵਾਬ ਦਿੱਤਾ, 'ਕਰਾਮਾਤ ਵਿਖਾਉਣਾ ਰੱਬ ਨਾਲ ਸ਼ਰੀਕਾ ਕਰਨ ਵਾਂਗ ਹੈ। ਸਭ ਕੁਝ ਰੱਬ ਦੇ ਭਾਣੇ ਵਿੱਚ ਹੁੰਦਾ ਹੈ। ਰੱਬ ਦਾ ਸੱਚਾ ਬੰਦਾ ਨਿਮਰਤਾ ਨਾਲ ਭਾਣੇ ਵਿੱਚ ਰਹਿੰਦਾ ਹੈ ਅਤੇ ਸ਼ਕਤੀਆਂ ਦਾ ਦਿਖਾਵਾ ਨਹੀਂ ਕਰਦਾ।'","ਗੁਰੂ ਜੀ ਨੇ ਅੱਗੇ ਕਿਹਾ, 'ਰੱਬ ਨੇ ਤੁਹਾਨੂੰ ਇੱਕ ਵੱਡੇ ਦੇਸ਼ ਦਾ ਰਾਜ ਦਿੱਤਾ ਹੈ। ਤੁਹਾਡਾ ਫ਼ਰਜ਼ ਹੈ ਕਿ ਸਾਰੀ ਪਰਜਾ ਦੀ ਨਿਆਂ ਨਾਲ ਸੰਭਾਲ ਕਰੋ, ਭਾਵੇਂ ਕਿਸੇ ਦਾ ਕੋਈ ਵੀ ਧਰਮ ਹੋਵੇ, ਅਤੇ ਕਮਜ਼ੋਰਾਂ ਦੀ ਰੱਖਿਆ ਕਰੋ।'","ਔਰੰਗਜ਼ੇਬ ਖ਼ੁਸ਼ ਨਾ ਹੋਇਆ, ਪਰ ਰਾਜਾ ਰਾਮ ਸਿੰਘ ਨੇ ਗੁਰੂ ਜੀ ਦੇ ਹੱਕ ਵਿੱਚ ਗੱਲ ਕੀਤੀ, ਅਤੇ ਗੁਰੂ ਜੀ ਨੂੰ ਜਾਣ ਦਿੱਤਾ ਗਿਆ। ਉਹ ਪੂਰਬ ਦੀ ਲੰਮੀ ਯਾਤਰਾ ਉੱਤੇ ਤੁਰ ਪਏ, ਅਤੇ ਕਈ ਦੇਸ਼ਾਂ ਦੇ ਲੋਕਾਂ ਤੱਕ ਗੁਰੂ ਨਾਨਕ ਦਾ ਸੁਨੇਹਾ ਪਹੁੰਚਾਇਆ।"],l:"ਸੱਚੇ ਸੰਤ ਦਿਖਾਵਾ ਨਹੀਂ ਕਰਦੇ। ਨਿਮਰਤਾ ਨਾਲ ਰੱਬ ਦੇ ਭਾਣੇ ਵਿੱਚ ਰਹਿਣਾ ਕਿਸੇ ਵੀ ਕਰਾਮਾਤ ਤੋਂ ਵੱਡਾ ਹੈ।"}},

{id:"agra-householder",title:"Don't Leave Your Family",gur:"ਗ੍ਰਿਹਸਤ ਦੀ ਵਡਿਆਈ",cat:"Guru Tegh Bahadur Ji",age:"Kids",where:"Agra",mins:3,c:"#E8743A",c2:"#1590B0",h:395,art:"hut",
year:1666,approx:1,loc:["agra"],themes:["Sewa","Faith"],
summary:"In Agra, an old woman's long wish comes true. Then a worried wife asks Guru Tegh Bahadur Ji to stop her husband from leaving home.",
text:["On his journey east, Guru Tegh Bahadur Ji reached Agra. There lived an old woman, also called Mai Bhago. For years she had spun cloth with her own hands and sewn a robe for the Guru, and every day she prayed, 'True King, please come and wear the robe I have made for you.'","One day Guru Ji was standing at her door! Mai Bhago was overjoyed. Even though she was old and frail, she served him with her own hands, and Guru Ji stayed with her for more than a month. Her home is still remembered as Mai Than.","While Guru Ji was in Agra, a woman came to the morning sangat in tears. 'My husband wants to become a hermit and leave me and our three children,' she said. 'If he goes, my children will have to beg. Please talk to him.'","Guru Ji called the husband. 'I want to find God,' the man said, 'but while I live with my family, I am tied up in worldly things.' Guru Ji said, 'Brother, who will care for your children if you go? Even as a hermit you'll be hungry, and you'll beg at the doors of families like yours. You don't find God by leaving home. You find God by following His will: by caring for those who need you, and by giving up greed, not giving up your family.'","The man understood. He gave up the idea of leaving and stayed with his family, and the whole family became devoted Sikhs. Guru Ji had shown them that a family life lived well is a path to God."],
lesson:"We don't need to leave our families to find God. Looking after the people who depend on us, honestly and without greed, is a holy way to live.",
think:["Why did Guru Ji say the man would still need families even as a hermit?","How can we remember God while doing everyday things at home?"],
words:[["Hermit","Someone who leaves home to live alone for religious reasons."],["Grihasth","Family life; living as a householder."]],
quiz:[["What had Mai Bhago of Agra made for the Guru?",["A robe from cloth she spun","A pair of shoes","A wooden bed"],0],["What did the worried wife ask Guru Ji?",["To stop her husband leaving the family","To give her money","To build her a house"],0],["Where did Guru Ji say we find God?",["By following His will and caring for those who need us","Only in the forest","Only on mountains"],0]],
pa:{t:["ਪੂਰਬ ਦੀ ਯਾਤਰਾ ਦੌਰਾਨ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਆਗਰੇ ਪਹੁੰਚੇ। ਉੱਥੇ ਇੱਕ ਬਜ਼ੁਰਗ ਮਾਈ ਰਹਿੰਦੀ ਸੀ, ਜਿਸ ਦਾ ਨਾਂ ਵੀ ਮਾਈ ਭਾਗੋ ਸੀ। ਸਾਲਾਂ ਤੋਂ ਉਸ ਨੇ ਆਪਣੇ ਹੱਥੀਂ ਸੂਤ ਕੱਤ ਕੇ ਗੁਰੂ ਜੀ ਲਈ ਚੋਲਾ ਸੀਤਾ ਸੀ, ਅਤੇ ਹਰ ਰੋਜ਼ ਅਰਦਾਸ ਕਰਦੀ, 'ਸੱਚੇ ਪਾਤਸ਼ਾਹ, ਆ ਕੇ ਮੇਰਾ ਬਣਾਇਆ ਚੋਲਾ ਪਹਿਨੋ।'","ਇੱਕ ਦਿਨ ਗੁਰੂ ਜੀ ਉਸ ਦੇ ਦਰ ਉੱਤੇ ਖੜ੍ਹੇ ਸਨ! ਮਾਈ ਭਾਗੋ ਦੀ ਖ਼ੁਸ਼ੀ ਦਾ ਕੋਈ ਟਿਕਾਣਾ ਨਾ ਰਿਹਾ। ਬਿਰਧ ਅਤੇ ਕਮਜ਼ੋਰ ਹੋਣ ਦੇ ਬਾਵਜੂਦ ਉਸ ਨੇ ਆਪਣੇ ਹੱਥੀਂ ਸੇਵਾ ਕੀਤੀ, ਅਤੇ ਗੁਰੂ ਜੀ ਇੱਕ ਮਹੀਨੇ ਤੋਂ ਵੱਧ ਉਸ ਕੋਲ ਠਹਿਰੇ। ਉਸ ਦਾ ਘਰ ਅੱਜ ਵੀ ਮਾਈ ਥਾਨ ਵਜੋਂ ਯਾਦ ਕੀਤਾ ਜਾਂਦਾ ਹੈ।","ਜਦੋਂ ਗੁਰੂ ਜੀ ਆਗਰੇ ਵਿੱਚ ਸਨ, ਇੱਕ ਔਰਤ ਰੋਂਦੀ ਹੋਈ ਸਵੇਰ ਦੀ ਸੰਗਤ ਵਿੱਚ ਆਈ। ਉਸ ਨੇ ਕਿਹਾ, 'ਮੇਰਾ ਪਤੀ ਸਾਧ ਬਣ ਕੇ ਮੈਨੂੰ ਅਤੇ ਤਿੰਨ ਬੱਚਿਆਂ ਨੂੰ ਛੱਡਣਾ ਚਾਹੁੰਦਾ ਹੈ। ਜੇ ਉਹ ਚਲਾ ਗਿਆ, ਮੇਰੇ ਬੱਚਿਆਂ ਨੂੰ ਮੰਗਣਾ ਪਵੇਗਾ। ਉਸ ਨੂੰ ਸਮਝਾਓ।'","ਗੁਰੂ ਜੀ ਨੇ ਪਤੀ ਨੂੰ ਸੱਦਿਆ। ਉਸ ਨੇ ਕਿਹਾ, 'ਮੈਂ ਰੱਬ ਨੂੰ ਲੱਭਣਾ ਚਾਹੁੰਦਾ ਹਾਂ, ਪਰ ਪਰਿਵਾਰ ਵਿੱਚ ਰਹਿੰਦਿਆਂ ਮੈਂ ਦੁਨਿਆਵੀ ਮੋਹ ਵਿੱਚ ਫਸਿਆ ਰਹਿੰਦਾ ਹਾਂ।' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਭਾਈ, ਤੇਰੇ ਜਾਣ ਤੋਂ ਬਾਅਦ ਬੱਚਿਆਂ ਦੀ ਸੰਭਾਲ ਕੌਣ ਕਰੇਗਾ? ਸਾਧ ਬਣ ਕੇ ਵੀ ਭੁੱਖ ਲੱਗੇਗੀ, ਅਤੇ ਤੂੰ ਤੇਰੇ ਵਰਗੇ ਗ੍ਰਿਹਸਤੀਆਂ ਦੇ ਦਰਾਂ ਉੱਤੇ ਮੰਗੇਂਗਾ। ਰੱਬ ਘਰ ਛੱਡ ਕੇ ਨਹੀਂ ਮਿਲਦਾ। ਰੱਬ ਉਸ ਦਾ ਹੁਕਮ ਮੰਨ ਕੇ ਮਿਲਦਾ ਹੈ: ਜਿਨ੍ਹਾਂ ਨੂੰ ਤੇਰੀ ਲੋੜ ਹੈ ਉਨ੍ਹਾਂ ਦੀ ਸੰਭਾਲ ਕਰ ਕੇ, ਅਤੇ ਲਾਲਚ ਛੱਡ ਕੇ, ਪਰਿਵਾਰ ਛੱਡ ਕੇ ਨਹੀਂ।'","ਉਹ ਆਦਮੀ ਸਮਝ ਗਿਆ। ਉਸ ਨੇ ਘਰ ਛੱਡਣ ਦਾ ਖ਼ਿਆਲ ਤਿਆਗ ਦਿੱਤਾ ਅਤੇ ਪਰਿਵਾਰ ਨਾਲ ਰਿਹਾ, ਅਤੇ ਸਾਰਾ ਪਰਿਵਾਰ ਗੁਰੂ ਘਰ ਦਾ ਸ਼ਰਧਾਲੂ ਬਣ ਗਿਆ। ਗੁਰੂ ਜੀ ਨੇ ਵਿਖਾ ਦਿੱਤਾ ਕਿ ਚੰਗੀ ਤਰ੍ਹਾਂ ਜੀਵਿਆ ਗ੍ਰਿਹਸਤ ਜੀਵਨ ਵੀ ਰੱਬ ਤੱਕ ਪਹੁੰਚਣ ਦਾ ਰਾਹ ਹੈ।"],l:"ਰੱਬ ਨੂੰ ਲੱਭਣ ਲਈ ਪਰਿਵਾਰ ਛੱਡਣ ਦੀ ਲੋੜ ਨਹੀਂ। ਸਾਡੇ ਉੱਤੇ ਨਿਰਭਰ ਲੋਕਾਂ ਦੀ ਈਮਾਨਦਾਰੀ ਨਾਲ ਅਤੇ ਬਿਨਾਂ ਲਾਲਚ ਸੰਭਾਲ ਕਰਨਾ ਇੱਕ ਪਵਿੱਤਰ ਜੀਵਨ ਹੈ।"}},

{id:"malook-das",title:"Malook Das Changes His Mind",gur:"ਮਲੂਕ ਦਾਸ ਦਾ ਭਰਮ",cat:"Guru Tegh Bahadur Ji",age:"Kids",where:"Kara Manakpur",mins:2,c:"#8E3FB8",c2:"#F2B229",h:390,art:"temple",
year:1666,approx:1,loc:[],themes:["Humility","Faith"],
summary:"A holy man is excited to meet Guru Tegh Bahadur Ji, until he hears gossip about the Guru's Sikhs and decides to stay away.",
text:["Guru Tegh Bahadur Ji reached Kara Manakpur, beyond Kanpur. A holy man named Malook Das lived there. He had heard so much praise of the Guru that he was getting ready to visit him.","Just then, some people passing by told him, 'The Guru's Sikhs are armed, and they eat food you would never eat.' Malook Das changed his mind. 'Then it isn't right for someone like me to go there,' he thought proudly, and he stayed at home.","That evening, as usual, Malook Das placed his food before his idol before eating. When he lifted the cloth from his plate, he was astonished. The food was not what he had cooked at all!","He sat and thought for a long time. 'The Guru is teaching me something,' he realised. 'I was judging the Guru and his Sikhs by what people said about them, and by what they eat. But God made everything, and God is in everything. These differences are only in my own mind. How foolish of me to stay away because of gossip!'","The next morning, Malook Das went to meet Guru Ji, who welcomed him warmly. 'Is there any other doubt in your mind?' asked Guru Ji. 'You have cleared away all my doubts,' said Malook Das. He invited Guru Ji to his home and served him with love. He said, 'All my life I have offered food to stone idols. Today I am serving a living man of God.'"],
lesson:"Don't judge people by gossip or by small differences. Meet them with an open heart, and see God in everyone.",
think:["Why did Malook Das first decide not to visit the Guru?","Have you ever changed your mind about someone after really getting to know them?"],
words:[["Gossip","Talk about other people that may not be true or kind."],["Idol","A statue that people worship."]],
quiz:[["Why did Malook Das stay home at first?",["He heard gossip about the Guru's Sikhs","He was ill","It was raining"],0],["What surprised him at dinner?",["His food had changed","His idol was gone","His house was empty"],0],["What did he realise?",["The differences were only in his own mind","He should move away","He was very hungry"],0]],
pa:{t:["ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਕਾਨਪੁਰ ਤੋਂ ਅੱਗੇ ਕੜਾ ਮਾਨਕਪੁਰ ਪਹੁੰਚੇ। ਉੱਥੇ ਮਲੂਕ ਦਾਸ ਨਾਂ ਦਾ ਇੱਕ ਸਾਧੂ ਰਹਿੰਦਾ ਸੀ। ਉਸ ਨੇ ਗੁਰੂ ਜੀ ਦੀ ਇੰਨੀ ਸਿਫ਼ਤ ਸੁਣੀ ਸੀ ਕਿ ਉਹ ਦਰਸ਼ਨਾਂ ਲਈ ਜਾਣ ਦੀ ਤਿਆਰੀ ਕਰ ਰਿਹਾ ਸੀ।","ਉਸੇ ਵੇਲੇ ਕੁਝ ਲੰਘਦੇ ਲੋਕਾਂ ਨੇ ਉਸ ਨੂੰ ਦੱਸਿਆ, 'ਗੁਰੂ ਜੀ ਦੇ ਸਿੱਖ ਸ਼ਸਤਰਧਾਰੀ ਹਨ, ਅਤੇ ਉਹ ਅਜਿਹਾ ਭੋਜਨ ਖਾਂਦੇ ਹਨ ਜੋ ਤੁਸੀਂ ਕਦੇ ਨਾ ਖਾਓ।' ਮਲੂਕ ਦਾਸ ਨੇ ਮਨ ਬਦਲ ਲਿਆ। ਉਸ ਨੇ ਮਾਣ ਨਾਲ ਸੋਚਿਆ, 'ਫਿਰ ਮੇਰੇ ਵਰਗੇ ਦਾ ਉੱਥੇ ਜਾਣਾ ਠੀਕ ਨਹੀਂ,' ਅਤੇ ਘਰ ਹੀ ਰਿਹਾ।","ਉਸ ਸ਼ਾਮ ਰੋਜ਼ ਵਾਂਗ ਮਲੂਕ ਦਾਸ ਨੇ ਖਾਣ ਤੋਂ ਪਹਿਲਾਂ ਆਪਣਾ ਭੋਜਨ ਮੂਰਤੀ ਅੱਗੇ ਰੱਖਿਆ। ਜਦੋਂ ਉਸ ਨੇ ਥਾਲੀ ਤੋਂ ਕੱਪੜਾ ਚੁੱਕਿਆ, ਉਹ ਹੈਰਾਨ ਰਹਿ ਗਿਆ। ਭੋਜਨ ਉਹ ਸੀ ਹੀ ਨਹੀਂ ਜੋ ਉਸ ਨੇ ਪਕਾਇਆ ਸੀ!","ਉਹ ਬਹੁਤ ਦੇਰ ਬੈਠਾ ਸੋਚਦਾ ਰਿਹਾ। ਉਸ ਨੂੰ ਸਮਝ ਆਈ, 'ਗੁਰੂ ਜੀ ਮੈਨੂੰ ਕੁਝ ਸਿਖਾ ਰਹੇ ਹਨ। ਮੈਂ ਗੁਰੂ ਜੀ ਅਤੇ ਉਨ੍ਹਾਂ ਦੇ ਸਿੱਖਾਂ ਨੂੰ ਲੋਕਾਂ ਦੀਆਂ ਗੱਲਾਂ ਅਤੇ ਉਨ੍ਹਾਂ ਦੇ ਖਾਣ-ਪੀਣ ਤੋਂ ਪਰਖ ਰਿਹਾ ਸੀ। ਪਰ ਸਭ ਕੁਝ ਰੱਬ ਨੇ ਬਣਾਇਆ ਹੈ, ਅਤੇ ਰੱਬ ਸਭ ਵਿੱਚ ਹੈ। ਇਹ ਫ਼ਰਕ ਸਿਰਫ਼ ਮੇਰੇ ਮਨ ਵਿੱਚ ਹਨ। ਗੱਲਾਂ ਸੁਣ ਕੇ ਦੂਰ ਰਹਿਣਾ ਮੇਰੀ ਕਿੰਨੀ ਵੱਡੀ ਭੁੱਲ ਸੀ!'","ਅਗਲੀ ਸਵੇਰ ਮਲੂਕ ਦਾਸ ਗੁਰੂ ਜੀ ਦੇ ਦਰਸ਼ਨਾਂ ਲਈ ਗਿਆ, ਅਤੇ ਗੁਰੂ ਜੀ ਨੇ ਪਿਆਰ ਨਾਲ ਸੁਆਗਤ ਕੀਤਾ। ਗੁਰੂ ਜੀ ਨੇ ਪੁੱਛਿਆ, 'ਮਨ ਵਿੱਚ ਕੋਈ ਹੋਰ ਸ਼ੰਕਾ ਹੈ?' ਮਲੂਕ ਦਾਸ ਨੇ ਕਿਹਾ, 'ਤੁਸੀਂ ਮੇਰੀਆਂ ਸਾਰੀਆਂ ਸ਼ੰਕਾਵਾਂ ਦੂਰ ਕਰ ਦਿੱਤੀਆਂ ਹਨ।' ਉਸ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਆਪਣੇ ਘਰ ਸੱਦਿਆ ਅਤੇ ਪਿਆਰ ਨਾਲ ਸੇਵਾ ਕੀਤੀ। ਉਸ ਨੇ ਕਿਹਾ, 'ਸਾਰੀ ਉਮਰ ਮੈਂ ਪੱਥਰ ਦੀਆਂ ਮੂਰਤੀਆਂ ਨੂੰ ਭੋਗ ਲਵਾਇਆ। ਅੱਜ ਮੈਂ ਰੱਬ ਦੇ ਜਿਉਂਦੇ-ਜਾਗਦੇ ਬੰਦੇ ਦੀ ਸੇਵਾ ਕਰ ਰਿਹਾ ਹਾਂ।'"],l:"ਲੋਕਾਂ ਨੂੰ ਗੱਲਾਂ ਸੁਣ ਕੇ ਜਾਂ ਛੋਟੇ-ਮੋਟੇ ਫ਼ਰਕਾਂ ਕਰਕੇ ਨਾ ਪਰਖੋ। ਖੁੱਲ੍ਹੇ ਦਿਲ ਨਾਲ ਮਿਲੋ, ਅਤੇ ਸਭ ਵਿੱਚ ਰੱਬ ਵੇਖੋ।"}},

{id:"banaras-ganga",title:"The Ganga Comes to the Sangat",gur:"ਬਨਾਰਸ ਵਿੱਚ ਗੁਰੂ ਜੀ",cat:"Guru Tegh Bahadur Ji",age:"Kids",where:"Banaras",mins:3,c:"#1590B0",c2:"#F0702A",h:400,art:"sarovar",
year:1666,loc:["banaras"],themes:["Faith","Humility"],
summary:"In the holy city of Banaras, a Sikh is hurrying off to bathe in the Ganga. Guru Tegh Bahadur Ji asks him to stay.",
text:["Guru Tegh Bahadur Ji reached Banaras, a holy city on the river Ganga. A Sikh named Bhai Jawehri Mal had been sharing Guru Nanak's teachings there for many years.","Early one morning, Guru Ji saw Bhai Jawehri Mal hurrying off with a towel and clean clothes. 'Where are you going?' asked Guru Ji. 'To bathe in the holy river Ganga,' he said.","Guru Ji smiled. 'For a Sikh, the true place of pilgrimage is the sangat, where God's praises are sung. Sikhs don't need to go to the Ganga. The Ganga comes to them. Lift those stones and see.' When Bhai Jawehri Mal moved the stones, clear water bubbled up. People say that water still flows there today.","Word spread through Banaras, and many people came to see the Guru. Some learned Pandits came and asked, 'We are wise and we read the holy books every day. So why do people still do bad things?'","Guru Ji answered, 'Because the mind is surrounded by five thieves: lust, anger, greed, attachment and pride. Reading holy books is good, but what matters most is what you do. Read them, understand them, and shape your life by them. Only then do they help you.'"],
lesson:"Holiness isn't only found in special places. It's found wherever people gather to remember God, and in how we live what we learn.",
think:["What did Guru Ji say is the true place of pilgrimage for a Sikh?","What are the 'five thieves' of the mind?"],
words:[["Pilgrimage","A journey to a holy place."],["Pandit","A Hindu scholar or priest."]],
