pa:{t:["ਖਡੂਰ ਵਿੱਚ ਸ਼ਿਵ ਨਾਥ ਨਾਂ ਦਾ ਇੱਕ ਸਾਧੂ ਰਹਿੰਦਾ ਸੀ, ਜਿਸ ਨੂੰ ਤਪਾ ਕਹਿੰਦੇ ਸਨ। ਲੋਕ ਕਹਿੰਦੇ ਸਨ ਕਿ ਉਹ ਜਾਦੂ-ਟੂਣਾ ਜਾਣਦਾ ਹੈ, ਇਸ ਲਈ ਪਿੰਡ ਵਾਲੇ ਉਸ ਤੋਂ ਡਰਦੇ ਅਤੇ ਜੋ ਮੰਗਦਾ ਦੇ ਦਿੰਦੇ। ਜਦੋਂ ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ ਖਡੂਰ ਆ ਕੇ ਰਹਿਣ ਲੱਗੇ, ਸਿੱਖਾਂ ਦੀਆਂ ਭੀੜਾਂ ਗੁਰੂ ਜੀ ਦੇ ਦਰਸ਼ਨਾਂ ਨੂੰ ਆਉਣ ਲੱਗੀਆਂ, ਅਤੇ ਤਪੇ ਨੂੰ ਬਹੁਤ ਈਰਖਾ ਹੋਈ।","ਇੱਕ ਗਰਮੀ ਵਿੱਚ ਮੀਂਹ ਨਾ ਪਿਆ ਅਤੇ ਫ਼ਸਲਾਂ ਸੁੱਕਣ ਲੱਗੀਆਂ। ਫ਼ਿਕਰਮੰਦ ਕਿਸਾਨ ਤਪੇ ਕੋਲ ਗਏ। ਉਸ ਨੇ ਕਿਹਾ, 'ਜਦ ਤੱਕ ਤੁਸੀਂ ਇਸ ਗ੍ਰਿਹਸਤੀ ਦੀ ਪੂਜਾ ਹੋਣ ਦਿਓਗੇ, ਮੀਂਹ ਨਹੀਂ ਪਵੇਗਾ। ਇਸ ਨੂੰ ਪਿੰਡੋਂ ਕੱਢ ਦਿਓ, ਮੀਂਹ ਆ ਜਾਵੇਗਾ।'","ਕਿਸਾਨਾਂ ਨੇ ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ ਨੂੰ ਤਪੇ ਦੀ ਗੱਲ ਦੱਸੀ। ਗੁਰੂ ਜੀ ਨੇ ਬਹਿਸ ਨਹੀਂ ਕੀਤੀ। ਉਨ੍ਹਾਂ ਕਿਹਾ, 'ਜੇ ਮੇਰੇ ਜਾਣ ਨਾਲ ਤੁਹਾਨੂੰ ਮੀਂਹ ਮਿਲਦਾ ਹੈ, ਤਾਂ ਮੈਂ ਚਲਾ ਜਾਂਦਾ ਹਾਂ,' ਅਤੇ ਚੁੱਪ-ਚਾਪ ਨੇੜਲੇ ਪਿੰਡ ਚਲੇ ਗਏ। ਪਰ ਦਿਨ ਲੰਘ ਗਏ, ਮੀਂਹ ਫਿਰ ਵੀ ਨਾ ਪਿਆ।","ਜਦੋਂ ਅਮਰਦਾਸ ਜੀ, ਜੋ ਬਾਅਦ ਵਿੱਚ ਤੀਜੇ ਗੁਰੂ ਬਣੇ, ਖਡੂਰ ਆਏ ਅਤੇ ਸਾਰੀ ਗੱਲ ਸੁਣੀ, ਉਹ ਬਹੁਤ ਦੁਖੀ ਹੋਏ। ਉਨ੍ਹਾਂ ਕਿਹਾ, 'ਤੁਸੀਂ ਇੱਕ ਈਰਖਾਲੂ ਬੰਦੇ ਦੀ ਗੱਲ ਮੰਨ ਕੇ ਗੁਰੂ ਜੀ ਨੂੰ ਕੱਢ ਦਿੱਤਾ!' ਗੁੱਸੇ ਵਿੱਚ ਕਿਸਾਨਾਂ ਨੇ ਤਪੇ ਨੂੰ ਫੜ ਕੇ ਖੇਤ-ਖੇਤ ਘਸੀਟਿਆ, ਅਤੇ ਤਪੇ ਨੂੰ ਬਹੁਤ ਸੱਟਾਂ ਲੱਗੀਆਂ। ਫਿਰ ਮੀਂਹ ਪੈ ਗਿਆ।","ਜਦੋਂ ਅਮਰਦਾਸ ਜੀ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਸਾਰੀ ਗੱਲ ਦੱਸੀ, ਗੁਰੂ ਜੀ ਖ਼ੁਸ਼ ਨਾ ਹੋਏ। ਉਨ੍ਹਾਂ ਨੇ ਨਰਮੀ ਨਾਲ ਕਿਹਾ, 'ਸਾਨੂੰ ਬਦਲਾ ਨਹੀਂ ਲੈਣਾ ਚਾਹੀਦਾ ਅਤੇ ਨਾ ਹੀ ਆਪਣਾ ਆਪ ਸਿੱਧ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ। ਜਦੋਂ ਕੋਈ ਭੁੱਲ ਕਰੇ, ਸਾਡਾ ਫ਼ਰਜ਼ ਹੈ ਉਸ ਨੂੰ ਮਾਫ਼ ਕਰਨਾ ਅਤੇ ਰੱਬ ਦਾ ਭਾਣਾ ਮੰਨਣਾ।' ਅਮਰਦਾਸ ਜੀ ਨੇ ਮਾਫ਼ੀ ਮੰਗੀ ਅਤੇ ਸਾਰੀ ਉਮਰ ਇਹ ਸਿੱਖਿਆ ਯਾਦ ਰੱਖੀ।"],l:"ਈਰਖਾ ਸਭ ਤੋਂ ਵੱਧ ਈਰਖਾ ਕਰਨ ਵਾਲੇ ਨੂੰ ਹੀ ਦੁੱਖ ਦਿੰਦੀ ਹੈ। ਗ਼ਲਤੀ ਕਰਨ ਵਾਲੇ ਤੋਂ ਬਦਲਾ ਲੈਣ ਦੀ ਥਾਂ ਮਾਫ਼ ਕਰੋ ਅਤੇ ਰੱਬ ਉੱਤੇ ਭਰੋਸਾ ਰੱਖੋ।"}},

{id:"jetha-platforms",title:"Bhai Jetha's Platforms",gur:"ਥੜ੍ਹਿਆਂ ਦੀ ਪਰਖ",cat:"Guru Ram Das Ji",age:"Kids",where:"Goindwal",mins:3,c:"#1590B0",c2:"#F2B229",h:400,art:"well",
year:1574,loc:["goindwal"],themes:["Humility","Sewa"],
summary:"Guru Amar Das Ji asks his two sons-in-law to build platforms. Then he asks them to knock them down and start again, and again.",
text:["Guru Amar Das Ji was getting old, and he had to choose who would be the next Guru. He gave a simple task to his two sons-in-law, Bhai Rama and Bhai Jetha. 'Each of you, build me a platform by the river, where I can sit and look at the water.'","Both of them worked hard and built neat platforms. Guru Ji came to look and said, 'These are not right. Knock them down and build them again.' They did. Again Guru Ji said, 'Not quite right. Build them again.'","After the third time, Bhai Rama grew annoyed. 'I built it exactly as you said, Guru Ji. There's nothing wrong with mine,' he said, and he stopped building.","But Bhai Jetha knocked his platform down again and again, seven times, without a single complaint. Each time he folded his hands and said, 'Guru Ji, I'm sorry. I have no wisdom of my own. Please forgive my mistakes and show me how to do it.'","Guru Amar Das Ji hugged him. 'The platforms were never the real test,' he said. 'I wanted to see whose heart had no pride.' Soon after, in 1574, Guru Ji made Bhai Jetha the fourth Guru, Guru Ram Das Ji."],
lesson:"Humility and patience are signs of a great heart. Someone who can accept correction without complaining keeps learning and growing.",
think:["Why did Bhai Rama stop building?","What was the real test?"],
words:[["Platform","A raised flat place, built of bricks or earth, to sit on."],["Humility","Not being proud; being gentle and modest."]],
quiz:[["What did Guru Ji ask both men to build?",["A platform by the river","A house","A boat"],0],["How many times did Bhai Jetha rebuild?",["Seven times","Once","Twice"],0],["What was Guru Ji really testing?",["Whose heart had no pride","Who was the strongest","Who was the fastest"],0]],
pa:{t:["ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਬਿਰਧ ਹੋ ਰਹੇ ਸਨ, ਅਤੇ ਉਨ੍ਹਾਂ ਨੇ ਅਗਲਾ ਗੁਰੂ ਚੁਣਨਾ ਸੀ। ਉਨ੍ਹਾਂ ਨੇ ਆਪਣੇ ਦੋਵੇਂ ਜਵਾਈਆਂ, ਭਾਈ ਰਾਮਾ ਜੀ ਅਤੇ ਭਾਈ ਜੇਠਾ ਜੀ, ਨੂੰ ਇੱਕ ਸੌਖਾ ਜਿਹਾ ਕੰਮ ਦਿੱਤਾ: 'ਦੋਵੇਂ ਦਰਿਆ ਕੰਢੇ ਮੇਰੇ ਲਈ ਇੱਕ-ਇੱਕ ਥੜ੍ਹਾ ਬਣਾਓ, ਜਿੱਥੇ ਬੈਠ ਕੇ ਮੈਂ ਪਾਣੀ ਵੇਖ ਸਕਾਂ।'","ਦੋਹਾਂ ਨੇ ਮਿਹਨਤ ਕਰ ਕੇ ਸੋਹਣੇ ਥੜ੍ਹੇ ਬਣਾਏ। ਗੁਰੂ ਜੀ ਨੇ ਵੇਖ ਕੇ ਕਿਹਾ, 'ਇਹ ਠੀਕ ਨਹੀਂ ਬਣੇ। ਢਾਹ ਕੇ ਮੁੜ ਬਣਾਓ।' ਉਨ੍ਹਾਂ ਨੇ ਮੁੜ ਬਣਾਏ। ਗੁਰੂ ਜੀ ਨੇ ਫਿਰ ਕਿਹਾ, 'ਅਜੇ ਵੀ ਠੀਕ ਨਹੀਂ। ਫਿਰ ਬਣਾਓ।'","ਤੀਜੀ ਵਾਰ ਤੋਂ ਬਾਅਦ ਭਾਈ ਰਾਮਾ ਜੀ ਖਿਝ ਗਏ। ਉਨ੍ਹਾਂ ਕਿਹਾ, 'ਗੁਰੂ ਜੀ, ਮੈਂ ਤਾਂ ਬਿਲਕੁਲ ਤੁਹਾਡੇ ਕਹੇ ਅਨੁਸਾਰ ਬਣਾਇਆ ਹੈ। ਮੇਰੇ ਥੜ੍ਹੇ ਵਿੱਚ ਕੋਈ ਨੁਕਸ ਨਹੀਂ,' ਅਤੇ ਬਣਾਉਣਾ ਛੱਡ ਦਿੱਤਾ।","ਪਰ ਭਾਈ ਜੇਠਾ ਜੀ ਨੇ ਬਿਨਾਂ ਕੋਈ ਸ਼ਿਕਾਇਤ ਕੀਤੇ ਸੱਤ ਵਾਰ ਥੜ੍ਹਾ ਢਾਹਿਆ ਅਤੇ ਬਣਾਇਆ। ਹਰ ਵਾਰ ਉਹ ਹੱਥ ਜੋੜ ਕੇ ਕਹਿੰਦੇ, 'ਗੁਰੂ ਜੀ, ਮੈਨੂੰ ਮਾਫ਼ ਕਰਨਾ। ਮੇਰੇ ਕੋਲ ਆਪਣੀ ਕੋਈ ਸਿਆਣਪ ਨਹੀਂ। ਮੇਰੀਆਂ ਭੁੱਲਾਂ ਬਖ਼ਸ਼ੋ ਅਤੇ ਮੈਨੂੰ ਸਹੀ ਢੰਗ ਦੱਸੋ।'","ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਗਲਵੱਕੜੀ ਪਾ ਲਈ। ਉਨ੍ਹਾਂ ਕਿਹਾ, 'ਅਸਲ ਪਰਖ ਥੜ੍ਹਿਆਂ ਦੀ ਨਹੀਂ ਸੀ। ਮੈਂ ਵੇਖਣਾ ਚਾਹੁੰਦਾ ਸੀ ਕਿ ਕਿਸ ਦੇ ਦਿਲ ਵਿੱਚ ਹੰਕਾਰ ਨਹੀਂ।' ਛੇਤੀ ਹੀ, 1574 ਵਿੱਚ, ਗੁਰੂ ਜੀ ਨੇ ਭਾਈ ਜੇਠਾ ਜੀ ਨੂੰ ਚੌਥੇ ਗੁਰੂ, ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ, ਥਾਪ ਦਿੱਤਾ।"],l:"ਨਿਮਰਤਾ ਅਤੇ ਧੀਰਜ ਵੱਡੇ ਦਿਲ ਦੀ ਨਿਸ਼ਾਨੀ ਹਨ। ਜੋ ਬਿਨਾਂ ਸ਼ਿਕਾਇਤ ਸੁਧਾਰ ਸਵੀਕਾਰ ਕਰਦਾ ਹੈ, ਉਹ ਸਿੱਖਦਾ ਅਤੇ ਵਧਦਾ ਰਹਿੰਦਾ ਹੈ।"}},

{id:"ascetic-at-amritsar",title:"The Wandering Holy Man",gur:"ਉਦਾਸੀ ਦਾ ਭਰਮ",cat:"Guru Ram Das Ji",age:"Kids",where:"Amritsar",mins:2,c:"#8E3FB8",c2:"#F0702A",h:390,art:"sarovar",
year:1578,approx:1,loc:["amritsar"],themes:["Humility","Faith"],
summary:"A wandering holy man comes to Amritsar with a list of complaints about the Sikhs. Guru Ram Das Ji answers each one.",
text:["A wandering holy man had heard pilgrims praising Guru Ram Das Ji, so he came to Amritsar. He had spent his life visiting holy places, and he lived off the food and gifts that villagers gave him in return for stories and verses.","Guru Ji seated him kindly and asked why he had come. The holy man said, 'Your Sikhs are proud. They don't go on pilgrimage to holy rivers, which wash away sins and lead to heaven.' Guru Ji replied, 'For Sikhs, the sangat is like a holy place. What people once learned from wise men at holy places, Sikhs learn from the Guru's Bani. And it is knowing God that frees us from wrong deeds.'","'But your Sikhs bow to nobody except you,' said the holy man. Guru Ji said, 'Sikhs don't bow to my body. They bow to the light of knowledge that shines through the Guru, the light that takes away the darkness in their minds.'","'And they've left the Vedas, and only recite the Gurus' words,' he said. Guru Ji answered, 'The Vedas are written in Sanskrit, which ordinary people today cannot understand. The Bani is in the people's own language. Sikhs don't just read it; they understand it and live by it, and that frees them from pain.'","The holy man listened carefully. He realised he had been living a life of show, without really helping anyone. He gave up pretending and became a Sikh, serving others at Amritsar."],
lesson:"What matters is understanding the truth and living by it, not making a show of holiness.",
think:["Why is it important to understand prayers, not only read them?","What did Guru Ji say Sikhs really bow to?"],
words:[["Vedas","Ancient Hindu holy books written in Sanskrit."],["Bani","The words of the Gurus and saints in Sri Guru Granth Sahib Ji."]],
quiz:[["What did the holy man complain about first?",["Sikhs didn't go on pilgrimage","Sikhs were too noisy","Sikhs ate too much"],0],["What did Guru Ji say Sikhs bow to?",["The light of knowledge through the Guru","His body","Gold"],0],["Why did Guru Ji say the Bani helps ordinary people?",["It's in their own language","It's very long","It's written in gold"],0]],
pa:{t:["ਇੱਕ ਘੁੰਮਣ-ਫਿਰਨ ਵਾਲੇ ਸਾਧੂ ਨੇ ਯਾਤਰੀਆਂ ਤੋਂ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਦੀ ਸਿਫ਼ਤ ਸੁਣੀ ਅਤੇ ਅੰਮ੍ਰਿਤਸਰ ਆਇਆ। ਉਸ ਨੇ ਸਾਰੀ ਉਮਰ ਤੀਰਥਾਂ ਉੱਤੇ ਘੁੰਮਦਿਆਂ ਕੱਟੀ ਸੀ, ਅਤੇ ਪਿੰਡਾਂ ਦੇ ਲੋਕਾਂ ਨੂੰ ਕਥਾ-ਕਹਾਣੀਆਂ ਸੁਣਾ ਕੇ ਉਨ੍ਹਾਂ ਦੇ ਦਿੱਤੇ ਭੋਜਨ ਅਤੇ ਭੇਟਾਂ ਉੱਤੇ ਗੁਜ਼ਾਰਾ ਕਰਦਾ ਸੀ।","ਗੁਰੂ ਜੀ ਨੇ ਪਿਆਰ ਨਾਲ ਬਿਠਾ ਕੇ ਆਉਣ ਦਾ ਕਾਰਨ ਪੁੱਛਿਆ। ਸਾਧੂ ਨੇ ਕਿਹਾ, 'ਤੁਹਾਡੇ ਸਿੱਖ ਹੰਕਾਰੀ ਹਨ। ਉਹ ਤੀਰਥਾਂ ਉੱਤੇ ਨਹੀਂ ਜਾਂਦੇ, ਜਿੱਥੇ ਨਹਾਉਣ ਨਾਲ ਪਾਪ ਧੁਲਦੇ ਹਨ ਅਤੇ ਸੁਰਗ ਮਿਲਦਾ ਹੈ।' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਸਿੱਖਾਂ ਲਈ ਸਾਧਸੰਗਤ ਹੀ ਤੀਰਥ ਹੈ। ਜੋ ਗਿਆਨ ਲੋਕ ਤੀਰਥਾਂ ਉੱਤੇ ਮਹਾਂਪੁਰਖਾਂ ਤੋਂ ਲੈਂਦੇ ਸਨ, ਉਹ ਸਿੱਖ ਗੁਰਬਾਣੀ ਤੋਂ ਲੈਂਦੇ ਹਨ। ਅਤੇ ਰੱਬ ਦੀ ਪਛਾਣ ਹੀ ਮਾੜੇ ਕਰਮਾਂ ਤੋਂ ਛੁਡਾਉਂਦੀ ਹੈ।'","ਸਾਧੂ ਨੇ ਕਿਹਾ, 'ਪਰ ਤੁਹਾਡੇ ਸਿੱਖ ਤੁਹਾਡੇ ਤੋਂ ਬਿਨਾਂ ਕਿਸੇ ਅੱਗੇ ਸਿਰ ਨਹੀਂ ਝੁਕਾਉਂਦੇ।' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਸਿੱਖ ਮੇਰੇ ਸਰੀਰ ਅੱਗੇ ਨਹੀਂ ਝੁਕਦੇ। ਉਹ ਗਿਆਨ ਦੀ ਉਸ ਜੋਤ ਅੱਗੇ ਝੁਕਦੇ ਹਨ ਜੋ ਗੁਰੂ ਰਾਹੀਂ ਚਮਕਦੀ ਹੈ ਅਤੇ ਉਨ੍ਹਾਂ ਦੇ ਮਨ ਦਾ ਹਨੇਰਾ ਦੂਰ ਕਰਦੀ ਹੈ।'","ਉਸ ਨੇ ਕਿਹਾ, 'ਅਤੇ ਇਨ੍ਹਾਂ ਨੇ ਵੇਦ ਛੱਡ ਦਿੱਤੇ ਹਨ, ਸਿਰਫ਼ ਗੁਰੂਆਂ ਦੀ ਬਾਣੀ ਪੜ੍ਹਦੇ ਹਨ।' ਗੁਰੂ ਜੀ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, 'ਵੇਦ ਸੰਸਕ੍ਰਿਤ ਵਿੱਚ ਹਨ, ਜੋ ਅੱਜ ਆਮ ਲੋਕ ਨਹੀਂ ਸਮਝਦੇ। ਬਾਣੀ ਲੋਕਾਂ ਦੀ ਆਪਣੀ ਬੋਲੀ ਵਿੱਚ ਹੈ। ਸਿੱਖ ਇਸ ਨੂੰ ਸਿਰਫ਼ ਪੜ੍ਹਦੇ ਨਹੀਂ, ਸਮਝਦੇ ਹਨ ਅਤੇ ਇਸ ਉੱਤੇ ਚੱਲਦੇ ਹਨ, ਅਤੇ ਇਹੀ ਉਨ੍ਹਾਂ ਨੂੰ ਦੁੱਖਾਂ ਤੋਂ ਮੁਕਤ ਕਰਦਾ ਹੈ।'","ਸਾਧੂ ਨੇ ਧਿਆਨ ਨਾਲ ਸੁਣਿਆ। ਉਸ ਨੂੰ ਸਮਝ ਆਈ ਕਿ ਉਹ ਦਿਖਾਵੇ ਦਾ ਜੀਵਨ ਜੀ ਰਿਹਾ ਸੀ ਅਤੇ ਅਸਲ ਵਿੱਚ ਕਿਸੇ ਦੀ ਮਦਦ ਨਹੀਂ ਕਰਦਾ ਸੀ। ਉਸ ਨੇ ਦਿਖਾਵਾ ਛੱਡ ਦਿੱਤਾ, ਸਿੱਖ ਬਣ ਗਿਆ, ਅਤੇ ਅੰਮ੍ਰਿਤਸਰ ਵਿੱਚ ਸੇਵਾ ਕਰਨ ਲੱਗਾ।"],l:"ਅਸਲ ਗੱਲ ਸੱਚ ਨੂੰ ਸਮਝਣਾ ਅਤੇ ਉਸ ਉੱਤੇ ਚੱਲਣਾ ਹੈ, ਪਵਿੱਤਰਤਾ ਦਾ ਦਿਖਾਵਾ ਕਰਨਾ ਨਹੀਂ।"}},

{id:"royal-hawk",title:"The Emperor's Hawk",gur:"ਸ਼ਾਹੀ ਬਾਜ਼",cat:"Guru Hargobind Sahib Ji",age:"Kids",where:"Amritsar",mins:3,c:"#8E3FB8",c2:"#F2B229",h:400,art:"fort",
year:1628,loc:["amritsar"],themes:["Courage"],
summary:"On a hunt near Lahore, the emperor's hawk chases the Sikhs' prey and lands among them. The Sikhs won't give it back.",
text:["When Shah Jahan became emperor, he ordered that new places of worship be pulled down, and he made life hard for people who were not Muslims. Guru Hargobind Sahib Ji told the Sikhs to be ready to defend Amritsar if they were attacked.","One day some Sikhs were out hunting near Lahore, where the emperor's men were hunting too. The Sikhs' hawk caught its prey. The emperor's hawk, chasing the same bird, flew down and landed among the Sikhs, and they caught it.","The royal hunters came and demanded their hawk back, but the Sikhs refused. The angry hunters told the governor of Lahore, who sent a commander named Mukhlis Khan with an army of thousands to attack Amritsar.","It was just three days before the wedding of the Guru's daughter, Bibi Viro. Guru Ji sent his family and the holy Granth to safety in a nearby village, and the wedding party was told to go there. Then the Sikhs went out to defend Amritsar. This was the first battle the Sikhs ever fought. They were not fighting for land or riches, only to protect their freedom and their honour.","The Sikhs fought bravely. Mukhlis Khan himself faced the Guru, and the Guru defeated him in single combat. The royal army retreated. Afterwards Guru Ji went to the village and Bibi Viro's wedding took place happily, as planned."],
lesson:"The Sikhs never started a fight for land or riches. But they were always ready to stand up bravely to protect their freedom and honour.",
think:["Why did the Sikhs refuse to give back the hawk?","What were the Sikhs fighting for in this battle?"],
words:[["Hawk","A hunting bird trained to catch other birds."],["Governor","The ruler of a province, appointed by the emperor."]],
quiz:[["What did the Sikhs catch?",["The emperor's hawk","A deer","A horse"],0],["Whose wedding was coming up?",["Bibi Viro's","Baba Gurditta's","Bhai Bidhi Chand's"],0],["What were the Sikhs fighting for?",["Their freedom and honour","Land","Gold"],0]],
pa:{t:["ਜਦੋਂ ਸ਼ਾਹਜਹਾਂ ਬਾਦਸ਼ਾਹ ਬਣਿਆ, ਉਸ ਨੇ ਨਵੇਂ ਧਾਰਮਿਕ ਅਸਥਾਨ ਢਾਹੁਣ ਦਾ ਹੁਕਮ ਦਿੱਤਾ ਅਤੇ ਗ਼ੈਰ-ਮੁਸਲਮਾਨਾਂ ਲਈ ਜੀਵਨ ਔਖਾ ਕਰ ਦਿੱਤਾ। ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਨੇ ਸਿੱਖਾਂ ਨੂੰ ਕਿਹਾ ਕਿ ਜੇ ਹਮਲਾ ਹੋਵੇ ਤਾਂ ਅੰਮ੍ਰਿਤਸਰ ਦੀ ਰੱਖਿਆ ਲਈ ਤਿਆਰ ਰਹਿਣ।","ਇੱਕ ਦਿਨ ਕੁਝ ਸਿੱਖ ਲਾਹੌਰ ਨੇੜੇ ਸ਼ਿਕਾਰ ਖੇਡ ਰਹੇ ਸਨ, ਜਿੱਥੇ ਸ਼ਾਹੀ ਸ਼ਿਕਾਰੀ ਵੀ ਸ਼ਿਕਾਰ ਕਰ ਰਹੇ ਸਨ। ਸਿੱਖਾਂ ਦੇ ਬਾਜ਼ ਨੇ ਸ਼ਿਕਾਰ ਫੜ ਲਿਆ। ਉਸੇ ਪੰਛੀ ਦਾ ਪਿੱਛਾ ਕਰਦਾ ਸ਼ਾਹੀ ਬਾਜ਼ ਵੀ ਸਿੱਖਾਂ ਵਿੱਚ ਆ ਉਤਰਿਆ, ਅਤੇ ਸਿੱਖਾਂ ਨੇ ਉਸ ਨੂੰ ਫੜ ਲਿਆ।","ਸ਼ਾਹੀ ਸ਼ਿਕਾਰੀਆਂ ਨੇ ਆ ਕੇ ਬਾਜ਼ ਮੰਗਿਆ, ਪਰ ਸਿੱਖਾਂ ਨੇ ਨਾਂਹ ਕਰ ਦਿੱਤੀ। ਗੁੱਸੇ ਵਿੱਚ ਸ਼ਿਕਾਰੀਆਂ ਨੇ ਲਾਹੌਰ ਦੇ ਸੂਬੇਦਾਰ ਨੂੰ ਦੱਸਿਆ, ਜਿਸ ਨੇ ਮੁਖ਼ਲਿਸ ਖ਼ਾਨ ਨੂੰ ਹਜ਼ਾਰਾਂ ਦੀ ਫ਼ੌਜ ਦੇ ਕੇ ਅੰਮ੍ਰਿਤਸਰ ਉੱਤੇ ਹਮਲਾ ਕਰਨ ਭੇਜਿਆ।","ਗੁਰੂ ਜੀ ਦੀ ਸਪੁੱਤਰੀ ਬੀਬੀ ਵੀਰੋ ਜੀ ਦੇ ਵਿਆਹ ਵਿੱਚ ਸਿਰਫ਼ ਤਿੰਨ ਦਿਨ ਰਹਿੰਦੇ ਸਨ। ਗੁਰੂ ਜੀ ਨੇ ਪਰਿਵਾਰ ਅਤੇ ਪਵਿੱਤਰ ਬੀੜ ਨੂੰ ਨੇੜਲੇ ਪਿੰਡ ਸੁਰੱਖਿਅਤ ਭੇਜ ਦਿੱਤਾ, ਅਤੇ ਜੰਞ ਨੂੰ ਵੀ ਉੱਥੇ ਪਹੁੰਚਣ ਦਾ ਸੁਨੇਹਾ ਦਿੱਤਾ। ਫਿਰ ਸਿੱਖ ਅੰਮ੍ਰਿਤਸਰ ਦੀ ਰੱਖਿਆ ਲਈ ਨਿਕਲੇ। ਇਹ ਸਿੱਖਾਂ ਦੀ ਪਹਿਲੀ ਜੰਗ ਸੀ। ਉਹ ਜ਼ਮੀਨ ਜਾਂ ਧਨ ਲਈ ਨਹੀਂ, ਸਿਰਫ਼ ਆਪਣੀ ਆਜ਼ਾਦੀ ਅਤੇ ਅਣਖ ਦੀ ਰਾਖੀ ਲਈ ਲੜ ਰਹੇ ਸਨ।","ਸਿੱਖ ਬਹਾਦਰੀ ਨਾਲ ਲੜੇ। ਮੁਖ਼ਲਿਸ ਖ਼ਾਨ ਆਪ ਗੁਰੂ ਜੀ ਦੇ ਸਾਹਮਣੇ ਆਇਆ, ਅਤੇ ਗੁਰੂ ਜੀ ਨੇ ਆਹਮੋ-ਸਾਹਮਣੀ ਲੜਾਈ ਵਿੱਚ ਉਸ ਨੂੰ ਹਰਾ ਦਿੱਤਾ। ਸ਼ਾਹੀ ਫ਼ੌਜ ਪਿੱਛੇ ਹਟ ਗਈ। ਬਾਅਦ ਵਿੱਚ ਗੁਰੂ ਜੀ ਪਿੰਡ ਗਏ ਅਤੇ ਬੀਬੀ ਵੀਰੋ ਜੀ ਦਾ ਵਿਆਹ ਮਿੱਥੇ ਸਮੇਂ ਉੱਤੇ ਖ਼ੁਸ਼ੀ-ਖ਼ੁਸ਼ੀ ਹੋਇਆ।"],l:"ਸਿੱਖਾਂ ਨੇ ਕਦੇ ਜ਼ਮੀਨ ਜਾਂ ਧਨ ਲਈ ਲੜਾਈ ਸ਼ੁਰੂ ਨਹੀਂ ਕੀਤੀ। ਪਰ ਉਹ ਆਪਣੀ ਆਜ਼ਾਦੀ ਅਤੇ ਅਣਖ ਦੀ ਰਾਖੀ ਲਈ ਹਮੇਸ਼ਾ ਬਹਾਦਰੀ ਨਾਲ ਖੜ੍ਹੇ ਹੋਣ ਲਈ ਤਿਆਰ ਰਹੇ।"}},

{id:"mosque-at-hargobindpur",title:"A Mosque at Hargobindpur",gur:"ਹਰਿਗੋਬਿੰਦਪੁਰ ਦੀ ਮਸੀਤ",cat:"Guru Hargobind Sahib Ji",age:"Kids",where:"Sri Hargobindpur, on the Beas",mins:3,c:"#1FA38A",c2:"#F2B229",h:395,art:"mosque",
year:1630,loc:["ruhila"],themes:["Equality","Courage"],
summary:"Guru Hargobind Sahib Ji is building a mosque for his Muslim soldiers. A local official tries to stop him.",
text:["Guru Hargobind Sahib Ji had many Muslim followers, and many Pathan soldiers served in his army. At Hargobindpur, by the river Beas, he began building a mosque so that they would have their own place to pray.","A local official named Bhagwan Das, a relative of Chandu, came with a gang of troublemakers. He tried to stop the building of the mosque and threatened the Guru, ordering him to leave the village. A fight broke out, and Bhagwan Das was killed.","His son ran to the commander of Jalandhar and told him a false story. The commander marched on Hargobindpur with an army of thousands. The Sikhs fought so skilfully that the commander was amazed. 'We thought these Sikhs were just barbers, tailors and farmers,' he said, 'but they are real warriors!' The Sikhs won the battle.","When Emperor Shah Jahan heard about it, he was angry with his commander, until his minister told him the truth: 'The fight started because someone was trying to stop the Guru from building a mosque for his Muslim followers.' The emperor changed his mind and punished the commander instead.","After the battle, Guru Ji finished building the mosque. That mosque at Hargobindpur, built by a Sikh Guru for his Muslim followers, is still remembered today as a sign of respect for every faith."],
lesson:"The Gurus respected every faith. Guru Hargobind Sahib Ji even built a mosque so his Muslim followers could pray.",
think:["Why did Guru Ji build a mosque?","What does this story teach us about respecting other faiths?"],
words:[["Mosque","A Muslim place of worship."],["Pathan","People from the north-west, many of whom served in the Guru's army."]],
quiz:[["What was Guru Ji building at Hargobindpur?",["A mosque","A fort","A palace"],0],["Who was it for?",["His Muslim followers","The emperor","Travellers"],0],["What did the emperor do when he heard the truth?",["Punished his own commander","Sent a bigger army","Ignored it"],0]],
pa:{t:["ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਦੇ ਬਹੁਤ ਸਾਰੇ ਮੁਸਲਮਾਨ ਸ਼ਰਧਾਲੂ ਸਨ, ਅਤੇ ਉਨ੍ਹਾਂ ਦੀ ਫ਼ੌਜ ਵਿੱਚ ਬਹੁਤ ਸਾਰੇ ਪਠਾਣ ਸਿਪਾਹੀ ਸਨ। ਬਿਆਸ ਕੰਢੇ ਹਰਿਗੋਬਿੰਦਪੁਰ ਵਿੱਚ ਉਨ੍ਹਾਂ ਨੇ ਇੱਕ ਮਸੀਤ ਬਣਾਉਣੀ ਸ਼ੁਰੂ ਕੀਤੀ, ਤਾਂ ਜੋ ਉਨ੍ਹਾਂ ਕੋਲ ਨਮਾਜ਼ ਪੜ੍ਹਨ ਲਈ ਆਪਣੀ ਥਾਂ ਹੋਵੇ।","ਚੰਦੂ ਦਾ ਰਿਸ਼ਤੇਦਾਰ, ਭਗਵਾਨ ਦਾਸ ਨਾਂ ਦਾ ਇੱਕ ਸਥਾਨਕ ਅਹਿਲਕਾਰ, ਸ਼ਰਾਰਤੀ ਬੰਦਿਆਂ ਦਾ ਟੋਲਾ ਲੈ ਕੇ ਆਇਆ। ਉਸ ਨੇ ਮਸੀਤ ਦੀ ਉਸਾਰੀ ਰੋਕਣ ਦੀ ਕੋਸ਼ਿਸ਼ ਕੀਤੀ ਅਤੇ ਗੁਰੂ ਜੀ ਨੂੰ ਪਿੰਡ ਛੱਡਣ ਦੀਆਂ ਧਮਕੀਆਂ ਦਿੱਤੀਆਂ। ਝਗੜਾ ਹੋ ਗਿਆ, ਅਤੇ ਭਗਵਾਨ ਦਾਸ ਮਾਰਿਆ ਗਿਆ।","ਉਸ ਦੇ ਪੁੱਤਰ ਨੇ ਜਲੰਧਰ ਦੇ ਫ਼ੌਜਦਾਰ ਕੋਲ ਜਾ ਕੇ ਝੂਠੀ ਕਹਾਣੀ ਸੁਣਾਈ। ਫ਼ੌਜਦਾਰ ਹਜ਼ਾਰਾਂ ਦੀ ਫ਼ੌਜ ਲੈ ਕੇ ਹਰਿਗੋਬਿੰਦਪੁਰ ਉੱਤੇ ਚੜ੍ਹ ਆਇਆ। ਸਿੱਖ ਇੰਨੀ ਕਮਾਲ ਨਾਲ ਲੜੇ ਕਿ ਫ਼ੌਜਦਾਰ ਹੈਰਾਨ ਰਹਿ ਗਿਆ। ਉਸ ਨੇ ਕਿਹਾ, 'ਅਸੀਂ ਤਾਂ ਸਮਝਦੇ ਸੀ ਕਿ ਇਹ ਸਿੱਖ ਨਾਈ, ਦਰਜ਼ੀ ਅਤੇ ਕਿਸਾਨ ਹਨ, ਪਰ ਇਹ ਤਾਂ ਅਸਲੀ ਯੋਧੇ ਹਨ!' ਸਿੱਖਾਂ ਦੀ ਜਿੱਤ ਹੋਈ।","ਜਦੋਂ ਬਾਦਸ਼ਾਹ ਸ਼ਾਹਜਹਾਂ ਨੇ ਇਹ ਸੁਣਿਆ, ਉਹ ਪਹਿਲਾਂ ਗੁੱਸੇ ਹੋਇਆ, ਪਰ ਫਿਰ ਉਸ ਦੇ ਵਜ਼ੀਰ ਨੇ ਸੱਚ ਦੱਸਿਆ: 'ਝਗੜਾ ਇਸ ਲਈ ਹੋਇਆ ਕਿਉਂਕਿ ਕੋਈ ਗੁਰੂ ਜੀ ਨੂੰ ਉਨ੍ਹਾਂ ਦੇ ਮੁਸਲਮਾਨ ਸ਼ਰਧਾਲੂਆਂ ਲਈ ਮਸੀਤ ਬਣਾਉਣ ਤੋਂ ਰੋਕ ਰਿਹਾ ਸੀ।' ਬਾਦਸ਼ਾਹ ਨੇ ਆਪਣਾ ਮਨ ਬਦਲ ਲਿਆ ਅਤੇ ਉਲਟਾ ਆਪਣੇ ਫ਼ੌਜਦਾਰ ਨੂੰ ਸਜ਼ਾ ਦਿੱਤੀ।","ਜੰਗ ਤੋਂ ਬਾਅਦ ਗੁਰੂ ਜੀ ਨੇ ਮਸੀਤ ਦੀ ਉਸਾਰੀ ਪੂਰੀ ਕਰਵਾਈ। ਹਰਿਗੋਬਿੰਦਪੁਰ ਦੀ ਉਹ ਮਸੀਤ, ਜੋ ਇੱਕ ਸਿੱਖ ਗੁਰੂ ਨੇ ਆਪਣੇ ਮੁਸਲਮਾਨ ਸ਼ਰਧਾਲੂਆਂ ਲਈ ਬਣਵਾਈ, ਅੱਜ ਵੀ ਹਰ ਧਰਮ ਦੇ ਸਤਿਕਾਰ ਦੀ ਨਿਸ਼ਾਨੀ ਵਜੋਂ ਯਾਦ ਕੀਤੀ ਜਾਂਦੀ ਹੈ।"],l:"ਗੁਰੂ ਸਾਹਿਬਾਨ ਹਰ ਧਰਮ ਦਾ ਸਤਿਕਾਰ ਕਰਦੇ ਸਨ। ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਨੇ ਤਾਂ ਆਪਣੇ ਮੁਸਲਮਾਨ ਸ਼ਰਧਾਲੂਆਂ ਲਈ ਮਸੀਤ ਵੀ ਬਣਵਾਈ।"}},

{id:"sri-chand-asks",title:"Baba Sri Chand Asks for a Son",gur:"ਬਾਬਾ ਸ੍ਰੀ ਚੰਦ ਜੀ ਨਾਲ ਮਿਲਾਪ",cat:"Guru Hargobind Sahib Ji",age:"Kids",where:"Near Kartarpur",mins:2,c:"#F0702A",c2:"#4867D6",h:390,art:"mountains",
year:1629,approx:1,loc:["kartarpur_j"],themes:["Humility","Sewa"],
summary:"Guru Nanak Dev Ji's elder son is now very old. When Guru Hargobind Sahib Ji visits him, he makes an unusual request.",
text:["Baba Sri Chand Ji, the elder son of Guru Nanak Dev Ji, had become a very old and respected holy man. He led the Udasis, a group of holy men who lived simply, travelled widely and shared Guru Nanak's message.","Guru Hargobind Sahib Ji went to meet him, taking his eldest son, Baba Gurditta Ji. When Baba Sri Chand Ji saw young Gurditta, he was amazed. People said the boy's face looked just like Guru Nanak Dev Ji's.","Baba Sri Chand Ji asked, 'How many sons do you have?' Guru Ji said, 'I have five sons.' Baba Sri Chand Ji smiled and said, 'Then will you give one of them to me, to carry on my work?'","Guru Hargobind Sahib Ji bowed and gave him Baba Gurditta Ji. Baba Sri Chand Ji was overjoyed. He blessed Baba Gurditta Ji and made him the leader of the Udasis after him.","From then on, Baba Gurditta Ji looked after the Udasi holy men, who went far and wide, to Bihar, Bengal and beyond, spreading Guru Nanak's teachings. The Udasis and the Sikhs worked together, both carrying Guru Nanak's light."],
lesson:"Respecting elders and sharing what we love with others brings blessings to everyone.",
think:["Why did Baba Sri Chand Ji ask for Baba Gurditta Ji?","What did the Udasis do?"],
words:[["Udasi","A holy man of the order led by Baba Sri Chand Ji, who lived simply and travelled widely."]],
quiz:[["Whose son was Baba Sri Chand Ji?",["Guru Nanak Dev Ji's","Guru Arjan Dev Ji's","Guru Ram Das Ji's"],0],["Who did Guru Ji give to Baba Sri Chand Ji?",["Baba Gurditta Ji","Baba Atal Rai Ji","Bhai Bidhi Chand"],0],["Whom did Baba Gurditta Ji lead?",["The Udasis","The army","The musicians"],0]],
pa:{t:["ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦੇ ਵੱਡੇ ਸਪੁੱਤਰ, ਬਾਬਾ ਸ੍ਰੀ ਚੰਦ ਜੀ, ਹੁਣ ਬਹੁਤ ਬਿਰਧ ਅਤੇ ਸਤਿਕਾਰਤ ਮਹਾਂਪੁਰਖ ਸਨ। ਉਹ ਉਦਾਸੀਆਂ ਦੀ ਅਗਵਾਈ ਕਰਦੇ ਸਨ, ਜੋ ਸਾਦਗੀ ਨਾਲ ਰਹਿੰਦੇ, ਦੂਰ-ਦੂਰ ਯਾਤਰਾ ਕਰਦੇ ਅਤੇ ਗੁਰੂ ਨਾਨਕ ਦਾ ਸੁਨੇਹਾ ਪਹੁੰਚਾਉਂਦੇ ਸਨ।","ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਆਪਣੇ ਵੱਡੇ ਪੁੱਤਰ, ਬਾਬਾ ਗੁਰਦਿੱਤਾ ਜੀ, ਨੂੰ ਨਾਲ ਲੈ ਕੇ ਉਨ੍ਹਾਂ ਨੂੰ ਮਿਲਣ ਗਏ। ਨੌਜਵਾਨ ਗੁਰਦਿੱਤਾ ਜੀ ਨੂੰ ਵੇਖ ਕੇ ਬਾਬਾ ਸ੍ਰੀ ਚੰਦ ਜੀ ਹੈਰਾਨ ਰਹਿ ਗਏ। ਲੋਕ ਕਹਿੰਦੇ ਸਨ ਕਿ ਉਨ੍ਹਾਂ ਦਾ ਮੁੱਖ ਹੂਬਹੂ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਵਰਗਾ ਸੀ।","ਬਾਬਾ ਸ੍ਰੀ ਚੰਦ ਜੀ ਨੇ ਪੁੱਛਿਆ, 'ਤੁਹਾਡੇ ਕਿੰਨੇ ਪੁੱਤਰ ਹਨ?' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਮੇਰੇ ਪੰਜ ਪੁੱਤਰ ਹਨ।' ਬਾਬਾ ਸ੍ਰੀ ਚੰਦ ਜੀ ਨੇ ਮੁਸਕਰਾ ਕੇ ਕਿਹਾ, 'ਤਾਂ ਕੀ ਇੱਕ ਮੈਨੂੰ ਦਿਓਗੇ, ਮੇਰਾ ਕੰਮ ਅੱਗੇ ਤੋਰਨ ਲਈ?'","ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਨੇ ਸਿਰ ਝੁਕਾਇਆ ਅਤੇ ਬਾਬਾ ਗੁਰਦਿੱਤਾ ਜੀ ਉਨ੍ਹਾਂ ਨੂੰ ਸੌਂਪ ਦਿੱਤੇ। ਬਾਬਾ ਸ੍ਰੀ ਚੰਦ ਜੀ ਬਹੁਤ ਖ਼ੁਸ਼ ਹੋਏ। ਉਨ੍ਹਾਂ ਨੇ ਬਾਬਾ ਗੁਰਦਿੱਤਾ ਜੀ ਨੂੰ ਅਸੀਸ ਦਿੱਤੀ ਅਤੇ ਆਪਣੇ ਤੋਂ ਬਾਅਦ ਉਦਾਸੀਆਂ ਦਾ ਮੁਖੀ ਥਾਪਿਆ।","ਉਸ ਤੋਂ ਬਾਅਦ ਬਾਬਾ ਗੁਰਦਿੱਤਾ ਜੀ ਨੇ ਉਦਾਸੀ ਸੰਤਾਂ ਦੀ ਸੰਭਾਲ ਕੀਤੀ, ਜੋ ਬਿਹਾਰ, ਬੰਗਾਲ ਅਤੇ ਹੋਰ ਦੂਰ-ਦੁਰਾਡੇ ਗੁਰੂ ਨਾਨਕ ਦਾ ਉਪਦੇਸ਼ ਫੈਲਾਉਂਦੇ ਰਹੇ। ਉਦਾਸੀ ਅਤੇ ਸਿੱਖ ਮਿਲ ਕੇ ਗੁਰੂ ਨਾਨਕ ਦੀ ਜੋਤ ਅੱਗੇ ਲੈ ਕੇ ਚੱਲੇ।"],l:"ਵੱਡਿਆਂ ਦਾ ਸਤਿਕਾਰ ਕਰਨਾ ਅਤੇ ਜੋ ਸਾਨੂੰ ਪਿਆਰਾ ਹੈ ਉਸ ਨੂੰ ਦੂਜਿਆਂ ਨਾਲ ਵੰਡਣਾ ਸਭ ਲਈ ਬਰਕਤਾਂ ਲਿਆਉਂਦਾ ਹੈ।"}},

{id:"painde-khan",title:"Painde Khan's Pride",gur:"ਪੈਂਦੇ ਖ਼ਾਨ ਦਾ ਹੰਕਾਰ",cat:"Guru Hargobind Sahib Ji",age:"Youth",where:"Kartarpur",mins:3,c:"#DC3B32",c2:"#F2B229",h:400,art:"sword",
year:1635,loc:["kartarpur_j"],themes:["Humility","Honesty"],
summary:"A strong Pathan grows up in the Guru's care and becomes a great general. Then pride takes hold of him.",
text:["Painde Khan was a Pathan orphan who grew up under Guru Hargobind Sahib Ji's care. He became enormously strong, and the Guru made him a general in his army. He fought bravely in the Sikhs' battles, and the Guru loved him like a son.","But slowly, pride took hold of Painde Khan. He began to think that the Guru's victories were really his own. One day he kept for himself a fine hawk and a robe that a Sikh had given to the Guru, and then he lied about it.","When the truth came out, Guru Ji did not punish him harshly, but asked him to leave. Instead of feeling sorry, Painde Khan grew bitter. He went to the Mughal governor and offered to lead an army against the Guru who had raised him.","In 1635 the army attacked Kartarpur, with Painde Khan at its side. In the battle, Painde Khan rode straight at the Guru. Guru Ji let him strike first, three times, and defended himself each time. Then the Guru struck back, and Painde Khan fell.","As Painde Khan lay dying, Guru Ji held his shield over Painde Khan's face to shade him from the hot sun. 'You are a Pathan. Say your prayer,' Guru Ji said gently. Even at the very end, the Guru showed kindness to the boy he had raised."],
lesson:"Pride can turn even a loyal friend against those who love him. True greatness is staying humble, and staying kind, even to someone who has betrayed us.",
think:["How did pride change Painde Khan?","Why did the Guru shade Painde Khan's face at the end?"],
words:[["Pride","Thinking too highly of yourself."],["Betray","To turn against someone who trusted you."]],
quiz:[["Who raised Painde Khan?",["Guru Hargobind Sahib Ji","Emperor Jahangir","Baba Budha Ji"],0],["What did Painde Khan keep for himself?",["A hawk and a robe meant for the Guru","A horse","A sword"],0],["What did Guru Ji do as Painde Khan lay dying?",["Shaded his face with a shield","Walked away","Laughed"],0]],
pa:{t:["ਪੈਂਦੇ ਖ਼ਾਨ ਇੱਕ ਯਤੀਮ ਪਠਾਣ ਮੁੰਡਾ ਸੀ, ਜੋ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਦੀ ਛਤਰ-ਛਾਇਆ ਹੇਠ ਪਲਿਆ। ਉਹ ਬਹੁਤ ਤਕੜਾ ਬਣ ਗਿਆ, ਅਤੇ ਗੁਰੂ ਜੀ ਨੇ ਉਸ ਨੂੰ ਆਪਣੀ ਫ਼ੌਜ ਦਾ ਜਰਨੈਲ ਬਣਾਇਆ। ਉਹ ਸਿੱਖਾਂ ਦੀਆਂ ਜੰਗਾਂ ਵਿੱਚ ਬਹਾਦਰੀ ਨਾਲ ਲੜਿਆ, ਅਤੇ ਗੁਰੂ ਜੀ ਉਸ ਨੂੰ ਪੁੱਤਰਾਂ ਵਾਂਗ ਪਿਆਰ ਕਰਦੇ ਸਨ।","ਪਰ ਹੌਲੀ-ਹੌਲੀ ਪੈਂਦੇ ਖ਼ਾਨ ਨੂੰ ਹੰਕਾਰ ਹੋ ਗਿਆ। ਉਹ ਸੋਚਣ ਲੱਗਾ ਕਿ ਗੁਰੂ ਜੀ ਦੀਆਂ ਜਿੱਤਾਂ ਅਸਲ ਵਿੱਚ ਉਸ ਦੀਆਂ ਹਨ। ਇੱਕ ਦਿਨ ਉਸ ਨੇ ਇੱਕ ਸਿੱਖ ਵੱਲੋਂ ਗੁਰੂ ਜੀ ਲਈ ਭੇਜਿਆ ਸੋਹਣਾ ਬਾਜ਼ ਅਤੇ ਚੋਲਾ ਆਪ ਰੱਖ ਲਿਆ, ਅਤੇ ਫਿਰ ਝੂਠ ਬੋਲਿਆ।","ਜਦੋਂ ਸੱਚ ਸਾਹਮਣੇ ਆਇਆ, ਗੁਰੂ ਜੀ ਨੇ ਉਸ ਨੂੰ ਕਰੜੀ ਸਜ਼ਾ ਨਹੀਂ ਦਿੱਤੀ, ਸਿਰਫ਼ ਜਾਣ ਲਈ ਕਿਹਾ। ਪਛਤਾਉਣ ਦੀ ਥਾਂ ਪੈਂਦੇ ਖ਼ਾਨ ਦੇ ਮਨ ਵਿੱਚ ਕੁੜੱਤਣ ਭਰ ਗਈ। ਉਹ ਮੁਗ਼ਲ ਸੂਬੇਦਾਰ ਕੋਲ ਗਿਆ ਅਤੇ ਉਸ ਗੁਰੂ ਵਿਰੁੱਧ ਫ਼ੌਜ ਲੈ ਕੇ ਚੜ੍ਹਨ ਦੀ ਪੇਸ਼ਕਸ਼ ਕੀਤੀ ਜਿਸ ਨੇ ਉਸ ਨੂੰ ਪਾਲਿਆ ਸੀ।","1635 ਵਿੱਚ ਫ਼ੌਜ ਨੇ ਕਰਤਾਰਪੁਰ ਉੱਤੇ ਹਮਲਾ ਕੀਤਾ, ਅਤੇ ਪੈਂਦੇ ਖ਼ਾਨ ਉਸ ਦੇ ਨਾਲ ਸੀ। ਜੰਗ ਵਿੱਚ ਪੈਂਦੇ ਖ਼ਾਨ ਸਿੱਧਾ ਗੁਰੂ ਜੀ ਵੱਲ ਵਧਿਆ। ਗੁਰੂ ਜੀ ਨੇ ਉਸ ਨੂੰ ਪਹਿਲਾਂ ਤਿੰਨ ਵਾਰ ਵਾਰ ਕਰਨ ਦਿੱਤਾ, ਅਤੇ ਹਰ ਵਾਰ ਆਪਣਾ ਬਚਾਅ ਕੀਤਾ। ਫਿਰ ਗੁਰੂ ਜੀ ਨੇ ਵਾਰ ਕੀਤਾ, ਅਤੇ ਪੈਂਦੇ ਖ਼ਾਨ ਡਿੱਗ ਪਿਆ।","ਜਦੋਂ ਪੈਂਦੇ ਖ਼ਾਨ ਆਖ਼ਰੀ ਸਾਹ ਲੈ ਰਿਹਾ ਸੀ, ਗੁਰੂ ਜੀ ਨੇ ਤਪਦੀ ਧੁੱਪ ਤੋਂ ਬਚਾਉਣ ਲਈ ਆਪਣੀ ਢਾਲ ਨਾਲ ਉਸ ਦੇ ਮੂੰਹ ਉੱਤੇ ਛਾਂ ਕੀਤੀ। ਗੁਰੂ ਜੀ ਨੇ ਨਰਮੀ ਨਾਲ ਕਿਹਾ, 'ਤੂੰ ਪਠਾਣ ਹੈਂ, ਕਲਮਾ ਪੜ੍ਹ ਲੈ।' ਅਖ਼ੀਰਲੇ ਵੇਲੇ ਵੀ ਗੁਰੂ ਜੀ ਨੇ ਆਪਣੇ ਪਾਲੇ ਹੋਏ ਮੁੰਡੇ ਉੱਤੇ ਦਇਆ ਕੀਤੀ।"],l:"ਹੰਕਾਰ ਵਫ਼ਾਦਾਰ ਸਾਥੀ ਨੂੰ ਵੀ ਪਿਆਰ ਕਰਨ ਵਾਲਿਆਂ ਦੇ ਵਿਰੁੱਧ ਕਰ ਸਕਦਾ ਹੈ। ਸੱਚੀ ਵਡਿਆਈ ਨਿਮਰ ਰਹਿਣਾ ਹੈ, ਅਤੇ ਧੋਖਾ ਦੇਣ ਵਾਲੇ ਉੱਤੇ ਵੀ ਦਇਆ ਕਰਨਾ ਹੈ।"}},

{id:"gurditta-cow",title:"Baba Gurditta Ji and the Cow",gur:"ਬਾਬਾ ਗੁਰਦਿੱਤਾ ਜੀ",cat:"Guru Hargobind Sahib Ji",age:"Youth",where:"Kiratpur Sahib",mins:2,c:"#2FA45A",c2:"#F0702A",h:395,art:"forest",
year:1638,loc:["kiratpur"],themes:["Humility","Faith"],
summary:"On a hunt, a poor man's cow is killed by mistake. He begs Baba Gurditta Ji, the Guru's son, to bring it back to life.",
text:["Guru Hargobind Sahib Ji settled at Kiratpur, in the foothills, a town his eldest son, Baba Gurditta Ji, had founded. Baba Gurditta Ji was gentle and holy, and he led the Udasi holy men.","One day in 1638, Baba Gurditta Ji was out hunting in the forest when one of his companions shot an arrow, thinking he was aiming at a deer. But it was a poor farmer's cow, and it died.","The poor man came weeping. 'Please bring my cow back to life,' he begged. 'You are the Guru's son. You can do it.' Baba Gurditta Ji knew that the Gurus did not allow miracles, but he felt so sorry for the man that he brought the cow back to life.","When Guru Hargobind Sahib Ji heard, he was not pleased. 'The Guru's house does not show off miracles,' he said. 'We must accept God's will, not try to change it to win people's praise.'","Baba Gurditta Ji understood how serious this was. He went quietly to a peaceful place, sat in prayer, and soon afterwards he left this world. The place is remembered today at Kiratpur. Later, his son, Har Rai, became the seventh Guru."],
lesson:"The Gurus taught that living in God's will matters more than showing amazing powers. Kindness should never become showing off.",
think:["Why didn't the Gurus allow miracles?","What made this hard for Baba Gurditta Ji?"],
words:[["Miracle","Something amazing that seems impossible."],["Bhana","God's will; accepting what happens with faith."]],
quiz:[["Who founded Kiratpur?",["Baba Gurditta Ji","Guru Nanak Dev Ji","Bhai Bidhi Chand"],0],["What happened to the poor man's cow?",["It was shot by mistake","It ran away","It got sick"],0],["Who was Baba Gurditta Ji's son?",["Guru Har Rai Sahib Ji","Guru Tegh Bahadur Ji","Baba Sri Chand Ji"],0]],
pa:{t:["ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਪਹਾੜਾਂ ਦੇ ਪੈਰਾਂ ਵਿੱਚ ਕੀਰਤਪੁਰ ਆ ਕੇ ਟਿਕ ਗਏ, ਜੋ ਉਨ੍ਹਾਂ ਦੇ ਵੱਡੇ ਪੁੱਤਰ ਬਾਬਾ ਗੁਰਦਿੱਤਾ ਜੀ ਨੇ ਵਸਾਇਆ ਸੀ। ਬਾਬਾ ਗੁਰਦਿੱਤਾ ਜੀ ਨਰਮ ਸੁਭਾਅ ਵਾਲੇ ਅਤੇ ਪਵਿੱਤਰ ਸਨ, ਅਤੇ ਉਦਾਸੀ ਸੰਤਾਂ ਦੀ ਅਗਵਾਈ ਕਰਦੇ ਸਨ।","1638 ਵਿੱਚ ਇੱਕ ਦਿਨ ਬਾਬਾ ਗੁਰਦਿੱਤਾ ਜੀ ਜੰਗਲ ਵਿੱਚ ਸ਼ਿਕਾਰ ਖੇਡ ਰਹੇ ਸਨ ਕਿ ਉਨ੍ਹਾਂ ਦੇ ਇੱਕ ਸਾਥੀ ਨੇ ਹਿਰਨ ਸਮਝ ਕੇ ਤੀਰ ਚਲਾਇਆ। ਪਰ ਉਹ ਇੱਕ ਗਰੀਬ ਕਿਸਾਨ ਦੀ ਗਾਂ ਸੀ, ਅਤੇ ਉਹ ਮਰ ਗਈ।","ਗਰੀਬ ਆਦਮੀ ਰੋਂਦਾ ਹੋਇਆ ਆਇਆ ਅਤੇ ਤਰਲੇ ਕਰਨ ਲੱਗਾ, 'ਮੇਰੀ ਗਾਂ ਨੂੰ ਜਿਉਂਦੀ ਕਰ ਦਿਓ। ਤੁਸੀਂ ਗੁਰੂ ਜੀ ਦੇ ਪੁੱਤਰ ਹੋ, ਤੁਸੀਂ ਕਰ ਸਕਦੇ ਹੋ।' ਬਾਬਾ ਗੁਰਦਿੱਤਾ ਜੀ ਜਾਣਦੇ ਸਨ ਕਿ ਗੁਰੂ ਘਰ ਵਿੱਚ ਕਰਾਮਾਤ ਦੀ ਮਨਾਹੀ ਹੈ, ਪਰ ਉਨ੍ਹਾਂ ਨੂੰ ਉਸ ਆਦਮੀ ਉੱਤੇ ਇੰਨਾ ਤਰਸ ਆਇਆ ਕਿ ਉਨ੍ਹਾਂ ਨੇ ਗਾਂ ਨੂੰ ਜਿਉਂਦੀ ਕਰ ਦਿੱਤਾ।","ਜਦੋਂ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਨੇ ਸੁਣਿਆ, ਉਹ ਖ਼ੁਸ਼ ਨਾ ਹੋਏ। ਉਨ੍ਹਾਂ ਕਿਹਾ, 'ਗੁਰੂ ਘਰ ਕਰਾਮਾਤਾਂ ਨਹੀਂ ਵਿਖਾਉਂਦਾ। ਸਾਨੂੰ ਰੱਬ ਦਾ ਭਾਣਾ ਮੰਨਣਾ ਚਾਹੀਦਾ ਹੈ, ਲੋਕਾਂ ਦੀ ਵਾਹ-ਵਾਹ ਲਈ ਉਸ ਨੂੰ ਬਦਲਣ ਦੀ ਕੋਸ਼ਿਸ਼ ਨਹੀਂ ਕਰਨੀ ਚਾਹੀਦੀ।'","ਬਾਬਾ ਗੁਰਦਿੱਤਾ ਜੀ ਸਮਝ ਗਏ ਕਿ ਇਹ ਕਿੰਨੀ ਗੰਭੀਰ ਗੱਲ ਸੀ। ਉਹ ਚੁੱਪ-ਚਾਪ ਇੱਕ ਸ਼ਾਂਤ ਥਾਂ ਗਏ, ਅਰਦਾਸ ਵਿੱਚ ਬੈਠ ਗਏ, ਅਤੇ ਛੇਤੀ ਹੀ ਇਸ ਸੰਸਾਰ ਤੋਂ ਚਲੇ ਗਏ। ਉਹ ਥਾਂ ਅੱਜ ਵੀ ਕੀਰਤਪੁਰ ਵਿੱਚ ਯਾਦ ਕੀਤੀ ਜਾਂਦੀ ਹੈ। ਬਾਅਦ ਵਿੱਚ ਉਨ੍ਹਾਂ ਦੇ ਪੁੱਤਰ ਹਰਿ ਰਾਇ ਜੀ ਸੱਤਵੇਂ ਗੁਰੂ ਬਣੇ।"],l:"ਗੁਰੂ ਸਾਹਿਬਾਨ ਨੇ ਸਿਖਾਇਆ ਕਿ ਕਰਾਮਾਤੀ ਸ਼ਕਤੀਆਂ ਵਿਖਾਉਣ ਨਾਲੋਂ ਰੱਬ ਦੇ ਭਾਣੇ ਵਿੱਚ ਰਹਿਣਾ ਵੱਡਾ ਹੈ। ਦਇਆ ਕਦੇ ਦਿਖਾਵਾ ਨਹੀਂ ਬਣਨੀ ਚਾਹੀਦੀ।"}},

{id:"anandpur-learning",title:"Anandpur, a Town of Learning",gur:"ਵਿੱਦਿਆ ਦਾ ਕੇਂਦਰ ਅਨੰਦਪੁਰ",cat:"Guru Gobind Singh Ji",age:"Kids",where:"Anandpur Sahib",mins:3,c:"#3B5BDB",c2:"#F2B229",h:400,art:"granth",
year:1686,approx:1,loc:["anandpur"],themes:["Equality","Sewa"],
summary:"Young Gobind Rai learns many languages. When a scholar refuses to teach Sikhs, the Guru finds a clever way around it.",
text:["When young Gobind Rai came to Anandpur from Patna, he began learning Punjabi from Munshi Sahib Chand, so that he could read Guru Nanak's Bani. He was so quick that he learned to recite the whole Granth by heart in less than six months. Teachers also taught him Persian, Sanskrit, Hindi and Braj. He grew up to be a great scholar and poet.","When Emperor Aurangzeb closed many schools of Sanskrit, Guru Gobind Singh Ji invited the scholars to Anandpur, paid their travel, and gave them work. Poets and learned men of many faiths came to live there, including the famous poet Bhai Nand Lal.","But one scholar, Pandit Raghunath, refused to teach Sanskrit to Sikhs. In his view, only high-caste Brahmins were allowed to learn it. Guru Ji believed that knowledge should be open to everyone.","So Guru Ji sent five Sikhs, dressed in simple robes, to Kashi (Banaras), a great centre of learning, to study Sanskrit. When they came back, they taught it to other Sikhs. These Sikh scholars became known as the Nirmalas.","Anyone who visited Anandpur was taught to read Gurbani, and given a book of the Guru's hymns to take home. They taught their families and friends, and learning spread to every village. Anandpur became a town where everyone, rich or poor, of any caste, could learn."],
lesson:"Knowledge belongs to everyone. Guru Gobind Singh Ji made sure that learning was open to all people, whatever their caste.",
think:["Why did Pandit Raghunath refuse to teach the Sikhs?","Why is it important that everyone can learn?"],
words:[["Nirmalas","Sikh scholars sent by Guru Gobind Singh Ji to study Sanskrit."],["Scholar","Someone who has studied a great deal."]],
quiz:[["How quickly did young Gobind Rai learn the whole Granth by heart?",["In less than six months","In ten years","In one day"],0],["Why wouldn't Pandit Raghunath teach the Sikhs?",["He thought only Brahmins could learn Sanskrit","He was too busy","He didn't know Sanskrit"],0],["Where did Guru Ji send five Sikhs to study?",["Kashi (Banaras)","Lahore","Delhi"],0]],
pa:{t:["ਜਦੋਂ ਬਾਲ ਗੋਬਿੰਦ ਰਾਇ ਪਟਨੇ ਤੋਂ ਅਨੰਦਪੁਰ ਆਏ, ਉਨ੍ਹਾਂ ਨੇ ਮੁਨਸ਼ੀ ਸਾਹਿਬ ਚੰਦ ਤੋਂ ਪੰਜਾਬੀ ਸਿੱਖਣੀ ਸ਼ੁਰੂ ਕੀਤੀ, ਤਾਂ ਜੋ ਗੁਰੂ ਨਾਨਕ ਦੀ ਬਾਣੀ ਪੜ੍ਹ ਸਕਣ। ਉਹ ਇੰਨੇ ਤੀਖਣ ਬੁੱਧੀ ਸਨ ਕਿ ਛੇ ਮਹੀਨਿਆਂ ਤੋਂ ਘੱਟ ਸਮੇਂ ਵਿੱਚ ਸਾਰਾ ਗ੍ਰੰਥ ਜ਼ੁਬਾਨੀ ਯਾਦ ਕਰ ਲਿਆ। ਅਧਿਆਪਕਾਂ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਫ਼ਾਰਸੀ, ਸੰਸਕ੍ਰਿਤ, ਹਿੰਦੀ ਅਤੇ ਬ੍ਰਜ ਵੀ ਪੜ੍ਹਾਈ। ਉਹ ਵੱਡੇ ਹੋ ਕੇ ਮਹਾਨ ਵਿਦਵਾਨ ਅਤੇ ਕਵੀ ਬਣੇ।","ਜਦੋਂ ਬਾਦਸ਼ਾਹ ਔਰੰਗਜ਼ੇਬ ਨੇ ਸੰਸਕ੍ਰਿਤ ਦੀਆਂ ਬਹੁਤ ਪਾਠਸ਼ਾਲਾਵਾਂ ਬੰਦ ਕਰਵਾ ਦਿੱਤੀਆਂ, ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਵਿਦਵਾਨਾਂ ਨੂੰ ਸਫ਼ਰ ਖ਼ਰਚ ਦੇ ਕੇ ਅਨੰਦਪੁਰ ਸੱਦਿਆ ਅਤੇ ਕੰਮ ਦਿੱਤਾ। ਕਈ ਧਰਮਾਂ ਦੇ ਕਵੀ ਅਤੇ ਵਿਦਵਾਨ ਉੱਥੇ ਆ ਕੇ ਵੱਸੇ, ਪ੍ਰਸਿੱਧ ਕਵੀ ਭਾਈ ਨੰਦ ਲਾਲ ਜੀ ਵੀ।","ਪਰ ਇੱਕ ਵਿਦਵਾਨ, ਪੰਡਿਤ ਰਘੂਨਾਥ, ਨੇ ਸਿੱਖਾਂ ਨੂੰ ਸੰਸਕ੍ਰਿਤ ਪੜ੍ਹਾਉਣ ਤੋਂ ਨਾਂਹ ਕਰ ਦਿੱਤੀ। ਉਸ ਦੇ ਖ਼ਿਆਲ ਵਿੱਚ ਸਿਰਫ਼ ਉੱਚੀ ਜਾਤ ਦੇ ਬ੍ਰਾਹਮਣ ਹੀ ਇਹ ਪੜ੍ਹ ਸਕਦੇ ਸਨ। ਗੁਰੂ ਜੀ ਮੰਨਦੇ ਸਨ ਕਿ ਵਿੱਦਿਆ ਸਭ ਲਈ ਖੁੱਲ੍ਹੀ ਹੋਣੀ ਚਾਹੀਦੀ ਹੈ।","ਇਸ ਲਈ ਗੁਰੂ ਜੀ ਨੇ ਪੰਜ ਸਿੱਖਾਂ ਨੂੰ ਸਾਦੇ ਬਸਤਰਾਂ ਵਿੱਚ ਵਿੱਦਿਆ ਦੇ ਵੱਡੇ ਕੇਂਦਰ ਕਾਸ਼ੀ (ਬਨਾਰਸ) ਸੰਸਕ੍ਰਿਤ ਪੜ੍ਹਨ ਭੇਜਿਆ। ਵਾਪਸ ਆ ਕੇ ਉਨ੍ਹਾਂ ਨੇ ਹੋਰ ਸਿੱਖਾਂ ਨੂੰ ਪੜ੍ਹਾਇਆ। ਇਹ ਸਿੱਖ ਵਿਦਵਾਨ ਨਿਰਮਲੇ ਕਹਾਏ।","ਅਨੰਦਪੁਰ ਆਉਣ ਵਾਲੇ ਹਰ ਕਿਸੇ ਨੂੰ ਗੁਰਬਾਣੀ ਪੜ੍ਹਨੀ ਸਿਖਾਈ ਜਾਂਦੀ, ਅਤੇ ਘਰ ਲਿਜਾਣ ਲਈ ਗੁਰਬਾਣੀ ਦੀ ਪੋਥੀ ਦਿੱਤੀ ਜਾਂਦੀ। ਉਹ ਆਪਣੇ ਪਰਿਵਾਰਾਂ ਅਤੇ ਮਿੱਤਰਾਂ ਨੂੰ ਪੜ੍ਹਾਉਂਦੇ, ਅਤੇ ਵਿੱਦਿਆ ਪਿੰਡ-ਪਿੰਡ ਫੈਲ ਗਈ। ਅਨੰਦਪੁਰ ਅਜਿਹਾ ਨਗਰ ਬਣ ਗਿਆ ਜਿੱਥੇ ਅਮੀਰ-ਗਰੀਬ, ਕਿਸੇ ਵੀ ਜਾਤ ਦਾ ਹਰ ਕੋਈ ਪੜ੍ਹ ਸਕਦਾ ਸੀ।"],l:"ਵਿੱਦਿਆ ਸਭ ਦੀ ਸਾਂਝੀ ਹੈ। ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨੇ ਯਕੀਨੀ ਬਣਾਇਆ ਕਿ ਵਿੱਦਿਆ ਹਰ ਜਾਤ ਦੇ ਹਰ ਮਨੁੱਖ ਲਈ ਖੁੱਲ੍ਹੀ ਹੋਵੇ।"}},

{id:"bachittar-singh",title:"Bhai Bachittar Singh and the Elephant",gur:"ਭਾਈ ਬਚਿੱਤਰ ਸਿੰਘ",cat:"Guru Gobind Singh Ji",age:"Kids",where:"Lohgarh fort, Anandpur",mins:3,c:"#DC3B32",c2:"#F2B229",h:400,art:"fort",
year:1700,approx:1,loc:["anandpur"],themes:["Courage"],
summary:"The hill kings send a giant armoured elephant to smash the fort gate. Guru Gobind Singh Ji says, 'We have an elephant too.'",
text:["The hill kings had surrounded Anandpur, but after two months they still could not break in. Raja Kesari Chand came up with a plan. 'We'll give an elephant strong drink to make it wild, tie iron plates to its head, and send it to smash the gate of Lohgarh fort.'","A spy told Guru Gobind Singh Ji about the plan. Guru Ji said calmly, 'We have an elephant in the fort too, who can beat their elephant.' A Sikh named Duni Chand was standing nearby. He was frightened, thinking the Guru meant him! That night he climbed over the wall and ran away.","The next morning, the huge armoured elephant came charging towards the gate. Guru Ji called Bhai Bachittar Singh, a young and brave Sikh, and blessed him. He gave him a special spear called a nagni barchha.","The gate was opened. Bhai Bachittar Singh rode out on his horse, straight towards the giant elephant. With all his strength, he drove the spear through the iron plate on its forehead. The wounded elephant screamed, turned around, and stampeded back into the army that had sent it, scattering the soldiers.","The attack failed, and the Sikhs cheered. Guru Ji's 'elephant' had been a brave young Sikh with a strong heart. Later, Duni Chand's own sons felt ashamed of how their father had run away. They came to Anandpur, took Amrit, and served the Guru faithfully."],
lesson:"Courage isn't about size. A brave heart, and faith, can overcome even a giant.",
think:["Why did Duni Chand run away?","What made Bhai Bachittar Singh so brave?"],
words:[["Nagni barchha","A special spear; Bhai Bachittar Singh's spear is still kept as a treasured relic."],["Siege","When an army surrounds a place to force it to give up."]],
quiz:[["What did the hill kings send against the gate?",["An armoured elephant","A cannon","A fire"],0],["Who rode out to face it?",["Bhai Bachittar Singh","Duni Chand","Raja Kesari Chand"],0],["What did the elephant do after being struck?",["Turned back into its own army","Broke the gate","Fell asleep"],0]],
pa:{t:["ਪਹਾੜੀ ਰਾਜਿਆਂ ਨੇ ਅਨੰਦਪੁਰ ਨੂੰ ਘੇਰਿਆ ਹੋਇਆ ਸੀ, ਪਰ ਦੋ ਮਹੀਨਿਆਂ ਬਾਅਦ ਵੀ ਉਹ ਅੰਦਰ ਨਾ ਵੜ ਸਕੇ। ਰਾਜਾ ਕੇਸਰੀ ਚੰਦ ਨੇ ਇੱਕ ਸਕੀਮ ਬਣਾਈ: 'ਅਸੀਂ ਇੱਕ ਹਾਥੀ ਨੂੰ ਸ਼ਰਾਬ ਪਿਆ ਕੇ ਮਸਤ ਕਰਾਂਗੇ, ਉਸ ਦੇ ਮੱਥੇ ਉੱਤੇ ਲੋਹੇ ਦੀਆਂ ਤਵੀਆਂ ਬੰਨ੍ਹਾਂਗੇ, ਅਤੇ ਲੋਹਗੜ੍ਹ ਕਿਲ੍ਹੇ ਦਾ ਦਰਵਾਜ਼ਾ ਤੋੜਨ ਭੇਜਾਂਗੇ।'","ਇੱਕ ਸੂਹੀਏ ਨੇ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨੂੰ ਇਸ ਸਕੀਮ ਬਾਰੇ ਦੱਸਿਆ। ਗੁਰੂ ਜੀ ਨੇ ਸ਼ਾਂਤੀ ਨਾਲ ਕਿਹਾ, 'ਕਿਲ੍ਹੇ ਵਿੱਚ ਸਾਡਾ ਵੀ ਇੱਕ ਹਾਥੀ ਹੈ, ਜੋ ਉਨ੍ਹਾਂ ਦੇ ਹਾਥੀ ਨੂੰ ਹਰਾ ਦੇਵੇਗਾ।' ਦੁਨੀ ਚੰਦ ਨਾਂ ਦਾ ਇੱਕ ਸਿੱਖ ਨੇੜੇ ਖੜ੍ਹਾ ਸੀ। ਉਹ ਡਰ ਗਿਆ, ਇਹ ਸੋਚ ਕੇ ਕਿ ਗੁਰੂ ਜੀ ਉਸ ਦੀ ਗੱਲ ਕਰ ਰਹੇ ਹਨ! ਉਸ ਰਾਤ ਉਹ ਕੰਧ ਟੱਪ ਕੇ ਭੱਜ ਗਿਆ।","ਅਗਲੀ ਸਵੇਰ ਲੋਹੇ ਨਾਲ ਲੱਦਿਆ ਵੱਡਾ ਹਾਥੀ ਦਰਵਾਜ਼ੇ ਵੱਲ ਦੌੜਦਾ ਆਇਆ। ਗੁਰੂ ਜੀ ਨੇ ਇੱਕ ਨੌਜਵਾਨ ਅਤੇ ਬਹਾਦਰ ਸਿੱਖ, ਭਾਈ ਬਚਿੱਤਰ ਸਿੰਘ, ਨੂੰ ਸੱਦ ਕੇ ਥਾਪੜਾ ਦਿੱਤਾ। ਉਨ੍ਹਾਂ ਨੇ ਉਸ ਨੂੰ ਨਾਗਣੀ ਬਰਛਾ ਬਖ਼ਸ਼ਿਆ।","ਦਰਵਾਜ਼ਾ ਖੋਲ੍ਹਿਆ ਗਿਆ। ਭਾਈ ਬਚਿੱਤਰ ਸਿੰਘ ਘੋੜੇ ਉੱਤੇ ਸਿੱਧਾ ਵੱਡੇ ਹਾਥੀ ਵੱਲ ਵਧੇ। ਪੂਰੇ ਜ਼ੋਰ ਨਾਲ ਉਨ੍ਹਾਂ ਨੇ ਬਰਛਾ ਹਾਥੀ ਦੇ ਮੱਥੇ ਦੀ ਲੋਹੇ ਦੀ ਤਵੀ ਵਿੱਚੋਂ ਆਰ-ਪਾਰ ਕਰ ਦਿੱਤਾ। ਜ਼ਖ਼ਮੀ ਹਾਥੀ ਚਿੰਘਾੜਿਆ, ਮੁੜਿਆ, ਅਤੇ ਉਸ ਨੂੰ ਭੇਜਣ ਵਾਲੀ ਫ਼ੌਜ ਵਿੱਚ ਹੀ ਜਾ ਵੜਿਆ ਅਤੇ ਸਿਪਾਹੀਆਂ ਨੂੰ ਖਿੰਡਾ ਦਿੱਤਾ।","ਹਮਲਾ ਫ਼ੇਲ੍ਹ ਹੋ ਗਿਆ, ਅਤੇ ਸਿੱਖਾਂ ਨੇ ਜੈਕਾਰੇ ਛੱਡੇ। ਗੁਰੂ ਜੀ ਦਾ 'ਹਾਥੀ' ਇੱਕ ਮਜ਼ਬੂਤ ਦਿਲ ਵਾਲਾ ਬਹਾਦਰ ਨੌਜਵਾਨ ਸਿੱਖ ਸੀ। ਬਾਅਦ ਵਿੱਚ ਦੁਨੀ ਚੰਦ ਦੇ ਆਪਣੇ ਪੁੱਤਰਾਂ ਨੂੰ ਪਿਤਾ ਦੇ ਭੱਜਣ ਉੱਤੇ ਸ਼ਰਮ ਆਈ। ਉਹ ਅਨੰਦਪੁਰ ਆਏ, ਅੰਮ੍ਰਿਤ ਛਕਿਆ, ਅਤੇ ਵਫ਼ਾਦਾਰੀ ਨਾਲ ਗੁਰੂ ਜੀ ਦੀ ਸੇਵਾ ਕੀਤੀ।"],l:"ਹੌਸਲਾ ਕੱਦ-ਕਾਠ ਉੱਤੇ ਨਿਰਭਰ ਨਹੀਂ ਕਰਦਾ। ਬਹਾਦਰ ਦਿਲ ਅਤੇ ਭਰੋਸਾ ਦੈਂਤ ਨੂੰ ਵੀ ਹਰਾ ਸਕਦੇ ਹਨ।"}},

{id:"said-beg",title:"Said Beg Changes Sides",gur:"ਸੈਦ ਬੇਗ",cat:"Guru Gobind Singh Ji",age:"Kids",where:"Near Chamkaur and Anandpur",mins:2,c:"#1FA38A",c2:"#DC3B32",h:395,art:"horse",
year:1703,approx:1,loc:["anandpur"],themes:["Courage","Equality"],
summary:"A Mughal general rides out to capture Guru Gobind Singh Ji. On the battlefield, something changes his heart.",
text:["Said Beg and Alif Khan were two generals of Emperor Aurangzeb, travelling from Delhi to Lahore with their armies. A spy told them, 'Guru Gobind Singh is on his way to Anandpur with only a hundred Sikhs. This is your chance to capture him!'","The generals had thousands of soldiers each, so they were sure of an easy victory. But the Sikhs at Anandpur heard what was happening, and four hundred more Sikhs rode out to join the Guru.","When the battle began, Said Beg watched the Sikhs fight. They fought fearlessly and fairly, and there was something about them, and about the Guru, that touched his heart. He forgot that he was supposed to be fighting them.","Said Beg handed command of his army to Alif Khan and rode over to join the Guru! Without him, the royal army lost the battle. Said Beg went with Guru Ji to Anandpur and made it his home.","At Anandpur he found a place where everyone was taught, 'We are all children of the same Father, the one God.' Rich and poor were treated with the same respect, and Hindus and Muslims were treated alike. Said Beg served the Guru faithfully, and later gave his life fighting against injustice."],
lesson:"When we see true goodness, it can change our whole direction. Respect and equality attract good hearts from everywhere.",
think:["What made Said Beg change sides?","What was special about life in Anandpur?"],
words:[["General","A leader of an army."],["Injustice","When people are treated unfairly."]],
quiz:[["How many Sikhs were with the Guru at first?",["About a hundred","Ten thousand","Five"],0],["What did Said Beg do during the battle?",["Joined the Guru","Ran away","Captured the Guru"],0],["What was taught at Anandpur?",["We are all children of the same Father","Only soldiers matter","Rich people come first"],0]],
pa:{t:["ਸੈਦ ਬੇਗ ਅਤੇ ਅਲਫ਼ ਖ਼ਾਨ ਬਾਦਸ਼ਾਹ ਔਰੰਗਜ਼ੇਬ ਦੇ ਦੋ ਜਰਨੈਲ ਸਨ, ਜੋ ਆਪਣੀਆਂ ਫ਼ੌਜਾਂ ਨਾਲ ਦਿੱਲੀ ਤੋਂ ਲਾਹੌਰ ਜਾ ਰਹੇ ਸਨ। ਇੱਕ ਸੂਹੀਏ ਨੇ ਦੱਸਿਆ, 'ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਸਿਰਫ਼ ਸੌ ਸਿੱਖਾਂ ਨਾਲ ਅਨੰਦਪੁਰ ਜਾ ਰਹੇ ਹਨ। ਉਨ੍ਹਾਂ ਨੂੰ ਫੜਨ ਦਾ ਇਹੀ ਮੌਕਾ ਹੈ!'","ਦੋਹਾਂ ਜਰਨੈਲਾਂ ਕੋਲ ਹਜ਼ਾਰਾਂ ਸਿਪਾਹੀ ਸਨ, ਇਸ ਲਈ ਉਨ੍ਹਾਂ ਨੂੰ ਸੌਖੀ ਜਿੱਤ ਦਾ ਯਕੀਨ ਸੀ। ਪਰ ਅਨੰਦਪੁਰ ਦੇ ਸਿੱਖਾਂ ਨੂੰ ਖ਼ਬਰ ਮਿਲ ਗਈ, ਅਤੇ ਚਾਰ ਸੌ ਹੋਰ ਸਿੱਖ ਘੋੜੇ ਦੌੜਾ ਕੇ ਗੁਰੂ ਜੀ ਨਾਲ ਆ ਰਲੇ।","ਜਦੋਂ ਜੰਗ ਸ਼ੁਰੂ ਹੋਈ, ਸੈਦ ਬੇਗ ਸਿੱਖਾਂ ਨੂੰ ਲੜਦਿਆਂ ਵੇਖਦਾ ਰਿਹਾ। ਉਹ ਨਿਡਰ ਹੋ ਕੇ ਅਤੇ ਧਰਮ-ਯੁੱਧ ਦੇ ਨਿਯਮਾਂ ਨਾਲ ਲੜ ਰਹੇ ਸਨ, ਅਤੇ ਉਨ੍ਹਾਂ ਵਿੱਚ ਅਤੇ ਗੁਰੂ ਜੀ ਵਿੱਚ ਕੁਝ ਅਜਿਹਾ ਸੀ ਜਿਸ ਨੇ ਉਸ ਦਾ ਦਿਲ ਛੂਹ ਲਿਆ। ਉਹ ਭੁੱਲ ਹੀ ਗਿਆ ਕਿ ਉਸ ਨੇ ਤਾਂ ਉਨ੍ਹਾਂ ਨਾਲ ਲੜਨਾ ਸੀ।","ਸੈਦ ਬੇਗ ਨੇ ਆਪਣੀ ਫ਼ੌਜ ਦੀ ਕਮਾਨ ਅਲਫ਼ ਖ਼ਾਨ ਨੂੰ ਸੌਂਪੀ ਅਤੇ ਘੋੜਾ ਦੌੜਾ ਕੇ ਗੁਰੂ ਜੀ ਨਾਲ ਆ ਮਿਲਿਆ! ਉਸ ਤੋਂ ਬਿਨਾਂ ਸ਼ਾਹੀ ਫ਼ੌਜ ਜੰਗ ਹਾਰ ਗਈ। ਸੈਦ ਬੇਗ ਗੁਰੂ ਜੀ ਨਾਲ ਅਨੰਦਪੁਰ ਆ ਗਿਆ ਅਤੇ ਉੱਥੇ ਹੀ ਵੱਸ ਗਿਆ।","ਅਨੰਦਪੁਰ ਵਿੱਚ ਉਸ ਨੇ ਵੇਖਿਆ ਕਿ ਹਰ ਕਿਸੇ ਨੂੰ ਸਿਖਾਇਆ ਜਾਂਦਾ ਸੀ: 'ਅਸੀਂ ਸਾਰੇ ਇੱਕੋ ਪਿਤਾ, ਇੱਕ ਰੱਬ, ਦੇ ਬੱਚੇ ਹਾਂ।' ਅਮੀਰ ਅਤੇ ਗਰੀਬ ਦਾ ਇੱਕੋ ਜਿਹਾ ਸਤਿਕਾਰ ਹੁੰਦਾ ਸੀ, ਅਤੇ ਹਿੰਦੂਆਂ ਅਤੇ ਮੁਸਲਮਾਨਾਂ ਨਾਲ ਇੱਕੋ ਜਿਹਾ ਸਲੂਕ ਹੁੰਦਾ ਸੀ। ਸੈਦ ਬੇਗ ਨੇ ਵਫ਼ਾਦਾਰੀ ਨਾਲ ਗੁਰੂ ਜੀ ਦੀ ਸੇਵਾ ਕੀਤੀ, ਅਤੇ ਬਾਅਦ ਵਿੱਚ ਜ਼ੁਲਮ ਵਿਰੁੱਧ ਲੜਦਿਆਂ ਸ਼ਹੀਦੀ ਪਾਈ।"],l:"ਜਦੋਂ ਅਸੀਂ ਸੱਚੀ ਨੇਕੀ ਵੇਖਦੇ ਹਾਂ, ਉਹ ਸਾਡੀ ਸਾਰੀ ਦਿਸ਼ਾ ਬਦਲ ਸਕਦੀ ਹੈ। ਸਤਿਕਾਰ ਅਤੇ ਬਰਾਬਰੀ ਹਰ ਪਾਸਿਓਂ ਚੰਗੇ ਦਿਲਾਂ ਨੂੰ ਖਿੱਚਦੇ ਹਨ।"}},

{id:"said-khan",title:"Said Khan Meets the Guru",gur:"ਸੈਦ ਖ਼ਾਨ",cat:"Guru Gobind Singh Ji",age:"Kids",where:"Sadhaura and Anandpur",mins:2,c:"#4867D6",c2:"#F0702A",h:395,art:"sword",
year:1703,approx:1,loc:["sadhaura","anandpur"],themes:["Faith","Humility"],
summary:"A commander sets off to bring back Guru Gobind Singh Ji, dead or alive. On the way he stops at his sister's house.",
text:["The hill kings had failed again and again to defeat Anandpur, so they wrote to Emperor Aurangzeb for help. Aurangzeb sent a commander named Said Khan, who promised to bring the Guru back to Delhi, dead or alive.","On the way, Said Khan stopped for the night at Sadhaura, at the home of his sister. She was the widow of Pir Budhu Shah, the Sufi saint who had stood by the Guru. 'Brother,' she said, 'it is wrong to attack holy people. We should go to them to learn, not to capture them. The Guru isn't fighting for a kingdom; he's fighting against cruelty. I gave my husband and two sons for him. He knows what is in people's hearts.'","Said Khan did not listen. He joined the hill kings and attacked Anandpur. But in the middle of the battle, he thought, 'If the Guru really knows what is in people's minds, as my sister says, let him come and face me himself.'","At that very moment, Guru Gobind Singh Ji rode up in front of him. 'Said Khan, you called for me, so I have come. Strike first if you wish.' Said Khan was so astonished that he forgot to lift his sword.","All his plans melted away. He laid his sword at the Guru's feet. He gave up his command, left the army, and spent the rest of his life in prayer and meditation, remembering God."],
lesson:"Wise advice from people who love us is worth listening to. Meeting real goodness can change our hearts completely.",
think:["What advice did Said Khan's sister give him?","Why did Said Khan forget to strike?"],
words:[["Commander","A leader of soldiers."],["Sufi","A Muslim mystic or saint who seeks God through love."]],
quiz:[["Whose widow was Said Khan's sister?",["Pir Budhu Shah's","Bhai Mani Singh's","Raja Kesari Chand's"],0],["What did Said Khan wish during the battle?",["That the Guru would come and face him","That it would rain","That he could go home"],0],["What did Said Khan do at the end?",["Laid his sword at the Guru's feet","Attacked the Guru","Ran away to Delhi"],0]],
pa:{t:["ਪਹਾੜੀ ਰਾਜੇ ਵਾਰ-ਵਾਰ ਅਨੰਦਪੁਰ ਨੂੰ ਜਿੱਤਣ ਵਿੱਚ ਨਾਕਾਮ ਰਹੇ, ਇਸ ਲਈ ਉਨ੍ਹਾਂ ਨੇ ਮਦਦ ਲਈ ਬਾਦਸ਼ਾਹ ਔਰੰਗਜ਼ੇਬ ਨੂੰ ਲਿਖਿਆ। ਔਰੰਗਜ਼ੇਬ ਨੇ ਸੈਦ ਖ਼ਾਨ ਨਾਂ ਦਾ ਇੱਕ ਸੈਨਾਪਤੀ ਭੇਜਿਆ, ਜਿਸ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਜਿਉਂਦਾ ਜਾਂ ਮੁਰਦਾ ਦਿੱਲੀ ਲਿਆਉਣ ਦਾ ਪ੍ਰਣ ਕੀਤਾ।","ਰਾਹ ਵਿੱਚ ਸੈਦ ਖ਼ਾਨ ਰਾਤ ਕੱਟਣ ਲਈ ਸਢੌਰੇ ਆਪਣੀ ਭੈਣ ਦੇ ਘਰ ਰੁਕਿਆ। ਉਹ ਪੀਰ ਬੁੱਧੂ ਸ਼ਾਹ ਦੀ ਵਿਧਵਾ ਸੀ, ਉਹ ਸੂਫ਼ੀ ਫ਼ਕੀਰ ਜੋ ਗੁਰੂ ਜੀ ਦੇ ਨਾਲ ਖੜ੍ਹੇ ਸਨ। ਉਸ ਨੇ ਕਿਹਾ, 'ਵੀਰਾ, ਫ਼ਕੀਰਾਂ ਉੱਤੇ ਹਮਲਾ ਕਰਨਾ ਗ਼ਲਤ ਹੈ। ਉਨ੍ਹਾਂ ਕੋਲ ਕੁਝ ਸਿੱਖਣ ਜਾਈਦਾ ਹੈ, ਫੜਨ ਨਹੀਂ। ਗੁਰੂ ਜੀ ਰਾਜ ਲਈ ਨਹੀਂ, ਜ਼ੁਲਮ ਵਿਰੁੱਧ ਲੜ ਰਹੇ ਹਨ। ਮੈਂ ਉਨ੍ਹਾਂ ਲਈ ਆਪਣਾ ਪਤੀ ਅਤੇ ਦੋ ਪੁੱਤਰ ਵਾਰ ਦਿੱਤੇ ਹਨ। ਉਹ ਦਿਲਾਂ ਦੀਆਂ ਜਾਣਦੇ ਹਨ।'","ਸੈਦ ਖ਼ਾਨ ਨੇ ਗੱਲ ਨਾ ਮੰਨੀ। ਉਹ ਪਹਾੜੀ ਰਾਜਿਆਂ ਨਾਲ ਰਲ ਕੇ ਅਨੰਦਪੁਰ ਉੱਤੇ ਚੜ੍ਹ ਆਇਆ। ਪਰ ਜੰਗ ਦੇ ਵਿਚਕਾਰ ਉਸ ਨੇ ਸੋਚਿਆ, 'ਜੇ ਗੁਰੂ ਸੱਚਮੁੱਚ ਮਨਾਂ ਦੀਆਂ ਜਾਣਦੇ ਹਨ, ਜਿਵੇਂ ਮੇਰੀ ਭੈਣ ਕਹਿੰਦੀ ਹੈ, ਤਾਂ ਆਪ ਆ ਕੇ ਮੇਰਾ ਸਾਹਮਣਾ ਕਰਨ।'","ਉਸੇ ਪਲ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਘੋੜੇ ਉੱਤੇ ਉਸ ਦੇ ਸਾਹਮਣੇ ਆ ਖੜ੍ਹੇ ਹੋਏ। 'ਸੈਦ ਖ਼ਾਨ, ਤੂੰ ਮੈਨੂੰ ਯਾਦ ਕੀਤਾ, ਇਸ ਲਈ ਮੈਂ ਆ ਗਿਆ ਹਾਂ। ਚਾਹੇਂ ਤਾਂ ਪਹਿਲਾ ਵਾਰ ਕਰ ਲੈ।' ਸੈਦ ਖ਼ਾਨ ਇੰਨਾ ਹੈਰਾਨ ਹੋਇਆ ਕਿ ਤਲਵਾਰ ਚੁੱਕਣੀ ਹੀ ਭੁੱਲ ਗਿਆ।","ਉਸ ਦੀਆਂ ਸਾਰੀਆਂ ਸਕੀਮਾਂ ਖ਼ਤਮ ਹੋ ਗਈਆਂ। ਉਸ ਨੇ ਆਪਣੀ ਤਲਵਾਰ ਗੁਰੂ ਜੀ ਦੇ ਚਰਨਾਂ ਵਿੱਚ ਰੱਖ ਦਿੱਤੀ। ਉਸ ਨੇ ਕਮਾਨ ਛੱਡ ਦਿੱਤੀ, ਫ਼ੌਜ ਤਿਆਗ ਦਿੱਤੀ, ਅਤੇ ਬਾਕੀ ਜੀਵਨ ਰੱਬ ਦੀ ਬੰਦਗੀ ਵਿੱਚ ਗੁਜ਼ਾਰਿਆ।"],l:"ਪਿਆਰ ਕਰਨ ਵਾਲਿਆਂ ਦੀ ਸਿਆਣੀ ਸਲਾਹ ਸੁਣਨੀ ਚਾਹੀਦੀ ਹੈ। ਸੱਚੀ ਨੇਕੀ ਨਾਲ ਮੇਲ ਦਿਲ ਨੂੰ ਪੂਰੀ ਤਰ੍ਹਾਂ ਬਦਲ ਸਕਦਾ ਹੈ।"}},

{id:"uch-da-pir",title:"Uch Da Pir",gur:"ਉੱਚ ਦਾ ਪੀਰ",cat:"Guru Gobind Singh Ji",age:"Kids",where:"Machhiwara",mins:3,c:"#3B5BDB",c2:"#F2B229",h:400,art:"door",
year:1704,loc:["machhiwara"],themes:["Courage","Equality"],
summary:"After Chamkaur, Guru Gobind Singh Ji is alone in the forests of Machhiwara, with soldiers searching everywhere. Two Muslim brothers come to help.",
text:["After the battle of Chamkaur, the Khalsa asked Guru Gobind Singh Ji to leave the fort in the dark of night. Walking alone through the forest, he reached Machhiwara, tired, his feet sore. He lay down to rest in a garden, with a stone for a pillow. Three Sikhs, Bhai Daya Singh, Bhai Dharam Singh and Bhai Man Singh, found him there.","The garden's owner, Gulaba, was frightened. The emperor's soldiers were searching everywhere for the Guru. But two Muslim brothers, Nabi Khan and Ghani Khan, heard the Guru was there. They were horse traders who had often sold horses to the Guru at Anandpur, and had come to love him because everyone was treated equally there.","They brought food and said, 'Please come to our house and let us serve you.' At night they made a brave plan. They dressed the Guru in long blue robes, like a holy Muslim saint, and called him 'Uch Da Pir', the holy saint of Uch.","They sat him on a bed and carried it on their shoulders: Nabi Khan and Ghani Khan at the front, Bhai Dharam Singh and Bhai Man Singh at the back, and Bhai Daya Singh waving a fan of peacock feathers over him. When soldiers stopped them, the brothers answered their questions. Qazi Pir Mohammad, who had once taught the Guru Persian, told the soldiers, 'This is a man of God. Let him go.' The soldiers bowed and let them pass.","The brothers carried the Guru safely past the army. At the end of the journey, Guru Ji thanked them and gave them a hukamnama, a letter of honour, which their family treasured for generations."],
lesson:"True friends stand by us in danger, whatever their religion. Nabi Khan and Ghani Khan risked their lives out of love and respect.",
think:["Why did Nabi Khan and Ghani Khan love the Guru?","What risks did they take to help him?"],
words:[["Uch Da Pir","'The holy saint of Uch', the disguise used to carry the Guru to safety."],["Hukamnama","A letter written by the Guru."]],
quiz:[["What did Nabi Khan and Ghani Khan trade in?",["Horses","Cloth","Spices"],0],["What colour robes did the Guru wear in the disguise?",["Blue","Red","White"],0],["Who told the soldiers to let them pass?",["Qazi Pir Mohammad","Gulaba","Raja Kesari Chand"],0]],
pa:{t:["ਚਮਕੌਰ ਦੀ ਜੰਗ ਤੋਂ ਬਾਅਦ ਖ਼ਾਲਸੇ ਨੇ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨੂੰ ਰਾਤ ਦੇ ਹਨੇਰੇ ਵਿੱਚ ਗੜ੍ਹੀ ਛੱਡਣ ਲਈ ਕਿਹਾ। ਜੰਗਲ ਵਿੱਚ ਇਕੱਲੇ ਤੁਰਦੇ, ਥੱਕੇ ਅਤੇ ਛਾਲਿਆਂ ਵਾਲੇ ਪੈਰਾਂ ਨਾਲ ਉਹ ਮਾਛੀਵਾੜੇ ਪਹੁੰਚੇ। ਉਹ ਇੱਕ ਬਾਗ਼ ਵਿੱਚ ਪੱਥਰ ਦਾ ਸਿਰਹਾਣਾ ਲਾ ਕੇ ਲੇਟ ਗਏ। ਤਿੰਨ ਸਿੱਖ, ਭਾਈ ਦਇਆ ਸਿੰਘ, ਭਾਈ ਧਰਮ ਸਿੰਘ ਅਤੇ ਭਾਈ ਮਾਨ ਸਿੰਘ, ਉਨ੍ਹਾਂ ਨੂੰ ਲੱਭਦੇ ਉੱਥੇ ਪਹੁੰਚ ਗਏ।","ਬਾਗ਼ ਦਾ ਮਾਲਕ ਗੁਲਾਬਾ ਡਰ ਗਿਆ। ਬਾਦਸ਼ਾਹ ਦੇ ਸਿਪਾਹੀ ਹਰ ਪਾਸੇ ਗੁਰੂ ਜੀ ਨੂੰ ਲੱਭ ਰਹੇ ਸਨ। ਪਰ ਦੋ ਮੁਸਲਮਾਨ ਭਰਾਵਾਂ, ਨਬੀ ਖ਼ਾਨ ਅਤੇ ਗ਼ਨੀ ਖ਼ਾਨ, ਨੇ ਸੁਣਿਆ ਕਿ ਗੁਰੂ ਜੀ ਉੱਥੇ ਹਨ। ਉਹ ਘੋੜਿਆਂ ਦੇ ਵਪਾਰੀ ਸਨ, ਜਿਨ੍ਹਾਂ ਨੇ ਅਨੰਦਪੁਰ ਵਿੱਚ ਗੁਰੂ ਜੀ ਨੂੰ ਕਈ ਵਾਰ ਘੋੜੇ ਵੇਚੇ ਸਨ, ਅਤੇ ਉੱਥੇ ਸਭ ਨਾਲ ਬਰਾਬਰੀ ਦਾ ਸਲੂਕ ਵੇਖ ਕੇ ਗੁਰੂ ਜੀ ਨਾਲ ਪਿਆਰ ਕਰਨ ਲੱਗੇ ਸਨ।","ਉਹ ਭੋਜਨ ਲੈ ਕੇ ਆਏ ਅਤੇ ਬੇਨਤੀ ਕੀਤੀ, 'ਸਾਡੇ ਘਰ ਚੱਲੋ ਅਤੇ ਸਾਨੂੰ ਸੇਵਾ ਦਾ ਮੌਕਾ ਦਿਓ।' ਰਾਤ ਨੂੰ ਉਨ੍ਹਾਂ ਨੇ ਇੱਕ ਦਲੇਰ ਸਕੀਮ ਬਣਾਈ। ਉਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਇੱਕ ਮੁਸਲਮਾਨ ਫ਼ਕੀਰ ਵਾਂਗ ਲੰਮੇ ਨੀਲੇ ਬਸਤਰ ਪਹਿਨਾਏ ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ 'ਉੱਚ ਦਾ ਪੀਰ' ਕਿਹਾ।","ਉਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਪਲੰਘ ਉੱਤੇ ਬਿਠਾ ਕੇ ਮੋਢਿਆਂ ਉੱਤੇ ਚੁੱਕ ਲਿਆ: ਅੱਗੇ ਨਬੀ ਖ਼ਾਨ ਅਤੇ ਗ਼ਨੀ ਖ਼ਾਨ, ਪਿੱਛੇ ਭਾਈ ਧਰਮ ਸਿੰਘ ਅਤੇ ਭਾਈ ਮਾਨ ਸਿੰਘ, ਅਤੇ ਭਾਈ ਦਇਆ ਸਿੰਘ ਮੋਰ-ਪੰਖਾਂ ਦਾ ਚੌਰ ਝੁਲਾਉਂਦੇ। ਜਦੋਂ ਸਿਪਾਹੀਆਂ ਨੇ ਰੋਕਿਆ, ਭਰਾਵਾਂ ਨੇ ਉਨ੍ਹਾਂ ਦੇ ਸਵਾਲਾਂ ਦੇ ਜਵਾਬ ਦਿੱਤੇ। ਕਾਜ਼ੀ ਪੀਰ ਮੁਹੰਮਦ, ਜਿਨ੍ਹਾਂ ਨੇ ਕਦੇ ਗੁਰੂ ਜੀ ਨੂੰ ਫ਼ਾਰਸੀ ਪੜ੍ਹਾਈ ਸੀ, ਨੇ ਸਿਪਾਹੀਆਂ ਨੂੰ ਕਿਹਾ, 'ਇਹ ਰੱਬ ਦਾ ਬੰਦਾ ਹੈ। ਇਸ ਨੂੰ ਜਾਣ ਦਿਓ।' ਸਿਪਾਹੀਆਂ ਨੇ ਸਿਰ ਝੁਕਾਇਆ ਅਤੇ ਲੰਘਣ ਦਿੱਤਾ।","ਭਰਾ ਗੁਰੂ ਜੀ ਨੂੰ ਸੁਰੱਖਿਅਤ ਫ਼ੌਜ ਦੇ ਘੇਰੇ ਤੋਂ ਪਾਰ ਲੈ ਗਏ। ਸਫ਼ਰ ਦੇ ਅੰਤ ਉੱਤੇ ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਦਾ ਧੰਨਵਾਦ ਕੀਤਾ ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਇੱਕ ਹੁਕਮਨਾਮਾ ਬਖ਼ਸ਼ਿਆ, ਜਿਸ ਨੂੰ ਉਨ੍ਹਾਂ ਦੇ ਪਰਿਵਾਰ ਨੇ ਪੀੜ੍ਹੀਆਂ ਤੱਕ ਸਾਂਭ ਕੇ ਰੱਖਿਆ।"],l:"ਸੱਚੇ ਮਿੱਤਰ ਖ਼ਤਰੇ ਵਿੱਚ ਸਾਥ ਦਿੰਦੇ ਹਨ, ਭਾਵੇਂ ਉਨ੍ਹਾਂ ਦਾ ਧਰਮ ਕੋਈ ਵੀ ਹੋਵੇ। ਨਬੀ ਖ਼ਾਨ ਅਤੇ ਗ਼ਨੀ ਖ਼ਾਨ ਨੇ ਪਿਆਰ ਅਤੇ ਸਤਿਕਾਰ ਕਰਕੇ ਆਪਣੀ ਜਾਨ ਖ਼ਤਰੇ ਵਿੱਚ ਪਾਈ।"}},

{id:"sher-khan",title:"The Lion-Hearted Nawab",gur:"ਹਾਅ ਦਾ ਨਾਅਰਾ",cat:"Guru Gobind Singh Ji",age:"Kids",where:"Sirhind and Malerkotla",mins:3,c:"#2FA45A",c2:"#F2B229",h:400,art:"palace",
year:1704,loc:["sirhind","malerkotla"],themes:["Courage","Equality"],
summary:"In the court at Sirhind, only one man stands up to defend the Guru's two youngest sons. He is a Muslim Nawab.",
text:["When the Guru's two youngest sons, Baba Zorawar Singh Ji and Baba Fateh Singh Ji, were brought before the governor of Sirhind, Wazir Khan, many nobles were present. One of them was Sher Mohammad Khan, the Nawab of Malerkotla, a man devoted to God.","Wazir Khan said to him, 'Your brother was killed fighting the Guru at Chamkaur. Here is your chance for revenge. Punish these boys.' But Sher Khan refused. 'My brother died in battle, facing warriors. I will not take revenge on little children.'","When the court decided on a terribly cruel punishment for the boys, Sher Khan stood up in front of everyone. 'These children are innocent!' he said. 'They are only seven and five years old and have done you no harm. Punishing small children for their father's quarrel is against the teachings of Islam.' This brave protest is remembered as the 'haah da naara', the cry for justice.","Wazir Khan would not listen. Sher Khan even wrote to Emperor Aurangzeb, asking for the boys to be freed, but nobody paid attention. He had done all he could. He walked out of the court in protest.","When Guru Gobind Singh Ji heard what Sher Khan had done, he blessed him and his family. To this day, Sikhs remember the Nawab of Malerkotla with love and gratitude. Malerkotla has been remembered as a place of peace and friendship between Sikhs and Muslims ever since."],
lesson:"Standing up for what is right, even when you stand alone, takes great courage. Justice is for everyone, whatever their religion.",
think:["Why did Sher Khan refuse to take revenge?","What does 'haah da naara' mean to you?"],
words:[["Nawab","A Muslim ruler of a small state."],["Haah da naara","'The cry for justice', Sher Khan's brave protest."]],
quiz:[["Which town was Sher Khan the Nawab of?",["Malerkotla","Lahore","Kabul"],0],["What did Sher Khan say about the boys?",["They were innocent","They should be punished","He didn't know them"],0],["How do Sikhs remember Sher Khan?",["With love and gratitude","As an enemy","They don't remember him"],0]],
pa:{t:["ਜਦੋਂ ਗੁਰੂ ਜੀ ਦੇ ਦੋਵੇਂ ਛੋਟੇ ਸਾਹਿਬਜ਼ਾਦਿਆਂ, ਬਾਬਾ ਜ਼ੋਰਾਵਰ ਸਿੰਘ ਜੀ ਅਤੇ ਬਾਬਾ ਫ਼ਤਿਹ ਸਿੰਘ ਜੀ, ਨੂੰ ਸਰਹਿੰਦ ਦੇ ਸੂਬੇਦਾਰ ਵਜ਼ੀਰ ਖ਼ਾਨ ਦੀ ਕਚਹਿਰੀ ਵਿੱਚ ਲਿਆਂਦਾ ਗਿਆ, ਬਹੁਤ ਸਾਰੇ ਅਮੀਰ-ਵਜ਼ੀਰ ਹਾਜ਼ਰ ਸਨ। ਉਨ੍ਹਾਂ ਵਿੱਚ ਮਲੇਰਕੋਟਲੇ ਦਾ ਨਵਾਬ ਸ਼ੇਰ ਮੁਹੰਮਦ ਖ਼ਾਨ ਵੀ ਸੀ, ਜੋ ਰੱਬ ਨਾਲ ਜੁੜਿਆ ਬੰਦਾ ਸੀ।","ਵਜ਼ੀਰ ਖ਼ਾਨ ਨੇ ਉਸ ਨੂੰ ਕਿਹਾ, 'ਤੇਰਾ ਭਰਾ ਚਮਕੌਰ ਵਿੱਚ ਗੁਰੂ ਨਾਲ ਲੜਦਿਆਂ ਮਾਰਿਆ ਗਿਆ ਸੀ। ਬਦਲਾ ਲੈਣ ਦਾ ਇਹੀ ਮੌਕਾ ਹੈ। ਇਨ੍ਹਾਂ ਮੁੰਡਿਆਂ ਨੂੰ ਸਜ਼ਾ ਦੇ।' ਪਰ ਸ਼ੇਰ ਖ਼ਾਨ ਨੇ ਨਾਂਹ ਕਰ ਦਿੱਤੀ, 'ਮੇਰਾ ਭਰਾ ਜੰਗ ਵਿੱਚ ਯੋਧਿਆਂ ਦੇ ਸਾਹਮਣੇ ਮਰਿਆ ਸੀ। ਮੈਂ ਨਿੱਕੇ ਬੱਚਿਆਂ ਤੋਂ ਬਦਲਾ ਨਹੀਂ ਲਵਾਂਗਾ।'","ਜਦੋਂ ਕਚਹਿਰੀ ਨੇ ਬੱਚਿਆਂ ਲਈ ਬਹੁਤ ਬੇਰਹਿਮ ਸਜ਼ਾ ਦਾ ਫ਼ੈਸਲਾ ਕੀਤਾ, ਸ਼ੇਰ ਖ਼ਾਨ ਸਭ ਦੇ ਸਾਹਮਣੇ ਉੱਠ ਖੜ੍ਹਾ ਹੋਇਆ। ਉਸ ਨੇ ਕਿਹਾ, 'ਇਹ ਬੱਚੇ ਬੇਕਸੂਰ ਹਨ! ਇਹ ਸਿਰਫ਼ ਸੱਤ ਅਤੇ ਪੰਜ ਸਾਲ ਦੇ ਹਨ, ਇਨ੍ਹਾਂ ਨੇ ਤੁਹਾਡਾ ਕੁਝ ਨਹੀਂ ਵਿਗਾੜਿਆ। ਪਿਤਾ ਦੇ ਝਗੜੇ ਦੀ ਸਜ਼ਾ ਨਿੱਕੇ ਬੱਚਿਆਂ ਨੂੰ ਦੇਣਾ ਇਸਲਾਮ ਦੀ ਸਿੱਖਿਆ ਦੇ ਵਿਰੁੱਧ ਹੈ।' ਇਸ ਦਲੇਰ ਵਿਰੋਧ ਨੂੰ 'ਹਾਅ ਦਾ ਨਾਅਰਾ' ਵਜੋਂ ਯਾਦ ਕੀਤਾ ਜਾਂਦਾ ਹੈ।","ਵਜ਼ੀਰ ਖ਼ਾਨ ਨੇ ਗੱਲ ਨਾ ਸੁਣੀ। ਸ਼ੇਰ ਖ਼ਾਨ ਨੇ ਬਾਦਸ਼ਾਹ ਔਰੰਗਜ਼ੇਬ ਨੂੰ ਵੀ ਬੱਚਿਆਂ ਦੀ ਰਿਹਾਈ ਲਈ ਲਿਖਿਆ, ਪਰ ਕਿਸੇ ਨੇ ਧਿਆਨ ਨਾ ਦਿੱਤਾ। ਉਸ ਨੇ ਜੋ ਹੋ ਸਕਦਾ ਸੀ ਕੀਤਾ। ਉਹ ਵਿਰੋਧ ਵਿੱਚ ਕਚਹਿਰੀ ਵਿੱਚੋਂ ਉੱਠ ਕੇ ਚਲਾ ਗਿਆ।","ਜਦੋਂ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨੇ ਸ਼ੇਰ ਖ਼ਾਨ ਬਾਰੇ ਸੁਣਿਆ, ਉਨ੍ਹਾਂ ਨੇ ਉਸ ਨੂੰ ਅਤੇ ਉਸ ਦੇ ਪਰਿਵਾਰ ਨੂੰ ਅਸੀਸ ਦਿੱਤੀ। ਅੱਜ ਵੀ ਸਿੱਖ ਮਲੇਰਕੋਟਲੇ ਦੇ ਨਵਾਬ ਨੂੰ ਪਿਆਰ ਅਤੇ ਸ਼ੁਕਰਾਨੇ ਨਾਲ ਯਾਦ ਕਰਦੇ ਹਨ। ਉਦੋਂ ਤੋਂ ਮਲੇਰਕੋਟਲਾ ਸਿੱਖਾਂ ਅਤੇ ਮੁਸਲਮਾਨਾਂ ਦੀ ਸਾਂਝ ਅਤੇ ਅਮਨ ਦੀ ਥਾਂ ਵਜੋਂ ਯਾਦ ਕੀਤਾ ਜਾਂਦਾ ਹੈ।"],l:"ਸੱਚ ਲਈ ਖੜ੍ਹਨਾ, ਭਾਵੇਂ ਇਕੱਲੇ ਹੀ ਖੜ੍ਹਨਾ ਪਵੇ, ਬਹੁਤ ਹੌਸਲੇ ਦਾ ਕੰਮ ਹੈ। ਇਨਸਾਫ਼ ਹਰ ਕਿਸੇ ਲਈ ਹੈ, ਭਾਵੇਂ ਉਸ ਦਾ ਧਰਮ ਕੋਈ ਵੀ ਹੋਵੇ।"}},

{id:"proud-dalla",title:"Dalla's Brave Soldiers",gur:"ਚੌਧਰੀ ਡੱਲਾ",cat:"Guru Gobind Singh Ji",age:"Kids",where:"Talwandi Sabo (Damdama Sahib)",mins:3,c:"#F0702A",c2:"#3B5BDB",h:395,art:"sword",
year:1706,loc:["damdama"],themes:["Courage","Humility"],
summary:"A village chief keeps boasting that his soldiers are braver than the Guru's Sikhs. Guru Gobind Singh Ji finds a way to test them.",
text:["After the battles of 1704, Guru Gobind Singh Ji reached Talwandi Sabo, the place now called Damdama Sahib. The village chief, Chaudhary Dalla, welcomed the Guru. When the governor of Sirhind ordered Dalla to hand the Guru over, Dalla bravely refused and looked after the Guru well.","But Dalla was very proud of his soldiers. He often said, 'If my men had been with you at Chamkaur, the enemy would never have dared to harm you!' Guru Ji explained that being strong and healthy is not the same as being brave, but Dalla didn't believe him.","One day a Sikh from Lahore brought the Guru a new musket. Dalla and his soldiers were sitting nearby. Guru Ji said, 'Brother Dalla, I want to test the aim of this gun. Ask one of your brave men to stand in front as the target.' One by one, Dalla asked his soldiers, and one by one they all made excuses.","'Then come and stand there yourself, Dalla,' said Guru Ji. Dalla went pale. 'Who wants to die for nothing? In a real battle, I'll show my courage!' So Guru Ji said, 'Then go and ask if any of my Singhs will come.' Dalla called out towards the langar, sure that nobody would. But two Singhs came running, each trying to get there first!","Guru Ji did not really harm anyone. He had only shown Dalla the difference between boasting and true courage. Dalla felt ashamed, and he never boasted about his soldiers again. Later he took Amrit and became a Singh himself."],
lesson:"True courage comes from faith and love, not from boasting. Those who talk the most aren't always the bravest.",
think:["Why did Dalla's soldiers make excuses?","Why do you think the two Singhs came running?"],
words:[["Chaudhary","A village chief or headman."],["Musket","An old kind of gun."]],
quiz:[["What did Dalla keep boasting about?",["His brave soldiers","His horses","His gold"],0],["What did Guru Ji want to test?",["The aim of a new musket","A new sword","A horse's speed"],0],["How many Singhs came running?",["Two","None","Twenty"],0]],
pa:{t:["1704 ਦੀਆਂ ਜੰਗਾਂ ਤੋਂ ਬਾਅਦ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਤਲਵੰਡੀ ਸਾਬੋ ਪਹੁੰਚੇ, ਜਿਸ ਨੂੰ ਹੁਣ ਦਮਦਮਾ ਸਾਹਿਬ ਕਹਿੰਦੇ ਹਨ। ਪਿੰਡ ਦੇ ਚੌਧਰੀ ਡੱਲੇ ਨੇ ਗੁਰੂ ਜੀ ਦਾ ਸੁਆਗਤ ਕੀਤਾ। ਜਦੋਂ ਸਰਹਿੰਦ ਦੇ ਸੂਬੇਦਾਰ ਨੇ ਡੱਲੇ ਨੂੰ ਗੁਰੂ ਜੀ ਨੂੰ ਸੌਂਪਣ ਦਾ ਹੁਕਮ ਦਿੱਤਾ, ਡੱਲੇ ਨੇ ਦਲੇਰੀ ਨਾਲ ਨਾਂਹ ਕਰ ਦਿੱਤੀ ਅਤੇ ਗੁਰੂ ਜੀ ਦੀ ਚੰਗੀ ਸੇਵਾ ਕੀਤੀ।","ਪਰ ਡੱਲੇ ਨੂੰ ਆਪਣੇ ਸਿਪਾਹੀਆਂ ਉੱਤੇ ਬਹੁਤ ਮਾਣ ਸੀ। ਉਹ ਅਕਸਰ ਕਹਿੰਦਾ, 'ਜੇ ਮੇਰੇ ਜਵਾਨ ਚਮਕੌਰ ਵਿੱਚ ਤੁਹਾਡੇ ਨਾਲ ਹੁੰਦੇ, ਤਾਂ ਵੈਰੀ ਦੀ ਹਿੰਮਤ ਨਾ ਪੈਂਦੀ!' ਗੁਰੂ ਜੀ ਨੇ ਸਮਝਾਇਆ ਕਿ ਤਕੜਾ ਅਤੇ ਤੰਦਰੁਸਤ ਹੋਣਾ ਬਹਾਦਰ ਹੋਣ ਵਰਗਾ ਨਹੀਂ, ਪਰ ਡੱਲਾ ਨਾ ਮੰਨਿਆ।","ਇੱਕ ਦਿਨ ਲਾਹੌਰ ਤੋਂ ਇੱਕ ਸਿੱਖ ਗੁਰੂ ਜੀ ਲਈ ਨਵੀਂ ਬੰਦੂਕ ਲੈ ਕੇ ਆਇਆ। ਡੱਲਾ ਅਤੇ ਉਸ ਦੇ ਸਿਪਾਹੀ ਕੋਲ ਬੈਠੇ ਸਨ। ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਭਾਈ ਡੱਲਿਆ, ਮੈਂ ਇਸ ਬੰਦੂਕ ਦਾ ਨਿਸ਼ਾਨਾ ਪਰਖਣਾ ਹੈ। ਆਪਣੇ ਕਿਸੇ ਬਹਾਦਰ ਜਵਾਨ ਨੂੰ ਨਿਸ਼ਾਨੇ ਲਈ ਸਾਹਮਣੇ ਖੜ੍ਹਾ ਕਰ।' ਡੱਲੇ ਨੇ ਇੱਕ-ਇੱਕ ਕਰਕੇ ਸਿਪਾਹੀਆਂ ਨੂੰ ਕਿਹਾ, ਅਤੇ ਇੱਕ-ਇੱਕ ਕਰਕੇ ਸਾਰਿਆਂ ਨੇ ਬਹਾਨੇ ਬਣਾਏ।","ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਫਿਰ ਡੱਲਿਆ, ਤੂੰ ਆਪ ਆ ਕੇ ਖੜ੍ਹਾ ਹੋ ਜਾ।' ਡੱਲੇ ਦਾ ਰੰਗ ਉੱਡ ਗਿਆ। 'ਐਵੇਂ ਕੌਣ ਮਰਨਾ ਚਾਹੁੰਦਾ ਹੈ? ਅਸਲੀ ਜੰਗ ਵਿੱਚ ਮੈਂ ਆਪਣਾ ਹੌਸਲਾ ਵਿਖਾਵਾਂਗਾ!' ਤਾਂ ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਫਿਰ ਜਾ ਕੇ ਪੁੱਛ ਕਿ ਮੇਰਾ ਕੋਈ ਸਿੰਘ ਆਉਂਦਾ ਹੈ।' ਡੱਲੇ ਨੇ ਲੰਗਰ ਵੱਲ ਹਾਕ ਮਾਰੀ, ਯਕੀਨ ਨਾਲ ਕਿ ਕੋਈ ਨਹੀਂ ਆਵੇਗਾ। ਪਰ ਦੋ ਸਿੰਘ ਦੌੜਦੇ ਆਏ, ਹਰ ਇੱਕ ਦੂਜੇ ਤੋਂ ਪਹਿਲਾਂ ਪਹੁੰਚਣ ਦੀ ਕੋਸ਼ਿਸ਼ ਵਿੱਚ!","ਗੁਰੂ ਜੀ ਨੇ ਅਸਲ ਵਿੱਚ ਕਿਸੇ ਦਾ ਨੁਕਸਾਨ ਨਹੀਂ ਕੀਤਾ। ਉਨ੍ਹਾਂ ਨੇ ਤਾਂ ਸਿਰਫ਼ ਡੱਲੇ ਨੂੰ ਫੜ੍ਹਾਂ ਮਾਰਨ ਅਤੇ ਸੱਚੇ ਹੌਸਲੇ ਦਾ ਫ਼ਰਕ ਵਿਖਾਇਆ ਸੀ। ਡੱਲਾ ਸ਼ਰਮਿੰਦਾ ਹੋਇਆ, ਅਤੇ ਉਸ ਨੇ ਫਿਰ ਕਦੇ ਆਪਣੇ ਸਿਪਾਹੀਆਂ ਦੀਆਂ ਫੜ੍ਹਾਂ ਨਾ ਮਾਰੀਆਂ। ਬਾਅਦ ਵਿੱਚ ਉਸ ਨੇ ਅੰਮ੍ਰਿਤ ਛਕਿਆ ਅਤੇ ਆਪ ਸਿੰਘ ਸਜ ਗਿਆ।"],l:"ਸੱਚਾ ਹੌਸਲਾ ਸ਼ਰਧਾ ਅਤੇ ਪਿਆਰ ਤੋਂ ਆਉਂਦਾ ਹੈ, ਫੜ੍ਹਾਂ ਮਾਰਨ ਨਾਲ ਨਹੀਂ। ਜੋ ਸਭ ਤੋਂ ਵੱਧ ਬੋਲਦੇ ਹਨ, ਉਹ ਹਮੇਸ਼ਾ ਸਭ ਤੋਂ ਬਹਾਦਰ ਨਹੀਂ ਹੁੰਦੇ।"}},

{id:"bahadur-shah",title:"What Is a Miracle?",gur:"ਕਰਾਮਾਤ ਕੀ ਹੈ?",cat:"Guru Gobind Singh Ji",age:"Kids",where:"Agra",mins:3,c:"#8E3FB8",c2:"#F2B229",h:400,art:"coins",
year:1707,loc:["agra"],themes:["Honesty","Courage"],
summary:"The new emperor welcomes Guru Gobind Singh Ji with honour. Then a proud priest demands to see a miracle.",
text:["After Emperor Aurangzeb died, his sons fought over the throne. Prince Bahadur Shah asked Guru Gobind Singh Ji for help, and the Guru sent a group of Sikhs led by Bhai Daya Singh and Bhai Dharam Singh. With their help, Bahadur Shah won the battle near Agra in 1707 and became emperor.","Bahadur Shah was grateful. He invited Guru Ji to Agra, seated him with great honour, and gave him precious gifts. But the emperor's chief priest was jealous. He said, 'If you are truly a holy man, show us a miracle.'","Guru Ji smiled and said, 'The king's word is a miracle. A man sentenced to death can be set free by one order from him.' The priest said, 'That's no miracle. Every king can do that.'","So Guru Ji held up a gold coin. 'Money is a miracle too. The whole world runs after it, and almost anything can be bought with it.' The priest still wasn't satisfied. When he asked a third time, Guru Ji placed his hand on the hilt of his sword. 'And this is a miracle too,' he said. 'It can make the proud and stubborn agree.'","The priest fell silent. Everyone understood what Guru Ji meant: he did not do magic tricks to impress people. The real 'miracles' in the world are things like power, money and strength, and what matters is whether they are used for good or for harm."],
lesson:"The Gurus never did magic tricks to show off. What matters is how we use the power, wealth and strength we have: for good, or for harm.",
think:["What were Guru Ji's three 'miracles'?","Why do you think Guru Ji refused to do magic tricks?"],
words:[["Emperor","The ruler of a great empire."],["Hilt","The handle of a sword."]],
quiz:[["Whom did Guru Ji help to become emperor?",["Bahadur Shah","Aurangzeb","Akbar"],0],["What did the priest demand?",["A miracle","Gold","A horse"],0],["What did Guru Ji hold up as his second 'miracle'?",["A gold coin","A flower","A book"],0]],
pa:{t:["ਬਾਦਸ਼ਾਹ ਔਰੰਗਜ਼ੇਬ ਦੀ ਮੌਤ ਤੋਂ ਬਾਅਦ ਉਸ ਦੇ ਪੁੱਤਰ ਤਖ਼ਤ ਲਈ ਲੜ ਪਏ। ਸ਼ਹਿਜ਼ਾਦੇ ਬਹਾਦਰ ਸ਼ਾਹ ਨੇ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਤੋਂ ਮਦਦ ਮੰਗੀ, ਅਤੇ ਗੁਰੂ ਜੀ ਨੇ ਭਾਈ ਦਇਆ ਸਿੰਘ ਅਤੇ ਭਾਈ ਧਰਮ ਸਿੰਘ ਦੀ ਅਗਵਾਈ ਵਿੱਚ ਸਿੱਖਾਂ ਦਾ ਜਥਾ ਭੇਜਿਆ। ਉਨ੍ਹਾਂ ਦੀ ਮਦਦ ਨਾਲ 1707 ਵਿੱਚ ਬਹਾਦਰ ਸ਼ਾਹ ਨੇ ਆਗਰੇ ਨੇੜੇ ਜੰਗ ਜਿੱਤੀ ਅਤੇ ਬਾਦਸ਼ਾਹ ਬਣਿਆ।","ਬਹਾਦਰ ਸ਼ਾਹ ਸ਼ੁਕਰਗੁਜ਼ਾਰ ਸੀ। ਉਸ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਆਗਰੇ ਸੱਦਿਆ, ਬੜੇ ਸਤਿਕਾਰ ਨਾਲ ਬਿਠਾਇਆ ਅਤੇ ਕੀਮਤੀ ਤੋਹਫ਼ੇ ਦਿੱਤੇ। ਪਰ ਬਾਦਸ਼ਾਹ ਦੇ ਮੁੱਖ ਮੌਲਵੀ ਨੂੰ ਈਰਖਾ ਹੋਈ। ਉਸ ਨੇ ਕਿਹਾ, 'ਜੇ ਤੁਸੀਂ ਸੱਚਮੁੱਚ ਫ਼ਕੀਰ ਹੋ, ਤਾਂ ਕੋਈ ਕਰਾਮਾਤ ਵਿਖਾਓ।'","ਗੁਰੂ ਜੀ ਨੇ ਮੁਸਕਰਾ ਕੇ ਕਿਹਾ, 'ਬਾਦਸ਼ਾਹ ਦਾ ਹੁਕਮ ਇੱਕ ਕਰਾਮਾਤ ਹੈ। ਮੌਤ ਦੀ ਸਜ਼ਾ ਵਾਲਾ ਬੰਦਾ ਇਸ ਦੇ ਇੱਕ ਹੁਕਮ ਨਾਲ ਛੁੱਟ ਸਕਦਾ ਹੈ।' ਮੌਲਵੀ ਨੇ ਕਿਹਾ, 'ਇਹ ਕੋਈ ਕਰਾਮਾਤ ਨਹੀਂ। ਹਰ ਬਾਦਸ਼ਾਹ ਇਹ ਕਰ ਸਕਦਾ ਹੈ।'","ਤਾਂ ਗੁਰੂ ਜੀ ਨੇ ਸੋਨੇ ਦੀ ਇੱਕ ਮੋਹਰ ਵਿਖਾਈ। 'ਪੈਸਾ ਵੀ ਕਰਾਮਾਤ ਹੈ। ਸਾਰੀ ਦੁਨੀਆ ਇਸ ਦੇ ਪਿੱਛੇ ਭੱਜਦੀ ਹੈ, ਅਤੇ ਇਸ ਨਾਲ ਲਗਭਗ ਸਭ ਕੁਝ ਖ਼ਰੀਦਿਆ ਜਾ ਸਕਦਾ ਹੈ।' ਮੌਲਵੀ ਫਿਰ ਵੀ ਨਾ ਮੰਨਿਆ। ਜਦੋਂ ਉਸ ਨੇ ਤੀਜੀ ਵਾਰ ਪੁੱਛਿਆ, ਗੁਰੂ ਜੀ ਨੇ ਆਪਣੀ ਤਲਵਾਰ ਦੇ ਮੁੱਠੇ ਉੱਤੇ ਹੱਥ ਰੱਖਿਆ। ਉਨ੍ਹਾਂ ਕਿਹਾ, 'ਅਤੇ ਇਹ ਵੀ ਕਰਾਮਾਤ ਹੈ। ਇਹ ਹੰਕਾਰੀ ਅਤੇ ਅੜੀਅਲ ਨੂੰ ਵੀ ਮੰਨਣ ਲਾ ਦਿੰਦੀ ਹੈ।'","ਮੌਲਵੀ ਚੁੱਪ ਹੋ ਗਿਆ। ਸਭ ਸਮਝ ਗਏ ਕਿ ਗੁਰੂ ਜੀ ਦਾ ਕੀ ਭਾਵ ਸੀ: ਉਹ ਲੋਕਾਂ ਨੂੰ ਪ੍ਰਭਾਵਿਤ ਕਰਨ ਲਈ ਜਾਦੂ ਦੇ ਕਰਤਬ ਨਹੀਂ ਕਰਦੇ ਸਨ। ਦੁਨੀਆ ਦੀਆਂ ਅਸਲ 'ਕਰਾਮਾਤਾਂ' ਤਾਕਤ, ਪੈਸਾ ਅਤੇ ਬਲ ਹਨ, ਅਤੇ ਅਸਲ ਗੱਲ ਇਹ ਹੈ ਕਿ ਇਹ ਭਲੇ ਲਈ ਵਰਤੇ ਜਾਂਦੇ ਹਨ ਜਾਂ ਬੁਰੇ ਲਈ।"],l:"ਗੁਰੂ ਸਾਹਿਬਾਨ ਨੇ ਕਦੇ ਦਿਖਾਵੇ ਲਈ ਜਾਦੂ ਦੇ ਕਰਤਬ ਨਹੀਂ ਕੀਤੇ। ਅਸਲ ਗੱਲ ਇਹ ਹੈ ਕਿ ਅਸੀਂ ਆਪਣੀ ਤਾਕਤ, ਧਨ ਅਤੇ ਬਲ ਕਿਵੇਂ ਵਰਤਦੇ ਹਾਂ: ਭਲੇ ਲਈ ਜਾਂ ਬੁਰੇ ਲਈ।"}},

{id:"joga-singh",title:"Bhai Joga Singh's Promise",gur:"ਭਾਈ ਜੋਗਾ ਸਿੰਘ",cat:"Guru Gobind Singh Ji",age:"Youth",where:"Peshawar, Hoshiarpur and Anandpur",mins:3,c:"#1590B0",c2:"#F0702A",h:400,art:"door",
year:1700,approx:1,loc:["anandpur"],themes:["Faith","Humility"],
summary:"A boy named Joga promises to be 'for the Guru'. Years later, a letter arrives in the middle of his wedding.",
text:["A family from Peshawar came to Anandpur to see Guru Gobind Singh Ji. With them was a fourteen-year-old boy. 'What is your name?' Guru Ji asked. 'Joga, true Guru,' he said. In Punjabi, 'joga' means 'for someone'. 'And who are you for?' asked Guru Ji. The clever boy answered at once, 'For you, Guru Ji!' Guru Ji smiled. 'From today, you are for me, and I am for you.'","Joga stayed at Anandpur and served with his heart and soul. He took Amrit and became Joga Singh. A few years later, his parents came to take him home for his wedding. Guru Ji said, 'Go happily. Just remember one thing: when I call you, come back at once.'","In Peshawar, the wedding began. Halfway through the ceremony, after only two of the four laavan, a Sikh arrived with a letter from the Guru: 'Come back to Anandpur as soon as you read this.' Everyone begged Joga Singh to wait, but he said, 'My Guru has called me. It is my duty to go.' He finished the ceremony quickly and rode off at once.","By evening he reached Hoshiarpur, and a proud thought came into his mind: 'Is there any Sikh who obeys the Guru like me, leaving even his own wedding?' Pride made his mind weak, and he was tempted to go somewhere he should not go. But each time he went towards that place, he found a watchman standing guard at the door, and he turned back. This happened again and again, all night long.","At dawn Joga Singh realised that the watchman had been the Guru himself, keeping him safe from his own mistake. He reached Anandpur ashamed, and bowed at the Guru's feet. Guru Ji said kindly, 'Pride is the most dangerous enemy of all. I am for you, Joga Singh, just as I promised.'"],
lesson:"Even good deeds can fill us with pride, and pride makes us weak. The Guru protects those who are truly his, even from their own mistakes.",
think:["What did 'Joga' mean, and how did the boy answer?","How did pride almost lead Joga Singh into trouble?"],
words:[["Laavan","The four verses sung during a Sikh wedding."],["Pride","Thinking too highly of yourself."]],

/* ---------- Read aloud (uses the device's built-in voices) ---------- */
const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined";
const speech = {on:false, paused:false, idx:0, paras:[], onchange:null};
function pickVoice(lang){
  const vs = canSpeak ? speechSynthesis.getVoices() : [];
  if(lang==="pa") return vs.find(v=>/^pa/i.test(v.lang)) || null;
  return vs.find(v=>/en[-_]IN/i.test(v.lang)) || vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if(canSpeak){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){} }
function stopSpeech(){
  if(!canSpeak) return;
  speech.on=false; speech.paused=false; try{ speechSynthesis.cancel(); }catch(e){}
  document.querySelectorAll(".story p.speaking").forEach(p=>p.classList.remove("speaking"));
  speech.onchange && speech.onchange();
}
function speakFrom(i){
  if(!speech.on) return;
  if(i>=speech.paras.length){ stopSpeech(); return; }
  speech.idx=i;
  document.querySelectorAll(".story p").forEach((p,k)=>p.classList.toggle("speaking",k===i));
  const pa=/[\u0A00-\u0A7F]/.test(speech.paras[i]);
  const u=new SpeechSynthesisUtterance(speech.paras[i]); const v=pickVoice(pa?"pa":undefined);
  if(v){ u.voice=v; u.lang=v.lang; } else u.lang=pa?"pa-IN":"en-IN";
  u.rate=.92;
  u.onend=()=>{ if(speech.on && !speech.paused) speakFrom(i+1); };
  speechSynthesis.speak(u);
}
function sayWord(term){
  if(!canSpeak) return;
  stopSpeech();
  const g=GLOSS[term.toLowerCase()]; const pa=pickVoice("pa");
  const u=new SpeechSynthesisUtterance(pa && g ? g[0] : term);
  const v=pa && g ? pa : pickVoice(); if(v){ u.voice=v; u.lang=v.lang; }
  u.rate=.75; speechSynthesis.speak(u);
}

function plateLines(cat){
  if(!/^Guru /.test(cat)) return cat.toUpperCase().split(" ");
  const w = cat.replace(/^Guru\s+/,"").replace(/\s+Ji$/,"").toUpperCase().split(" ");
  if(w[0]==="HAR" && w.length>2) w.splice(0,2,w[0]+" "+w[1]);
  const last = w.pop();
  return ["GURU", ...w, ...(last.length>6 ? [last,"JI"] : [last+" JI"])];
}

function linkWords(s){
  const marks=[]; let txt=s.text.map(esc).join("\u0001");
  const own=s.words.map(w=>w[0]);
  const terms=[...own, ...GLOBAL_WORDS.filter(g=>!own.some(o=>o.toLowerCase()===g.toLowerCase()))]
    .filter(t=>GLOSS[t.toLowerCase()]).sort((a,b)=>b.length-a.length);
  terms.forEach(t=>{
    const re=new RegExp("(^|[^A-Za-z\\u0002])("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![A-Za-z])","i");
    txt=txt.replace(re,(m,pre,w)=>{ marks.push([t,w]); return pre+"\u0002"+(marks.length-1)+"\u0003"; });
  });
  txt=txt.replace(/\u0002(\d+)\u0003/g,(m,i)=>`<span class="w" role="button" tabindex="0" data-w="${esc(marks[i][0])}">${marks[i][1]}</span>`);
  return txt.split("\u0001").map(p=>`<p>${p}</p>`).join("");
}

function svgImage(svg){

    const src=svg.replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" ');
    const u=URL.createObjectURL(new Blob([src],{type:"image/svg+xml"}));

  });

function rr(x,X,Y,w,h,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }
function wrapText(x,text,X,Y,maxW,lh,maxLines){
  const words=text.split(" "); let line="", n=0;
  for(let i=0;i<words.length;i++){
    const test=line?line+" "+words[i]:words[i];
    if(x.measureText(test).width>maxW && line){ x.fillText(line,X,Y); Y+=lh; line=words[i]; if(++n>=maxLines-1){ line=words.slice(i).join(" "); break; } }
    else line=test;
  }
  x.fillText(line,X,Y); return Y;
}

  const cx=X+48, cy=Y+48, r=34;

  try{ if(!p.photo) throw 0; const im=await loadImg(p.photo); x.drawImage(im,cx-r,cy-r,2*r,2*r); }catch(e){ x.fillStyle="#F08A1C"; x.fillRect(cx-r,cy-r,2*r,2*r); }
  x.restore(); x.beginPath(); x.arc(cx,cy,r,0,7); x.lineWidth=4; x.strokeStyle="#F08A1C"; x.stroke();

  return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error("no image")),"image/png"));

const RIVERS={
 Ravi:[[32.3,75.8],[32.15,75.4],[32.0,75.05],[31.85,74.75],[31.62,74.32],[31.4,74.0],[31.1,73.6],[30.95,73.4]],

let mapSel="amritsar";
function mapPage(){
  const keys=Object.keys(PLACES).filter(k=>placeStories(k).length);
  const pts=d=>d.map(p=>proj(p[0],p[1]).join(",")).join(" ");
  const pin=k=>{
    const p=PLACES[k], n=placeStories(k).length, sel=k===mapSel;
    let X,Y,lx,ly,anchor="middle";
    if(p.far){ X=p.x; Y=292+(p.row||0)*40; lx=X; ly=Y+22; }
    else { [X,Y]=proj(p.lat,p.lon); X+=p.dx||0; Y+=p.dy||0; const L=p.lab;
      if(L==="b"){lx=X;ly=Y+21} else if(L==="t"){lx=X;ly=Y-13} else if(L==="l"){lx=X-12;ly=Y+4;anchor="end"} else if(L==="r"){lx=X+12;ly=Y+4;anchor="start"} else if(L==="bl"){lx=X-12;ly=Y+21;anchor="start"} else if(L==="tl"){lx=X-9;ly=Y-9;anchor="end"} else if(L==="bk"){lx=X+8;ly=Y+21;anchor="end"} else {lx=X+9;ly=Y-11;anchor="start"} }
    return `<g class="pin" tabindex="0" role="button" data-p="${k}" aria-label="${esc(p.name)}, ${n} ${n===1?"saakhi":"saakhis"}" aria-pressed="${sel}">

      <text x="${X}" y="${Y+3.6}" text-anchor="middle" font-size="10" font-family="Patrick Hand SC, sans-serif" fill="#141414">${n}</text>
      <text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="11" font-family="Patrick Hand SC, sans-serif" fill="${sel?"#F08A1C":"#F3EEE2"}" paint-order="stroke" stroke="#11151A" stroke-width="3">${esc(p.name)}</text></g>`;
  };
  const MH=404+40*Math.max(0,...keys.map(k=>PLACES[k].far?(PLACES[k].row||0)-2:0));
  app.innerHTML=`<div class="pad"><section class="page"><h1>Map</h1><p class="lead">Where the saakhis happened. Most are in Punjab, between its five rivers. Tap a place to see its saakhis.</p>
    <div class="mapwrap"><svg viewBox="0 0 400 ${MH}" role="group" aria-label="Map of places in the saakhis">
      <rect width="400" height="${MH}" fill="#11151A"/>
      <text x="290" y="60" font-family="Caveat Brush, cursive" font-size="30" fill="#1E2833">Punjab</text>
      ${Object.entries(RIVERS).map(([n,d])=>`<polyline points="${pts(d)}" fill="none" stroke="#2E6E9C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>`).join("")}
      ${Object.entries(RIVERLAB).map(([n,p])=>{ const [x,y]=proj(p[0],p[1]); return `<text x="${x}" y="${y}" font-size="9.5" font-style="italic" font-family="Literata, serif" fill="#5E95BD">${n}</text>`; }).join("")}
      <line x1="0" y1="268" x2="400" y2="268" stroke="#26303B" stroke-dasharray="4 4"/>
      <text x="200" y="264" text-anchor="middle" font-size="9" font-family="Patrick Hand SC, sans-serif" fill="#6E7A86" letter-spacing="1">FURTHER AWAY</text>
      ${keys.map(pin).join("")}

    <div class="chips placechips" role="group" aria-label="Places">${keys.map(k=>`<button class="chip small" data-pc="${k}" aria-pressed="${k===mapSel}">${esc(PLACES[k].name)} (${placeStories(k).length})</button>`).join("")}</div>
    <div class="placelist" id="placelist"></div></section></div>`;
  const pick=k=>{ mapSel=k; mapPage(); const pl=document.getElementById("placelist"); pl.scrollIntoView({behavior:reduce()?"auto":"smooth",block:"nearest"}); };
  app.querySelectorAll(".pin").forEach(g=>{ g.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(g.dataset.p); } }; });
  /* Pins sit close together on a phone, so a tap anywhere on the map opens the nearest place */
  const svg=app.querySelector(".mapwrap svg");
  svg.onclick=e=>{ const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const m=svg.getScreenCTM(); if(!m) return; const q=pt.matrixTransform(m.inverse());
    let best=null, bd=1e9; svg.querySelectorAll(".pin").forEach(g=>{ const c=g.querySelector(".dot"); const dx=+c.getAttribute("cx")-q.x, dy=+c.getAttribute("cy")-q.y;
      let d=dx*dx+dy*dy; const t=g.querySelectorAll("text")[1]; if(t){ try{ const bb=t.getBBox(); if(q.x>=bb.x-3&&q.x<=bb.x+bb.width+3&&q.y>=bb.y-3&&q.y<=bb.y+bb.height+3) d=Math.min(d,90); }catch(_){} }
      if(d<bd){ bd=d; best=g; } });
    if(best && bd<34*34) pick(best.dataset.p); };
  app.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>pick(b.dataset.pc));

}

    $("ready").innerHTML=`<div class="ready"><h2>Your saakhi is ready</h2><p>Tap <b style="font-weight:600">Send by email</b> to open your email app with the saakhi already written in. Then just press send. Thank you for sharing!</p>
      <div class="btns"><a class="pill" href="${mail}" style="background:var(--chitta);border-color:var(--chitta);color:#141414">Send by email</a><button class="pill" id="copysakhi">Copy the saakhi</button><button class="pill" id="clearsakhi">Start a new one</button></div>
      <p style="margin:14px 0 6px;font-size:.95rem">If your email app doesn't open, or the saakhi looks cut off, copy the saakhi and email it to:</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span id="mailaddr" style="user-select:all;font-family:var(--body);font-size:1.05rem;color:var(--kesri);word-break:break-all">${SUBMIT_EMAIL}</span><button class="pill" id="copymail" style="min-height:38px;padding:4px 14px;font-size:.9rem">Copy address</button></div></div>`;
    $("copysakhi").onclick=()=>copyText(text,"Saakhi copied");
    $("copymail").onclick=()=>copyText(SUBMIT_EMAIL,"Email address copied");
    $("clearsakhi").onclick=()=>{ keep("sg-draft",{}); sendPage(); };
    $("ready").scrollIntoView({behavior:reduce()?"auto":"smooth",block:"start"});
  };
}

/* ---------- Routing ---------- */
let lastStory=null;
function route(){
  stopSpeech(); stopVoice(); closeSheet(); speech.onchange=null;
  if(driftStop){ driftStop(); driftStop=null; }
  const h = location.hash.slice(1);
  const s = byId(h);
  let tab="shelf";
  if (s){ lastStory=s.id; reader(s); window.scrollTo(0,0); }
  else if(h==="timeline"){ lastStory=null; tab=h; timeline(); window.scrollTo(0,0); }
  else if(h==="map"){ lastStory=null; tab=h; mapPage(); window.scrollTo(0,0); }
  else if(h==="gurus"){ lastStory=null; tab=h; gurusPage(); window.scrollTo(0,0); }
  else if(h==="send"){ lastStory=null; tab=h; sendPage(); window.scrollTo(0,0); }
  else if(h==="voices"){ lastStory=null; tab=h; voicesPage(); window.scrollTo(0,0); }
  else {
    home();
    if(lastStory && h==="shelf"){ const id=lastStory; lastStory=null;
      const b=document.querySelector(`.book[data-id="${id}"]`); if(b){ b.scrollIntoView({block:"center",inline:"center"}); openBook(id,true); } }
    else if(h==="shelf") window.scrollTo(0,0);
  }
  document.querySelectorAll(".nav a").forEach(a=>a.setAttribute("aria-current", a.dataset.nav===tab?"page":"false"));
}
try{const v=store("sg-size",null); if(v) document.documentElement.style.setProperty("--read", v+"rem");}catch(e){}
addEventListener("hashchange", route);
route();
</script>
