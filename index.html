{"id": "golden-arrows", "title": "Arrows Tipped with Gold", "gur": "ਸੋਨੇ ਦੇ ਤੀਰ", "cat": "Guru Gobind Singh Ji", "age": "Kids", "where": "Anandpur Sahib", "mins": 2, "c": "#1B2A5E", "c2": "#F2C14E", "h": 410, "summary": "The Guru's arrows carry a little piece of gold on their tips. The reason surprises everyone.", "text": ["Guru Gobind Singh Ji was a great archer. People noticed something unusual about his arrows: each one had a small piece of gold fixed to its tip.", "A Sikh asked, \"Guru Ji, why do you put gold on your arrows? It is very costly.\"", "Guru Ji explained, \"We fight only to protect people from cruelty, never out of hatred. If my arrow wounds a soldier, the gold will pay for his treatment, so he can get well. And if he dies, the gold will help his family give him a proper funeral.\"", "The Sikhs were amazed. Even towards the soldiers who fought against him, the Guru showed care and kindness.", "This was the Guru's way: to be a saint and a soldier, strong enough to stand up to injustice, yet kind to every human being."], "lesson": "Even in a struggle, never lose kindness. The Guru cared for every human being, even his enemies.", "think": ["Why did the Guru put gold on his arrows?", "What does it mean to be a 'saint and a soldier'?"], "words": [["Teer", "An arrow."], ["Sant sipahi", "A saint-soldier: prayerful and brave."]], "n": 72, "seal": "", "who": "Guru Gobind Singh Ji"},

{"id": "mai-bhago", "title": "Mai Bhago Leads the Way", "gur": "ਮਾਈ ਭਾਗੋ ਜੀ", "cat": "Guru Gobind Singh Ji", "age": "Youth", "where": "Khidrana (Sri Muktsar Sahib), 1705", "mins": 3, "c": "#5B2C83", "c2": "#F08A1C", "h": 400, "summary": "Forty Sikhs leave the Guru in a hard time. A brave woman from their area brings them back.", "text": ["During the long siege of Anandpur Sahib, food ran out and life became very hard. A group of forty Sikhs from the Majha region told Guru Gobind Singh Ji they wanted to go home. The Guru asked them to write a note, a bedava, saying they were no longer his Sikhs. They signed it and left.", "When they reached home, Mai Bhago Ji, a brave woman from the village of Jhabal, heard what had happened. She told them firmly that they had turned their backs on the Guru when he needed them most. Her words moved them deeply. Mai Bhago Ji put on armour and led the forty back to find the Guru.", "They reached the Guru near a pool called Khidrana just as Mughal forces were approaching. The forty, with Mai Bhago Ji, fought with great courage. Almost all of the forty became shaheed.", "Guru Ji went to each one. The last, Bhai Mahan Singh, was still alive and asked the Guru to tear up the bedava. The Guru did so, and forgave them all. He called them the Chali Mukte, the Forty Liberated Ones. The place became known as Sri Muktsar Sahib.", "Mai Bhago Ji was wounded but survived. She stayed with the Guru and is remembered as one of the bravest women in Sikh history."], "lesson": "It is never too late to come back and do the right thing. Courage can come from anyone.", "think": ["How did Mai Bhago Ji's words change the forty Sikhs?", "Why do you think the Guru forgave them?"], "words": [["Bedava", "A written note giving up one's tie to the Guru."], ["Chali Mukte", "The Forty Liberated Ones."], ["Shaheed", "A martyr; one who gives their life for truth."]], "n": 73, "seal": "", "who": "Guru Gobind Singh Ji"},

{"id": "chhote-sahibzade", "title": "The Younger Sahibzade", "gur": "ਛੋਟੇ ਸਾਹਿਬਜ਼ਾਦੇ", "cat": "Guru Gobind Singh Ji", "age": "Youth", "where": "Sirhind, 1704", "mins": 4, "c": "#16224D", "c2": "#EFE6D2", "h": 420, "summary": "Two young sons of Guru Gobind Singh Ji, and their grandmother, Mata Gujri Ji, stand firm in their faith.", "text": ["When the Sikhs left Anandpur Sahib in the cold winter of 1704, the Guru's family was separated while crossing the flooded Sirsa river. The two youngest sons of Guru Gobind Singh Ji, Baba Zorawar Singh Ji, about nine years old, and Baba Fateh Singh Ji, about six, went with their grandmother, Mata Gujri Ji.", "A former servant named Gangu offered them shelter, but he betrayed them to the officials. The three were taken to Sirhind and kept in the Thanda Burj, a cold, open tower, through freezing December nights. Mata Gujri Ji kept the boys warm with her love and told them stories of their grandfather, Guru Tegh Bahadur Ji, and great-great-grandfather, Guru Arjan Dev Ji.", "The boys were brought to the court of the governor, Wazir Khan. They walked in and greeted the court with a loud \"Waheguru Ji Ka Khalsa, Waheguru Ji Ki Fateh!\" They were offered riches and comfort if they gave up their faith. They refused, again and again, without fear.", "The governor ordered that they be bricked alive into a wall. The young Sahibzade stayed calm and kept their faith to the end, and became shaheed. When Mata Gujri Ji heard the news, she too left this world.", "A rich man, Diwan Todar Mal, honoured them by buying land for their cremation, covering it with gold coins as the price demanded. Today, Gurdwara Fatehgarh Sahib stands at Sirhind, and every December Sikhs around the world remember their courage."], "lesson": "Courage does not depend on age. The Sahibzade showed that faith and truth are worth more than any reward.", "think": ["Where did the Sahibzade find their courage?", "What does it mean to stand up for what you believe, even when it's hard?"], "words": [["Sahibzade", "The sons of the Guru."], ["Thanda Burj", "The 'cold tower' in Sirhind."], ["Fateh", "Victory."]], "n": 74, "seal": "", "who": "Guru Gobind Singh Ji"},

{"id": "vadde-sahibzade", "title": "The Elder Sahibzade at Chamkaur", "gur": "ਵੱਡੇ ਸਾਹਿਬਜ਼ਾਦੇ", "cat": "Guru Gobind Singh Ji", "age": "Youth", "where": "Chamkaur Sahib, 1704", "mins": 3, "c": "#7A1F2B", "c2": "#E9B021", "h": 405, "summary": "In a small mud fort, forty Sikhs face a huge army. The Guru's two elder sons ask to go out and fight.", "text": ["After leaving Anandpur Sahib in December 1704, Guru Gobind Singh Ji reached Chamkaur with his two elder sons and about forty Sikhs. They took shelter in a small mud fortress, a garhi. A huge Mughal army surrounded them.", "The Sikhs went out in small groups of five to face the army, so the others could defend the fort. Each group fought with great courage.", "The Guru's elder son, Baba Ajit Singh Ji, about seventeen years old, asked his father for permission to go out and fight. The Guru blessed him, and he fought bravely until he became shaheed.", "Then the younger brother, Baba Jujhar Singh Ji, only about fourteen, asked to go too. The Guru hugged him, blessed him, and sent him out. He too fought bravely and became shaheed. The Guru watched both his sons with calm and pride, thanking Waheguru.", "That night, the remaining Sikhs, acting as the Panj Pyare, ordered the Guru to leave the fort so that he could keep guiding the Khalsa. The Guru obeyed the Khalsa's command. Gurdwara Katalgarh Sahib now stands at Chamkaur Sahib."], "lesson": "The Guru gave everything, even his own sons, for truth and justice. The Khalsa's word was respected even by the Guru.", "think": ["Why did the Sikhs go out in small groups?", "Why did the Guru obey the Sikhs and leave the fort?"], "words": [["Garhi", "A small mud fortress."], ["Sahibzade", "The sons of the Guru."]], "n": 75, "seal": "", "who": "Guru Gobind Singh Ji"},

{"id": "budhu-shah", "title": "Pir Budhu Shah's Gift", "gur": "ਪੀਰ ਬੁੱਧੂ ਸ਼ਾਹ", "cat": "Guru Gobind Singh Ji", "age": "Kids", "where": "Sadhaura and Bhangani, 1688", "mins": 3, "c": "#3E8E4A", "c2": "#EFE6D2", "h": 390, "summary": "A Muslim saint stands by the Guru when others run away. The Guru gives him a precious keepsake.", "text": ["Pir Budhu Shah was a respected Sufi saint from Sadhaura. He loved and admired Guru Gobind Singh Ji, and the two often met.", "Once, Pir Budhu Shah asked the Guru to give work to five hundred Pathan soldiers who had been sent away from the Mughal army. The Guru agreed, and gave them a place in his army.", "In 1688, the hill kings attacked the Guru at Bhangani. On the eve of the battle, most of the Pathan soldiers ran away to join the other side. When Pir Budhu Shah heard this, he was ashamed. He came to the battlefield himself with his four sons and seven hundred followers to fight beside the Guru.", "The Guru's side won, but two of Pir Budhu Shah's sons gave their lives in the battle. The Guru was deeply touched by his loyalty.", "The Guru wanted to thank him. Pir Budhu Shah asked only for the comb the Guru had just used. Guru Ji gave him the comb with some of his hair still in it, a turban and a kirpan. These keepsakes were treasured by his family for generations."], "lesson": "True friendship crosses every boundary of faith. Loyalty means standing by someone when it matters most.", "think": ["Why was Pir Budhu Shah ashamed?", "What does this story teach about friendship between people of different faiths?"], "words": [["Pir", "A Muslim holy man or saint."], ["Kangha", "A wooden comb, one of the five Ks."]], "n": 76, "seal": "", "who": "Guru Gobind Singh Ji"},

{"id": "banda-singh", "title": "Baba Banda Singh Bahadur", "gur": "ਬਾਬਾ ਬੰਦਾ ਸਿੰਘ ਬਹਾਦਰ", "cat": "Sikh Heroes", "who": "Baba Banda Singh Bahadur", "age": "Youth", "where": "Nanded and Punjab, 1708–1716", "mins": 3, "c": "#C2410C", "c2": "#1B2A5E", "h": 410, "summary": "A proud hermit tries to test Guru Gobind Singh Ji with his powers. Instead, he becomes the Guru's servant, and a great leader.", "text": ["Lachhman Dev was born in 1670 in the hills of Rajouri. As a young man, he went hunting and shot a deer that was about to give birth. Deeply sad, he gave up worldly life and became a hermit called Madho Das. He lived beside the Godavari river at Nanded, and people said he had magical powers.", "In 1708, Guru Gobind Singh Ji came to Nanded and sat on Madho Das's seat. Madho Das was angry and tried to use his powers to throw the Guru off, but nothing worked. Then he looked into the Guru's calm eyes and understood who he was. He fell at the Guru's feet and said, \"I am your banda, your servant.\"", "The Guru gave him Amrit and a new name, Banda Singh. He gave him five arrows, a drum and a Nishan Sahib, sent five Sikhs with him, and asked him to go to Punjab to protect the poor from cruelty.", "Banda Singh Bahadur gathered farmers and ordinary people and won many battles. In 1710, he set up the first Sikh rule, made coins in the names of Guru Nanak Dev Ji and Guru Gobind Singh Ji, and gave land to the farmers who worked it, instead of to rich landlords.", "In 1716, he was captured and taken to Delhi, where he became shaheed, refusing to give up his faith. He is remembered as one of the greatest Sikh heroes."], "lesson": "Even a proud person can change and become a servant of truth. Real leaders protect ordinary people.", "think": ["What did Madho Das say when he understood who the Guru was?", "Why was giving land to the farmers so important?"], "words": [["Banda", "A servant."], ["Nishan Sahib", "The Sikh flag."], ["Bairagi", "A hermit who has given up worldly life."]], "n": 77, "seal": ""},

{"id": "baba-deep-singh", "title": "Baba Deep Singh Ji", "gur": "ਬਾਬਾ ਦੀਪ ਸਿੰਘ ਜੀ", "cat": "Sikh Heroes", "who": "Baba Deep Singh Ji", "age": "Youth", "where": "Damdama Sahib to Amritsar, 1757", "mins": 3, "c": "#1F3A7A", "c2": "#E9B021", "h": 420, "summary": "A scholar who copies Guru Granth Sahib Ji by hand picks up his sword at seventy-five to protect Harmandir Sahib.", "text": ["Baba Deep Singh Ji took Amrit from Guru Gobind Singh Ji himself. He became a great scholar at Damdama Sahib, where he taught Gurbani and carefully wrote out copies of Guru Granth Sahib Ji by hand, so the Guru's word could reach Sikhs everywhere.", "In 1757, an Afghan commander named Jahan Khan attacked Amritsar. His soldiers damaged Harmandir Sahib and filled the sacred sarovar with rubble.", "Baba Deep Singh Ji was about seventy-five years old. When he heard the news, he drew a line on the ground and said, \"Only those who are ready to give their lives for Harmandir Sahib should cross this line.\" Thousands of Sikhs stepped across.", "They marched towards Amritsar and met a huge army near the village of Gohalwar. Baba Deep Singh Ji fought fearlessly with his heavy khanda. He had vowed to reach Harmandir Sahib.", "The story says that even after being badly wounded in the neck, he kept going, holding his head on the palm of his hand, and fell only when he reached the parikrama around Harmandir Sahib. Gurdwara Shaheed Baba Deep Singh Ji stands in Amritsar today."], "lesson": "Keep your promises with all your heart. Protecting what is sacred takes courage at any age.", "think": ["What work did Baba Deep Singh Ji do before the battle?", "What did the line on the ground mean?"], "words": [["Khanda", "A heavy, double-edged sword."], ["Parikrama", "The walkway around the sarovar at Harmandir Sahib."]], "n": 78, "seal": ""},

{"id": "bhai-taru-singh", "title": "Bhai Taru Singh Ji", "gur": "ਭਾਈ ਤਾਰੂ ਸਿੰਘ ਜੀ", "cat": "Sikh Heroes", "who": "Bhai Taru Singh Ji", "age": "Youth", "where": "Poohla and Lahore, 1745", "mins": 3, "c": "#3A2F6E", "c2": "#F08A1C", "h": 390, "summary": "A young farmer secretly feeds Sikhs hiding in the forests. When he's caught, he refuses to give up his hair.", "text": ["Bhai Taru Singh Ji was a young farmer from the village of Poohla, near Amritsar. He lived with his mother and sister, and they shared everything they grew.", "In those days, the governor of Lahore, Zakariya Khan, was hunting down Sikhs, and many hid in the forests. Bhai Taru Singh Ji and his family secretly brought them food, even though it was very dangerous.", "Someone reported him, and he was arrested and taken to Lahore. Zakariya Khan told him, \"Cut your hair and give up your faith, and you will be free.\"", "Bhai Taru Singh Ji replied calmly that his kesh, his uncut hair, was a gift from the Guru, and he would keep it with his last breath. The angry governor ordered that his hair be removed together with his scalp. Bhai Taru Singh Ji stayed calm, reciting Japji Sahib.", "He lived on for twenty-two days, peaceful and prayerful. The story says that Zakariya Khan himself fell ill and died before him. Bhai Taru Singh Ji is remembered for his kindness to the hungry and his love for his kesh."], "lesson": "Share with those in need, even when it is hard. Keeping the Guru's gifts with love is true faith.", "think": ["How did Bhai Taru Singh Ji help the hiding Sikhs?", "Why was his kesh so precious to him?"], "words": [["Kesh", "Uncut hair, kept as a gift from God."], ["Langar", "The free community kitchen where everyone eats together."]], "n": 79, "seal": ""},

{"id": "bhai-mani-singh", "title": "Bhai Mani Singh Ji", "gur": "ਭਾਈ ਮਨੀ ਸਿੰਘ ਜੀ", "cat": "Sikh Heroes", "who": "Bhai Mani Singh Ji", "age": "Youth", "where": "Damdama Sahib, Amritsar and Lahore", "mins": 3, "c": "#0F5A55", "c2": "#EFE6D2", "h": 400, "summary": "The Guru's childhood friend becomes a great scholar. When he cannot pay an unfair tax, he faces a cruel sentence with calm.", "text": ["Bhai Mani Singh Ji grew up alongside Guru Gobind Singh Ji and served him all his life. He was a great scholar. At Damdama Sahib, he wrote down Guru Granth Sahib Ji as Guru Gobind Singh Ji recited it, a precious copy known as the Damdami Bir.", "Later, he became the head Granthi of Harmandir Sahib in Amritsar, caring for the Sikhs in very difficult times.", "In 1738, he asked the governor of Lahore for permission to hold a Diwali gathering at Harmandir Sahib. The governor agreed, but only if he paid a large tax of five thousand rupees. Bhai Mani Singh Ji hoped to pay it from the offerings of the sangat.", "But the governor secretly planned to attack the gathering. Bhai Mani Singh Ji found out and sent word to the Sikhs to stay away, to keep them safe. With no gathering, there were no offerings, and he could not pay the tax.", "He was arrested and told to give up his faith or face a cruel death, being cut limb by limb. He calmly refused, reciting Japji Sahib to the end. He is remembered in the Sikh Ardas every day."], "lesson": "Protecting others comes first. Learning, sewa and courage together make a true Sikh.", "think": ["Why did Bhai Mani Singh Ji tell the Sikhs to stay away?", "What precious copy did he write?"], "words": [["Granthi", "A person who reads and cares for Guru Granth Sahib Ji."], ["Bir", "A volume or copy of Guru Granth Sahib Ji."]], "n": 80, "seal": ""},

{"id": "ranjit-singh-stone", "title": "The Maharaja and the Stone", "gur": "ਮਹਾਰਾਜਾ ਰਣਜੀਤ ਸਿੰਘ", "cat": "Sikh Heroes", "who": "Maharaja Ranjit Singh", "age": "Kids", "where": "Lahore", "mins": 2, "c": "#E9B021", "c2": "#3E8E4A", "t": "#1b1b1b", "h": 380, "summary": "A stone hits the Maharaja as he rides by. His soldiers expect punishment, but he does something very different.", "text": ["Maharaja Ranjit Singh was the ruler of the Sikh Empire, with his capital at Lahore. He was known for being fair and generous to his people, whatever their faith.", "One day, as he rode through the streets with his soldiers, a stone suddenly flew through the air and hit him. The soldiers were shocked and rushed to find who had thrown it.", "They came back with an old woman and her young son, trembling with fear. \"Maharaja,\" the woman cried, \"my son threw a stone at the ber tree to knock down some fruit, because we were hungry. It hit you by mistake. Please forgive us!\"", "Everyone waited for the punishment. But the Maharaja smiled and ordered his treasurer to give them money and food.", "The soldiers were surprised. The Maharaja explained, \"When a stone hits a tree, the tree gives sweet fruit. If a tree can be so generous, how can I, a Maharaja, give anything less?\""], "lesson": "Answer mistakes with kindness. A good leader is generous, like a fruit tree.", "think": ["Why had the boy thrown the stone?", "What did the Maharaja learn from the tree?"], "words": [["Maharaja", "A great king."], ["Ber", "A small fruit tree (jujube)."]], "n": 81, "seal": ""}
];

PA["real-education"]={t:[
"ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦਾ ਜਨਮ 1469 ਵਿੱਚ ਪਿੰਡ ਤਲਵੰਡੀ ਰਾਏ ਭੋਇ ਵਿੱਚ ਹੋਇਆ, ਜਿਸ ਨੂੰ ਹੁਣ ਨਨਕਾਣਾ ਸਾਹਿਬ ਕਹਿੰਦੇ ਹਨ ਅਤੇ ਜੋ ਪਾਕਿਸਤਾਨ ਵਿੱਚ ਹੈ। ਉਨ੍ਹਾਂ ਦੇ ਪਿਤਾ, ਮਹਿਤਾ ਕਾਲੂ ਜੀ, ਪਿੰਡ ਦੇ ਮੁਖੀ ਰਾਏ ਬੁਲਾਰ ਦੀ ਜ਼ਮੀਨ ਦਾ ਹਿਸਾਬ-ਕਿਤਾਬ ਰੱਖਦੇ ਸਨ।",
"ਜਦੋਂ ਨਾਨਕ ਸੱਤ ਸਾਲ ਦੇ ਹੋਏ, ਪਿਤਾ ਜੀ ਉਨ੍ਹਾਂ ਨੂੰ ਪਿੰਡ ਦੇ ਅਧਿਆਪਕ ਪੰਡਿਤ ਗੋਪਾਲ ਦਾਸ ਕੋਲ ਹਿਸਾਬ ਅਤੇ ਲਿਖਣਾ ਸਿੱਖਣ ਲਈ ਲੈ ਗਏ। ਇੱਕ ਦਿਨ ਅਧਿਆਪਕ ਨੇ ਵੇਖਿਆ ਕਿ ਨਾਨਕ ਆਪਣੀ ਫੱਟੀ ਲੈ ਕੇ ਚੁੱਪ-ਚਾਪ ਬੈਠੇ ਹਨ ਅਤੇ ਸਵਾਲ ਨਹੀਂ ਕਰ ਰਹੇ। \"ਨਾਨਕ, ਤੂੰ ਆਪਣਾ ਸਬਕ ਕਿਉਂ ਨਹੀਂ ਪੜ੍ਹ ਰਿਹਾ?\" ਉਨ੍ਹਾਂ ਪੁੱਛਿਆ।",
"ਨਾਨਕ ਨੇ ਨਿਮਰਤਾ ਨਾਲ ਜਵਾਬ ਦਿੱਤਾ, \"ਸਤਿਕਾਰਯੋਗ ਗੁਰੂ ਜੀ, ਇਹ ਸਬਕ ਮੈਨੂੰ ਪੈਸੇ ਗਿਣਨੇ ਅਤੇ ਜ਼ਮੀਨ ਮਿਣਨੀ ਸਿਖਾਉਂਦੇ ਹਨ। ਪਰ ਕੀ ਇਹ ਮੈਨੂੰ ਇਹ ਸਿਖਾਉਂਦੇ ਹਨ ਕਿ ਮਨ ਨੂੰ ਲਾਲਚ ਅਤੇ ਚਿੰਤਾ ਤੋਂ ਕਿਵੇਂ ਛੁਡਾਇਆ ਜਾਵੇ?\"",
"ਅਧਿਆਪਕ ਹੈਰਾਨ ਹੋ ਗਏ। \"ਮੈਨੂੰ ਤਾਂ ਸਿਰਫ਼ ਹਿਸਾਬ ਅਤੇ ਮਿਣਤੀ ਹੀ ਆਉਂਦੀ ਹੈ,\" ਉਨ੍ਹਾਂ ਕਿਹਾ। \"ਜੇ ਤੈਨੂੰ ਕੁਝ ਹੋਰ ਪਤਾ ਹੈ, ਤਾਂ ਮੈਨੂੰ ਦੱਸ।\" ਨਾਨਕ ਨੇ ਸਮਝਾਇਆ ਕਿ ਸੱਚੀ ਵਿੱਦਿਆ ਮਨ ਨੂੰ ਬੁਰੇ ਖ਼ਿਆਲਾਂ ਤੋਂ ਸਾਫ਼ ਕਰਦੀ ਹੈ, ਉਸ ਨੂੰ ਦਇਆ ਨਾਲ ਭਰਦੀ ਹੈ, ਅਤੇ ਸਾਨੂੰ ਇੱਕ ਕਰਤਾਰ ਨੂੰ ਯਾਦ ਕਰਨਾ ਅਤੇ ਉਸ ਦੀ ਸਿਫ਼ਤ ਕਰਨਾ ਸਿਖਾਉਂਦੀ ਹੈ। ਜਿਸ ਮਨ ਵਿੱਚ ਇਹ ਪਿਆਰ ਹੋਵੇ, ਉਸ ਨੂੰ ਕੋਈ ਡਰ ਨਹੀਂ ਰਹਿੰਦਾ। ਅਧਿਆਪਕ ਹੈਰਾਨ ਹੋ ਕੇ ਸੁਣਦੇ ਰਹੇ ਅਤੇ ਬੋਲੇ, \"ਜੋ ਮੈਨੂੰ ਆਉਂਦਾ ਸੀ, ਮੈਂ ਤੈਨੂੰ ਸਿਖਾ ਦਿੱਤਾ। ਇਹ ਸੱਚੀ ਵਿੱਦਿਆ ਮੈਂ ਨਹੀਂ ਸਿਖਾ ਸਕਦਾ।\"",
"ਜਦੋਂ ਨਾਨਕ ਥੋੜ੍ਹੇ ਵੱਡੇ ਹੋਏ, ਪਿਤਾ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਫ਼ਾਰਸੀ ਸਿੱਖਣ ਲਈ ਇੱਕ ਮੁਸਲਮਾਨ ਅਧਿਆਪਕ, ਮੌਲਵੀ ਕੁਤਬੁੱਦੀਨ ਕੋਲ ਭੇਜਿਆ। ਨਾਨਕ ਨੇ ਉਨ੍ਹਾਂ ਤੋਂ ਪੁੱਛਿਆ ਕਿ ਹਰ ਅੱਖਰ ਦਾ ਅਸਲ ਅਰਥ ਕੀ ਹੈ। ਇਹ ਗੱਲ ਪਹਿਲਾਂ ਕਦੇ ਕਿਸੇ ਵਿਦਿਆਰਥੀ ਨੇ ਨਹੀਂ ਪੁੱਛੀ ਸੀ! ਫਿਰ ਨਾਨਕ ਨੇ ਆਪ ਹੀ ਇੱਕ-ਇੱਕ ਅੱਖਰ ਸਮਝਾਇਆ ਅਤੇ ਹਰ ਅੱਖਰ ਨੂੰ ਰੱਬ ਦੀ ਸਿਫ਼ਤ ਦੀ ਇੱਕ ਤੁਕ ਬਣਾ ਦਿੱਤਾ। ਮੌਲਵੀ ਜੀ ਸਮਝ ਗਏ ਕਿ ਕਿਸੇ ਵੀ ਵਿੱਦਿਆ ਦਾ ਸਭ ਤੋਂ ਵਧੀਆ ਲਾਭ ਇਹ ਹੈ ਕਿ ਉਹ ਸਾਨੂੰ ਕਰਤਾਰ ਦੇ ਨੇੜੇ ਲੈ ਜਾਵੇ।"],
l:"ਸਕੂਲ ਦੀ ਪੜ੍ਹਾਈ ਜ਼ਰੂਰੀ ਹੈ, ਪਰ ਸੱਚੀ ਵਿੱਦਿਆ ਸਾਨੂੰ ਹੋਰ ਦਇਆਵਾਨ ਅਤੇ ਈਮਾਨਦਾਰ ਵੀ ਬਣਾਉਂਦੀ ਹੈ ਅਤੇ ਵਾਹਿਗੁਰੂ ਨੂੰ ਯਾਦ ਕਰਨਾ ਸਿਖਾਉਂਦੀ ਹੈ।"};

PA["sacred-thread"]={t:[
"ਜਦੋਂ ਨਾਨਕ ਨੌਂ ਸਾਲ ਦੇ ਹੋਏ, ਪਰਿਵਾਰ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਜਨੇਊ ਪਹਿਨਾਉਣ ਦੀ ਰਸਮ ਰੱਖੀ। ਜਨੇਊ ਸੂਤ ਦਾ ਇੱਕ ਪਵਿੱਤਰ ਧਾਗਾ ਹੈ ਜੋ ਕੁਝ ਜਾਤਾਂ ਦੇ ਹਿੰਦੂ ਮੁੰਡੇ ਪਹਿਨਦੇ ਸਨ। ਰਿਸ਼ਤੇਦਾਰ ਅਤੇ ਗੁਆਂਢੀ ਇਕੱਠੇ ਹੋਏ। ਪਰਿਵਾਰ ਦੇ ਪੁਰੋਹਿਤ, ਪੰਡਿਤ ਹਰਦਿਆਲ ਨੇ ਮੰਤਰ ਪੜ੍ਹੇ ਅਤੇ ਧਾਗਾ ਨਾਨਕ ਦੇ ਮੋਢੇ ਉੱਤੇ ਪਾਉਣ ਲਈ ਚੁੱਕਿਆ।",
"ਪਰ ਨਾਨਕ ਨੇ ਪਿਆਰ ਨਾਲ ਉਨ੍ਹਾਂ ਨੂੰ ਰੋਕ ਲਿਆ। \"ਪਿਆਰੇ ਪੰਡਿਤ ਜੀ,\" ਉਨ੍ਹਾਂ ਪੁੱਛਿਆ, \"ਇਹ ਧਾਗਾ ਮੇਰੇ ਲਈ ਕੀ ਕਰੇਗਾ? ਕੀ ਇਹ ਮੈਨੂੰ ਚੰਗਾ ਇਨਸਾਨ ਬਣਾ ਦੇਵੇਗਾ?\"",
"ਪੰਡਿਤ ਜੀ ਨੇ ਸਮਝਾਇਆ ਕਿ ਇਹ ਧਾਗਾ ਦੂਜੇ, ਆਤਮਿਕ ਜਨਮ ਦੀ ਨਿਸ਼ਾਨੀ ਹੈ। ਸਿਰਫ਼ ਇਸ ਨੂੰ ਪਹਿਨਣ ਵਾਲੇ ਹੀ ਕੁਝ ਧਾਰਮਿਕ ਰਸਮਾਂ ਵਿੱਚ ਹਿੱਸਾ ਲੈ ਸਕਦੇ ਹਨ।",
"ਨਾਨਕ ਨੇ ਇਸ ਬਾਰੇ ਸੋਚਿਆ। \"ਜੇ ਇਹ ਧਾਗਾ ਆਤਮਿਕ ਜਨਮ ਦਿੰਦਾ ਹੈ, ਤਾਂ ਕੀ ਇਹ ਆਤਮਾ ਦੁਆਲੇ ਨਹੀਂ ਬੰਨ੍ਹਣਾ ਚਾਹੀਦਾ?\" ਉਨ੍ਹਾਂ ਪੁੱਛਿਆ। \"ਕੋਈ ਇਹ ਧਾਗਾ ਪਹਿਨ ਕੇ ਵੀ ਝੂਠ ਬੋਲ ਸਕਦਾ ਹੈ ਜਾਂ ਦੂਜਿਆਂ ਦੀ ਬੁਰਾਈ ਕਰ ਸਕਦਾ ਹੈ। ਸੂਤ ਦਾ ਧਾਗਾ ਮੈਲਾ ਹੋ ਜਾਂਦਾ ਹੈ, ਟੁੱਟ ਜਾਂਦਾ ਹੈ, ਅਤੇ ਮਰਨ ਵੇਲੇ ਸਰੀਰ ਦੇ ਨਾਲ ਹੀ ਸੜ ਜਾਂਦਾ ਹੈ।\"",
"ਫਿਰ ਨਾਨਕ ਨੇ ਉਸ ਜਨੇਊ ਬਾਰੇ ਦੱਸਿਆ ਜੋ ਉਹ ਚਾਹੁੰਦੇ ਸਨ। ਉਨ੍ਹਾਂ ਕਿਹਾ, ਦਇਆ ਨੂੰ ਕਪਾਹ ਬਣਾਓ ਅਤੇ ਸੰਤੋਖ ਨੂੰ ਸੂਤ। ਇਸ ਨੂੰ ਜਤ (ਸੰਜਮ) ਦੀਆਂ ਗੰਢਾਂ ਦਿਓ ਅਤੇ ਸੱਚ ਨਾਲ ਵੱਟ ਦਿਓ। ਅਜਿਹਾ ਜਨੇਊ ਨਾ ਕਦੇ ਟੁੱਟਦਾ ਹੈ, ਨਾ ਮੈਲਾ ਹੁੰਦਾ ਹੈ, ਅਤੇ ਸਦਾ ਆਤਮਾ ਦੇ ਨਾਲ ਰਹਿੰਦਾ ਹੈ। \"ਪੰਡਿਤ ਜੀ, ਜੇ ਤੁਹਾਡੇ ਕੋਲ ਅਜਿਹਾ ਜਨੇਊ ਹੈ, ਤਾਂ ਮੈਨੂੰ ਜ਼ਰੂਰ ਪਹਿਨਾਓ।\" ਇਹ ਬਚਨ ਹੁਣ ਗੁਰਬਾਣੀ ਦਾ ਹਿੱਸਾ ਹਨ, ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਜੀ ਵਿੱਚ ਆਸਾ ਦੀ ਵਾਰ (ਅੰਗ 471) ਵਿੱਚ।",
"ਪੰਡਿਤ ਜੀ ਨੇ ਕਿਹਾ ਕਿ ਇਹ ਰਸਮ ਬਹੁਤ ਸਮੇਂ ਤੋਂ ਚਲੀ ਆ ਰਹੀ ਹੈ ਅਤੇ ਕਿਸੇ ਨੇ ਕਦੇ ਇਨਕਾਰ ਨਹੀਂ ਕੀਤਾ। ਪਰ ਨਾਨਕ ਆਪਣੀ ਗੱਲ ਉੱਤੇ ਪੱਕੇ ਰਹੇ। ਪੰਡਿਤ ਹਰਦਿਆਲ ਸਮਝ ਗਏ ਕਿ ਨਾਨਕ ਸੂਤ ਦਾ ਜਨੇਊ ਨਹੀਂ ਪਹਿਨਣਗੇ, ਅਤੇ ਉਹ ਧਾਗਾ ਆਪਣੇ ਥੈਲੇ ਵਿੱਚ ਪਾ ਕੇ ਘਰ ਚਲੇ ਗਏ।"],
l:"ਇਨਸਾਨ ਨੂੰ ਪਵਿੱਤਰ ਉਸ ਦਾ ਪਹਿਰਾਵਾ ਨਹੀਂ, ਸਗੋਂ ਉਸ ਦਾ ਜੀਵਨ ਬਣਾਉਂਦਾ ਹੈ: ਦਇਆ, ਸੰਤੋਖ, ਸੰਜਮ ਅਤੇ ਸੱਚ ਨਾਲ ਜੀਣਾ।"};

PA["advice-to-physician"]={t:[
"ਜਵਾਨੀ ਵਿੱਚ ਨਾਨਕ ਨੂੰ ਸੰਤਾਂ ਅਤੇ ਮਹਾਂਪੁਰਖਾਂ ਨੂੰ ਮਿਲਣਾ ਬਹੁਤ ਚੰਗਾ ਲੱਗਦਾ ਸੀ। ਜਦੋਂ ਕੋਈ ਨਾ ਹੁੰਦਾ, ਉਹ ਘਰ ਬੈਠ ਕੇ ਰੱਬ ਦੀ ਡੂੰਘੀ ਯਾਦ ਵਿੱਚ ਗੁਆਚੇ ਰਹਿੰਦੇ। ਕਦੇ-ਕਦੇ ਉਹ ਖਾਣਾ ਖਾਣਾ ਵੀ ਭੁੱਲ ਜਾਂਦੇ। ਜਦੋਂ ਕੋਈ ਮਿਲਣ ਆਉਂਦਾ, ਉਹ ਹੌਲੀ ਜਿਹੀ ਗੱਲ ਕਰਦੇ, ਜਿਵੇਂ ਉਨ੍ਹਾਂ ਦਾ ਮਨ ਕਿਤੇ ਦੂਰ ਹੋਵੇ।",
"ਮਾਤਾ-ਪਿਤਾ ਨੂੰ ਚਿੰਤਾ ਹੋਣ ਲੱਗੀ। ਗੁਆਂਢੀ ਘੁਸਰ-ਮੁਸਰ ਕਰਦੇ, \"ਮਹਿਤਾ ਕਾਲੂ ਨੂੰ ਆਪਣੇ ਇਕਲੌਤੇ ਪੁੱਤਰ ਨਾਲੋਂ ਪੈਸੇ ਦੀ ਵੱਧ ਫ਼ਿਕਰ ਹੈ। ਉਹ ਮੁੰਡੇ ਦਾ ਇਲਾਜ ਕਿਉਂ ਨਹੀਂ ਕਰਾਉਂਦੇ?\" ਤਾਂ ਮਹਿਤਾ ਕਾਲੂ ਜੀ ਨੇ ਪਿੰਡ ਦੇ ਹਕੀਮ ਹਰਿਦਾਸ ਨੂੰ ਸੱਦਿਆ, ਜਿਸ ਨੂੰ ਵੈਦ ਕਹਿੰਦੇ ਸਨ।",
"ਵੈਦ ਜੀ ਬੈਠ ਗਏ ਅਤੇ ਨਬਜ਼ ਵੇਖਣ ਲਈ ਨਾਨਕ ਦੀ ਕਲਾਈ ਫੜ ਲਈ। ਨਾਨਕ ਨੇ ਮੁਸਕਰਾ ਕੇ ਬਾਂਹ ਪਿੱਛੇ ਖਿੱਚ ਲਈ। \"ਪਿਆਰੇ ਵੈਦ ਜੀ, ਤੁਸੀਂ ਮੇਰੀ ਬਾਂਹ ਕਿਉਂ ਫੜੀ ਹੈ?\"",
"\"ਮੈਂ ਤੇਰੀ ਨਬਜ਼ ਵੇਖਣੀ ਹੈ,\" ਵੈਦ ਨੇ ਕਿਹਾ, \"ਤਾਂ ਜੋ ਤੇਰੀ ਬਿਮਾਰੀ ਲੱਭ ਸਕਾਂ ਅਤੇ ਅਜਿਹੀ ਦਵਾਈ ਦੇ ਸਕਾਂ ਕਿ ਤੈਨੂੰ ਫਿਰ ਭੁੱਖ ਲੱਗਣ ਲੱਗੇ।\"",
"ਨਾਨਕ ਨੇ ਕਿਹਾ, \"ਮੇਰਾ ਸਰੀਰ ਬਿਮਾਰ ਨਹੀਂ ਹੈ। ਜੋ ਮੈਂ ਮਹਿਸੂਸ ਕਰਦਾ ਹਾਂ ਉਹ ਮੇਰੇ ਮਨ ਅਤੇ ਦਿਲ ਦੇ ਅੰਦਰ ਹੈ। ਸਿਆਣਾ ਵੈਦ ਪਹਿਲਾਂ ਅਸਲ ਰੋਗ ਨੂੰ ਸਮਝਦਾ ਹੈ, ਫਿਰ ਸਹੀ ਦਵਾਈ ਦਿੰਦਾ ਹੈ। ਮੇਰਾ ਇਲਾਜ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ, ਕਿਰਪਾ ਕਰਕੇ ਆਪਣਾ ਰੋਗ ਠੀਕ ਕਰੋ।\"",
"ਵੈਦ ਚੌਂਕ ਗਿਆ। \"ਪਰ ਮੈਂ ਤਾਂ ਬਿਲਕੁਲ ਤੰਦਰੁਸਤ ਹਾਂ! ਮੈਨੂੰ ਕਿਹੜਾ ਰੋਗ ਹੈ?\" ਨਾਨਕ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, \"ਸਭ ਵਾਂਗ, ਤੁਸੀਂ ਵੀ ਜਨਮ ਅਤੇ ਮਰਨ ਦੇ ਗੇੜ ਵਿੱਚ ਫਸੇ ਹੋਏ ਹੋ। ਕੋਈ ਜੜੀ-ਬੂਟੀ ਇਸ ਦਾ ਇਲਾਜ ਨਹੀਂ ਕਰ ਸਕਦੀ। ਸਿਰਫ਼ ਉਹ, ਜੋ ਨਾ ਜੰਮਦਾ ਹੈ ਨਾ ਮਰਦਾ ਹੈ, ਵਾਹਿਗੁਰੂ, ਇਸ ਨੂੰ ਠੀਕ ਕਰ ਸਕਦਾ ਹੈ।\"",
"ਹਰਿਦਾਸ ਸਮਝ ਗਿਆ। ਉਸ ਨੇ ਮਹਿਤਾ ਕਾਲੂ ਜੀ ਨੂੰ ਕਿਹਾ, \"ਤੁਹਾਡਾ ਪੁੱਤਰ ਬਿਮਾਰ ਨਹੀਂ ਹੈ। ਉਹ ਰੱਬ ਦੇ ਪਿਆਰ ਨਾਲ ਭਰਿਆ ਹੋਇਆ ਹੈ। ਉਸ ਦੀ ਚਿੰਤਾ ਨਾ ਕਰੋ। ਉਸ ਨੂੰ ਮੇਰੀ ਕਿਸੇ ਦਵਾਈ ਦੀ ਲੋੜ ਨਹੀਂ।\""],
l:"ਸਰੀਰ ਦੀ ਸੰਭਾਲ ਜ਼ਰੂਰੀ ਹੈ, ਪਰ ਮਨ ਅਤੇ ਆਤਮਾ ਨੂੰ ਵੀ ਸੰਭਾਲ ਦੀ ਲੋੜ ਹੈ, ਜੋ ਵਾਹਿਗੁਰੂ ਨੂੰ ਯਾਦ ਕਰਨ ਨਾਲ ਹੁੰਦੀ ਹੈ।"};

PA["true-merchandise"]={t:[
"ਜਦੋਂ ਨਾਨਕ ਅਠਾਰਾਂ ਸਾਲ ਦੇ ਹੋਏ, ਪਿਤਾ ਮਹਿਤਾ ਕਾਲੂ ਜੀ ਨੇ ਸੋਚਿਆ ਕਿ ਉਹ ਵਪਾਰ ਕਰਨ। ਉਨ੍ਹਾਂ ਨੇ ਨਾਨਕ ਦੇ ਮਿੱਤਰ ਭਾਈ ਬਾਲਾ ਨੂੰ ਵੀਹ ਰੁਪਏ ਦਿੱਤੇ ਅਤੇ ਕਿਹਾ, \"ਨਾਨਕ ਨਾਲ ਮੰਡੀ ਜਾਓ। ਚੰਗਾ ਸਮਾਨ ਖ਼ਰੀਦੋ ਜੋ ਮੁਨਾਫ਼ੇ ਨਾਲ ਵੇਚ ਸਕੀਏ। ਜੇ ਚੰਗਾ ਸੌਦਾ ਕਰੋਗੇ, ਤਾਂ ਅਗਲੀ ਵਾਰ ਹੋਰ ਪੈਸੇ ਦਿਆਂਗਾ।\"",
"ਨਾਨਕ ਅਤੇ ਭਾਈ ਬਾਲਾ ਤਲਵੰਡੀ ਤੋਂ ਚੂਹੜਕਾਣੇ ਸ਼ਹਿਰ ਵੱਲ ਤੁਰ ਪਏ। ਦਸ-ਬਾਰਾਂ ਮੀਲ ਚੱਲਣ ਤੋਂ ਬਾਅਦ, ਉਨ੍ਹਾਂ ਨੇ ਜੰਗਲ ਵਿੱਚ ਸਾਧੂਆਂ ਦੀ ਇੱਕ ਟੋਲੀ ਬੈਠੀ ਵੇਖੀ। ਉਹ ਭੁੱਖੇ ਸਨ, ਅਤੇ ਕਈਆਂ ਦੇ ਤਨ ਉੱਤੇ ਕੱਪੜੇ ਵੀ ਮਸਾਂ ਸਨ।",
"ਨਾਨਕ ਨੇ ਭਾਈ ਬਾਲੇ ਨੂੰ ਕਿਹਾ, \"ਪਿਤਾ ਜੀ ਨੇ ਮੁਨਾਫ਼ੇ ਵਾਲਾ ਸੌਦਾ ਕਰਨ ਨੂੰ ਕਿਹਾ ਸੀ। ਇਨ੍ਹਾਂ ਭੁੱਖਿਆਂ ਨੂੰ ਖਾਣਾ ਅਤੇ ਕੱਪੜੇ ਦੇਣ ਨਾਲੋਂ ਵੱਧ ਮੁਨਾਫ਼ਾ ਕੀ ਹੋ ਸਕਦਾ ਹੈ? ਇਹ ਸੱਚਾ ਸੌਦਾ ਹੈ, ਅਤੇ ਅਜਿਹਾ ਮੌਕਾ ਸ਼ਾਇਦ ਫਿਰ ਨਾ ਮਿਲੇ।\"",
"ਨਾਨਕ ਨੇ ਸਾਰੇ ਪੈਸੇ ਸਾਧੂਆਂ ਦੇ ਮੁਖੀ ਅੱਗੇ ਰੱਖ ਦਿੱਤੇ। ਮੁਖੀ ਨੇ ਮੁਸਕਰਾ ਕੇ ਕਿਹਾ, \"ਪੁੱਤਰ, ਪੈਸੇ ਸਾਡੇ ਕਿਸੇ ਕੰਮ ਦੇ ਨਹੀਂ। ਅਸੀਂ ਜੰਗਲ ਵਿੱਚ ਰਹਿੰਦੇ ਹਾਂ। ਪਰ ਜੇ ਤੂੰ ਸਾਡੇ ਲਈ ਭੋਜਨ ਲਿਆਵੇਂ, ਤਾਂ ਅਸੀਂ ਖ਼ੁਸ਼ੀ ਨਾਲ ਲੈ ਲਵਾਂਗੇ।\"",
"ਤਾਂ ਨਾਨਕ ਅਤੇ ਭਾਈ ਬਾਲਾ ਨੇੜਲੇ ਪਿੰਡ ਗਏ, ਰਸਦ ਖ਼ਰੀਦੀ ਅਤੇ ਭੋਜਨ ਬਣਵਾਇਆ। ਉਨ੍ਹਾਂ ਨੇ ਹਰ ਸਾਧੂ ਨੂੰ ਭੋਜਨ ਛਕਾਇਆ। ਬਚੇ ਪੈਸਿਆਂ ਨਾਲ ਉਨ੍ਹਾਂ ਲਈ ਕੱਪੜੇ ਵੀ ਲੈ ਦਿੱਤੇ। ਫਿਰ ਉਹ ਖਾਲੀ ਹੱਥ ਪਰ ਖ਼ੁਸ਼ ਦਿਲ ਨਾਲ ਘਰ ਵੱਲ ਤੁਰ ਪਏ।",
"ਤਲਵੰਡੀ ਦੇ ਨੇੜੇ ਨਾਨਕ ਇੱਕ ਖੂਹ ਕੋਲ ਬੈਠ ਗਏ, ਅਤੇ ਭਾਈ ਬਾਲਾ ਮਹਿਤਾ ਕਾਲੂ ਜੀ ਨੂੰ ਸਾਰੀ ਗੱਲ ਦੱਸਣ ਅੱਗੇ ਚਲਾ ਗਿਆ। ਮਹਿਤਾ ਕਾਲੂ ਜੀ ਨੂੰ ਬਹੁਤ ਗੁੱਸਾ ਆਇਆ ਕਿ ਪੈਸੇ \"ਬਰਬਾਦ\" ਹੋ ਗਏ, ਅਤੇ ਉਹ ਪੁੱਤਰ ਨੂੰ ਝਿੜਕਣ ਲਈ ਛੇਤੀ ਨਾਲ ਤੁਰ ਪਏ। ਪਰ ਭਾਈ ਬਾਲੇ ਨੇ ਹੌਸਲੇ ਨਾਲ ਕਿਹਾ, \"ਤੁਸੀਂ ਚੰਗਾ ਸੌਦਾ ਕਰਨ ਨੂੰ ਕਿਹਾ ਸੀ। ਤੁਸੀਂ ਮੰਨੋ ਜਾਂ ਨਾ ਮੰਨੋ, ਨਾਨਕ ਨੇ ਸੱਚਾ ਸੌਦਾ ਕੀਤਾ ਹੈ।\"",
"ਅੱਜ ਉਸ ਥਾਂ ਉੱਤੇ ਗੁਰਦੁਆਰਾ ਸੱਚਾ ਸੌਦਾ ਹੈ ਜਿੱਥੇ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਨੇ ਭੁੱਖਿਆਂ ਨੂੰ ਭੋਜਨ ਛਕਾਇਆ ਸੀ। ਬਹੁਤ ਲੋਕ ਇਸ ਨੂੰ ਗੁਰੂ ਕੇ ਲੰਗਰ ਦੀ ਸ਼ੁਰੂਆਤ ਮੰਨਦੇ ਹਨ।"],
l:"ਅਸਲ ਮੁਨਾਫ਼ਾ ਸਿਰਫ਼ ਕਮਾਇਆ ਪੈਸਾ ਨਹੀਂ, ਸਗੋਂ ਉਸ ਨਾਲ ਕੀਤੀ ਭਲਾਈ ਹੈ। ਲੋੜਵੰਦਾਂ ਨਾਲ ਵੰਡ ਕੇ ਛਕਣਾ ਹੀ ਸੱਚਾ ਸੌਦਾ ਹੈ।"};

PA["modi-khana"]={t:[
"ਜਦੋਂ ਨਾਨਕ ਜਵਾਨ ਹੋਏ, ਪਿਤਾ ਮਹਿਤਾ ਕਾਲੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਵਪਾਰ ਲਈ ਪੈਸੇ ਦਿੱਤੇ, ਪਰ ਨਾਨਕ ਨੇ ਸਾਰੇ ਪੈਸੇ ਭੁੱਖੇ ਸਾਧੂਆਂ ਨੂੰ ਭੋਜਨ ਛਕਾਉਣ ਉੱਤੇ ਲਾ ਦਿੱਤੇ ਅਤੇ ਇਸ ਨੂੰ 'ਸੱਚਾ ਸੌਦਾ' ਕਿਹਾ। ਮਹਿਤਾ ਕਾਲੂ ਜੀ ਸਮਝ ਗਏ ਕਿ ਨਾਨਕ ਦਾ ਮਨ ਆਮ ਵਪਾਰ ਵਿੱਚ ਨਹੀਂ ਲੱਗਦਾ। ਉਨ੍ਹਾਂ ਨੇ ਪਿੰਡ ਦੇ ਮੁਖੀ ਰਾਏ ਬੁਲਾਰ ਤੋਂ ਸਲਾਹ ਲਈ। ਰਾਏ ਬੁਲਾਰ ਨੇ ਕਿਹਾ, \"ਨਾਨਕ ਨੂੰ ਸੁਲਤਾਨਪੁਰ ਲੋਧੀ ਉਸ ਦੀ ਭੈਣ ਬੀਬੀ ਨਾਨਕੀ ਕੋਲ ਭੇਜ ਦਿਓ। ਉਸ ਦੇ ਪਤੀ ਜੈ ਰਾਮ ਨਵਾਬ ਦੌਲਤ ਖ਼ਾਨ ਕੋਲ ਕੰਮ ਕਰਦੇ ਹਨ। ਉਹ ਨਾਨਕ ਲਈ ਕੋਈ ਚੰਗੀ ਨੌਕਰੀ ਲੱਭ ਦੇਣਗੇ।\"",
"ਤਾਂ ਨਾਨਕ ਸੁਲਤਾਨਪੁਰ ਚਲੇ ਗਏ। ਜੈ ਰਾਮ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਨਵਾਬ ਨਾਲ ਮਿਲਾਇਆ, ਜੋ ਖ਼ੁਸ਼ ਹੋਇਆ ਕਿ ਨਾਨਕ ਨੂੰ ਹਿਸਾਬ ਅਤੇ ਫ਼ਾਰਸੀ ਆਉਂਦੀ ਹੈ। ਉਸ ਨੇ ਨਾਨਕ ਨੂੰ ਆਪਣੇ ਵੱਡੇ ਸਰਕਾਰੀ ਭੰਡਾਰ, ਮੋਦੀਖ਼ਾਨੇ, ਦਾ ਮੋਦੀ ਬਣਾ ਦਿੱਤਾ।",
"ਕਿਸਾਨ ਆਪਣੀ ਫ਼ਸਲ ਦਾ ਕੁਝ ਹਿੱਸਾ ਲਗਾਨ ਵਜੋਂ ਮੋਦੀਖ਼ਾਨੇ ਵਿੱਚ ਲਿਆਉਂਦੇ ਸਨ। ਮੋਦੀ ਫ਼ੌਜ ਦੇ ਰਸੋਈਖ਼ਾਨੇ ਨੂੰ ਅਨਾਜ ਭੇਜਦਾ, ਵਾਧੂ ਅਨਾਜ ਵੇਚਦਾ, ਅਤੇ ਪੈਸੇ ਖ਼ਜ਼ਾਨੇ ਵਿੱਚ ਜਮ੍ਹਾਂ ਕਰਾਉਂਦਾ। ਇਹ ਬਹੁਤ ਜ਼ਰੂਰੀ ਕੰਮ ਸੀ, ਅਤੇ ਪਹਿਲਾਂ ਦੇ ਮੋਦੀਆਂ ਉੱਤੇ ਅਕਸਰ ਬੇਈਮਾਨੀ ਦੇ ਦੋਸ਼ ਲੱਗਦੇ ਸਨ।",
"ਨਾਨਕ ਨੇ ਆਪਣੇ ਮਿੱਤਰ ਭਾਈ ਮਰਦਾਨੇ ਨੂੰ ਵੀ ਕੋਲ ਸੱਦ ਲਿਆ। ਹਰ ਰੋਜ਼ ਉਹ ਸਵੇਰੇ ਜਲਦੀ ਉੱਠਦੇ, ਵੇਈਂ ਨਦੀ (ਕਾਲੀ ਵੇਈਂ) ਵਿੱਚ ਇਸ਼ਨਾਨ ਕਰਦੇ, ਰੱਬ ਦੀ ਸਿਫ਼ਤ ਗਾਉਂਦੇ, ਅਤੇ ਫਿਰ ਭੰਡਾਰ ਖੋਲ੍ਹਦੇ।",
"ਨਾਨਕ ਨੇ ਕਦੇ ਕਿਸੇ ਨਾਲ ਧੋਖਾ ਨਹੀਂ ਕੀਤਾ। ਜਦੋਂ ਕੋਈ ਅਨਾਜ ਖ਼ਰੀਦਦਾ, ਉਹ ਉਸ ਨੂੰ ਥੋੜ੍ਹਾ ਵੱਧ ਦਿੰਦੇ, ਕਦੇ ਘੱਟ ਨਹੀਂ। ਉਹ ਕਿਸਾਨਾਂ ਤੋਂ ਧੱਕੇ ਨਾਲ ਵੱਧ ਨਹੀਂ ਲੈਂਦੇ ਸਨ। ਜੇ ਕੋਈ ਗਰੀਬ ਜਾਂ ਸਾਧੂ ਲੋੜ ਵਿੱਚ ਆਉਂਦਾ, ਉਹ ਉਸ ਦੀ ਮਦਦ ਕਰਦੇ। ਫਿਰ ਵੀ ਹਰ ਮਹੀਨੇ ਜਦੋਂ ਹਿਸਾਬ ਜਾਂਚਿਆ ਜਾਂਦਾ, ਭੰਡਾਰ ਵਿੱਚ ਕਦੇ ਘਾਟਾ ਨਹੀਂ ਨਿਕਲਦਾ ਸੀ। ਹਰ ਕੋਈ ਮੋਦੀਖ਼ਾਨੇ ਤੋਂ ਖ਼ੁਸ਼ ਹੋ ਕੇ ਜਾਂਦਾ, ਅਤੇ ਨਵਾਬ ਨਾਨਕ ਦੀ ਈਮਾਨਦਾਰੀ ਤੋਂ ਬਹੁਤ ਖ਼ੁਸ਼ ਸੀ।",
"ਇੱਕ ਵਾਰ ਕਿਸੇ ਨੇ ਪੁੱਛਿਆ, \"ਨਾਨਕ, ਤੁਸੀਂ ਆਪਣੇ ਹੱਥੀਂ ਗਰੀਬਾਂ ਦੀਆਂ ਝੋਲੀਆਂ ਭਰਦੇ ਹੋ। ਫਿਰ ਭੰਡਾਰ ਵਿੱਚ ਕਦੇ ਘਾਟਾ ਕਿਉਂ ਨਹੀਂ ਪੈਂਦਾ?\" ਨਾਨਕ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, \"ਜਿਸ ਵਾਹਿਗੁਰੂ ਨੇ ਇਹ ਗਰੀਬ ਬਣਾਏ ਹਨ, ਉਸੇ ਨੇ ਮੈਨੂੰ ਇਹ ਕੰਮ ਦਿੱਤਾ ਹੈ। ਮੈਂ ਇਸ ਨੂੰ ਉਸ ਦਾ ਕੰਮ ਸਮਝ ਕੇ ਕਰਦਾ ਹਾਂ। ਫਿਰ ਘਾਟਾ ਕਿਵੇਂ ਪੈ ਸਕਦਾ ਹੈ?\""],
l:"ਖੁੱਲ੍ਹੇ ਦਿਲ ਨਾਲ ਕੀਤੀ ਈਮਾਨਦਾਰ ਕਿਰਤ ਵਿੱਚ ਬਰਕਤ ਹੁੰਦੀ ਹੈ। ਜਦੋਂ ਅਸੀਂ ਆਪਣੇ ਕੰਮ ਨੂੰ ਰੱਬ ਦੀ ਸੇਵਾ ਸਮਝਦੇ ਹਾਂ, ਤਾਂ ਕੋਈ ਘਾਟਾ ਨਹੀਂ ਪੈਂਦਾ।"};

PA["bhikhan-shah"]={t:[
"ਦਸੰਬਰ 1666 ਵਿੱਚ ਪਟਨੇ ਵਿਖੇ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਅਤੇ ਮਾਤਾ ਗੁਜਰੀ ਜੀ ਦੇ ਘਰ ਗੋਬਿੰਦ ਰਾਏ ਨਾਂ ਦੇ ਬਾਲਕ ਦਾ ਜਨਮ ਹੋਇਆ। ਉਸ ਵੇਲੇ ਪਿਤਾ ਜੀ ਇੱਕ ਲੰਮੀ ਯਾਤਰਾ ਉੱਤੇ ਸਨ, ਆਸਾਮ ਵਿੱਚ ਲੋਕਾਂ ਨੂੰ ਨਿਡਰ ਹੋ ਕੇ ਜੀਣਾ ਸਿਖਾ ਰਹੇ ਸਨ।",
"ਦੂਰ, ਪਟਿਆਲੇ ਦੇ ਨੇੜੇ ਪਿੰਡ ਘੁੜਾਮ ਵਿੱਚ, ਇੱਕ ਸਤਿਕਾਰਯੋਗ ਮੁਸਲਮਾਨ ਫ਼ਕੀਰ, ਪੀਰ ਭੀਖਣ ਸ਼ਾਹ ਰਹਿੰਦੇ ਸਨ। ਉਹ ਹਿੰਦੂਆਂ ਅਤੇ ਮੁਸਲਮਾਨਾਂ ਨੂੰ ਇੱਕੋ ਜਿਹਾ ਪਿਆਰ ਕਰਦੇ ਸਨ। ਜਦੋਂ ਉਨ੍ਹਾਂ ਨੇ ਬਾਲਕ ਦੇ ਜਨਮ ਬਾਰੇ ਸੁਣਿਆ, ਉਨ੍ਹਾਂ ਦੇ ਮਨ ਵਿੱਚ ਉਸ ਦੇ ਦਰਸ਼ਨ ਕਰਨ ਦੀ ਡੂੰਘੀ ਤਾਂਘ ਜਾਗੀ। ਕੁਝ ਮੁਰੀਦਾਂ ਨਾਲ ਉਹ ਪਟਨੇ ਵੱਲ ਤੁਰ ਪਏ। ਸਫ਼ਰ ਲੰਮਾ ਅਤੇ ਔਖਾ ਸੀ, ਅਤੇ ਪੂਰੇ ਦੋ ਮਹੀਨੇ ਲੱਗੇ।",
"ਪਟਨੇ ਪਹੁੰਚ ਕੇ, ਬਾਲਕ ਦੇ ਮਾਮਾ ਜੀ, ਕਿਰਪਾਲ ਚੰਦ ਜੀ, ਨੇ ਨਰਮੀ ਨਾਲ ਕਿਹਾ, \"ਪਿਤਾ ਜੀ ਦੇ ਦਰਸ਼ਨ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਕੋਈ ਬਾਲਕ ਨੂੰ ਨਹੀਂ ਵੇਖ ਸਕਦਾ।\" ਪਰ ਪੀਰ ਜੀ ਨੇ ਹਾਰ ਨਾ ਮੰਨੀ। ਉਹ ਬਿਨਾਂ ਕੁਝ ਖਾਧੇ ਸਬਰ ਨਾਲ ਦਰਵਾਜ਼ੇ ਦੇ ਬਾਹਰ ਬੈਠ ਗਏ। ਕੁਝ ਦਿਨਾਂ ਬਾਅਦ, ਕਿਰਪਾਲ ਚੰਦ ਜੀ ਉਨ੍ਹਾਂ ਦਾ ਪਿਆਰ ਵੇਖ ਕੇ ਪਿਘਲ ਗਏ ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਅੰਦਰ ਆਉਣ ਦਿੱਤਾ।",
"ਬਾਲ ਗੋਬਿੰਦ ਰਾਏ ਦੇ ਦਰਸ਼ਨ ਕਰਕੇ ਪੀਰ ਜੀ ਬਹੁਤ ਖ਼ੁਸ਼ ਹੋਏ। ਉਨ੍ਹਾਂ ਦੇ ਮਨ ਵਿੱਚ ਇੱਕ ਸਵਾਲ ਸੀ: ਜਦੋਂ ਇਹ ਬਾਲਕ ਵੱਡਾ ਹੋਵੇਗਾ, ਕੀ ਇਹ ਹਿੰਦੂਆਂ ਨੂੰ ਵੱਧ ਪਿਆਰ ਕਰੇਗਾ ਜਾਂ ਮੁਸਲਮਾਨਾਂ ਨੂੰ? ਉਨ੍ਹਾਂ ਨੇ ਬਾਲਕ ਦੇ ਅੱਗੇ ਮਿੱਟੀ ਦੀਆਂ ਦੋ ਛੋਟੀਆਂ ਕੁੱਜੀਆਂ ਰੱਖੀਆਂ। ਉਨ੍ਹਾਂ ਨੇ ਮਨ ਵਿੱਚ ਮਿੱਥਿਆ ਕਿ ਦੁੱਧ ਵਾਲੀ ਕੁੱਜੀ ਹਿੰਦੂਆਂ ਦੀ ਹੈ ਅਤੇ ਪਾਣੀ ਵਾਲੀ ਮੁਸਲਮਾਨਾਂ ਦੀ।",
"ਬਾਲ ਗੋਬਿੰਦ ਰਾਏ ਨੇ ਹੱਥ ਵਧਾਏ ਅਤੇ ਇੱਕੋ ਸਮੇਂ ਦੋਵਾਂ ਕੁੱਜੀਆਂ ਉੱਤੇ ਇੱਕ-ਇੱਕ ਨਿੱਕਾ ਹੱਥ ਰੱਖ ਦਿੱਤਾ। ਪੀਰ ਜੀ ਮੁਸਕਰਾ ਪਏ। ਉਹ ਸਮਝ ਗਏ ਕਿ ਇਹ ਬਾਲਕ ਸਭ ਨੂੰ ਬਰਾਬਰ ਪਿਆਰ ਅਤੇ ਸਤਿਕਾਰ ਦੇਵੇਗਾ।",
"ਕਿਹਾ ਜਾਂਦਾ ਹੈ ਕਿ ਫਿਰ ਪੀਰ ਜੀ ਨੇ ਤੀਜੀ ਕੁੱਜੀ ਰੱਖੀ, ਅਤੇ ਬਾਲਕ ਨੇ ਆਪਣਾ ਸੱਜਾ ਹੱਥ ਉਸ ਉੱਤੇ ਰੱਖ ਦਿੱਤਾ। ਪੀਰ ਜੀ ਨੇ ਇਸ ਨੂੰ ਨਿਸ਼ਾਨੀ ਸਮਝਿਆ ਕਿ ਇਹ ਬਾਲਕ ਇੱਕ ਦਿਨ ਆਪਣਾ ਨਵਾਂ ਰਾਹ ਵਿਖਾਵੇਗਾ। ਖ਼ੁਸ਼ ਅਤੇ ਸ਼ਾਂਤ ਹੋ ਕੇ ਪੀਰ ਭੀਖਣ ਸ਼ਾਹ ਘਰ ਮੁੜ ਆਏ। ਕਈ ਸਾਲਾਂ ਬਾਅਦ, ਅਨੰਦਪੁਰ ਜਾਂਦਿਆਂ, ਗੋਬਿੰਦ ਰਾਏ ਜੀ ਉਨ੍ਹਾਂ ਨੂੰ ਮਿਲਣ ਘੁੜਾਮ ਰੁਕੇ।"],
l:"ਗੁਰੂ ਦਾ ਪਿਆਰ ਸਭ ਲਈ ਹੈ, ਭਾਵੇਂ ਕਿਸੇ ਦਾ ਵੀ ਧਰਮ ਹੋਵੇ। ਸੱਚੇ ਸੰਤ ਹਰ ਇੱਕ ਵਿੱਚ ਇੱਕੋ ਜੋਤ ਵੇਖਦੇ ਹਨ।"};

PA["uncommon-games"]={t:[
"ਗੋਬਿੰਦ ਰਾਏ ਅਜੇ ਪੰਜ ਸਾਲ ਦੇ ਵੀ ਨਹੀਂ ਸਨ ਜਦੋਂ ਉਨ੍ਹਾਂ ਨੇ ਸ਼ਸਤਰਾਂ ਦਾ ਅਭਿਆਸ ਸ਼ੁਰੂ ਕਰ ਦਿੱਤਾ। ਆਪਣੀ ਗੁਲੇਲ ਨਾਲ ਉਹ ਖੂਹ ਤੋਂ ਪਾਣੀ ਲੈ ਕੇ ਜਾਂਦੀਆਂ ਔਰਤਾਂ ਦੇ ਮਿੱਟੀ ਦੇ ਘੜਿਆਂ ਨੂੰ ਨਿਸ਼ਾਨਾ ਬਣਾਉਂਦੇ ਅਤੇ ਤੋੜ ਦਿੰਦੇ! ਔਰਤਾਂ ਨੇ ਮਾਤਾ ਗੁਜਰੀ ਜੀ ਕੋਲ ਸ਼ਿਕਾਇਤ ਕੀਤੀ, ਅਤੇ ਮਾਤਾ ਜੀ ਨੇ ਪਿਆਰ ਨਾਲ ਉਨ੍ਹਾਂ ਨੂੰ ਪਿੱਤਲ ਦੇ ਘੜੇ ਲੈ ਦਿੱਤੇ ਜੋ ਟੁੱਟਦੇ ਨਹੀਂ ਸਨ।",
"ਫਿਰ ਗੋਬਿੰਦ ਰਾਏ ਨੇ ਮਾਮਾ ਕਿਰਪਾਲ ਚੰਦ ਜੀ ਤੋਂ ਛੋਟੀ ਕਮਾਨ ਅਤੇ ਲੋਹੇ ਦੀ ਨੋਕ ਵਾਲੇ ਤੀਰ ਮੰਗੇ। ਛੇਤੀ ਹੀ ਉਨ੍ਹਾਂ ਦੇ ਤੀਰ ਪਿੱਤਲ ਦੇ ਘੜਿਆਂ ਵਿੱਚ ਵੀ ਮੋਰੀਆਂ ਕਰਨ ਲੱਗੇ! ਔਰਤਾਂ ਨੇ ਫਿਰ ਸ਼ਿਕਾਇਤ ਕੀਤੀ। ਸ਼ਿਕਾਇਤਾਂ ਤੋਂ ਥੱਕ ਕੇ ਮਾਤਾ ਗੁਜਰੀ ਜੀ ਨੇ ਕਿਹਾ, \"ਚੰਗਾ ਹੋਵੇ ਜੇ ਇਸ ਖੂਹ ਦਾ ਪਾਣੀ ਖਾਰਾ ਹੋ ਜਾਵੇ।\" ਲੋਕ ਕਹਿੰਦੇ ਹਨ ਕਿ ਉਨ੍ਹਾਂ ਦੇ ਬਚਨ ਸੱਚ ਹੋ ਗਏ। ਪਾਣੀ ਖਾਰਾ ਹੋ ਗਿਆ, ਰੋਟੀ-ਪਾਣੀ ਲਈ ਵਰਤਣ ਜੋਗਾ ਨਾ ਰਿਹਾ, ਅਤੇ ਕਹਿੰਦੇ ਹਨ ਅੱਜ ਵੀ ਖਾਰਾ ਹੈ।",
"ਗੰਗਾ ਨਦੀ ਦੇ ਕੰਢੇ ਗੋਬਿੰਦ ਰਾਏ ਆਪਣੀ ਉਮਰ ਦੇ ਬੱਚਿਆਂ ਨੂੰ ਇਕੱਠਾ ਕਰਦੇ। ਉਹ ਉਨ੍ਹਾਂ ਨੂੰ ਦੋ ਟੋਲੀਆਂ ਵਿੱਚ ਵੰਡਦੇ ਅਤੇ ਹਮਲਾ ਕਰਨਾ ਅਤੇ ਆਪਣਾ ਬਚਾਅ ਕਰਨਾ ਸਿਖਾਉਂਦੇ। ਇਹ ਖੇਡ-ਲੜਾਈਆਂ ਹੁੰਦੀਆਂ ਸਨ, ਅਤੇ ਜਿੱਤਣ ਵਾਲੀ ਟੋਲੀ ਨੂੰ ਮਾਤਾ ਜੀ ਇਨਾਮ ਦਿੰਦੇ। ਪਟਨੇ ਦੇ ਲੋਕ ਇਸ ਨੂੰ \"ਬਾਲ ਫ਼ੌਜ\" ਕਹਿੰਦੇ ਸਨ।",
"ਬਾਅਦ ਵਿੱਚ ਅਨੰਦਪੁਰ ਸਾਹਿਬ ਵਿਖੇ ਭਾਈ ਬੱਜਰ ਸਿੰਘ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਘੋੜਸਵਾਰੀ ਅਤੇ ਸ਼ਸਤਰਾਂ ਦੀ ਸਹੀ ਵਰਤੋਂ ਸਿਖਾਈ। ਜਦੋਂ ਗੋਬਿੰਦ ਰਾਏ ਸਿਰਫ਼ ਨੌਂ ਸਾਲ ਦੇ ਸਨ, ਪਿਤਾ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਸ਼ਹੀਦ ਹੋ ਗਏ, ਅਤੇ ਗੋਬਿੰਦ ਰਾਏ ਦਸਵੇਂ ਗੁਰੂ ਬਣੇ।",
"ਜਦੋਂ ਗੁਰੂ ਜੀ ਸੋਲਾਂ ਸਾਲ ਦੇ ਸਨ, ਉਨ੍ਹਾਂ ਨੇ ਇੱਕ ਵੱਡਾ ਨਗਾਰਾ ਬਣਵਾਇਆ, ਜਿਸ ਦਾ ਨਾਂ ਰਣਜੀਤ ਨਗਾਰਾ, ਭਾਵ ਜਿੱਤ ਦਾ ਨਗਾਰਾ, ਰੱਖਿਆ। ਇਹ ਹਰ ਸਵੇਰ ਅਤੇ ਸ਼ਾਮ ਦੀਵਾਨ ਤੋਂ ਪਹਿਲਾਂ ਵਜਾਇਆ ਜਾਂਦਾ। ਉਨ੍ਹਾਂ ਦਿਨਾਂ ਵਿੱਚ ਸਿਰਫ਼ ਰਾਜੇ ਹੀ ਨਗਾਰੇ ਨਾਲ ਨਿਕਲ ਸਕਦੇ ਸਨ। ਗੁਰੂ ਜੀ ਦੇ ਨਗਾਰੇ ਨੇ ਸਭ ਨੂੰ ਦੱਸ ਦਿੱਤਾ ਕਿ ਆਮ ਲੋਕ ਵੀ ਰਾਜਿਆਂ ਜਿੰਨੀ ਇੱਜ਼ਤ ਦੇ ਹੱਕਦਾਰ ਹਨ।",
"ਅਨੰਦਪੁਰ ਆਉਣ ਵਾਲੇ ਸਿੱਖ ਘਰ ਜਾਣ ਤੋਂ ਪਹਿਲਾਂ ਘੋੜਸਵਾਰੀ ਅਤੇ ਆਤਮ-ਰੱਖਿਆ ਸਿੱਖਦੇ, ਅਤੇ ਫਿਰ ਹੋਰਨਾਂ ਨੂੰ ਸਿਖਾਉਂਦੇ। ਗੁਰੂ ਜੀ ਨੇ ਪਾਉਂਟਾ ਸਾਹਿਬ ਵਿੱਚ ਇੱਕ ਕਿਲ੍ਹਾ ਅਤੇ ਬਾਅਦ ਵਿੱਚ ਅਨੰਦਪੁਰ ਦੁਆਲੇ ਪੰਜ ਕਿਲ੍ਹੇ ਬਣਾਏ, ਤਾਂ ਜੋ ਲੋਕ ਜ਼ੁਲਮ ਤੋਂ ਆਪਣਾ ਬਚਾਅ ਕਰ ਸਕਣ।"],
l:"ਤਾਕਤ ਅਤੇ ਬਹਾਦਰੀ ਇੱਕ ਦਾਤ ਹੈ ਜੋ ਦੂਜਿਆਂ ਦੀ ਰੱਖਿਆ ਲਈ ਵਰਤਣੀ ਹੈ, ਕਦੇ ਵੀ ਬੇਕਸੂਰਾਂ ਨੂੰ ਦੁੱਖ ਦੇਣ ਲਈ ਨਹੀਂ।"};

PA["rani-maini"]={t:[
"ਪਟਨੇ ਵਿੱਚ ਇੱਕ ਅਮੀਰ ਜ਼ਿਮੀਂਦਾਰ, ਫ਼ਤਿਹ ਚੰਦ ਮੈਣੀ, ਰਹਿੰਦਾ ਸੀ ਜਿਸ ਨੂੰ ਲੋਕ ਰਾਜਾ ਕਹਿੰਦੇ ਸਨ। ਉਸ ਦੀ ਪਤਨੀ ਨੂੰ ਰਾਣੀ ਮੈਣੀ ਕਿਹਾ ਜਾਂਦਾ ਸੀ। ਉਨ੍ਹਾਂ ਕੋਲ ਸਭ ਕੁਝ ਸੀ, ਸਿਵਾਏ ਉਸ ਇੱਕ ਚੀਜ਼ ਦੇ ਜਿਸ ਦੀ ਉਨ੍ਹਾਂ ਨੂੰ ਸਭ ਤੋਂ ਵੱਧ ਤਾਂਘ ਸੀ: ਇੱਕ ਬੱਚਾ। ਉਨ੍ਹਾਂ ਨੇ ਅਰਦਾਸਾਂ ਕੀਤੀਆਂ ਅਤੇ ਬਹੁਤ ਯਤਨ ਕੀਤੇ, ਪਰ ਘਰ ਬੱਚਾ ਨਾ ਆਇਆ।",
"ਹਰ ਰੋਜ਼ ਰਾਣੀ ਮੈਣੀ ਬਾਲ ਗੋਬਿੰਦ ਰਾਏ ਅਤੇ ਉਨ੍ਹਾਂ ਦੀ \"ਬਾਲ ਫ਼ੌਜ\" ਨੂੰ ਆਪਣੇ ਮਹਿਲ ਅੱਗੋਂ ਲੰਘਦਿਆਂ ਵੇਖਦੀ। ਹਰ ਵਾਰ ਉਸ ਦੇ ਮਨ ਵਿੱਚ ਬੱਚੇ ਦੀ ਤਾਂਘ ਹੋਰ ਵਧ ਜਾਂਦੀ।",
"ਇੱਕ ਦਿਨ ਉਹ ਸੋਚਾਂ ਵਿੱਚ ਗੁਆਚੀ ਬੈਠੀ ਸੀ। \"ਕਿੰਨਾ ਚੰਗਾ ਹੋਵੇ,\" ਉਸ ਨੇ ਸੋਚਿਆ, \"ਜੇ ਗੋਬਿੰਦ ਰਾਏ ਮੇਰੀ ਗੋਦੀ ਵਿੱਚ ਬੈਠੇ, ਮੈਨੂੰ ਮਾਂ ਕਹੇ, ਅਤੇ ਬੋਲੇ, 'ਮੈਨੂੰ ਭੁੱਖ ਲੱਗੀ ਹੈ! ਮੈਨੂੰ ਅਤੇ ਮੇਰੇ ਮਿੱਤਰਾਂ ਨੂੰ ਉਹ ਛੋਲੇ-ਪੂਰੀਆਂ ਦਿਓ ਜੋ ਤੁਸੀਂ ਬਣਾਈਆਂ ਹਨ।'\" ਇਸ ਇੱਛਾ ਨਾਲ ਉਹ ਉੱਠੀ ਅਤੇ ਬਹੁਤ ਸਾਰੇ ਛੋਲੇ-ਪੂਰੀਆਂ ਬਣਾਈਆਂ।",
"ਉਸ ਨੇ ਸੁਣਿਆ ਸੀ ਕਿ ਬਾਲ ਗੋਬਿੰਦ ਰਾਏ ਲੋਕਾਂ ਦੇ ਮਨ ਦੀ ਗੱਲ ਜਾਣ ਲੈਂਦੇ ਹਨ। ਉਹ ਆਪਣੇ ਵਿਹੜੇ ਵਿੱਚ ਬੈਠ ਕੇ ਉਡੀਕਣ ਲੱਗੀ। ਛੇਤੀ ਹੀ ਬਾਲ ਫ਼ੌਜ ਆ ਪਹੁੰਚੀ, ਅਤੇ ਉਨ੍ਹਾਂ ਦਾ ਨਿੱਕਾ ਆਗੂ ਭੱਜ ਕੇ ਅੰਦਰ ਆਇਆ ਅਤੇ ਬੋਲਿਆ, \"ਮਾਂ, ਉਹ ਛੋਲੇ-ਪੂਰੀਆਂ ਲਿਆਓ ਜੋ ਤੁਸੀਂ ਬਣਾਈਆਂ ਹਨ। ਮੈਨੂੰ ਅਤੇ ਮੇਰੇ ਮਿੱਤਰਾਂ ਨੂੰ ਬਹੁਤ ਭੁੱਖ ਲੱਗੀ ਹੈ!\"",
"ਰਾਣੀ ਮੈਣੀ ਦੀਆਂ ਅੱਖਾਂ ਖ਼ੁਸ਼ੀ ਦੇ ਹੰਝੂਆਂ ਨਾਲ ਭਰ ਗਈਆਂ। ਉਸ ਨੇ ਗੋਬਿੰਦ ਰਾਏ ਨੂੰ ਗੋਦੀ ਵਿੱਚ ਬਿਠਾਇਆ ਅਤੇ ਆਪਣੇ ਹੱਥੀਂ ਖਵਾਇਆ, ਅਤੇ ਉਨ੍ਹਾਂ ਦੇ ਸਾਰੇ ਮਿੱਤਰਾਂ ਨੂੰ ਵੀ। ਉਸ ਦਿਨ ਤੋਂ ਉਹ ਹਰ ਰੋਜ਼ ਬਾਲ ਫ਼ੌਜ ਲਈ ਭੋਜਨ ਬਣਾਉਣ ਲੱਗੀ।",
"ਇੱਕ ਦਿਨ ਉਸ ਦੀ ਦਾਸੀ ਨੇ ਗੋਬਿੰਦ ਰਾਏ ਨੂੰ ਬੇਨਤੀ ਕੀਤੀ ਕਿ ਰਾਣੀ ਨੂੰ ਆਪਣੇ ਵਰਗੇ ਪੁੱਤਰ ਦੀ ਬਖ਼ਸ਼ਿਸ਼ ਕਰਨ। ਉਨ੍ਹਾਂ ਨੇ ਮੁਸਕਰਾ ਕੇ ਕਿਹਾ, \"ਮੇਰੇ ਵਰਗਾ ਹੋਰ ਕੋਈ ਨਹੀਂ। ਪਰ ਜੇ ਰਾਣੀ ਮੈਨੂੰ ਆਪਣਾ ਪੁੱਤਰ ਸਮਝੇ, ਤਾਂ ਮੈਂ ਉਸ ਦਾ ਪੁੱਤਰ ਹਾਂ।\" ਰਾਣੀ ਦਾ ਪਿਆਰ ਹੋਰ ਵੀ ਵਧ ਗਿਆ।",
"ਗੋਬਿੰਦ ਰਾਏ ਦੇ ਪਟਨਾ ਛੱਡਣ ਤੋਂ ਬਾਅਦ, ਰਾਣੀ ਮੈਣੀ ਨੇ ਆਪਣੇ ਘਰ ਦੇ ਇੱਕ ਹਿੱਸੇ ਨੂੰ ਗੁਰਦੁਆਰਾ ਬਣਾ ਦਿੱਤਾ, ਜਿੱਥੇ ਉਹ ਬੱਚਿਆਂ ਨੂੰ ਛੋਲੇ-ਪੂਰੀਆਂ ਛਕਾਉਂਦੀ ਰਹੀ। ਇਸ ਨੂੰ ਗੁਰਦੁਆਰਾ ਮੈਣੀ ਸੰਗਤ ਜਾਂ ਬਾਲ ਲੀਲਾ ਕਹਿੰਦੇ ਹਨ, ਅਤੇ ਉੱਥੇ ਅੱਜ ਵੀ ਪ੍ਰਸ਼ਾਦ ਵਜੋਂ ਛੋਲੇ-ਪੂਰੀਆਂ ਵਰਤਾਈਆਂ ਜਾਂਦੀਆਂ ਹਨ।"],
l:"ਸੇਵਾ ਰਾਹੀਂ ਵੰਡਿਆ ਪਿਆਰ ਸਾਨੂੰ ਗੁਰੂ ਦੇ ਨੇੜੇ ਲੈ ਜਾਂਦਾ ਹੈ। ਪਿਆਰ ਨਾਲ ਦੂਜਿਆਂ ਨੂੰ ਭੋਜਨ ਛਕਾਉਣਾ ਵੀ ਇੱਕ ਅਰਦਾਸ ਹੈ।"};

PA["mata-jamuna"]={t:[
"ਦਾਨਾਪੁਰ ਪਿੰਡ ਵਿੱਚ ਇੱਕ ਗਰੀਬ ਬਜ਼ੁਰਗ ਮਾਈ ਰਹਿੰਦੀ ਸੀ, ਜਿਸ ਨੂੰ ਮਾਈ ਜਮਨਾ ਕਹਿੰਦੇ ਸਨ। ਇੱਕ ਦਿਨ ਪਿੰਡ ਵਿੱਚ ਇੱਕ ਮਸੰਦ ਆਇਆ, ਜਿਸ ਨੂੰ ਗੁਰੂ ਕੇ ਲੰਗਰ ਲਈ ਭੇਟਾ ਇਕੱਠੀ ਕਰਨ ਭੇਜਿਆ ਗਿਆ ਸੀ। ਮਾਈ ਜਮਨਾ ਮੁੱਠੀ ਕੁ ਦਾਲ ਅਤੇ ਚੌਲ ਲੈ ਕੇ ਅੱਗੇ ਆਈ।",
"ਮਸੰਦ ਨੇ ਵੇਖ ਕੇ ਮੱਥੇ ਵੱਟ ਪਾਏ। \"ਇੰਨੇ ਕੁ ਨਾਲ ਮੇਰਾ ਥੈਲਾ ਨਹੀਂ ਭਰਨਾ,\" ਉਸ ਨੇ ਕਿਹਾ, ਅਤੇ ਉਸ ਨੂੰ ਰੁੱਖੇਪਣ ਨਾਲ ਮੋੜ ਦਿੱਤਾ। ਉਹ ਉਨ੍ਹਾਂ ਲਾਲਚੀ ਮਸੰਦਾਂ ਵਿੱਚੋਂ ਸੀ ਜੋ ਭੇਟਾ ਦਾ ਬਹੁਤ ਹਿੱਸਾ ਆਪ ਰੱਖ ਲੈਂਦੇ ਸਨ।",
"ਮਾਈ ਜਮਨਾ ਉਦਾਸ ਹੋ ਕੇ ਘਰ ਗਈ, ਪਰ ਨਿਰਾਸ਼ ਨਹੀਂ ਹੋਈ। ਉਸ ਨੂੰ ਵਿਸ਼ਵਾਸ ਸੀ ਕਿ ਗੁਰੂ ਉਸ ਦੇ ਮਨ ਦੀ ਗੱਲ ਸੁਣ ਸਕਦੇ ਹਨ। \"ਇੱਕ ਦਿਨ ਗੁਰੂ ਜੀ ਆਪ ਆਉਣਗੇ ਅਤੇ ਮੇਰੇ ਤੋਂ ਖਿਚੜੀ ਮੰਗਣਗੇ,\" ਉਸ ਨੇ ਆਪਣੇ ਆਪ ਨੂੰ ਕਿਹਾ, \"ਅਤੇ ਮੈਂ ਆਪਣੇ ਹੱਥੀਂ ਉਨ੍ਹਾਂ ਲਈ ਬਣਾਵਾਂਗੀ।\" ਉਸ ਦਿਨ ਤੋਂ ਉਹ ਜਿੰਨੀ ਹੋ ਸਕਦੀ, ਥੋੜ੍ਹੀ-ਥੋੜ੍ਹੀ ਦਾਲ ਅਤੇ ਚੌਲ ਸਾਂਭਣ ਲੱਗੀ।",
"1671 ਵਿੱਚ ਬਾਲ ਗੋਬਿੰਦ ਰਾਏ ਪਟਨੇ ਤੋਂ ਅਨੰਦਪੁਰ ਜਾਂਦਿਆਂ ਦਾਨਾਪੁਰ ਰੁਕੇ। ਜਦੋਂ ਮਾਈ ਜਮਨਾ ਨੇ ਸੁਣਿਆ, ਉਸ ਦਾ ਦਿਲ ਖ਼ੁਸ਼ੀ ਨਾਲ ਭਰ ਗਿਆ। ਉਸ ਨੇ ਬੜੇ ਪਿਆਰ ਨਾਲ ਆਪਣੀ ਮਿੱਟੀ ਦੀ ਹਾਂਡੀ ਵਿੱਚ ਖਿਚੜੀ ਬਣਾਈ ਅਤੇ ਅਰਦਾਸ ਕੀਤੀ ਕਿ ਉਹ ਆਉਣ।",
"ਛੇਤੀ ਹੀ ਉਹ ਉਸ ਦੇ ਦਰ ਉੱਤੇ ਖੜ੍ਹੇ ਸਨ! \"ਮਾਂ ਜੀ,\" ਉਨ੍ਹਾਂ ਕਿਹਾ, \"ਉਹ ਖਿਚੜੀ ਲਿਆਓ ਜੋ ਤੁਸੀਂ ਮੇਰੇ ਲਈ ਬਣਾਈ ਹੈ।\" ਮਾਈ ਜਮਨਾ ਬਹੁਤ ਖ਼ੁਸ਼ ਹੋਈ। ਉਸ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਅਤੇ ਨਾਲ ਆਏ ਸਿੱਖਾਂ ਨੂੰ ਉਦੋਂ ਤੱਕ ਛਕਾਇਆ ਜਦੋਂ ਤੱਕ ਸਭ ਰੱਜ ਨਾ ਗਏ।",
"ਜਦੋਂ ਉਹ ਜਾਣ ਲਈ ਉੱਠੇ, ਮਾਈ ਨੇ ਬੇਨਤੀ ਕੀਤੀ ਕਿ ਸਦਾ ਲਈ ਇੱਥੇ ਹੀ ਰਹਿ ਜਾਓ। ਗੋਬਿੰਦ ਰਾਏ ਨੇ ਕਿਹਾ, \"ਮਾਂ ਜੀ, ਮੈਂ ਸਦਾ ਤੁਹਾਡੇ ਨਾਲ ਹਾਂ। ਜਦੋਂ ਵੀ ਮੇਰੇ ਦਰਸ਼ਨ ਕਰਨੇ ਹੋਣ, ਇਸ ਹਾਂਡੀ ਵਿੱਚ ਖਿਚੜੀ ਬਣਾ ਕੇ ਗਰੀਬਾਂ ਅਤੇ ਭੁੱਖਿਆਂ ਨੂੰ ਛਕਾਉਣਾ। ਤੁਸੀਂ ਮੈਨੂੰ ਉੱਥੇ ਹੀ ਪਾਓਗੇ।\" ਉਸ ਨੇ ਸਾਰੀ ਉਮਰ ਇਸੇ ਤਰ੍ਹਾਂ ਕੀਤਾ। ਉਸ ਦੀ ਮਿੱਟੀ ਦੀ ਹਾਂਡੀ ਅੱਜ ਵੀ ਦਾਨਾਪੁਰ ਦੇ ਗੁਰਦੁਆਰਾ ਹਾਂਡੀ ਸਾਹਿਬ ਵਿੱਚ ਸਾਂਭੀ ਹੋਈ ਹੈ।"],
l:"ਪਿਆਰ ਨਾਲ ਦਿੱਤੀ ਕੋਈ ਵੀ ਭੇਟਾ ਛੋਟੀ ਨਹੀਂ ਹੁੰਦੀ। ਗੁਰੂ ਲੋੜਵੰਦਾਂ ਦੀ ਸੇਵਾ ਵਿੱਚ ਮਿਲਦਾ ਹੈ।"};

PA["defender-of-faith"]={t:[
"ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨੇ ਸਿੱਖਾਂ ਨੂੰ ਸਿਖਾਇਆ ਕਿ ਜ਼ੁਲਮ ਨੂੰ ਕਦੇ ਚੁੱਪ-ਚਾਪ ਨਾ ਸਹੋ, ਸਗੋਂ ਹੌਸਲੇ ਨਾਲ ਉਸ ਦੇ ਵਿਰੁੱਧ ਖੜ੍ਹੇ ਹੋਵੋ, ਭਾਵੇਂ ਇਸ ਲਈ ਵੱਡੀ ਕੁਰਬਾਨੀ ਦੇਣੀ ਪਵੇ। ਇਹ ਉਨ੍ਹਾਂ ਨੇ ਆਪਣੇ ਪਿਤਾ ਤੋਂ ਸਿੱਖਿਆ ਸੀ।",
"1674 ਵਿੱਚ ਕਸ਼ਮੀਰ ਦੇ ਸੂਬੇਦਾਰ ਨੇ, ਮੁਗ਼ਲ ਬਾਦਸ਼ਾਹ ਔਰੰਗਜ਼ੇਬ ਦੇ ਹੁਕਮ ਉੱਤੇ, ਹਿੰਦੂਆਂ ਦਾ ਧੱਕੇ ਨਾਲ ਧਰਮ ਬਦਲਣਾ ਸ਼ੁਰੂ ਕਰ ਦਿੱਤਾ। ਜੋ ਨਾਂਹ ਕਰਦੇ, ਉਨ੍ਹਾਂ ਨੂੰ ਸਖ਼ਤ ਸਜ਼ਾਵਾਂ ਦਿੱਤੀਆਂ ਜਾਂਦੀਆਂ। ਡਰੇ ਹੋਏ ਅਤੇ ਬੇਸਹਾਰਾ, ਕਸ਼ਮੀਰੀ ਪੰਡਿਤਾਂ ਦਾ ਇੱਕ ਜਥਾ ਪੰਡਿਤ ਕਿਰਪਾ ਰਾਮ ਦੀ ਅਗਵਾਈ ਵਿੱਚ ਅਨੰਦਪੁਰ ਸਾਹਿਬ ਪਹੁੰਚਿਆ। ਉਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਅੱਗੇ ਮਦਦ ਦੀ ਬੇਨਤੀ ਕੀਤੀ।",
"ਗੁਰੂ ਜੀ ਨੇ ਸੁਣਿਆ ਅਤੇ ਡੂੰਘੀ ਸੋਚ ਵਿੱਚ ਪੈ ਗਏ। ਫਿਰ ਉਨ੍ਹਾਂ ਕਿਹਾ, \"ਇਹ ਜ਼ੁਲਮ ਤਾਂ ਹੀ ਰੁਕ ਸਕਦਾ ਹੈ ਜੇ ਕੋਈ ਮਹਾਨ ਅਤੇ ਪਵਿੱਤਰ ਪੁਰਖ ਦੂਜਿਆਂ ਦੀ ਆਜ਼ਾਦੀ ਲਈ ਆਪਣੀ ਜਾਨ ਦੇਣ ਨੂੰ ਤਿਆਰ ਹੋਵੇ।\" ਦਰਬਾਰ ਵਿੱਚ ਚੁੱਪ ਛਾ ਗਈ। ਕੋਈ ਨਾ ਬੋਲਿਆ।",
"ਨੌਂ ਸਾਲ ਦੇ ਗੋਬਿੰਦ ਰਾਏ ਉੱਥੇ ਬੈਠੇ ਸਨ। ਉਨ੍ਹਾਂ ਨੇ ਉੱਪਰ ਵੇਖ ਕੇ ਕਿਹਾ, \"ਪਿਤਾ ਜੀ, ਤੁਹਾਡੇ ਤੋਂ ਵੱਡਾ ਕੌਣ ਹੋ ਸਕਦਾ ਹੈ? ਤੁਸੀਂ ਆਮ ਲੋਕਾਂ ਦਾ ਦੁੱਖ ਆਪਣੇ ਦਿਲ ਵਿੱਚ ਮਹਿਸੂਸ ਕਰਦੇ ਹੋ।\"",
"ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਪ੍ਰਸੰਨ ਹੋਏ। ਉਹ ਜਾਣ ਗਏ ਕਿ ਉਨ੍ਹਾਂ ਦਾ ਪੁੱਤਰ ਇੱਕ ਦਿਨ ਸਿੱਖਾਂ ਦੀ ਅਗਵਾਈ ਕਰਨ ਲਈ ਤਿਆਰ ਹੈ। ਉਨ੍ਹਾਂ ਨੇ ਪੰਡਿਤਾਂ ਨੂੰ ਕਿਹਾ, \"ਜਾਓ ਅਤੇ ਸੂਬੇਦਾਰ ਨੂੰ ਕਹੋ: ਜੇ ਉਹ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਦਾ ਧਰਮ ਬਦਲ ਸਕਦਾ ਹੈ, ਤਾਂ ਅਸੀਂ ਸਾਰੇ ਵੀ ਬਦਲ ਲਵਾਂਗੇ।\"",
"ਗੁਰੂ ਜੀ ਦਿੱਲੀ ਵੱਲ ਤੁਰ ਪਏ ਅਤੇ ਰਸਤੇ ਵਿੱਚ ਗ੍ਰਿਫ਼ਤਾਰ ਕਰ ਲਏ ਗਏ। ਦਿੱਲੀ ਵਿੱਚ ਉਨ੍ਹਾਂ ਨੂੰ ਆਪਣਾ ਧਰਮ ਛੱਡਣ ਲਈ ਕਿਹਾ ਗਿਆ। ਉਨ੍ਹਾਂ ਨੇ ਇਨਕਾਰ ਕਰ ਦਿੱਤਾ। ਉਨ੍ਹਾਂ ਨੂੰ ਡਰਾਉਣ ਲਈ, ਉਨ੍ਹਾਂ ਦੇ ਤਿੰਨ ਸਾਥੀਆਂ, ਭਾਈ ਮਤੀ ਦਾਸ ਜੀ, ਭਾਈ ਸਤੀ ਦਾਸ ਜੀ ਅਤੇ ਭਾਈ ਦਿਆਲਾ ਜੀ, ਨੂੰ ਉਨ੍ਹਾਂ ਦੀਆਂ ਅੱਖਾਂ ਸਾਹਮਣੇ ਸ਼ਹੀਦ ਕਰ ਦਿੱਤਾ ਗਿਆ। ਫਿਰ ਵੀ ਗੁਰੂ ਜੀ ਸ਼ਾਂਤ ਅਤੇ ਅਡੋਲ ਰਹੇ।",
"ਨਵੰਬਰ 1675 ਵਿੱਚ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਨੇ ਦਿੱਲੀ ਦੇ ਚਾਂਦਨੀ ਚੌਂਕ ਵਿੱਚ ਸ਼ਹੀਦੀ ਦਿੱਤੀ, ਜਿੱਥੇ ਅੱਜ ਗੁਰਦੁਆਰਾ ਸੀਸ ਗੰਜ ਸਾਹਿਬ ਹੈ। ਉਨ੍ਹਾਂ ਨੇ ਆਪਣੇ ਧਰਮ ਲਈ ਨਹੀਂ, ਸਗੋਂ ਦੂਜਿਆਂ ਦੇ ਆਪਣੇ ਧਰਮ ਉੱਤੇ ਚੱਲਣ ਦੇ ਹੱਕ ਲਈ ਜਾਨ ਦਿੱਤੀ। ਇਸੇ ਲਈ ਉਨ੍ਹਾਂ ਨੂੰ ਪਿਆਰ ਨਾਲ ਹਿੰਦ ਦੀ ਚਾਦਰ ਕਿਹਾ ਜਾਂਦਾ ਹੈ।"],
l:"ਹਰ ਇੱਕ ਨੂੰ ਆਜ਼ਾਦੀ ਨਾਲ ਆਪਣਾ ਵਿਸ਼ਵਾਸ ਰੱਖਣ ਦਾ ਹੱਕ ਹੈ। ਦੂਜਿਆਂ ਲਈ ਖੜ੍ਹਨਾ, ਭਾਵੇਂ ਉਹ ਸਾਡੇ ਤੋਂ ਵੱਖਰੇ ਹੋਣ, ਸੱਚੀ ਬਹਾਦਰੀ ਹੈ।"};

PA["ship-of-bani"]={t:[
"ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਦਾ ਜਨਮ 1563 ਵਿੱਚ ਗੋਇੰਦਵਾਲ ਵਿਖੇ ਹੋਇਆ। ਉਨ੍ਹਾਂ ਦੇ ਮਾਤਾ, ਬੀਬੀ ਭਾਨੀ ਜੀ, ਤੀਜੇ ਗੁਰੂ, ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਦੀ ਸਪੁੱਤਰੀ ਸਨ, ਅਤੇ ਪਿਤਾ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਸਨ, ਜੋ ਬਾਅਦ ਵਿੱਚ ਚੌਥੇ ਗੁਰੂ ਬਣੇ। ਮਾਤਾ-ਪਿਤਾ ਸਾਰਾ ਦਿਨ ਗੁਰੂ ਘਰ ਵਿੱਚ ਸੇਵਾ ਕਰਦੇ, ਇਸ ਲਈ ਬਾਲ ਅਰਜਨ ਉੱਥੇ ਹੀ ਖੇਡਦੇ, ਗੁਰਬਾਣੀ ਸੁਣਦੇ, ਅਤੇ ਨਾਨਾ ਜੀ ਦਾ ਪਿਆਰ ਮਾਣਦੇ ਵੱਡੇ ਹੋਏ।",
"ਇੱਕ ਦਿਨ ਬਾਲ ਅਰਜਨ ਰਿੜ੍ਹਦੇ-ਰਿੜ੍ਹਦੇ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਦੇ ਪਲੰਘ ਕੋਲ ਆਏ ਅਤੇ ਉਸ ਉੱਤੇ ਚੜ੍ਹਨ ਦੀ ਕੋਸ਼ਿਸ਼ ਕਰਨ ਲੱਗੇ। ਨਾਨਾ ਜੀ ਨੇ ਮੁਸਕਰਾ ਕੇ ਕਿਹਾ, \"ਇਹ ਗੱਦੀ ਤੈਨੂੰ ਇੱਕ ਦਿਨ ਮਿਲੇਗੀ, ਪਰ ਤੇਰੇ ਪਿਤਾ ਰਾਹੀਂ ਮਿਲੇਗੀ। ਉਦੋਂ ਤੱਕ ਉਡੀਕ ਕਰਨੀ ਪਵੇਗੀ।\" ਉਸ ਤੋਂ ਬਾਅਦ ਬੀਬੀ ਭਾਨੀ ਜੀ ਉਨ੍ਹਾਂ ਦਾ ਹੋਰ ਧਿਆਨ ਰੱਖਣ ਲੱਗੇ, ਤਾਂ ਜੋ ਉਹ ਨਾਨਾ ਜੀ ਨੂੰ ਤੰਗ ਨਾ ਕਰਨ।",
"ਪਰ ਇੱਕ ਦੁਪਹਿਰ, ਜਦੋਂ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਆਰਾਮ ਕਰ ਰਹੇ ਸਨ, ਅਰਜਨ ਦੀ ਗੇਂਦ ਰਿੜ੍ਹ ਕੇ ਕਮਰੇ ਵਿੱਚ ਪਲੰਘ ਹੇਠਾਂ ਚਲੀ ਗਈ। ਬਾਲ ਅਰਜਨ ਉਸ ਨੂੰ ਕੱਢਣ ਲਈ ਹੇਠਾਂ ਵੜ ਗਏ। ਉਹ ਸਿਰਫ਼ ਚਾਰ-ਪੰਜ ਸਾਲ ਦੇ ਸਨ, ਪਰ ਉਮਰ ਨਾਲੋਂ ਲੰਮੇ ਅਤੇ ਤਕੜੇ ਸਨ, ਅਤੇ ਹਿਲਦਿਆਂ-ਜੁਲਦਿਆਂ ਉਨ੍ਹਾਂ ਨੇ ਪਲੰਘ ਦਾ ਇੱਕ ਪਾਸਾ ਚੁੱਕ ਦਿੱਤਾ!",
"ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਜਾਗ ਪਏ ਅਤੇ ਪੁੱਛਿਆ, \"ਇਹ ਕੌਣ ਮਹਾਂਪੁਰਖ ਹੈ ਜਿਸ ਨੇ ਮੇਰਾ ਸਾਰਾ ਪਲੰਘ ਹਿਲਾ ਦਿੱਤਾ?\" ਬੀਬੀ ਭਾਨੀ ਜੀ ਭੱਜ ਕੇ ਆਏ ਅਤੇ ਬੋਲੇ, \"ਪਿਤਾ ਜੀ, ਇਹ ਤੁਹਾਡਾ ਦੋਹਤਾ ਹੈ।\" ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਨੇ ਮੁਸਕਰਾ ਕੇ ਉਹ ਬਖ਼ਸ਼ਿਸ਼ ਕੀਤੀ ਜੋ ਸਿੱਖ ਅੱਜ ਵੀ ਯਾਦ ਕਰਦੇ ਹਨ: \"ਦੋਹਿਤਾ ਬਾਣੀ ਕਾ ਬੋਹਿਥਾ।\" ਇਸ ਦਾ ਅਰਥ ਹੈ, \"ਇਹ ਦੋਹਤਾ ਇੱਕ ਜਹਾਜ਼ ਬਣੇਗਾ ਜੋ ਰੱਬ ਦੀ ਬਾਣੀ ਲੋਕਾਂ ਤੱਕ ਪਹੁੰਚਾਏਗਾ।\"",
"ਉਸ ਦਿਨ ਤੋਂ ਨਾਨਾ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਦੀ ਪੜ੍ਹਾਈ ਵੱਲ ਖ਼ਾਸ ਧਿਆਨ ਦਿੱਤਾ। ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਨੇ ਆਪ ਉਨ੍ਹਾਂ ਨੂੰ ਗੁਰਮੁਖੀ ਸਿਖਾਈ। ਮਾਮਾ ਬਾਬਾ ਮੋਹਰੀ ਜੀ ਨੇ ਹਿਸਾਬ ਸਿਖਾਇਆ। ਇੱਕ ਮੌਲਵੀ ਨੇ ਫ਼ਾਰਸੀ ਅਤੇ ਪੰਡਿਤ ਬੇਣੀ ਨੇ ਸੰਸਕ੍ਰਿਤ ਸਿਖਾਈ।",
"ਅਰਜਨ ਜੀ ਇੱਕ ਮਹਾਨ ਸੰਗੀਤਕਾਰ ਵੀ ਬਣੇ ਜੋ ਰਾਗਾਂ ਨੂੰ ਡੂੰਘਾਈ ਨਾਲ ਸਮਝਦੇ ਸਨ। ਉਹ ਵਧੀਆ ਘੋੜਸਵਾਰ ਅਤੇ ਤੀਰਅੰਦਾਜ਼ ਵੀ ਸਨ। ਬਖ਼ਸ਼ਿਸ਼ ਸੱਚ ਹੋਈ: ਕਈ ਸਾਲਾਂ ਬਾਅਦ, ਪੰਜਵੇਂ ਗੁਰੂ ਵਜੋਂ, ਉਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਸਾਹਿਬਾਨ ਅਤੇ ਭਗਤਾਂ ਦੀ ਬਾਣੀ ਇਕੱਠੀ ਕਰਕੇ ਰਾਗਾਂ ਅਨੁਸਾਰ ਆਦਿ ਗ੍ਰੰਥ ਵਿੱਚ ਦਰਜ ਕੀਤੀ। ਇਹੀ ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਜੀ ਬਣੇ।"],
l:"ਪਿਆਰ ਅਤੇ ਸਬਰ ਨਾਲ ਬਹੁਤ ਕੁਝ ਸਿੱਖਣਾ ਸਾਨੂੰ ਵੱਡੇ ਕੰਮਾਂ ਲਈ ਤਿਆਰ ਕਰਦਾ ਹੈ। ਇੱਕ ਛੋਟਾ ਬੱਚਾ ਵੀ ਵੱਡਾ ਹੋ ਕੇ ਕਮਾਲ ਦੇ ਕੰਮ ਕਰ ਸਕਦਾ ਹੈ।"};

PA["three-letters"]={t:[
"ਇੱਕ ਦਿਨ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਦੇ ਚਚੇਰੇ ਭਰਾ, ਸਹਾਰੀ ਮੱਲ, ਲਾਹੌਰ ਤੋਂ ਗੁਰੂ ਜੀ ਨੂੰ ਆਪਣੇ ਪੁੱਤਰ ਦੇ ਵਿਆਹ ਦਾ ਸੱਦਾ ਦੇਣ ਆਏ। ਗੁਰੂ ਜੀ ਅੰਮ੍ਰਿਤਸਰ ਸ਼ਹਿਰ ਵਸਾਉਣ ਵਿੱਚ ਰੁੱਝੇ ਹੋਏ ਸਨ, ਇਸ ਲਈ ਉਨ੍ਹਾਂ ਨੇ ਆਪਣੇ ਤਿੰਨ ਪੁੱਤਰਾਂ ਵਿੱਚੋਂ ਇੱਕ ਨੂੰ ਭੇਜਣ ਦਾ ਫ਼ੈਸਲਾ ਕੀਤਾ।",
"ਉਨ੍ਹਾਂ ਨੇ ਵੱਡੇ ਪੁੱਤਰ ਪ੍ਰਿਥੀ ਚੰਦ ਨੂੰ ਕਿਹਾ। ਪਰ ਪ੍ਰਿਥੀ ਚੰਦ ਅਗਲਾ ਗੁਰੂ ਬਣਨਾ ਚਾਹੁੰਦਾ ਸੀ ਅਤੇ ਡਰਦਾ ਸੀ ਕਿ ਗ਼ਲਤ ਵੇਲੇ ਦੂਰ ਨਾ ਹੋ ਜਾਵੇ। \"ਪਿਤਾ ਜੀ, ਮੈਂ ਇੱਥੇ ਗੁਰੂ ਘਰ ਦਾ ਕੰਮ-ਕਾਜ ਸੰਭਾਲਦਾ ਹਾਂ,\" ਉਸ ਨੇ ਕਿਹਾ। \"ਜੇ ਮੈਂ ਗਿਆ ਤਾਂ ਮੁਸ਼ਕਲ ਹੋਵੇਗੀ।\" ਦੂਜੇ ਪੁੱਤਰ, ਮਹਾਂਦੇਵ, ਸ਼ਾਂਤ ਅਤੇ ਵੈਰਾਗੀ ਸੁਭਾਅ ਦੇ ਸਨ। \"ਮੈਨੂੰ ਦੁਨਿਆਵੀ ਰਸਮਾਂ ਨਾਲ ਕੋਈ ਮਤਲਬ ਨਹੀਂ,\" ਉਨ੍ਹਾਂ ਕਿਹਾ। \"ਜਾ ਕੇ ਮੈਨੂੰ ਕੀ ਮਿਲੇਗਾ?\"",
"ਫਿਰ ਗੁਰੂ ਜੀ ਨੇ ਸਭ ਤੋਂ ਛੋਟੇ ਪੁੱਤਰ ਅਰਜਨ ਨੂੰ ਕਿਹਾ। ਬਿਨਾਂ ਇੱਕ ਪਲ ਸੋਚੇ, ਅਰਜਨ ਜੀ ਨੇ ਹਾਂ ਕਰ ਦਿੱਤੀ। \"ਜਦੋਂ ਤੱਕ ਮੈਂ ਨਾ ਸੱਦਾਂ, ਲਾਹੌਰ ਹੀ ਰਹਿਣਾ,\" ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਨੇ ਕਿਹਾ।",
"ਅਰਜਨ ਜੀ ਲਾਹੌਰ ਚਲੇ ਗਏ। ਵਿਆਹ ਤੋਂ ਬਾਅਦ ਉਹ ਪਿਤਾ ਜੀ ਦੇ ਹੁਕਮ ਅਨੁਸਾਰ ਉੱਥੇ ਹੀ ਰਹੇ। ਉਹ ਹਰ ਰੋਜ਼ ਕੀਰਤਨ ਦੇ ਦੀਵਾਨ ਸਜਾਉਂਦੇ ਅਤੇ ਸ਼ਹਿਰ ਦੇ ਕਈ ਮਹਾਂਪੁਰਖਾਂ ਨੂੰ ਮਿਲੇ, ਜਿਵੇਂ ਸਾਈਂ ਮੀਆਂ ਮੀਰ, ਸ਼ਾਹ ਹੁਸੈਨ ਅਤੇ ਛੱਜੂ ਭਗਤ।",
"ਮਹੀਨੇ ਬੀਤ ਗਏ, ਅਤੇ ਅਰਜਨ ਜੀ ਨੂੰ ਪਿਤਾ ਜੀ ਦੀ ਬਹੁਤ ਯਾਦ ਆਉਣ ਲੱਗੀ। ਉਨ੍ਹਾਂ ਨੇ ਤਾਂਘ ਨਾਲ ਭਰੀ ਚਿੱਠੀ ਲਿਖ ਕੇ ਘਰ ਆਉਣ ਦੀ ਆਗਿਆ ਮੰਗੀ। ਕੋਈ ਜਵਾਬ ਨਾ ਆਇਆ। ਉਨ੍ਹਾਂ ਨੇ ਦੂਜੀ ਚਿੱਠੀ ਲਿਖੀ। ਫਿਰ ਵੀ ਕੁਝ ਨਹੀਂ। ਪ੍ਰਿਥੀ ਚੰਦ ਨੇ ਦੋਵੇਂ ਚਿੱਠੀਆਂ ਚੋਰੀ-ਚੋਰੀ ਆਪਣੇ ਕੋਲ ਰੱਖ ਲਈਆਂ ਸਨ! ਤਾਂ ਅਰਜਨ ਜੀ ਨੇ ਤੀਜੀ ਚਿੱਠੀ ਲਿਖ ਕੇ ਇੱਕ ਸਿੱਖ ਨੂੰ ਦਿੱਤੀ ਅਤੇ ਕਿਹਾ, \"ਇਹ ਸਿਰਫ਼ ਪਿਤਾ ਜੀ ਦੇ ਹੱਥ ਵਿੱਚ ਹੀ ਦੇਣੀ।\"",
"ਜਦੋਂ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਨੇ ਤੀਜੀ ਚਿੱਠੀ ਪੜ੍ਹੀ, ਉਨ੍ਹਾਂ ਨੇ ਪ੍ਰਿਥੀ ਚੰਦ ਤੋਂ ਪਹਿਲੀਆਂ ਦੋ ਬਾਰੇ ਪੁੱਛਿਆ। ਪ੍ਰਿਥੀ ਚੰਦ ਨੇ ਕਿਹਾ ਕਿ ਉਸ ਨੇ ਕਦੇ ਨਹੀਂ ਵੇਖੀਆਂ, ਪਰ ਚਿੱਠੀਆਂ ਉਸ ਦੇ ਕੱਪੜਿਆਂ ਵਿੱਚੋਂ ਲੁਕੀਆਂ ਮਿਲ ਗਈਆਂ। ਗੁਰੂ ਜੀ ਨੇ ਤੁਰੰਤ ਅਰਜਨ ਜੀ ਨੂੰ ਵਾਪਸ ਸੱਦ ਲਿਆ। ਤਾਂਘ ਭਰੀਆਂ ਇਹ ਚਿੱਠੀਆਂ ਹੁਣ ਗੁਰਬਾਣੀ ਦਾ ਹਿੱਸਾ ਹਨ, ਮਾਝ ਰਾਗ ਦੇ ਸ਼ਬਦ \"ਮੇਰਾ ਮਨੁ ਲੋਚੈ ਗੁਰ ਦਰਸਨ ਤਾਈ\" ਵਿੱਚ। 1581 ਵਿੱਚ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਨੇ ਅਰਜਨ ਜੀ ਨੂੰ ਪੰਜਵੇਂ ਗੁਰੂ ਥਾਪਿਆ।"],
l:"ਹੁਕਮ ਮੰਨਣਾ, ਸਬਰ ਅਤੇ ਪਿਆਰ, ਵੱਡਾ ਬਣਨ ਦੀ ਚਾਹ ਨਾਲੋਂ ਉੱਚੇ ਹਨ। ਸੱਚ ਹਮੇਸ਼ਾ ਸਾਹਮਣੇ ਆ ਜਾਂਦਾ ਹੈ।"};

PA["satta-balwand"]={t:[
"ਸੱਤਾ ਅਤੇ ਬਲਵੰਡ ਰਬਾਬੀ ਸਨ, ਜੋ ਗੁਰੂ ਦਰਬਾਰ ਵਿੱਚ ਗੁਰਬਾਣੀ ਦਾ ਕੀਰਤਨ ਕਰਦੇ ਸਨ। ਉਹ ਇੰਨਾ ਸੁਰੀਲਾ ਗਾਉਂਦੇ ਕਿ ਸੰਗਤਾਂ ਸੁਣਨ ਲਈ ਇਕੱਠੀਆਂ ਹੋ ਜਾਂਦੀਆਂ।",
"ਇੱਕ ਵਾਰ ਸੱਤੇ ਨੇ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਤੋਂ ਆਪਣੀ ਧੀ ਦੇ ਵਿਆਹ ਲਈ ਮਦਦ ਮੰਗੀ। ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, \"ਅੱਜ ਦੇ ਕੀਰਤਨ ਦੀ ਸਾਰੀ ਭੇਟਾ ਤੁਹਾਡੀ ਹੋਵੇਗੀ।\" ਪਰ ਉਸ ਦਿਨ ਭੇਟਾ ਆਮ ਨਾਲੋਂ ਘੱਟ ਆਈ, ਅਤੇ ਦੋਵੇਂ ਰਬਾਬੀ ਨਾਰਾਜ਼ ਹੋ ਗਏ।",
"ਪ੍ਰਿਥੀ ਚੰਦ, ਜੋ ਗੁਰੂ ਜੀ ਨਾਲ ਈਰਖਾ ਕਰਦਾ ਸੀ, ਨੇ ਝਗੜਾ ਪਾਉਣ ਦਾ ਮੌਕਾ ਵੇਖਿਆ। \"ਲੋਕ ਤਾਂ ਸਿਰਫ਼ ਤੁਹਾਡਾ ਕੀਰਤਨ ਸੁਣਨ ਆਉਂਦੇ ਹਨ,\" ਉਸ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਕਿਹਾ। \"ਜੇ ਤੁਸੀਂ ਬੰਦ ਕਰ ਦਿਓ, ਤਾਂ ਕੋਈ ਗੁਰੂ ਕੋਲ ਨਹੀਂ ਜਾਵੇਗਾ।\" ਸੱਤੇ ਅਤੇ ਬਲਵੰਡ ਨੇ ਉਸ ਦੀ ਗੱਲ ਮੰਨ ਲਈ। ਅਗਲੀ ਸਵੇਰ ਉਹ ਕੀਰਤਨ ਲਈ ਨਾ ਆਏ, ਅਤੇ ਜਦੋਂ ਗੁਰੂ ਜੀ ਨੇ ਸੱਦਾ ਭੇਜਿਆ, ਉਨ੍ਹਾਂ ਨੇ ਨਾਂਹ ਕਰ ਦਿੱਤੀ ਅਤੇ ਗੁਰੂ ਘਰ ਬਾਰੇ ਮਾੜੇ ਬੋਲ ਬੋਲੇ।",
"ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਨੇ ਕਿਹਾ, \"ਇਨ੍ਹਾਂ ਨੂੰ ਹੰਕਾਰ ਹੋ ਗਿਆ ਹੈ। ਕੋਈ ਇਨ੍ਹਾਂ ਦੀ ਸਿਫ਼ਾਰਸ਼ ਨਾ ਕਰੇ। ਜੋ ਕਰੇਗਾ, ਉਸ ਦਾ ਮੂੰਹ ਕਾਲਾ ਕਰਕੇ ਖੋਤੇ ਉੱਤੇ ਬਿਠਾ ਕੇ ਗਲੀਆਂ ਵਿੱਚ ਫੇਰਿਆ ਜਾਵੇਗਾ।\" ਫਿਰ ਗੁਰੂ ਜੀ ਨੇ ਆਪ ਸਾਜ਼ ਚੁੱਕ ਕੇ ਕੀਰਤਨ ਸ਼ੁਰੂ ਕਰ ਦਿੱਤਾ, ਅਤੇ ਸਾਰੀ ਸੰਗਤ ਨਾਲ ਗਾਉਣ ਲੱਗੀ। ਉਸ ਦਿਨ ਤੋਂ ਹਰ ਸਿੱਖ ਗੁਰਬਾਣੀ ਦਾ ਕੀਰਤਨ ਕਰ ਸਕਦਾ ਹੈ, ਸਿਰਫ਼ ਪੇਸ਼ੇਵਰ ਰਾਗੀ ਹੀ ਨਹੀਂ।",
"ਛੇਤੀ ਹੀ ਸੱਤਾ ਅਤੇ ਬਲਵੰਡ ਬਿਮਾਰ ਹੋ ਗਏ, ਅਤੇ ਕੋਈ ਉਨ੍ਹਾਂ ਦੇ ਨੇੜੇ ਨਹੀਂ ਜਾਣਾ ਚਾਹੁੰਦਾ ਸੀ। ਆਪਣੀ ਗ਼ਲਤੀ ਉੱਤੇ ਪਛਤਾਉਂਦੇ ਹੋਏ, ਉਹ ਲਾਹੌਰ ਗਏ ਅਤੇ ਇੱਕ ਦਇਆਵਾਨ ਸਿੱਖ, ਭਾਈ ਲੱਧਾ ਤੋਂ ਮਦਦ ਮੰਗੀ। ਭਾਈ ਲੱਧਾ ਗੁਰੂ ਜੀ ਦੀ ਸ਼ਰਤ ਜਾਣਦੇ ਸਨ। ਬਿਨਾਂ ਝਿਜਕ, ਉਨ੍ਹਾਂ ਨੇ ਆਪਣਾ ਮੂੰਹ ਕਾਲਾ ਕੀਤਾ, ਅੱਗੇ ਢੋਲੀ ਲਾ ਕੇ ਖੋਤੇ ਉੱਤੇ ਬੈਠੇ, ਅਤੇ ਦੋਵਾਂ ਰਬਾਬੀਆਂ ਨੂੰ ਲੈ ਕੇ ਗੁਰੂ ਜੀ ਅੱਗੇ ਆ ਗਏ।",
"ਭਾਈ ਲੱਧਾ ਦਾ ਨਿਸ਼ਕਾਮ ਪਿਆਰ ਵੇਖ ਕੇ ਗੁਰੂ ਜੀ ਪਸੀਜ ਗਏ ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਲੱਧਾ ਪਰਉਪਕਾਰੀ, ਭਾਵ ਦੂਜਿਆਂ ਦਾ ਭਲਾ ਕਰਨ ਵਾਲਾ, ਕਿਹਾ। ਉਨ੍ਹਾਂ ਕਿਹਾ, \"ਇਨ੍ਹਾਂ ਨੂੰ ਮਾਫ਼ੀ ਮਿਲ ਜਾਵੇਗੀ ਜੇ ਇਹ ਗੁਰੂ ਘਰ ਦੀ ਉਸੇ ਤਰ੍ਹਾਂ ਸਿਫ਼ਤ ਕਰਨ ਜਿਵੇਂ ਇਨ੍ਹਾਂ ਨੇ ਨਿੰਦਾ ਕੀਤੀ ਸੀ।\" ਸੱਤੇ ਅਤੇ ਬਲਵੰਡ ਨੇ ਗੁਰੂ ਸਾਹਿਬਾਨ ਦੀ ਸਿਫ਼ਤ ਵਿੱਚ ਵਾਰ ਗਾਈ ਅਤੇ ਤੰਦਰੁਸਤ ਹੋ ਗਏ। ਉਨ੍ਹਾਂ ਦੀ ਵਾਰ, ਰਾਮਕਲੀ ਕੀ ਵਾਰ, ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਜੀ (ਅੰਗ 966) ਵਿੱਚ ਦਰਜ ਹੈ, ਜਿੱਥੇ ਇਹ ਅੱਜ ਵੀ ਪੜ੍ਹੀ ਜਾਂਦੀ ਹੈ।"],
l:"ਹੰਕਾਰ ਸਾਨੂੰ ਗੁਰੂ ਤੋਂ ਦੂਰ ਲੈ ਜਾਂਦਾ ਹੈ, ਪਰ ਸੱਚੇ ਦਿਲੋਂ ਪਛਤਾਵਾ ਕਰਨ ਵਾਲਿਆਂ ਨੂੰ ਮਾਫ਼ੀ ਮਿਲਦੀ ਹੈ। ਆਪਣਾ ਨੁਕਸਾਨ ਸਹਿ ਕੇ ਵੀ ਦੂਜਿਆਂ ਦੀ ਮਦਦ ਕਰਨਾ ਸੱਚੀ ਸੇਵਾ ਹੈ।"};

PA["bhai-manjh"]={t:[
"ਭਾਈ ਮੰਝ ਦਾ ਅਸਲ ਨਾਂ ਤੀਰਥਾ ਸੀ। ਉਹ ਹੁਸ਼ਿਆਰਪੁਰ ਦੇ ਨੇੜੇ ਪਿੰਡ ਕੰਗ ਮਾਈ ਦੇ ਇੱਕ ਅਮੀਰ ਜ਼ਿਮੀਂਦਾਰ ਅਤੇ ਪਿੰਡ ਦੇ ਚੌਧਰੀ ਸਨ। ਉਹ ਸਖੀ ਸਰਵਰ ਨਾਂ ਦੇ ਪੀਰ ਨੂੰ ਮੰਨਦੇ ਸਨ ਅਤੇ ਉਸ ਲਈ ਪੀਰਖ਼ਾਨੇ ਬਣਾਏ ਹੋਏ ਸਨ।",
"1585 ਵਿੱਚ ਤੀਰਥ ਯਾਤਰਾ ਤੋਂ ਘਰ ਮੁੜਦਿਆਂ, ਉਹ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਦੇ ਦਰਸ਼ਨਾਂ ਲਈ ਅੰਮ੍ਰਿਤਸਰ ਰੁਕੇ। ਉਨ੍ਹਾਂ ਨੇ ਵੇਖਿਆ ਕਿ ਸਿੱਖ ਲੰਗਰ ਵਿੱਚ ਖ਼ੁਸ਼ੀ-ਖ਼ੁਸ਼ੀ ਸਭ ਦੀ ਸੇਵਾ ਕਰ ਰਹੇ ਹਨ, ਅਤੇ ਉਨ੍ਹਾਂ ਦਾ ਦਿਲ ਪਸੀਜ ਗਿਆ। \"ਮੈਨੂੰ ਵੀ ਆਪਣਾ ਸਿੱਖ ਬਣਾ ਲਓ,\" ਉਨ੍ਹਾਂ ਬੇਨਤੀ ਕੀਤੀ।",
"ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, \"ਤੁਸੀਂ ਸਖੀ ਸਰਵਰ ਨੂੰ ਮੰਨਦੇ ਹੋ। ਸਿੱਖ ਬਣਨ ਲਈ ਉਹ ਛੱਡ ਕੇ ਇੱਕ ਰਾਹ ਉੱਤੇ ਚੱਲਣਾ ਪਵੇਗਾ।\" ਭਾਈ ਮੰਝ ਘਰ ਗਏ ਅਤੇ ਆਪਣੇ ਘਰ ਦਾ ਪੀਰਖ਼ਾਨਾ ਢਾਹ ਦਿੱਤਾ। ਪਿੰਡ ਵਾਲੇ ਉਨ੍ਹਾਂ ਦੇ ਵਿਰੁੱਧ ਹੋ ਗਏ। ਉਨ੍ਹਾਂ ਦੀ ਚੌਧਰ ਚਲੀ ਗਈ, ਅਤੇ ਹੌਲੀ-ਹੌਲੀ ਉਹ ਗਰੀਬ ਹੋ ਗਏ। ਪਰ ਉਨ੍ਹਾਂ ਦਾ ਮਨ ਰੱਬ ਦੇ ਭਾਣੇ ਵਿੱਚ ਸ਼ਾਂਤ ਅਤੇ ਖ਼ੁਸ਼ ਸੀ।",
"ਭਾਈ ਮੰਝ ਗੁਰੂ ਜੀ ਕੋਲ ਰਹਿ ਕੇ ਸੇਵਾ ਕਰਨ ਲੱਗੇ। ਹੋਰਨਾਂ ਸਿੱਖਾਂ ਵਾਂਗ ਉਹ ਲੰਗਰ ਲਈ ਜੰਗਲ ਵਿੱਚੋਂ ਲੱਕੜਾਂ ਲਿਆਉਂਦੇ। ਇੱਕ ਦਿਨ, ਜਦੋਂ ਉਹ ਸਿਰ ਉੱਤੇ ਲੱਕੜਾਂ ਦੀ ਵੱਡੀ ਪੰਡ ਲੈ ਕੇ ਮੁੜ ਰਹੇ ਸਨ, ਜ਼ੋਰਦਾਰ ਹਨੇਰੀ ਆ ਗਈ। ਉਨ੍ਹਾਂ ਨੂੰ ਰਾਹ ਨਾ ਦਿਸਿਆ, ਅਤੇ ਉਹ ਇੱਕ ਖੂਹ ਵਿੱਚ ਡਿੱਗ ਪਏ!",
"ਪਾਣੀ ਵਿੱਚ ਵੀ ਭਾਈ ਮੰਝ ਨੇ ਪੰਡ ਆਪਣੇ ਸਿਰ ਤੋਂ ਉੱਚੀ ਚੁੱਕੀ ਰੱਖੀ ਤਾਂ ਜੋ ਗਿੱਲੀ ਨਾ ਹੋਵੇ। \"ਲੰਗਰ ਪਕਾਉਣ ਲਈ ਸੁੱਕੀਆਂ ਲੱਕੜਾਂ ਚਾਹੀਦੀਆਂ ਹਨ,\" ਉਨ੍ਹਾਂ ਨੇ ਸੋਚਿਆ। ਉਹ ਘੰਟਿਆਂ ਤੱਕ ਉੱਥੇ ਖੜ੍ਹੇ ਗੁਰਬਾਣੀ ਪੜ੍ਹਦੇ ਰਹੇ।",
"ਹਨੇਰਾ ਹੋਣ ਤੋਂ ਬਾਅਦ ਸਿੱਖ ਉਨ੍ਹਾਂ ਨੂੰ ਲੱਭਦੇ ਆਏ ਅਤੇ ਖੂਹ ਵਿੱਚੋਂ ਉਨ੍ਹਾਂ ਦੀ ਆਵਾਜ਼ ਸੁਣੀ। ਉਨ੍ਹਾਂ ਨੇ ਰੱਸਾ ਲਮਕਾਇਆ। \"ਭਾਈ ਮੰਝ, ਫੜ ਕੇ ਉੱਪਰ ਆ ਜਾਓ!\" ਉਨ੍ਹਾਂ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, \"ਪਹਿਲਾਂ ਲੱਕੜਾਂ ਖਿੱਚੋ, ਫਿਰ ਮੈਨੂੰ।\" ਜਦੋਂ ਤੱਕ ਉਹ ਬਾਹਰ ਨਿਕਲੇ, ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਆਪ ਪਹੁੰਚ ਗਏ ਸਨ। ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਗਲਵੱਕੜੀ ਪਾਈ ਅਤੇ ਕਿਹਾ, \"ਮੈਂ ਤੇਰੀ ਸੇਵਾ ਤੋਂ ਬਹੁਤ ਖ਼ੁਸ਼ ਹਾਂ। ਜੋ ਚਾਹੇਂ ਮੰਗ ਲੈ।\" ਭਾਈ ਮੰਝ ਨੇ ਕਿਹਾ, \"ਗੁਰੂ ਜੀ, ਤੁਸੀਂ ਮੈਨੂੰ ਮਨ ਦੀ ਸ਼ਾਂਤੀ ਪਹਿਲਾਂ ਹੀ ਬਖ਼ਸ਼ ਦਿੱਤੀ ਹੈ। ਮੈਨੂੰ ਹੋਰ ਕੁਝ ਨਹੀਂ ਚਾਹੀਦਾ।\""],
l:"ਸੱਚੀ ਸੇਵਾ ਦਾ ਅਰਥ ਹੈ ਆਪਣੇ ਆਰਾਮ ਨਾਲੋਂ ਕੰਮ ਦੀ ਵੱਧ ਪਰਵਾਹ ਕਰਨਾ। ਗੁਰੂ ਦੇ ਨੇੜੇ ਹੋਣਾ ਸਭ ਤੋਂ ਵੱਡਾ ਖ਼ਜ਼ਾਨਾ ਹੈ।"};

PA["buddhu-shah"]={t:[
"ਬੁੱਢੂ ਸ਼ਾਹ ਲਾਹੌਰ ਦਾ ਇੱਕ ਅਮੀਰ ਆਵੇ ਵਾਲਾ ਸੀ। ਉਸ ਦੇ ਕਾਮੇ ਮਿੱਟੀ ਤੋਂ ਇੱਟਾਂ ਬਣਾਉਂਦੇ ਅਤੇ ਆਵੇ ਵਿੱਚ ਪਕਾਉਂਦੇ। ਉਸ ਦਾ ਕਾਰੋਬਾਰ ਇੰਨਾ ਚੰਗਾ ਚੱਲਦਾ ਸੀ ਕਿ ਸਰਕਾਰ ਵੀ ਉਸ ਤੋਂ ਇੱਟਾਂ ਖ਼ਰੀਦਦੀ ਸੀ।",
"ਉਸ ਨੇ ਹੁਣੇ-ਹੁਣੇ ਨਵਾਂ ਆਵਾ ਲਾਇਆ ਸੀ, ਅਤੇ ਚਾਹੁੰਦਾ ਸੀ ਕਿ ਹਰ ਇੱਟ ਚੰਗੀ ਤਰ੍ਹਾਂ ਪੱਕੇ। ਇਸ ਲਈ ਉਸ ਨੇ ਅਸੀਸ ਦੀ ਆਸ ਨਾਲ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਅਤੇ ਸਿੱਖਾਂ ਨੂੰ ਵੱਡੇ ਭੋਜ ਉੱਤੇ ਸੱਦਿਆ।",
"ਜਦੋਂ ਸਭ ਭੋਜਨ ਛਕ ਰਹੇ ਸਨ, ਭਾਈ ਕਮਲੀਆ ਨਾਂ ਦਾ ਇੱਕ ਗਰੀਬ ਸਿੱਖ ਦਰਵਾਜ਼ੇ ਉੱਤੇ ਪਹੁੰਚਿਆ। ਉਸ ਦੇ ਕੱਪੜੇ ਪੁਰਾਣੇ ਅਤੇ ਫਟੇ ਹੋਏ ਸਨ। ਦਰਬਾਨ ਨੇ ਉਸ ਵੱਲ ਵੇਖਿਆ ਅਤੇ ਦਰਵਾਜ਼ਾ ਬੰਦ ਕਰ ਦਿੱਤਾ। \"ਤੂੰ ਬਹੁਤ ਦੇਰ ਨਾਲ ਆਇਆ ਹੈਂ,\" ਉਸ ਨੇ ਕਿਹਾ। \"ਸਾਰਾ ਭੋਜਨ ਵਰਤ ਚੁੱਕਾ ਹੈ।\" ਭਾਈ ਕਮਲੀਆ ਭੁੱਖਾ ਬਾਹਰ ਖੜ੍ਹਾ ਰਿਹਾ।",
"ਭੋਜਨ ਤੋਂ ਬਾਅਦ ਬੁੱਢੂ ਸ਼ਾਹ ਨੇ ਅਰਦਾਸ ਲਈ ਬੇਨਤੀ ਕੀਤੀ: \"ਮੇਰੀਆਂ ਇੱਟਾਂ ਚੰਗੀ ਤਰ੍ਹਾਂ ਪੱਕਣ, ਤਾਂ ਜੋ ਮੈਂ ਵੇਚ ਕੇ ਬਹੁਤ ਕਮਾਈ ਕਰ ਸਕਾਂ।\" ਜਿਵੇਂ ਹੀ ਸਿੱਖ ਨੇ ਅਰਦਾਸ ਸ਼ੁਰੂ ਕੀਤੀ, ਦਰਵਾਜ਼ੇ ਦੇ ਬਾਹਰੋਂ ਆਵਾਜ਼ ਆਈ: \"ਇਸ ਦੀਆਂ ਇੱਟਾਂ ਕੱਚੀਆਂ ਹੀ ਰਹਿਣਗੀਆਂ, ਕਿਉਂਕਿ ਇਸ ਨੇ ਇੱਕ ਭੁੱਖੇ ਨੂੰ ਕੁਝ ਖਾਣ ਨੂੰ ਨਹੀਂ ਦਿੱਤਾ!\"",
"ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਨੇ ਬੁੱਢੂ ਸ਼ਾਹ ਵੱਲ ਵੇਖਿਆ। \"ਭਾਈ ਕਮਲੀਏ ਦੇ ਬਚਨ ਸੱਚ ਹੋਣਗੇ, ਕਿਉਂਕਿ ਤੇਰੇ ਬੰਦਿਆਂ ਨੇ ਇੱਕ ਭੁੱਖੇ ਨੂੰ ਭੋਜਨ ਤੋਂ ਮੋੜਿਆ। ਪਰ ਸੰਗਤ ਦੀ ਅਰਦਾਸ ਵੀ ਬਿਰਥੀ ਨਹੀਂ ਜਾਵੇਗੀ। ਤੇਰੀਆਂ ਕੱਚੀਆਂ ਇੱਟਾਂ ਪੱਕੀਆਂ ਦੇ ਭਾਅ ਵਿਕਣਗੀਆਂ।\"",
"ਉਸ ਸਾਲ ਬਹੁਤ ਭਾਰੀ ਮੀਂਹ ਪਏ। ਕਈ ਪੁਰਾਣੇ ਘਰ ਡਿੱਗ ਪਏ, ਅਤੇ ਲਾਹੌਰ ਦੇ ਕਿਲ੍ਹੇ ਦੀ ਕੰਧ ਵੀ ਢਹਿ ਗਈ। ਸੂਬੇਦਾਰ ਨੂੰ ਤੁਰੰਤ ਇੱਟਾਂ ਚਾਹੀਦੀਆਂ ਸਨ, ਪਰ ਕਿਤੇ ਵੀ ਪੱਕੀਆਂ ਇੱਟਾਂ ਨਹੀਂ ਮਿਲੀਆਂ, ਇਸ ਲਈ ਉਸ ਨੇ ਬੁੱਢੂ ਸ਼ਾਹ ਦੀਆਂ ਅੱਧ-ਪੱਕੀਆਂ ਇੱਟਾਂ ਪੂਰੇ ਭਾਅ ਖ਼ਰੀਦ ਲਈਆਂ। ਬੁੱਢੂ ਸ਼ਾਹ ਖ਼ੁਸ਼ ਹੋ ਗਿਆ, ਅਤੇ ਉਸ ਨੇ ਇੱਕ ਸਬਕ ਸਿੱਖਿਆ ਜੋ ਕਦੇ ਨਾ ਭੁੱਲਿਆ: ਰੱਬ ਪਹਿਲਾਂ ਭੁੱਖਿਆਂ ਅਤੇ ਗਰੀਬਾਂ ਦੀ ਸੁਣਦਾ ਹੈ।"],
l:"ਹਰ ਮਹਿਮਾਨ ਦਾ ਸਤਿਕਾਰ ਕਰੋ, ਭਾਵੇਂ ਉਸ ਨੇ ਕੁਝ ਵੀ ਪਹਿਨਿਆ ਹੋਵੇ। ਵੱਡੇ ਲੋਕਾਂ ਦੇ ਭੋਜ ਨਾਲੋਂ ਭੁੱਖੇ ਨੂੰ ਰੋਟੀ ਦੇਣਾ ਵੱਧ ਜ਼ਰੂਰੀ ਹੈ।"};

PA["bravery-in-childhood"]={t:[
"ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਦਾ ਜਨਮ 1621 ਵਿੱਚ ਅੰਮ੍ਰਿਤਸਰ ਵਿਖੇ ਹੋਇਆ। ਉਨ੍ਹਾਂ ਦੇ ਪਿਤਾ ਛੇਵੇਂ ਗੁਰੂ, ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ, ਅਤੇ ਮਾਤਾ, ਮਾਤਾ ਨਾਨਕੀ ਜੀ ਸਨ। ਜਨਮ ਵੇਲੇ ਉਨ੍ਹਾਂ ਦਾ ਨਾਂ ਤਿਆਗ ਮੱਲ ਰੱਖਿਆ ਗਿਆ।",
"ਉਨ੍ਹਾਂ ਨੇ ਮਹਾਨ ਸਿੱਖ ਵਿਦਵਾਨ ਭਾਈ ਗੁਰਦਾਸ ਜੀ ਤੋਂ ਧਾਰਮਿਕ ਗ੍ਰੰਥ ਪੜ੍ਹੇ। ਕੁਝ ਸਮਾਂ ਉਹ ਗੁਰੂ ਜੀ ਦੇ ਖੇਤਾਂ ਵਿੱਚ ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਕੋਲ ਰਹੇ। ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਬਹੁਤ ਬਜ਼ੁਰਗ ਹੋ ਕੇ ਵੀ ਆਪਣੇ ਹੱਥੀਂ ਖੇਤਾਂ ਵਿੱਚ ਕੰਮ ਕਰਦੇ ਸਨ, ਅਤੇ ਤਿਆਗ ਮੱਲ ਨੇ ਸਿੱਖਿਆ ਕਿ ਹੱਥੀਂ ਈਮਾਨਦਾਰ ਕਿਰਤ ਕਰਨਾ ਸਿੱਖੀ ਦਾ ਹਿੱਸਾ ਹੈ। ਭਾਈ ਜੇਠਾ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਘੋੜਸਵਾਰੀ ਅਤੇ ਸ਼ਸਤਰ ਵਿੱਦਿਆ ਸਿਖਾਈ।",
"ਤਿਆਗ ਮੱਲ ਸੁਭਾਅ ਤੋਂ ਸ਼ਾਂਤ ਅਤੇ ਵਿਚਾਰਵਾਨ ਸਨ। ਜਦੋਂ ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਅਤੇ ਭਾਈ ਗੁਰਦਾਸ ਜੀ ਅਕਾਲ ਚਲਾਣਾ ਕਰ ਗਏ, ਉਹ ਹੋਰ ਵੀ ਚੁੱਪ ਅਤੇ ਗੰਭੀਰ ਹੋ ਗਏ। 1632 ਵਿੱਚ ਕਰਤਾਰਪੁਰ ਵਿਖੇ ਉਨ੍ਹਾਂ ਦਾ ਵਿਆਹ ਮਾਤਾ ਗੁਜਰੀ ਜੀ ਨਾਲ ਹੋਇਆ।",
"ਕਰਤਾਰਪੁਰ ਵਿੱਚ ਵਿਸਾਖੀ ਦੇ ਇਕੱਠ ਦੌਰਾਨ, ਪੈਂਦੇ ਖ਼ਾਨ ਦੀ ਅਗਵਾਈ ਵਿੱਚ ਇੱਕ ਫ਼ੌਜ ਨੇ ਸ਼ਹਿਰ ਉੱਤੇ ਹਮਲਾ ਕਰ ਦਿੱਤਾ। ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਸਿੱਖਾਂ ਨਾਲ ਸ਼ਹਿਰ ਦੀ ਰੱਖਿਆ ਲਈ ਨਿਕਲੇ, ਅਤੇ ਸ਼ਹਿਰ ਦੇ ਲੋਕ ਛੱਤਾਂ ਤੋਂ ਵੇਖ ਰਹੇ ਸਨ। ਤਿਆਗ ਮੱਲ ਸਿਰਫ਼ ਤੇਰਾਂ ਸਾਲ ਦੇ ਸਨ, ਪਰ ਉਨ੍ਹਾਂ ਨੇ ਸ਼ਸਤਰ ਚੁੱਕੇ ਅਤੇ ਰੱਖਿਆ ਕਰਨ ਵਾਲਿਆਂ ਵਿੱਚ ਸ਼ਾਮਲ ਹੋ ਗਏ।",
"ਮਾਤਾ ਨਾਨਕੀ ਜੀ ਇੱਕ ਛੱਤ ਤੋਂ ਵੇਖ ਰਹੇ ਸਨ। ਜਦੋਂ ਉਹ ਬਹੁਤ ਦੇਰ ਲੜ ਚੁੱਕੇ, ਮਾਤਾ ਜੀ ਨੇ ਸੁਨੇਹਾ ਭੇਜਿਆ: 'ਪੁੱਤਰ, ਬਹੁਤ ਲੜ ਲਿਆ। ਵਾਪਸ ਆ ਕੇ ਆਰਾਮ ਕਰ।' ਉਨ੍ਹਾਂ ਨੇ ਅਦਬ ਨਾਲ ਜਵਾਬ ਭੇਜਿਆ: 'ਪਿਆਰੇ ਮਾਤਾ ਜੀ, ਸਿਪਾਹੀ ਨੂੰ ਲੜਾਈ ਵਿਚਕਾਰ ਛੱਡ ਕੇ ਨਹੀਂ ਜਾਣਾ ਚਾਹੀਦਾ। ਅਜੇ ਨਾ ਆਉਣ ਲਈ ਮਾਫ਼ ਕਰਨਾ।' ਅੰਤ ਵਿੱਚ ਹਮਲਾਵਰ ਹਾਰ ਕੇ ਮੁੜ ਗਏ।",
"ਬਾਅਦ ਵਿੱਚ ਕੀਰਤਪੁਰ ਜਾਂਦਿਆਂ, ਫਗਵਾੜੇ ਦੇ ਨੇੜੇ ਪਿੰਡ ਪਲਾਹੀ ਕੋਲ ਇੱਕ ਹੋਰ ਹਮਲਾ ਹੋਇਆ। ਫਿਰ ਤਿਆਗ ਮੱਲ ਨੇ ਬੜੀ ਨਿਪੁੰਨਤਾ ਨਾਲ ਜੰਗ ਕੀਤੀ। ਲੜਾਈ ਤੋਂ ਬਾਅਦ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਕੋਲ ਸੱਦ ਕੇ ਕਿਹਾ, 'ਪੁੱਤਰ, ਅੱਜ ਤੋਂ ਤੇਰਾ ਨਾਂ ਤਿਆਗ ਮੱਲ ਨਹੀਂ, ਤੇਗ ਬਹਾਦਰ ਹੈ, ਭਾਵ ਤੇਗ (ਤਲਵਾਰ) ਦਾ ਧਨੀ ਸੂਰਮਾ।'"],
l:"ਸੱਚੀ ਬਹਾਦਰੀ ਦਾ ਅਰਥ ਹੈ ਸਹੀ ਗੱਲ ਲਈ ਡਟ ਕੇ ਖੜ੍ਹਨਾ, ਅਤੇ ਅੰਦਰੋਂ ਸ਼ਾਂਤ ਅਤੇ ਨਿਮਰ ਰਹਿਣਾ।"};

PA["found-the-guru"]={t:[
"ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਨੇ ਆਪਣੇ ਪੋਤਰੇ ਹਰਿ ਰਾਇ ਜੀ ਨੂੰ ਸੱਤਵੇਂ ਗੁਰੂ ਥਾਪਿਆ, ਅਤੇ ਆਪਣੇ ਪੁੱਤਰ ਤੇਗ ਬਹਾਦਰ ਜੀ ਨੂੰ ਪਿੰਡ ਬਕਾਲੇ ਜਾ ਕੇ ਰਹਿਣ ਲਈ ਕਿਹਾ। ਤੇਗ ਬਹਾਦਰ ਜੀ ਮਾਤਾ ਨਾਨਕੀ ਜੀ ਅਤੇ ਮਾਤਾ ਗੁਜਰੀ ਜੀ ਨਾਲ ਉੱਥੇ ਚਲੇ ਗਏ। ਉਨ੍ਹਾਂ ਨੇ ਉੱਥੇ ਕਈ ਸਾਲ ਸ਼ਾਂਤ ਭਗਤੀ ਵਿੱਚ ਬਿਤਾਏ।",
"1664 ਵਿੱਚ ਅੱਠਵੇਂ ਗੁਰੂ, ਬਾਲ ਗੁਰੂ ਹਰਿਕ੍ਰਿਸ਼ਨ ਸਾਹਿਬ ਜੀ, ਦਿੱਲੀ ਵਿੱਚ ਬਹੁਤ ਬਿਮਾਰ ਸਨ। ਜੋਤੀ ਜੋਤਿ ਸਮਾਉਣ ਤੋਂ ਪਹਿਲਾਂ ਉਨ੍ਹਾਂ ਨੇ ਸਿਰਫ਼ ਦੋ ਸ਼ਬਦ ਕਹੇ: 'ਬਾਬਾ ਬਕਾਲੇ।' ਇਸ ਦਾ ਅਰਥ ਸੀ ਕਿ ਅਗਲੇ ਗੁਰੂ ਬਕਾਲੇ ਵਿੱਚ ਰਹਿਣ ਵਾਲੇ ਇੱਕ ਬਜ਼ੁਰਗ ਹਨ।",
"ਛੇਤੀ ਹੀ ਗੁਰੂ ਪਰਿਵਾਰ ਦੇ ਕਈ ਰਿਸ਼ਤੇਦਾਰ ਬਕਾਲੇ ਪਹੁੰਚ ਗਏ। ਹਰ ਕੋਈ ਉੱਚੀ ਗੱਦੀ ਲਾ ਕੇ ਬੈਠ ਗਿਆ ਅਤੇ ਐਲਾਨ ਕਰਨ ਲੱਗਾ, 'ਮੈਂ ਗੁਰੂ ਹਾਂ!' ਸਿੱਖ ਭੰਬਲਭੂਸੇ ਵਿੱਚ ਪੈ ਗਏ। ਅਸਲੀ ਗੁਰੂ ਕੌਣ ਹੈ?",
"ਫਿਰ ਮੱਖਣ ਸ਼ਾਹ ਲੁਬਾਣਾ ਨਾਂ ਦਾ ਇੱਕ ਅਮੀਰ ਵਪਾਰੀ ਆਇਆ। ਇੱਕ ਵਾਰ ਉਸ ਦਾ ਜਹਾਜ਼ ਸੂਰਤ ਦੀ ਬੰਦਰਗਾਹ ਨੇੜੇ ਤੂਫ਼ਾਨ ਵਿੱਚ ਫਸ ਗਿਆ ਸੀ। ਉਸ ਨੇ ਅਰਦਾਸ ਕੀਤੀ ਸੀ, 'ਹੇ ਗੁਰੂ, ਮੇਰਾ ਜਹਾਜ਼ ਸਹੀ-ਸਲਾਮਤ ਕੰਢੇ ਲਾ ਦਿਓ, ਮੈਂ ਵੱਡੀ ਭੇਟਾ ਚੜ੍ਹਾਵਾਂਗਾ।' ਜਹਾਜ਼ ਸਹੀ-ਸਲਾਮਤ ਬੰਦਰਗਾਹ ਪਹੁੰਚ ਗਿਆ ਸੀ, ਅਤੇ ਹੁਣ ਉਹ ਆਪਣਾ ਵਾਅਦਾ ਪੂਰਾ ਕਰਨ ਆਇਆ ਸੀ।",
"ਮੱਖਣ ਸ਼ਾਹ ਨੇ ਸੋਚਿਆ, 'ਸੱਚਾ ਗੁਰੂ ਜਾਣ ਲਵੇਗਾ ਕਿ ਮੈਂ ਕੀ ਸੁੱਖਿਆ ਸੀ।' ਉਹ ਆਪਣੇ ਆਪ ਨੂੰ ਗੁਰੂ ਕਹਿਣ ਵਾਲੇ ਹਰ ਬੰਦੇ ਕੋਲ ਗਿਆ ਅਤੇ ਉਸ ਅੱਗੇ ਸਿਰਫ਼ ਦੋ ਮੋਹਰਾਂ ਰੱਖੀਆਂ। ਹਰ ਇੱਕ ਨੇ ਖ਼ੁਸ਼ੀ-ਖ਼ੁਸ਼ੀ ਮੋਹਰਾਂ ਲੈ ਲਈਆਂ ਅਤੇ ਹੋਰ ਕੁਝ ਨਾ ਕਿਹਾ।",
"ਅਖ਼ੀਰ ਉਸ ਨੇ ਪਿੰਡ ਵਾਲਿਆਂ ਤੋਂ ਪੁੱਛਿਆ, 'ਕੀ ਕੋਈ ਹੋਰ ਵੀ ਹੈ?' ਉਨ੍ਹਾਂ ਨੇ ਇੱਕ ਸ਼ਾਂਤ ਘਰ ਵੱਲ ਇਸ਼ਾਰਾ ਕੀਤਾ ਜਿੱਥੇ ਤੇਗ ਬਹਾਦਰ ਜੀ ਰਹਿੰਦੇ ਸਨ। ਮੱਖਣ ਸ਼ਾਹ ਅੰਦਰ ਗਿਆ ਅਤੇ ਉਨ੍ਹਾਂ ਅੱਗੇ ਦੋ ਮੋਹਰਾਂ ਰੱਖ ਦਿੱਤੀਆਂ। ਤੇਗ ਬਹਾਦਰ ਜੀ ਨੇ ਮੁਸਕਰਾ ਕੇ ਕਿਹਾ, 'ਭਾਈ, ਦੋ ਮੋਹਰਾਂ ਨਾਲ ਨਹੀਂ ਸਰਨਾ। ਜੋ ਪੂਰੀ ਭੇਟਾ ਸੁੱਖੀ ਸੀ, ਉਹ ਦੇਣੀ ਪਵੇਗੀ।' ਫਿਰ ਉਨ੍ਹਾਂ ਨੇ ਮੱਖਣ ਸ਼ਾਹ ਨੂੰ ਆਪਣੇ ਮੋਢੇ ਉੱਤੇ ਨਿਸ਼ਾਨ ਵਿਖਾਏ। 'ਇਹ ਉਦੋਂ ਪਏ ਸਨ ਜਦੋਂ ਤੇਰਾ ਜਹਾਜ਼ ਸੂਰਤ ਨੇੜੇ ਫਸਿਆ ਸੀ ਅਤੇ ਤੂੰ ਅਰਦਾਸ ਕੀਤੀ ਸੀ। ਮੈਂ ਇਸ ਮੋਢੇ ਨਾਲ ਉਸ ਨੂੰ ਬੰਦਰਗਾਹ ਤੱਕ ਧੱਕਿਆ ਸੀ।'",
"ਮੱਖਣ ਸ਼ਾਹ ਦਾ ਦਿਲ ਖ਼ੁਸ਼ੀ ਨਾਲ ਭਰ ਗਿਆ। ਉਹ ਛੱਤ ਉੱਤੇ ਚੜ੍ਹ ਗਿਆ ਅਤੇ ਉੱਚੀ-ਉੱਚੀ ਹੋਕਾ ਦਿੱਤਾ, 'ਗੁਰੂ ਲਾਧੋ ਰੇ! ਗੁਰੂ ਲਾਧੋ ਰੇ! ਮੈਨੂੰ ਗੁਰੂ ਮਿਲ ਗਿਆ!' ਸਿੱਖ ਇਕੱਠੇ ਹੋ ਗਏ, ਉਸ ਦੀ ਕਹਾਣੀ ਸੁਣੀ, ਅਤੇ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਨੂੰ ਨੌਵੇਂ ਗੁਰੂ ਵਜੋਂ ਪਛਾਣ ਲਿਆ। ਝੂਠੇ ਗੁਰੂਆਂ ਦੇ ਪਿੱਛੇ ਕੋਈ ਨਾ ਰਿਹਾ।"],
l:"ਸੱਚ ਬਹੁਤੀ ਦੇਰ ਲੁਕਿਆ ਨਹੀਂ ਰਹਿੰਦਾ। ਸੱਚਾ ਗੁਰੂ ਨਿਮਰ ਹੁੰਦਾ ਹੈ, ਅਤੇ ਪਿਆਰ ਨਾਲ ਕੀਤੀ ਹਰ ਅਰਦਾਸ ਯਾਦ ਰੱਖਦਾ ਹੈ।"};

PA["visit-to-amritsar"]={t:[
"ਜਦੋਂ 1630 ਵਿੱਚ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਅੰਮ੍ਰਿਤਸਰ ਛੱਡ ਕੇ ਗਏ, ਉਨ੍ਹਾਂ ਨੇ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਦੀ ਸੰਭਾਲ ਲਈ ਸੇਵਾਦਾਰ ਛੱਡੇ। 1664 ਤੱਕ ਇਸ ਦਾ ਪ੍ਰਬੰਧ ਪ੍ਰਿਥੀ ਚੰਦ ਦੇ ਪੋਤਰੇ ਹਰਿ ਜੀ ਕੋਲ ਸੀ। ਹਰਿ ਜੀ ਆਪਣੀਆਂ ਕਵਿਤਾਵਾਂ ਲਿਖ ਕੇ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਵਿੱਚ ਇਉਂ ਗਵਾਉਂਦਾ ਸੀ ਜਿਵੇਂ ਉਹ ਗੁਰਬਾਣੀ ਹੋਣ। ਅੰਮ੍ਰਿਤਸਰ ਦੇ ਸਿੱਖ ਇਸ ਤੋਂ ਦੁਖੀ ਸਨ ਅਤੇ ਉਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਜੀ ਤੋਂ ਮਦਦ ਮੰਗੀ ਸੀ।",
"ਨਵੰਬਰ 1664 ਵਿੱਚ, ਗੁਰੂ ਬਣਨ ਤੋਂ ਛੇਤੀ ਬਾਅਦ, ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਦੇ ਦਰਸ਼ਨਾਂ ਲਈ ਅੰਮ੍ਰਿਤਸਰ ਆਏ। ਪਰ ਜਦੋਂ ਹਰਿ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਦੇ ਆਉਣ ਬਾਰੇ ਸੁਣਿਆ, ਉਸ ਨੇ ਆਪਣੇ ਮਸੰਦਾਂ ਨੂੰ ਦਰਵਾਜ਼ੇ ਨੂੰ ਤਾਲਾ ਲਾਉਣ ਲਈ ਕਹਿ ਦਿੱਤਾ।",
"ਗੁਰੂ ਜੀ ਨੇ ਦਰਵਾਜ਼ੇ ਬੰਦ ਵੇਖੇ। ਉਨ੍ਹਾਂ ਨੂੰ ਗੁੱਸਾ ਨਹੀਂ ਆਇਆ। ਉਨ੍ਹਾਂ ਨੇ ਸਿੱਖਾਂ ਨਾਲ ਪਵਿੱਤਰ ਸਰੋਵਰ ਵਿੱਚ ਇਸ਼ਨਾਨ ਕੀਤਾ ਅਤੇ ਅਕਾਲ ਤਖ਼ਤ ਦੇ ਨੇੜੇ ਇੱਕ ਛੋਟੇ ਥੜ੍ਹੇ ਉੱਤੇ ਬੈਠ ਗਏ, ਜਿੱਥੇ ਸਭ ਨੇ ਮਿਲ ਕੇ ਗੁਰਬਾਣੀ ਗਾਈ। ਉਸ ਥਾਂ ਨੂੰ ਅੱਜ ਗੁਰਦੁਆਰਾ ਥੜ੍ਹਾ ਸਾਹਿਬ ਵਜੋਂ ਯਾਦ ਕੀਤਾ ਜਾਂਦਾ ਹੈ।",
"ਮੱਖਣ ਸ਼ਾਹ ਨੂੰ ਬਹੁਤ ਗੁੱਸਾ ਆਇਆ। 'ਗੁਰੂ ਜੀ, ਆਗਿਆ ਦਿਓ, ਅਸੀਂ ਇਨ੍ਹਾਂ ਮਸੰਦਾਂ ਨੂੰ ਸਜ਼ਾ ਦੇਈਏ!' ਉਸ ਨੇ ਕਿਹਾ। ਗੁਰੂ ਜੀ ਨੇ ਸ਼ਾਂਤੀ ਨਾਲ ਜਵਾਬ ਦਿੱਤਾ, 'ਲਾਲਚ ਨੇ ਪਹਿਲਾਂ ਹੀ ਇਨ੍ਹਾਂ ਦੀ ਚੰਗਿਆਈ ਖੋਹ ਲਈ ਹੈ। ਇਨ੍ਹਾਂ ਨੂੰ ਸਜ਼ਾ ਦੇਣ ਦਾ ਕੋਈ ਲਾਭ ਨਹੀਂ।'",
"ਉਸ ਸ਼ਾਮ ਗੁਰੂ ਜੀ ਨੇੜਲੇ ਪਿੰਡ ਵੱਲੇ ਚਲੇ ਗਏ। ਜਦੋਂ ਅੰਮ੍ਰਿਤਸਰ ਦੇ ਸਿੱਖਾਂ ਨੂੰ ਪਤਾ ਲੱਗਾ ਕਿ ਗੁਰੂ ਜੀ ਨੂੰ ਦਰਵਾਜ਼ੇ ਤੋਂ ਮੋੜ ਦਿੱਤਾ ਗਿਆ, ਉਨ੍ਹਾਂ ਨੂੰ ਬਹੁਤ ਪਛਤਾਵਾ ਹੋਇਆ ਅਤੇ ਉਹ ਮਾਫ਼ੀ ਮੰਗਣ ਲਈ ਛੇਤੀ ਨਾਲ ਪਿੱਛੇ ਗਏ। ਅੰਮ੍ਰਿਤਸਰ ਦੀਆਂ ਬੀਬੀਆਂ ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਪਹੁੰਚੀਆਂ।",
"ਉਨ੍ਹਾਂ ਦਾ ਪਿਆਰ ਵੇਖ ਕੇ ਗੁਰੂ ਜੀ ਨੇ ਬਖ਼ਸ਼ਿਸ਼ ਕੀਤੀ: 'ਮਾਈਆਂ ਰੱਬ ਰਜਾਈਆਂ', ਜਿਸ ਦਾ ਅਰਥ ਹੈ 'ਧੰਨ ਹਨ ਇਹ ਬੀਬੀਆਂ, ਜਿਨ੍ਹਾਂ ਨੂੰ ਰੱਬ ਨੇ ਭਗਤੀ ਨਾਲ ਭਰ ਦਿੱਤਾ ਹੈ।' ਸਿੱਖਾਂ ਨੇ ਬੇਨਤੀ ਕੀਤੀ ਕਿ ਅੰਮ੍ਰਿਤਸਰ ਵਾਪਸ ਚੱਲੋ, ਪਰ ਗੁਰੂ ਜੀ ਤਿੰਨ ਦਿਨ ਵੱਲੇ ਰਹਿ ਕੇ ਸੰਗਤ ਨੂੰ ਉਪਦੇਸ਼ ਦਿੰਦੇ ਰਹੇ, ਅਤੇ ਫਿਰ ਤਰਨ ਤਾਰਨ ਵੱਲ ਚਲੇ ਗਏ।"],
l:"ਬੁਰੇ ਵਿਹਾਰ ਦਾ ਜਵਾਬ ਗੁੱਸੇ ਨਾਲ ਨਹੀਂ, ਸਬਰ ਨਾਲ ਦਿਓ। ਸੱਚੇ ਪਿਆਰ ਅਤੇ ਸ਼ਰਧਾ ਨੂੰ ਗੁਰੂ ਹਮੇਸ਼ਾ ਵੇਖਦਾ ਹੈ।"};

PA["building-anandpur"]={t:[
"1665 ਵਿੱਚ ਪਹਾੜੀ ਰਿਆਸਤ ਕਹਿਲੂਰ ਦੇ ਰਾਜਾ ਦੀਪ ਚੰਦ ਦਾ ਦੇਹਾਂਤ ਹੋ ਗਿਆ। ਉਨ੍ਹਾਂ ਦਾ ਪਰਿਵਾਰ ਗੁਰੂ ਸਾਹਿਬਾਨ ਦਾ ਬਹੁਤ ਸਤਿਕਾਰ ਕਰਦਾ ਸੀ, ਕਿਉਂਕਿ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਨੇ ਇੱਕ ਵਾਰ ਉਨ੍ਹਾਂ ਦੇ ਪਿਤਾ ਰਾਜਾ ਤਾਰਾ ਚੰਦ ਨੂੰ ਗਵਾਲੀਅਰ ਦੇ ਕਿਲ੍ਹੇ ਤੋਂ ਰਿਹਾਅ ਕਰਾਉਣ ਵਿੱਚ ਮਦਦ ਕੀਤੀ ਸੀ। ਇਸ ਲਈ ਰਾਣੀ ਨੇ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਨੂੰ ਆਪਣੇ ਪਤੀ ਦੀ ਅੰਤਿਮ ਅਰਦਾਸ ਉੱਤੇ ਸੱਦਿਆ।",
"ਰਸਮ ਤੋਂ ਬਾਅਦ ਗੁਰੂ ਜੀ ਨੇ ਮਾਖੋਵਾਲ ਨਾਂ ਦੇ ਪਿੰਡ ਵਿੱਚ ਜ਼ਮੀਨ ਖ਼ਰੀਦਣ ਦੀ ਇੱਛਾ ਪ੍ਰਗਟਾਈ। ਰਾਣੀ ਇਹ ਜ਼ਮੀਨ ਤੋਹਫ਼ੇ ਵਜੋਂ ਦੇਣਾ ਚਾਹੁੰਦੀ ਸੀ, ਪਰ ਗੁਰੂ ਜੀ ਨੇ ਮੁਫ਼ਤ ਜ਼ਮੀਨ ਨਾ ਲਈ। ਉਨ੍ਹਾਂ ਨੇ ਪੰਜ ਸੌ ਰੁਪਏ ਦਿੱਤੇ, ਅਤੇ ਜ਼ਮੀਨ ਉਨ੍ਹਾਂ ਦੇ ਨਾਂ ਹੋ ਗਈ।",
"ਗੁਰੂ ਜੀ ਨੇ ਇਹ ਥਾਂ ਸੋਚ-ਸਮਝ ਕੇ ਚੁਣੀ। ਇਹ ਪਹਾੜੀਆਂ ਵਿੱਚ ਸੀ, ਇੱਕ ਪਾਸੇ ਸਤਲੁਜ ਦਰਿਆ, ਦੂਜੇ ਪਾਸੇ ਸਿਰਸਾ ਨਦੀ, ਅਤੇ ਚਾਰੇ ਪਾਸੇ ਪਹਾੜੀਆਂ ਅਤੇ ਜੰਗਲ, ਜਿਵੇਂ ਇੱਕ ਕੁਦਰਤੀ ਕਿਲ੍ਹਾ ਹੋਵੇ। ਉਹ ਜਾਣਦੇ ਸਨ ਕਿ ਮੁਗ਼ਲ ਬਾਦਸ਼ਾਹ ਔਰੰਗਜ਼ੇਬ ਜ਼ਾਲਮ ਹੁੰਦਾ ਜਾ ਰਿਹਾ ਹੈ, ਅਤੇ ਸਿੱਖਾਂ ਨੂੰ ਇੱਕ ਦਿਨ ਅਜਿਹੇ ਸੁਰੱਖਿਅਤ ਘਰ ਦੀ ਲੋੜ ਪੈ ਸਕਦੀ ਹੈ ਜਿਸ ਦੀ ਉਹ ਰੱਖਿਆ ਕਰ ਸਕਣ।",
"19 ਜੂਨ 1665 ਨੂੰ ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਦੇ ਪੋਤਰੇ, ਬਾਬਾ ਗੁਰਦਿੱਤਾ ਜੀ, ਨੇ ਨੀਂਹ ਪੱਥਰ ਰੱਖਿਆ। ਗੁਰੂ ਜੀ ਨੇ ਆਪਣੇ ਮਾਤਾ ਜੀ, ਮਾਤਾ ਨਾਨਕੀ ਜੀ, ਦੇ ਨਾਂ ਉੱਤੇ ਨਵੇਂ ਨਗਰ ਦਾ ਨਾਂ ਚੱਕ ਨਾਨਕੀ ਰੱਖਿਆ।",
"ਗੁਰੂ ਜੀ ਨੇ ਨਗਰ ਦਾ ਨਕਸ਼ਾ ਆਪ ਬਣਾਇਆ। ਉਨ੍ਹਾਂ ਨੇ ਬਾਜ਼ਾਰ, ਸਿੱਖਾਂ ਦੇ ਘਰ, ਚਾਰ ਚੌਂਕ ਅਤੇ ਇੱਟਾਂ ਵਾਲੀਆਂ ਗਲੀਆਂ ਇਸ ਤਰ੍ਹਾਂ ਵਿਉਂਤੀਆਂ ਕਿ ਨਗਰ ਮਜ਼ਬੂਤ ਹੋਵੇ ਅਤੇ ਉਸ ਉੱਤੇ ਹਮਲਾ ਕਰਨਾ ਔਖਾ ਹੋਵੇ।",
"ਕਈ ਸਾਲਾਂ ਬਾਅਦ, ਜਦੋਂ ਬਾਲ ਗੋਬਿੰਦ ਰਾਏ ਪਟਨੇ ਤੋਂ ਇੱਥੇ ਰਹਿਣ ਆਏ, ਇਹ ਨਗਰ ਅਨੰਦਪੁਰ, ਭਾਵ ਅਨੰਦ ਦਾ ਨਗਰ, ਵਜੋਂ ਜਾਣਿਆ ਜਾਣ ਲੱਗਾ। ਇੱਥੇ ਹੀ 1699 ਵਿੱਚ ਖ਼ਾਲਸੇ ਦੀ ਸਾਜਨਾ ਹੋਈ।"],
l:"ਚੰਗੇ ਆਗੂ ਅੱਗੇ ਦੀ ਸੋਚਦੇ ਹਨ ਅਤੇ ਅਜਿਹੀਆਂ ਥਾਵਾਂ ਬਣਾਉਂਦੇ ਹਨ ਜਿੱਥੇ ਲੋਕ ਸੁਰੱਖਿਅਤ ਅਤੇ ਖ਼ੁਸ਼ ਰਹਿ ਸਕਣ। ਤੋਹਫ਼ਾ ਮਿਲਣ ਵੇਲੇ ਵੀ ਈਮਾਨਦਾਰੀ ਨਾਲ ਲੈਣ-ਦੇਣ ਕਰਨਾ ਜ਼ਰੂਰੀ ਹੈ।"};

PA["sayad-moosa"]={t:[
"ਜਦੋਂ ਅਨੰਦਪੁਰ ਵਸਾਇਆ ਜਾ ਰਿਹਾ ਸੀ, ਰੋਪੜ ਦਾ ਇੱਕ ਆਦਮੀ, ਸੱਯਦ ਮੂਸਾ, ਉੱਥੋਂ ਲੰਘਿਆ। ਉਸ ਨੇ ਉੱਚੀਆਂ ਇਮਾਰਤਾਂ ਬਣਦੀਆਂ ਵੇਖੀਆਂ ਅਤੇ ਇੱਕ ਸਿੱਖ ਤੋਂ ਪੁੱਛਿਆ, 'ਇਹ ਮਹਿਲਾਂ ਵਰਗੇ ਵੱਡੇ ਘਰ ਕੌਣ ਬਣਾ ਰਿਹਾ ਹੈ?'",
"'ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ, ਜੋ ਸਿੱਖਾਂ ਨੂੰ ਗੁਰੂ ਨਾਨਕ ਦੇ ਰਾਹ ਉੱਤੇ ਤੋਰਦੇ ਹਨ,' ਸਿੱਖ ਨੇ ਜਵਾਬ ਦਿੱਤਾ। ਸੱਯਦ ਮੂਸਾ ਨੇ ਕਿਹਾ, 'ਬਾਬਾ ਨਾਨਕ ਇੱਕ ਮਹਾਨ ਫ਼ਕੀਰ ਸਨ। ਕੀ ਇਹ ਗੁਰੂ ਵੀ ਉਨ੍ਹਾਂ ਵਰਗੇ ਹਨ?' 'ਹਾਂ,' ਸਿੱਖ ਨੇ ਕਿਹਾ। 'ਇਨ੍ਹਾਂ ਵਿੱਚ ਗੁਰੂ ਨਾਨਕ ਦੀ ਜੋਤ ਹੈ, ਅਤੇ ਇਨ੍ਹਾਂ ਨੂੰ ਧਨ-ਦੌਲਤ ਦਾ ਮੋਹ ਨਹੀਂ।'",
"ਸੱਯਦ ਮੂਸਾ ਉਲਝਣ ਵਿੱਚ ਪੈ ਗਿਆ। 'ਜੇ ਇਨ੍ਹਾਂ ਨੂੰ ਧਨ ਦਾ ਮੋਹ ਨਹੀਂ, ਤਾਂ ਇਹ ਵੱਡੇ ਘਰ ਕਿਉਂ ਬਣਾ ਰਹੇ ਹਨ? ਕੀ ਇਹ ਪਰਿਵਾਰ ਨਾਲ ਰਹਿੰਦੇ ਹਨ, ਜਾਂ ਇਨ੍ਹਾਂ ਨੇ ਦੁਨੀਆ ਤਿਆਗ ਦਿੱਤੀ ਹੈ?' ਸਿੱਖ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, 'ਗੁਰੂ ਨਾਨਕ ਵਾਂਗ, ਇਹ ਪਰਿਵਾਰ ਵਿੱਚ ਰਹਿੰਦੇ ਹਨ, ਫਿਰ ਵੀ ਇਨ੍ਹਾਂ ਦਾ ਮਨ ਨਿਰਲੇਪ ਹੈ।' ਸੱਯਦ ਮੂਸਾ ਉਨ੍ਹਾਂ ਨੂੰ ਮਿਲ ਕੇ ਆਪਣਾ ਸ਼ੰਕਾ ਦੂਰ ਕਰਨਾ ਚਾਹੁੰਦਾ ਸੀ।",
"ਗੁਰੂ ਜੀ ਨੇ ਉਸ ਦਾ ਨਿੱਘਾ ਸੁਆਗਤ ਕੀਤਾ ਅਤੇ ਕੋਲ ਬਿਠਾਇਆ। ਸੱਯਦ ਮੂਸਾ ਨੇ ਆਪਣਾ ਸਵਾਲ ਪੁੱਛਿਆ। ਗੁਰੂ ਜੀ ਨੇ ਮੁਸਕਰਾ ਕੇ ਕਿਹਾ, 'ਅੱਜ ਰਾਤ ਸਾਡੇ ਕੋਲ ਰਹੋ। ਸਵੇਰ ਤੱਕ ਤੁਹਾਨੂੰ ਜਵਾਬ ਮਿਲ ਜਾਵੇਗਾ।'",
"ਉਸ ਸ਼ਾਮ ਸੱਯਦ ਮੂਸਾ ਨੇ ਲੰਗਰ ਛਕਿਆ। ਇੱਕ ਸੇਵਾਦਾਰ ਨੇ ਉਸ ਨੂੰ ਮੰਜਾ ਅਤੇ ਬਿਸਤਰਾ ਦਿੱਤਾ, ਅਤੇ ਉਹ ਇੱਕ ਕਮਰੇ ਵਿੱਚ ਸੌਂ ਗਿਆ। ਰਾਤ ਨੂੰ ਭਾਰੀ ਮੀਂਹ ਅਤੇ ਤੇਜ਼ ਹਵਾ ਨਾਲ ਉਸ ਦੀ ਜਾਗ ਖੁੱਲ੍ਹ ਗਈ। ਉਹ ਲੇਟਿਆ ਸੁਣਦਾ ਰਿਹਾ ਅਤੇ ਸੋਚਣ ਲੱਗਾ, 'ਜੇ ਮੈਂ ਇਸ ਤੂਫ਼ਾਨ ਵਿੱਚ ਬਾਹਰ ਹੁੰਦਾ ਤਾਂ ਮੇਰਾ ਕੀ ਹਾਲ ਹੁੰਦਾ?'",
"ਤਦ ਉਹ ਸਮਝ ਗਿਆ। ਕਮਰਾ, ਮੰਜਾ, ਬਿਸਤਰਾ ਅਤੇ ਭੋਜਨ, ਸਭ ਕੁਝ ਆਮ ਗ੍ਰਿਹਸਤੀਆਂ ਦਾ ਦਿੱਤਾ ਹੋਇਆ ਸੀ ਜੋ ਆਪਣੀ ਕਮਾਈ ਵੰਡ ਕੇ ਛਕਦੇ ਹਨ। ਗੁਰੂ ਜੀ ਉਸ ਭੇਟਾ ਨੂੰ ਸਭ ਦੀ ਸੰਭਾਲ ਲਈ ਵਰਤਦੇ ਸਨ, ਆਪਣੇ ਲਈ ਧਨ ਇਕੱਠਾ ਕਰਨ ਲਈ ਨਹੀਂ। ਸਵੇਰੇ ਉਸ ਨੇ ਕਿਹਾ, 'ਗੁਰੂ ਜੀ, ਮੇਰਾ ਸ਼ੰਕਾ ਦੂਰ ਹੋ ਗਿਆ। ਕਿਰਤ ਕਰਨ ਅਤੇ ਵੰਡ ਛਕਣ ਵਾਲੇ ਗ੍ਰਿਹਸਤੀ ਹੀ ਸੰਤਾਂ ਅਤੇ ਮੁਸਾਫ਼ਰਾਂ ਨੂੰ ਵੀ ਰੋਟੀ ਅਤੇ ਛੱਤ ਦਿੰਦੇ ਹਨ।'"],
l:"ਰੱਬ ਦੇ ਨੇੜੇ ਹੋਣ ਲਈ ਪਰਿਵਾਰ ਛੱਡਣ ਦੀ ਲੋੜ ਨਹੀਂ। ਕਿਰਤ ਕਰਨ ਅਤੇ ਵੰਡ ਛਕਣ ਵਾਲਾ ਈਮਾਨਦਾਰ ਗ੍ਰਿਹਸਤ ਜੀਵਨ ਵੀ ਰੱਬ ਤੱਕ ਪਹੁੰਚਣ ਦਾ ਰਾਹ ਹੈ।"};

PA["lehna-meets-guru-nanak"]={t:[
"ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ ਦਾ ਜਨਮ 1504 ਵਿੱਚ ਮੱਤੇ ਦੀ ਸਰਾਂ ਪਿੰਡ ਵਿੱਚ ਹੋਇਆ। ਮਾਤਾ-ਪਿਤਾ ਨੇ ਉਨ੍ਹਾਂ ਦਾ ਨਾਂ ਲਹਿਣਾ ਰੱਖਿਆ। ਪਿਤਾ, ਭਾਈ ਫੇਰੂ ਮੱਲ ਜੀ, ਪੜ੍ਹੇ-ਲਿਖੇ ਸਨ ਅਤੇ ਖ਼ਜ਼ਾਨਚੀ ਦਾ ਕੰਮ ਕਰਦੇ ਸਨ, ਇਸ ਲਈ ਲਹਿਣਾ ਜੀ ਨੂੰ ਚੰਗੀ ਵਿੱਦਿਆ ਮਿਲੀ। ਪੰਦਰਾਂ ਸਾਲ ਦੀ ਉਮਰ ਵਿੱਚ ਉਨ੍ਹਾਂ ਦਾ ਵਿਆਹ ਖਡੂਰ ਦੇ ਮਾਤਾ ਖੀਵੀ ਜੀ ਨਾਲ ਹੋਇਆ। ਜਦੋਂ ਬਾਬਰ ਦੇ ਹਮਲੇ ਵਿੱਚ ਉਨ੍ਹਾਂ ਦਾ ਪਿੰਡ ਉੱਜੜ ਗਿਆ, ਪਰਿਵਾਰ ਖਡੂਰ ਆ ਗਿਆ ਅਤੇ ਉੱਥੇ ਹੱਟੀ ਖੋਲ੍ਹ ਲਈ।",
"ਭਾਈ ਫੇਰੂ ਮੱਲ ਜੀ ਵੈਸ਼ਨੋ ਦੇਵੀ ਦੇ ਸ਼ਰਧਾਲੂ ਸਨ, ਅਤੇ ਹਰ ਸਾਲ ਪਿੰਡ ਵਾਲਿਆਂ ਦਾ ਜਥਾ ਲੈ ਕੇ ਉੱਥੇ ਯਾਤਰਾ ਉੱਤੇ ਜਾਂਦੇ ਸਨ। ਪਿਤਾ ਜੀ ਦੇ ਚਲਾਣੇ ਤੋਂ ਬਾਅਦ ਲਹਿਣਾ ਜੀ ਆਪ ਜਥੇ ਦੀ ਅਗਵਾਈ ਕਰਨ ਲੱਗੇ।",
"ਖਡੂਰ ਵਿੱਚ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦੇ ਇੱਕ ਸਿੱਖ, ਭਾਈ ਜੋਧ ਜੀ, ਰਹਿੰਦੇ ਸਨ। ਇੱਕ ਦਿਨ ਲਹਿਣਾ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਆਪਣੀ ਪੰਜਾਬੀ ਬੋਲੀ ਵਿੱਚ ਰੱਬ ਦੀ ਸਿਫ਼ਤ ਵਾਲੀ ਗੁਰੂ ਨਾਨਕ ਦੀ ਬਾਣੀ ਗਾਉਂਦਿਆਂ ਸੁਣਿਆ। ਲਹਿਣਾ ਜੀ ਦਾ ਮਨ ਡੂੰਘਾ ਪ੍ਰਭਾਵਿਤ ਹੋਇਆ ਅਤੇ ਉਨ੍ਹਾਂ ਨੇ ਫ਼ੈਸਲਾ ਕੀਤਾ ਕਿ ਗੁਰੂ ਨਾਨਕ ਦੇ ਦਰਸ਼ਨ ਜ਼ਰੂਰ ਕਰਨੇ ਹਨ।",
"1532 ਵਿੱਚ ਯਾਤਰਾ ਨੂੰ ਜਾਂਦਿਆਂ, ਲਹਿਣਾ ਜੀ ਕਰਤਾਰਪੁਰ ਦੇ ਨੇੜੇ ਰੁਕੇ। ਉਨ੍ਹਾਂ ਨੇ ਜਥੇ ਨੂੰ ਕਿਹਾ ਕਿ ਛੇਤੀ ਮੁੜ ਆਵਾਂਗਾ ਅਤੇ ਘੋੜੇ ਉੱਤੇ ਪਿੰਡ ਵੱਲ ਤੁਰ ਪਏ। ਰਾਹ ਵਿੱਚ ਉਨ੍ਹਾਂ ਨੂੰ ਖੇਤਾਂ ਤੋਂ ਘਰ ਮੁੜਦਾ ਇੱਕ ਬਜ਼ੁਰਗ ਮਿਲਿਆ, ਅਤੇ ਉਨ੍ਹਾਂ ਨੇ ਉਸ ਤੋਂ ਗੁਰੂ ਨਾਨਕ ਦੀ ਧਰਮਸਾਲ ਦਾ ਰਾਹ ਪੁੱਛਿਆ। ਬਜ਼ੁਰਗ ਨੇ ਮੁਸਕਰਾ ਕੇ ਕਿਹਾ, 'ਮੇਰੇ ਪਿੱਛੇ ਆ ਜਾਓ। ਮੈਂ ਵੀ ਉੱਥੇ ਹੀ ਜਾ ਰਿਹਾ ਹਾਂ।'",
"ਜਦੋਂ ਉਹ ਦਰਵਾਜ਼ੇ ਉੱਤੇ ਪਹੁੰਚੇ, ਬਜ਼ੁਰਗ ਨੇ ਕਿਹਾ, 'ਆਪਣਾ ਘੋੜਾ ਉਸ ਕਿੱਲੇ ਨਾਲ ਬੰਨ੍ਹ ਕੇ ਅੰਦਰ ਆ ਜਾਓ।' ਲਹਿਣਾ ਜੀ ਅੰਦਰ ਗਏ, ਅਤੇ ਵੇਖਿਆ ਕਿ ਗੁਰੂ ਦੀ ਗੱਦੀ ਉੱਤੇ ਉਹੀ ਬਜ਼ੁਰਗ ਬੈਠੇ ਸਨ ਜੋ ਉਨ੍ਹਾਂ ਦੇ ਘੋੜੇ ਦੇ ਨਾਲ-ਨਾਲ ਪੈਦਲ ਆਏ ਸਨ! ਲਹਿਣਾ ਜੀ ਨੇ ਮੱਥਾ ਟੇਕਿਆ ਅਤੇ ਸ਼ਰਮਿੰਦੇ ਹੋ ਕੇ ਇੱਕ ਪਾਸੇ ਚੁੱਪ ਕਰਕੇ ਬੈਠ ਗਏ। 'ਮੈਂ ਘੋੜੇ ਉੱਤੇ ਸਵਾਰ ਸੀ ਅਤੇ ਗੁਰੂ ਜੀ ਪੈਦਲ ਤੁਰ ਰਹੇ ਸਨ,' ਉਨ੍ਹਾਂ ਨੇ ਸੋਚਿਆ।",
"ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਨੇ ਪਿਆਰ ਨਾਲ ਪੁੱਛਿਆ, 'ਭਾਈ, ਤੇਰਾ ਨਾਂ ਕੀ ਹੈ?' 'ਲਹਿਣਾ,' ਉਨ੍ਹਾਂ ਨੇ ਜਵਾਬ ਦਿੱਤਾ। 'ਮੈਂ ਪਿੰਡ ਵਾਲਿਆਂ ਨੂੰ ਯਾਤਰਾ ਉੱਤੇ ਲੈ ਕੇ ਜਾ ਰਿਹਾ ਹਾਂ।' ਗੁਰੂ ਜੀ ਮੁਸਕਰਾਏ। 'ਲਹਿਣਾ ਦਾ ਅਰਥ ਹੈ ਲੈਣ ਵਾਲਾ। ਤੂੰ ਲੈਣ ਆਇਆ ਹੈਂ, ਅਤੇ ਮੈਂ ਇੱਥੇ ਦੇਣ ਲਈ ਹਾਂ। ਉਸ ਇੱਕ ਕਰਤਾਰ ਦੀ ਸੇਵਾ ਕਰ, ਜੋ ਸਭ ਨੂੰ ਦਿੰਦਾ ਹੈ।' ਲਹਿਣਾ ਜੀ ਦਾ ਮਨ ਭਰ ਗਿਆ। ਉਨ੍ਹਾਂ ਨੇ ਜਥੇ ਨੂੰ ਕਿਹਾ, 'ਤੁਸੀਂ ਮੇਰੇ ਬਿਨਾਂ ਅੱਗੇ ਚਲੇ ਜਾਓ। ਜੋ ਮੈਂ ਲੱਭ ਰਿਹਾ ਸੀ, ਮੈਨੂੰ ਸਭ ਮਿਲ ਗਿਆ ਹੈ।'"],
l:"ਸੱਚੀ ਵਡਿਆਈ ਨਿਮਰ ਹੁੰਦੀ ਹੈ। ਜਦੋਂ ਸਾਨੂੰ ਅਸਲ ਗਿਆਨ ਮਿਲੇ, ਸਾਨੂੰ ਉਸ ਤੋਂ ਸਿੱਖਣ ਲਈ ਤਿਆਰ ਰਹਿਣਾ ਚਾਹੀਦਾ ਹੈ।"};

PA["bundle-of-grass"]={t:[
"ਲਹਿਣਾ ਜੀ, ਜੋ ਅੱਗੇ ਚੱਲ ਕੇ ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ ਬਣੇ, ਖਡੂਰ ਦੇ ਇੱਕ ਹੱਟੀ ਵਾਲੇ ਸਨ। ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਨੂੰ ਪਹਿਲੀ ਵਾਰ ਮਿਲਣ ਤੋਂ ਬਾਅਦ ਉਹ ਕੁਝ ਦਿਨ ਕਰਤਾਰਪੁਰ ਰਹੇ, ਗੁਰਬਾਣੀ ਦੇ ਅਨੰਦ ਵਿੱਚ ਮਗਨ। ਫਿਰ ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਘਰ ਜਾ ਕੇ ਪਰਿਵਾਰ ਨੂੰ ਦੱਸ ਆ, ਫਿਰ ਮੁੜ ਆਈਂ।' ਲਹਿਣਾ ਜੀ ਖਡੂਰ ਗਏ, ਹੱਟੀ ਆਪਣੇ ਪੁੱਤਰ ਦਾਸੂ ਨੂੰ ਸੌਂਪ ਦਿੱਤੀ, ਅਤੇ ਮਾਤਾ ਖੀਵੀ ਜੀ ਨੂੰ ਦੱਸਿਆ ਕਿ ਉਹ ਗੁਰੂ ਜੀ ਕੋਲ ਵਾਪਸ ਜਾ ਰਹੇ ਹਨ।",
"ਉਹ ਲੰਗਰ ਲਈ ਭੇਟਾ ਵਜੋਂ ਲੂਣ ਦੀ ਭਾਰੀ ਪੰਡ ਸਿਰ ਉੱਤੇ ਚੁੱਕ ਕੇ ਤੁਰ ਪਏ। ਮਾਤਾ ਖੀਵੀ ਜੀ ਨੇ ਕਿਹਾ, 'ਕਿਸੇ ਮਜ਼ਦੂਰ ਨੂੰ ਪੈਸੇ ਦੇ ਕੇ ਕਿਉਂ ਨਹੀਂ ਚੁਕਵਾ ਲੈਂਦੇ?' ਲਹਿਣਾ ਜੀ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, 'ਕੰਮ ਤਾਂ ਪੈਸੇ ਦੇ ਕੇ ਕਰਵਾਇਆ ਜਾ ਸਕਦਾ ਹੈ, ਪਰ ਸੇਵਾ ਆਪ ਕਰੀਦੀ ਹੈ।'",
"ਕਰਤਾਰਪੁਰ ਪਹੁੰਚ ਕੇ ਲਹਿਣਾ ਜੀ ਨੇ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਨੂੰ ਝੋਨੇ ਦੇ ਖੇਤਾਂ ਵਿੱਚ ਵੇਖਿਆ, ਜਿੱਥੇ ਗਿੱਲੀ ਮਿੱਟੀ ਵਿੱਚੋਂ ਨਦੀਨ ਕੱਢਿਆ ਜਾ ਰਿਹਾ ਸੀ। ਗੁਰੂ ਜੀ ਨੇ ਨਦੀਨ ਦੀ ਇੱਕ ਵੱਡੀ, ਚੋਂਦੀ ਪੰਡ ਲਹਿਣਾ ਜੀ ਦੇ ਸਿਰ ਉੱਤੇ ਰੱਖੀ ਅਤੇ ਕਿਹਾ, 'ਇਹ ਪਿੰਡ ਘਰ ਲੈ ਚੱਲ।' ਚਿੱਕੜ ਵਾਲਾ ਪਾਣੀ ਹੇਠਾਂ ਵਗ ਕੇ ਉਨ੍ਹਾਂ ਦੇ ਸੋਹਣੇ ਨਵੇਂ ਕੱਪੜਿਆਂ ਉੱਤੇ ਦਾਗ਼ ਪਾ ਗਿਆ।",
"ਘਰ ਪਹੁੰਚ ਕੇ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦੇ ਮਹਿਲ, ਮਾਤਾ ਸੁਲੱਖਣੀ ਜੀ ਨੇ ਕਿਹਾ, 'ਤੁਸੀਂ ਇਸ ਭਲੇ ਪੁਰਖ ਦੇ ਕੱਪੜੇ ਖ਼ਰਾਬ ਕਰ ਦਿੱਤੇ! ਇਹ ਤਾਂ ਕੋਈ ਮਜ਼ਦੂਰ ਵੀ ਚੁੱਕ ਸਕਦਾ ਸੀ।' ਗੁਰੂ ਜੀ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, 'ਫਿਰ ਵੇਖੋ। ਇਹ ਚਿੱਕੜ ਨਹੀਂ, ਕੇਸਰ ਹੈ।' ਜਦੋਂ ਮਾਤਾ ਜੀ ਨੇ ਦੁਬਾਰਾ ਵੇਖਿਆ, ਦਾਗ਼ ਕੇਸਰ ਵਾਂਗ ਚਮਕ ਰਹੇ ਸਨ, ਜੋ ਸਨਮਾਨ ਦਾ ਰੰਗ ਹੈ।",
"ਗੁਰੂ ਜੀ ਨੇ ਲਹਿਣਾ ਜੀ ਦੀ ਹੋਰ ਤਰੀਕਿਆਂ ਨਾਲ ਵੀ ਪਰਖ ਕੀਤੀ। ਉਨ੍ਹਾਂ ਦਿਨਾਂ ਵਿੱਚ ਕੁਝ ਕੰਮਾਂ ਨੂੰ ਨੀਵਾਂ ਸਮਝਿਆ ਜਾਂਦਾ ਸੀ ਅਤੇ ਸਿਰਫ਼ ਸਭ ਤੋਂ ਗਰੀਬ ਲੋਕਾਂ ਉੱਤੇ ਛੱਡ ਦਿੱਤੇ ਜਾਂਦੇ ਸਨ। ਇੱਕ ਵਾਰ ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਮਰਿਆ ਚੂਹਾ ਬਾਹਰ ਸੁੱਟਣ ਲਈ ਕਿਹਾ, ਅਤੇ ਉਨ੍ਹਾਂ ਨੇ ਤੁਰੰਤ ਸੁੱਟ ਦਿੱਤਾ। ਇੱਕ ਹੋਰ ਦਿਨ ਗੁਰੂ ਜੀ ਦਾ ਕਟੋਰਾ ਚਿੱਕੜ ਭਰੇ ਟੋਏ ਵਿੱਚ ਡਿੱਗ ਪਿਆ, ਅਤੇ ਲਹਿਣਾ ਜੀ ਸਿੱਧੇ ਅੰਦਰ ਵੜ ਕੇ ਕੱਢ ਲਿਆਏ। ਉਨ੍ਹਾਂ ਨੇ ਕਦੇ ਕਿਸੇ ਕੰਮ ਨੂੰ ਆਪਣੇ ਤੋਂ ਨੀਵਾਂ ਨਹੀਂ ਸਮਝਿਆ।",
"ਇੱਕ ਦਿਨ ਗੁਰੂ ਜੀ ਭਾਰੀ ਸੋਟਾ ਘੁਮਾਉਂਦੇ ਹੋਏ ਜੰਗਲ ਵੱਲ ਤੁਰ ਪਏ, ਅਤੇ ਪਿੱਛੇ ਆਉਣ ਵਾਲੇ ਸਾਰੇ ਡਰ ਕੇ ਮੁੜ ਗਏ। ਸਿਰਫ਼ ਲਹਿਣਾ ਜੀ ਉਨ੍ਹਾਂ ਦੇ ਪਿੱਛੇ ਤੁਰਦੇ ਰਹੇ। 'ਤੂੰ ਹੋਰਨਾਂ ਵਾਂਗ ਮੁੜਿਆ ਕਿਉਂ ਨਹੀਂ?' ਗੁਰੂ ਜੀ ਨੇ ਪੁੱਛਿਆ। ਲਹਿਣਾ ਜੀ ਨੇ ਕਿਹਾ, 'ਉਨ੍ਹਾਂ ਕੋਲ ਜਾਣ ਲਈ ਹੋਰ ਥਾਵਾਂ ਹਨ। ਮੇਰਾ ਤਾਂ ਤੁਹਾਡੇ ਬਿਨਾਂ ਕੋਈ ਨਹੀਂ।' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਹੁਣ ਸਾਡੇ ਵਿੱਚ ਕੋਈ ਫ਼ਰਕ ਨਹੀਂ। ਤੂੰ ਮੇਰਾ ਅੰਗ ਬਣ ਗਿਆ ਹੈਂ।' ਇਸੇ ਤਰ੍ਹਾਂ ਲਹਿਣਾ ਜੀ ਦਾ ਨਾਂ ਅੰਗਦ ਪਿਆ।"],
l:"ਸੇਵਾ ਸਮਝ ਕੇ ਕੀਤਾ ਕੋਈ ਵੀ ਕੰਮ ਛੋਟਾ ਜਾਂ ਗੰਦਾ ਨਹੀਂ ਹੁੰਦਾ। ਜਦੋਂ ਹੋਰ ਹਾਰ ਮੰਨ ਲੈਣ, ਤਦ ਵੀ ਵਫ਼ਾਦਾਰ ਰਹਿਣਾ ਸੱਚੀ ਸ਼ਰਧਾ ਹੈ।"};

PA["teacher-of-khadur"]={t:[
"1539 ਵਿੱਚ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਨੇ ਭਾਈ ਅੰਗਦ ਜੀ ਨੂੰ ਦੂਜੇ ਗੁਰੂ ਥਾਪਿਆ। ਉਨ੍ਹਾਂ ਨੇ ਆਪ ਉਨ੍ਹਾਂ ਅੱਗੇ ਮੱਥਾ ਟੇਕਿਆ ਅਤੇ ਸਾਰੀ ਸੰਗਤ ਨੂੰ ਵੀ ਇਉਂ ਕਰਨ ਲਈ ਕਿਹਾ। ਉਨ੍ਹਾਂ ਨੇ ਆਪਣੀ ਬਾਣੀ ਅਤੇ ਇਕੱਠੀ ਕੀਤੀ ਭਗਤ ਬਾਣੀ ਵਾਲੀ ਪੋਥੀ ਵੀ ਉਨ੍ਹਾਂ ਨੂੰ ਸੌਂਪੀ, ਅਤੇ ਖਡੂਰ ਜਾ ਕੇ ਉੱਥੇ ਗੁਰੂ ਦਾ ਉਪਦੇਸ਼ ਵੰਡਣ ਲਈ ਕਿਹਾ।",
"ਪਰ ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ ਬਹੁਤ ਨਿਮਰ ਸਨ। ਉਹ ਚੁੱਪ-ਚਾਪ ਖਡੂਰ ਵਿੱਚ ਇੱਕ ਬਜ਼ੁਰਗ ਮਾਈ, ਮਾਈ ਭਿਰਾਈ, ਦੇ ਘਰ ਚਲੇ ਗਏ ਅਤੇ ਕਿਸੇ ਨੂੰ ਨਾ ਦੱਸਿਆ। ਲਗਭਗ ਛੇ ਮਹੀਨੇ ਉਨ੍ਹਾਂ ਨੇ ਕੋਈ ਦੀਵਾਨ ਨਹੀਂ ਲਾਇਆ ਅਤੇ ਸਿਮਰਨ ਵਿੱਚ ਲੀਨ ਰਹੇ। ਸਿੱਖ ਉਨ੍ਹਾਂ ਨੂੰ ਲੱਭਦੇ ਕਰਤਾਰਪੁਰ ਆਉਂਦੇ ਅਤੇ ਨਿਰਾਸ਼ ਹੋ ਕੇ ਮੁੜ ਜਾਂਦੇ।",
"ਅਖ਼ੀਰ ਸਿੱਖਾਂ ਨੇ ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਤੋਂ ਮਦਦ ਮੰਗੀ, ਅਤੇ ਉਹ ਉਨ੍ਹਾਂ ਨੂੰ ਖਡੂਰ ਲੈ ਆਏ। ਜਦੋਂ ਮਾਈ ਭਿਰਾਈ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਵੇਖਿਆ, ਉਹ ਕੁਝ ਨਾ ਬੋਲੀ, ਅਤੇ ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਸਮਝ ਗਏ ਕਿ ਗੁਰੂ ਜੀ ਉਸ ਦੇ ਘਰ ਹਨ। ਸਿੱਖ ਬਾਹਰ ਬੈਠ ਕੇ ਗੁਰਬਾਣੀ ਗਾਉਣ ਲੱਗੇ। ਕੀਰਤਨ ਸੁਣ ਕੇ ਗੁਰੂ ਜੀ ਬਾਹਰ ਆਏ, ਅਤੇ ਸਿੱਖ ਬਹੁਤ ਖ਼ੁਸ਼ ਹੋਏ।",
"ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਨੇ ਕਿਹਾ, 'ਗੁਰੂ ਜੀ, ਜੇ ਤੁਸੀਂ ਲੁਕੇ ਰਹੋਗੇ ਤਾਂ ਸਿੱਖਾਂ ਨੂੰ ਰਾਹ ਕੌਣ ਵਿਖਾਵੇਗਾ? ਕਿਰਪਾ ਕਰਕੇ ਆਓ ਅਤੇ ਸਾਡੀ ਅਗਵਾਈ ਕਰੋ।' ਗੁਰੂ ਜੀ ਮੰਨ ਗਏ। ਉਨ੍ਹਾਂ ਨੇ ਖਡੂਰ ਅਤੇ ਪਿੰਡ ਸੰਘਰ ਦੇ ਵਿਚਕਾਰ ਇੱਕ ਉੱਚੀ ਥਾਂ ਉੱਤੇ ਟਿਕਾਣਾ ਬਣਾਇਆ। ਛੇਤੀ ਹੀ ਸਵੇਰੇ-ਸ਼ਾਮ ਕੀਰਤਨ ਹੋਣ ਲੱਗਾ, ਅਤੇ ਸਾਰਾ ਦਿਨ ਲੰਗਰ ਚੱਲਣ ਲੱਗਾ।",
"ਸਵੇਰ ਦੇ ਕੀਰਤਨ ਤੋਂ ਬਾਅਦ ਗੁਰੂ ਜੀ ਆਪ ਪਿੰਡ ਦੇ ਬੱਚਿਆਂ ਨੂੰ ਪੜ੍ਹਾਉਂਦੇ। ਉਨ੍ਹਾਂ ਦਿਨਾਂ ਵਿੱਚ ਛਾਪੇਖ਼ਾਨੇ ਨਹੀਂ ਸਨ, ਇਸ ਲਈ ਉਨ੍ਹਾਂ ਨੇ ਬੱਚਿਆਂ ਦੇ ਸਿੱਖਣ ਲਈ ਆਪਣੇ ਹੱਥੀਂ ਗੁਰਮੁਖੀ ਦੀਆਂ ਛੋਟੀਆਂ ਬਾਲ-ਬੋਧ ਪੋਥੀਆਂ ਲਿਖੀਆਂ।",
"ਸ਼ਾਮ ਨੂੰ, ਕੀਰਤਨ ਤੋਂ ਪਹਿਲਾਂ, ਉਹ ਸਭ ਨੂੰ ਤਕੜੇ ਅਤੇ ਤੰਦਰੁਸਤ ਰੱਖਣ ਲਈ ਕੁਸ਼ਤੀਆਂ ਅਤੇ ਹੋਰ ਖੇਡਾਂ ਕਰਵਾਉਂਦੇ। ਉਨ੍ਹਾਂ ਨੇ ਸਭ ਨੂੰ ਸੇਵਾ ਅਤੇ ਈਮਾਨਦਾਰ ਕਿਰਤ ਕਰਨਾ ਸਿਖਾਇਆ, ਅਤੇ ਆਪ ਮੰਜੇ ਬੁਣਨ ਵਾਲਾ ਵਾਣ ਵੱਟਦੇ ਸਨ। ਲੋਕ ਆਪਣੀਆਂ ਮੁਸ਼ਕਲਾਂ ਲੈ ਕੇ ਆਉਂਦੇ, ਅਤੇ ਉਹ ਸੁਣ ਕੇ ਉਨ੍ਹਾਂ ਦਾ ਹੱਲ ਲੱਭਣ ਵਿੱਚ ਮਦਦ ਕਰਦੇ।"],
l:"ਇੱਕ ਤਕੜਾ ਸਿੱਖ ਮਨ, ਸਰੀਰ ਅਤੇ ਸਮਾਜ, ਤਿੰਨਾਂ ਦੀ ਸੰਭਾਲ ਕਰਦਾ ਹੈ: ਪੜ੍ਹਾਈ, ਕਸਰਤ, ਕੀਰਤਨ ਅਤੇ ਈਮਾਨਦਾਰ ਕਿਰਤ, ਸਭ ਜ਼ਰੂਰੀ ਹਨ।"};

PA["lesson-for-humayun"]={t:[
"ਪਹਿਲੇ ਮੁਗ਼ਲ ਬਾਦਸ਼ਾਹ ਬਾਬਰ ਨੇ 1526 ਵਿੱਚ ਹਿੰਦੁਸਤਾਨ ਦਾ ਤਖ਼ਤ ਜਿੱਤਿਆ। ਉਸ ਦੀ ਮੌਤ ਤੋਂ ਬਾਅਦ ਉਸ ਦਾ ਪੁੱਤਰ ਹੁਮਾਯੂੰ ਬਾਦਸ਼ਾਹ ਬਣਿਆ। ਪਰ 1540 ਵਿੱਚ ਸ਼ੇਰ ਖ਼ਾਨ ਨਾਂ ਦੇ ਇੱਕ ਜਰਨੈਲ ਨੇ ਹੁਮਾਯੂੰ ਨੂੰ ਕਨੌਜ ਵਿਖੇ ਹਰਾ ਦਿੱਤਾ, ਅਤੇ ਹੁਮਾਯੂੰ ਨੂੰ ਲਾਹੌਰ ਵੱਲ ਭੱਜਣਾ ਪਿਆ।",
"ਪੰਜਾਬ ਵਿੱਚੋਂ ਲੰਘਦਿਆਂ ਹੁਮਾਯੂੰ ਨੂੰ ਇੱਕ ਗੱਲ ਯਾਦ ਆਈ। ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਨੇ ਇੱਕ ਵਾਰ ਉਸ ਦੇ ਪਿਤਾ ਬਾਬਰ ਨੂੰ ਕਿਹਾ ਸੀ ਕਿ ਉਸ ਦੇ ਖ਼ਾਨਦਾਨ ਦੀਆਂ ਸੱਤ ਪੀੜ੍ਹੀਆਂ ਹਿੰਦੁਸਤਾਨ ਉੱਤੇ ਰਾਜ ਕਰਨਗੀਆਂ। 'ਫਿਰ ਮੈਂ ਦੂਜੀ ਪੀੜ੍ਹੀ ਵਿੱਚ ਹੀ ਰਾਜ ਕਿਉਂ ਗੁਆ ਰਿਹਾ ਹਾਂ?' ਉਸ ਨੇ ਸੋਚਿਆ। ਉਸ ਨੇ ਆਪਣੇ ਵਜ਼ੀਰ ਤੋਂ ਪੁੱਛਿਆ ਕਿ ਹੁਣ ਗੁਰੂ ਨਾਨਕ ਦੀ ਗੱਦੀ ਉੱਤੇ ਕੌਣ ਹੈ। ਜਵਾਬ ਮਿਲਿਆ, 'ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ, ਬਿਆਸ ਦਰਿਆ ਤੋਂ ਪਾਰ ਖਡੂਰ ਵਿਖੇ।'",
"ਹੁਮਾਯੂੰ ਆਪਣੇ ਵਜ਼ੀਰ ਨਾਲ ਖਡੂਰ ਗਿਆ। ਜਦੋਂ ਉਹ ਪਹੁੰਚਿਆ, ਗੁਰੂ ਜੀ ਬੱਚਿਆਂ ਨੂੰ ਪੜ੍ਹਾਉਣ ਵਿੱਚ ਰੁੱਝੇ ਹੋਏ ਸਨ ਅਤੇ ਉਸ ਦੇ ਸੁਆਗਤ ਲਈ ਨਾ ਰੁਕੇ। ਹੁਮਾਯੂੰ ਖੜ੍ਹਾ ਉਡੀਕਦਾ ਰਿਹਾ। ਅਣਡਿੱਠ ਹੋਣ ਨੂੰ ਉਸ ਨੇ ਆਪਣੀ ਬੇਇੱਜ਼ਤੀ ਸਮਝਿਆ, ਅਤੇ ਗੁੱਸੇ ਵਿੱਚ ਆਪਣੀ ਤਲਵਾਰ ਕੱਢਣ ਲੱਗਾ।",
"ਗੁਰੂ ਜੀ ਨੇ ਸ਼ਾਂਤੀ ਨਾਲ ਉੱਪਰ ਵੇਖਿਆ ਅਤੇ ਕਿਹਾ, 'ਹੁਮਾਯੂੰ, ਜਦੋਂ ਤੂੰ ਸ਼ੇਰ ਖ਼ਾਨ ਤੋਂ ਭੱਜ ਰਿਹਾ ਸੀ, ਉਦੋਂ ਇਹ ਤਲਵਾਰ ਕਿੱਥੇ ਸੀ? ਹੁਣ ਤੂੰ ਬੱਚਿਆਂ ਨੂੰ ਪੜ੍ਹਾ ਰਹੇ ਰੱਬ ਦੇ ਬੰਦੇ ਉੱਤੇ ਆਪਣੀ ਬਹਾਦਰੀ ਵਿਖਾ ਰਿਹਾ ਹੈਂ?'",
"ਹੁਮਾਯੂੰ ਬਹੁਤ ਸ਼ਰਮਿੰਦਾ ਹੋਇਆ। ਉਸ ਨੇ ਹੱਥ ਜੋੜ ਕੇ ਕਿਹਾ, 'ਮੇਰੇ ਤੋਂ ਭੁੱਲ ਹੋ ਗਈ। ਮੈਨੂੰ ਮਾਫ਼ ਕਰ ਦਿਓ।' ਫਿਰ ਉਸ ਨੇ ਆਪਣੇ ਗੁਆਚੇ ਰਾਜ ਬਾਰੇ ਸਵਾਲ ਪੁੱਛਿਆ। ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਰਾਜੇ ਦਾ ਰਾਜ ਉਦੋਂ ਤੱਕ ਰਹਿੰਦਾ ਹੈ ਜਦੋਂ ਤੱਕ ਉਹ ਇਨਸਾਫ਼ ਨਾਲ ਰਾਜ ਕਰਦਾ ਹੈ। ਜੇ ਤੂੰ ਹੁਣੇ ਤਲਵਾਰ ਨਾ ਚੁੱਕਦਾ, ਤਾਂ ਛੇਤੀ ਹੀ ਆਪਣਾ ਰਾਜ ਵਾਪਸ ਜਿੱਤ ਲੈਂਦਾ। ਹੁਣ ਤੈਨੂੰ ਪਹਿਲਾਂ ਈਰਾਨ ਜਾਣਾ ਪਵੇਗਾ। ਜਦੋਂ ਮੁੜੇਂਗਾ, ਫਿਰ ਰਾਜ ਕਰੇਂਗਾ।'",
"ਹੁਮਾਯੂੰ ਈਰਾਨ ਚਲਾ ਗਿਆ। ਪੰਦਰਾਂ ਸਾਲਾਂ ਬਾਅਦ, 1555 ਵਿੱਚ, ਉਹ ਵਾਪਸ ਆਇਆ ਅਤੇ ਫਿਰ ਹਿੰਦੁਸਤਾਨ ਦਾ ਬਾਦਸ਼ਾਹ ਬਣਿਆ।"],
l:"ਸੱਚੀ ਬਹਾਦਰੀ ਕਦੇ ਕਮਜ਼ੋਰ ਨੂੰ ਡਰਾ ਕੇ ਨਹੀਂ ਵਿਖਾਈ ਜਾਂਦੀ। ਗੁੱਸੇ ਨਾਲ ਅਸੀਂ ਖੱਟਦੇ ਘੱਟ ਅਤੇ ਗੁਆਉਂਦੇ ਵੱਧ ਹਾਂ, ਅਤੇ ਇਨਸਾਫ਼ ਸਾਨੂੰ ਮਜ਼ਬੂਤ ਰੱਖਦਾ ਹੈ।"};

PA["goindas-village"]={t:[
"ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ ਦੇ ਸਮੇਂ, ਬਿਆਸ ਦਰਿਆ ਦੇ ਕੰਢੇ ਜਿੱਥੇ ਅੱਜ ਗੋਇੰਦਵਾਲ ਹੈ, ਉੱਥੇ ਰੜਾ, ਖਾਲੀ ਮੈਦਾਨ ਸੀ। ਇਹ ਜ਼ਮੀਨ ਗੋਇੰਦਾ ਨਾਂ ਦੇ ਇੱਕ ਆਦਮੀ ਦੀ ਸੀ, ਜੋ ਆਪਣੇ ਵੱਡੇ-ਵਡੇਰਿਆਂ ਦੀ ਯਾਦ ਵਿੱਚ ਉੱਥੇ ਪਿੰਡ ਵਸਾਉਣਾ ਚਾਹੁੰਦਾ ਸੀ।",
"ਪਰ ਜਦੋਂ ਵੀ ਗੋਇੰਦਾ ਘਰ ਦੀਆਂ ਕੰਧਾਂ ਉਸਾਰਦਾ, ਰਾਤ ਨੂੰ ਉਹ ਢਾਹ ਦਿੱਤੀਆਂ ਜਾਂਦੀਆਂ। ਉਸ ਦੇ ਆਪਣੇ ਸ਼ਰੀਕ, ਜੋ ਨਹੀਂ ਚਾਹੁੰਦੇ ਸਨ ਕਿ ਪਿੰਡ ਵਸੇ, ਕੁਝ ਸ਼ਰਾਰਤੀਆਂ ਨਾਲ ਚੋਰੀ-ਚੋਰੀ ਆ ਕੇ ਸਭ ਤੋੜ ਦਿੰਦੇ। ਫਿਰ ਉਨ੍ਹਾਂ ਨੇ ਇਹ ਗੱਲ ਫੈਲਾ ਦਿੱਤੀ ਕਿ ਇਹ ਭੂਤ-ਪ੍ਰੇਤ ਕਰਦੇ ਹਨ!",
"ਗੋਇੰਦਾ ਖਡੂਰ ਗਿਆ ਅਤੇ ਗੁਰੂ ਜੀ ਤੋਂ ਮਦਦ ਮੰਗੀ। 'ਗੁਰੂ ਜੀ, ਮੈਂ ਆਪਣੀ ਜ਼ਮੀਨ ਉੱਤੇ ਪਿੰਡ ਵਸਾਉਣ ਦੀ ਬਹੁਤ ਕੋਸ਼ਿਸ਼ ਕੀਤੀ, ਪਰ ਨਹੀਂ ਵਸਾ ਸਕਿਆ। ਮੇਰੀ ਮਦਦ ਕਰੋ। ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਮੈਂ ਤੁਹਾਡੇ ਲਈ ਇੱਕ ਸੋਹਣੀ ਧਰਮਸਾਲ ਬਣਾਵਾਂਗਾ।'",
"ਗੁਰੂ ਜੀ ਨੇ ਆਪਣੇ ਵੱਡੇ ਪੁੱਤਰ ਦਾਤੂ ਨੂੰ ਗੋਇੰਦੇ ਨਾਲ ਜਾਣ ਲਈ ਕਿਹਾ। 'ਅਸੀਂ ਖਡੂਰ ਹੀ ਖ਼ੁਸ਼ ਹਾਂ,' ਦਾਤੂ ਨੇ ਕਿਹਾ। 'ਸਾਨੂੰ ਕੀ ਮਿਲੇਗਾ?' ਫਿਰ ਉਨ੍ਹਾਂ ਨੇ ਛੋਟੇ ਪੁੱਤਰ ਦਾਸੂ ਨੂੰ ਕਿਹਾ। 'ਇਹ ਉਸ ਦੇ ਪਰਿਵਾਰ ਦਾ ਝਗੜਾ ਹੈ,' ਦਾਸੂ ਨੇ ਕਿਹਾ। 'ਅਸੀਂ ਕਿਉਂ ਪਈਏ?'",
"ਫਿਰ ਗੁਰੂ ਜੀ ਨੇ ਭਾਈ ਅਮਰਦਾਸ ਜੀ ਨੂੰ ਸੱਦਿਆ। ਉਹ ਬਜ਼ੁਰਗ ਸਨ ਜਿਨ੍ਹਾਂ ਨੇ ਕਈ ਸਾਲ ਗੁਰੂ ਜੀ ਦੀ ਪੂਰੀ ਸ਼ਰਧਾ ਨਾਲ ਸੇਵਾ ਕੀਤੀ ਸੀ, ਹਰ ਰੋਜ਼ ਅੰਮ੍ਰਿਤ ਵੇਲੇ ਖੂਹ ਤੋਂ ਗੁਰੂ ਜੀ ਦੇ ਇਸ਼ਨਾਨ ਲਈ ਪਾਣੀ ਲਿਆਉਂਦੇ ਸਨ। ਉਹ ਤੁਰੰਤ ਮੰਨ ਗਏ। ਪੁੱਤਰ ਪਿਤਾ ਨੂੰ ਨਾਂਹ ਕਰ ਸਕਦਾ ਹੈ, ਪਰ ਸੱਚਾ ਸਿੱਖ ਗੁਰੂ ਨੂੰ ਨਾਂਹ ਨਹੀਂ ਕਰਦਾ।",
"ਭਾਈ ਅਮਰਦਾਸ ਜੀ ਗੋਇੰਦੇ ਨਾਲ ਗਏ, ਅਤੇ ਬਹੁਤ ਸਾਰੇ ਸਿੱਖ ਸੇਵਾ ਵਜੋਂ ਉਸਾਰੀ ਵਿੱਚ ਜੁੜ ਗਏ। ਜਦੋਂ ਗੋਇੰਦੇ ਦੇ ਸ਼ਰੀਕਾਂ ਨੇ ਇੰਨੇ ਸਿੱਖਾਂ ਨੂੰ ਮਿਲ ਕੇ ਕੰਮ ਕਰਦਿਆਂ ਵੇਖਿਆ, ਉਨ੍ਹਾਂ ਦੀ ਕੰਧਾਂ ਢਾਹੁਣ ਦੀ ਹਿੰਮਤ ਨਾ ਪਈ। ਸਗੋਂ ਉਹ ਮਦਦ ਕਰਨ ਲੱਗ ਪਏ! ਛੇਤੀ ਹੀ ਉੱਥੇ ਇੱਕ ਸੋਹਣੀ ਧਰਮਸਾਲ ਅਤੇ ਘਰ ਬਣ ਗਏ। ਗੁਰੂ ਜੀ ਨੇ ਗੋਇੰਦੇ ਦੇ ਨਾਂ ਉੱਤੇ ਨਗਰ ਦਾ ਨਾਂ ਗੋਇੰਦਵਾਲ ਰੱਖਿਆ, ਅਤੇ ਭਾਈ ਅਮਰਦਾਸ ਜੀ ਨੂੰ ਬਾਸਰਕੇ ਤੋਂ ਪਰਿਵਾਰ ਲਿਆ ਕੇ ਉੱਥੇ ਰਹਿਣ ਲਈ ਕਿਹਾ। ਕਈ ਸਾਲਾਂ ਬਾਅਦ ਭਾਈ ਅਮਰਦਾਸ ਜੀ ਤੀਜੇ ਗੁਰੂ, ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਬਣੇ।"],
l:"ਖ਼ੁਸ਼ੀ ਅਤੇ ਚਾਅ ਨਾਲ ਕੀਤੀ ਸੇਵਾ ਉਹ ਕਰ ਵਿਖਾਉਂਦੀ ਹੈ ਜੋ ਬਹਿਸ ਨਹੀਂ ਕਰ ਸਕਦੀ। ਮਿਲ ਕੇ ਸੰਗਤ ਉਹ ਕਰ ਸਕਦੀ ਹੈ ਜੋ ਇਕੱਲਾ ਬੰਦਾ ਨਹੀਂ ਕਰ ਸਕਦਾ।"};

PA["who-is-your-guru"]={t:[
"ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਦਾ ਜਨਮ 1479 ਵਿੱਚ ਅੰਮ੍ਰਿਤਸਰ ਦੇ ਨੇੜੇ ਪਿੰਡ ਬਾਸਰਕੇ ਵਿੱਚ ਹੋਇਆ। ਉਨ੍ਹਾਂ ਦੇ ਪਿਤਾ, ਤੇਜ ਭਾਨ ਜੀ, ਕਿਸਾਨ ਅਤੇ ਵਪਾਰੀ ਸਨ, ਅਤੇ ਮਾਤਾ, ਮਾਤਾ ਲੱਖਮੀ ਜੀ ਸਨ। 1503 ਵਿੱਚ ਉਨ੍ਹਾਂ ਦਾ ਵਿਆਹ ਰਾਮ ਕੌਰ ਜੀ ਨਾਲ ਹੋਇਆ, ਅਤੇ ਉਨ੍ਹਾਂ ਦੇ ਦੋ ਪੁੱਤਰ, ਮੋਹਨ ਅਤੇ ਮੋਹਰੀ, ਅਤੇ ਦੋ ਧੀਆਂ, ਬੀਬੀ ਭਾਨੀ ਅਤੇ ਬੀਬੀ ਦਾਨੀ, ਹੋਏ।",
"ਪਿਤਾ ਵਾਂਗ ਅਮਰਦਾਸ ਜੀ ਵੀ ਬਹੁਤ ਧਾਰਮਿਕ ਸੁਭਾਅ ਦੇ ਸਨ। ਹਰ ਰੋਜ਼ ਉਹ ਪੂਜਾ-ਪਾਠ ਕਰਦੇ, ਦਾਨ-ਪੁੰਨ ਕਰਦੇ ਅਤੇ ਹਰ ਤਿਉਹਾਰ ਮਨਾਉਂਦੇ। ਬਤਾਲੀ ਸਾਲ ਦੀ ਉਮਰ ਵਿੱਚ ਉਹ ਪਵਿੱਤਰ ਗੰਗਾ ਵਿੱਚ ਇਸ਼ਨਾਨ ਕਰਨ ਹਰਿਦੁਆਰ ਦੀ ਯਾਤਰਾ ਉੱਤੇ ਗਏ, ਅਤੇ ਉਸ ਤੋਂ ਬਾਅਦ ਹਰ ਸਾਲ ਜਾਂਦੇ ਰਹੇ।",
"1541 ਵਿੱਚ, ਆਪਣੀ ਇੱਕੀਵੀਂ ਯਾਤਰਾ ਤੋਂ ਘਰ ਮੁੜਦਿਆਂ, ਉਹ ਪਿੰਡ ਮਿਹਰੇ ਦੀ ਇੱਕ ਸਰਾਂ ਵਿੱਚ ਰੁਕੇ। ਜਦੋਂ ਉਹ ਦੁਪਹਿਰੇ ਆਰਾਮ ਕਰ ਰਹੇ ਸਨ, ਦੁਰਗਾ ਨਾਂ ਦੇ ਇੱਕ ਪੰਡਿਤ ਨੇ ਉਨ੍ਹਾਂ ਦੇ ਪੈਰਾਂ ਦੀਆਂ ਤਲੀਆਂ ਦੀਆਂ ਲਕੀਰਾਂ ਵੇਖੀਆਂ। 'ਇਹ ਲਕੀਰਾਂ ਦੱਸਦੀਆਂ ਹਨ ਕਿ ਤੁਸੀਂ ਇੱਕ ਦਿਨ ਮਹਾਨ ਸੰਤ ਬਣੋਗੇ,' ਉਸ ਨੇ ਕਿਹਾ।",
"ਸਰਾਂ ਵਿੱਚ ਠਹਿਰੇ ਇੱਕ ਸਾਧੂ ਨੇ ਇਹ ਸੁਣ ਲਿਆ। ਉਹ ਬਹੁਤ ਕੱਟੜ ਸੀ ਅਤੇ ਹਮੇਸ਼ਾ ਆਪਣਾ ਭੋਜਨ ਆਪ ਪਕਾਉਂਦਾ ਸੀ, ਕਦੇ ਕਿਸੇ ਹੋਰ ਦਾ ਬਣਾਇਆ ਨਹੀਂ ਖਾਂਦਾ ਸੀ। ਪਰ ਹੁਣ ਉਸ ਨੇ ਅਮਰਦਾਸ ਜੀ ਨਾਲ ਸਫ਼ਰ ਕਰਨ ਦਾ ਫ਼ੈਸਲਾ ਕੀਤਾ, ਅਤੇ ਅਮਰਦਾਸ ਜੀ ਦਾ ਪਕਾਇਆ ਭੋਜਨ ਖ਼ੁਸ਼ੀ ਨਾਲ ਛਕਦਾ ਰਿਹਾ। ਉਹ ਇਕੱਠੇ ਤੁਰਦੇ, ਹਰ ਰਾਤ ਇੱਕੋ ਥਾਂ ਰੁਕਦੇ, ਅਤੇ ਬਾਸਰਕੇ ਤੱਕ ਨਾਲ ਆਏ।",
"ਕੁਝ ਦਿਨਾਂ ਬਾਅਦ, ਜਾਣ ਵੇਲੇ ਸਾਧੂ ਨੇ ਪੁੱਛਿਆ, 'ਤੁਹਾਡਾ ਗੁਰੂ ਕੌਣ ਹੈ, ਤੁਹਾਡਾ ਆਤਮਿਕ ਮਾਰਗ-ਦਰਸ਼ਕ?' ਅਮਰਦਾਸ ਜੀ ਨੇ ਸੱਚ-ਸੱਚ ਜਵਾਬ ਦਿੱਤਾ, 'ਮੈਨੂੰ ਅਜੇ ਤੱਕ ਗੁਰੂ ਨਹੀਂ ਮਿਲਿਆ।'",
"ਸਾਧੂ ਬਹੁਤ ਦੁਖੀ ਹੋਇਆ। 'ਮੈਂ ਨਿਗੁਰੇ ਦੇ ਹੱਥ ਦਾ ਭੋਜਨ ਖਾਂਦਾ ਰਿਹਾ! ਮੇਰੀ ਸਾਰੀ ਪੂਜਾ ਅਤੇ ਯਾਤਰਾਵਾਂ ਬਿਰਥਾ ਗਈਆਂ!' ਉਹ ਚੀਕਿਆ ਅਤੇ ਚਲਾ ਗਿਆ। ਅਮਰਦਾਸ ਜੀ ਡੂੰਘੀ ਸੋਚ ਵਿੱਚ ਪੈ ਗਏ। ਉਨ੍ਹਾਂ ਦਾ ਗੁਰੂ ਕੌਣ ਹੋ ਸਕਦਾ ਹੈ?"],
l:"ਸਿੱਖਣ ਲਈ ਗੁਰੂ ਦੀ ਲੋੜ ਹੈ। ਇੱਕ ਔਖਾ ਸਵਾਲ, ਭਾਵੇਂ ਚੁਭਵਾਂ ਵੀ ਹੋਵੇ, ਸਾਨੂੰ ਸਹੀ ਰਾਹ ਉੱਤੇ ਪਾ ਸਕਦਾ ਹੈ।"};

PA["bibi-amros-song"]={t:[
"ਤੀਰਥ ਯਾਤਰਾ ਤੋਂ ਘਰ ਮੁੜਦਿਆਂ ਅਮਰਦਾਸ ਜੀ ਨੇ ਇੱਕ ਸਾਧੂ ਨਾਲ ਆਪਣਾ ਭੋਜਨ ਸਾਂਝਾ ਕੀਤਾ ਸੀ। ਜਦੋਂ ਸਾਧੂ ਨੂੰ ਪਤਾ ਲੱਗਾ ਕਿ ਅਮਰਦਾਸ ਜੀ ਦਾ ਕੋਈ ਗੁਰੂ ਨਹੀਂ ਹੈ, ਤਾਂ ਉਹ ਨਾਰਾਜ਼ ਹੋ ਕੇ ਚਲਾ ਗਿਆ ਅਤੇ ਕਹਿਣ ਲੱਗਾ ਕਿ ਉਸ ਦੀਆਂ ਸਾਰੀਆਂ ਪ੍ਰਾਰਥਨਾਵਾਂ ਵਿਅਰਥ ਗਈਆਂ। ਅਮਰਦਾਸ ਜੀ ਇਸ ਬਾਰੇ ਸੋਚਣੋਂ ਨਾ ਹਟ ਸਕੇ। 'ਉਹ ਠੀਕ ਕਹਿੰਦਾ ਸੀ,' ਉਨ੍ਹਾਂ ਨੇ ਸੋਚਿਆ। 'ਜਿਵੇਂ ਕੁਝ ਵੀ ਸਿੱਖਣ ਲਈ ਅਧਿਆਪਕ ਚਾਹੀਦਾ ਹੈ, ਉਵੇਂ ਮਨ ਦੀ ਸ਼ਾਂਤੀ ਲਈ ਗੁਰੂ ਚਾਹੀਦਾ ਹੈ।' ਉਹ ਸਾਰੀ ਰਾਤ ਜਾਗਦੇ ਰਹੇ।",
"ਅੰਮ੍ਰਿਤ ਵੇਲੇ ਉਨ੍ਹਾਂ ਨੇ ਦੁੱਧ ਰਿੜਕਦਿਆਂ ਗਾਉਂਦੀ ਇੱਕ ਮਿੱਠੀ ਆਵਾਜ਼ ਸੁਣੀ। ਇਹ ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ ਦੀ ਸਪੁੱਤਰੀ ਬੀਬੀ ਅਮਰੋ ਸੀ, ਜਿਨ੍ਹਾਂ ਦਾ ਹੁਣੇ ਹੀ ਅਮਰਦਾਸ ਜੀ ਦੇ ਭਤੀਜੇ ਨਾਲ ਵਿਆਹ ਹੋਇਆ ਸੀ ਅਤੇ ਉਹ ਪਰਿਵਾਰ ਨਾਲ ਰਹਿਣ ਆਏ ਸਨ। ਉਹ ਗੁਰਬਾਣੀ ਦਾ ਸ਼ਬਦ ਗਾ ਰਹੇ ਸਨ ਜੋ ਇਉਂ ਸ਼ੁਰੂ ਹੁੰਦਾ ਹੈ: 'ਕਰਣੀ ਕਾਗਦੁ ਮਨੁ ਮਸਵਾਣੀ': 'ਸਾਡੇ ਕਰਮ ਕਾਗ਼ਜ਼ ਹਨ ਅਤੇ ਮਨ ਸਿਆਹੀ। ਇਸ ਕਾਗ਼ਜ਼ ਉੱਤੇ ਚੰਗੇ ਅਤੇ ਮਾੜੇ ਦੋਵੇਂ ਲੇਖ ਲਿਖੇ ਜਾਂਦੇ ਹਨ।' (ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ, ਅੰਗ 990)",
"ਅਮਰਦਾਸ ਜੀ ਨੇ ਹਰ ਸ਼ਬਦ ਧਿਆਨ ਨਾਲ ਸੁਣਿਆ। ਸ਼ਬਦ ਵਿੱਚ ਕਿਹਾ ਗਿਆ ਸੀ ਕਿ ਮਨੁੱਖ ਦਾ ਮਨ ਲਾਲਚ, ਕ੍ਰੋਧ ਅਤੇ ਹੰਕਾਰ ਨਾਲ ਸੜ ਸਕਦਾ ਹੈ, ਪਰ ਸੱਚਾ ਗੁਰੂ ਉਸ ਮਨ ਨੂੰ ਸੋਨਾ ਬਣਾ ਸਕਦਾ ਹੈ, ਜਿਵੇਂ ਪਾਰਸ ਦੀ ਛੋਹ ਲੋਹੇ ਨੂੰ ਸੋਨਾ ਬਣਾ ਦਿੰਦੀ ਹੈ। 'ਜਿਸ ਨੇ ਵੀ ਇਹ ਲਿਖਿਆ ਹੈ,' ਉਨ੍ਹਾਂ ਨੇ ਸੋਚਿਆ, 'ਉਹੀ ਗੁਰੂ ਹੈ ਜਿਸ ਨੂੰ ਮੈਂ ਲੱਭ ਰਿਹਾ ਹਾਂ।'",
"ਜਿਵੇਂ ਹੀ ਚਾਨਣ ਹੋਇਆ, ਉਨ੍ਹਾਂ ਨੇ ਬੀਬੀ ਅਮਰੋ ਤੋਂ ਪੁੱਛਿਆ, 'ਇਹ ਕਿਸ ਦੇ ਬਚਨ ਸਨ?' ਬੀਬੀ ਜੀ ਨੇ ਕਿਹਾ, 'ਇਹ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦੀ ਬਾਣੀ ਹੈ। ਸੰਸਾਰ ਤੋਂ ਜਾਣ ਤੋਂ ਪਹਿਲਾਂ ਉਨ੍ਹਾਂ ਨੇ ਸਿੱਖਾਂ ਦੀ ਅਗਵਾਈ ਦੀ ਜ਼ਿੰਮੇਵਾਰੀ ਮੇਰੇ ਪਿਤਾ, ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ ਨੂੰ ਸੌਂਪੀ। ਉਹ ਖਡੂਰ ਰਹਿੰਦੇ ਹਨ।'",
"ਅਮਰਦਾਸ ਜੀ ਨੇ ਬੀਬੀ ਅਮਰੋ ਨੂੰ ਉੱਥੇ ਲੈ ਚੱਲਣ ਲਈ ਬੇਨਤੀ ਕੀਤੀ। ਖਡੂਰ ਪਹੁੰਚ ਕੇ ਉਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ ਦੇ ਚਰਨਾਂ ਉੱਤੇ ਮੱਥਾ ਟੇਕਿਆ ਅਤੇ ਕਿਹਾ, 'ਮੈਨੂੰ ਆਪਣਾ ਸਿੱਖ ਬਣਾ ਲਓ।' ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਗੁਰ-ਸ਼ਬਦ ਦੀ ਬਖ਼ਸ਼ਿਸ਼ ਕੀਤੀ।",
"ਅਮਰਦਾਸ ਜੀ ਬਾਹਠ ਸਾਲ ਦੇ ਸਨ, ਪਰ ਉਨ੍ਹਾਂ ਨੂੰ ਇਉਂ ਲੱਗਾ ਜਿਵੇਂ ਨਵਾਂ ਜੀਵਨ ਸ਼ੁਰੂ ਹੋ ਰਿਹਾ ਹੋਵੇ। ਉਸ ਦਿਨ ਤੋਂ ਉਨ੍ਹਾਂ ਨੇ ਜਾਤ ਜਾਂ ਖ਼ਾਨਦਾਨ ਦਾ ਹਰ ਹੰਕਾਰ ਛੱਡ ਦਿੱਤਾ, ਆਉਣ ਵਾਲੇ ਹਰ ਇੱਕ ਦੀ ਸੇਵਾ ਕੀਤੀ, ਅਤੇ ਹਰ ਕਿਸੇ ਨੂੰ ਆਪਣਾ ਭੈਣ-ਭਰਾ ਸਮਝਿਆ।"],
l:"ਸਿੱਖਣ ਅਤੇ ਬਦਲਣ ਲਈ ਕਦੇ ਦੇਰ ਨਹੀਂ ਹੁੰਦੀ। ਗੁਰਬਾਣੀ ਸਾਨੂੰ ਸਹੀ ਰਾਹ ਵਿਖਾ ਸਕਦੀ ਹੈ।"};

PA["shelter-of-the-shelterless"]={t:[
"ਖਡੂਰ ਵਿੱਚ ਅਮਰਦਾਸ ਜੀ ਨੇ ਵੇਖਿਆ ਕਿ ਸਿੱਖ ਬਿਨਾਂ ਕਹੇ ਖ਼ੁਸ਼ੀ-ਖ਼ੁਸ਼ੀ ਸੇਵਾ ਕਰ ਰਹੇ ਹਨ: ਲੰਗਰ ਵਿੱਚ ਭਾਂਡੇ ਮਾਂਜ ਰਹੇ ਹਨ, ਜੰਗਲ ਤੋਂ ਲੱਕੜਾਂ ਲਿਆ ਰਹੇ ਹਨ, ਅਤੇ ਹੋਰ ਹਰ ਤਰ੍ਹਾਂ ਦੇ ਕੰਮ ਕਰ ਰਹੇ ਹਨ। ਉਨ੍ਹਾਂ ਨੇ ਲੰਗਰ ਦੇ ਲਾਂਗਰੀ ਭਾਈ ਜੋਧ ਜੀ ਤੋਂ ਸੇਵਾ ਮੰਗੀ, ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਲੰਗਰ ਲਈ ਪਾਣੀ ਢੋਣ ਦੀ ਸੇਵਾ ਮਿਲੀ।",
"ਉਹ ਸਭ ਦੇ ਨਾਲ ਪੰਗਤ ਵਿੱਚ ਬੈਠ ਕੇ ਛਕਦੇ, ਅਤੇ ਉਨ੍ਹਾਂ ਦੇ ਦਿਲ ਵਿੱਚੋਂ ਉੱਚ-ਨੀਚ ਦਾ ਹਰ ਭਾਵ ਨਿਕਲ ਗਿਆ। ਵਿਹਲੇ ਸਮੇਂ ਉਹ ਗੁਰਬਾਣੀ ਸੁਣਦੇ ਅਤੇ ਪੜ੍ਹਦੇ ਹੋਏ ਭਾਂਡੇ ਮਾਂਜਦੇ।",
"ਉਨ੍ਹਾਂ ਨੇ ਇੱਕ ਖ਼ਾਸ ਸੇਵਾ ਵੀ ਸੰਭਾਲ ਲਈ। ਹਰ ਰੋਜ਼ ਅੰਮ੍ਰਿਤ ਵੇਲੇ ਉਹ ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ ਦੇ ਇਸ਼ਨਾਨ ਲਈ ਖੂਹ ਤੋਂ ਪਾਣੀ ਦੀ ਵੱਡੀ ਗਾਗਰ ਲਿਆਉਂਦੇ। ਉਨ੍ਹਾਂ ਨੇ ਲਗਭਗ ਗਿਆਰਾਂ ਸਾਲ ਹਰ ਰੋਜ਼ ਇਹ ਸੇਵਾ ਕੀਤੀ।",
"1552 ਵਿੱਚ, ਜਦੋਂ ਅਮਰਦਾਸ ਜੀ ਸੱਤਰ ਸਾਲ ਤੋਂ ਵੱਧ ਉਮਰ ਦੇ ਸਨ, ਇੱਕ ਹਨੇਰੀ ਸਵੇਰ ਉਹ ਮੋਹਲੇਧਾਰ ਮੀਂਹ ਵਿੱਚ ਪਾਣੀ ਲਿਆ ਰਹੇ ਸਨ। ਇੱਕ ਜੁਲਾਹੇ ਦੇ ਘਰ ਕੋਲ ਉਨ੍ਹਾਂ ਦਾ ਪੈਰ ਲੱਕੜ ਦੀ ਕਿੱਲੀ ਨਾਲ ਅੜਿਆ ਅਤੇ ਉਹ ਡਿੱਗ ਪਏ। ਜੁਲਾਹਾ ਜਾਗ ਪਿਆ ਅਤੇ ਬੋਲਿਆ, 'ਇਸ ਵੇਲੇ ਉੱਥੇ ਕੌਣ ਹੈ?' ਉਸ ਦੀ ਪਤਨੀ ਬੁੜਬੁੜਾਈ, 'ਇਸ ਮੀਂਹ ਵਿੱਚ ਹੋਰ ਕੌਣ ਬਾਹਰ ਹੋਵੇਗਾ? ਉਹੀ ਨਿਥਾਵਾਂ ਅਮਰੂ ਹੋਊ। ਸੌਂ ਜਾ।'",
"ਅਮਰਦਾਸ ਜੀ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, 'ਕਮਲੀਏ, ਮੈਂ ਨਿਥਾਵਾਂ ਨਹੀਂ। ਮੈਂ ਗੁਰੂ ਦੀ ਛਤਰ-ਛਾਇਆ ਹੇਠ ਰਹਿੰਦਾ ਹਾਂ, ਜੋ ਸਾਰੇ ਸੰਸਾਰ ਦੀ ਸੰਭਾਲ ਕਰਦਾ ਹੈ!' ਫਿਰ ਉਹ ਪਾਣੀ ਲੈ ਕੇ ਅੱਗੇ ਗਏ ਅਤੇ ਗੁਰੂ ਜੀ ਨੂੰ ਇਸ਼ਨਾਨ ਕਰਾਇਆ।",
"ਉਸ ਸਵੇਰ ਤੋਂ ਬਾਅਦ ਜੁਲਾਹੀ ਅਜੀਬ ਵਿਹਾਰ ਕਰਨ ਲੱਗੀ, ਜਿਵੇਂ ਉਸ ਦਾ ਮਨ ਪਰੇਸ਼ਾਨ ਹੋਵੇ। ਫ਼ਿਕਰਮੰਦ ਜੁਲਾਹਾ ਉਸ ਨੂੰ ਗੁਰੂ ਦਰਬਾਰ ਵਿੱਚ ਲੈ ਆਇਆ, ਸਭ ਨੂੰ ਸਾਰੀ ਗੱਲ ਦੱਸੀ, ਅਤੇ ਮਾਫ਼ੀ ਮੰਗੀ। ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ ਨੇ ਸੰਗਤ ਨੂੰ ਕਿਹਾ, 'ਕਦੇ ਕਿਸੇ ਬਾਰੇ ਮਾੜਾ ਨਾ ਬੋਲੋ।' ਉਨ੍ਹਾਂ ਨੇ ਜੁਲਾਹੀ ਨੂੰ ਮਾਫ਼ ਕਰ ਦਿੱਤਾ, ਅਤੇ ਉਹ ਠੀਕ ਹੋ ਗਈ। ਗੁਰੂ ਜੀ ਨੇ ਅਮਰਦਾਸ ਜੀ ਨੂੰ ਨਿਥਾਵਿਆਂ ਦਾ ਥਾਂ ਅਤੇ ਨਿਓਟਿਆਂ ਦੀ ਓਟ ਹੋਣ ਦੀ ਬਖ਼ਸ਼ਿਸ਼ ਕੀਤੀ।"],
l:"ਧੁੱਪ ਹੋਵੇ ਜਾਂ ਮੀਂਹ, ਹਰ ਰੋਜ਼ ਕੀਤੀ ਸੇਵਾ ਅਨਮੋਲ ਹੈ। ਸਾਡੇ ਬੋਲ ਵੀ ਮਹੱਤਵ ਰੱਖਦੇ ਹਨ: ਕਦੇ ਕਿਸੇ ਬਾਰੇ ਮਾੜਾ ਨਾ ਬੋਲੋ।"};

PA["gentle-answer"]={t:[
"1552 ਵਿੱਚ ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ ਨੇ ਅਮਰਦਾਸ ਜੀ ਨੂੰ ਤੀਜੇ ਗੁਰੂ ਥਾਪਿਆ ਅਤੇ ਗੋਇੰਦਵਾਲ ਨੂੰ ਆਪਣਾ ਟਿਕਾਣਾ ਬਣਾਉਣ ਲਈ ਕਿਹਾ। ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਅਤੇ ਬਹੁਤ ਸਿੱਖ ਉਨ੍ਹਾਂ ਨਾਲ ਗਏ, ਅਤੇ ਛੇਤੀ ਹੀ ਸੰਗਤਾਂ ਗੁਰੂ ਜੀ ਦੇ ਦਰਸ਼ਨਾਂ ਲਈ ਗੋਇੰਦਵਾਲ ਆਉਣ ਲੱਗੀਆਂ।",
"ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ ਦੇ ਪੁੱਤਰ ਦਾਸੂ ਨੇ ਆਪਣੇ ਆਪ ਨੂੰ ਗੁਰੂ ਐਲਾਨ ਦਿੱਤਾ ਅਤੇ ਖਡੂਰ ਹੀ ਬੈਠਾ ਰਿਹਾ, ਪਰ ਕੋਈ ਉਸ ਕੋਲ ਨਾ ਆਇਆ, ਅਤੇ ਉਹ ਗੁੱਸੇ ਹੋ ਗਿਆ। ਉਨ੍ਹਾਂ ਦੀ ਮਾਤਾ, ਮਾਤਾ ਖੀਵੀ ਜੀ, ਨੇ ਪੁੱਤਰਾਂ ਨੂੰ ਕਿਹਾ, 'ਗੁਰਗੱਦੀ ਕੋਈ ਜਾਇਦਾਦ ਨਹੀਂ ਜੋ ਵਿਰਾਸਤ ਵਿੱਚ ਮਿਲੇ। ਗੁਰੂ ਨਾਲ ਵੈਰ ਕਰਨਾ ਮੂਰਖਤਾ ਹੈ।' ਦਾਸੂ ਨੇ ਗੱਲ ਮੰਨ ਲਈ ਅਤੇ ਆਪਣਾ ਦਾਅਵਾ ਛੱਡ ਦਿੱਤਾ। ਪਰ ਉਸ ਦਾ ਭਰਾ ਦਾਤੂ ਨਾ ਮੰਨਿਆ।",
"ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਨੇ ਗੁਰੂ ਨਾਨਕ ਦਾ ਸੁਨੇਹਾ ਵੰਡਣ ਲਈ ਸਿੱਖਾਂ ਨੂੰ ਦੂਰ-ਦੂਰ ਭੇਜਿਆ, ਅਤੇ ਸੰਗਤ ਤੇਜ਼ੀ ਨਾਲ ਵਧੀ। ਸਿੱਖ ਹਰ ਕਿਸੇ ਨੂੰ ਬਰਾਬਰ ਸਮਝਦੇ ਸਨ, ਭਾਵੇਂ ਉਸ ਦੀ ਕੋਈ ਵੀ ਜਾਤ ਹੋਵੇ। ਕੁਝ ਲੋਕ, ਜਿਨ੍ਹਾਂ ਦੀ ਇਸ ਕਾਰਨ ਇੱਜ਼ਤ ਅਤੇ ਆਮਦਨ ਘਟ ਗਈ ਸੀ, ਈਰਖਾ ਕਰਨ ਲੱਗੇ। 1556 ਵਿੱਚ ਉਹ ਦਾਤੂ ਕੋਲ ਗਏ ਅਤੇ ਕਿਹਾ, 'ਅਸੀਂ ਤੈਨੂੰ ਗੁਰੂ ਬਣਨ ਵਿੱਚ ਮਦਦ ਕਰ ਸਕਦੇ ਹਾਂ।'",
"ਦਾਤੂ ਉਨ੍ਹਾਂ ਨਾਲ ਗੋਇੰਦਵਾਲ ਆਇਆ। ਜਦੋਂ ਉਸ ਨੇ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਦੁਆਲੇ ਵੱਡੀ ਸੰਗਤ ਵੇਖੀ, ਉਹ ਇੰਨਾ ਈਰਖਾਲੂ ਹੋ ਗਿਆ ਕਿ ਉਸ ਨੇ ਬਜ਼ੁਰਗ ਗੁਰੂ ਜੀ ਨੂੰ ਪਿੱਛੋਂ ਲੱਤ ਮਾਰ ਕੇ ਗੱਦੀ ਤੋਂ ਹੇਠਾਂ ਡੇਗ ਦਿੱਤਾ ਅਤੇ ਆਪ ਉਸ ਉੱਤੇ ਬੈਠ ਗਿਆ।",
"ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਨੂੰ ਗੁੱਸਾ ਨਹੀਂ ਆਇਆ। ਉਨ੍ਹਾਂ ਨੇ ਪਿਆਰ ਨਾਲ ਦਾਤੂ ਦਾ ਪੈਰ ਫੜ ਕੇ ਘੁੱਟਿਆ ਅਤੇ ਕਿਹਾ, 'ਸਤਿਕਾਰਯੋਗ ਦਾਤੂ ਜੀ, ਮੇਰੀਆਂ ਬੁੱਢੀਆਂ, ਸਖ਼ਤ ਹੱਡੀਆਂ ਨਾਲ ਤੁਹਾਡੇ ਕੋਮਲ ਪੈਰ ਨੂੰ ਸੱਟ ਤਾਂ ਨਹੀਂ ਲੱਗੀ?' ਦਾਤੂ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, 'ਇਸ ਗੱਦੀ ਦਾ ਅਸਲ ਵਾਰਸ ਮੈਂ ਹਾਂ। ਚੁੱਪ-ਚਾਪ ਇਹ ਪਿੰਡ ਛੱਡ ਜਾਓ।'",
"ਉਸੇ ਰਾਤ ਗੁਰੂ ਜੀ ਚੁੱਪ-ਚਾਪ ਗੋਇੰਦਵਾਲ ਛੱਡ ਕੇ ਆਪਣੇ ਪੁਰਾਣੇ ਪਿੰਡ ਬਾਸਰਕੇ ਚਲੇ ਗਏ। ਸਿੱਖ ਵੀ ਘਰਾਂ ਨੂੰ ਮੁੜ ਗਏ। ਦਾਤੂ ਤਿੰਨ-ਚਾਰ ਦਿਨ ਗੱਦੀ ਉੱਤੇ ਬੈਠਾ ਰਿਹਾ, ਪਰ ਇੱਕ ਵੀ ਸਿੱਖ ਉਸ ਨੂੰ ਮੱਥਾ ਟੇਕਣ ਨਾ ਆਇਆ। ਅਖ਼ੀਰ ਉਹ ਹਾਰ ਕੇ ਖਡੂਰ ਮੁੜ ਗਿਆ।"],
l:"ਨਿਮਰਤਾ ਗੁੱਸੇ ਨਾਲੋਂ ਤਾਕਤਵਰ ਹੈ। ਗੱਦੀ ਉੱਤੇ ਬੈਠਣ ਨਾਲ ਕੋਈ ਗੁਰੂ ਨਹੀਂ ਬਣਦਾ; ਸਿਰਫ਼ ਸੱਚੀ ਚੰਗਿਆਈ ਹੀ ਬਣਾਉਂਦੀ ਹੈ।"};

PA["baoli-at-goindwal"]={t:[
"1558 ਵਿੱਚ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਗੁਰੂ ਨਾਨਕ ਦਾ ਸੁਨੇਹਾ ਵੰਡਣ ਲਈ ਲੰਮੀ ਯਾਤਰਾ ਉੱਤੇ ਨਿਕਲੇ। ਕੁਰੂਕਸ਼ੇਤਰ ਵਿੱਚ ਜੋਗੀਆਂ ਸਮੇਤ ਹਜ਼ਾਰਾਂ ਲੋਕ ਉਨ੍ਹਾਂ ਨੂੰ ਸੁਣਨ ਆਏ। ਜਮਨਾ ਦਰਿਆ ਉੱਤੇ, ਪੁਲ ਦਾ ਮਹਿਸੂਲ ਲੈਣ ਵਾਲੇ ਇੰਨੇ ਪ੍ਰਭਾਵਿਤ ਹੋਏ ਕਿ ਉਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਮੱਥਾ ਟੇਕਿਆ ਅਤੇ ਸਾਰੇ ਸਿੱਖਾਂ ਨੂੰ ਬਿਨਾਂ ਮਹਿਸੂਲ ਲੰਘਣ ਦਿੱਤਾ।",
"ਕਨਖਲ ਅਤੇ ਹਰਿਦੁਆਰ ਵਿੱਚ ਉਨ੍ਹਾਂ ਨੇ ਸਿਖਾਇਆ ਕਿ ਕਾਮ, ਕ੍ਰੋਧ, ਲੋਭ, ਮੋਹ ਅਤੇ ਹੰਕਾਰ ਸਾਡੇ ਪੰਜ ਵੱਡੇ ਵੈਰੀ ਹਨ, ਅਤੇ ਗੁਰੂ ਦੀ ਸਿੱਖਿਆ ਉੱਤੇ ਚੱਲਣ ਨਾਲ ਅਸੀਂ ਇਨ੍ਹਾਂ ਨੂੰ ਜਿੱਤ ਸਕਦੇ ਹਾਂ। ਹਰਿਦੁਆਰ ਵਿੱਚ ਅੱਠ ਦਿਨ ਰਹਿ ਕੇ ਉਹ ਗੋਇੰਦਵਾਲ ਘਰ ਮੁੜ ਆਏ।",
"ਹੁਣ ਗੋਇੰਦਵਾਲ ਇੰਨੇ ਲੋਕ ਆਉਣ ਲੱਗੇ ਕਿ ਪਿੰਡ ਦਾ ਇੱਕੋ ਖੂਹ ਕਾਫ਼ੀ ਨਾ ਰਿਹਾ। ਇਸ ਲਈ ਗੁਰੂ ਜੀ ਨੇ ਇੱਕ ਬਾਉਲੀ ਬਣਾਉਣੀ ਸ਼ੁਰੂ ਕੀਤੀ, ਜੋ ਇੱਕ ਡੂੰਘਾ ਖੂਹ ਹੁੰਦਾ ਹੈ ਜਿਸ ਵਿੱਚ ਪਾਣੀ ਤੱਕ ਪੌੜੀਆਂ ਜਾਂਦੀਆਂ ਹਨ। ਸਿੱਖਾਂ ਨੇ ਬੜੇ ਚਾਅ ਨਾਲ ਕੰਮ ਕੀਤਾ। ਗੁਰੂ ਜੀ ਦੇ ਜਵਾਈ ਭਾਈ ਜੇਠਾ ਜੀ, ਜੋ ਬਾਅਦ ਵਿੱਚ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਬਣੇ, ਸਿਰ ਉੱਤੇ ਰੇਤ ਦੀਆਂ ਟੋਕਰੀਆਂ ਢੋਂਦੇ, ਅਤੇ ਸਭ ਨੂੰ ਸੇਵਾ ਕਰਨ ਦਾ ਢੰਗ ਵਿਖਾਉਂਦੇ।",
"ਜਦੋਂ 1559 ਵਿੱਚ ਬਾਉਲੀ ਪੂਰੀ ਹੋਈ, ਗੁਰੂ ਜੀ ਨੇ ਵੱਡਾ ਲੰਗਰ ਲਾਇਆ। ਉਨ੍ਹਾਂ ਨੇ ਐਲਾਨ ਕੀਤਾ ਕਿ ਪੰਗਤ ਵਿੱਚ ਬੈਠ ਕੇ ਛਕਣ ਵਾਲੇ ਹਰ ਇੱਕ ਨੂੰ ਇੱਕ ਰੁਪਈਆ ਮਿਲੇਗਾ। ਬਹੁਤ ਲੋਕ, ਜਿਨ੍ਹਾਂ ਨੇ ਕਦੇ ਹੋਰ ਜਾਤਾਂ ਵਾਲਿਆਂ ਨਾਲ ਬੈਠ ਕੇ ਨਹੀਂ ਖਾਧਾ ਸੀ, ਹੁਣ ਬੈਠ ਗਏ। ਦੁਪਹਿਰ ਨੂੰ ਭੇਟਾ ਪੰਜ ਰੁਪਏ ਹੋ ਗਈ, ਅਤੇ ਹੋਰ ਵੀ ਲੋਕ ਆਏ।",
"ਪਰ ਇੱਕ ਆਦਮੀ, ਹਰੀ ਰਾਮ ਨਾਂ ਦਾ ਸਾਧੂ, ਜੋ ਅਕਸਰ ਗੁਰੂ ਜੀ ਦੇ ਵਿਰੁੱਧ ਬੋਲਦਾ ਸੀ, ਸੱਦਾ ਮਿਲਣ ਉੱਤੇ ਵੀ ਨਾ ਆਇਆ। ਤੀਜੇ ਪਹਿਰ ਗੁਰੂ ਜੀ ਨੇ ਭੇਟਾ ਇੱਕ ਸੋਨੇ ਦੀ ਮੋਹਰ ਕਰ ਦਿੱਤੀ। ਹਰੀ ਰਾਮ ਤੋਂ ਰਿਹਾ ਨਾ ਗਿਆ। ਉਸ ਨੇ ਚੋਰੀ-ਚੋਰੀ ਆਪਣੇ ਨਿੱਕੇ ਪੁੱਤਰ ਨੂੰ ਲੰਗਰ ਛਕਣ ਅਤੇ ਮੋਹਰ ਲੈਣ ਭੇਜ ਦਿੱਤਾ।",
"ਸੇਵਾਦਾਰਾਂ ਨੇ ਮੁੰਡੇ ਨੂੰ ਵੇਖ ਲਿਆ, ਅਤੇ ਨਿੱਕਾ ਹੋਣ ਕਰਕੇ ਉਸ ਨੇ ਸਭ ਕੁਝ ਦੱਸ ਦਿੱਤਾ। ਛੇਤੀ ਹੀ ਸਾਰੇ ਪਿੰਡ ਨੂੰ ਪਤਾ ਲੱਗ ਗਿਆ ਕਿ ਇੰਨਾ ਪਵਿੱਤਰ ਬਣਨ ਵਾਲਾ ਹਰੀ ਰਾਮ ਅਸਲ ਵਿੱਚ ਪੈਸੇ ਦਾ ਭੁੱਖਾ ਸੀ, ਪਾਣੀ ਵਿੱਚ ਅਡੋਲ ਖੜ੍ਹੇ ਬਗਲੇ ਵਾਂਗ, ਜੋ ਭਗਤੀ ਦਾ ਦਿਖਾਵਾ ਕਰਦਾ ਮੱਛੀ ਫੜਨ ਦੀ ਤਾਕ ਵਿੱਚ ਹੁੰਦਾ ਹੈ। ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਨੇ ਬਾਅਦ ਵਿੱਚ ਗਉੜੀ ਕੀ ਵਾਰ ਵਿੱਚ ਇਸ ਬਾਰੇ ਲਿਖਿਆ। ਅੱਜ ਗੋਇੰਦਵਾਲ ਦੀ ਬਾਉਲੀ ਦੀਆਂ ਚੁਰਾਸੀ ਪੌੜੀਆਂ ਹਨ, ਅਤੇ ਸਿੱਖ ਅੱਜ ਵੀ ਪਿਆਰ ਨਾਲ ਦਰਸ਼ਨ ਕਰਨ ਜਾਂਦੇ ਹਨ।"],
l:"ਪੰਗਤ ਵਿੱਚ ਇਕੱਠੇ ਬੈਠ ਕੇ ਛਕਣਾ ਸਭ ਨੂੰ ਬਰਾਬਰ ਬਣਾਉਂਦਾ ਹੈ। ਪਵਿੱਤਰ ਦਿਸਣ ਨਾਲੋਂ ਸੱਚਮੁੱਚ ਈਮਾਨਦਾਰ ਹੋਣਾ ਵੱਧ ਜ਼ਰੂਰੀ ਹੈ।"};

PA["jetha-chickpea-seller"]={t:[
"ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਦਾ ਜਨਮ 1534 ਵਿੱਚ ਲਾਹੌਰ ਦੀ ਚੂਨਾ ਮੰਡੀ ਵਿੱਚ ਹੋਇਆ। ਉਨ੍ਹਾਂ ਦੇ ਪਿਤਾ ਹਰਿਦਾਸ ਸੋਢੀ ਜੀ ਸਨ। ਉਨ੍ਹਾਂ ਦਾ ਨਾਂ ਰਾਮਦਾਸ ਰੱਖਿਆ ਗਿਆ, ਪਰ ਸਭ ਤੋਂ ਵੱਡੇ ਬੱਚੇ ਹੋਣ ਕਰਕੇ ਘਰ ਵਿੱਚ ਸਭ ਉਨ੍ਹਾਂ ਨੂੰ ਜੇਠਾ ਕਹਿੰਦੇ ਸਨ, ਜਿਸ ਦਾ ਅਰਥ ਹੈ 'ਪਲੇਠੀ ਦਾ'।",
"ਜਦੋਂ ਜੇਠਾ ਜੀ ਸਿਰਫ਼ ਸੱਤ ਸਾਲ ਦੇ ਸਨ, ਮਾਤਾ-ਪਿਤਾ ਦੋਵੇਂ ਚਲਾਣਾ ਕਰ ਗਏ। ਨਾਨੀ ਜੀ ਉਨ੍ਹਾਂ ਨੂੰ ਆਪਣੇ ਨਾਲ ਪਿੰਡ ਬਾਸਰਕੇ ਲੈ ਗਏ। ਗੁਜ਼ਾਰਾ ਕਰਨ ਲਈ ਨਿੱਕੇ ਜੇਠਾ ਜੀ ਪਿੰਡ ਵਿੱਚ ਉਬਲੇ, ਲੂਣ ਲੱਗੇ ਛੋਲੇ, ਜਿਨ੍ਹਾਂ ਨੂੰ ਘੁੰਗਣੀਆਂ ਕਹਿੰਦੇ ਹਨ, ਵੇਚਦੇ ਸਨ।",
"1546 ਵਿੱਚ ਭਾਈ ਅਮਰਦਾਸ ਜੀ ਆਪਣੇ ਪਰਿਵਾਰ ਨੂੰ ਨਵੇਂ ਨਗਰ ਗੋਇੰਦਵਾਲ ਲੈ ਜਾਣ ਲਈ ਬਾਸਰਕੇ ਆਏ, ਅਤੇ ਜੇਠਾ ਜੀ ਨੂੰ ਵੀ ਨਾਲ ਲੈ ਗਏ। ਗੋਇੰਦਵਾਲ ਵਿੱਚ ਜੇਠਾ ਜੀ ਫਿਰ ਘੁੰਗਣੀਆਂ ਵੇਚਣ ਲੱਗੇ, ਅਤੇ ਹਰ ਰੋਜ਼ ਆਪਣਾ ਗੇੜਾ ਲਾ ਕੇ ਗੁਰੂ ਜੀ ਦਾ ਉਪਦੇਸ਼ ਸੁਣਨ ਆਈ ਸੰਗਤ ਦੀ ਸੇਵਾ ਕਰਦੇ।",
"1552 ਵਿੱਚ ਅਮਰਦਾਸ ਜੀ ਤੀਜੇ ਗੁਰੂ ਬਣੇ। ਇੱਕ ਦਿਨ ਉਨ੍ਹਾਂ ਦੇ ਮਹਿਲ, ਮਾਤਾ ਮਨਸਾ ਦੇਵੀ ਜੀ, ਨੇ ਕਿਹਾ, 'ਹੁਣ ਆਪਣੀ ਧੀ ਬੀਬੀ ਭਾਨੀ ਲਈ ਚੰਗਾ ਵਰ ਲੱਭਣ ਦਾ ਸਮਾਂ ਹੈ।' 'ਕਿਹੋ ਜਿਹਾ ਵਰ ਲੱਭੀਏ?' ਗੁਰੂ ਜੀ ਨੇ ਪੁੱਛਿਆ। ਉਸੇ ਵੇਲੇ ਜੇਠਾ ਜੀ ਕੋਲੋਂ ਲੰਘੇ। ਮਾਤਾ ਜੀ ਨੇ ਇਸ਼ਾਰਾ ਕਰਕੇ ਕਿਹਾ, 'ਇਸ ਵਰਗਾ।' ਗੁਰੂ ਜੀ ਮੁਸਕਰਾਏ। 'ਇਸ ਵਰਗਾ ਤਾਂ ਇੱਕੋ ਹੀ ਹੈ: ਇਹ ਆਪ।' ਇਸ ਤਰ੍ਹਾਂ ਜੇਠਾ ਜੀ ਅਤੇ ਬੀਬੀ ਭਾਨੀ ਜੀ ਦਾ ਵਿਆਹ ਹੋਇਆ।",
"ਬਾਅਦ ਵਿੱਚ, ਜਦੋਂ ਗੋਇੰਦਵਾਲ ਵਿੱਚ ਬਾਉਲੀ ਬਣ ਰਹੀ ਸੀ, ਜੇਠਾ ਜੀ ਸਭ ਦੇ ਨਾਲ ਮੋਢੇ ਨਾਲ ਮੋਢਾ ਜੋੜ ਕੇ ਸਿਰ ਉੱਤੇ ਰੇਤ ਦੀਆਂ ਟੋਕਰੀਆਂ ਢੋਂਦੇ। ਇੱਕ ਦਿਨ ਲਾਹੌਰ ਤੋਂ ਕੁਝ ਰਿਸ਼ਤੇਦਾਰ ਹਰਿਦੁਆਰ ਜਾਂਦਿਆਂ ਉੱਥੋਂ ਲੰਘੇ ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਵੇਖਿਆ। ਉਹ ਹੈਰਾਨ ਰਹਿ ਗਏ। 'ਤੁਸੀਂ ਆਪਣੇ ਜਵਾਈ ਤੋਂ ਆਮ ਮਜ਼ਦੂਰ ਵਾਂਗ ਕੰਮ ਕਰਵਾ ਰਹੇ ਹੋ!' ਉਨ੍ਹਾਂ ਨੇ ਗੁੱਸੇ ਨਾਲ ਗੁਰੂ ਜੀ ਨੂੰ ਕਿਹਾ। 'ਇਹ ਠੀਕ ਨਹੀਂ।'",
"ਜੇਠਾ ਜੀ ਹੱਥ ਜੋੜ ਕੇ ਗੁਰੂ ਜੀ ਕੋਲ ਗਏ। 'ਕਿਰਪਾ ਕਰਕੇ ਇਨ੍ਹਾਂ ਉੱਤੇ ਨਾਰਾਜ਼ ਨਾ ਹੋਵੋ,' ਉਨ੍ਹਾਂ ਕਿਹਾ। 'ਇਹ ਸਮਝਦੇ ਨਹੀਂ। ਸੇਵਾ ਜਾਤ, ਖ਼ਾਨਦਾਨ ਜਾਂ ਹੰਕਾਰ ਤੋਂ ਉੱਚੀ ਹੈ।'"],
l:"ਕੋਈ ਵੀ ਈਮਾਨਦਾਰ ਕਿਰਤ ਨੀਵੀਂ ਨਹੀਂ ਹੁੰਦੀ। ਸੇਵਾ ਖ਼ਾਨਦਾਨ ਜਾਂ ਰੁਤਬੇ ਦੇ ਹਰ ਮਾਣ ਤੋਂ ਉੱਚੀ ਹੈ।"};

PA["answers-in-akbars-court"]={t:[
"1559 ਵਿੱਚ ਗੋਇੰਦਵਾਲ ਦੀ ਬਾਉਲੀ ਬਣਨ ਤੋਂ ਬਾਅਦ ਗੁਰੂ ਨਾਨਕ ਦਾ ਸੁਨੇਹਾ ਹੋਰ ਵੀ ਤੇਜ਼ੀ ਨਾਲ ਫੈਲਿਆ। ਗੋਇੰਦਵਾਲ ਵਿੱਚ ਹਰ ਕੋਈ, ਭਾਵੇਂ ਕਿਸੇ ਵੀ ਜਾਤ ਦਾ ਹੋਵੇ, ਪੰਗਤ ਵਿੱਚ ਇਕੱਠਾ ਛਕਦਾ ਅਤੇ ਇੱਕੋ ਥਾਂ ਇਸ਼ਨਾਨ ਕਰਦਾ। ਆਉਣ ਵਾਲੇ ਘਰ ਜਾ ਕੇ ਆਪਣੇ ਪਿੰਡਾਂ ਵਿੱਚ ਵੀ ਇਸੇ ਤਰ੍ਹਾਂ ਰਹਿਣ ਲੱਗੇ।",
"ਹਰ ਕੋਈ ਇਸ ਤੋਂ ਖ਼ੁਸ਼ ਨਹੀਂ ਸੀ। ਕੁਝ ਲੋਕਾਂ ਨੂੰ ਜਾਤ ਕਰਕੇ ਸਦਾ ਦੂਜਿਆਂ ਤੋਂ ਉੱਚਾ ਸਮਝਿਆ ਜਾਂਦਾ ਸੀ, ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਇਹ ਗੱਲ ਚੰਗੀ ਨਾ ਲੱਗੀ ਕਿ ਸਭ ਬਰਾਬਰ ਹਨ। 1566 ਵਿੱਚ, ਜਦੋਂ ਮੁਗ਼ਲ ਬਾਦਸ਼ਾਹ ਅਕਬਰ ਲਾਹੌਰ ਠਹਿਰਿਆ ਹੋਇਆ ਸੀ, ਉਨ੍ਹਾਂ ਨੇ ਉਸ ਨੂੰ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਵਿਰੁੱਧ ਸ਼ਿਕਾਇਤਾਂ ਦੀ ਸੂਚੀ ਦਿੱਤੀ। ਅਕਬਰ ਨੇ ਸੁਨੇਹਾ ਭੇਜਿਆ ਕਿ ਗੁਰੂ ਜੀ ਆ ਕੇ ਇਨ੍ਹਾਂ ਦਾ ਜਵਾਬ ਦੇਣ।",
"ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਨੇ ਆਪਣੀ ਥਾਂ ਜਵਾਬ ਦੇਣ ਲਈ ਭਾਈ ਜੇਠਾ ਜੀ ਨੂੰ ਲਾਹੌਰ ਭੇਜਿਆ। ਬਾਦਸ਼ਾਹ ਦੇ ਦਰਬਾਰ ਵਿੱਚ ਭਾਈ ਜੇਠਾ ਜੀ ਨੇ ਹਰ ਸ਼ਿਕਾਇਤ ਸੁਣੀ ਅਤੇ ਇੱਕ-ਇੱਕ ਕਰਕੇ ਸ਼ਾਂਤੀ ਨਾਲ ਜਵਾਬ ਦਿੱਤਾ।",
"'ਸਿੱਖ ਹਰ ਰੋਜ਼ ਮਿੱਥੇ ਸਮੇਂ ਉੱਤੇ ਪੁਰਾਣੀਆਂ ਪ੍ਰਾਰਥਨਾਵਾਂ ਨਹੀਂ ਕਰਦੇ,' ਪਹਿਲੀ ਸ਼ਿਕਾਇਤ ਸੀ। ਭਾਈ ਜੇਠਾ ਜੀ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, 'ਗੁਰੂ ਨਾਨਕ ਦਾ ਉਪਦੇਸ਼ ਹਰ ਜਾਤ ਅਤੇ ਧਰਮ ਦੇ ਲੋਕਾਂ ਲਈ ਹੈ। ਇਹ ਸਾਨੂੰ ਸਿਰਫ਼ ਮਿੱਥੇ ਵੇਲੇ ਨਹੀਂ, ਹਰ ਵੇਲੇ ਰੱਬ ਨੂੰ ਯਾਦ ਕਰਨ ਲਈ ਕਹਿੰਦਾ ਹੈ।'",
"'ਸਿੱਖ ਜਾਤ-ਪਾਤ ਨੂੰ ਨਹੀਂ ਮੰਨਦੇ,' ਇੱਕ ਹੋਰ ਸ਼ਿਕਾਇਤ ਸੀ। ਭਾਈ ਜੇਠਾ ਜੀ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, 'ਸਾਰੇ ਲੋਕ ਇੱਕੋ ਕਰਤਾਰ ਦੇ ਬੱਚੇ ਹਨ। ਕੋਈ ਜਨਮ ਤੋਂ ਕਿਸੇ ਨਾਲੋਂ ਉੱਚਾ ਜਾਂ ਨੀਵਾਂ ਨਹੀਂ।' ਇਸ ਸ਼ਿਕਾਇਤ ਉੱਤੇ ਕਿ ਸਿੱਖ ਮੂਰਤੀ ਪੂਜਾ ਨਹੀਂ ਕਰਦੇ, ਉਨ੍ਹਾਂ ਕਿਹਾ, 'ਸਿੱਖ ਮੰਨਦੇ ਹਨ ਕਿ ਰੱਬ ਜਿਉਂਦਾ-ਜਾਗਦਾ ਹੈ ਅਤੇ ਹਰ ਪਲ ਹਰ ਥਾਂ ਮੌਜੂਦ ਹੈ।' ਅਤੇ ਇਸ ਸ਼ਿਕਾਇਤ ਉੱਤੇ ਕਿ ਸਿੱਖ ਤੀਰਥਾਂ ਉੱਤੇ ਨਹੀਂ ਜਾਂਦੇ, ਉਨ੍ਹਾਂ ਕਿਹਾ, 'ਕੋਈ ਥਾਂ ਇਸ ਲਈ ਪਵਿੱਤਰ ਹੁੰਦੀ ਹੈ ਕਿਉਂਕਿ ਉੱਥੇ ਸਿਆਣੇ ਪੁਰਖ ਉਪਦੇਸ਼ ਦਿੰਦੇ ਅਤੇ ਸੱਚਾ ਗਿਆਨ ਵੰਡਦੇ ਹਨ।'",
"ਅਕਬਰ ਉਨ੍ਹਾਂ ਦੇ ਸਪਸ਼ਟ ਅਤੇ ਨਰਮ ਜਵਾਬਾਂ ਤੋਂ ਪ੍ਰਭਾਵਿਤ ਹੋਇਆ, ਅਤੇ ਭਾਈ ਜੇਠਾ ਜੀ ਨੂੰ ਸਿਰੋਪਾ ਦੇ ਕੇ ਸਨਮਾਨਿਤ ਕੀਤਾ। ਜਾਣ ਤੋਂ ਪਹਿਲਾਂ ਭਾਈ ਜੇਠਾ ਜੀ ਨੇ ਬਾਦਸ਼ਾਹ ਨੂੰ ਬੇਨਤੀ ਕੀਤੀ ਕਿ ਹਿੰਦੂਆਂ ਉੱਤੇ ਲੱਗੇ ਖ਼ਾਸ ਟੈਕਸ, ਤੀਰਥ ਯਾਤਰੀਆਂ ਉੱਤੇ ਲੱਗਾ ਟੈਕਸ ਵੀ, ਬੰਦ ਕੀਤੇ ਜਾਣ। ਕਹਿੰਦੇ ਹਨ ਕਿ ਅਕਬਰ ਮੰਨ ਗਿਆ।"],
l:"ਨੁਕਤਾਚੀਨੀ ਦਾ ਜਵਾਬ ਸ਼ਾਂਤੀ ਅਤੇ ਸਪਸ਼ਟਤਾ ਨਾਲ ਦਿਓ। ਬਰਾਬਰੀ ਲਈ ਖੜ੍ਹਨਾ ਸਿਰਫ਼ ਸਾਡੀ ਨਹੀਂ, ਸਭ ਦੀ ਮਦਦ ਕਰਦਾ ਹੈ।"};

PA["founding-of-amritsar"]={t:[
"1570 ਵਿੱਚ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਭਾਈ ਜੇਠਾ ਜੀ ਨੂੰ ਨਾਲ ਲੈ ਕੇ ਨੇੜਲੇ ਪਿੰਡਾਂ, ਗੁਮਟਾਲਾ, ਤੁੰਗ, ਸੁਲਤਾਨਵਿੰਡ ਅਤੇ ਗਿਲਵਾਲੀ, ਦੇ ਚੌਧਰੀਆਂ ਨੂੰ ਮਿਲੇ। ਉਨ੍ਹਾਂ ਨੇ ਦੱਸਿਆ ਕਿ ਉਹ ਇੱਕ ਨਵਾਂ ਨਗਰ ਵਸਾਉਣਾ ਚਾਹੁੰਦੇ ਹਨ। ਸਭ ਖ਼ੁਸ਼ੀ ਨਾਲ ਮੰਨ ਗਏ ਅਤੇ ਜ਼ਮੀਨ ਦੀ ਪੇਸ਼ਕਸ਼ ਕੀਤੀ। ਗੁਰੂ ਜੀ ਨੇ ਮੁੱਲ ਦੇ ਕੇ ਜ਼ਮੀਨ ਆਪਣੇ ਨਾਂ ਕਰਵਾਈ, ਅਤੇ ਨਗਰ ਦਾ ਨਾਂ ਗੁਰੂ ਕਾ ਚੱਕ ਰੱਖਿਆ ਗਿਆ।",
"ਨੀਂਹ ਪੱਥਰ ਇੱਕ ਖ਼ਾਸ ਥਾਂ ਉੱਤੇ ਰੱਖਿਆ ਗਿਆ। ਬਹੁਤ ਪਹਿਲਾਂ, 1497 ਵਿੱਚ, ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਆਪਣੀ ਪਹਿਲੀ ਵੱਡੀ ਉਦਾਸੀ ਦੌਰਾਨ ਭਾਈ ਮਰਦਾਨੇ ਨਾਲ ਉੱਥੇ ਰੁਕੇ ਸਨ। ਉਨ੍ਹਾਂ ਨੇ ਕਿਹਾ ਸੀ, 'ਮਰਦਾਨਿਆ, ਇੱਕ ਦਿਨ ਇੱਥੇ ਇੱਕ ਵੱਡਾ ਨਗਰ ਵਸੇਗਾ, ਜੋ ਸੱਚ ਦਾ ਸੁਨੇਹਾ ਫੈਲਾਵੇਗਾ।' ਹੁਣ ਉਨ੍ਹਾਂ ਦੇ ਬਚਨ ਸੱਚ ਹੋ ਰਹੇ ਸਨ।",
"ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਨੇ ਭਾਈ ਜੇਠਾ ਜੀ ਨੂੰ ਸਮਝਾਇਆ ਕਿ ਨਗਰ ਕਿਵੇਂ ਵਸਾਉਣਾ ਹੈ, ਫਿਰ ਗੋਇੰਦਵਾਲ ਮੁੜ ਗਏ ਅਤੇ ਸਾਰਾ ਕੰਮ ਉਨ੍ਹਾਂ ਨੂੰ ਸੌਂਪ ਦਿੱਤਾ। ਭਾਈ ਜੇਠਾ ਜੀ ਨੇ ਪਹਿਲਾਂ ਇੱਕ ਘਰ ਬਣਾਇਆ, ਜੋ ਗੁਰੂ ਕੇ ਕੋਠੇ ਵਜੋਂ ਜਾਣਿਆ ਗਿਆ। ਫਿਰ ਉਨ੍ਹਾਂ ਨੇ ਸੰਤੋਖਸਰ ਸਰੋਵਰ ਦੀ ਖੁਦਾਈ ਸ਼ੁਰੂ ਕੀਤੀ।",
"ਕੰਮ ਨੂੰ ਬਹੁਤ ਸਮਾਂ ਲੱਗਣਾ ਸੀ, ਇਸ ਲਈ ਸਿੱਖ ਅਤੇ ਕਾਮੇ ਨੇੜੇ ਹੀ ਆਪਣੇ ਘਰ ਬਣਾਉਣ ਲੱਗੇ। ਭਾਈ ਜੇਠਾ ਜੀ ਨੇ ਲੰਗਰ ਚਲਾਇਆ, ਜਿੱਥੇ ਹਰ ਕਾਮਾ ਅਤੇ ਹਰ ਭੁੱਖਾ ਜਿੰਨਾ ਚਾਹੇ ਛਕ ਸਕਦਾ ਸੀ।",
"ਇੱਕ ਦਿਨ ਭਾਈ ਜੇਠਾ ਜੀ ਗੋਇੰਦਵਾਲ ਗਏ ਅਤੇ ਗੁਰੂ ਜੀ ਨੂੰ ਦੱਸਿਆ ਕਿ ਨਵਾਂ ਨਗਰ ਚੰਗੀ ਤਰ੍ਹਾਂ ਵਸ ਰਿਹਾ ਹੈ। ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਬਹੁਤ ਪ੍ਰਸੰਨ ਹੋਏ, ਅਤੇ 1574 ਵਿੱਚ ਉਨ੍ਹਾਂ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਚੌਥੇ ਗੁਰੂ, ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਥਾਪਿਆ, ਅਤੇ ਪਰਿਵਾਰ ਸਮੇਤ ਨਵੇਂ ਨਗਰ ਜਾ ਕੇ ਰਹਿਣ ਲਈ ਕਿਹਾ।",
"ਹੁਣ ਸੰਗਤਾਂ ਗੁਰੂ ਜੀ ਦੇ ਦਰਸ਼ਨਾਂ ਲਈ ਨਵੇਂ ਨਗਰ ਆਉਣ ਲੱਗੀਆਂ। ਹਰ ਤਰ੍ਹਾਂ ਦੇ ਕਿੱਤਿਆਂ ਵਾਲੇ ਲੋਕ ਉੱਥੇ ਵਸਣ ਲਈ ਆਏ, ਅਤੇ ਨਗਰ ਚੱਕ ਰਾਮਦਾਸ ਵਜੋਂ ਜਾਣਿਆ ਜਾਣ ਲੱਗਾ। 1577 ਵਿੱਚ ਗੁਰੂ ਜੀ ਨੇ ਤੁੰਗ ਪਿੰਡ ਤੋਂ ਹੋਰ ਜ਼ਮੀਨ ਖ਼ਰੀਦੀ ਤਾਂ ਜੋ ਨਗਰ ਵਧ ਸਕੇ। ਅਤੇ ਜਦੋਂ ਅੰਮ੍ਰਿਤ ਦਾ ਵੱਡਾ ਸਰੋਵਰ ਬਣਿਆ, ਨਗਰ ਅੰਮ੍ਰਿਤਸਰ, ਭਾਵ ਅੰਮ੍ਰਿਤ ਦਾ ਸਰੋਵਰ, ਵਜੋਂ ਮਸ਼ਹੂਰ ਹੋ ਗਿਆ।"],
l:"ਵੱਡੇ ਕੰਮ ਸਬਰ ਅਤੇ ਸੇਵਾ ਨਾਲ ਕਦਮ-ਕਦਮ ਕਰਕੇ ਹੁੰਦੇ ਹਨ। ਜਿਸ ਨਗਰ ਵਿੱਚ ਲੰਗਰ ਹੋਵੇ, ਉੱਥੇ ਹਰ ਕਿਸੇ ਦਾ ਸੁਆਗਤ ਹੁੰਦਾ ਹੈ।"};

PA["bibi-rajnis-faith"]={t:[
"ਪੱਟੀ ਪਿੰਡ ਵਿੱਚ ਦੁਨੀ ਚੰਦ ਨਾਂ ਦਾ ਇੱਕ ਅਮੀਰ ਜ਼ਿਮੀਂਦਾਰ ਰਹਿੰਦਾ ਸੀ, ਜਿਸ ਦੀਆਂ ਪੰਜ ਧੀਆਂ ਸਨ। ਇੱਕ ਦਿਨ ਉਸ ਨੇ ਉਨ੍ਹਾਂ ਤੋਂ ਪੁੱਛਿਆ, 'ਤੁਹਾਨੂੰ ਰੋਟੀ ਕੌਣ ਦਿੰਦਾ ਹੈ?' ਚਾਰ ਧੀਆਂ ਨੇ ਕਿਹਾ, 'ਤੁਸੀਂ, ਪਿਤਾ ਜੀ।' ਪਰ ਸਭ ਤੋਂ ਛੋਟੀ, ਰਜਨੀ, ਨੇ ਕਿਹਾ, 'ਰੱਬ ਸਭ ਨੂੰ ਰੋਟੀ ਦਿੰਦਾ ਹੈ, ਮੈਨੂੰ ਵੀ।'",
"ਦੁਨੀ ਚੰਦ ਨੂੰ ਬਹੁਤ ਗੁੱਸਾ ਆਇਆ। 'ਫਿਰ ਵੇਖਦੇ ਹਾਂ ਰੱਬ ਤੈਨੂੰ ਕਿਵੇਂ ਖਵਾਉਂਦਾ ਹੈ!' ਉਸ ਨੇ ਕਿਹਾ। ਜਦੋਂ ਰਜਨੀ ਵੱਡੀ ਹੋਈ, ਉਸ ਨੇ ਉਸ ਦਾ ਵਿਆਹ ਇੱਕ ਬਹੁਤ ਬਿਮਾਰ ਆਦਮੀ ਨਾਲ ਕਰ ਦਿੱਤਾ ਜੋ ਤੁਰ ਨਹੀਂ ਸਕਦਾ ਸੀ, ਅਤੇ ਉਸ ਨੂੰ ਘਰੋਂ ਕੱਢ ਦਿੱਤਾ।",
"ਰਜਨੀ ਨੇ ਸ਼ਿਕਾਇਤ ਨਾ ਕੀਤੀ। ਉਹ ਆਪਣੇ ਪਤੀ ਨੂੰ ਟੋਕਰੀ ਵਿੱਚ ਸਿਰ ਉੱਤੇ ਚੁੱਕ ਕੇ ਪਿੰਡ-ਪਿੰਡ ਫਿਰਦੀ, ਅਤੇ ਜੋ ਲੋਕ ਦੇ ਦਿੰਦੇ ਉਸੇ ਨਾਲ ਗੁਜ਼ਾਰਾ ਕਰਦੀ, ਸਦਾ ਰੱਬ ਉੱਤੇ ਭਰੋਸਾ ਰੱਖਦੀ।",
"ਇੱਕ ਦਿਨ ਉਸ ਨੇ ਇੱਕ ਛੋਟੇ ਜਿਹੇ ਛੱਪੜ ਕੰਢੇ ਬੇਰੀ ਦੀ ਛਾਂ ਹੇਠ ਟੋਕਰੀ ਰੱਖੀ ਅਤੇ ਰੋਟੀ ਲੱਭਣ ਨੇੜਲੇ ਪਿੰਡ ਚਲੀ ਗਈ। ਉਸ ਦੇ ਜਾਣ ਤੋਂ ਬਾਅਦ ਉਸ ਦੇ ਪਤੀ ਨੇ ਇੱਕ ਅਚੰਭਾ ਵੇਖਿਆ: ਕਾਲੇ ਕਾਂ ਛੱਪੜ ਵਿੱਚ ਚੁੱਭੀ ਮਾਰਦੇ ਅਤੇ ਘੁੱਗੀਆਂ ਵਾਂਗ ਚਿੱਟੇ ਹੋ ਕੇ ਉੱਡ ਜਾਂਦੇ! ਉਹ ਰਿੜ੍ਹ ਕੇ ਪਾਣੀ ਤੱਕ ਪਹੁੰਚਿਆ ਅਤੇ ਚੁੱਭੀ ਮਾਰੀ, ਅਤੇ ਉਹ ਤੰਦਰੁਸਤ ਹੋ ਗਿਆ।",
"ਜਦੋਂ ਰਜਨੀ ਮੁੜੀ, ਉਸ ਨੇ ਰੁੱਖ ਹੇਠ ਇੱਕ ਤੰਦਰੁਸਤ ਆਦਮੀ ਬੈਠਾ ਵੇਖਿਆ। 'ਮੈਂ ਤੇਰਾ ਪਤੀ ਹਾਂ,' ਉਸ ਨੇ ਕਿਹਾ। ਪਰ ਰਜਨੀ ਨੂੰ ਯਕੀਨ ਨਾ ਆਇਆ, ਇਸ ਲਈ ਉਹ ਉਸ ਨੂੰ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਕੋਲ ਲੈ ਗਈ। 'ਰਜਨੀ, ਇਹ ਸੱਚਮੁੱਚ ਤੇਰਾ ਪਤੀ ਹੈ,' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ। 'ਤੇਰੇ ਰੱਬ ਉੱਤੇ ਭਰੋਸੇ ਨੇ ਇਸ ਨੂੰ ਠੀਕ ਕਰ ਦਿੱਤਾ ਹੈ।'",
"ਗੁਰੂ ਜੀ ਨੇ ਸੰਗਤ ਨੂੰ ਕਿਹਾ, 'ਇਹੀ ਉਹ ਪਵਿੱਤਰ ਥਾਂ ਹੈ ਜਿਸ ਬਾਰੇ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਨੇ ਦੱਸਿਆ ਸੀ।' ਅਗਲੀ ਸਵੇਰ ਹੀ, ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਨਾਲ ਮਿਲ ਕੇ, ਉਨ੍ਹਾਂ ਨੇ ਉੱਥੇ ਵੱਡੇ ਸਰੋਵਰ ਦੀ ਖੁਦਾਈ ਸ਼ੁਰੂ ਕਰ ਦਿੱਤੀ। ਉਹੀ ਸਰੋਵਰ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਦੁਆਲੇ ਦਾ ਸਰੋਵਰ ਹੈ, ਅਤੇ ਉਹ ਬੇਰੀ, ਜਿਸ ਨੂੰ ਦੁੱਖ ਭੰਜਨੀ ਬੇਰੀ, ਭਾਵ ਦੁੱਖ ਦੂਰ ਕਰਨ ਵਾਲੀ ਬੇਰੀ, ਕਹਿੰਦੇ ਹਨ, ਅੱਜ ਵੀ ਉਸ ਦੇ ਕੰਢੇ ਖੜ੍ਹੀ ਹੈ।"],
l:"ਰੱਬ ਸਭ ਦੀ ਸੰਭਾਲ ਕਰਦਾ ਹੈ। ਔਖੇ ਵੇਲੇ ਵੀ ਭਰੋਸਾ ਰੱਖਣ ਨਾਲ ਬਖ਼ਸ਼ਿਸ਼ਾਂ ਮਿਲਦੀਆਂ ਹਨ।"};

PA["yogis-question"]={t:[
"ਜਦੋਂ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਅੰਮ੍ਰਿਤਸਰ ਵਿੱਚ ਪਵਿੱਤਰ ਸਰੋਵਰ ਬਣਵਾ ਰਹੇ ਸਨ, ਜੋਗੀਆਂ ਦੀ ਇੱਕ ਟੋਲੀ ਉਨ੍ਹਾਂ ਨੂੰ ਮਿਲਣ ਆਈ। ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਦਾ ਨਿੱਘਾ ਸੁਆਗਤ ਕੀਤਾ, ਬੈਠਣ ਲਈ ਥਾਂ ਦਿੱਤੀ, ਅਤੇ ਆਉਣ ਦਾ ਕਾਰਨ ਪੁੱਛਿਆ।",
"ਉਨ੍ਹਾਂ ਦੇ ਮੁਖੀ ਨੇ ਕਿਹਾ, 'ਗੁਰੂ ਜੀ, ਤੁਹਾਡੇ ਸਿੱਖ ਜੋਗ ਨਹੀਂ ਕਮਾਉਂਦੇ। ਜੋਗ ਬਿਨਾਂ ਉਹ ਮਨ ਨੂੰ ਕਿਵੇਂ ਵੱਸ ਕਰਨਗੇ? ਅਤੇ ਸ਼ਾਂਤ ਮਨ ਬਿਨਾਂ ਰੱਬ ਨੂੰ ਕਿਵੇਂ ਪਾਉਣਗੇ? ਜੇ ਉਹ ਦੁਨੀਆਦਾਰੀ ਵਿੱਚ ਰੁੱਝੇ ਰਹਿੰਦੇ ਹਨ, ਤਾਂ ਤੁਹਾਡੇ ਸਿੱਖ ਹੋਣ ਦਾ ਕੀ ਲਾਭ?'",
"ਗੁਰੂ ਜੀ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, 'ਅਸੀਂ ਆਪਣੇ ਸਿੱਖਾਂ ਨੂੰ ਰੱਬ ਨਾਲ ਪਿਆਰ ਕਰਨਾ ਸਿਖਾਉਂਦੇ ਹਾਂ। ਦਇਆ ਅਤੇ ਪਿਆਰ ਬਿਨਾਂ ਕੋਈ ਰੱਬ ਨੂੰ ਨਹੀਂ ਜਾਣ ਸਕਦਾ। ਜਦੋਂ ਦਿਲ ਵਿੱਚ ਰੱਬ ਦਾ ਪਿਆਰ ਵਧਦਾ ਹੈ, ਤਾਂ ਮਨੁੱਖ ਸਾਰੀ ਕੁਦਰਤ ਵਿੱਚ ਰੱਬ ਨੂੰ ਵੇਖਦਾ ਹੈ। ਉਹ ਸ਼ਾਂਤ ਅਤੇ ਅਨੰਦ ਵਿੱਚ ਰਹਿੰਦਾ ਹੈ, ਉਸ ਦਾ ਹੰਕਾਰ ਪਿਘਲ ਜਾਂਦਾ ਹੈ, ਅਤੇ ਕਿਰਤ ਕਰਦਿਆਂ ਅਤੇ ਗ੍ਰਿਹਸਤ ਵਿੱਚ ਰਹਿੰਦਿਆਂ ਵੀ ਉਹ ਲਾਲਚ ਵਿੱਚ ਨਹੀਂ ਫਸਦਾ।'",
"ਫਿਰ ਗੁਰੂ ਜੀ ਨੇ ਆਪ ਇੱਕ ਸਵਾਲ ਪੁੱਛਿਆ। 'ਜੇ ਜੋਗੀਆਂ ਨੂੰ ਮਨ ਦੀ ਸ਼ਾਂਤੀ ਮਿਲ ਜਾਂਦੀ ਹੈ, ਤਾਂ ਉਹ ਪਹਾੜਾਂ ਅਤੇ ਜੰਗਲਾਂ ਵਿੱਚ ਜਾ ਕੇ ਕਿਉਂ ਰਹਿੰਦੇ ਹਨ? ਉਹ ਲੋਕਾਂ ਵਿੱਚ ਰਹਿ ਕੇ ਦੁਖੀਆਂ ਦੀ ਮਦਦ ਕਿਉਂ ਨਹੀਂ ਕਰਦੇ?' ਜੋਗੀਆਂ ਕੋਲ ਕੋਈ ਜਵਾਬ ਨਹੀਂ ਸੀ।",
"ਫਿਰ ਗੁਰੂ ਜੀ ਨੇ ਇੱਕ ਸ਼ਬਦ ਗਾਇਆ (ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ, ਅੰਗ 368), ਜਿਸ ਵਿੱਚ ਪਿਆਰ ਨਾਲ ਸਮਝਾਇਆ ਗਿਆ: 'ਹੇ ਜੋਗੀ, ਦਿਖਾਵੇ ਲਈ ਸਾਜ਼ ਵਜਾਉਣਾ ਕਾਫ਼ੀ ਨਹੀਂ। ਗੁਰੂ ਤੋਂ ਸਿੱਖ, ਰੱਬ ਦੇ ਗੁਣ ਗਾ, ਅਤੇ ਆਪਣਾ ਮਨ ਉਸ ਵਿੱਚ ਟਿਕਾ। ਲੋਕਾਂ ਨੂੰ ਉਸ ਰੱਬ ਨਾਲ ਇੱਕ ਹੋਣ ਦਾ ਰਾਹ ਸਿਖਾ, ਜੋ ਹਰ ਥਾਂ ਹੈ।'",
"ਜੋਗੀਆਂ ਨੇ ਚੁੱਪ-ਚਾਪ ਸੁਣਿਆ, ਫਿਰ ਉੱਠ ਕੇ ਸੋਚਾਂ ਵਿੱਚ ਡੁੱਬੇ ਹੋਏ ਚਲੇ ਗਏ।"],
l:"ਪਿਆਰ ਅਤੇ ਦਇਆ ਰੱਬ ਤੱਕ ਪਹੁੰਚਣ ਦਾ ਰਾਹ ਹਨ, ਅਤੇ ਅਸੀਂ ਲੋਕਾਂ ਵਿੱਚ ਰਹਿੰਦਿਆਂ ਅਤੇ ਉਨ੍ਹਾਂ ਦੀ ਮਦਦ ਕਰਦਿਆਂ ਇਸ ਰਾਹ ਉੱਤੇ ਚੱਲ ਸਕਦੇ ਹਾਂ।"};

PA["diwali-lights"]={t:[
"ਦੀਵਾਲੀ ਭਾਰਤ ਦਾ ਇੱਕ ਪੁਰਾਣਾ ਤਿਉਹਾਰ ਹੈ, ਰੌਸ਼ਨੀਆਂ ਦਾ ਤਿਉਹਾਰ। ਸਿੱਖਾਂ ਲਈ ਇਸ ਦਾ ਇੱਕ ਖ਼ਾਸ ਅਰਥ ਵੀ ਹੈ, ਛੇਵੇਂ ਗੁਰੂ, ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਦੇ ਸਮੇਂ ਵਾਪਰੀ ਇੱਕ ਘਟਨਾ ਕਰਕੇ।",
"ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਨੇ ਸਿੱਖਾਂ ਨੂੰ ਭਗਤੀ ਦੇ ਨਾਲ-ਨਾਲ ਤਕੜੇ ਹੋਣਾ ਵੀ ਸਿਖਾਇਆ। ਉਨ੍ਹਾਂ ਨੇ ਸਿੱਖਾਂ ਨੂੰ ਆਤਮ-ਰੱਖਿਆ ਦੀ ਸਿਖਲਾਈ ਦਿੱਤੀ, 1606 ਵਿੱਚ ਅਕਾਲ ਤਖ਼ਤ ਬਣਾਇਆ, ਜਿੱਥੇ ਬੈਠ ਕੇ ਉਹ ਲੋਕਾਂ ਦੀਆਂ ਮੁਸ਼ਕਲਾਂ ਸੁਣਦੇ ਅਤੇ ਇਨਸਾਫ਼ ਨਾਲ ਨਿਬੇੜਦੇ, ਅਤੇ ਬਾਅਦ ਵਿੱਚ ਅੰਮ੍ਰਿਤਸਰ ਦੀ ਰੱਖਿਆ ਲਈ ਲੋਹਗੜ੍ਹ ਕਿਲ੍ਹਾ ਬਣਾਇਆ।",
"ਲਾਹੌਰ ਦਾ ਨਵਾਂ ਸੂਬੇਦਾਰ, ਮੁਰਤਜ਼ਾ ਖ਼ਾਨ, ਫ਼ਿਕਰਮੰਦ ਹੋ ਗਿਆ ਅਤੇ ਉਸ ਨੇ ਮੁਗ਼ਲ ਬਾਦਸ਼ਾਹ ਜਹਾਂਗੀਰ ਨੂੰ ਖ਼ਬਰਾਂ ਭੇਜੀਆਂ। ਜਹਾਂਗੀਰ ਨੇ ਹੁਕਮ ਦਿੱਤਾ ਕਿ ਗੁਰੂ ਜੀ ਨੂੰ ਪੰਜਾਬ ਤੋਂ ਦੂਰ ਗਵਾਲੀਅਰ ਦੇ ਕਿਲ੍ਹੇ ਵਿੱਚ ਰੱਖਿਆ ਜਾਵੇ।",
"ਸਿੱਖਾਂ ਨੂੰ ਗੁਰੂ ਜੀ ਦੀ ਬਹੁਤ ਯਾਦ ਆਉਂਦੀ। ਕਈ ਸਿੱਖ ਲਗਭਗ 450 ਮੀਲ ਪੈਦਲ ਤੁਰ ਕੇ ਗਵਾਲੀਅਰ ਤੱਕ ਗਏ। ਉਹ ਅੰਦਰ ਨਹੀਂ ਜਾ ਸਕਦੇ ਸਨ, ਇਸ ਲਈ ਕਿਲ੍ਹੇ ਦੀਆਂ ਕੰਧਾਂ ਨੂੰ ਮੱਥਾ ਟੇਕਦੇ, ਅਤੇ ਫਿਰ ਪੈਦਲ ਹੀ ਘਰ ਮੁੜ ਆਉਂਦੇ।",
"ਲਾਹੌਰ ਦੇ ਸੂਫ਼ੀ ਫ਼ਕੀਰ ਅਤੇ ਗੁਰੂ ਸਾਹਿਬਾਨ ਦੇ ਮਿੱਤਰ, ਸਾਈਂ ਮੀਆਂ ਮੀਰ ਨੇ ਇਹ ਡੂੰਘਾ ਪਿਆਰ ਵੇਖਿਆ। ਉਹ ਆਗਰੇ ਗਏ ਅਤੇ ਜਹਾਂਗੀਰ ਨਾਲ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਅਤੇ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਬਾਰੇ ਗੱਲ ਕੀਤੀ। ਉਨ੍ਹਾਂ ਦੀ ਗੱਲ ਸੁਣ ਕੇ ਜਹਾਂਗੀਰ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਰਿਹਾਅ ਕਰਨ ਦਾ ਹੁਕਮ ਦੇ ਦਿੱਤਾ।",
"ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਦੀਵਾਲੀ ਵਾਲੇ ਦਿਨ ਅੰਮ੍ਰਿਤਸਰ ਪਹੁੰਚੇ। ਖ਼ੁਸ਼ੀ ਵਿੱਚ ਸਿੱਖਾਂ ਨੇ ਸਾਰੇ ਸ਼ਹਿਰ ਵਿੱਚ ਦੀਵੇ ਬਾਲੇ ਅਤੇ ਆਤਿਸ਼ਬਾਜ਼ੀ ਨਾਲ ਉਨ੍ਹਾਂ ਦਾ ਸੁਆਗਤ ਕੀਤਾ। ਉਦੋਂ ਤੋਂ ਸਿੱਖ ਇਸ ਦਿਨ ਨੂੰ ਬੰਦੀ ਛੋੜ ਦਿਵਸ, ਭਾਵ ਆਜ਼ਾਦੀ ਦਾ ਦਿਨ, ਵਜੋਂ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਅਤੇ ਦੁਨੀਆ ਭਰ ਦੇ ਗੁਰਦੁਆਰਿਆਂ ਵਿੱਚ ਦੀਪਮਾਲਾ ਨਾਲ ਮਨਾਉਂਦੇ ਹਨ।"],
l:"ਪਿਆਰ ਅਤੇ ਸਬਰ ਵਿੱਚ ਬਹੁਤ ਤਾਕਤ ਹੈ। ਸਿੱਖਾਂ ਲਈ ਦੀਵਾਲੀ ਬੰਦੀ ਛੋੜ ਦਿਵਸ ਹੈ, ਆਜ਼ਾਦੀ ਅਤੇ ਖ਼ੁਸ਼ੀ ਦਾ ਦਿਨ।"};

PA["two-swords"]={t:[
"ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਦਾ ਜਨਮ 1595 ਵਿੱਚ ਅੰਮ੍ਰਿਤਸਰ ਦੇ ਨੇੜੇ ਪਿੰਡ ਵਡਾਲੀ ਵਿੱਚ ਹੋਇਆ। ਉਨ੍ਹਾਂ ਦੇ ਪਿਤਾ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਅਤੇ ਮਾਤਾ, ਮਾਤਾ ਗੰਗਾ ਜੀ ਸਨ।",
