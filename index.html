"ਉਨ੍ਹਾਂ ਦੇ ਜਨਮ ਤੋਂ ਪਹਿਲਾਂ ਮਾਤਾ ਗੰਗਾ ਜੀ ਆਪਣੇ ਹੱਥੀਂ ਬਣਾਇਆ ਸਾਦਾ ਭੋਜਨ, ਮਿੱਸੀ ਰੋਟੀ ਅਤੇ ਗੰਢੇ, ਲੈ ਕੇ ਪੈਦਲ ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਦੇ ਦਰਸ਼ਨਾਂ ਨੂੰ ਗਏ। ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਪ੍ਰਸੰਨ ਹੋਏ। ਮੁੱਠੀ ਵਿੱਚ ਗੰਢਾ ਭੰਨਦਿਆਂ ਉਨ੍ਹਾਂ ਨੇ ਅਸੀਸ ਦਿੱਤੀ: 'ਤੁਹਾਡੇ ਘਰ ਇੱਕ ਮਹਾਨ ਅਤੇ ਸੂਰਬੀਰ ਪੁੱਤਰ ਹੋਵੇਗਾ, ਜੋ ਜ਼ੁਲਮ ਵਿਰੁੱਧ ਡਟ ਕੇ ਖੜ੍ਹੇਗਾ।'",
"ਬਾਲ ਹਰਿਗੋਬਿੰਦ ਜੀ ਨੂੰ ਬਹੁਤ ਵਿਸ਼ਾਲ ਵਿੱਦਿਆ ਮਿਲੀ। ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਪੜ੍ਹਨਾ, ਦਵਾਈਆਂ, ਖੇਤੀ ਅਤੇ ਲੋਕਾਂ ਦੀ ਅਗਵਾਈ ਕਰਨੀ ਸਿਖਾਈ। ਭਾਈ ਪਰਾਗਾ ਜੀ ਨੇ ਸ਼ਸਤਰ ਚਲਾਉਣੇ, ਭਾਈ ਜੇਠਾ ਜੀ ਨੇ ਰੱਖਿਆ ਦੇ ਦਾਅ-ਪੇਚ, ਅਤੇ ਭਾਈ ਗੰਗਾ ਸਹਿਗਲ ਜੀ ਨੇ ਘੋੜਸਵਾਰੀ ਸਿਖਾਈ।",
"1606 ਵਿੱਚ ਬਾਦਸ਼ਾਹ ਜਹਾਂਗੀਰ ਨੇ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਨੂੰ ਲਾਹੌਰ ਸੱਦਿਆ। ਜਾਣ ਤੋਂ ਪਹਿਲਾਂ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਨੇ ਆਪਣੇ ਪੁੱਤਰ ਨੂੰ ਅਗਲੇ ਗੁਰੂ ਥਾਪਿਆ ਅਤੇ ਕਿਹਾ, 'ਸ਼ਸਤਰ ਸਜਾ ਕੇ ਗੁਰਗੱਦੀ ਉੱਤੇ ਬੈਠਣਾ, ਫ਼ੌਜ ਤਿਆਰ ਕਰਨੀ, ਅਤੇ ਜ਼ੁਲਮ ਵਿਰੁੱਧ ਡਟ ਕੇ ਖੜ੍ਹਨਾ।' ਲਾਹੌਰ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਪਹਿਲੇ ਸਿੱਖ ਸ਼ਹੀਦ ਬਣੇ। ਉਨ੍ਹਾਂ ਦੇ ਪੁੱਤਰ ਸਿਰਫ਼ ਗਿਆਰਾਂ ਸਾਲ ਦੇ ਸਨ, ਪਰ ਉਹ ਡਰੇ ਨਹੀਂ।",
"ਗੁਰਗੱਦੀ ਦੀ ਰਸਮ ਵੇਲੇ ਉਨ੍ਹਾਂ ਨੇ ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਤੋਂ ਦੋ ਤਲਵਾਰਾਂ ਮੰਗੀਆਂ। ਇੱਕ ਦਾ ਨਾਂ ਮੀਰੀ ਸੀ, ਦੁਨੀਆ ਵਿੱਚ ਲੋਕਾਂ ਦੀ ਅਗਵਾਈ ਲਈ। ਦੂਜੀ ਦਾ ਨਾਂ ਪੀਰੀ ਸੀ, ਉਨ੍ਹਾਂ ਦੇ ਦਿਲਾਂ ਅਤੇ ਮਨਾਂ ਦੀ ਰਹਿਨੁਮਾਈ ਲਈ। ਉਨ੍ਹਾਂ ਨੇ ਉਸ ਸਮੇਂ ਦੇ ਰਾਜਿਆਂ ਵਾਂਗ ਕਲਗ਼ੀ ਵਾਲੀ ਦਸਤਾਰ ਵੀ ਸਜਾਈ।",
"ਉਨ੍ਹਾਂ ਨੇ ਸੰਗਤ ਨੂੰ ਕਿਹਾ, 'ਹੁਣ ਤੋਂ ਭੇਟਾ ਵਜੋਂ ਚੰਗੇ ਘੋੜੇ ਅਤੇ ਸ਼ਸਤਰ ਲਿਆਓ। ਸਾਨੂੰ ਲੋਕਾਂ ਨੂੰ ਜ਼ੁਲਮ ਤੋਂ ਬਚਾਉਣ ਲਈ ਤਿਆਰ ਰਹਿਣਾ ਚਾਹੀਦਾ ਹੈ।' ਦੂਰ-ਦੂਰ ਤੋਂ ਨੌਜਵਾਨ ਸਿੱਖ ਉਨ੍ਹਾਂ ਨਾਲ ਜੁੜਨ ਆਏ, ਸਿਰਫ਼ ਦੋ ਵੇਲੇ ਦੀ ਰੋਟੀ ਅਤੇ ਸਾਲ ਵਿੱਚ ਦੋ ਵਾਰ ਨਵੇਂ ਕੱਪੜੇ ਮੰਗਦੇ ਹੋਏ। ਸਵੇਰ ਦੇ ਦੀਵਾਨ ਤੋਂ ਬਾਅਦ ਉਹ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਦੇ ਸਾਹਮਣੇ ਅਭਿਆਸ ਕਰਦੇ, ਅਤੇ ਢਾਡੀ ਸੂਰਬੀਰਾਂ ਦੀਆਂ ਵਾਰਾਂ ਗਾ ਕੇ ਸਭ ਵਿੱਚ ਜੋਸ਼ ਭਰਦੇ।"],
l:"ਸਿੱਖ ਸੰਤ ਵੀ ਹੈ ਅਤੇ ਸਿਪਾਹੀ ਵੀ: ਅੰਦਰੋਂ ਭਗਤ, ਅਤੇ ਦੂਜਿਆਂ ਦੀ ਰੱਖਿਆ ਲਈ ਸੂਰਮਾ।"};

PA["cloak-of-52"]={t:[
"ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਨੇ ਇੱਕ ਸਿੱਧਾ ਅਸੂਲ ਸਿਖਾਇਆ: ਨਾ ਕਿਸੇ ਤੋਂ ਡਰੋ, ਨਾ ਕਿਸੇ ਨੂੰ ਡਰਾਓ। ਸਿੱਖ ਭੇਟਾ ਵਜੋਂ ਵਧੀਆ ਘੋੜੇ ਅਤੇ ਸ਼ਸਤਰ ਲਿਆਉਂਦੇ, ਅਤੇ ਬਹਾਦਰ ਨੌਜਵਾਨ ਉਨ੍ਹਾਂ ਦੀ ਫ਼ੌਜ ਵਿੱਚ ਭਰਤੀ ਹੁੰਦੇ। ਮੁਗ਼ਲ ਫ਼ੌਜ ਵਿੱਚੋਂ ਕੱਢੇ ਗਏ ਪਠਾਣ ਸਿਪਾਹੀ ਵੀ, ਜਿਵੇਂ ਸੂਬੇਦਾਰ ਯਾਰ ਖ਼ਾਨ, ਸੇਵਾ ਲਈ ਆਏ। ਕੁਝ ਲੋਕ ਜੋ ਡਾਕੂ ਬਣ ਗਏ ਸਨ, ਉਹ ਵੀ ਪੁਰਾਣੇ ਰਾਹ ਛੱਡ ਕੇ ਆ ਜੁੜੇ। ਗੁਰੂ ਘਰ ਨਿਥਾਵਿਆਂ ਦਾ ਥਾਂ ਬਣ ਗਿਆ।",
"ਗੁਰੂ ਜੀ ਨੇ ਨਵੇਂ ਸਿੱਖਾਂ ਨੂੰ ਸਿਖਲਾਈ ਦੇਣ ਲਈ ਬਵੰਜਾ ਨਿਪੁੰਨ ਸਿਪਾਹੀ ਚੁਣੇ। 1606 ਵਿੱਚ ਉਨ੍ਹਾਂ ਨੇ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਦੇ ਸਾਹਮਣੇ ਅਕਾਲ ਤਖ਼ਤ ਬਣਾਇਆ। ਹਰ ਸ਼ਾਮ ਉਹ ਉੱਥੇ ਪਾਤਸ਼ਾਹ ਵਾਂਗ ਬੈਠ ਕੇ ਲੋਕਾਂ ਦੇ ਝਗੜੇ ਇਨਸਾਫ਼ ਨਾਲ ਨਿਬੇੜਦੇ, ਤਾਂ ਜੋ ਉਨ੍ਹਾਂ ਨੂੰ ਬੇਇਨਸਾਫ਼ ਅਫ਼ਸਰਾਂ ਉੱਤੇ ਨਿਰਭਰ ਨਾ ਰਹਿਣਾ ਪਵੇ। ਉਨ੍ਹਾਂ ਨੇ ਅੰਮ੍ਰਿਤਸਰ ਦੀ ਰੱਖਿਆ ਲਈ ਲੋਹਗੜ੍ਹ ਕਿਲ੍ਹਾ ਵੀ ਬਣਾਇਆ।",
"ਗੁਰੂ ਜੀ ਦੀ ਵਧਦੀ ਤਾਕਤ ਵੇਖ ਕੇ ਕੁਝ ਲੋਕ ਈਰਖਾ ਕਰਨ ਅਤੇ ਡਰਨ ਲੱਗੇ। ਲਾਹੌਰ ਦੇ ਸੂਬੇਦਾਰ ਨੇ ਬਾਦਸ਼ਾਹ ਜਹਾਂਗੀਰ ਕੋਲ ਸ਼ਿਕਾਇਤ ਕੀਤੀ, ਜਿਸ ਨੇ ਹੁਕਮ ਦਿੱਤਾ ਕਿ ਗੁਰੂ ਜੀ ਨੂੰ ਗਵਾਲੀਅਰ ਦੇ ਕਿਲ੍ਹੇ ਵਿੱਚ ਰੱਖਿਆ ਜਾਵੇ। ਉੱਥੇ ਪਹਿਲਾਂ ਹੀ ਬਵੰਜਾ ਰਾਜੇ ਕੈਦ ਸਨ।",
"ਕਿਲ੍ਹੇ ਦੇ ਅੰਦਰ ਗੁਰੂ ਜੀ ਹਰ ਸਵੇਰ ਅਤੇ ਸ਼ਾਮ ਦੀਵਾਨ ਲਾਉਂਦੇ। ਰਾਜਿਆਂ ਨੂੰ, ਅਤੇ ਪਹਿਰੇਦਾਰਾਂ ਨੂੰ ਵੀ, ਉਨ੍ਹਾਂ ਦੀ ਸੰਗਤ ਵਿੱਚ ਸ਼ਾਂਤੀ ਮਿਲਦੀ। ਇਸੇ ਦੌਰਾਨ ਸਾਈਂ ਮੀਆਂ ਮੀਰ ਵਰਗੇ ਫ਼ਕੀਰਾਂ ਨੇ ਇਸ ਬੇਇਨਸਾਫ਼ੀ ਵਿਰੁੱਧ ਆਵਾਜ਼ ਚੁੱਕੀ, ਅਤੇ ਅਖ਼ੀਰ ਜਹਾਂਗੀਰ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਰਿਹਾਅ ਕਰਨ ਦਾ ਹੁਕਮ ਦਿੱਤਾ।",
"ਪਰ ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਜਦੋਂ ਤੱਕ ਇਹ ਰਾਜੇ ਵੀ ਰਿਹਾਅ ਨਹੀਂ ਹੁੰਦੇ, ਮੈਂ ਨਹੀਂ ਜਾਵਾਂਗਾ।' ਜਹਾਂਗੀਰ ਨੇ ਇੱਕ ਚਾਲ ਸੋਚੀ। 'ਜੋ ਵੀ ਰਾਜਾ ਗੁਰੂ ਜੀ ਦੇ ਕੱਪੜੇ ਫੜ ਸਕੇ, ਉਹ ਉਨ੍ਹਾਂ ਨਾਲ ਜਾ ਸਕਦਾ ਹੈ,' ਉਸ ਨੇ ਕਿਹਾ, ਇਹ ਸੋਚ ਕੇ ਕਿ ਮਸਾਂ ਕੁਝ ਹੀ ਫੜ ਸਕਣਗੇ।",
"ਤਾਂ ਗੁਰੂ ਜੀ ਨੇ ਬਵੰਜਾ ਕਲੀਆਂ ਵਾਲਾ ਇੱਕ ਖ਼ਾਸ ਚੋਲਾ ਬਣਵਾਇਆ। ਹਰ ਰਾਜੇ ਨੇ ਇੱਕ-ਇੱਕ ਕਲੀ ਫੜ ਲਈ, ਅਤੇ ਸਾਰੇ ਬਵੰਜਾ ਰਾਜੇ ਗੁਰੂ ਜੀ ਦੇ ਪਿੱਛੇ-ਪਿੱਛੇ ਇਕੱਠੇ ਕਿਲ੍ਹੇ ਤੋਂ ਬਾਹਰ ਆ ਗਏ! ਉਦੋਂ ਤੋਂ ਉਨ੍ਹਾਂ ਨੂੰ ਪਿਆਰ ਨਾਲ ਦਾਤਾ ਬੰਦੀ ਛੋੜ, ਭਾਵ ਕੈਦੀਆਂ ਨੂੰ ਛੁਡਾਉਣ ਵਾਲੇ ਦਾਤਾ, ਕਿਹਾ ਜਾਂਦਾ ਹੈ।"],
l:"ਸੱਚੀ ਆਜ਼ਾਦੀ ਉਹ ਹੈ ਜੋ ਅਸੀਂ ਦੂਜਿਆਂ ਨਾਲ ਵੰਡਦੇ ਹਾਂ। ਦਇਆ ਅਤੇ ਸੂਝ ਨਾਲ ਸੋਚਣ ਵਾਲਾ ਉੱਥੇ ਵੀ ਰਾਹ ਲੱਭ ਲੈਂਦਾ ਹੈ ਜਿੱਥੇ ਕੋਈ ਰਾਹ ਨਾ ਦਿਸੇ।"};

PA["true-king"]={t:[
"ਬਾਦਸ਼ਾਹ ਜਹਾਂਗੀਰ ਨੇ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਨੂੰ ਗਵਾਲੀਅਰ ਦੇ ਕਿਲ੍ਹੇ ਵਿੱਚ ਨਜ਼ਰਬੰਦ ਕਰਨ ਦਾ ਹੁਕਮ ਦਿੱਤਾ ਸੀ। ਫਿਰ ਸੂਫ਼ੀ ਫ਼ਕੀਰ ਸਾਈਂ ਮੀਆਂ ਮੀਰ ਨੇ ਉਸ ਨਾਲ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਅਤੇ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਬਾਰੇ ਗੱਲ ਕੀਤੀ, ਅਤੇ ਜਹਾਂਗੀਰ ਸਮਝ ਗਿਆ ਕਿ ਉਸ ਤੋਂ ਭਿਆਨਕ ਭੁੱਲ ਹੋਈ ਹੈ। ਉਸ ਨੇ ਆਪਣੇ ਵਜ਼ੀਰ, ਵਜ਼ੀਰ ਖ਼ਾਨ, ਨੂੰ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਨੂੰ ਬੜੇ ਸਤਿਕਾਰ ਨਾਲ ਗਵਾਲੀਅਰ ਤੋਂ ਆਗਰੇ ਲਿਆਉਣ ਲਈ ਭੇਜਿਆ।",
"ਆਗਰੇ ਵਿੱਚ ਜਹਾਂਗੀਰ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਆਪਣੇ ਨਾਲ ਚੰਦਨ ਦੇ ਆਸਣ ਉੱਤੇ ਬਿਠਾਇਆ। ਉਸ ਨੇ ਵੇਖਿਆ ਕਿ ਦੋ ਤਲਵਾਰਾਂ ਪਹਿਨੇ ਗੁਰੂ ਜੀ ਸ਼ਾਂਤ ਅਤੇ ਤੇਜਸਵੀ ਸਨ, ਅਤੇ ਕਿਸੇ ਤੋਂ ਨਹੀਂ ਡਰਦੇ ਸਨ।",
"ਜਹਾਂਗੀਰ ਨੇ ਚੰਦੂ ਨੂੰ, ਜਿਸ ਨੇ ਉਸ ਨੂੰ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਵਿਰੁੱਧ ਭੜਕਾਇਆ ਸੀ, ਜ਼ੰਜੀਰਾਂ ਵਿੱਚ ਬੰਨ੍ਹ ਕੇ ਅੱਗੇ ਕੀਤਾ। 'ਦੋਸ਼ੀ ਇਹ ਹੈ,' ਜਹਾਂਗੀਰ ਨੇ ਕਿਹਾ। ਗੁਰੂ ਜੀ ਨੇ ਚੰਦੂ ਦੀਆਂ ਜ਼ੰਜੀਰਾਂ ਖੁਲ੍ਹਵਾਈਆਂ, ਉਸ ਨੂੰ ਸਿੱਖਾਂ ਦੇ ਹਵਾਲੇ ਕੀਤਾ, ਅਤੇ ਕਿਹਾ, 'ਅਸਲ ਦੋਸ਼ੀ ਕੌਣ ਸੀ, ਇਸ ਦਾ ਫ਼ੈਸਲਾ ਰੱਬ ਦੀ ਦਰਗਾਹ ਵਿੱਚ ਹੋਵੇਗਾ।'",
"ਜਹਾਂਗੀਰ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਕੁਝ ਸਮਾਂ ਆਪਣੇ ਕੋਲ ਰਹਿਣ ਲਈ ਕਿਹਾ। ਇੱਕ ਦਿਨ ਉਸ ਨੇ ਪੁੱਛਿਆ, 'ਲੋਕ ਤੁਹਾਨੂੰ ਸੱਚਾ ਪਾਤਸ਼ਾਹ ਕਿਉਂ ਕਹਿੰਦੇ ਹਨ, ਜਦਕਿ ਮੈਨੂੰ ਸਿਰਫ਼ ਪਾਤਸ਼ਾਹ?' ਗੁਰੂ ਜੀ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, 'ਮੈਂ ਕਿਸੇ ਨੂੰ ਨਹੀਂ ਕਹਿੰਦਾ ਕਿ ਮੈਨੂੰ ਕੀ ਕਹਿਣ। ਲੋਕ ਸਾਨੂੰ ਉਹੀ ਕਹਿੰਦੇ ਹਨ ਜੋ ਉਹ ਸਾਡੇ ਵਿੱਚ ਵੇਖਦੇ ਹਨ।' ਜਹਾਂਗੀਰ ਦੀ ਤਸੱਲੀ ਨਾ ਹੋਈ।",
"ਅਗਲੇ ਦਿਨ ਉਹ ਇਕੱਠੇ ਸ਼ਿਕਾਰ ਖੇਡਣ ਗਏ। ਦੁਪਹਿਰ ਨੂੰ ਗੁਰੂ ਜੀ ਇੱਕ ਰੁੱਖ ਹੇਠ ਅਤੇ ਜਹਾਂਗੀਰ ਦੂਜੇ ਰੁੱਖ ਹੇਠ ਆਰਾਮ ਕਰਨ ਲੱਗੇ। ਇੱਕ ਗਰੀਬ ਘਾਹੀ ਨੇ ਸੁਣਿਆ ਸੀ ਕਿ ਗੁਰੂ ਜੀ ਜੰਗਲ ਵਿੱਚ ਹਨ। ਜਹਾਂਗੀਰ ਨੂੰ ਗੁਰੂ ਸਮਝ ਕੇ ਉਸ ਨੇ ਘਾਹ ਦੀ ਪੰਡ ਅਤੇ ਦੋ ਪੈਸੇ ਉਸ ਅੱਗੇ ਰੱਖੇ ਅਤੇ ਅਰਦਾਸ ਕੀਤੀ, 'ਹੇ ਸੱਚੇ ਪਾਤਸ਼ਾਹ, ਅੰਤ ਵੇਲੇ ਮੇਰੀ ਲਾਜ ਰੱਖਣਾ।'",
"ਜਹਾਂਗੀਰ ਨੇ ਕਿਹਾ, 'ਮੈਂ ਇਸ ਦੁਨੀਆ ਦਾ ਪਾਤਸ਼ਾਹ ਹਾਂ। ਮੈਂ ਤੈਨੂੰ ਧਨ-ਦੌਲਤ ਦੇ ਸਕਦਾ ਹਾਂ, ਪਰ ਅੰਤ ਵੇਲੇ ਤੇਰੀ ਮਦਦ ਨਹੀਂ ਕਰ ਸਕਦਾ। ਤੇਰਾ ਸੱਚਾ ਪਾਤਸ਼ਾਹ ਉਸ ਰੁੱਖ ਹੇਠ ਬੈਠਾ ਹੈ।' ਘਾਹੀ ਨੇ ਆਪਣੀ ਪੰਡ ਅਤੇ ਪੈਸੇ ਚੁੱਕੇ, ਗੁਰੂ ਜੀ ਕੋਲ ਗਿਆ ਅਤੇ ਮੱਥਾ ਟੇਕਿਆ। ਉਸ ਦਿਨ ਤੋਂ ਬਾਅਦ ਜਹਾਂਗੀਰ ਨੇ ਫਿਰ ਕਦੇ ਨਾ ਪੁੱਛਿਆ ਕਿ ਸਿੱਖ ਗੁਰੂ ਜੀ ਨੂੰ ਸੱਚਾ ਪਾਤਸ਼ਾਹ ਕਿਉਂ ਕਹਿੰਦੇ ਹਨ।"],
l:"ਦੁਨਿਆਵੀ ਰਾਜੇ ਕੁਝ ਸਮਾਂ ਰਾਜ ਕਰਦੇ ਹਨ, ਪਰ ਸੱਚਾ ਪਾਤਸ਼ਾਹ ਲੋਕਾਂ ਦੇ ਦਿਲਾਂ ਉੱਤੇ ਰਾਜ ਕਰਦਾ ਹੈ ਅਤੇ ਉਨ੍ਹਾਂ ਦੀਆਂ ਆਤਮਾਵਾਂ ਦੀ ਸੰਭਾਲ ਕਰਦਾ ਹੈ।"};

PA["nanakmatta-tree"]={t:[
"ਛੇਵੇਂ ਗੁਰੂ, ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਦੇ ਸਮੇਂ, ਜਦੋਂ ਉਹ ਗਵਾਲੀਅਰ ਦੇ ਕਿਲ੍ਹੇ ਤੋਂ ਵਾਪਸ ਆਏ, ਗੁਰੂ ਨਾਨਕ ਦਾ ਉਪਦੇਸ਼ ਖੁੱਲ੍ਹ ਕੇ ਦੇਸ਼ ਭਰ ਵਿੱਚ ਫੈਲਿਆ। ਪੰਜਾਬ ਤੋਂ ਦੂਰ ਪੂਰਬ ਵੱਲ ਨਾਨਕਮਤੇ ਵਿੱਚ, ਬਾਬਾ ਅਲਮਸਤ ਨਾਂ ਦੇ ਇੱਕ ਸਿੱਖ ਉਸ ਥਾਂ ਦੀ ਸੰਭਾਲ ਕਰਦੇ ਸਨ ਜਿੱਥੇ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਨੇ ਇੱਕ ਵਾਰ ਪਿੱਪਲ ਹੇਠ ਬੈਠ ਕੇ ਜੋਗੀਆਂ ਨਾਲ ਗੋਸ਼ਟ ਕੀਤੀ ਸੀ।",
"ਬਾਬਾ ਅਲਮਸਤ ਉਸ ਥਾਂ ਦੀ ਸੇਵਾ ਕਰਦੇ ਅਤੇ ਆਉਣ ਵਾਲਿਆਂ ਨਾਲ ਗੁਰੂ ਨਾਨਕ ਦਾ ਸੁਨੇਹਾ ਸਾਂਝਾ ਕਰਦੇ। ਪਰ ਜੋਗੀ ਗੋਰਖਨਾਥ ਦੇ ਕੁਝ ਚੇਲਿਆਂ ਨੂੰ ਇਹ ਚੰਗਾ ਨਾ ਲੱਗਾ। ਉਨ੍ਹਾਂ ਨੇ ਥਾਂ ਉੱਤੇ ਕਬਜ਼ਾ ਕਰ ਲਿਆ, ਬਾਬਾ ਅਲਮਸਤ ਨੂੰ ਭਜਾ ਦਿੱਤਾ, ਅਤੇ ਪੁਰਾਣੇ ਪਿੱਪਲ ਨੂੰ ਅੱਗ ਲਾ ਦਿੱਤੀ।",
"ਜਦੋਂ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਨੇ ਇਹ ਖ਼ਬਰ ਸੁਣੀ, ਉਹ ਘੋੜਸਵਾਰਾਂ ਦੇ ਇੱਕ ਜਥੇ ਨਾਲ ਨਾਨਕਮਤੇ ਵੱਲ ਤੁਰ ਪਏ। ਜਦੋਂ ਜੋਗੀਆਂ ਨੇ ਗੁਰੂ ਜੀ ਦੇ ਸਿੱਖਾਂ ਨੂੰ ਆਉਂਦਿਆਂ ਵੇਖਿਆ, ਉਹ ਭੱਜ ਗਏ।",
"ਜਦੋਂ ਗੁਰੂ ਜੀ ਪਹੁੰਚੇ, ਰੁੱਖ ਅਜੇ ਵੀ ਧੁਖ ਰਿਹਾ ਸੀ। ਉਹ ਉਸ ਦੇ ਕੋਲ ਬੈਠ ਗਏ ਅਤੇ ਗੁਰਬਾਣੀ ਗਾਈ। ਫਿਰ ਉਨ੍ਹਾਂ ਨੇ ਪਾਣੀ ਵਿੱਚ ਕੇਸਰ ਅਤੇ ਚੰਦਨ ਘੋਲ ਕੇ ਸੜੇ ਹੋਏ ਰੁੱਖ ਉੱਤੇ ਛਿੜਕਿਆ।",
"ਕਹਿੰਦੇ ਹਨ ਕਿ ਸਭ ਦੀਆਂ ਅੱਖਾਂ ਸਾਹਮਣੇ ਰੁੱਖ ਫਿਰ ਹਰਾ-ਭਰਾ ਹੋ ਗਿਆ। ਨਵੇਂ ਪੱਤੇ ਫੁੱਟੇ, ਜਿਨ੍ਹਾਂ ਉੱਤੇ ਕੇਸਰ ਵਰਗੇ ਪੀਲੇ ਅਤੇ ਚੰਦਨ ਵਰਗੇ ਚਿੱਟੇ ਨਿਸ਼ਾਨ ਸਨ। ਲੋਕ ਕਹਿੰਦੇ ਹਨ ਕਿ ਇਹ ਨਿਸ਼ਾਨ ਅੱਜ ਵੀ ਇਸ ਦੇ ਪੱਤਿਆਂ ਉੱਤੇ ਵੇਖੇ ਜਾ ਸਕਦੇ ਹਨ।",
"ਇਹ ਸੁਣ ਕੇ ਜੋਗੀ ਮੁੜ ਆਏ। 'ਅਸੀਂ ਦੁਨੀਆ ਤਿਆਗ ਕੇ ਇੱਥੇ ਰਹਿਣ ਆਏ ਹਾਂ,' ਉਨ੍ਹਾਂ ਨੇ ਕਿਹਾ। 'ਤੁਹਾਡੇ ਵਰਗੇ ਗ੍ਰਿਹਸਤੀ ਸਾਨੂੰ ਤੰਗ ਕਰਨ ਕਿਉਂ ਆਉਂਦੇ ਹਨ?' ਗੁਰੂ ਜੀ ਨੇ ਨਰਮੀ ਨਾਲ ਪੁੱਛਿਆ, 'ਜੇ ਤੁਸੀਂ ਸੱਚਮੁੱਚ ਦੁਨੀਆ ਤਿਆਗ ਦਿੱਤੀ ਹੈ, ਤਾਂ ਇਸ ਥਾਂ ਲਈ ਝਗੜਾ ਕਿਉਂ ਕਰ ਰਹੇ ਹੋ?' ਜੋਗੀਆਂ ਕੋਲ ਕੋਈ ਜਵਾਬ ਨਹੀਂ ਸੀ, ਅਤੇ ਉਹ ਚਲੇ ਗਏ।"],
l:"ਪਵਿੱਤਰ ਥਾਵਾਂ ਸਭ ਦੀਆਂ ਸਾਂਝੀਆਂ ਹਨ। ਸ਼ਾਂਤ ਸੱਚ ਗੁੱਸੇ ਨਾਲੋਂ ਤਾਕਤਵਰ ਹੈ।"};

PA["kiratpur-medicine"]={t:[
"ਗੁਰੂ ਹਰਿ ਰਾਇ ਸਾਹਿਬ ਜੀ ਦਾ ਜਨਮ 1630 ਵਿੱਚ ਕੀਰਤਪੁਰ ਵਿਖੇ ਹੋਇਆ। ਉਨ੍ਹਾਂ ਦੇ ਪਿਤਾ ਬਾਬਾ ਗੁਰਦਿੱਤਾ ਜੀ ਸਨ, ਜੋ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਦੇ ਵੱਡੇ ਪੁੱਤਰ ਸਨ। ਦਾਦਾ ਜੀ ਉਨ੍ਹਾਂ ਨੂੰ ਆਪਣੇ ਕੋਲ ਰੱਖਦੇ ਅਤੇ ਧਾਰਮਿਕ ਗ੍ਰੰਥਾਂ ਦੇ ਨਾਲ ਘੋੜਸਵਾਰੀ ਦੀ ਵਿੱਦਿਆ ਵੀ ਦਿੰਦੇ। ਜਦੋਂ ਵੀ ਬਾਲ ਹਰਿ ਰਾਇ ਜੀ ਨੂੰ ਸੇਵਾ ਦਾ ਮੌਕਾ ਮਿਲਦਾ, ਉਹ ਬੜੇ ਚਾਅ ਨਾਲ ਕਰਦੇ। 1644 ਵਿੱਚ ਜੋਤੀ ਜੋਤਿ ਸਮਾਉਣ ਤੋਂ ਪਹਿਲਾਂ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਸੱਤਵੇਂ ਗੁਰੂ ਥਾਪਿਆ।",
"ਗੁਰੂ ਹਰਿ ਰਾਇ ਸਾਹਿਬ ਜੀ ਨੇ ਸੰਗਤ ਦੀ ਰੱਖਿਆ ਲਈ 2,200 ਘੋੜਸਵਾਰ ਤਿਆਰ ਰੱਖੇ, ਅਤੇ ਕੀਰਤਪੁਰ ਦੇ ਨੇੜੇ ਪਤਾਲਗੜ੍ਹ ਕਿਲ੍ਹਾ ਬਣਾਇਆ। ਤੀਜੇ ਪਹਿਰ ਉਹ ਸਿੱਖਾਂ ਨਾਲ ਜੰਗਲ ਵਿੱਚ ਘੋੜਸਵਾਰੀ ਕਰਨ ਜਾਂਦੇ, ਤਾਂ ਜੋ ਪਹਾੜੀ ਲੋਕ ਉਨ੍ਹਾਂ ਨੂੰ ਵੇਖ ਕੇ ਆਪ ਵੀ ਹੌਸਲਾ ਮਹਿਸੂਸ ਕਰਨ।",
"ਉਨ੍ਹਾਂ ਨੇ ਕੀਰਤਪੁਰ ਵਿੱਚ ਇੱਕ ਵੱਡਾ ਦਵਾਖ਼ਾਨਾ ਵੀ ਖੋਲ੍ਹਿਆ। ਉਨ੍ਹਾਂ ਨੇ ਨਿਪੁੰਨ ਵੈਦ-ਹਕੀਮ ਰੱਖੇ ਅਤੇ ਦੇਸ਼ ਭਰ ਤੋਂ ਦਵਾਈਆਂ ਇਕੱਠੀਆਂ ਕੀਤੀਆਂ, ਅਤੇ ਹਰ ਲੋੜਵੰਦ ਦਾ ਮੁਫ਼ਤ ਇਲਾਜ ਹੁੰਦਾ। ਉਨ੍ਹਾਂ ਨੇ ਹੋਰ ਸਿੱਖ ਕੇਂਦਰਾਂ ਵਿੱਚ ਵੀ ਮੁਫ਼ਤ ਦਵਾਖ਼ਾਨੇ ਚਲਾਉਣ ਲਈ ਕਿਹਾ, ਅਤੇ ਛੇਤੀ ਹੀ ਕੀਰਤਪੁਰ ਦਾ ਦਵਾਖ਼ਾਨਾ ਸਾਰੇ ਹਿੰਦੁਸਤਾਨ ਵਿੱਚ ਮਸ਼ਹੂਰ ਹੋ ਗਿਆ।",
"ਬਾਦਸ਼ਾਹ ਸ਼ਾਹਜਹਾਂ ਆਪਣੇ ਵੱਡੇ ਪੁੱਤਰ ਦਾਰਾ ਸ਼ਿਕੋਹ ਨੂੰ ਬਹੁਤ ਪਿਆਰ ਕਰਦਾ ਸੀ। ਇੱਕ ਦਿਨ ਦਾਰਾ ਨੂੰ ਪੇਟ ਦੀ ਗੰਭੀਰ ਬਿਮਾਰੀ ਹੋ ਗਈ, ਅਤੇ ਸ਼ਾਹੀ ਹਕੀਮ ਉਸ ਨੂੰ ਠੀਕ ਨਾ ਕਰ ਸਕੇ। ਉਨ੍ਹਾਂ ਨੇ ਬਾਦਸ਼ਾਹ ਨੂੰ ਦੱਸਿਆ, 'ਸਹੀ ਦਵਾਈ ਕੀਰਤਪੁਰ ਦੇ ਦਵਾਖ਼ਾਨੇ ਵਿੱਚ ਮਿਲ ਸਕਦੀ ਹੈ।'",
"ਸ਼ਾਹਜਹਾਂ ਝਿਜਕਿਆ। 'ਮੈਂ ਸਿੱਖਾਂ ਤੋਂ ਮਦਦ ਕਿਵੇਂ ਮੰਗਾਂ, ਜਦਕਿ ਮੈਂ ਉਨ੍ਹਾਂ ਵਿਰੁੱਧ ਫ਼ੌਜਾਂ ਭੇਜੀਆਂ ਹਨ?' ਪਰ ਪੀਰ ਹਸਨ ਅਲੀ ਨੇ ਉਸ ਨੂੰ ਕਿਹਾ, 'ਗੁਰੂ ਨਾਨਕ ਦਾ ਘਰ ਕਿਸੇ ਦਾ ਵੈਰੀ ਨਹੀਂ। ਉਹ ਹਮੇਸ਼ਾ ਦੂਜਿਆਂ ਦਾ ਭਲਾ ਕਰਦੇ ਹਨ।' ਤਾਂ ਸ਼ਾਹਜਹਾਂ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਚਿੱਠੀ ਲਿਖੀ।",
"ਗੁਰੂ ਹਰਿ ਰਾਇ ਸਾਹਿਬ ਜੀ ਨੇ ਤੁਰੰਤ ਦਵਾਈ ਭੇਜ ਦਿੱਤੀ, ਅਤੇ ਦਾਰਾ ਸ਼ਿਕੋਹ ਠੀਕ ਹੋ ਗਿਆ। ਦਾਰਾ ਆਪ ਗੁਰੂ ਜੀ ਦਾ ਧੰਨਵਾਦ ਕਰਨ ਲਈ ਤੋਹਫ਼ੇ ਲੈ ਕੇ ਕੀਰਤਪੁਰ ਆਇਆ।"],
l:"ਦਇਆ ਅਤੇ ਇਲਾਜ ਹਰ ਕਿਸੇ ਲਈ ਹੈ, ਉਨ੍ਹਾਂ ਲਈ ਵੀ ਜਿਨ੍ਹਾਂ ਨੇ ਸਾਡੇ ਨਾਲ ਚੰਗਾ ਨਹੀਂ ਕੀਤਾ।"};

PA["mai-taabo"]={t:[
"ਇੱਕ ਦਿਨ ਸਿੱਖਾਂ ਨਾਲ ਘੋੜਸਵਾਰੀ ਕਰਦਿਆਂ, ਗੁਰੂ ਹਰਿ ਰਾਇ ਸਾਹਿਬ ਜੀ ਇੱਕ ਛੋਟੀ ਜਿਹੀ ਝੁੱਗੀ ਅੱਗੇ ਰੁਕੇ। ਇੱਕ ਬਜ਼ੁਰਗ ਮਾਈ, ਮਾਈ ਤਾਬੋ, ਬਾਹਰ ਆਈ।",
"'ਮਾਤਾ, ਮੈਨੂੰ ਬਹੁਤ ਭੁੱਖ ਲੱਗੀ ਹੈ,' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ। 'ਜੋ ਵੀ ਤੁਸੀਂ ਮੇਰੇ ਲਈ ਬਣਾਇਆ ਹੈ, ਉਹ ਦੇ ਦਿਓ।' ਮਾਈ ਤਾਬੋ ਹੈਰਾਨ ਰਹਿ ਗਈ। ਉਸ ਨੇ ਮਿੱਠੇ ਪੂੜੇ ਬਣਾਏ ਸਨ, ਇਸ ਆਸ ਨਾਲ ਕਿ ਇੱਕ ਦਿਨ ਗੁਰੂ ਜੀ ਇੱਥੋਂ ਲੰਘਣਗੇ। ਉਹ ਉਨ੍ਹਾਂ ਨੂੰ ਇੱਕ ਕੱਪੜੇ ਵਿੱਚ ਲਪੇਟ ਕੇ ਲੈ ਆਈ।",
"ਘੋੜੇ ਤੋਂ ਉੱਤਰੇ ਬਿਨਾਂ ਹੀ ਗੁਰੂ ਜੀ ਨੇ ਪੂੜੇ ਖੋਲ੍ਹੇ ਅਤੇ ਖ਼ੁਸ਼ੀ ਨਾਲ ਛਕੇ। ਕੱਪੜਾ ਮੋੜਦਿਆਂ ਉਨ੍ਹਾਂ ਨੇ ਮੁਸਕਰਾ ਕੇ ਕਿਹਾ, 'ਮਾਤਾ, ਪੂੜੇ ਬਹੁਤ ਸੁਆਦ ਸਨ!' ਮਾਈ ਤਾਬੋ ਦਾ ਦਿਲ ਖ਼ੁਸ਼ੀ ਨਾਲ ਭਰ ਗਿਆ।",
"ਅਗਲੇ ਦਿਨ ਇੱਕ ਸਿੱਖ ਨੇ ਸਵਾਰੀ ਲਈ ਕੁਝ ਭੋਜਨ ਨਾਲ ਬੰਨ੍ਹ ਲਿਆ, ਇਹ ਸੋਚ ਕੇ ਕਿ ਗੁਰੂ ਜੀ ਨੂੰ ਫਿਰ ਭੁੱਖ ਲੱਗ ਸਕਦੀ ਹੈ। ਜਦੋਂ ਉਸ ਨੇ ਭੇਟ ਕੀਤਾ, ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਭੋਜਨ ਲੰਗਰ ਵਿੱਚ ਇਕੱਠੇ ਬੈਠ ਕੇ ਛਕੀਦਾ ਹੈ। ਛਕਣ ਦੀ ਇੱਕ ਮਰਯਾਦਾ ਹੈ।'",
"ਸਿੱਖ ਨੇ ਸਤਿਕਾਰ ਨਾਲ ਪੁੱਛਿਆ, 'ਪਰ ਗੁਰੂ ਜੀ, ਕੱਲ੍ਹ ਤੁਸੀਂ ਘੋੜੇ ਉੱਤੇ ਬੈਠੇ-ਬੈਠੇ ਹੀ ਛਕ ਲਿਆ ਸੀ, ਹੱਥ ਵੀ ਨਹੀਂ ਧੋਤੇ ਸਨ।' ਗੁਰੂ ਜੀ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, 'ਉਹ ਉਸ ਬਜ਼ੁਰਗ ਮਾਤਾ ਦੇ ਪਿਆਰ ਕਰਕੇ ਸੀ। ਉਸ ਨੇ ਉਹ ਭੋਜਨ ਮੇਰੇ ਲਈ ਬਣਾਇਆ ਸੀ ਅਤੇ ਉਡੀਕ ਰਹੀ ਸੀ। ਉਸ ਦਾ ਪਿਆਰ ਮੈਨੂੰ ਉੱਥੇ ਖਿੱਚ ਲੈ ਗਿਆ।'"],
l:"ਗੁਰੂ ਪਿਆਰ ਨਾਲ ਖਿੱਚਿਆ ਆਉਂਦਾ ਹੈ। ਪਿਆਰ ਭਰੇ ਦਿਲ ਨਾਲ ਦਿੱਤੀ ਛੋਟੀ ਜਿਹੀ ਭੇਟਾ ਵੀ ਹਰ ਚੀਜ਼ ਤੋਂ ਵੱਧ ਮਹੱਤਵ ਰੱਖਦੀ ਹੈ।"};

PA["peace-above-kingdom"]={t:[
"1657 ਵਿੱਚ ਬਾਦਸ਼ਾਹ ਸ਼ਾਹਜਹਾਂ ਗੰਭੀਰ ਬਿਮਾਰ ਹੋ ਗਿਆ, ਅਤੇ ਚਾਹੁੰਦਾ ਸੀ ਕਿ ਉਸ ਤੋਂ ਬਾਅਦ ਵੱਡਾ ਪੁੱਤਰ ਦਾਰਾ ਸ਼ਿਕੋਹ ਰਾਜ ਕਰੇ। ਪਰ ਛੋਟਾ ਪੁੱਤਰ ਔਰੰਗਜ਼ੇਬ ਤਖ਼ਤ ਆਪ ਲੈਣਾ ਚਾਹੁੰਦਾ ਸੀ। ਭਰਾਵਾਂ ਦੀਆਂ ਫ਼ੌਜਾਂ ਆਗਰੇ ਦੇ ਨੇੜੇ ਟਕਰਾਈਆਂ, ਅਤੇ ਦਾਰਾ ਸ਼ਿਕੋਹ ਹਾਰ ਗਿਆ। ਔਰੰਗਜ਼ੇਬ ਨੇ ਆਪਣੇ ਪਿਤਾ ਨੂੰ ਆਗਰੇ ਦੇ ਕਿਲ੍ਹੇ ਵਿੱਚ ਕੈਦ ਕਰ ਦਿੱਤਾ ਅਤੇ ਆਪ ਬਾਦਸ਼ਾਹ ਬਣ ਬੈਠਾ।",
"ਦਾਰਾ ਸ਼ਿਕੋਹ ਆਪਣੇ ਭਰਾ ਤੋਂ ਬਿਲਕੁਲ ਵੱਖਰਾ ਸੀ। ਉਸ ਨੂੰ ਸੰਤਾਂ ਅਤੇ ਫ਼ਕੀਰਾਂ ਦੀ ਸੰਗਤ ਚੰਗੀ ਲੱਗਦੀ ਸੀ। ਉਹ ਸਾਈਂ ਮੀਆਂ ਮੀਰ ਦੇ ਸਿਖਾਏ ਸੂਫ਼ੀ ਪਿਆਰ ਦੇ ਰਾਹ ਉੱਤੇ ਚੱਲਦਾ ਸੀ, ਅਤੇ ਅਕਸਰ ਗੁਰੂ ਘਰ ਆਉਂਦਾ ਸੀ।",
"1658 ਵਿੱਚ ਲਾਹੌਰ ਵੱਲ ਜਾਂਦਿਆਂ ਦਾਰਾ ਸ਼ਿਕੋਹ ਗੁਰੂ ਹਰਿ ਰਾਇ ਸਾਹਿਬ ਜੀ ਨੂੰ ਮਿਲਣ ਗੋਇੰਦਵਾਲ ਰੁਕਿਆ। ਗੁਰੂ ਜੀ ਨੇ ਉਸ ਤੋਂ ਪੁੱਛਿਆ, 'ਜੇ ਤੂੰ ਚਾਹੇਂ, ਤਾਂ ਮੈਂ ਦਿੱਲੀ ਦਾ ਤਖ਼ਤ ਜਿੱਤਣ ਵਿੱਚ ਤੇਰੀ ਮਦਦ ਕਰ ਸਕਦਾ ਹਾਂ।'",
"ਦਾਰਾ ਸ਼ਿਕੋਹ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, 'ਹੇ ਸੱਚੇ ਪਾਤਸ਼ਾਹ, ਮੈਂ ਦਿੱਲੀ ਦੇ ਤਖ਼ਤ ਦਾ ਕੀ ਕਰਾਂਗਾ, ਜਿੱਥੇ ਦਿਨ-ਰਾਤ ਲੜਾਈ-ਝਗੜੇ ਹੁੰਦੇ ਹਨ? ਤੁਸੀਂ ਇੱਕ ਵਾਰ ਮੇਰਾ ਸਰੀਰ ਠੀਕ ਕੀਤਾ ਸੀ। ਹੁਣ ਮੇਰੀ ਆਤਮਾ ਨੂੰ ਠੀਕ ਕਰੋ ਅਤੇ ਮੈਨੂੰ ਸ਼ਾਂਤੀ ਬਖ਼ਸ਼ੋ।'",
"ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਸ਼ਾਂਤੀ ਰੱਬ ਦਾ ਭਾਣਾ ਮੰਨਣ ਨਾਲ ਮਿਲਦੀ ਹੈ। ਅਤੇ ਇਹ ਤਾਂ ਹੀ ਹੋ ਸਕਦਾ ਹੈ ਜਦੋਂ ਤੂੰ ਰੱਬ ਨੂੰ ਸੱਚਾ ਪਿਆਰ ਕਰੇਂ, ਇੰਨਾ ਪਿਆਰ ਕਿ ਉਸ ਲਈ ਸਭ ਕੁਝ ਵਾਰ ਦੇਵੇਂ।' ਇਨ੍ਹਾਂ ਬਚਨਾਂ ਵਿੱਚ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦੀ ਬਾਣੀ ਗੂੰਜਦੀ ਹੈ: 'ਜਉ ਤਉ ਪ੍ਰੇਮ ਖੇਲਣ ਕਾ ਚਾਉ ॥ ਸਿਰੁ ਧਰਿ ਤਲੀ ਗਲੀ ਮੇਰੀ ਆਉ ॥' (ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ, ਅੰਗ 1412)",
"ਦਾਰਾ ਸ਼ਿਕੋਹ ਨੇ ਕਿਹਾ, 'ਜਿਸ ਲਈ ਮੈਂ ਆਇਆ ਸੀ, ਉਹ ਮੈਨੂੰ ਮਿਲ ਗਿਆ ਹੈ,' ਅਤੇ ਸ਼ਾਂਤ ਮਨ ਨਾਲ ਆਪਣੇ ਰਾਹ ਤੁਰ ਪਿਆ। ਬਾਅਦ ਵਿੱਚ ਉਹ ਔਰੰਗਜ਼ੇਬ ਨਾਲ ਆਪਣਾ ਸੰਘਰਸ਼ ਹਾਰ ਗਿਆ, ਪਰ ਉਸ ਨੂੰ ਇੱਕ ਅਜਿਹੇ ਸ਼ਹਿਜ਼ਾਦੇ ਵਜੋਂ ਯਾਦ ਕੀਤਾ ਜਾਂਦਾ ਹੈ ਜੋ ਤਾਕਤ ਨਾਲੋਂ ਗਿਆਨ ਅਤੇ ਸ਼ਾਂਤੀ ਨੂੰ ਵੱਧ ਪਿਆਰ ਕਰਦਾ ਸੀ।"],
l:"ਮਨ ਦੀ ਸ਼ਾਂਤੀ ਕਿਸੇ ਵੀ ਰਾਜ ਨਾਲੋਂ ਕੀਮਤੀ ਹੈ। ਰੱਬ ਨਾਲ ਸੱਚੇ ਪਿਆਰ ਦਾ ਅਰਥ ਹੈ ਆਪਣਾ ਸਭ ਕੁਝ ਉਸ ਨੂੰ ਅਰਪਣ ਕਰਨਾ।"};

PA["emperors-invitation"]={t:[
"ਬਾਦਸ਼ਾਹ ਬਣਨ ਤੋਂ ਬਾਅਦ ਔਰੰਗਜ਼ੇਬ ਨੂੰ ਸਿੱਖਾਂ ਦੀ ਵਧਦੀ ਤਾਕਤ ਦੀ ਚਿੰਤਾ ਹੋਣ ਲੱਗੀ। ਉਸ ਨੇ ਗੁਰੂ ਹਰਿ ਰਾਇ ਸਾਹਿਬ ਜੀ ਨੂੰ ਦਿੱਲੀ ਆਉਣ ਦਾ ਹੁਕਮ ਭੇਜਿਆ।",
"ਗੁਰੂ ਜੀ ਨੇ ਜਾਣਾ ਠੀਕ ਨਾ ਸਮਝਿਆ। ਉਨ੍ਹਾਂ ਨੇ ਜਵਾਬ ਲਿਖਿਆ, 'ਮੈਂ ਤੇਰੀ ਕੋਈ ਜ਼ਮੀਨ ਨਹੀਂ ਲਈ, ਅਤੇ ਤੇਰਾ ਕੁਝ ਦੇਣਦਾਰ ਨਹੀਂ। ਮੈਂ ਤੇਰੇ ਕੋਲ ਕਿਉਂ ਆਵਾਂ?' ਗੁੱਸੇ ਵਿੱਚ ਔਰੰਗਜ਼ੇਬ ਨੇ ਲਾਹੌਰ ਦੇ ਸੂਬੇਦਾਰ ਨੂੰ ਗੁਰੂ ਜੀ ਨੂੰ ਜ਼ਬਰਦਸਤੀ ਲਿਆਉਣ ਲਈ ਕਿਹਾ।",
"ਤਿੰਨ ਵਾਰ ਸੂਬੇਦਾਰ ਨੇ ਕੀਰਤਪੁਰ ਵੱਲ ਫ਼ੌਜ ਭੇਜੀ, ਅਤੇ ਤਿੰਨੇ ਵਾਰ ਉਹ ਪਹੁੰਚ ਨਾ ਸਕੀ। ਪਹਿਲਾ ਸੈਨਾਪਤੀ ਰਸਤੇ ਵਿੱਚ ਬਿਮਾਰ ਹੋ ਕੇ ਮਰ ਗਿਆ। ਦੂਜਾ ਪਹੁੰਚਣ ਤੋਂ ਪਹਿਲਾਂ ਹੀ ਆਪਣੇ ਦੁਸ਼ਮਣਾਂ ਹੱਥੋਂ ਮਾਰਿਆ ਗਿਆ। ਤੀਜੀ ਫ਼ੌਜ ਵਿੱਚ ਭਿਆਨਕ ਬਿਮਾਰੀ ਫੈਲ ਗਈ, ਅਤੇ ਸਿਪਾਹੀਆਂ ਨੇ ਅੱਗੇ ਜਾਣ ਤੋਂ ਨਾਂਹ ਕਰ ਦਿੱਤੀ। ਇਸ ਤੋਂ ਬਾਅਦ ਕੋਈ ਜਰਨੈਲ ਕੀਰਤਪੁਰ ਉੱਤੇ ਚੜ੍ਹਾਈ ਕਰਨ ਨੂੰ ਤਿਆਰ ਨਾ ਹੋਇਆ।",
"ਔਰੰਗਜ਼ੇਬ ਸਮਝ ਗਿਆ ਕਿ ਉਹ ਗੁਰੂ ਜੀ ਨੂੰ ਜ਼ਬਰਦਸਤੀ ਨਹੀਂ ਲਿਆ ਸਕਦਾ। ਇਸ ਲਈ ਉਸ ਨੇ ਦੀਵਾਨ ਸ਼ਿਵ ਦਿਆਲ ਨੂੰ, ਜੋ ਗੁਰੂ ਜੀ ਦਾ ਸਤਿਕਾਰ ਕਰਦਾ ਸੀ, ਅਦਬ ਨਾਲ ਸੱਦਾ ਦੇਣ ਲਈ ਭੇਜਿਆ।",
"ਕੀਰਤਪੁਰ ਪਹੁੰਚ ਕੇ ਦੀਵਾਨ ਨੇ ਕਿਹਾ, 'ਗੁਰੂ ਜੀ, ਕਿਰਪਾ ਕਰਕੇ ਦਿੱਲੀ ਆ ਕੇ ਉੱਥੋਂ ਦੀ ਸੰਗਤ ਨੂੰ ਦਰਸ਼ਨ ਦਿਓ, ਅਤੇ ਬਾਦਸ਼ਾਹ ਨੂੰ ਸੱਚ ਦਾ ਰਾਹ ਵਿਖਾਓ।' ਗੁਰੂ ਜੀ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, 'ਮੈਂ ਬਾਦਸ਼ਾਹ ਦੇ ਸਾਹਮਣੇ ਨਾ ਜਾਣ ਦਾ ਫ਼ੈਸਲਾ ਕੀਤਾ ਹੈ। ਪਰ ਮੈਂ ਆਪਣੇ ਵੱਡੇ ਪੁੱਤਰ ਰਾਮ ਰਾਇ ਨੂੰ ਤੇਰੇ ਨਾਲ ਭੇਜਾਂਗਾ।'",
"ਰਾਮ ਰਾਇ ਸਿਰਫ਼ ਗਿਆਰਾਂ ਸਾਲ ਦੇ ਸਨ। ਉਨ੍ਹਾਂ ਦੇ ਜਾਣ ਤੋਂ ਪਹਿਲਾਂ ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਆਪਣੇ ਵਿਸ਼ਵਾਸ ਉੱਤੇ ਪੱਕਾ ਰਹੀਂ। ਜੇ ਰਹੇਂਗਾ, ਤਾਂ ਸਭ ਠੀਕ ਹੋਵੇਗਾ।'"],
l:"ਸਹੀ ਗੱਲ ਲਈ ਸ਼ਾਂਤੀ ਨਾਲ ਅਤੇ ਬਿਨਾਂ ਡਰੇ ਡਟ ਕੇ ਖੜ੍ਹੋ।"};

PA["ram-rai-word"]={t:[
"ਬਾਦਸ਼ਾਹ ਔਰੰਗਜ਼ੇਬ ਚਾਹੁੰਦਾ ਸੀ ਕਿ ਸੱਤਵੇਂ ਗੁਰੂ, ਗੁਰੂ ਹਰਿ ਰਾਇ ਸਾਹਿਬ ਜੀ, ਦਿੱਲੀ ਉਸ ਦੇ ਦਰਬਾਰ ਵਿੱਚ ਆਉਣ। ਗੁਰੂ ਜੀ ਬਾਦਸ਼ਾਹ ਅੱਗੇ ਨਹੀਂ ਗਏ, ਸਗੋਂ ਆਪਣੇ ਵੱਡੇ ਪੁੱਤਰ ਰਾਮ ਰਾਇ ਨੂੰ ਭੇਜਿਆ। ਰਾਮ ਰਾਇ ਸਿਰਫ਼ ਗਿਆਰਾਂ ਸਾਲ ਦੇ ਸਨ, ਪਰ ਬਹੁਤ ਹੁਸ਼ਿਆਰ ਅਤੇ ਹਾਜ਼ਰ-ਜਵਾਬ ਸਨ। ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨਾਲ ਸਿਆਣੇ ਸਿੱਖ ਅਤੇ ਬਾਈ ਘੋੜਸਵਾਰ ਦਿੱਲੀ ਭੇਜੇ, ਜਿੱਥੇ ਉਹ ਜਮਨਾ ਦਰਿਆ ਕੰਢੇ ਮਜਨੂੰ ਕਾ ਟਿੱਲਾ ਵਿਖੇ ਠਹਿਰੇ।",
"ਬਾਦਸ਼ਾਹ ਦੇ ਦਰਬਾਰ ਵਿੱਚ ਔਰੰਗਜ਼ੇਬ ਇਸ ਹੋਣਹਾਰ ਬਾਲਕ ਤੋਂ ਹੈਰਾਨ ਰਹਿ ਗਿਆ। ਉਸ ਨੇ ਰਾਮ ਰਾਇ ਨੂੰ ਆਪਣੇ ਕੋਲ ਬਿਠਾਇਆ ਅਤੇ ਬਹੁਤ ਸਵਾਲ ਪੁੱਛੇ, ਅਤੇ ਰਾਮ ਰਾਇ ਨੇ ਸਭ ਦੇ ਜਵਾਬ ਸਿਆਣਪ ਨਾਲ ਦਿੱਤੇ। ਬਾਦਸ਼ਾਹ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਬਹੁਤ ਮਾਣ ਦਿੱਤਾ। ਹੌਲੀ-ਹੌਲੀ ਰਾਮ ਰਾਇ ਭੁੱਲਣ ਲੱਗੇ ਕਿ ਇਹ ਇੱਜ਼ਤ ਗੁਰੂ ਦੀ ਬਖ਼ਸ਼ਿਸ਼ ਕਰਕੇ ਹੈ, ਅਤੇ ਸੋਚਣ ਲੱਗੇ ਕਿ ਇਹ ਸਭ ਉਨ੍ਹਾਂ ਦੀ ਆਪਣੀ ਵਜ੍ਹਾ ਨਾਲ ਹੈ।",
"ਔਰੰਗਜ਼ੇਬ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਕਰਾਮਾਤਾਂ ਵਿਖਾਉਣ ਲਈ ਕਿਹਾ, ਅਤੇ ਬਾਦਸ਼ਾਹ ਨੂੰ ਖ਼ੁਸ਼ ਕਰਨ ਲਈ ਰਾਮ ਰਾਇ ਨੇ ਵਾਰ-ਵਾਰ ਵਿਖਾਈਆਂ ਅਤੇ ਕੀਮਤੀ ਤੋਹਫ਼ੇ ਲਏ। ਉਹ ਗੁਰੂ ਘਰ ਦੀ ਇੱਕ ਜ਼ਰੂਰੀ ਸਿੱਖਿਆ ਭੁੱਲ ਗਏ: ਸਿੱਖ ਲੋਕਾਂ ਨੂੰ ਪ੍ਰਭਾਵਿਤ ਕਰਨ ਲਈ ਕਰਾਮਾਤਾਂ ਨਹੀਂ ਵਿਖਾਉਂਦੇ, ਕਿਉਂਕਿ ਸਿਰਫ਼ ਰੱਬ ਦਾ ਭਾਣਾ ਵਰਤਣਾ ਚਾਹੀਦਾ ਹੈ।",
"ਫਿਰ ਬਾਦਸ਼ਾਹ ਦੇ ਸਲਾਹਕਾਰਾਂ ਨੇ ਆਸਾ ਦੀ ਵਾਰ ਵਿੱਚੋਂ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦੀ ਇੱਕ ਤੁਕ ਵੱਲ ਇਸ਼ਾਰਾ ਕੀਤਾ: 'ਮਿਟੀ ਮੁਸਲਮਾਨ ਕੀ ਪੇੜੈ ਪਈ ਕੁਮ੍ਹ੍ਹਿਆਰ ॥' ਭਾਵ ਮੁਸਲਮਾਨ ਦੀ ਕਬਰ ਦੀ ਮਿੱਟੀ ਘੁਮਿਆਰ ਦੇ ਹੱਥ ਆ ਕੇ ਭਾਂਡੇ ਅਤੇ ਇੱਟਾਂ ਬਣਦੀ ਹੈ ਅਤੇ ਅੱਗ ਵਿੱਚ ਪੱਕਦੀ ਹੈ (ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ, ਅੰਗ 466)। ਗੁਰੂ ਜੀ ਦਾ ਭਾਵ ਸੀ ਕਿ ਹਰ ਸਰੀਰ ਮਿੱਟੀ ਵਿੱਚ ਮਿਲ ਜਾਂਦਾ ਹੈ, ਅਤੇ ਸਿਰਫ਼ ਸਾਡੇ ਕਰਮ ਹੀ ਮਹੱਤਵ ਰੱਖਦੇ ਹਨ। ਪਰ ਔਰੰਗਜ਼ੇਬ ਨੇ ਪੁੱਛਿਆ, 'ਗੁਰੂ ਨਾਨਕ ਨੇ ਮੁਸਲਮਾਨਾਂ ਬਾਰੇ ਇਹ ਕਿਉਂ ਲਿਖਿਆ?'",
"ਰਾਮ ਰਾਇ ਬਾਦਸ਼ਾਹ ਨੂੰ ਖ਼ੁਸ਼ ਰੱਖਣਾ ਚਾਹੁੰਦੇ ਸਨ। 'ਗੁਰੂ ਨਾਨਕ ਨੇ ਅਸਲ ਵਿੱਚ ਬੇਈਮਾਨ ਲਿਖਿਆ ਸੀ, ਮੁਸਲਮਾਨ ਨਹੀਂ,' ਉਨ੍ਹਾਂ ਨੇ ਕਿਹਾ। 'ਲਿਖਾਰੀ ਤੋਂ ਗ਼ਲਤੀ ਹੋ ਗਈ।' ਉਨ੍ਹਾਂ ਨੇ ਇੱਕ ਬਾਦਸ਼ਾਹ ਨੂੰ ਖ਼ੁਸ਼ ਕਰਨ ਲਈ ਗੁਰੂ ਦੇ ਬਚਨ ਬਦਲ ਦਿੱਤੇ ਸਨ।",
"ਜਦੋਂ ਕੀਰਤਪੁਰ ਵਿੱਚ ਗੁਰੂ ਹਰਿ ਰਾਇ ਸਾਹਿਬ ਜੀ ਨੇ ਇਹ ਸੁਣਿਆ, ਉਨ੍ਹਾਂ ਨੂੰ ਬਹੁਤ ਦੁੱਖ ਹੋਇਆ। ਉਨ੍ਹਾਂ ਨੇ ਰਾਮ ਰਾਇ ਨੂੰ ਸੁਨੇਹਾ ਭੇਜਿਆ: 'ਮੁੜ ਕੇ ਮੈਨੂੰ ਮੂੰਹ ਨਾ ਵਿਖਾਈਂ। ਤੂੰ ਇੱਜ਼ਤ ਅਤੇ ਤੋਹਫ਼ਿਆਂ ਖ਼ਾਤਰ ਸੱਚ ਛੱਡ ਦਿੱਤਾ ਹੈ।' ਬਾਅਦ ਵਿੱਚ ਗੁਰੂ ਜੀ ਨੇ ਆਪਣੇ ਛੋਟੇ ਪੁੱਤਰ ਹਰਿਕ੍ਰਿਸ਼ਨ ਜੀ ਨੂੰ ਅਗਲੇ ਗੁਰੂ ਚੁਣਿਆ।"],
l:"ਗੁਰੂ ਦੇ ਬਚਨ ਕਦੇ ਨਹੀਂ ਬਦਲਣੇ ਚਾਹੀਦੇ, ਦੁਨੀਆ ਦੇ ਸਭ ਤੋਂ ਤਾਕਤਵਰ ਬੰਦੇ ਨੂੰ ਖ਼ੁਸ਼ ਕਰਨ ਲਈ ਵੀ ਨਹੀਂ।"};

PA["five-year-old-guru"]={t:[
"ਗੁਰੂ ਹਰਿਕ੍ਰਿਸ਼ਨ ਸਾਹਿਬ ਜੀ ਦਾ ਜਨਮ 1656 ਵਿੱਚ ਕੀਰਤਪੁਰ ਵਿਖੇ ਹੋਇਆ। ਉਨ੍ਹਾਂ ਦੇ ਮਾਤਾ, ਮਾਤਾ ਕ੍ਰਿਸ਼ਨ ਕੌਰ ਜੀ ਅਤੇ ਪਿਤਾ ਗੁਰੂ ਹਰਿ ਰਾਇ ਸਾਹਿਬ ਜੀ ਸਨ। 1661 ਵਿੱਚ ਪਿਤਾ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਅੱਠਵੇਂ ਗੁਰੂ ਥਾਪਿਆ। ਉਹ ਸਿਰਫ਼ ਪੰਜ ਸਾਲ ਦੇ ਸਨ।",
"ਉਨ੍ਹਾਂ ਦੇ ਵੱਡੇ ਭਰਾ ਰਾਮ ਰਾਇ ਬਹੁਤ ਨਾਰਾਜ਼ ਹੋਏ। ਕੁਝ ਮਸੰਦਾਂ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਕਿਹਾ, 'ਅਸੀਂ ਤੁਹਾਨੂੰ ਗੁਰੂ ਬਣਾ ਸਕਦੇ ਹਾਂ।' ਤਾਂ ਰਾਮ ਰਾਇ ਬਾਦਸ਼ਾਹ ਔਰੰਗਜ਼ੇਬ ਕੋਲ ਗਏ ਅਤੇ ਗੁਰਗੱਦੀ ਲੈਣ ਲਈ ਮਦਦ ਮੰਗੀ।",
"ਪਰ ਔਰੰਗਜ਼ੇਬ ਨੇ ਕਿਹਾ, 'ਮੈਂ ਤੈਨੂੰ ਗੁਰੂ ਨਹੀਂ ਬਣਾ ਸਕਦਾ। ਇਹ ਸਿੱਖਾਂ ਨੇ ਫ਼ੈਸਲਾ ਕਰਨਾ ਹੈ ਕਿ ਉਹ ਕਿਸ ਦੇ ਪਿੱਛੇ ਚੱਲਣ।' ਇਸ ਦੀ ਥਾਂ ਉਸ ਨੇ ਰਾਮ ਰਾਇ ਨੂੰ ਉਸ ਇਲਾਕੇ ਦੇ ਕੁਝ ਪਿੰਡ ਦੇ ਦਿੱਤੇ ਜਿੱਥੇ ਅੱਜ ਦੇਹਰਾਦੂਨ ਸ਼ਹਿਰ ਹੈ।",
"ਕੁਝ ਲੋਕਾਂ ਨੂੰ ਸ਼ੱਕ ਸੀ ਕਿ ਇੰਨਾ ਛੋਟਾ ਬੱਚਾ ਸੱਚਮੁੱਚ ਗੁਰੂ ਹੋ ਸਕਦਾ ਹੈ। ਗੁਰੂ ਹਰਿ ਰਾਇ ਸਾਹਿਬ ਜੀ ਨੇ ਸਿਖਾਇਆ ਸੀ, 'ਗੁਰੂ ਜੋਤ ਹੈ, ਸਰੀਰ ਨਹੀਂ,' ਪਰ ਉਹ ਸਮਝੇ ਨਹੀਂ। ਮਜ਼ਾਕ ਵਿੱਚ ਉਨ੍ਹਾਂ ਨੇ ਕੋਹੜ, ਜੋ ਚਮੜੀ ਦੀ ਇੱਕ ਦੁਖਦਾਈ ਬਿਮਾਰੀ ਹੈ, ਨਾਲ ਪੀੜਤ ਇੱਕ ਆਦਮੀ ਨੂੰ ਕਿਹਾ, 'ਸਿੱਖਾਂ ਦੇ ਗੁਰੂ ਕੋਲ ਜਾ। ਉਹ ਤੈਨੂੰ ਠੀਕ ਕਰ ਦੇਣਗੇ!'",
"ਉਹ ਗਰੀਬ ਆਦਮੀ ਉਸ ਰਾਹ ਉੱਤੇ ਲੇਟ ਗਿਆ ਜਿੱਥੋਂ ਬਾਲ ਗੁਰੂ ਜੀ ਲੰਘ ਰਹੇ ਸਨ, ਅਤੇ ਪੁਕਾਰਿਆ, 'ਹੇ ਗੁਰੂ, ਮੈਨੂੰ ਠੀਕ ਕਰ ਦਿਓ!' ਗੁਰੂ ਹਰਿਕ੍ਰਿਸ਼ਨ ਸਾਹਿਬ ਜੀ ਨੇ ਉਸ ਨੂੰ ਆਪਣਾ ਰੁਮਾਲ ਦਿੱਤਾ ਅਤੇ ਕਿਹਾ, 'ਰੱਬ ਦਾ ਨਾਮ ਯਾਦ ਕਰ, ਅਤੇ ਇਹ ਰੁਮਾਲ ਆਪਣੇ ਸਰੀਰ ਉੱਤੇ ਫੇਰ।' ਉਸ ਨੇ ਇਉਂ ਹੀ ਕੀਤਾ, ਅਤੇ ਉਹ ਠੀਕ ਹੋ ਗਿਆ। ਮਜ਼ਾਕ ਕਰਨ ਵਾਲੇ ਬਹੁਤ ਸ਼ਰਮਿੰਦੇ ਹੋਏ।",
"ਇਹ ਖ਼ਬਰ ਦੂਰ-ਦੂਰ ਤੱਕ ਫੈਲ ਗਈ। ਦੂਰੋਂ-ਨੇੜਿਓਂ ਬਿਮਾਰ ਲੋਕ ਗੁਰੂ ਜੀ ਕੋਲ ਆਉਂਦੇ, ਗੁਰੂ ਘਰ ਦੇ ਦਵਾਖ਼ਾਨੇ ਤੋਂ ਦਵਾਈ ਲੈਂਦੇ, ਅਤੇ ਠੀਕ ਅਤੇ ਖ਼ੁਸ਼ ਹੋ ਕੇ ਘਰ ਜਾਂਦੇ। ਜੂਆ ਅਤੇ ਚੋਰੀ ਵਰਗੀਆਂ ਬੁਰੀਆਂ ਆਦਤਾਂ ਵਿੱਚ ਫਸੇ ਕਈ ਲੋਕਾਂ ਨੇ ਉਹ ਛੱਡ ਦਿੱਤੀਆਂ ਅਤੇ ਗੁਰੂ ਦੀ ਸੰਗਤ ਵਿੱਚ ਨਵਾਂ ਜੀਵਨ ਸ਼ੁਰੂ ਕੀਤਾ।"],
l:"ਸਿਆਣਪ ਅਤੇ ਚੰਗਿਆਈ ਉਮਰ ਉੱਤੇ ਨਿਰਭਰ ਨਹੀਂ ਕਰਦੀ। ਗੁਰੂ ਜੋਤ ਹੈ, ਸਰੀਰ ਨਹੀਂ।"};

PA["chhajju-gita"]={t:[
"ਬਾਦਸ਼ਾਹ ਔਰੰਗਜ਼ੇਬ ਨੇ ਸੁਣਿਆ ਸੀ ਕਿ ਸਿੱਖਾਂ ਦਾ ਆਪਣੇ ਬਾਲ ਗੁਰੂ ਨਾਲ ਪਿਆਰ ਹਰ ਰੋਜ਼ ਵਧਦਾ ਜਾ ਰਿਹਾ ਹੈ। ਉਹ ਆਪ ਗੁਰੂ ਜੀ ਨੂੰ ਮਿਲਣਾ ਚਾਹੁੰਦਾ ਸੀ, ਇਸ ਲਈ ਉਸ ਨੇ ਆਪਣੇ ਦਰਬਾਰ ਦੇ ਇੱਕ ਰਾਜਪੂਤ ਰਾਜੇ, ਮਿਰਜ਼ਾ ਰਾਜਾ ਜੈ ਸਿੰਘ, ਨੂੰ, ਜੋ ਗੁਰੂ ਘਰ ਨਾਲ ਪਿਆਰ ਕਰਦਾ ਸੀ, ਗੁਰੂ ਜੀ ਨੂੰ ਦਿੱਲੀ ਸੱਦਣ ਲਈ ਕਿਹਾ।",
"ਰਾਜੇ ਨੇ ਆਪਣੇ ਦੀਵਾਨ, ਦੀਵਾਨ ਪਰਸ ਰਾਮ, ਨੂੰ ਕੀਰਤਪੁਰ ਭੇਜਿਆ। ਗੁਰੂ ਜੀ ਦਿੱਲੀ ਦੀ ਸੰਗਤ ਨੂੰ ਮਿਲਣ ਲਈ ਜਾਣ ਨੂੰ ਮੰਨ ਗਏ, ਪਰ ਕਿਹਾ, 'ਮੈਂ ਬਾਦਸ਼ਾਹ ਦੇ ਸਾਹਮਣੇ ਨਹੀਂ ਜਾਵਾਂਗਾ। ਇਹ ਮੇਰੇ ਪਿਤਾ ਜੀ ਦਾ ਹੁਕਮ ਸੀ, ਅਤੇ ਮੈਂ ਇਸ ਨੂੰ ਨਿਭਾਵਾਂਗਾ।'",
"ਬਸੰਤ ਦੇ ਤਿਉਹਾਰ ਵਾਲੇ ਦਿਨ ਗੁਰੂ ਜੀ ਬਹੁਤ ਸਾਰੇ ਸਿੱਖਾਂ ਨਾਲ ਕੀਰਤਪੁਰ ਤੋਂ ਤੁਰੇ। ਜਦੋਂ ਉਹ ਅੰਬਾਲੇ ਦੇ ਨੇੜੇ ਪਿੰਡ ਪੰਜੋਖਰੇ ਰੁਕੇ, ਪੰਡਿਤ ਲਾਲ ਚੰਦ ਨਾਂ ਦੇ ਇੱਕ ਵਿਦਵਾਨ ਨੇ ਸ਼ਾਨਦਾਰ ਕਾਫ਼ਲਾ ਲੰਘਦਾ ਵੇਖਿਆ ਅਤੇ ਪੁੱਛਿਆ ਕਿ ਇਹ ਕੌਣ ਹੈ।",
"ਜਦੋਂ ਇੱਕ ਸਿੱਖ ਨੇ ਦੱਸਿਆ ਕਿ ਇਹ ਗੁਰੂ ਹਰਿਕ੍ਰਿਸ਼ਨ ਜੀ ਹਨ, ਪੰਡਿਤ ਨੇ ਕਿਹਾ, 'ਆਪਣੇ ਆਪ ਨੂੰ ਕ੍ਰਿਸ਼ਨ ਤਾਂ ਕੋਈ ਵੀ ਕਹਿ ਸਕਦਾ ਹੈ! ਵੇਖਦਾ ਹਾਂ ਕਿ ਇਨ੍ਹਾਂ ਵਿੱਚ ਸੱਚਮੁੱਚ ਗਿਆਨ ਹੈ ਜਾਂ ਨਹੀਂ।' ਸਿੱਖ ਉਸ ਨੂੰ ਗੁਰੂ ਜੀ ਕੋਲ ਲੈ ਗਿਆ। ਪੰਡਿਤ ਨੇ ਕਿਹਾ, 'ਤੁਹਾਡਾ ਨਾਂ ਕ੍ਰਿਸ਼ਨ ਨਾਲ ਮਿਲਦਾ ਹੈ, ਜਿਨ੍ਹਾਂ ਨੇ ਗੀਤਾ ਦਾ ਉਪਦੇਸ਼ ਦਿੱਤਾ। ਕੀ ਤੁਸੀਂ ਗੀਤਾ ਦਾ ਇੱਕ ਸਲੋਕ ਵੀ ਸਮਝਾ ਸਕਦੇ ਹੋ?'",
"ਬਾਲ ਗੁਰੂ ਜੀ ਮੁਸਕਰਾਏ। 'ਜੇ ਮੈਂ ਸਮਝਾਵਾਂ ਵੀ, ਤਾਂ ਸ਼ਾਇਦ ਤੁਹਾਡੀ ਤਸੱਲੀ ਨਾ ਹੋਵੇ। ਜਾਓ, ਪਿੰਡ ਵਿੱਚੋਂ ਕਿਸੇ ਨੂੰ ਵੀ ਲੈ ਆਓ, ਉਹ ਤੁਹਾਡੇ ਸਵਾਲਾਂ ਦੇ ਜਵਾਬ ਦੇਵੇਗਾ।' ਪੰਡਿਤ ਛੱਜੂ ਨੂੰ ਲੈ ਆਇਆ, ਜੋ ਇੱਕ ਸਾਦਾ ਝੀਵਰ ਸੀ ਅਤੇ ਕਦੇ ਪੜ੍ਹਨਾ ਨਹੀਂ ਸਿੱਖਿਆ ਸੀ।",
"ਗੁਰੂ ਜੀ ਦੀ ਬਖ਼ਸ਼ਿਸ਼ ਨਾਲ ਛੱਜੂ ਗੀਤਾ ਦੇ ਸਲੋਕਾਂ ਦੇ ਡੂੰਘੇ ਅਰਥ ਕਿਸੇ ਵੱਡੇ ਵਿਦਵਾਨ ਵਾਂਗ ਸਪਸ਼ਟ ਸਮਝਾਉਣ ਲੱਗ ਪਿਆ। ਪੰਡਿਤ ਲਾਲ ਚੰਦ ਹੈਰਾਨ ਰਹਿ ਗਿਆ। ਉਸ ਦਾ ਹੰਕਾਰ ਪਿਘਲ ਗਿਆ, ਉਸ ਨੇ ਗੁਰੂ ਜੀ ਦੇ ਚਰਨਾਂ ਉੱਤੇ ਮੱਥਾ ਟੇਕਿਆ, ਅਤੇ ਸਿੱਖ ਬਣ ਗਿਆ। ਅੱਜ ਉਸ ਥਾਂ ਗੁਰਦੁਆਰਾ ਪੰਜੋਖਰਾ ਸਾਹਿਬ ਸੁਸ਼ੋਭਿਤ ਹੈ।"],
l:"ਆਪਣੀ ਵਿੱਦਿਆ ਦਾ ਹੰਕਾਰ ਸਾਨੂੰ ਅੰਨ੍ਹਾ ਕਰ ਸਕਦਾ ਹੈ। ਸੱਚਾ ਗਿਆਨ ਇੱਕ ਦਾਤ ਹੈ ਜੋ ਗੁਰੂ ਕਿਸੇ ਨੂੰ ਵੀ ਬਖ਼ਸ਼ ਸਕਦਾ ਹੈ, ਭਾਵੇਂ ਉਹ ਕਿੰਨਾ ਵੀ ਸਾਧਾਰਨ ਹੋਵੇ।"};

PA["queen-in-disguise"]={t:[
"ਜਦੋਂ ਗੁਰੂ ਹਰਿਕ੍ਰਿਸ਼ਨ ਸਾਹਿਬ ਜੀ ਦਿੱਲੀ ਪਹੁੰਚੇ, ਮਿਰਜ਼ਾ ਰਾਜਾ ਜੈ ਸਿੰਘ ਨੇ ਉਨ੍ਹਾਂ ਦਾ ਸੁਆਗਤ ਕੀਤਾ ਅਤੇ ਠਹਿਰਨ ਲਈ ਆਪਣਾ ਬੰਗਲਾ ਦਿੱਤਾ। ਉਹ ਥਾਂ ਹੁਣ ਗੁਰਦੁਆਰਾ ਬੰਗਲਾ ਸਾਹਿਬ ਹੈ। ਗੁਰੂ ਜੀ ਨੇ ਰਾਜੇ ਨੂੰ ਕਿਹਾ, 'ਮੈਂ ਇੱਥੋਂ ਦੇ ਸਿੱਖਾਂ ਦੇ ਪਿਆਰ ਕਰਕੇ ਆਇਆ ਹਾਂ। ਮੈਂ ਔਰੰਗਜ਼ੇਬ ਨੂੰ ਨਹੀਂ ਮਿਲਾਂਗਾ।'",
"ਔਰੰਗਜ਼ੇਬ ਹੈਰਾਨ ਹੋਇਆ। ਉਸ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਕੀਮਤੀ ਤੋਹਫ਼ੇ ਭੇਜੇ: ਹੀਰੇ-ਜਵਾਹਰਾਤ, ਮੋਤੀ, ਵਧੀਆ ਕੱਪੜੇ ਅਤੇ ਇੱਕ ਮਾਲਾ। ਗੁਰੂ ਜੀ ਨੇ ਸਿਰਫ਼ ਮਾਲਾ ਰੱਖੀ ਅਤੇ ਬਾਕੀ ਸਭ ਵਾਪਸ ਭੇਜ ਦਿੱਤਾ। ਔਰੰਗਜ਼ੇਬ ਸਮਝ ਗਿਆ ਕਿ ਗੁਰੂ ਜੀ ਨੂੰ ਧਨ ਦਾ ਲਾਲਚ ਨਹੀਂ, ਅਤੇ ਨਾ ਹੀ ਕਿਸੇ ਬਾਦਸ਼ਾਹ ਦਾ ਡਰ ਹੈ।",
"ਫਿਰ ਬਾਦਸ਼ਾਹ ਨੇ ਇੱਕ ਪਰਖ ਸੋਚੀ। ਉਸ ਨੇ ਮਿਰਜ਼ਾ ਰਾਜਾ ਜੈ ਸਿੰਘ ਨੂੰ ਕਿਹਾ ਕਿ ਆਪਣੀ ਰਾਣੀ ਨੂੰ ਦਾਸੀ ਵਾਂਗ ਸਾਦੇ ਕੱਪੜੇ ਪਹਿਨਾ ਕੇ ਮਹਿਲ ਦੀਆਂ ਦਾਸੀਆਂ ਵਿੱਚ ਬਿਠਾਵੇ। 'ਵੇਖਦੇ ਹਾਂ ਕਿ ਗੁਰੂ ਜੀ ਉਸ ਨੂੰ ਪਛਾਣ ਸਕਦੇ ਹਨ ਜਾਂ ਨਹੀਂ,' ਉਸ ਨੇ ਕਿਹਾ।",
"ਰਾਜੇ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਮਹਿਲ ਵਿੱਚ ਸੱਦਿਆ। ਬਾਲ ਗੁਰੂ ਜੀ ਸਾਰੀਆਂ ਇਸਤਰੀਆਂ ਕੋਲੋਂ ਲੰਘਦੇ ਹੋਏ ਰਾਣੀ ਕੋਲ ਪਹੁੰਚ ਗਏ। ਉਨ੍ਹਾਂ ਨੇ ਆਪਣੀ ਛੋਟੀ ਜਿਹੀ ਛੜੀ ਨਾਲ ਉਸ ਦੇ ਸਿਰ ਨੂੰ ਹੌਲੀ ਜਿਹੀ ਛੂਹਿਆ ਅਤੇ ਕਿਹਾ, 'ਰਾਣੀ ਦਾਸੀ ਦਾ ਭੇਸ ਕਿਉਂ ਧਾਰੇ?' ਰਾਣੀ ਹੈਰਾਨ ਰਹਿ ਗਈ, ਅਤੇ ਪਰਖ ਮੁੱਕ ਗਈ।",
"ਫਿਰ ਔਰੰਗਜ਼ੇਬ ਨੇ ਆਪਣੇ ਪੁੱਤਰ, ਸ਼ਹਿਜ਼ਾਦਾ ਮੁਅੱਜ਼ਮ, ਨੂੰ ਗੁਰੂ ਜੀ ਨੂੰ ਮਿਲਣ ਭੇਜਿਆ। ਸ਼ਹਿਜ਼ਾਦਾ ਲੰਗਰ ਦੀ ਰੌਣਕ ਵੇਖ ਕੇ ਹੈਰਾਨ ਰਹਿ ਗਿਆ, ਜਿੱਥੇ ਕੋਈ ਵੀ ਕਿਸੇ ਵੇਲੇ ਵੀ ਛਕ ਸਕਦਾ ਸੀ, ਅਤੇ ਕਹਿੰਦੇ ਹਨ ਕਿ ਗੁਰੂ ਜੀ ਨੇ ਉਸ ਨੂੰ ਬਾਗ਼ ਵਿੱਚੋਂ ਬੇਮੌਸਮੇ ਫਲ ਦਿੱਤੇ।",
"ਸ਼ਹਿਜ਼ਾਦੇ ਨੇ ਪੁੱਛਿਆ ਕਿ ਕੀ ਗੁਰੂ ਜੀ ਉਸ ਦੇ ਪਿਤਾ ਨੂੰ ਮਿਲਣਗੇ। ਗੁਰੂ ਜੀ ਨੇ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦੇ ਬਚਨਾਂ ਨਾਲ ਜਵਾਬ ਦਿੱਤਾ: ਜਿਸ ਮਨੁੱਖ ਦੇ ਮਨ ਵਿੱਚ ਸੱਚਾ ਪ੍ਰਭੂ ਨਹੀਂ ਵੱਸਦਾ, ਉਸ ਦਾ ਖਾਣਾ ਅਤੇ ਵਧੀਆ ਕੱਪੜੇ ਸਭ ਵਿਅਰਥ ਹਨ (ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ, ਅੰਗ 142)। ਉਨ੍ਹਾਂ ਨੇ ਇਹ ਬਚਨ ਲਿਖ ਕੇ ਸ਼ਹਿਜ਼ਾਦੇ ਨੂੰ ਬਾਦਸ਼ਾਹ ਕੋਲ ਲੈ ਜਾਣ ਲਈ ਦਿੱਤੇ।"],
l:"ਧਨ-ਦੌਲਤ ਅਤੇ ਪਰਖਾਂ ਸੱਚੇ ਗੁਰੂ ਨੂੰ ਡੁਲਾ ਨਹੀਂ ਸਕਦੀਆਂ। ਸਭ ਤੋਂ ਜ਼ਰੂਰੀ ਹੈ ਰੱਬ ਨੂੰ ਮਨ ਵਿੱਚ ਵਸਾਉਣਾ।"};

PA["healing-delhi"]={t:[
"ਜਦੋਂ ਬਾਲ ਗੁਰੂ ਹਰਿਕ੍ਰਿਸ਼ਨ ਸਾਹਿਬ ਜੀ ਦਿੱਲੀ ਆਏ, ਬਾਦਸ਼ਾਹ ਔਰੰਗਜ਼ੇਬ ਨੇ ਆਪਣੇ ਪੁੱਤਰ, ਸ਼ਹਿਜ਼ਾਦਾ ਮੁਅੱਜ਼ਮ, ਨੂੰ ਗੁਰੂ ਜੀ ਨੂੰ ਮਿਲਣ ਭੇਜਿਆ। ਸ਼ਹਿਜ਼ਾਦੇ ਨੇ ਵਾਪਸ ਜਾ ਕੇ ਪਿਤਾ ਨੂੰ ਦੱਸਿਆ, 'ਗੁਰੂ ਜੀ ਦਾ ਦਰਬਾਰ ਕਿਸੇ ਬਾਦਸ਼ਾਹ ਦੇ ਦਰਬਾਰ ਤੋਂ ਵੀ ਸ਼ਾਨਦਾਰ ਹੈ! ਹਰ ਵੇਲੇ ਸਭ ਨੂੰ ਲੰਗਰ ਛਕਾਇਆ ਜਾਂਦਾ ਹੈ, ਬਿਮਾਰ ਠੀਕ ਹੁੰਦੇ ਹਨ, ਅਤੇ ਸਾਰਾ ਦਿਨ ਰੱਬ ਦੀ ਸਿਫ਼ਤ ਗਾਈ ਜਾਂਦੀ ਹੈ।' ਹੁਣ ਔਰੰਗਜ਼ੇਬ ਗੁਰੂ ਜੀ ਨੂੰ ਵੇਖਣ ਲਈ ਹੋਰ ਵੀ ਉਤਾਵਲਾ ਹੋ ਗਿਆ।",
"ਇੱਕ ਸਵੇਰ ਔਰੰਗਜ਼ੇਬ ਇਕੱਲਾ ਹੀ ਬੰਗਲਾ ਸਾਹਿਬ ਆ ਗਿਆ। ਦੀਵਾਨ ਦਰਗਾ ਮੱਲ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਦੱਸਿਆ, ਤਾਂ ਉਨ੍ਹਾਂ ਨੇ ਕਿਹਾ, 'ਦਰਵਾਜ਼ਾ ਬੰਦ ਕਰ ਦਿਓ, ਅਤੇ ਉਸ ਨੂੰ ਕਹਿ ਦਿਓ ਕਿ ਗੁਰੂ ਜੀ ਨਹੀਂ ਮਿਲਣਗੇ।' ਕੁਝ ਦੇਰ ਉਡੀਕ ਕਰਕੇ ਬਾਦਸ਼ਾਹ ਚਲਾ ਗਿਆ।",
"ਇਨ੍ਹਾਂ ਦਿਨਾਂ ਵਿੱਚ ਗੁਰੂ ਜੀ ਦੇ ਦਾਦਾ ਜੀ ਦੇ ਭਰਾ, ਤੇਗ ਬਹਾਦਰ ਜੀ, ਬਕਾਲੇ ਤੋਂ ਮਿਲਣ ਆਏ। ਉਹ ਤਿੰਨ ਦਿਨ ਰਹੇ, ਅਤੇ ਫਿਰ ਬਕਾਲੇ ਮੁੜ ਗਏ।",
"ਛੇਤੀ ਹੀ ਗੁਰੂ ਜੀ ਸ਼ਹਿਰ ਦੇ ਵਿਚਕਾਰ ਭਾਈ ਕਲਿਆਣੇ ਦੀ ਸਰਾਂ ਵਿੱਚ ਚਲੇ ਗਏ। ਉਸ ਵੇਲੇ ਦਿੱਲੀ ਵਿੱਚ ਚੇਚਕ ਨਾਂ ਦੀ ਭਿਆਨਕ ਬਿਮਾਰੀ ਫੈਲ ਰਹੀ ਸੀ। ਸਾਰੇ ਸ਼ਹਿਰ ਤੋਂ ਬਿਮਾਰ ਲੋਕ ਗੁਰੂ ਜੀ ਕੋਲ ਆਉਂਦੇ, ਦਿਨ-ਰਾਤ ਉਨ੍ਹਾਂ ਦੁਆਲੇ ਭੀੜ ਲੱਗੀ ਰਹਿੰਦੀ, ਅਤੇ ਗੁਰੂ ਜੀ ਸਭ ਦੀ ਸੰਭਾਲ ਕਰਦੇ। ਬਹੁਤ ਸਾਰੇ ਠੀਕ ਹੋ ਗਏ।",
"ਫਿਰ ਬਾਲ ਗੁਰੂ ਜੀ ਨੂੰ ਆਪ ਤੇਜ਼ ਬੁਖ਼ਾਰ ਚੜ੍ਹ ਗਿਆ। 30 ਮਾਰਚ 1664 ਨੂੰ ਉਨ੍ਹਾਂ ਨੇ ਇੱਕ ਥਾਲ ਵਿੱਚ ਨਾਰੀਅਲ ਅਤੇ ਪੰਜ ਪੈਸੇ ਮੰਗਵਾਏ। ਉਨ੍ਹਾਂ ਨੇ ਸੱਜੇ ਹੱਥ ਨਾਲ ਥਾਲ ਦੁਆਲੇ ਘੁਮਾਇਆ, ਸੀਸ ਨਿਵਾਇਆ, ਅਤੇ ਕਿਹਾ, 'ਬਾਬਾ ਬਕਾਲੇ', ਜਿਸ ਦਾ ਅਰਥ ਸੀ ਕਿ ਅਗਲੇ ਗੁਰੂ ਬਕਾਲੇ ਵਾਲੇ ਬਜ਼ੁਰਗ ਹਨ। ਫਿਰ, ਸਿਰਫ਼ ਸੱਤ ਸਾਲ ਦੀ ਉਮਰ ਵਿੱਚ, ਉਹ ਜੋਤੀ ਜੋਤਿ ਸਮਾ ਗਏ ਅਤੇ ਵਾਹਿਗੁਰੂ ਵਿੱਚ ਲੀਨ ਹੋ ਗਏ। ਉਨ੍ਹਾਂ ਨੇ ਆਪਣਾ ਬਚਨ ਨਿਭਾਇਆ: ਉਹ ਕਦੇ ਵੀ ਬਾਦਸ਼ਾਹ ਦੇ ਸਾਹਮਣੇ ਨਹੀਂ ਗਏ।",
"ਉਨ੍ਹਾਂ ਦੇ ਅੰਤਿਮ ਬਚਨ ਸਿੱਖਾਂ ਨੂੰ ਬਕਾਲੇ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਕੋਲ ਲੈ ਗਏ। ਅੱਜ ਦਿੱਲੀ ਵਿੱਚ ਜਿੱਥੇ ਬਾਲ ਗੁਰੂ ਜੀ ਠਹਿਰੇ ਸਨ, ਉੱਥੇ ਗੁਰਦੁਆਰਾ ਬੰਗਲਾ ਸਾਹਿਬ ਹੈ, ਅਤੇ ਦੁਨੀਆ ਭਰ ਤੋਂ ਲੋਕ ਅੱਜ ਵੀ ਉੱਥੇ ਅਰਦਾਸ ਕਰਨ ਆਉਂਦੇ ਹਨ।"],
l:"ਪਿਆਰ ਭਰੇ ਦਿਲ ਨਾਲ ਦੂਜਿਆਂ ਦੀ ਸੇਵਾ ਕਰੋ, ਅਤੇ ਆਪਣੇ ਬਚਨ ਨਿਭਾਓ, ਭਾਵੇਂ ਇਹ ਔਖਾ ਹੋਵੇ।"};

PA["bhai-lalo"]={t:[
"ਆਪਣੀਆਂ ਯਾਤਰਾਵਾਂ ਦੌਰਾਨ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਸੈਦਪੁਰ ਸ਼ਹਿਰ ਆਏ, ਜਿਸ ਨੂੰ ਹੁਣ ਐਮਨਾਬਾਦ ਕਹਿੰਦੇ ਹਨ। ਉੱਥੇ ਭਾਈ ਲਾਲੋ ਨਾਂ ਦਾ ਇੱਕ ਗਰੀਬ ਤਰਖਾਣ ਰਹਿੰਦਾ ਸੀ। ਉਹ ਸਾਰਾ ਦਿਨ ਸਖ਼ਤ ਮਿਹਨਤ ਕਰਦਾ ਅਤੇ ਬਹੁਤ ਥੋੜ੍ਹਾ ਕਮਾਉਂਦਾ, ਪਰ ਉਹ ਈਮਾਨਦਾਰ ਅਤੇ ਦਇਆਵਾਨ ਸੀ। ਗੁਰੂ ਜੀ ਨੇ ਭਾਈ ਲਾਲੋ ਦੇ ਸਾਦੇ ਘਰ ਠਹਿਰਨਾ ਚੁਣਿਆ ਅਤੇ ਖ਼ੁਸ਼ੀ ਨਾਲ ਉਸ ਦੀ ਸਾਦੀ, ਕੋਧਰੇ ਦੀ ਰੋਟੀ ਛਕੀ।",
"ਉਸੇ ਸ਼ਹਿਰ ਵਿੱਚ ਮਲਿਕ ਭਾਗੋ ਨਾਂ ਦਾ ਇੱਕ ਅਮੀਰ ਅਫ਼ਸਰ ਰਹਿੰਦਾ ਸੀ। ਉਹ ਲੋਕਾਂ ਨਾਲ ਠੱਗੀ ਕਰਕੇ ਅਤੇ ਗਰੀਬਾਂ ਤੋਂ ਹੱਕ ਨਾਲੋਂ ਵੱਧ ਖੋਹ ਕੇ ਅਮੀਰ ਬਣਿਆ ਸੀ। ਮਲਿਕ ਭਾਗੋ ਨੇ ਇੱਕ ਵੱਡਾ ਭੋਜ ਕੀਤਾ ਅਤੇ ਇਲਾਕੇ ਦੇ ਸਾਰੇ ਸਾਧੂ-ਸੰਤਾਂ ਨੂੰ ਸੱਦਿਆ। ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਤੋਂ ਸਿਵਾ ਸਭ ਆਏ।",
"ਮਲਿਕ ਭਾਗੋ ਨਾਰਾਜ਼ ਹੋ ਗਿਆ। ਉਸ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਸੱਦ ਕੇ ਪੁੱਛਿਆ, \"ਤੁਸੀਂ ਇੱਕ ਤਰਖਾਣ ਦੇ ਘਰ ਸੁੱਕੀ ਰੋਟੀ ਕਿਉਂ ਖਾਂਦੇ ਹੋ ਅਤੇ ਮੇਰੇ ਸੁਆਦਲੇ ਪਕਵਾਨਾਂ ਤੋਂ ਇਨਕਾਰ ਕਿਉਂ ਕਰਦੇ ਹੋ?\"",
"ਗੁਰੂ ਜੀ ਨੇ ਦੋਵਾਂ ਘਰਾਂ ਤੋਂ ਰੋਟੀ ਦਾ ਇੱਕ-ਇੱਕ ਟੁਕੜਾ ਮੰਗਵਾਇਆ। ਉਨ੍ਹਾਂ ਨੇ ਇੱਕ ਹੱਥ ਵਿੱਚ ਭਾਈ ਲਾਲੋ ਦੀ ਅਤੇ ਦੂਜੇ ਹੱਥ ਵਿੱਚ ਮਲਿਕ ਭਾਗੋ ਦੀ ਰੋਟੀ ਫੜ ਕੇ ਨਿਚੋੜੀ। ਕਹਿੰਦੇ ਹਨ ਕਿ ਭਾਈ ਲਾਲੋ ਦੀ ਰੋਟੀ ਵਿੱਚੋਂ ਦੁੱਧ ਨਿਕਲਿਆ, ਅਤੇ ਮਲਿਕ ਭਾਗੋ ਦੀ ਰੋਟੀ ਵਿੱਚੋਂ ਲਹੂ।",
"ਗੁਰੂ ਜੀ ਨੇ ਸਮਝਾਇਆ ਕਿ ਭਾਈ ਲਾਲੋ ਦਾ ਭੋਜਨ ਈਮਾਨਦਾਰ ਕਿਰਤ ਨਾਲ ਬਣਿਆ ਹੈ, ਇਸ ਲਈ ਦੁੱਧ ਵਾਂਗ ਪਵਿੱਤਰ ਹੈ। ਮਲਿਕ ਭਾਗੋ ਦਾ ਭੋਜਨ ਦੂਜਿਆਂ ਦੇ ਦੁੱਖਾਂ ਨਾਲ ਬਣਿਆ ਹੈ। ਮਲਿਕ ਭਾਗੋ ਸ਼ਰਮਿੰਦਾ ਹੋਇਆ। ਉਸ ਨੇ ਆਪਣੇ ਤੌਰ-ਤਰੀਕੇ ਬਦਲ ਲਏ ਅਤੇ ਈਮਾਨਦਾਰੀ ਨਾਲ ਜੀਣ ਲੱਗਾ।"],
l:"ਕਿਰਤ ਕਰਨੀ ਦਾ ਅਰਥ ਹੈ ਈਮਾਨਦਾਰੀ ਨਾਲ ਰੋਜ਼ੀ ਕਮਾਉਣੀ। ਈਮਾਨਦਾਰੀ ਨਾਲ ਕਮਾਏ ਭੋਜਨ ਅਤੇ ਪੈਸੇ ਵਿੱਚ ਬਰਕਤ ਹੁੰਦੀ ਹੈ; ਦੂਜਿਆਂ ਤੋਂ ਖੋਹੇ ਵਿੱਚ ਨਹੀਂ।"};

PA["sweet-reethas"]={t:[
"ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਆਪਣੇ ਮਿੱਤਰ ਅਤੇ ਸਾਥੀ ਭਾਈ ਮਰਦਾਨੇ ਨਾਲ ਯਾਤਰਾ ਕਰਦੇ ਸਨ, ਜੋ ਰਬਾਬ ਵਜਾਉਂਦੇ ਅਤੇ ਗੁਰੂ ਜੀ ਬਾਣੀ ਗਾਉਂਦੇ। ਇੱਕ ਦਿਨ, ਜਦੋਂ ਉਹ ਪੰਜਾਬ ਤੋਂ ਦੂਰ ਪੂਰਬ ਵੱਲ ਪਹਾੜਾਂ ਵਿੱਚੋਂ ਲੰਘ ਰਹੇ ਸਨ, ਭਾਈ ਮਰਦਾਨੇ ਨੂੰ ਬਹੁਤ ਭੁੱਖ ਲੱਗੀ।",
"\"ਗੁਰੂ ਜੀ, ਮੈਨੂੰ ਇੰਨੀ ਭੁੱਖ ਲੱਗੀ ਹੈ ਕਿ ਮੈਂ ਹੋਰ ਨਹੀਂ ਤੁਰ ਸਕਦਾ,\" ਉਨ੍ਹਾਂ ਕਿਹਾ। ਪਰ ਨੇੜੇ-ਤੇੜੇ ਨਾ ਕੋਈ ਪਿੰਡ ਸੀ ਨਾ ਭੋਜਨ, ਸਿਰਫ਼ ਰੀਠਿਆਂ ਨਾਲ ਲੱਦਿਆ ਇੱਕ ਰੁੱਖ ਸੀ। ਰੀਠੇ ਇੰਨੇ ਕੌੜੇ ਹੁੰਦੇ ਹਨ ਕਿ ਲੋਕ ਇਨ੍ਹਾਂ ਨਾਲ ਕੱਪੜੇ ਅਤੇ ਕੇਸ ਧੋਂਦੇ ਹਨ, ਖਾਂਦੇ ਨਹੀਂ।",
"ਗੁਰੂ ਜੀ ਨੇ ਮੁਸਕਰਾ ਕੇ ਕਿਹਾ, \"ਮਰਦਾਨਿਆ, ਇਸ ਰੁੱਖ ਦਾ ਫਲ ਖਾ ਲੈ।\" ਭਾਈ ਮਰਦਾਨਾ ਹੈਰਾਨ ਹੋਏ, ਪਰ ਉਨ੍ਹਾਂ ਨੂੰ ਗੁਰੂ ਉੱਤੇ ਭਰੋਸਾ ਸੀ। ਉਨ੍ਹਾਂ ਨੇ ਇੱਕ ਰੀਠਾ ਤੋੜਿਆ ਅਤੇ ਦੰਦੀ ਵੱਢੀ।",
"ਕਹਿੰਦੇ ਹਨ ਕਿ ਰੀਠਾ ਸ਼ਹਿਦ ਵਰਗਾ ਮਿੱਠਾ ਸੀ! ਭਾਈ ਮਰਦਾਨੇ ਨੇ ਰੱਜ ਕੇ ਖ਼ੁਸ਼ੀ-ਖ਼ੁਸ਼ੀ ਖਾਧਾ।",
"ਅੱਜ ਉਸ ਥਾਂ ਉੱਤਰਾਖੰਡ ਵਿੱਚ ਗੁਰਦੁਆਰਾ ਰੀਠਾ ਸਾਹਿਬ ਹੈ। ਲੋਕ ਕਹਿੰਦੇ ਹਨ ਕਿ ਉੱਥੋਂ ਦੇ ਰੁੱਖ ਦੇ ਰੀਠੇ ਅੱਜ ਵੀ ਮਿੱਠੇ ਹਨ, ਅਤੇ ਆਉਣ ਵਾਲਿਆਂ ਨੂੰ ਪ੍ਰਸ਼ਾਦ ਵਜੋਂ ਵਰਤਾਏ ਜਾਂਦੇ ਹਨ।"],
l:"ਗੁਰੂ ਉੱਤੇ ਭਰੋਸਾ ਰੱਖੋ, ਭਾਵੇਂ ਹਾਲਾਤ ਔਖੇ ਲੱਗਣ। ਵਾਹਿਗੁਰੂ ਸਹੀ ਰਾਹ ਉੱਤੇ ਚੱਲਣ ਵਾਲਿਆਂ ਦੀ ਸੰਭਾਲ ਕਰਦਾ ਹੈ।"};

PA["duni-chands-needle"]={t:[
"ਲਾਹੌਰ ਵਿੱਚ ਦੁਨੀ ਚੰਦ ਨਾਂ ਦਾ ਇੱਕ ਬਹੁਤ ਅਮੀਰ ਆਦਮੀ ਰਹਿੰਦਾ ਸੀ। ਉਸ ਦੇ ਘਰ ਉੱਤੇ ਬਹੁਤ ਸਾਰੇ ਝੰਡੇ ਲਹਿਰਾਉਂਦੇ ਸਨ। ਹਰ ਝੰਡਾ ਇਹ ਦੱਸਦਾ ਸੀ ਕਿ ਉਸ ਕੋਲ ਇੱਕ ਲੱਖ ਰੁਪਈਆ ਹੋਰ ਹੈ, ਅਤੇ ਉਸ ਨੂੰ ਇਨ੍ਹਾਂ ਉੱਤੇ ਬਹੁਤ ਮਾਣ ਸੀ।",
"ਜਦੋਂ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਲਾਹੌਰ ਆਏ, ਦੁਨੀ ਚੰਦ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਘਰ ਭੋਜਨ ਉੱਤੇ ਸੱਦਿਆ। ਉਸ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਆਪਣਾ ਸਾਰਾ ਧਨ ਵਿਖਾਇਆ ਅਤੇ ਮਾਣ ਨਾਲ ਝੰਡਿਆਂ ਵੱਲ ਇਸ਼ਾਰਾ ਕੀਤਾ।",
"ਗੁਰੂ ਜੀ ਨੇ ਉਸ ਨੂੰ ਸਿਊਣ ਵਾਲੀ ਇੱਕ ਨਿੱਕੀ ਜਿਹੀ ਸੂਈ ਦਿੱਤੀ। \"ਇਹ ਸੂਈ ਮੇਰੇ ਲਈ ਸਾਂਭ ਕੇ ਰੱਖੀਂ,\" ਉਨ੍ਹਾਂ ਕਿਹਾ। \"ਮੈਂ ਇਸ ਜੀਵਨ ਤੋਂ ਬਾਅਦ, ਅਗਲੇ ਜਹਾਨ ਵਿੱਚ ਤੇਰੇ ਤੋਂ ਮੰਗ ਲਵਾਂਗਾ।\"",
"ਦੁਨੀ ਚੰਦ ਸੂਈ ਲੈ ਕੇ ਆਪਣੀ ਪਤਨੀ ਕੋਲ ਗਿਆ। \"ਗੁਰੂ ਜੀ ਚਾਹੁੰਦੇ ਹਨ ਕਿ ਮੈਂ ਮਰਨ ਤੋਂ ਬਾਅਦ ਇਹ ਉਨ੍ਹਾਂ ਨੂੰ ਮੋੜ ਦੇਵਾਂ,\" ਉਸ ਨੇ ਕਿਹਾ। ਪਤਨੀ ਨੇ ਪਿਆਰ ਨਾਲ ਪੁੱਛਿਆ, \"ਮਰਨ ਵੇਲੇ ਤੁਸੀਂ ਸੂਈ ਨਾਲ ਕਿਵੇਂ ਲੈ ਜਾਓਗੇ? ਅਸੀਂ ਤਾਂ ਆਪਣਾ ਸੋਨਾ ਵੀ ਨਾਲ ਨਹੀਂ ਲਿਜਾ ਸਕਦੇ।\"",
"ਦੁਨੀ ਚੰਦ ਭੱਜ ਕੇ ਗੁਰੂ ਜੀ ਕੋਲ ਆਇਆ। \"ਮੈਂ ਇਹ ਸੂਈ ਨਾਲ ਨਹੀਂ ਲਿਜਾ ਸਕਦਾ,\" ਉਸ ਨੇ ਕਿਹਾ। ਗੁਰੂ ਜੀ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, \"ਫਿਰ ਆਪਣਾ ਸਾਰਾ ਧਨ ਕਿਵੇਂ ਲੈ ਜਾਵੇਂਗਾ? ਸਿਰਫ਼ ਕੀਤੀ ਭਲਾਈ ਅਤੇ ਵਾਹਿਗੁਰੂ ਦਾ ਪਿਆਰ ਹੀ ਨਾਲ ਜਾਂਦੇ ਹਨ।\" ਦੁਨੀ ਚੰਦ ਸਮਝ ਗਿਆ। ਉਹ ਆਪਣਾ ਧਨ ਗਰੀਬਾਂ ਨਾਲ ਵੰਡਣ ਅਤੇ ਰੱਬ ਨੂੰ ਯਾਦ ਕਰਨ ਲੱਗਾ।"],
l:"ਅਸੀਂ ਧਨ-ਦੌਲਤ ਨਾਲ ਨਹੀਂ ਲਿਜਾ ਸਕਦੇ। ਜੋ ਅਸੀਂ ਵੰਡਦੇ ਹਾਂ, ਅਤੇ ਜੋ ਭਲਾਈ ਕਰਦੇ ਹਾਂ, ਉਹੀ ਸਭ ਤੋਂ ਵੱਧ ਮਹੱਤਵ ਰੱਖਦੀ ਹੈ।"};

PA["sajjan-thag"]={t:[
"ਮੁਲਤਾਨ ਦੇ ਨੇੜੇ ਤੁਲੰਬਾ ਨਗਰ ਵਿੱਚ ਸੱਜਣ ਨਾਂ ਦਾ ਇੱਕ ਆਦਮੀ ਰਹਿੰਦਾ ਸੀ। ਉਸ ਦੇ ਨਾਂ ਦਾ ਅਰਥ ਹੈ 'ਮਿੱਤਰ', ਅਤੇ ਉਹ ਬਹੁਤ ਭਲਾ ਲੱਗਦਾ ਸੀ। ਉਸ ਨੇ ਹਿੰਦੂਆਂ ਲਈ ਮੰਦਰ ਅਤੇ ਮੁਸਲਮਾਨਾਂ ਲਈ ਮਸੀਤ ਬਣਾਈ ਸੀ, ਅਤੇ ਇੱਕ ਸਰਾਂ ਜਿੱਥੇ ਮੁਸਾਫ਼ਰ ਮੁਫ਼ਤ ਆਰਾਮ ਕਰ ਸਕਦੇ ਸਨ।",
"ਪਰ ਸੱਜਣ ਦਾ ਇੱਕ ਭਿਆਨਕ ਭੇਤ ਸੀ। ਰਾਤ ਨੂੰ ਉਹ ਆਪਣੀ ਸਰਾਂ ਵਿੱਚ ਠਹਿਰੇ ਮੁਸਾਫ਼ਰਾਂ ਨੂੰ ਲੁੱਟ ਲੈਂਦਾ, ਅਤੇ ਉਹ ਫਿਰ ਕਦੇ ਨਜ਼ਰ ਨਾ ਆਉਂਦੇ। ਇਸ ਲਈ ਲੋਕ ਉਸ ਨੂੰ ਚੋਰੀ-ਚੋਰੀ ਸੱਜਣ ਠੱਗ ਕਹਿੰਦੇ ਸਨ।",
"ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਅਤੇ ਭਾਈ ਮਰਦਾਨਾ ਇਸ ਸਰਾਂ ਵਿੱਚ ਰੁਕੇ। ਸੱਜਣ ਨੇ ਵੇਖਿਆ ਕਿ ਗੁਰੂ ਜੀ ਦਾ ਚਿਹਰਾ ਸ਼ਾਂਤੀ ਨਾਲ ਦਮਕ ਰਿਹਾ ਹੈ, ਅਤੇ ਸੋਚਿਆ ਕਿ ਇਨ੍ਹਾਂ ਕੋਲ ਜ਼ਰੂਰ ਕੋਈ ਕੀਮਤੀ ਚੀਜ਼ ਹੋਵੇਗੀ। ਉਹ ਰਾਤ ਦੀ ਉਡੀਕ ਕਰਨ ਲੱਗਾ।",
"ਜਦੋਂ ਰਾਤ ਹੋਈ, ਗੁਰੂ ਜੀ ਨੇ ਇੱਕ ਸ਼ਬਦ ਗਾਉਣਾ ਸ਼ੁਰੂ ਕੀਤਾ: 'ਉਜਲੁ ਕੈਹਾ ਚਿਲਕਣਾ ਘੋਟਿਮ ਕਾਲੜੀ ਮਸੁ ॥' (ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ, ਅੰਗ 729)। ਇਸ ਵਿੱਚ ਦੱਸਿਆ ਗਿਆ ਕਿ ਕੈਂਹ ਬਹੁਤ ਚਮਕਦਾ ਹੈ, ਪਰ ਘਸਾਉਣ ਨਾਲ ਉਸ ਦੀ ਕਾਲਖ ਦਿਸ ਪੈਂਦੀ ਹੈ। ਬਾਹਰੋਂ ਧੋਣ ਨਾਲ ਅੰਦਰ ਸਾਫ਼ ਨਹੀਂ ਹੁੰਦਾ। ਸੱਚਾ ਸੱਜਣ ਉਹ ਹੈ ਜੋ ਅੰਤ ਤੱਕ ਸਾਥ ਨਿਭਾਵੇ।",
"ਸੱਜਣ ਨੇ ਹਰ ਸ਼ਬਦ ਸੁਣਿਆ। ਉਸ ਨੂੰ ਲੱਗਾ ਜਿਵੇਂ ਸ਼ਬਦ ਉਸੇ ਬਾਰੇ ਹੋਵੇ। ਉਹ ਗੁਰੂ ਜੀ ਦੇ ਚਰਨਾਂ ਉੱਤੇ ਡਿੱਗ ਪਿਆ, ਰੋਇਆ, ਅਤੇ ਮਾਫ਼ੀ ਮੰਗੀ। ਗੁਰੂ ਜੀ ਨੇ ਉਸ ਨੂੰ ਲੁੱਟਿਆ ਮਾਲ ਮੋੜਨ ਅਤੇ ਆਪਣਾ ਜੀਵਨ ਦੂਜਿਆਂ ਦੀ ਮਦਦ ਵਿੱਚ ਲਾਉਣ ਲਈ ਕਿਹਾ। ਸੱਜਣ ਨੇ ਇਉਂ ਹੀ ਕੀਤਾ, ਅਤੇ ਉਸ ਦੀ ਸਰਾਂ ਪਹਿਲੀਆਂ ਧਰਮਸਾਲਾਂ ਵਿੱਚੋਂ ਇੱਕ ਬਣ ਗਈ, ਜਿੱਥੇ ਹਰ ਕਿਸੇ ਦਾ ਸੱਚਮੁੱਚ ਸੁਆਗਤ ਹੁੰਦਾ ਸੀ।"],
l:"ਸਿਰਫ਼ ਬਾਹਰੋਂ ਚੰਗੇ ਦਿਸਣਾ ਕਾਫ਼ੀ ਨਹੀਂ। ਸਾਨੂੰ ਅੰਦਰੋਂ ਵੀ ਈਮਾਨਦਾਰ ਅਤੇ ਦਇਆਵਾਨ ਹੋਣਾ ਚਾਹੀਦਾ ਹੈ।"};

PA["panja-sahib"]={t:[
"ਗਰਮੀਆਂ ਦੇ ਇੱਕ ਤਪਦੇ ਦਿਨ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਅਤੇ ਭਾਈ ਮਰਦਾਨਾ ਹਸਨ ਅਬਦਾਲ ਪਹੁੰਚੇ, ਜੋ ਹੁਣ ਪਾਕਿਸਤਾਨ ਵਿੱਚ ਹੈ। ਭਾਈ ਮਰਦਾਨੇ ਨੂੰ ਬਹੁਤ ਪਿਆਸ ਲੱਗੀ, ਪਰ ਪਾਣੀ ਦਾ ਇੱਕੋ-ਇੱਕ ਚਸ਼ਮਾ ਪਹਾੜੀ ਦੀ ਚੋਟੀ ਉੱਤੇ ਸੀ, ਜਿੱਥੇ ਵਲੀ ਕੰਧਾਰੀ ਨਾਂ ਦਾ ਇੱਕ ਫ਼ਕੀਰ ਰਹਿੰਦਾ ਸੀ।",
"ਭਾਈ ਮਰਦਾਨਾ ਉੱਪਰ ਚੜ੍ਹੇ ਅਤੇ ਪਾਣੀ ਮੰਗਿਆ। ਵਲੀ ਕੰਧਾਰੀ ਨੇ ਨਾਂਹ ਕਰ ਦਿੱਤੀ। \"ਜੇ ਤੇਰਾ ਗੁਰੂ ਇੰਨਾ ਵੱਡਾ ਹੈ, ਤਾਂ ਉਹੀ ਤੈਨੂੰ ਪਾਣੀ ਦੇਵੇ,\" ਉਸ ਨੇ ਕਿਹਾ। ਭਾਈ ਮਰਦਾਨਾ ਹੇਠਾਂ ਉੱਤਰ ਆਏ। ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਵਾਰ-ਵਾਰ ਉੱਪਰ ਭੇਜਿਆ, ਪਰ ਹਰ ਵਾਰ ਵਲੀ ਕੰਧਾਰੀ ਨੇ ਨਾਂਹ ਕਰ ਦਿੱਤੀ।",
"ਗੁਰੂ ਜੀ ਨੇ ਮੁਸਕਰਾ ਕੇ ਭਾਈ ਮਰਦਾਨੇ ਨੂੰ ਨੇੜਿਓਂ ਜ਼ਮੀਨ ਤੋਂ ਇੱਕ ਪੱਥਰ ਚੁੱਕਣ ਲਈ ਕਿਹਾ। ਜਦੋਂ ਉਨ੍ਹਾਂ ਨੇ ਚੁੱਕਿਆ, ਠੰਢਾ, ਨਿਰਮਲ ਪਾਣੀ ਫੁੱਟ ਪਿਆ। ਕਹਿੰਦੇ ਹਨ ਕਿ ਉਸੇ ਪਲ ਵਲੀ ਕੰਧਾਰੀ ਦਾ ਚਸ਼ਮਾ ਸੁੱਕਣ ਲੱਗ ਪਿਆ।",
"ਵਲੀ ਕੰਧਾਰੀ ਨੂੰ ਗੁੱਸਾ ਆ ਗਿਆ। ਉਸ ਨੇ ਪਹਾੜੀ ਤੋਂ ਇੱਕ ਵੱਡੀ ਚੱਟਾਨ ਗੁਰੂ ਜੀ ਵੱਲ ਰੇੜ੍ਹ ਦਿੱਤੀ। ਜਦੋਂ ਉਹ ਨੇੜੇ ਆਈ, ਗੁਰੂ ਜੀ ਨੇ ਸ਼ਾਂਤੀ ਨਾਲ ਆਪਣਾ ਹੱਥ ਉੱਚਾ ਕਰਕੇ ਚੱਟਾਨ ਰੋਕ ਲਈ। ਕਹਿੰਦੇ ਹਨ ਕਿ ਉਨ੍ਹਾਂ ਦੇ ਹੱਥ ਦਾ ਨਿਸ਼ਾਨ ਪੱਥਰ ਵਿੱਚ ਉੱਕਰਿਆ ਗਿਆ।",
"ਵਲੀ ਕੰਧਾਰੀ ਨੂੰ ਆਪਣੀ ਭੁੱਲ ਦਾ ਅਹਿਸਾਸ ਹੋਇਆ ਅਤੇ ਉਹ ਮਾਫ਼ੀ ਮੰਗਣ ਹੇਠਾਂ ਆਇਆ। ਅੱਜ ਉੱਥੇ ਗੁਰਦੁਆਰਾ ਪੰਜਾ ਸਾਹਿਬ ਹੈ। ਇਸ ਦੇ ਨਾਂ ਦਾ ਅਰਥ ਹੈ 'ਹੱਥ ਦਾ ਪੰਜਾ', ਅਤੇ ਪਾਣੀ ਦਾ ਚਸ਼ਮਾ ਅੱਜ ਵੀ ਚੱਟਾਨ ਦੇ ਕੋਲ ਵਗਦਾ ਹੈ।"],
l:"ਦਇਆ ਵਾਂਗ ਪਾਣੀ ਵੀ ਸਭ ਨਾਲ ਵੰਡਣਾ ਚਾਹੀਦਾ ਹੈ। ਸ਼ਾਂਤੀ ਅਤੇ ਸਬਰ ਗੁੱਸੇ ਨਾਲੋਂ ਤਾਕਤਵਰ ਹਨ।"};

PA["water-to-the-west"]={t:[
"ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਗੰਗਾ ਕੰਢੇ ਵੱਸੇ ਪਵਿੱਤਰ ਸ਼ਹਿਰ ਹਰਿਦੁਆਰ ਗਏ। ਸਵੇਰੇ-ਸਵੇਰੇ ਬਹੁਤ ਲੋਕ ਦਰਿਆ ਵਿੱਚ ਖੜ੍ਹੇ ਹੋ ਕੇ ਪੂਰਬ ਵਿੱਚ ਚੜ੍ਹਦੇ ਸੂਰਜ ਵੱਲ ਬੁੱਕਾਂ ਭਰ-ਭਰ ਪਾਣੀ ਸੁੱਟ ਰਹੇ ਸਨ, ਆਪਣੇ ਪਿੱਤਰਾਂ ਨੂੰ ਭੇਟ ਵਜੋਂ।",
"ਗੁਰੂ ਜੀ ਵੀ ਦਰਿਆ ਵਿੱਚ ਉੱਤਰੇ, ਪਰ ਪੱਛਮ ਵੱਲ ਮੂੰਹ ਕਰਕੇ ਉਸ ਪਾਸੇ ਪਾਣੀ ਸੁੱਟਣ ਲੱਗੇ।",
"ਲੋਕ ਹੈਰਾਨ ਰਹਿ ਗਏ। \"ਤੁਸੀਂ ਇਹ ਕੀ ਕਰ ਰਹੇ ਹੋ?\" ਉਨ੍ਹਾਂ ਪੁੱਛਿਆ। \"ਤੁਹਾਡਾ ਮੂੰਹ ਗ਼ਲਤ ਪਾਸੇ ਹੈ!\"",
"ਗੁਰੂ ਜੀ ਮੁਸਕਰਾਏ। \"ਪੱਛਮ ਵੱਲ ਪੰਜਾਬ ਵਿੱਚ ਮੇਰੇ ਖੇਤ ਸੁੱਕੇ ਪਏ ਹਨ। ਮੈਂ ਉਨ੍ਹਾਂ ਨੂੰ ਪਾਣੀ ਭੇਜ ਰਿਹਾ ਹਾਂ।\" ਲੋਕ ਹੱਸ ਪਏ। \"ਸੈਂਕੜੇ ਮੀਲ ਦੂਰ ਤੁਹਾਡੇ ਖੇਤਾਂ ਤੱਕ ਪਾਣੀ ਕਿਵੇਂ ਪਹੁੰਚੇਗਾ?\"",
"ਗੁਰੂ ਜੀ ਨੇ ਨਰਮੀ ਨਾਲ ਜਵਾਬ ਦਿੱਤਾ, \"ਜੇ ਮੇਰਾ ਪਾਣੀ ਪੰਜਾਬ ਵਿੱਚ ਮੇਰੇ ਖੇਤਾਂ ਤੱਕ ਨਹੀਂ ਪਹੁੰਚ ਸਕਦਾ, ਤਾਂ ਤੁਹਾਡਾ ਪਾਣੀ ਇਸ ਤੋਂ ਕਿਤੇ ਦੂਰ ਸੂਰਜ ਜਾਂ ਤੁਹਾਡੇ ਪਿੱਤਰਾਂ ਤੱਕ ਕਿਵੇਂ ਪਹੁੰਚੇਗਾ?\" ਲੋਕ ਚੁੱਪ ਹੋ ਗਏ ਅਤੇ ਉਨ੍ਹਾਂ ਦੇ ਬਚਨਾਂ ਬਾਰੇ ਸੋਚਣ ਲੱਗੇ। ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਸਿਖਾਇਆ ਕਿ ਪਿਆਰ ਨਾਲ ਰੱਬ ਨੂੰ ਯਾਦ ਕਰਨਾ ਅਤੇ ਚੰਗੇ ਕੰਮ ਕਰਨਾ ਕਿਸੇ ਦਿਸ਼ਾ ਵੱਲ ਮੂੰਹ ਕਰਨ ਨਾਲੋਂ ਵੱਧ ਮਹੱਤਵ ਰੱਖਦਾ ਹੈ।"],
l:"ਇਹ ਸਮਝਣਾ ਜ਼ਰੂਰੀ ਹੈ ਕਿ ਅਸੀਂ ਕੋਈ ਕੰਮ ਕਿਉਂ ਕਰਦੇ ਹਾਂ, ਸਿਰਫ਼ ਇਸ ਲਈ ਨਹੀਂ ਕਰਨਾ ਕਿ ਹੋਰ ਸਭ ਕਰਦੇ ਹਨ।"};

PA["feet-towards-makkah"]={t:[
"ਆਪਣੀ ਇੱਕ ਲੰਮੀ ਯਾਤਰਾ ਦੌਰਾਨ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਭਾਈ ਮਰਦਾਨੇ ਨਾਲ ਇਸਲਾਮ ਦੇ ਸਭ ਤੋਂ ਪਵਿੱਤਰ ਸ਼ਹਿਰ ਮੱਕੇ ਤੱਕ ਗਏ। ਉਨ੍ਹਾਂ ਨੇ ਹਾਜੀਆਂ ਵਾਲਾ ਨੀਲਾ ਬਾਣਾ ਪਹਿਨਿਆ ਹੋਇਆ ਸੀ।",
"ਲੰਮੇ ਸਫ਼ਰ ਤੋਂ ਥੱਕ ਕੇ ਗੁਰੂ ਜੀ ਆਰਾਮ ਕਰਨ ਲਈ ਲੇਟ ਗਏ, ਅਤੇ ਉਨ੍ਹਾਂ ਦੇ ਪੈਰ ਕਾਬੇ, ਭਾਵ ਪਵਿੱਤਰ ਇਬਾਦਤਗਾਹ, ਵੱਲ ਸਨ।",
"ਜੀਵਨ ਨਾਂ ਦੇ ਇੱਕ ਸੇਵਾਦਾਰ ਨੇ ਇਹ ਵੇਖਿਆ ਅਤੇ ਨਾਰਾਜ਼ ਹੋ ਗਿਆ। ਉਸ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਜਗਾਇਆ ਅਤੇ ਕਿਹਾ, \"ਤੂੰ ਕੌਣ ਹੈਂ, ਜੋ ਰੱਬ ਦੇ ਘਰ ਵੱਲ ਪੈਰ ਕਰਕੇ ਲੇਟਿਆ ਹੈਂ?\"",
"ਗੁਰੂ ਜੀ ਨੇ ਸ਼ਾਂਤੀ ਨਾਲ ਜਵਾਬ ਦਿੱਤਾ, \"ਭਾਈ, ਮੈਂ ਥੱਕਿਆ ਹੋਇਆ ਹਾਂ। ਮੇਰੇ ਪੈਰ ਉਸ ਪਾਸੇ ਕਰ ਦੇ ਜਿੱਧਰ ਰੱਬ ਨਹੀਂ ਹੈ।\"",
"ਕਹਿੰਦੇ ਹਨ ਕਿ ਜੀਵਨ ਨੇ ਗੁਰੂ ਜੀ ਦੇ ਪੈਰ ਜਿੱਧਰ ਵੀ ਘੁਮਾਏ, ਪਵਿੱਤਰ ਘਰ ਵੀ ਉੱਧਰ ਹੀ ਦਿਸਿਆ। ਜੀਵਨ ਸਮਝ ਗਿਆ ਕਿ ਗੁਰੂ ਜੀ ਦਾ ਕੀ ਭਾਵ ਸੀ: ਰੱਬ ਹਰ ਥਾਂ, ਹਰ ਦਿਸ਼ਾ ਵਿੱਚ ਹੈ। ਉੱਥੇ ਇਕੱਠੇ ਹੋਏ ਲੋਕਾਂ ਨੇ ਗੁਰੂ ਜੀ ਦਾ ਉਪਦੇਸ਼ ਸੁਣਿਆ, ਅਤੇ ਬਹੁਤੇ ਉਨ੍ਹਾਂ ਦਾ ਡੂੰਘਾ ਸਤਿਕਾਰ ਕਰਨ ਲੱਗੇ।"],
l:"ਰੱਬ ਹਰ ਥਾਂ ਹੈ। ਹਰ ਥਾਂ ਅਤੇ ਹਰ ਦਿਸ਼ਾ ਉਸ ਇੱਕ ਕਰਤਾਰ ਦੀ ਹੈ।"};

PA["two-villages"]={t:[
"ਆਪਣੀਆਂ ਯਾਤਰਾਵਾਂ ਦੌਰਾਨ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਅਤੇ ਭਾਈ ਮਰਦਾਨਾ ਇੱਕ ਅਜਿਹੇ ਪਿੰਡ ਆਏ ਜਿੱਥੋਂ ਦੇ ਲੋਕ ਰੁੱਖੇ ਸਨ। ਉਨ੍ਹਾਂ ਨੇ ਮੁਸਾਫ਼ਰਾਂ ਨੂੰ ਨਾ ਭੋਜਨ ਦਿੱਤਾ ਨਾ ਆਰਾਮ ਲਈ ਥਾਂ, ਅਤੇ ਉਨ੍ਹਾਂ ਦਾ ਮਜ਼ਾਕ ਉਡਾਇਆ।",
"ਜਾਂਦਿਆਂ ਗੁਰੂ ਜੀ ਨੇ ਹੱਥ ਚੁੱਕ ਕੇ ਉਨ੍ਹਾਂ ਨੂੰ ਅਸੀਸ ਦਿੱਤੀ: \"ਵੱਸਦੇ ਰਹੋ, ਇਸੇ ਪਿੰਡ ਵਿੱਚ।\"",
"ਅਗਲੇ ਪਿੰਡ ਦੇ ਲੋਕ ਦਇਆਵਾਨ ਅਤੇ ਖੁੱਲ੍ਹੇ ਦਿਲ ਵਾਲੇ ਸਨ। ਉਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਜੀ ਦਾ ਸੁਆਗਤ ਕੀਤਾ, ਭੋਜਨ ਛਕਾਇਆ, ਅਤੇ ਪਿਆਰ ਨਾਲ ਉਨ੍ਹਾਂ ਦੇ ਬਚਨ ਸੁਣੇ। ਜਾਂਦਿਆਂ ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ: \"ਉੱਜੜ ਜਾਓ, ਦੂਰ-ਦੂਰ ਖਿੰਡ ਜਾਓ।\"",
"ਭਾਈ ਮਰਦਾਨਾ ਹੈਰਾਨ ਹੋਏ। \"ਗੁਰੂ ਜੀ, ਤੁਸੀਂ ਰੁੱਖੇ ਲੋਕਾਂ ਨੂੰ ਇਕੱਠੇ ਵੱਸਣ ਦੀ ਅਸੀਸ ਦਿੱਤੀ, ਅਤੇ ਭਲੇ ਲੋਕਾਂ ਨੂੰ ਉੱਜੜਨ ਲਈ ਕਿਹਾ। ਕੀ ਇਹ ਉਲਟ ਨਹੀਂ ਹੋਣਾ ਚਾਹੀਦਾ ਸੀ?\"",
"ਗੁਰੂ ਜੀ ਨੇ ਸਮਝਾਇਆ, \"ਜੇ ਰੁੱਖੇ ਲੋਕ ਇੱਕੋ ਥਾਂ ਰਹਿਣ, ਤਾਂ ਉਨ੍ਹਾਂ ਦੀ ਬੁਰਾਈ ਨਹੀਂ ਫੈਲੇਗੀ। ਪਰ ਜੇ ਭਲੇ ਲੋਕ ਹਰ ਥਾਂ ਜਾਣ, ਤਾਂ ਉਹ ਜਿੱਥੇ ਵੀ ਰਹਿਣਗੇ, ਦਇਆ ਅਤੇ ਚੰਗੇ ਗੁਣ ਨਾਲ ਲੈ ਜਾਣਗੇ, ਹਵਾ ਨਾਲ ਉੱਡਦੇ ਬੀਜਾਂ ਵਾਂਗ।\""],
l:"ਚੰਗਿਆਈ ਫੈਲਾਉਣ ਲਈ ਹੁੰਦੀ ਹੈ। ਅਸੀਂ ਜਿੱਥੇ ਵੀ ਜਾਈਏ, ਦਇਆ ਨਾਲ ਲੈ ਕੇ ਜਾ ਸਕਦੇ ਹਾਂ।"};

PA["mata-khivi"]={t:[
"ਮਾਤਾ ਖੀਵੀ ਜੀ ਦੂਜੇ ਗੁਰੂ, ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ, ਦੇ ਮਹਿਲ ਸਨ। ਖਡੂਰ ਸਾਹਿਬ ਵਿੱਚ ਹਰ ਰੋਜ਼ ਬਹੁਤ ਲੋਕ ਗੁਰੂ ਜੀ ਦਾ ਉਪਦੇਸ਼ ਸੁਣਨ ਆਉਂਦੇ, ਅਤੇ ਮਾਤਾ ਖੀਵੀ ਜੀ ਨੇ ਲੰਗਰ ਦੀ ਸੇਵਾ ਸੰਭਾਲੀ ਹੋਈ ਸੀ।",
"ਉਹ ਧਿਆਨ ਰੱਖਦੇ ਕਿ ਆਉਣ ਵਾਲਾ ਹਰ ਕੋਈ ਭੋਜਨ ਛਕੇ, ਭਾਵੇਂ ਅਮੀਰ ਹੋਵੇ ਜਾਂ ਗਰੀਬ, ਕਿਸੇ ਵੀ ਜਾਤ ਦਾ, ਸਿੱਖ ਹੋਵੇ ਜਾਂ ਨਾ। ਕਿਸੇ ਨੂੰ ਖਾਲੀ ਹੱਥ ਨਹੀਂ ਮੋੜਿਆ ਜਾਂਦਾ ਸੀ। ਉਹ ਘਿਉ ਵਾਲੀ, ਸੰਘਣੀ ਖੀਰ ਬਣਾਉਣ ਲਈ ਮਸ਼ਹੂਰ ਸਨ, ਤਾਂ ਜੋ ਸਭ ਤੋਂ ਗਰੀਬ ਮਹਿਮਾਨ ਵੀ ਉਹ ਭੋਜਨ ਛਕ ਸਕੇ ਜੋ ਆਮ ਤੌਰ ਤੇ ਖ਼ਾਸ ਦਿਨਾਂ ਲਈ ਹੁੰਦਾ ਸੀ।",
"ਮਾਤਾ ਖੀਵੀ ਜੀ ਸਿਰਫ਼ ਭੋਜਨ ਹੀ ਨਹੀਂ ਬਣਾਉਂਦੇ ਸਨ। ਉਹ ਹਰ ਇੱਕ ਨੂੰ ਪਿਆਰ ਨਾਲ ਮਿਲਦੇ ਅਤੇ ਉਸ ਨੂੰ ਘਰ ਵਰਗਾ ਮਹਿਸੂਸ ਕਰਾਉਂਦੇ। ਉਨ੍ਹਾਂ ਦੀ ਦੇਖ-ਰੇਖ ਹੇਠ ਲੰਗਰ ਇੱਕ ਅਜਿਹੀ ਥਾਂ ਬਣ ਗਿਆ ਜਿੱਥੇ ਲੋਕਾਂ ਨੇ ਸਿੱਖਿਆ ਕਿ ਸਾਰੇ ਮਨੁੱਖ ਬਰਾਬਰ ਹਨ।",
"ਉਨ੍ਹਾਂ ਦੀ ਸੇਵਾ ਇੰਨੀ ਪਿਆਰੀ ਹੈ ਕਿ ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਜੀ ਵਿੱਚ ਉਨ੍ਹਾਂ ਦੀ ਸਿਫ਼ਤ ਕੀਤੀ ਗਈ ਹੈ। ਆਪਣੀ ਵਾਰ ਵਿੱਚ ਰਬਾਬੀ ਸੱਤਾ ਅਤੇ ਬਲਵੰਡ ਨੇ ਲਿਖਿਆ: 'ਬਲਵੰਡ ਖੀਵੀ ਨੇਕ ਜਨ ਜਿਸੁ ਬਹੁਤੀ ਛਾਉ ਪਤ੍ਰਾਲੀ ॥' ਭਾਵ ਮਾਤਾ ਖੀਵੀ ਜੀ ਦੀ ਦੇਖ-ਰੇਖ ਹੇਠ ਲੰਗਰ ਸੰਘਣੇ ਪੱਤਿਆਂ ਵਾਲੀ ਠੰਢੀ ਛਾਂ ਵਰਗਾ ਸੀ, ਜਿੱਥੇ ਹਰ ਕਿਸੇ ਨੂੰ ਸੁਖ ਮਿਲਦਾ (ਅੰਗ 967)। ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਜੀ ਵਿੱਚ ਇਸ ਤਰ੍ਹਾਂ ਨਾਂ ਲੈ ਕੇ ਸਲਾਹੀ ਗਈ ਉਹ ਇਕੱਲੀ ਇਸਤਰੀ ਹਨ।"],
l:"ਪਿਆਰ ਨਾਲ ਕੀਤੀ ਸੇਵਾ ਹਰ ਕਿਸੇ ਨੂੰ ਬਰਾਬਰ ਅਤੇ ਜੀ ਆਇਆਂ ਮਹਿਸੂਸ ਕਰਾਉਂਦੀ ਹੈ।"};

PA["akbar-pangat"]={t:[
"ਤੀਜੇ ਗੁਰੂ, ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ, ਗੋਇੰਦਵਾਲ ਰਹਿੰਦੇ ਸਨ। ਉਨ੍ਹਾਂ ਨੇ ਇੱਕ ਮਰਯਾਦਾ ਬਣਾਈ: \"ਪਹਿਲੇ ਪੰਗਤ, ਪਾਛੇ ਸੰਗਤ।\" ਭਾਵ ਪਹਿਲਾਂ ਪੰਗਤ ਵਿੱਚ ਬੈਠੋ, ਫਿਰ ਸੰਗਤ ਵਿੱਚ ਆਓ। ਜੋ ਵੀ ਉਨ੍ਹਾਂ ਨੂੰ ਮਿਲਣਾ ਚਾਹੁੰਦਾ, ਉਸ ਨੂੰ ਪਹਿਲਾਂ ਸਭ ਦੇ ਨਾਲ ਕਤਾਰਾਂ ਵਿੱਚ ਜ਼ਮੀਨ ਉੱਤੇ ਬੈਠ ਕੇ ਲੰਗਰ ਛਕਣਾ ਪੈਂਦਾ।",
"ਇੱਕ ਦਿਨ ਦੁਨੀਆ ਦੇ ਸਭ ਤੋਂ ਤਾਕਤਵਰ ਹਾਕਮਾਂ ਵਿੱਚੋਂ ਇੱਕ, ਮੁਗ਼ਲ ਬਾਦਸ਼ਾਹ ਅਕਬਰ, ਗੁਰੂ ਜੀ ਨੂੰ ਮਿਲਣ ਆਇਆ। ਉਸ ਦੇ ਨੌਕਰ ਖ਼ਾਸ ਸਲੂਕ ਦੀ ਆਸ ਕਰਦੇ ਸਨ। ਪਰ ਸਿੱਖਾਂ ਨੇ ਅਦਬ ਨਾਲ ਉਸ ਨੂੰ ਗੁਰੂ ਘਰ ਦੀ ਮਰਯਾਦਾ ਦੱਸੀ।",
"ਅਕਬਰ ਨੂੰ ਗੁੱਸਾ ਨਹੀਂ ਆਇਆ। ਉਹ ਕਿਸਾਨਾਂ, ਮਜ਼ਦੂਰਾਂ ਅਤੇ ਮੁਸਾਫ਼ਰਾਂ ਦੇ ਨਾਲ ਜ਼ਮੀਨ ਉੱਤੇ ਬੈਠ ਗਿਆ, ਅਤੇ ਉਨ੍ਹਾਂ ਵਾਲਾ ਹੀ ਸਾਦਾ ਭੋਜਨ ਛਕਿਆ। ਉਹ ਇਸ ਗੱਲ ਤੋਂ ਬਹੁਤ ਪ੍ਰਭਾਵਿਤ ਹੋਇਆ ਕਿ ਰਾਜੇ ਅਤੇ ਗਰੀਬ ਨਾਲ ਬਿਲਕੁਲ ਇੱਕੋ ਜਿਹਾ ਸਲੂਕ ਹੁੰਦਾ ਹੈ।",
"ਬਾਅਦ ਵਿੱਚ ਅਕਬਰ ਗੁਰੂ ਜੀ ਨੂੰ ਮਿਲਿਆ ਅਤੇ ਲੰਗਰ ਲਈ ਜ਼ਮੀਨ ਅਤੇ ਧਨ ਭੇਟ ਕਰਨਾ ਚਾਹਿਆ। ਗੁਰੂ ਜੀ ਨੇ ਨਿਮਰਤਾ ਨਾਲ ਨਾਂਹ ਕਰ ਦਿੱਤੀ। ਉਨ੍ਹਾਂ ਨੇ ਸਮਝਾਇਆ ਕਿ ਲੰਗਰ ਸੰਗਤ ਦੀ ਭੇਟਾ ਅਤੇ ਸੇਵਾ ਨਾਲ ਚੱਲਣਾ ਚਾਹੀਦਾ ਹੈ, ਕਿਸੇ ਬਾਦਸ਼ਾਹ ਦੇ ਦਾਨ ਨਾਲ ਨਹੀਂ।"],
l:"ਗੁਰੂ ਘਰ ਵਿੱਚ ਸਭ ਬਰਾਬਰ ਹਨ। ਕੋਈ ਵੀ ਇੰਨਾ ਵੱਡਾ ਨਹੀਂ ਕਿ ਦੂਜਿਆਂ ਨਾਲ ਜ਼ਮੀਨ ਉੱਤੇ ਨਾ ਬੈਠ ਸਕੇ।"};

PA["bibi-bhani"]={t:[
"ਬੀਬੀ ਭਾਨੀ ਜੀ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਦੀ ਛੋਟੀ ਸਪੁੱਤਰੀ ਸਨ। ਉਹ ਹਰ ਰੋਜ਼ ਬੜੇ ਪਿਆਰ ਨਾਲ ਪਿਤਾ ਜੀ ਦੀ ਸੇਵਾ ਕਰਦੇ, ਅਤੇ ਬਾਅਦ ਵਿੱਚ ਉਨ੍ਹਾਂ ਦਾ ਵਿਆਹ ਭਾਈ ਜੇਠਾ ਜੀ ਨਾਲ ਹੋਇਆ, ਜੋ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਬਣੇ।",
"ਇੱਕ ਸਵੇਰੇ-ਸਵੇਰੇ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਲੱਕੜ ਦੀ ਇੱਕ ਛੋਟੀ ਚੌਂਕੀ ਉੱਤੇ ਡੂੰਘੇ ਸਿਮਰਨ ਵਿੱਚ ਬੈਠੇ ਸਨ। ਬੀਬੀ ਭਾਨੀ ਜੀ ਨੇ ਵੇਖਿਆ ਕਿ ਚੌਂਕੀ ਦਾ ਇੱਕ ਪਾਵਾ ਟੁੱਟ ਗਿਆ ਹੈ, ਅਤੇ ਚੌਂਕੀ ਝੁਕਣ ਲੱਗੀ ਹੈ।",
"ਉਹ ਪਿਤਾ ਜੀ ਦਾ ਧਿਆਨ ਭੰਗ ਨਹੀਂ ਕਰਨਾ ਚਾਹੁੰਦੇ ਸਨ। ਇਸ ਲਈ ਉਨ੍ਹਾਂ ਨੇ ਚੁੱਪ-ਚਾਪ ਗੋਡਿਆਂ ਭਾਰ ਬੈਠ ਕੇ ਆਪਣੇ ਹੱਥ ਨਾਲ ਚੌਂਕੀ ਦਾ ਕੋਨਾ ਥੰਮ੍ਹ ਲਿਆ, ਅਤੇ ਉਸ ਨੂੰ ਟਿਕਾਈ ਰੱਖਿਆ। ਉਹ ਬਹੁਤ ਦੇਰ ਇਉਂ ਹੀ ਰਹੇ, ਭਾਵੇਂ ਟੁੱਟੀ ਲੱਕੜ ਨਾਲ ਉਨ੍ਹਾਂ ਦਾ ਹੱਥ ਜ਼ਖ਼ਮੀ ਹੋ ਗਿਆ।",
"ਜਦੋਂ ਗੁਰੂ ਜੀ ਨੇ ਅੱਖਾਂ ਖੋਲ੍ਹੀਆਂ, ਉਨ੍ਹਾਂ ਨੇ ਵੇਖਿਆ ਕਿ ਬੀਬੀ ਜੀ ਨੇ ਕੀ ਕੀਤਾ ਹੈ ਅਤੇ ਉਨ੍ਹਾਂ ਦਾ ਜ਼ਖ਼ਮੀ ਹੱਥ ਵੇਖਿਆ। ਉਨ੍ਹਾਂ ਦਾ ਦਿਲ ਭਰ ਆਇਆ। \"ਜੋ ਚਾਹੋ ਮੰਗ ਲਓ,\" ਉਨ੍ਹਾਂ ਕਿਹਾ।",
"ਬੀਬੀ ਭਾਨੀ ਜੀ ਨੇ ਮੰਗਿਆ ਕਿ ਗੁਰੂ ਜੋਤ ਸਦਾ ਉਨ੍ਹਾਂ ਦੇ ਪਰਿਵਾਰ ਵਿੱਚ ਰਹੇ। ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਦੀ ਇੱਛਾ ਪੂਰੀ ਕੀਤੀ, ਪਰ ਨਾਲ ਹੀ ਦੱਸਿਆ ਕਿ ਇਸ ਨਾਲ ਵੱਡੀਆਂ ਪਰਖਾਂ ਅਤੇ ਕੁਰਬਾਨੀਆਂ ਵੀ ਆਉਣਗੀਆਂ। ਉਨ੍ਹਾਂ ਦੇ ਪੁੱਤਰ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਬਣੇ, ਅਤੇ ਉਨ੍ਹਾਂ ਤੋਂ ਬਾਅਦ ਦੇ ਸਾਰੇ ਗੁਰੂ ਸਾਹਿਬਾਨ ਉਨ੍ਹਾਂ ਦੇ ਪਰਿਵਾਰ ਵਿੱਚੋਂ ਹੋਏ।"],
l:"ਬਿਨਾਂ ਕਹੇ, ਚੁੱਪ-ਚਾਪ ਪਿਆਰ ਨਾਲ ਕੀਤੀ ਸੇਵਾ ਅਨਮੋਲ ਹੈ। ਸੱਚਾ ਪਿਆਰ ਪਹਿਲਾਂ ਦੂਜਿਆਂ ਬਾਰੇ ਸੋਚਦਾ ਹੈ।"};

PA["sri-chand-beard"]={t:[
"ਬਾਬਾ ਸ੍ਰੀ ਚੰਦ ਜੀ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦੇ ਵੱਡੇ ਸਾਹਿਬਜ਼ਾਦੇ ਸਨ। ਉਹ ਇੱਕ ਸਤਿਕਾਰਯੋਗ ਮਹਾਂਪੁਰਖ ਸਨ ਜਿਨ੍ਹਾਂ ਨੇ ਦੁਨਿਆਵੀ ਜੀਵਨ ਤਿਆਗ ਦਿੱਤਾ ਸੀ, ਅਤੇ ਉਨ੍ਹਾਂ ਨੇ ਸਾਧੂਆਂ ਦੀ ਉਦਾਸੀ ਸੰਪਰਦਾ ਚਲਾਈ। ਹੁਣ ਉਹ ਬਹੁਤ ਬਿਰਧ ਹੋ ਚੁੱਕੇ ਸਨ।",
"ਇੱਕ ਦਿਨ ਬਾਬਾ ਸ੍ਰੀ ਚੰਦ ਜੀ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਨੂੰ ਮਿਲਣ ਆਏ। ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਦਾ ਨਿੱਘਾ ਸੁਆਗਤ ਕੀਤਾ, ਸਤਿਕਾਰ ਨਾਲ ਸੀਸ ਨਿਵਾਇਆ, ਅਤੇ ਉਨ੍ਹਾਂ ਕੋਲ ਬੈਠ ਗਏ।",
"ਬਾਬਾ ਸ੍ਰੀ ਚੰਦ ਜੀ ਨੇ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਦੇ ਲੰਮੇ, ਲਹਿਰਾਉਂਦੇ ਦਾੜ੍ਹੇ ਵੱਲ ਵੇਖ ਕੇ ਮੁਸਕਰਾ ਕੇ ਪੁੱਛਿਆ, \"ਤੁਸੀਂ ਇੰਨਾ ਲੰਮਾ ਦਾੜ੍ਹਾ ਕਿਉਂ ਰੱਖਿਆ ਹੈ?\"",
"ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਨੇ ਬੜੀ ਨਿਮਰਤਾ ਨਾਲ ਜਵਾਬ ਦਿੱਤਾ, \"ਤੁਹਾਡੇ ਵਰਗੇ ਮਹਾਂਪੁਰਖਾਂ ਦੇ ਚਰਨ ਪੂੰਝਣ ਲਈ।\" ਅਤੇ ਉਹ ਝੁਕ ਕੇ ਆਪਣੇ ਦਾੜ੍ਹੇ ਨਾਲ ਬਾਬਾ ਸ੍ਰੀ ਚੰਦ ਜੀ ਦੇ ਧੂੜ ਭਰੇ ਚਰਨ ਹੌਲੀ-ਹੌਲੀ ਪੂੰਝਣ ਲੱਗੇ।",
"ਬਾਬਾ ਸ੍ਰੀ ਚੰਦ ਜੀ ਨੇ ਛੇਤੀ ਨਾਲ ਆਪਣੇ ਚਰਨ ਪਿੱਛੇ ਖਿੱਚ ਲਏ, ਅਤੇ ਉਨ੍ਹਾਂ ਦੀਆਂ ਅੱਖਾਂ ਭਰ ਆਈਆਂ। \"ਹੁਣ ਮੈਂ ਸਮਝ ਗਿਆ ਕਿ ਤੁਸੀਂ ਮੇਰੇ ਪਿਤਾ ਜੀ ਦੀ ਗੱਦੀ ਉੱਤੇ ਕਿਉਂ ਬੈਠੇ ਹੋ,\" ਉਨ੍ਹਾਂ ਕਿਹਾ। \"ਤੁਹਾਡੀ ਨਿਮਰਤਾ ਸੱਚਮੁੱਚ ਮਹਾਨ ਹੈ।\""],
l:"ਸਭ ਤੋਂ ਮਹਾਨ ਲੋਕ ਸਭ ਤੋਂ ਨਿਮਰ ਹੁੰਦੇ ਹਨ। ਦੂਜਿਆਂ ਦਾ ਸਤਿਕਾਰ ਕਰੋ, ਖ਼ਾਸ ਕਰਕੇ ਬਜ਼ੁਰਗਾਂ ਅਤੇ ਸਿਆਣਿਆਂ ਦਾ।"};

PA["four-doors"]={t:[
"ਪੰਜਵੇਂ ਗੁਰੂ, ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ, ਅੰਮ੍ਰਿਤਸਰ ਦੇ ਸਰੋਵਰ ਦੇ ਵਿਚਕਾਰ ਰੱਬ ਦਾ ਇੱਕ ਸੋਹਣਾ ਘਰ ਬਣਾਉਣਾ ਚਾਹੁੰਦੇ ਸਨ। ਇਸ ਦਾ ਨਾਂ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਰੱਖਿਆ ਜਾਣਾ ਸੀ।",
"1588 ਵਿੱਚ ਨੀਂਹ ਪੱਥਰ ਰੱਖਿਆ ਗਿਆ। ਸਿੱਖ ਪਰੰਪਰਾ ਯਾਦ ਕਰਦੀ ਹੈ ਕਿ ਗੁਰੂ ਜੀ ਨੇ ਆਪਣੇ ਮਿੱਤਰ, ਲਾਹੌਰ ਦੇ ਮੁਸਲਮਾਨ ਸੂਫ਼ੀ ਫ਼ਕੀਰ ਸਾਈਂ ਮੀਆਂ ਮੀਰ, ਨੂੰ ਨੀਂਹ ਰੱਖਣ ਲਈ ਸੱਦਿਆ। ਇਸ ਤਰ੍ਹਾਂ ਸ਼ੁਰੂ ਤੋਂ ਹੀ ਵੱਖ-ਵੱਖ ਧਰਮਾਂ ਦੇ ਲੋਕ ਇਕੱਠੇ ਹੋਏ।",
"ਉਸ ਸਮੇਂ ਦੇ ਬਹੁਤੇ ਮੰਦਰ ਉੱਚੇ ਬਣਾਏ ਜਾਂਦੇ ਸਨ, ਤਾਂ ਜੋ ਲੋਕਾਂ ਨੂੰ ਪੌੜੀਆਂ ਚੜ੍ਹ ਕੇ ਜਾਣਾ ਪਵੇ। ਪਰ ਗੁਰੂ ਜੀ ਨੇ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਆਲੇ-ਦੁਆਲੇ ਦੀ ਧਰਤੀ ਤੋਂ ਨੀਵਾਂ ਬਣਾਇਆ, ਤਾਂ ਜੋ ਹਰ ਕਿਸੇ ਨੂੰ ਅੰਦਰ ਜਾਣ ਲਈ ਹੇਠਾਂ ਉੱਤਰਨਾ ਪਵੇ। ਇਹ ਨਿਮਰਤਾ ਸਿਖਾਉਂਦਾ ਸੀ: ਰੱਬ ਦੇ ਨੇੜੇ ਜਾਣ ਲਈ ਸਾਨੂੰ ਆਪਣਾ ਹੰਕਾਰ ਨਿਵਾਉਣਾ ਪੈਂਦਾ ਹੈ।",
"ਗੁਰੂ ਜੀ ਨੇ ਇਸ ਦੇ ਚਾਰ ਦਰਵਾਜ਼ੇ ਵੀ ਰੱਖੇ, ਹਰ ਪਾਸੇ ਇੱਕ: ਉੱਤਰ, ਦੱਖਣ, ਪੂਰਬ ਅਤੇ ਪੱਛਮ। ਇਸ ਦਾ ਅਰਥ ਸੀ ਕਿ ਹਰ ਦਿਸ਼ਾ, ਹਰ ਜਾਤ ਅਤੇ ਹਰ ਧਰਮ ਦੇ ਲੋਕਾਂ ਨੂੰ ਜੀ ਆਇਆਂ ਹੈ। ਕਿਸੇ ਨੂੰ ਕਦੇ ਮੋੜਿਆ ਨਹੀਂ ਜਾਣਾ ਸੀ।",
"1604 ਵਿੱਚ ਕੰਮ ਪੂਰਾ ਹੋਇਆ, ਅਤੇ ਗੁਰੂ ਜੀ ਨੇ ਆਪਣੇ ਸੰਪਾਦਿਤ ਕੀਤੇ ਪਵਿੱਤਰ ਗ੍ਰੰਥ, ਆਦਿ ਗ੍ਰੰਥ, ਦਾ ਉੱਥੇ ਪ੍ਰਕਾਸ਼ ਕੀਤਾ। ਅੱਜ ਇਸ ਨੂੰ ਅਕਸਰ ਸੁਨਹਿਰੀ ਮੰਦਰ ਕਿਹਾ ਜਾਂਦਾ ਹੈ, ਅਤੇ ਇਸ ਦੇ ਦਰਵਾਜ਼ੇ ਅੱਜ ਵੀ ਦਿਨ-ਰਾਤ ਸਭ ਲਈ ਖੁੱਲ੍ਹੇ ਹਨ।"],
l:"ਗੁਰੂ ਘਰ ਸਭ ਲਈ ਖੁੱਲ੍ਹਾ ਹੈ। ਨਿਮਰ ਹੋ ਕੇ ਹੀ ਅਸੀਂ ਰੱਬ ਦੇ ਨੇੜੇ ਆਉਂਦੇ ਹਾਂ।"};

PA["arjan-shaheedi"]={t:[
"ਜਿਵੇਂ-ਜਿਵੇਂ ਵੱਧ ਲੋਕ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਕੋਲ ਆਉਣ ਲੱਗੇ, ਕੁਝ ਤਾਕਤਵਰ ਲੋਕ ਈਰਖਾ ਕਰਨ ਲੱਗੇ। 1606 ਵਿੱਚ ਨਵੇਂ ਮੁਗ਼ਲ ਬਾਦਸ਼ਾਹ ਜਹਾਂਗੀਰ ਨੇ ਹੁਕਮ ਦਿੱਤਾ ਕਿ ਗੁਰੂ ਜੀ ਨੂੰ ਗ੍ਰਿਫ਼ਤਾਰ ਕਰਕੇ ਸਜ਼ਾ ਦਿੱਤੀ ਜਾਵੇ। ਗੁਰੂ ਜੀ ਨਾਲ ਖੁੰਦਕ ਰੱਖਣ ਵਾਲਾ ਅਫ਼ਸਰ ਚੰਦੂ ਵੀ ਉਨ੍ਹਾਂ ਵਿੱਚੋਂ ਸੀ ਜਿਨ੍ਹਾਂ ਨੇ ਬਾਦਸ਼ਾਹ ਨੂੰ ਗੁਰੂ ਜੀ ਵਿਰੁੱਧ ਭੜਕਾਇਆ।",
"ਗੁਰੂ ਜੀ ਨੂੰ ਲਾਹੌਰ ਲਿਜਾਇਆ ਗਿਆ। ਉਨ੍ਹਾਂ ਨੂੰ ਆਦਿ ਗ੍ਰੰਥ ਵਿੱਚ ਬਦਲਾਅ ਕਰਨ ਅਤੇ ਆਪਣਾ ਧਰਮ ਛੱਡਣ ਲਈ ਕਿਹਾ ਗਿਆ। ਉਨ੍ਹਾਂ ਨੇ ਇਨਕਾਰ ਕਰ ਦਿੱਤਾ।",
"ਕਈ ਦਿਨ ਗੁਰੂ ਜੀ ਨੂੰ ਗਰਮੀਆਂ ਦੀ ਤਪਦੀ ਧੁੱਪ ਵਿੱਚ ਭਿਆਨਕ ਤਸੀਹੇ ਦਿੱਤੇ ਗਏ। ਇਸ ਸਭ ਦੌਰਾਨ ਉਹ ਸ਼ਾਂਤ ਰਹੇ ਅਤੇ ਗੁਰਬਾਣੀ ਦੇ ਇਹ ਬਚਨ ਦੁਹਰਾਉਂਦੇ ਰਹੇ: \"ਤੇਰਾ ਕੀਆ ਮੀਠਾ ਲਾਗੈ\", ਜੋ ਤੂੰ ਕਰਦਾ ਹੈਂ, ਉਹ ਮੈਨੂੰ ਮਿੱਠਾ ਲੱਗਦਾ ਹੈ (ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ, ਅੰਗ 394)।",
"ਗੁਰੂ ਜੀ ਦੇ ਸੂਫ਼ੀ ਮਿੱਤਰ, ਸਾਈਂ ਮੀਆਂ ਮੀਰ, ਉਨ੍ਹਾਂ ਨੂੰ ਮਿਲਣ ਆਏ ਅਤੇ ਬਾਦਸ਼ਾਹ ਕੋਲ ਸਿਫ਼ਾਰਸ਼ ਕਰਨ ਦੀ ਪੇਸ਼ਕਸ਼ ਕੀਤੀ। ਗੁਰੂ ਜੀ ਨੇ ਪਿਆਰ ਨਾਲ ਮਨ੍ਹਾ ਕਰ ਦਿੱਤਾ, ਅਤੇ ਕਿਹਾ ਕਿ ਉਹ ਸ਼ਾਂਤ ਮਨ ਨਾਲ ਰੱਬ ਦਾ ਭਾਣਾ ਮੰਨਦੇ ਹਨ।",
"ਫਿਰ ਗੁਰੂ ਜੀ ਨੇ ਰਾਵੀ ਦਰਿਆ ਵਿੱਚ ਇਸ਼ਨਾਨ ਕਰਨ ਦੀ ਇੱਛਾ ਪ੍ਰਗਟਾਈ। ਉਹ ਉਸ ਦੇ ਪਾਣੀ ਵਿੱਚ ਉੱਤਰੇ ਅਤੇ ਇਸ ਸੰਸਾਰ ਤੋਂ ਚਲੇ ਗਏ। ਉਹ ਪਹਿਲੇ ਸਿੱਖ ਸ਼ਹੀਦ ਬਣੇ। ਲਾਹੌਰ ਵਿੱਚ ਉਸ ਥਾਂ ਗੁਰਦੁਆਰਾ ਡੇਰਾ ਸਾਹਿਬ ਹੈ, ਅਤੇ ਸਿੱਖ ਹਰ ਗਰਮੀਆਂ ਵਿੱਚ ਉਨ੍ਹਾਂ ਦੀ ਸ਼ਹੀਦੀ ਨੂੰ ਯਾਦ ਕਰਦਿਆਂ ਲੰਘਣ ਵਾਲੇ ਹਰ ਕਿਸੇ ਨੂੰ ਠੰਢੇ-ਮਿੱਠੇ ਜਲ ਦੀ ਛਬੀਲ ਲਾ ਕੇ ਛਕਾਉਂਦੇ ਹਨ।"],
l:"ਸੱਚਾ ਵਿਸ਼ਵਾਸ ਸਭ ਤੋਂ ਔਖੇ ਵੇਲੇ ਵੀ ਸ਼ਾਂਤ ਅਤੇ ਮਿੱਠਾ ਰਹਿੰਦਾ ਹੈ। ਸਿੱਖ ਜ਼ੁਲਮ ਦਾ ਜਵਾਬ ਦੂਜਿਆਂ ਦੀ ਸੇਵਾ ਕਰਕੇ ਦਿੰਦੇ ਹਨ।"};

PA["dilbagh-gulbagh"]={t:[
"ਕਾਬਲ ਦੇ ਕੁਝ ਸਿੱਖ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਲਈ ਭੇਟ ਵਜੋਂ ਦੋ ਸ਼ਾਨਦਾਰ ਘੋੜੇ ਲਿਆ ਰਹੇ ਸਨ, ਜਿਨ੍ਹਾਂ ਦੇ ਨਾਂ ਦਿਲਬਾਗ ਅਤੇ ਗੁਲਬਾਗ ਸਨ। ਪਰ ਰਸਤੇ ਵਿੱਚ ਮੁਗ਼ਲ ਅਫ਼ਸਰਾਂ ਨੇ ਘੋੜੇ ਖੋਹ ਲਏ ਅਤੇ ਲਾਹੌਰ ਦੇ ਕਿਲ੍ਹੇ ਦੇ ਸ਼ਾਹੀ ਤਬੇਲੇ ਵਿੱਚ ਲੈ ਗਏ।",
"ਇੱਕ ਬਹਾਦਰ ਅਤੇ ਸਿਆਣੇ ਸਿੱਖ, ਭਾਈ ਬਿਧੀ ਚੰਦ ਜੀ, ਨੇ ਕਿਹਾ, \"ਗੁਰੂ ਜੀ, ਮੈਂ ਇਨ੍ਹਾਂ ਨੂੰ ਵਾਪਸ ਲਿਆਵਾਂਗਾ।\" ਉਹ ਇੱਕ ਗਰੀਬ ਘਾਹੀ ਦਾ ਭੇਸ ਧਾਰ ਕੇ ਲਾਹੌਰ ਗਏ ਅਤੇ ਕਿਲ੍ਹੇ ਵਿੱਚ ਘੋੜਿਆਂ ਦੀ ਸੇਵਾ ਦੀ ਨੌਕਰੀ ਲੈ ਲਈ।",
"ਹਰ ਰੋਜ਼ ਉਹ ਘੋੜਿਆਂ ਨੂੰ ਚਾਰਾ ਪਾਉਂਦੇ ਅਤੇ ਉਨ੍ਹਾਂ ਦੀ ਸੰਭਾਲ ਕਰਦੇ, ਅਤੇ ਘੋੜੇ ਉਨ੍ਹਾਂ ਨਾਲ ਪਿਆਰ ਕਰਨ ਲੱਗੇ। ਹਰ ਰਾਤ ਉਹ ਕਿਲ੍ਹੇ ਦੀ ਕੰਧ ਹੇਠਾਂ ਦਰਿਆ ਵਿੱਚ ਇੱਕ ਭਾਰੀ ਪੱਥਰ ਸੁੱਟ ਦਿੰਦੇ। ਪਹਿਲਾਂ-ਪਹਿਲਾਂ ਪਹਿਰੇਦਾਰ ਉੱਚੀ ਛਪਾਕ ਸੁਣ ਕੇ ਉੱਠ ਬੈਠਦੇ, ਪਰ ਛੇਤੀ ਹੀ ਉਨ੍ਹਾਂ ਨੂੰ ਆਦਤ ਪੈ ਗਈ ਅਤੇ ਉਨ੍ਹਾਂ ਨੇ ਵੇਖਣਾ ਛੱਡ ਦਿੱਤਾ।",
"ਇੱਕ ਹਨੇਰੀ ਰਾਤ ਭਾਈ ਬਿਧੀ ਚੰਦ ਜੀ ਦਿਲਬਾਗ ਉੱਤੇ ਸਵਾਰ ਹੋਏ ਅਤੇ ਕਿਲ੍ਹੇ ਦੀ ਕੰਧ ਤੋਂ ਰਾਵੀ ਦਰਿਆ ਵਿੱਚ ਛਾਲ ਮਾਰ ਦਿੱਤੀ। ਪਹਿਰੇਦਾਰਾਂ ਨੇ ਸਿਰਫ਼ ਰੋਜ਼ ਵਾਲੀ ਛਪਾਕ ਸੁਣੀ! ਉਹ ਘੋੜੇ ਨੂੰ ਤਰਾ ਕੇ ਪਾਰ ਲੈ ਗਏ ਅਤੇ ਗੁਰੂ ਜੀ ਕੋਲ ਪਹੁੰਚ ਗਏ।",
"ਬਾਅਦ ਵਿੱਚ ਉਹ ਇੱਕ ਹੋਰ ਭੇਸ ਵਿੱਚ, ਇਸ ਵਾਰ ਜੋਤਸ਼ੀ ਬਣ ਕੇ, ਵਾਪਸ ਗਏ, ਅਤੇ ਸਿਆਣਪ ਨਾਲ ਗੁਲਬਾਗ ਨੂੰ ਵੀ ਲੈ ਆਏ। ਗੁਰੂ ਜੀ ਬਹੁਤ ਖ਼ੁਸ਼ ਹੋਏ ਅਤੇ ਭਾਈ ਬਿਧੀ ਚੰਦ ਜੀ ਦੀ ਬਹਾਦਰੀ ਅਤੇ ਹਾਜ਼ਰ-ਦਿਮਾਗ਼ੀ ਦੀ ਸਿਫ਼ਤ ਕੀਤੀ।"],
l:"ਬਹਾਦਰੀ ਸਬਰ ਅਤੇ ਸਿਆਣਪ ਨਾਲ ਮਿਲ ਕੇ ਸਭ ਤੋਂ ਵਧੀਆ ਕੰਮ ਕਰਦੀ ਹੈ।"};

PA["flower-and-robe"]={t:[
"ਜਦੋਂ ਗੁਰੂ ਹਰਿ ਰਾਇ ਸਾਹਿਬ ਜੀ ਛੋਟੇ ਸਨ, ਉਹ ਕੀਰਤਪੁਰ ਵਿੱਚ ਆਪਣੇ ਦਾਦਾ ਜੀ, ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ, ਕੋਲ ਰਹਿੰਦੇ ਸਨ। ਗੁਰੂ ਜੀ ਦਾ ਫੁੱਲਾਂ ਅਤੇ ਰੁੱਖਾਂ ਨਾਲ ਭਰਿਆ ਇੱਕ ਸੋਹਣਾ ਬਾਗ਼ ਸੀ।",
"ਇੱਕ ਦਿਨ ਬਾਲ ਹਰਿ ਰਾਇ ਜੀ ਇੱਕ ਲੰਮਾ, ਖੁੱਲ੍ਹਾ ਚੋਲਾ ਪਹਿਨ ਕੇ ਬਾਗ਼ ਵਿੱਚ ਖ਼ੁਸ਼ੀ-ਖ਼ੁਸ਼ੀ ਦੌੜ ਰਹੇ ਸਨ। ਜਦੋਂ ਉਹ ਇੱਕ ਝਾੜੀ ਕੋਲੋਂ ਲੰਘੇ, ਉਨ੍ਹਾਂ ਦਾ ਚੋਲਾ ਇੱਕ ਫੁੱਲ ਵਿੱਚ ਅੜ ਗਿਆ, ਅਤੇ ਫੁੱਲ ਟੁੱਟ ਕੇ ਧਰਤੀ ਉੱਤੇ ਡਿੱਗ ਪਿਆ।",
"ਹਰਿ ਰਾਇ ਜੀ ਰੁਕ ਗਏ ਅਤੇ ਟੁੱਟੇ ਫੁੱਲ ਵੱਲ ਵੇਖਿਆ। ਉਹ ਬਹੁਤ ਉਦਾਸ ਹੋ ਗਏ। ਉਸੇ ਵੇਲੇ ਦਾਦਾ ਜੀ ਆ ਗਏ।",
"ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਨੇ ਪਿਆਰ ਨਾਲ ਕਿਹਾ, \"ਜੇ ਲੰਮਾ ਚੋਲਾ ਪਹਿਨਣਾ ਹੈ, ਤਾਂ ਉਸ ਨੂੰ ਸੰਭਾਲ ਕੇ ਚੱਲਣਾ ਚਾਹੀਦਾ ਹੈ, ਤਾਂ ਜੋ ਕਿਸੇ ਦਾ ਨੁਕਸਾਨ ਨਾ ਹੋਵੇ।\" ਹਰਿ ਰਾਇ ਜੀ ਸਮਝ ਗਏ ਕਿ ਦਾਦਾ ਜੀ ਦਾ ਭਾਵ ਸਿਰਫ਼ ਚੋਲੇ ਤੋਂ ਨਹੀਂ ਸੀ: ਸਾਨੂੰ ਦੁਨੀਆ ਵਿੱਚ ਹੌਲੀ-ਹੌਲੀ, ਕਿਸੇ ਨੂੰ ਨੁਕਸਾਨ ਪਹੁੰਚਾਏ ਬਿਨਾਂ ਵਿਚਰਨਾ ਚਾਹੀਦਾ ਹੈ।",
"ਉਸ ਦਿਨ ਤੋਂ ਹਰਿ ਰਾਇ ਜੀ ਤੁਰਦਿਆਂ ਸਦਾ ਆਪਣਾ ਚੋਲਾ ਸਮੇਟ ਕੇ ਰੱਖਦੇ। ਵੱਡੇ ਹੋ ਕੇ ਉਨ੍ਹਾਂ ਨੂੰ ਕੁਦਰਤ ਨਾਲ ਡੂੰਘਾ ਪਿਆਰ ਹੋ ਗਿਆ। ਸੱਤਵੇਂ ਗੁਰੂ ਵਜੋਂ ਉਨ੍ਹਾਂ ਨੇ ਬਾਗ਼ ਅਤੇ ਪਸ਼ੂ-ਪੰਛੀ ਪਾਲੇ, ਅਤੇ ਜੜੀ-ਬੂਟੀਆਂ ਨਾਲ ਇਲਾਜ ਕਰਨ ਵਾਲਾ ਮੁਫ਼ਤ ਦਵਾਖ਼ਾਨਾ ਚਲਾਇਆ।"],
l:"ਹਰ ਜੀਵ ਨਾਲ ਕੋਮਲਤਾ ਨਾਲ ਪੇਸ਼ ਆਓ। ਇੱਕ ਛੋਟੀ ਜਿਹੀ ਲਾਪਰਵਾਹੀ ਵੀ ਕਿਸੇ ਸੋਹਣੀ ਚੀਜ਼ ਨੂੰ ਦੁੱਖ ਦੇ ਸਕਦੀ ਹੈ।"};

PA["bibi-kaulan"]={t:[
"ਬੀਬੀ ਕੌਲਾਂ ਲਾਹੌਰ ਦੇ ਇੱਕ ਕਾਜ਼ੀ, ਭਾਵ ਮੁਸਲਮਾਨ ਜੱਜ, ਦੇ ਘਰ ਪਲੀ ਸੀ। ਬਚਪਨ ਵਿੱਚ ਉਹ ਅਕਸਰ ਦਇਆਵਾਨ ਸੂਫ਼ੀ ਫ਼ਕੀਰ ਸਾਈਂ ਮੀਆਂ ਮੀਰ ਕੋਲ ਜਾਂਦੀ, ਅਤੇ ਉੱਥੇ ਉਸ ਨੇ ਸਿੱਖ ਗੁਰੂ ਸਾਹਿਬਾਨ ਦੀ ਬਾਣੀ ਸੁਣੀ। ਉਸ ਨੂੰ ਬਾਣੀ ਇੰਨੀ ਪਿਆਰੀ ਲੱਗੀ ਕਿ ਉਹ ਹਰ ਰੋਜ਼ ਗਾਉਣ ਲੱਗੀ।",
"ਕਾਜ਼ੀ ਨੂੰ ਗੁੱਸਾ ਆਇਆ। ਉਸ ਨੇ ਉਸ ਨੂੰ ਗੁਰੂ ਸਾਹਿਬਾਨ ਦੀ ਬਾਣੀ ਗਾਉਣ ਤੋਂ ਰੋਕ ਦਿੱਤਾ ਅਤੇ ਧਮਕੀ ਦਿੱਤੀ ਕਿ ਜੇ ਨਾ ਹਟੀ ਤਾਂ ਸਜ਼ਾ ਮਿਲੇਗੀ। ਪਰ ਬੀਬੀ ਕੌਲਾਂ ਉਹ ਬਚਨ ਨਹੀਂ ਛੱਡ ਸਕੀ ਜੋ ਉਸ ਦੇ ਦਿਲ ਨੂੰ ਸ਼ਾਂਤੀ ਨਾਲ ਭਰਦੇ ਸਨ।",
"ਸਾਈਂ ਮੀਆਂ ਮੀਰ ਜਾਣਦੇ ਸਨ ਕਿ ਉਹ ਖ਼ਤਰੇ ਵਿੱਚ ਹੈ। ਉਨ੍ਹਾਂ ਨੇ ਪ੍ਰਬੰਧ ਕੀਤਾ ਕਿ ਉਸ ਨੂੰ ਸੁਰੱਖਿਅਤ ਅੰਮ੍ਰਿਤਸਰ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਕੋਲ ਪਹੁੰਚਾਇਆ ਜਾਵੇ।",
"ਗੁਰੂ ਜੀ ਨੇ ਦਇਆ ਨਾਲ ਉਸ ਦਾ ਸੁਆਗਤ ਕੀਤਾ ਅਤੇ ਉਸ ਨੂੰ ਸੁਰੱਖਿਅਤ ਘਰ ਦਿੱਤਾ। ਉਸ ਨੇ ਆਪਣਾ ਬਾਕੀ ਜੀਵਨ ਬੰਦਗੀ, ਸਿਮਰਨ ਅਤੇ ਸੇਵਾ ਵਿੱਚ ਬਿਤਾਇਆ।",
"ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਨੇ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਦੇ ਨੇੜੇ ਇੱਕ ਪਵਿੱਤਰ ਸਰੋਵਰ ਬਣਵਾਇਆ ਅਤੇ ਉਸ ਦੇ ਨਾਂ ਉੱਤੇ ਉਸ ਦਾ ਨਾਂ ਕੌਲਸਰ ਰੱਖਿਆ। ਇਹ ਅੱਜ ਵੀ ਉੱਥੇ ਹੈ, ਅਤੇ ਅੰਮ੍ਰਿਤਸਰ ਆਉਣ ਵਾਲੇ ਸ਼ਰਧਾਲੂ ਉਸ ਦੀ ਸ਼ਰਧਾ ਨੂੰ ਯਾਦ ਕਰਦੇ ਹਨ।"],
l:"ਹਰ ਕੋਈ ਆਪਣੇ ਢੰਗ ਨਾਲ ਰੱਬ ਨੂੰ ਪਿਆਰ ਕਰਨ ਲਈ ਆਜ਼ਾਦ ਹੈ। ਗੁਰੂ ਘਰ ਸਭ ਨੂੰ ਪਨਾਹ ਦਿੰਦਾ ਹੈ।"};

PA["three-companions"]={t:[
"ਜਦੋਂ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਕਸ਼ਮੀਰੀ ਪੰਡਿਤਾਂ ਦੀ ਰੱਖਿਆ ਲਈ ਦਿੱਲੀ ਵੱਲ ਤੁਰੇ, ਤਿੰਨ ਸ਼ਰਧਾਵਾਨ ਸਿੱਖ ਉਨ੍ਹਾਂ ਦੇ ਨਾਲ ਗਏ: ਦੋ ਭਰਾ, ਭਾਈ ਮਤੀ ਦਾਸ ਜੀ ਅਤੇ ਭਾਈ ਸਤੀ ਦਾਸ ਜੀ, ਅਤੇ ਉਨ੍ਹਾਂ ਦੇ ਸਾਥੀ ਭਾਈ ਦਿਆਲਾ ਜੀ।",
"ਸਭ ਨੂੰ ਗ੍ਰਿਫ਼ਤਾਰ ਕਰਕੇ ਦਿੱਲੀ ਦੇ ਚਾਂਦਨੀ ਚੌਂਕ ਲਿਆਂਦਾ ਗਿਆ। ਅਫ਼ਸਰਾਂ ਨੇ ਸੋਚਿਆ ਕਿ ਜੇ ਗੁਰੂ ਜੀ ਦੇ ਸਾਥੀਆਂ ਨੂੰ ਡਰਾਇਆ ਜਾਵੇ, ਤਾਂ ਗੁਰੂ ਜੀ ਝੁਕ ਜਾਣਗੇ। ਇਸ ਲਈ ਹਰ ਸਿੱਖ ਨੂੰ ਧਰਮ ਛੱਡਣ ਦੇ ਬਦਲੇ ਧਨ-ਦੌਲਤ ਅਤੇ ਆਜ਼ਾਦੀ ਦੀ ਪੇਸ਼ਕਸ਼ ਕੀਤੀ ਗਈ।",
"ਹਰ ਇੱਕ ਨੇ ਇਨਕਾਰ ਕਰ ਦਿੱਤਾ। ਭਾਈ ਮਤੀ ਦਾਸ ਜੀ ਨੇ ਸ਼ਾਂਤੀ ਨਾਲ ਕਿਹਾ ਕਿ ਉਹ ਕਦੇ ਗੁਰੂ ਦਾ ਰਾਹ ਨਹੀਂ ਛੱਡਣਗੇ। ਉਨ੍ਹਾਂ ਨੇ ਸਿਰਫ਼ ਇਹੀ ਮੰਗਿਆ ਕਿ ਅੰਤ ਵੇਲੇ ਉਨ੍ਹਾਂ ਦਾ ਮੂੰਹ ਗੁਰੂ ਜੀ ਵੱਲ ਹੋਵੇ।",
"ਇੱਕ-ਇੱਕ ਕਰਕੇ ਤਿੰਨਾਂ ਸਾਥੀਆਂ ਨੂੰ ਗੁਰੂ ਜੀ ਦੀਆਂ ਅੱਖਾਂ ਸਾਹਮਣੇ ਬਹੁਤ ਬੇਰਹਿਮੀ ਨਾਲ ਸ਼ਹੀਦ ਕਰ ਦਿੱਤਾ ਗਿਆ। ਕਿਸੇ ਦੇ ਮੂੰਹੋਂ ਡਰ ਦੀ ਚੀਕ ਨਾ ਨਿਕਲੀ। ਅਖ਼ੀਰ ਤੱਕ ਹਰ ਇੱਕ ਗੁਰਬਾਣੀ, ਜਪੁਜੀ ਸਾਹਿਬ ਅਤੇ ਗੁਰੂ ਸਾਹਿਬਾਨ ਦੇ ਸ਼ਬਦ, ਪੜ੍ਹਦਾ ਰਿਹਾ।",
"ਉਨ੍ਹਾਂ ਦੀ ਬਹਾਦਰੀ ਨੇ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਨੂੰ ਨਹੀਂ ਤੋੜਿਆ। ਇਸ ਨੇ ਸਿਰਫ਼ ਇਹ ਵਿਖਾਇਆ ਕਿ ਵਿਸ਼ਵਾਸ ਕਿੰਨਾ ਮਜ਼ਬੂਤ ਹੋ ਸਕਦਾ ਹੈ। ਅੱਜ ਚਾਂਦਨੀ ਚੌਂਕ ਵਿੱਚ ਗੁਰਦੁਆਰਾ ਸੀਸ ਗੰਜ ਸਾਹਿਬ ਦੇ ਨੇੜੇ ਭਾਈ ਮਤੀ ਦਾਸ ਅਜਾਇਬ ਘਰ ਹੈ, ਅਤੇ ਸਿੱਖ ਆਪਣੀ ਰੋਜ਼ਾਨਾ ਅਰਦਾਸ ਵਿੱਚ ਤਿੰਨਾਂ ਨੂੰ ਯਾਦ ਕਰਦੇ ਹਨ।"],
l:"ਸੱਚੀ ਬਹਾਦਰੀ ਸ਼ਾਂਤ ਅਤੇ ਵਿਸ਼ਵਾਸ ਉੱਤੇ ਪੱਕੇ ਰਹਿਣਾ ਹੈ, ਭਾਵੇਂ ਇਸ ਲਈ ਸਭ ਕੁਝ ਵਾਰਨਾ ਪਵੇ।"};

PA["bhai-jaita"]={t:[
"ਨਵੰਬਰ 1675 ਵਿੱਚ ਚਾਂਦਨੀ ਚੌਂਕ ਵਿੱਚ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਦੀ ਸ਼ਹੀਦੀ ਤੋਂ ਬਾਅਦ, ਬਾਦਸ਼ਾਹ ਦੇ ਸਿਪਾਹੀ ਉਸ ਥਾਂ ਸਖ਼ਤ ਪਹਿਰਾ ਦੇ ਰਹੇ ਸਨ। ਕਿਸੇ ਨੂੰ ਗੁਰੂ ਜੀ ਦੀ ਦੇਹ ਲੈ ਜਾਣ ਦੀ ਆਗਿਆ ਨਹੀਂ ਸੀ।",
"ਉਸ ਸ਼ਾਮ ਦਿੱਲੀ ਵਿੱਚ ਹਨੇਰੀ ਆ ਗਈ। ਹਨੇਰੇ ਵਿੱਚ ਭਾਈ ਜੈਤਾ ਨਾਂ ਦਾ ਇੱਕ ਬਹਾਦਰ ਸਿੱਖ ਚੁੱਪ-ਚਾਪ ਅੱਗੇ ਵਧਿਆ, ਗੁਰੂ ਜੀ ਦਾ ਪਵਿੱਤਰ ਸੀਸ ਪਿਆਰ ਨਾਲ ਚੁੱਕਿਆ, ਅਤੇ ਕੱਪੜੇ ਵਿੱਚ ਲਪੇਟ ਲਿਆ।",
"ਉਸੇ ਵੇਲੇ ਇੱਕ ਹੋਰ ਸਿੱਖ, ਲੱਖੀ ਸ਼ਾਹ ਵਣਜਾਰਾ, ਅਤੇ ਉਸ ਦੇ ਪੁੱਤਰ ਗੁਰੂ ਜੀ ਦਾ ਧੜ ਆਪਣੇ ਗੱਡਿਆਂ ਵਿੱਚ ਲੈ ਗਏ। ਫੜੇ ਜਾਣ ਤੋਂ ਬਿਨਾਂ ਗੁਰੂ ਜੀ ਦਾ ਸਸਕਾਰ ਕਰਨ ਲਈ ਲੱਖੀ ਸ਼ਾਹ ਨੇ ਆਪਣੇ ਹੀ ਘਰ ਨੂੰ ਅੱਗ ਲਾ ਦਿੱਤੀ। ਅੱਜ ਦਿੱਲੀ ਵਿੱਚ ਉਸ ਥਾਂ ਗੁਰਦੁਆਰਾ ਰਕਾਬ ਗੰਜ ਸਾਹਿਬ ਹੈ।",
"ਭਾਈ ਜੈਤਾ ਜੀ ਸਿਪਾਹੀਆਂ ਤੋਂ ਲੁਕਦੇ-ਛਿਪਦੇ ਕਈ ਦਿਨ ਸਫ਼ਰ ਕਰਕੇ ਅਨੰਦਪੁਰ ਸਾਹਿਬ ਦੇ ਨੇੜੇ ਕੀਰਤਪੁਰ ਪਹੁੰਚੇ। ਉੱਥੇ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਦੇ ਸਪੁੱਤਰ, ਬਾਲ ਗੁਰੂ ਗੋਬਿੰਦ ਰਾਏ ਜੀ, ਨੇ ਡੂੰਘੇ ਪਿਆਰ ਅਤੇ ਦੁੱਖ ਨਾਲ ਆਪਣੇ ਪਿਤਾ ਜੀ ਦਾ ਸੀਸ ਪ੍ਰਾਪਤ ਕੀਤਾ।",
"ਭਾਈ ਜੈਤਾ ਜੀ ਉਸ ਭਾਈਚਾਰੇ ਵਿੱਚੋਂ ਸਨ ਜਿਸ ਨੂੰ ਲੋਕ ਬੇਇਨਸਾਫ਼ੀ ਨਾਲ ਨੀਵਾਂ ਸਮਝਦੇ ਸਨ। ਪਰ ਬਾਲ ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਗਲਵੱਕੜੀ ਪਾਈ ਅਤੇ ਕਿਹਾ, \"ਰੰਘਰੇਟੇ ਗੁਰੂ ਕੇ ਬੇਟੇ\": ਰੰਘਰੇਟੇ ਗੁਰੂ ਦੇ ਆਪਣੇ ਪੁੱਤਰ ਹਨ। ਬਾਅਦ ਵਿੱਚ ਭਾਈ ਜੈਤਾ ਜੀ ਨੇ ਅੰਮ੍ਰਿਤ ਛਕਿਆ ਅਤੇ ਭਾਈ ਜੀਵਨ ਸਿੰਘ ਬਣੇ, ਇੱਕ ਮਹਾਨ ਸਿੱਖ ਯੋਧਾ।"],
l:"ਮਨੁੱਖ ਨੂੰ ਬਹਾਦਰੀ ਅਤੇ ਪਿਆਰ ਮਹਾਨ ਬਣਾਉਂਦੇ ਹਨ, ਜਾਤ ਜਾਂ ਜਨਮ ਨਹੀਂ। ਗੁਰੂ ਦੇ ਪਰਿਵਾਰ ਵਿੱਚ ਸਭ ਬਰਾਬਰ ਹਨ।"};

PA["vaisakhi-1699"]={t:[
"1699 ਦੀ ਵਿਸਾਖੀ ਉੱਤੇ ਹਜ਼ਾਰਾਂ ਸਿੱਖ ਅਨੰਦਪੁਰ ਸਾਹਿਬ ਇਕੱਠੇ ਹੋਏ। ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਹੱਥ ਵਿੱਚ ਨੰਗੀ ਤਲਵਾਰ ਲੈ ਕੇ ਸੰਗਤ ਸਾਹਮਣੇ ਆਏ ਅਤੇ ਪੁੱਛਿਆ, \"ਕੀ ਇੱਥੇ ਕੋਈ ਹੈ ਜੋ ਗੁਰੂ ਲਈ ਆਪਣਾ ਸੀਸ ਭੇਟ ਕਰਨ ਲਈ ਤਿਆਰ ਹੋਵੇ?\"",
"ਸੰਗਤ ਵਿੱਚ ਸੰਨਾਟਾ ਛਾ ਗਿਆ। ਫਿਰ ਭਾਈ ਦਇਆ ਰਾਮ ਜੀ ਉੱਠ ਖੜ੍ਹੇ ਹੋਏ। ਗੁਰੂ ਜੀ ਉਨ੍ਹਾਂ ਨੂੰ ਤੰਬੂ ਵਿੱਚ ਲੈ ਗਏ, ਤਲਵਾਰ ਲੈ ਕੇ ਫਿਰ ਬਾਹਰ ਆਏ, ਅਤੇ ਇੱਕ ਹੋਰ ਸੀਸ ਮੰਗਿਆ। ਇੱਕ-ਇੱਕ ਕਰਕੇ ਚਾਰ ਹੋਰ ਉੱਠੇ: ਭਾਈ ਧਰਮ ਦਾਸ ਜੀ, ਭਾਈ ਹਿੰਮਤ ਰਾਏ ਜੀ, ਭਾਈ ਮੋਹਕਮ ਚੰਦ ਜੀ ਅਤੇ ਭਾਈ ਸਾਹਿਬ ਚੰਦ ਜੀ। ਉਹ ਵੱਖ-ਵੱਖ ਜਾਤਾਂ ਅਤੇ ਹਿੰਦੁਸਤਾਨ ਦੇ ਵੱਖ-ਵੱਖ ਹਿੱਸਿਆਂ ਤੋਂ ਸਨ।",
"ਫਿਰ ਗੁਰੂ ਜੀ ਪੰਜਾਂ ਨੂੰ ਜਿਉਂਦੇ-ਜਾਗਦੇ, ਕੇਸਰੀ ਬਾਣੇ ਸਜਾ ਕੇ ਬਾਹਰ ਲੈ ਆਏ। ਇਹ ਪੰਜ ਪੰਜ ਪਿਆਰੇ ਵਜੋਂ ਜਾਣੇ ਗਏ।",
"ਗੁਰੂ ਜੀ ਨੇ ਸਰਬ ਲੋਹ ਦੇ ਬਾਟੇ ਵਿੱਚ ਜਲ ਪਾ ਕੇ, ਦੋ-ਧਾਰੇ ਖੰਡੇ ਨਾਲ ਹਿਲਾਉਂਦਿਆਂ ਅਤੇ ਗੁਰਬਾਣੀ ਪੜ੍ਹਦਿਆਂ ਅੰਮ੍ਰਿਤ ਤਿਆਰ ਕੀਤਾ। ਮਾਤਾ ਸਾਹਿਬ ਕੌਰ ਜੀ ਨੇ ਜਲ ਵਿੱਚ ਮਿੱਠੇ ਪਤਾਸੇ ਪਾਏ। ਪੰਜਾਂ ਨੇ ਅੰਮ੍ਰਿਤ ਛਕਿਆ ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਸਿੰਘ ਨਾਂ ਬਖ਼ਸ਼ਿਆ ਗਿਆ। ਉਹ ਖ਼ਾਲਸੇ ਦੇ ਪਹਿਲੇ ਮੈਂਬਰ ਬਣੇ।",
"ਫਿਰ ਇੱਕ ਅਨੋਖੀ ਗੱਲ ਹੋਈ। ਗੁਰੂ ਜੀ ਨੇ ਪੰਜ ਪਿਆਰਿਆਂ ਨੂੰ ਬੇਨਤੀ ਕੀਤੀ ਕਿ ਉਹ ਉਨ੍ਹਾਂ ਨੂੰ ਅੰਮ੍ਰਿਤ ਛਕਾਉਣ। ਇਸ ਤਰ੍ਹਾਂ ਗੁਰੂ ਜੀ ਨੇ ਵਿਖਾਇਆ ਕਿ ਖ਼ਾਲਸਾ ਅਤੇ ਗੁਰੂ ਇੱਕ ਹਨ। ਗੋਬਿੰਦ ਰਾਏ ਜੀ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਬਣ ਗਏ।"],
l:"ਖ਼ਾਲਸਾ ਬਹਾਦਰੀ, ਬਰਾਬਰੀ ਅਤੇ ਸਮਰਪਣ ਉੱਤੇ ਸਾਜਿਆ ਗਿਆ। ਗੁਰੂ ਜੀ ਨੇ ਵੀ ਪੰਜ ਪਿਆਰਿਆਂ ਅੱਗੇ ਸੀਸ ਨਿਵਾਇਆ।"};

PA["bhai-kanhaiya"]={t:[
"ਭਾਈ ਕਨ੍ਹੱਈਆ ਜੀ, ਜਿਨ੍ਹਾਂ ਨੂੰ ਭਾਈ ਘਨੱਈਆ ਜੀ ਵੀ ਕਹਿੰਦੇ ਹਨ, ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਦੇ ਸਿੱਖ ਸਨ। ਅਨੰਦਪੁਰ ਸਾਹਿਬ ਦੀਆਂ ਜੰਗਾਂ ਵੇਲੇ ਉਹ ਚਮੜੇ ਦੀ ਮਸ਼ਕ ਚੁੱਕ ਕੇ ਜ਼ਖ਼ਮੀ ਸਿਪਾਹੀਆਂ ਵਿੱਚ ਫਿਰਦੇ ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਪਾਣੀ ਪਿਲਾਉਂਦੇ।",
"ਕੁਝ ਸਿੱਖਾਂ ਨੇ ਇੱਕ ਹੈਰਾਨੀ ਵਾਲੀ ਗੱਲ ਵੇਖੀ। ਭਾਈ ਕਨ੍ਹੱਈਆ ਜੀ ਸਿਰਫ਼ ਸਿੱਖ ਸਿਪਾਹੀਆਂ ਨੂੰ ਹੀ ਨਹੀਂ, ਦੁਸ਼ਮਣ ਸਿਪਾਹੀਆਂ ਨੂੰ ਵੀ ਪਾਣੀ ਪਿਲਾ ਰਹੇ ਸਨ। ਉਹ ਨਾਰਾਜ਼ ਹੋਏ ਅਤੇ ਗੁਰੂ ਜੀ ਕੋਲ ਸ਼ਿਕਾਇਤ ਕੀਤੀ: \"ਇਹ ਦੁਸ਼ਮਣ ਨੂੰ ਠੀਕ ਹੋਣ ਵਿੱਚ ਮਦਦ ਕਰ ਰਿਹਾ ਹੈ ਤਾਂ ਜੋ ਉਹ ਫਿਰ ਸਾਡੇ ਨਾਲ ਲੜ ਸਕਣ!\"",
"ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨੇ ਭਾਈ ਕਨ੍ਹੱਈਆ ਜੀ ਨੂੰ ਸੱਦ ਕੇ ਇਸ ਬਾਰੇ ਪੁੱਛਿਆ। ਭਾਈ ਕਨ੍ਹੱਈਆ ਜੀ ਨੇ ਹੱਥ ਜੋੜ ਕੇ ਜਵਾਬ ਦਿੱਤਾ, \"ਗੁਰੂ ਜੀ, ਜਦੋਂ ਮੈਂ ਜ਼ਖ਼ਮੀਆਂ ਵੱਲ ਵੇਖਦਾ ਹਾਂ, ਮੈਨੂੰ ਨਾ ਕੋਈ ਮਿੱਤਰ ਦਿਸਦਾ ਹੈ ਨਾ ਦੁਸ਼ਮਣ। ਮੈਨੂੰ ਹਰ ਚਿਹਰੇ ਵਿੱਚ ਸਿਰਫ਼ ਤੁਹਾਡੀ ਜੋਤ ਦਿਸਦੀ ਹੈ।\"",
"ਗੁਰੂ ਜੀ ਬਹੁਤ ਪ੍ਰਸੰਨ ਹੋਏ। ਉਨ੍ਹਾਂ ਨੇ ਭਾਈ ਕਨ੍ਹੱਈਆ ਜੀ ਨੂੰ ਮਲ੍ਹਮ ਦੀ ਇੱਕ ਡੱਬੀ ਦਿੱਤੀ ਅਤੇ ਕਿਹਾ, \"ਹੁਣ ਤੋਂ ਇਨ੍ਹਾਂ ਦੇ ਜ਼ਖ਼ਮਾਂ ਉੱਤੇ ਇਹ ਮਲ੍ਹਮ ਵੀ ਲਾਇਆ ਕਰ।\"",
"ਅੱਜ ਭਾਈ ਕਨ੍ਹੱਈਆ ਜੀ ਨੂੰ ਹਰ ਜ਼ਖ਼ਮੀ ਦੀ ਸੇਵਾ ਦੇ ਮੋਢੀ ਵਜੋਂ ਯਾਦ ਕੀਤਾ ਜਾਂਦਾ ਹੈ, ਰੈੱਡ ਕਰਾਸ ਦੀ ਸਥਾਪਨਾ ਤੋਂ ਬਹੁਤ ਪਹਿਲਾਂ। ਦੁਨੀਆ ਭਰ ਵਿੱਚ ਲੋੜਵੰਦਾਂ ਤੱਕ ਮਦਦ ਪਹੁੰਚਾਉਣ ਵਾਲੀਆਂ ਸਿੱਖ ਜਥੇਬੰਦੀਆਂ ਅੱਜ ਵੀ ਉਨ੍ਹਾਂ ਦੀ ਮਿਸਾਲ ਉੱਤੇ ਚੱਲਦੀਆਂ ਹਨ।"],
l:"ਸਰਬੱਤ ਦਾ ਭਲਾ: ਸਭ ਦਾ ਭਲਾ ਮੰਗੋ। ਦਇਆ ਦਾ ਕੋਈ ਦੁਸ਼ਮਣ ਨਹੀਂ ਹੁੰਦਾ।"};

PA["donkey-lion-skin"]={t:[
"ਇੱਕ ਦਿਨ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨੇ ਇੱਕ ਘੁਮਿਆਰ ਦੇ ਖੋਤੇ ਉੱਤੇ ਸ਼ੇਰ ਦੀ ਖੱਲ ਪਵਾ ਦਿੱਤੀ ਅਤੇ ਉਸ ਨੂੰ ਅਨੰਦਪੁਰ ਵਿੱਚ ਘੁੰਮਣ ਲਈ ਛੱਡ ਦਿੱਤਾ।",
"ਜਿਸ ਨੇ ਵੀ ਵੇਖਿਆ, ਉਸ ਨੇ ਸਮਝਿਆ ਕਿ ਇਹ ਅਸਲੀ ਸ਼ੇਰ ਹੈ! ਲੋਕ ਭੱਜ ਕੇ ਘਰਾਂ ਵਿੱਚ ਵੜ ਗਏ, ਅਤੇ ਕਿਸਾਨਾਂ ਦੇ ਪਸ਼ੂ ਖਿੰਡ ਗਏ। 'ਸ਼ੇਰ' ਮਜ਼ੇ ਨਾਲ ਖੇਤਾਂ ਵਿੱਚ ਘੁੰਮਦਾ, ਜੋ ਫ਼ਸਲ ਚਾਹੁੰਦਾ ਖਾਂਦਾ, ਅਤੇ ਕਿਸੇ ਦੀ ਉਸ ਨੂੰ ਰੋਕਣ ਦੀ ਹਿੰਮਤ ਨਾ ਪੈਂਦੀ।",
"ਫਿਰ ਖੋਤੇ ਨੇ ਘੁਮਿਆਰ ਦੀ ਆਵਾਜ਼ ਸੁਣੀ, ਅਤੇ ਉਸ ਨੇ ਮੂੰਹ ਖੋਲ੍ਹ ਕੇ ਉੱਚੀ-ਉੱਚੀ ਹੀਂਗਣਾ ਸ਼ੁਰੂ ਕਰ ਦਿੱਤਾ: \"ਢੀਂਚੂੰ! ਢੀਂਚੂੰ!\" ਉਸੇ ਵੇਲੇ ਸਭ ਸਮਝ ਗਏ ਕਿ ਇਹ ਤਾਂ ਸਿਰਫ਼ ਇੱਕ ਖੋਤਾ ਹੈ। ਘੁਮਿਆਰ ਭੱਜ ਕੇ ਆਇਆ, ਸ਼ੇਰ ਦੀ ਖੱਲ ਲਾਹੀ, ਅਤੇ ਆਪਣੇ ਖੋਤੇ ਨੂੰ ਘਰ ਲੈ ਗਿਆ।",
"ਗੁਰੂ ਜੀ ਨੇ ਸਿੱਖਾਂ ਨੂੰ ਇਕੱਠਾ ਕਰਕੇ ਕਿਹਾ, \"ਤੁਸੀਂ ਸ਼ੇਰ ਦੀ ਖੱਲ ਵਿੱਚ ਖੋਤਾ ਵੇਖਿਆ। ਸ਼ੇਰ ਵਰਗਾ ਰੂਪ ਧਾਰਨ ਨਾਲ ਉਹ ਬਹਾਦਰ ਨਹੀਂ ਬਣ ਗਿਆ। ਇਸੇ ਤਰ੍ਹਾਂ ਖ਼ਾਲਸੇ ਦਾ ਰੂਪ ਧਾਰਨਾ ਕਾਫ਼ੀ ਨਹੀਂ। ਸੱਚੇ ਖ਼ਾਲਸੇ ਦਾ ਦਿਲ ਵੀ ਸ਼ੇਰ ਵਰਗਾ ਹੋਣਾ ਚਾਹੀਦਾ ਹੈ: ਬਹਾਦਰ, ਸੱਚਾ, ਦਇਆਵਾਨ ਅਤੇ ਦੂਜਿਆਂ ਦੀ ਰੱਖਿਆ ਲਈ ਤਿਆਰ।\"",
"ਸਿੱਖ ਮਜ਼ੇਦਾਰ ਖੋਤੇ ਉੱਤੇ ਹੱਸੇ, ਪਰ ਉਨ੍ਹਾਂ ਨੇ ਇਹ ਸਬਕ ਕਦੇ ਨਾ ਭੁਲਾਇਆ।"],
l:"ਅਸੀਂ ਅੰਦਰੋਂ ਕੀ ਹਾਂ, ਇਹ ਬਾਹਰੋਂ ਦਿੱਖ ਨਾਲੋਂ ਵੱਧ ਮਹੱਤਵ ਰੱਖਦਾ ਹੈ। ਸੱਚੇ ਸਿੱਖ ਦੇ ਕੰਮ ਉਸ ਦੇ ਰੂਪ ਨਾਲ ਮੇਲ ਖਾਂਦੇ ਹਨ।"};

PA["golden-arrows"]={t:[
"ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਇੱਕ ਮਹਾਨ ਤੀਰਅੰਦਾਜ਼ ਸਨ। ਲੋਕਾਂ ਨੇ ਉਨ੍ਹਾਂ ਦੇ ਤੀਰਾਂ ਵਿੱਚ ਇੱਕ ਅਨੋਖੀ ਗੱਲ ਵੇਖੀ: ਹਰ ਤੀਰ ਦੀ ਨੋਕ ਉੱਤੇ ਸੋਨੇ ਦਾ ਇੱਕ ਛੋਟਾ ਟੁਕੜਾ ਲੱਗਾ ਹੁੰਦਾ ਸੀ।",
"ਇੱਕ ਸਿੱਖ ਨੇ ਪੁੱਛਿਆ, \"ਗੁਰੂ ਜੀ, ਤੁਸੀਂ ਤੀਰਾਂ ਉੱਤੇ ਸੋਨਾ ਕਿਉਂ ਲਵਾਉਂਦੇ ਹੋ? ਇਹ ਤਾਂ ਬਹੁਤ ਮਹਿੰਗਾ ਹੈ।\"",
"ਗੁਰੂ ਜੀ ਨੇ ਸਮਝਾਇਆ, \"ਅਸੀਂ ਸਿਰਫ਼ ਲੋਕਾਂ ਨੂੰ ਜ਼ੁਲਮ ਤੋਂ ਬਚਾਉਣ ਲਈ ਲੜਦੇ ਹਾਂ, ਕਦੇ ਨਫ਼ਰਤ ਕਰਕੇ ਨਹੀਂ। ਜੇ ਮੇਰਾ ਤੀਰ ਕਿਸੇ ਸਿਪਾਹੀ ਨੂੰ ਜ਼ਖ਼ਮੀ ਕਰੇ, ਤਾਂ ਇਸ ਸੋਨੇ ਨਾਲ ਉਸ ਦਾ ਇਲਾਜ ਹੋ ਸਕੇ ਅਤੇ ਉਹ ਠੀਕ ਹੋ ਜਾਵੇ। ਅਤੇ ਜੇ ਉਹ ਮਰ ਜਾਵੇ, ਤਾਂ ਇਹ ਸੋਨਾ ਉਸ ਦੇ ਪਰਿਵਾਰ ਨੂੰ ਉਸ ਦੀਆਂ ਅੰਤਿਮ ਰਸਮਾਂ ਸਨਮਾਨ ਨਾਲ ਕਰਨ ਵਿੱਚ ਮਦਦ ਕਰੇ।\"",
"ਸਿੱਖ ਹੈਰਾਨ ਰਹਿ ਗਏ। ਆਪਣੇ ਵਿਰੁੱਧ ਲੜਨ ਵਾਲੇ ਸਿਪਾਹੀਆਂ ਪ੍ਰਤੀ ਵੀ ਗੁਰੂ ਜੀ ਪਰਵਾਹ ਅਤੇ ਦਇਆ ਰੱਖਦੇ ਸਨ।",
"ਇਹੀ ਗੁਰੂ ਜੀ ਦਾ ਰਾਹ ਸੀ: ਸੰਤ ਵੀ ਹੋਣਾ ਅਤੇ ਸਿਪਾਹੀ ਵੀ, ਬੇਇਨਸਾਫ਼ੀ ਦਾ ਮੁਕਾਬਲਾ ਕਰਨ ਜੋਗਾ ਤਕੜਾ, ਪਰ ਹਰ ਮਨੁੱਖ ਲਈ ਦਇਆਵਾਨ।"],
l:"ਸੰਘਰਸ਼ ਵਿੱਚ ਵੀ ਕਦੇ ਦਇਆ ਨਾ ਗੁਆਓ। ਗੁਰੂ ਜੀ ਹਰ ਮਨੁੱਖ ਦੀ ਪਰਵਾਹ ਕਰਦੇ ਸਨ, ਆਪਣੇ ਦੁਸ਼ਮਣਾਂ ਦੀ ਵੀ।"};

PA["mai-bhago"]={t:[
"ਅਨੰਦਪੁਰ ਸਾਹਿਬ ਦੇ ਲੰਮੇ ਘੇਰੇ ਦੌਰਾਨ ਰਸਦ ਮੁੱਕ ਗਈ ਅਤੇ ਜੀਵਨ ਬਹੁਤ ਔਖਾ ਹੋ ਗਿਆ। ਮਾਝੇ ਇਲਾਕੇ ਦੇ ਚਾਲੀ ਸਿੱਖਾਂ ਦੇ ਇੱਕ ਜਥੇ ਨੇ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨੂੰ ਕਿਹਾ ਕਿ ਉਹ ਘਰ ਜਾਣਾ ਚਾਹੁੰਦੇ ਹਨ। ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਬੇਦਾਵਾ ਲਿਖਣ ਲਈ ਕਿਹਾ, ਭਾਵ ਇੱਕ ਲਿਖਤ ਕਿ ਉਹ ਹੁਣ ਉਨ੍ਹਾਂ ਦੇ ਸਿੱਖ ਨਹੀਂ ਹਨ। ਉਨ੍ਹਾਂ ਨੇ ਦਸਤਖ਼ਤ ਕੀਤੇ ਅਤੇ ਚਲੇ ਗਏ।",
"ਜਦੋਂ ਉਹ ਘਰ ਪਹੁੰਚੇ, ਪਿੰਡ ਝਬਾਲ ਦੀ ਇੱਕ ਬਹਾਦਰ ਬੀਬੀ, ਮਾਈ ਭਾਗੋ ਜੀ, ਨੇ ਸਾਰੀ ਗੱਲ ਸੁਣੀ। ਉਨ੍ਹਾਂ ਨੇ ਦ੍ਰਿੜ੍ਹਤਾ ਨਾਲ ਕਿਹਾ ਕਿ ਤੁਸੀਂ ਗੁਰੂ ਨੂੰ ਉਦੋਂ ਪਿੱਠ ਵਿਖਾਈ ਜਦੋਂ ਉਨ੍ਹਾਂ ਨੂੰ ਤੁਹਾਡੀ ਸਭ ਤੋਂ ਵੱਧ ਲੋੜ ਸੀ। ਉਨ੍ਹਾਂ ਦੇ ਬੋਲ ਸਿੱਖਾਂ ਦੇ ਦਿਲ ਨੂੰ ਲੱਗ ਗਏ। ਮਾਈ ਭਾਗੋ ਜੀ ਨੇ ਸੰਜੋਅ ਪਹਿਨੀ ਅਤੇ ਚਾਲੀਆਂ ਨੂੰ ਨਾਲ ਲੈ ਕੇ ਗੁਰੂ ਜੀ ਦੀ ਭਾਲ ਵਿੱਚ ਤੁਰ ਪਏ।",
"ਉਹ ਖਿਦਰਾਣੇ ਦੀ ਢਾਬ ਨੇੜੇ ਗੁਰੂ ਜੀ ਕੋਲ ਉਦੋਂ ਪਹੁੰਚੇ ਜਦੋਂ ਮੁਗ਼ਲ ਫ਼ੌਜਾਂ ਨੇੜੇ ਆ ਰਹੀਆਂ ਸਨ। ਚਾਲੀਆਂ ਨੇ ਮਾਈ ਭਾਗੋ ਜੀ ਨਾਲ ਮਿਲ ਕੇ ਬੜੀ ਬਹਾਦਰੀ ਨਾਲ ਜੰਗ ਕੀਤੀ। ਲਗਭਗ ਸਾਰੇ ਚਾਲੀ ਸ਼ਹੀਦ ਹੋ ਗਏ।",
"ਗੁਰੂ ਜੀ ਹਰ ਇੱਕ ਕੋਲ ਗਏ। ਆਖ਼ਰੀ, ਭਾਈ ਮਹਾਂ ਸਿੰਘ ਜੀ, ਅਜੇ ਜਿਉਂਦੇ ਸਨ ਅਤੇ ਉਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਬੇਦਾਵਾ ਪਾੜਨ ਦੀ ਬੇਨਤੀ ਕੀਤੀ। ਗੁਰੂ ਜੀ ਨੇ ਬੇਦਾਵਾ ਪਾੜ ਦਿੱਤਾ ਅਤੇ ਸਭ ਨੂੰ ਮਾਫ਼ ਕਰ ਦਿੱਤਾ। ਉਨ੍ਹਾਂ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਚਾਲੀ ਮੁਕਤੇ ਕਿਹਾ। ਇਹ ਥਾਂ ਸ੍ਰੀ ਮੁਕਤਸਰ ਸਾਹਿਬ ਵਜੋਂ ਜਾਣੀ ਗਈ।",
"ਮਾਈ ਭਾਗੋ ਜੀ ਜ਼ਖ਼ਮੀ ਹੋਏ ਪਰ ਬਚ ਗਏ। ਉਹ ਗੁਰੂ ਜੀ ਦੇ ਨਾਲ ਰਹੇ ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਸਿੱਖ ਇਤਿਹਾਸ ਦੀਆਂ ਸਭ ਤੋਂ ਬਹਾਦਰ ਬੀਬੀਆਂ ਵਿੱਚੋਂ ਇੱਕ ਵਜੋਂ ਯਾਦ ਕੀਤਾ ਜਾਂਦਾ ਹੈ।"],
l:"ਵਾਪਸ ਮੁੜ ਕੇ ਸਹੀ ਕੰਮ ਕਰਨ ਲਈ ਕਦੇ ਦੇਰ ਨਹੀਂ ਹੁੰਦੀ। ਬਹਾਦਰੀ ਕਿਸੇ ਵਿੱਚੋਂ ਵੀ ਜਾਗ ਸਕਦੀ ਹੈ।"};

PA["chhote-sahibzade"]={t:[
"ਜਦੋਂ 1704 ਦੀ ਠੰਢੀ ਸਰਦੀ ਵਿੱਚ ਸਿੱਖਾਂ ਨੇ ਅਨੰਦਪੁਰ ਸਾਹਿਬ ਛੱਡਿਆ, ਹੜ੍ਹ ਆਈ ਸਰਸਾ ਨਦੀ ਪਾਰ ਕਰਦਿਆਂ ਗੁਰੂ ਜੀ ਦਾ ਪਰਿਵਾਰ ਵਿੱਛੜ ਗਿਆ। ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਦੇ ਦੋ ਛੋਟੇ ਸਾਹਿਬਜ਼ਾਦੇ, ਲਗਭਗ ਨੌਂ ਸਾਲ ਦੇ ਬਾਬਾ ਜ਼ੋਰਾਵਰ ਸਿੰਘ ਜੀ ਅਤੇ ਲਗਭਗ ਛੇ ਸਾਲ ਦੇ ਬਾਬਾ ਫ਼ਤਿਹ ਸਿੰਘ ਜੀ, ਆਪਣੇ ਦਾਦੀ ਜੀ, ਮਾਤਾ ਗੁਜਰੀ ਜੀ, ਦੇ ਨਾਲ ਗਏ।",
"ਗੰਗੂ ਨਾਂ ਦੇ ਇੱਕ ਪੁਰਾਣੇ ਨੌਕਰ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਪਨਾਹ ਦਿੱਤੀ, ਪਰ ਫਿਰ ਧੋਖਾ ਦੇ ਕੇ ਅਫ਼ਸਰਾਂ ਦੇ ਹਵਾਲੇ ਕਰ ਦਿੱਤਾ। ਤਿੰਨਾਂ ਨੂੰ ਸਰਹਿੰਦ ਲਿਜਾ ਕੇ ਦਸੰਬਰ ਦੀਆਂ ਕੜਾਕੇ ਦੀ ਠੰਢ ਵਾਲੀਆਂ ਰਾਤਾਂ ਵਿੱਚ ਠੰਢੇ ਬੁਰਜ ਵਿੱਚ ਰੱਖਿਆ ਗਿਆ। ਮਾਤਾ ਗੁਜਰੀ ਜੀ ਨੇ ਆਪਣੇ ਪਿਆਰ ਨਾਲ ਬੱਚਿਆਂ ਨੂੰ ਨਿੱਘ ਦਿੱਤਾ ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਉਨ੍ਹਾਂ ਦੇ ਦਾਦਾ ਗੁਰੂ ਤੇਗ ਬਹਾਦਰ ਜੀ ਅਤੇ ਪੜਦਾਦਾ ਜੀ ਦੇ ਪਿਤਾ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਦੀਆਂ ਸਾਖੀਆਂ ਸੁਣਾਈਆਂ।",
"ਸਾਹਿਬਜ਼ਾਦਿਆਂ ਨੂੰ ਸੂਬੇਦਾਰ ਵਜ਼ੀਰ ਖ਼ਾਨ ਦੀ ਕਚਹਿਰੀ ਵਿੱਚ ਲਿਆਂਦਾ ਗਿਆ। ਉਨ੍ਹਾਂ ਨੇ ਅੰਦਰ ਵੜਦਿਆਂ ਹੀ ਉੱਚੀ ਆਵਾਜ਼ ਵਿੱਚ ਫ਼ਤਿਹ ਬੁਲਾਈ: \"ਵਾਹਿਗੁਰੂ ਜੀ ਕਾ ਖ਼ਾਲਸਾ, ਵਾਹਿਗੁਰੂ ਜੀ ਕੀ ਫ਼ਤਿਹ!\" ਉਨ੍ਹਾਂ ਨੂੰ ਧਰਮ ਛੱਡਣ ਦੇ ਬਦਲੇ ਧਨ-ਦੌਲਤ ਅਤੇ ਸੁਖ-ਆਰਾਮ ਦੇ ਲਾਲਚ ਦਿੱਤੇ ਗਏ। ਉਨ੍ਹਾਂ ਨੇ ਨਿਡਰ ਹੋ ਕੇ ਵਾਰ-ਵਾਰ ਇਨਕਾਰ ਕਰ ਦਿੱਤਾ।",
"ਸੂਬੇਦਾਰ ਨੇ ਹੁਕਮ ਦਿੱਤਾ ਕਿ ਉਨ੍ਹਾਂ ਨੂੰ ਜਿਉਂਦੇ ਜੀ ਨੀਹਾਂ ਵਿੱਚ ਚਿਣ ਦਿੱਤਾ ਜਾਵੇ। ਛੋਟੇ ਸਾਹਿਬਜ਼ਾਦੇ ਸ਼ਾਂਤ ਰਹੇ, ਅਖ਼ੀਰ ਤੱਕ ਸਿੱਖੀ ਸਿਦਕ ਨਿਭਾਇਆ, ਅਤੇ ਸ਼ਹੀਦ ਹੋ ਗਏ। ਜਦੋਂ ਮਾਤਾ ਗੁਜਰੀ ਜੀ ਨੇ ਇਹ ਖ਼ਬਰ ਸੁਣੀ, ਉਹ ਵੀ ਇਸ ਸੰਸਾਰ ਤੋਂ ਚਲੇ ਗਏ।",
"ਇੱਕ ਅਮੀਰ ਸਿੱਖ ਸ਼ਰਧਾਲੂ, ਦੀਵਾਨ ਟੋਡਰ ਮੱਲ, ਨੇ ਸੋਨੇ ਦੀਆਂ ਮੋਹਰਾਂ ਖੜ੍ਹੀਆਂ ਕਰਕੇ ਮੰਗੀ ਗਈ ਕੀਮਤ ਦੇ ਕੇ ਉਨ੍ਹਾਂ ਦੇ ਸਸਕਾਰ ਲਈ ਜ਼ਮੀਨ ਖ਼ਰੀਦੀ ਅਤੇ ਉਨ੍ਹਾਂ ਦਾ ਸਨਮਾਨ ਕੀਤਾ। ਅੱਜ ਸਰਹਿੰਦ ਵਿੱਚ ਗੁਰਦੁਆਰਾ ਫ਼ਤਿਹਗੜ੍ਹ ਸਾਹਿਬ ਹੈ, ਅਤੇ ਹਰ ਦਸੰਬਰ ਦੁਨੀਆ ਭਰ ਦੇ ਸਿੱਖ ਉਨ੍ਹਾਂ ਦੀ ਬਹਾਦਰੀ ਨੂੰ ਯਾਦ ਕਰਦੇ ਹਨ।"],
l:"ਬਹਾਦਰੀ ਉਮਰ ਉੱਤੇ ਨਿਰਭਰ ਨਹੀਂ ਕਰਦੀ। ਸਾਹਿਬਜ਼ਾਦਿਆਂ ਨੇ ਵਿਖਾਇਆ ਕਿ ਸਿਦਕ ਅਤੇ ਸੱਚ ਕਿਸੇ ਵੀ ਇਨਾਮ ਨਾਲੋਂ ਕੀਮਤੀ ਹਨ।"};

PA["vadde-sahibzade"]={t:[
"ਦਸੰਬਰ 1704 ਵਿੱਚ ਅਨੰਦਪੁਰ ਸਾਹਿਬ ਛੱਡਣ ਤੋਂ ਬਾਅਦ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਆਪਣੇ ਦੋ ਵੱਡੇ ਸਾਹਿਬਜ਼ਾਦਿਆਂ ਅਤੇ ਲਗਭਗ ਚਾਲੀ ਸਿੱਖਾਂ ਨਾਲ ਚਮਕੌਰ ਪਹੁੰਚੇ। ਉਨ੍ਹਾਂ ਨੇ ਇੱਕ ਛੋਟੀ ਕੱਚੀ ਗੜ੍ਹੀ ਵਿੱਚ ਮੋਰਚਾ ਲਾਇਆ। ਇੱਕ ਬਹੁਤ ਵੱਡੀ ਮੁਗ਼ਲ ਫ਼ੌਜ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਘੇਰ ਲਿਆ।",
"ਸਿੱਖ ਪੰਜ-ਪੰਜ ਦੇ ਛੋਟੇ ਜਥਿਆਂ ਵਿੱਚ ਫ਼ੌਜ ਦਾ ਮੁਕਾਬਲਾ ਕਰਨ ਲਈ ਬਾਹਰ ਨਿਕਲਦੇ, ਤਾਂ ਜੋ ਬਾਕੀ ਗੜ੍ਹੀ ਦੀ ਰੱਖਿਆ ਕਰ ਸਕਣ। ਹਰ ਜਥੇ ਨੇ ਬੜੀ ਬਹਾਦਰੀ ਨਾਲ ਜੰਗ ਕੀਤੀ।",
"ਗੁਰੂ ਜੀ ਦੇ ਵੱਡੇ ਸਾਹਿਬਜ਼ਾਦੇ, ਲਗਭਗ ਸਤਾਰਾਂ ਸਾਲ ਦੇ ਬਾਬਾ ਅਜੀਤ ਸਿੰਘ ਜੀ, ਨੇ ਪਿਤਾ ਜੀ ਤੋਂ ਬਾਹਰ ਜਾ ਕੇ ਜੰਗ ਕਰਨ ਦੀ ਆਗਿਆ ਮੰਗੀ। ਗੁਰੂ ਜੀ ਨੇ ਥਾਪੜਾ ਦਿੱਤਾ, ਅਤੇ ਉਹ ਬਹਾਦਰੀ ਨਾਲ ਜੂਝਦੇ ਹੋਏ ਸ਼ਹੀਦ ਹੋ ਗਏ।",
"ਫਿਰ ਛੋਟੇ ਭਰਾ, ਸਿਰਫ਼ ਲਗਭਗ ਚੌਦਾਂ ਸਾਲ ਦੇ ਬਾਬਾ ਜੁਝਾਰ ਸਿੰਘ ਜੀ, ਨੇ ਵੀ ਜਾਣ ਦੀ ਆਗਿਆ ਮੰਗੀ। ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਗਲਵੱਕੜੀ ਪਾਈ, ਅਸੀਸ ਦਿੱਤੀ, ਅਤੇ ਤੋਰ ਦਿੱਤਾ। ਉਹ ਵੀ ਬਹਾਦਰੀ ਨਾਲ ਜੂਝੇ ਅਤੇ ਸ਼ਹੀਦ ਹੋ ਗਏ। ਗੁਰੂ ਜੀ ਨੇ ਆਪਣੇ ਦੋਵਾਂ ਪੁੱਤਰਾਂ ਨੂੰ ਸ਼ਾਂਤੀ ਅਤੇ ਮਾਣ ਨਾਲ ਵੇਖਿਆ, ਅਤੇ ਵਾਹਿਗੁਰੂ ਦਾ ਸ਼ੁਕਰ ਕੀਤਾ।",
"ਉਸ ਰਾਤ ਬਾਕੀ ਬਚੇ ਸਿੱਖਾਂ ਨੇ ਪੰਜ ਪਿਆਰਿਆਂ ਦੇ ਰੂਪ ਵਿੱਚ ਗੁਰੂ ਜੀ ਨੂੰ ਹੁਕਮ ਕੀਤਾ ਕਿ ਉਹ ਗੜ੍ਹੀ ਛੱਡ ਜਾਣ, ਤਾਂ ਜੋ ਖ਼ਾਲਸੇ ਦੀ ਅਗਵਾਈ ਕਰਦੇ ਰਹਿਣ। ਗੁਰੂ ਜੀ ਨੇ ਖ਼ਾਲਸੇ ਦਾ ਹੁਕਮ ਮੰਨਿਆ। ਅੱਜ ਚਮਕੌਰ ਸਾਹਿਬ ਵਿਖੇ ਗੁਰਦੁਆਰਾ ਕਤਲਗੜ੍ਹ ਸਾਹਿਬ ਸੁਸ਼ੋਭਿਤ ਹੈ।"],
l:"ਗੁਰੂ ਜੀ ਨੇ ਸੱਚ ਅਤੇ ਇਨਸਾਫ਼ ਲਈ ਆਪਣਾ ਸਭ ਕੁਝ, ਆਪਣੇ ਪੁੱਤਰ ਵੀ, ਵਾਰ ਦਿੱਤੇ। ਖ਼ਾਲਸੇ ਦੇ ਬਚਨ ਦਾ ਗੁਰੂ ਜੀ ਨੇ ਵੀ ਸਤਿਕਾਰ ਕੀਤਾ।"};

PA["budhu-shah"]={t:[
"ਪੀਰ ਬੁੱਧੂ ਸ਼ਾਹ ਸਢੌਰੇ ਦੇ ਇੱਕ ਸਤਿਕਾਰਯੋਗ ਸੂਫ਼ੀ ਫ਼ਕੀਰ ਸਨ। ਉਹ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨੂੰ ਪਿਆਰ ਅਤੇ ਸਤਿਕਾਰ ਕਰਦੇ ਸਨ, ਅਤੇ ਦੋਵੇਂ ਅਕਸਰ ਮਿਲਦੇ ਸਨ।",
"ਇੱਕ ਵਾਰ ਪੀਰ ਬੁੱਧੂ ਸ਼ਾਹ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਬੇਨਤੀ ਕੀਤੀ ਕਿ ਮੁਗ਼ਲ ਫ਼ੌਜ ਵਿੱਚੋਂ ਕੱਢੇ ਗਏ ਪੰਜ ਸੌ ਪਠਾਣ ਸਿਪਾਹੀਆਂ ਨੂੰ ਕੰਮ ਦਿੱਤਾ ਜਾਵੇ। ਗੁਰੂ ਜੀ ਮੰਨ ਗਏ, ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਆਪਣੀ ਫ਼ੌਜ ਵਿੱਚ ਰੱਖ ਲਿਆ।",
"1688 ਵਿੱਚ ਪਹਾੜੀ ਰਾਜਿਆਂ ਨੇ ਭੰਗਾਣੀ ਵਿਖੇ ਗੁਰੂ ਜੀ ਉੱਤੇ ਹਮਲਾ ਕੀਤਾ। ਜੰਗ ਤੋਂ ਇੱਕ ਰਾਤ ਪਹਿਲਾਂ ਬਹੁਤੇ ਪਠਾਣ ਸਿਪਾਹੀ ਭੱਜ ਕੇ ਦੂਜੇ ਪਾਸੇ ਜਾ ਰਲੇ। ਜਦੋਂ ਪੀਰ ਬੁੱਧੂ ਸ਼ਾਹ ਨੇ ਇਹ ਸੁਣਿਆ, ਉਹ ਸ਼ਰਮਿੰਦੇ ਹੋਏ। ਉਹ ਆਪ ਆਪਣੇ ਚਾਰ ਪੁੱਤਰਾਂ ਅਤੇ ਸੱਤ ਸੌ ਮੁਰੀਦਾਂ ਨਾਲ ਗੁਰੂ ਜੀ ਦੇ ਨਾਲ ਲੜਨ ਲਈ ਜੰਗ ਦੇ ਮੈਦਾਨ ਵਿੱਚ ਆ ਗਏ।",
"ਗੁਰੂ ਜੀ ਦੀ ਜਿੱਤ ਹੋਈ, ਪਰ ਪੀਰ ਬੁੱਧੂ ਸ਼ਾਹ ਦੇ ਦੋ ਪੁੱਤਰ ਜੰਗ ਵਿੱਚ ਸ਼ਹੀਦ ਹੋ ਗਏ। ਗੁਰੂ ਜੀ ਉਨ੍ਹਾਂ ਦੀ ਵਫ਼ਾਦਾਰੀ ਤੋਂ ਬਹੁਤ ਪ੍ਰਭਾਵਿਤ ਹੋਏ।",
"ਗੁਰੂ ਜੀ ਉਨ੍ਹਾਂ ਦਾ ਧੰਨਵਾਦ ਕਰਨਾ ਚਾਹੁੰਦੇ ਸਨ। ਪੀਰ ਬੁੱਧੂ ਸ਼ਾਹ ਨੇ ਸਿਰਫ਼ ਉਹ ਕੰਘਾ ਮੰਗਿਆ ਜੋ ਗੁਰੂ ਜੀ ਨੇ ਹੁਣੇ ਵਰਤਿਆ ਸੀ। ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਕੇਸਾਂ ਸਮੇਤ ਕੰਘਾ, ਇੱਕ ਦਸਤਾਰ ਅਤੇ ਇੱਕ ਕਿਰਪਾਨ ਬਖ਼ਸ਼ੀ। ਇਹ ਨਿਸ਼ਾਨੀਆਂ ਉਨ੍ਹਾਂ ਦੇ ਪਰਿਵਾਰ ਨੇ ਪੀੜ੍ਹੀਆਂ ਤੱਕ ਸਾਂਭ ਕੇ ਰੱਖੀਆਂ।"],
l:"ਸੱਚੀ ਮਿੱਤਰਤਾ ਧਰਮ ਦੀ ਹਰ ਹੱਦ ਪਾਰ ਕਰ ਜਾਂਦੀ ਹੈ। ਵਫ਼ਾਦਾਰੀ ਦਾ ਅਰਥ ਹੈ ਲੋੜ ਵੇਲੇ ਕਿਸੇ ਦੇ ਨਾਲ ਖੜ੍ਹਨਾ।"};

PA["banda-singh"]={t:[
"ਲਛਮਣ ਦੇਵ ਦਾ ਜਨਮ 1670 ਵਿੱਚ ਰਾਜੌਰੀ ਦੀਆਂ ਪਹਾੜੀਆਂ ਵਿੱਚ ਹੋਇਆ। ਜਵਾਨੀ ਵਿੱਚ ਉਹ ਸ਼ਿਕਾਰ ਖੇਡਣ ਗਿਆ ਅਤੇ ਇੱਕ ਗਰਭਵਤੀ ਹਿਰਨੀ ਨੂੰ ਤੀਰ ਮਾਰ ਦਿੱਤਾ। ਡੂੰਘੇ ਦੁੱਖ ਵਿੱਚ ਉਸ ਨੇ ਦੁਨਿਆਵੀ ਜੀਵਨ ਤਿਆਗ ਦਿੱਤਾ ਅਤੇ ਮਾਧੋ ਦਾਸ ਨਾਂ ਦਾ ਬੈਰਾਗੀ ਬਣ ਗਿਆ। ਉਹ ਨਾਂਦੇੜ ਵਿੱਚ ਗੋਦਾਵਰੀ ਨਦੀ ਕੰਢੇ ਰਹਿੰਦਾ ਸੀ, ਅਤੇ ਲੋਕ ਕਹਿੰਦੇ ਸਨ ਕਿ ਉਸ ਕੋਲ ਕਰਾਮਾਤੀ ਸ਼ਕਤੀਆਂ ਹਨ।",
"1708 ਵਿੱਚ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨਾਂਦੇੜ ਆਏ ਅਤੇ ਮਾਧੋ ਦਾਸ ਦੇ ਪਲੰਘ ਉੱਤੇ ਬੈਠ ਗਏ। ਮਾਧੋ ਦਾਸ ਨੂੰ ਗੁੱਸਾ ਆਇਆ ਅਤੇ ਉਸ ਨੇ ਆਪਣੀਆਂ ਸ਼ਕਤੀਆਂ ਨਾਲ ਗੁਰੂ ਜੀ ਨੂੰ ਡੇਗਣ ਦੀ ਕੋਸ਼ਿਸ਼ ਕੀਤੀ, ਪਰ ਕੁਝ ਨਾ ਹੋਇਆ। ਫਿਰ ਉਸ ਨੇ ਗੁਰੂ ਜੀ ਦੀਆਂ ਸ਼ਾਂਤ ਅੱਖਾਂ ਵਿੱਚ ਵੇਖਿਆ ਅਤੇ ਸਮਝ ਗਿਆ ਕਿ ਉਹ ਕੌਣ ਹਨ। ਉਹ ਗੁਰੂ ਜੀ ਦੇ ਚਰਨਾਂ ਉੱਤੇ ਡਿੱਗ ਪਿਆ ਅਤੇ ਬੋਲਿਆ, \"ਮੈਂ ਤੁਹਾਡਾ ਬੰਦਾ ਹਾਂ।\"",
"ਗੁਰੂ ਜੀ ਨੇ ਉਸ ਨੂੰ ਅੰਮ੍ਰਿਤ ਛਕਾਇਆ ਅਤੇ ਨਵਾਂ ਨਾਂ ਬੰਦਾ ਸਿੰਘ ਬਖ਼ਸ਼ਿਆ। ਉਨ੍ਹਾਂ ਨੇ ਉਸ ਨੂੰ ਪੰਜ ਤੀਰ, ਇੱਕ ਨਗਾਰਾ ਅਤੇ ਨਿਸ਼ਾਨ ਸਾਹਿਬ ਦਿੱਤਾ, ਪੰਜ ਸਿੱਖ ਨਾਲ ਭੇਜੇ, ਅਤੇ ਪੰਜਾਬ ਜਾ ਕੇ ਗਰੀਬਾਂ ਦੀ ਜ਼ੁਲਮ ਤੋਂ ਰੱਖਿਆ ਕਰਨ ਲਈ ਕਿਹਾ।",
"ਬੰਦਾ ਸਿੰਘ ਬਹਾਦਰ ਨੇ ਕਿਸਾਨਾਂ ਅਤੇ ਆਮ ਲੋਕਾਂ ਨੂੰ ਇਕੱਠਾ ਕੀਤਾ ਅਤੇ ਕਈ ਜੰਗਾਂ ਜਿੱਤੀਆਂ। 1710 ਵਿੱਚ ਉਸ ਨੇ ਪਹਿਲਾ ਸਿੱਖ ਰਾਜ ਕਾਇਮ ਕੀਤਾ, ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਅਤੇ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਦੇ ਨਾਂ ਉੱਤੇ ਸਿੱਕੇ ਚਲਾਏ, ਅਤੇ ਜ਼ਮੀਨ ਅਮੀਰ ਜ਼ਿਮੀਂਦਾਰਾਂ ਦੀ ਥਾਂ ਉਸ ਨੂੰ ਵਾਹੁਣ ਵਾਲੇ ਕਿਸਾਨਾਂ ਨੂੰ ਦਿੱਤੀ।",
"1716 ਵਿੱਚ ਉਸ ਨੂੰ ਫੜ ਕੇ ਦਿੱਲੀ ਲਿਜਾਇਆ ਗਿਆ, ਜਿੱਥੇ ਉਸ ਨੇ ਧਰਮ ਛੱਡਣ ਤੋਂ ਇਨਕਾਰ ਕਰਦਿਆਂ ਸ਼ਹੀਦੀ ਪਾਈ। ਉਸ ਨੂੰ ਸਭ ਤੋਂ ਮਹਾਨ ਸਿੱਖ ਸੂਰਮਿਆਂ ਵਿੱਚੋਂ ਇੱਕ ਵਜੋਂ ਯਾਦ ਕੀਤਾ ਜਾਂਦਾ ਹੈ।"],
l:"ਇੱਕ ਹੰਕਾਰੀ ਮਨੁੱਖ ਵੀ ਬਦਲ ਕੇ ਸੱਚ ਦਾ ਸੇਵਕ ਬਣ ਸਕਦਾ ਹੈ। ਸੱਚੇ ਆਗੂ ਆਮ ਲੋਕਾਂ ਦੀ ਰੱਖਿਆ ਕਰਦੇ ਹਨ।"};

PA["baba-deep-singh"]={t:[
"ਬਾਬਾ ਦੀਪ ਸਿੰਘ ਜੀ ਨੇ ਆਪ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਤੋਂ ਅੰਮ੍ਰਿਤ ਛਕਿਆ ਸੀ। ਉਹ ਦਮਦਮਾ ਸਾਹਿਬ ਵਿਖੇ ਇੱਕ ਮਹਾਨ ਵਿਦਵਾਨ ਬਣੇ, ਜਿੱਥੇ ਉਹ ਗੁਰਬਾਣੀ ਪੜ੍ਹਾਉਂਦੇ ਅਤੇ ਆਪਣੇ ਹੱਥੀਂ ਬੜੇ ਧਿਆਨ ਨਾਲ ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਜੀ ਦੇ ਉਤਾਰੇ ਲਿਖਦੇ, ਤਾਂ ਜੋ ਗੁਰਬਾਣੀ ਹਰ ਥਾਂ ਸਿੱਖਾਂ ਤੱਕ ਪਹੁੰਚ ਸਕੇ।",
"1757 ਵਿੱਚ ਜਹਾਨ ਖ਼ਾਨ ਨਾਂ ਦੇ ਇੱਕ ਅਫ਼ਗ਼ਾਨ ਸੈਨਾਪਤੀ ਨੇ ਅੰਮ੍ਰਿਤਸਰ ਉੱਤੇ ਹਮਲਾ ਕੀਤਾ। ਉਸ ਦੇ ਸਿਪਾਹੀਆਂ ਨੇ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਦੀ ਬੇਅਦਬੀ ਕੀਤੀ ਅਤੇ ਪਵਿੱਤਰ ਸਰੋਵਰ ਨੂੰ ਮਲਬੇ ਨਾਲ ਭਰ ਦਿੱਤਾ।",
"ਬਾਬਾ ਦੀਪ ਸਿੰਘ ਜੀ ਲਗਭਗ ਪਚੱਤਰ ਸਾਲ ਦੇ ਸਨ। ਜਦੋਂ ਉਨ੍ਹਾਂ ਨੇ ਇਹ ਖ਼ਬਰ ਸੁਣੀ, ਉਨ੍ਹਾਂ ਨੇ ਧਰਤੀ ਉੱਤੇ ਇੱਕ ਲਕੀਰ ਖਿੱਚੀ ਅਤੇ ਕਿਹਾ, \"ਸਿਰਫ਼ ਉਹੀ ਇਹ ਲਕੀਰ ਪਾਰ ਕਰਨ ਜੋ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਲਈ ਆਪਣੀ ਜਾਨ ਦੇਣ ਲਈ ਤਿਆਰ ਹਨ।\" ਹਜ਼ਾਰਾਂ ਸਿੱਖਾਂ ਨੇ ਲਕੀਰ ਪਾਰ ਕਰ ਲਈ।",
"ਉਹ ਅੰਮ੍ਰਿਤਸਰ ਵੱਲ ਤੁਰ ਪਏ ਅਤੇ ਪਿੰਡ ਗੋਹਲਵੜ ਦੇ ਨੇੜੇ ਇੱਕ ਵੱਡੀ ਫ਼ੌਜ ਨਾਲ ਟੱਕਰ ਹੋਈ। ਬਾਬਾ ਦੀਪ ਸਿੰਘ ਜੀ ਆਪਣੇ ਭਾਰੀ ਖੰਡੇ ਨਾਲ ਨਿਡਰ ਹੋ ਕੇ ਲੜੇ। ਉਨ੍ਹਾਂ ਨੇ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਪਹੁੰਚਣ ਦਾ ਪ੍ਰਣ ਕੀਤਾ ਹੋਇਆ ਸੀ।",
"ਕਹਿੰਦੇ ਹਨ ਕਿ ਧੌਣ ਉੱਤੇ ਗੰਭੀਰ ਜ਼ਖ਼ਮ ਹੋਣ ਤੋਂ ਬਾਅਦ ਵੀ ਉਹ ਆਪਣਾ ਸੀਸ ਤਲੀ ਉੱਤੇ ਟਿਕਾ ਕੇ ਲੜਦੇ ਗਏ, ਅਤੇ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਦੀ ਪਰਿਕਰਮਾ ਤੱਕ ਪਹੁੰਚ ਕੇ ਹੀ ਡਿੱਗੇ। ਅੱਜ ਅੰਮ੍ਰਿਤਸਰ ਵਿੱਚ ਗੁਰਦੁਆਰਾ ਸ਼ਹੀਦ ਬਾਬਾ ਦੀਪ ਸਿੰਘ ਜੀ ਸੁਸ਼ੋਭਿਤ ਹੈ।"],
l:"ਆਪਣੇ ਪ੍ਰਣ ਪੂਰੇ ਦਿਲ ਨਾਲ ਨਿਭਾਓ। ਪਵਿੱਤਰ ਚੀਜ਼ਾਂ ਦੀ ਰੱਖਿਆ ਲਈ ਕਿਸੇ ਵੀ ਉਮਰ ਵਿੱਚ ਹੌਸਲਾ ਚਾਹੀਦਾ ਹੈ।"};

PA["bhai-taru-singh"]={t:[
"ਭਾਈ ਤਾਰੂ ਸਿੰਘ ਜੀ ਅੰਮ੍ਰਿਤਸਰ ਦੇ ਨੇੜੇ ਪਿੰਡ ਪੂਹਲਾ ਦੇ ਇੱਕ ਨੌਜਵਾਨ ਕਿਸਾਨ ਸਨ। ਉਹ ਆਪਣੀ ਮਾਤਾ ਅਤੇ ਭੈਣ ਨਾਲ ਰਹਿੰਦੇ ਸਨ, ਅਤੇ ਜੋ ਵੀ ਉਗਾਉਂਦੇ, ਵੰਡ ਕੇ ਛਕਦੇ ਸਨ।",
"ਉਨ੍ਹਾਂ ਦਿਨਾਂ ਵਿੱਚ ਲਾਹੌਰ ਦਾ ਸੂਬੇਦਾਰ ਜ਼ਕਰੀਆ ਖ਼ਾਨ ਸਿੱਖਾਂ ਦਾ ਸ਼ਿਕਾਰ ਕਰ ਰਿਹਾ ਸੀ, ਅਤੇ ਬਹੁਤ ਸਿੱਖ ਜੰਗਲਾਂ ਵਿੱਚ ਲੁਕੇ ਹੋਏ ਸਨ। ਭਾਈ ਤਾਰੂ ਸਿੰਘ ਜੀ ਅਤੇ ਉਨ੍ਹਾਂ ਦਾ ਪਰਿਵਾਰ ਬਹੁਤ ਖ਼ਤਰੇ ਦੇ ਬਾਵਜੂਦ ਚੋਰੀ-ਚੋਰੀ ਉਨ੍ਹਾਂ ਤੱਕ ਰਸਦ ਪਹੁੰਚਾਉਂਦਾ ਸੀ।",
"ਕਿਸੇ ਨੇ ਮੁਖ਼ਬਰੀ ਕਰ ਦਿੱਤੀ, ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਗ੍ਰਿਫ਼ਤਾਰ ਕਰਕੇ ਲਾਹੌਰ ਲਿਜਾਇਆ ਗਿਆ। ਜ਼ਕਰੀਆ ਖ਼ਾਨ ਨੇ ਕਿਹਾ, \"ਕੇਸ ਕਟਵਾ ਲੈ ਅਤੇ ਧਰਮ ਛੱਡ ਦੇ, ਤਾਂ ਤੂੰ ਆਜ਼ਾਦ ਹੋ ਜਾਵੇਂਗਾ।\"",
"ਭਾਈ ਤਾਰੂ ਸਿੰਘ ਜੀ ਨੇ ਸ਼ਾਂਤੀ ਨਾਲ ਜਵਾਬ ਦਿੱਤਾ ਕਿ ਉਨ੍ਹਾਂ ਦੇ ਕੇਸ ਗੁਰੂ ਦੀ ਬਖ਼ਸ਼ਿਸ਼ ਹਨ, ਅਤੇ ਉਹ ਆਖ਼ਰੀ ਸਾਹ ਤੱਕ ਇਨ੍ਹਾਂ ਨੂੰ ਸਾਂਭ ਕੇ ਰੱਖਣਗੇ। ਗੁੱਸੇ ਵਿੱਚ ਸੂਬੇਦਾਰ ਨੇ ਹੁਕਮ ਦਿੱਤਾ ਕਿ ਉਨ੍ਹਾਂ ਦੇ ਕੇਸ ਖੋਪਰੀ ਸਮੇਤ ਲਾਹ ਦਿੱਤੇ ਜਾਣ। ਭਾਈ ਤਾਰੂ ਸਿੰਘ ਜੀ ਜਪੁਜੀ ਸਾਹਿਬ ਦਾ ਪਾਠ ਕਰਦੇ ਹੋਏ ਸ਼ਾਂਤ ਰਹੇ।",
"ਉਹ ਬਾਈ ਦਿਨ ਹੋਰ ਸ਼ਾਂਤ ਅਤੇ ਸਿਮਰਨ ਵਿੱਚ ਜੁੜੇ ਜਿਉਂਦੇ ਰਹੇ। ਕਹਿੰਦੇ ਹਨ ਕਿ ਜ਼ਕਰੀਆ ਖ਼ਾਨ ਆਪ ਬਿਮਾਰ ਹੋ ਕੇ ਉਨ੍ਹਾਂ ਤੋਂ ਪਹਿਲਾਂ ਮਰ ਗਿਆ। ਭਾਈ ਤਾਰੂ ਸਿੰਘ ਜੀ ਨੂੰ ਭੁੱਖਿਆਂ ਪ੍ਰਤੀ ਉਨ੍ਹਾਂ ਦੀ ਦਇਆ ਅਤੇ ਆਪਣੇ ਕੇਸਾਂ ਨਾਲ ਪਿਆਰ ਲਈ ਯਾਦ ਕੀਤਾ ਜਾਂਦਾ ਹੈ।"],
l:"ਲੋੜਵੰਦਾਂ ਨਾਲ ਵੰਡ ਕੇ ਛਕੋ, ਭਾਵੇਂ ਇਹ ਔਖਾ ਹੋਵੇ। ਗੁਰੂ ਦੀਆਂ ਬਖ਼ਸ਼ਿਸ਼ਾਂ ਨੂੰ ਪਿਆਰ ਨਾਲ ਸਾਂਭਣਾ ਹੀ ਸੱਚਾ ਸਿਦਕ ਹੈ।"};

PA["bhai-mani-singh"]={t:[
"ਭਾਈ ਮਨੀ ਸਿੰਘ ਜੀ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਦੇ ਨਾਲ ਹੀ ਵੱਡੇ ਹੋਏ ਅਤੇ ਸਾਰੀ ਉਮਰ ਉਨ੍ਹਾਂ ਦੀ ਸੇਵਾ ਕੀਤੀ। ਉਹ ਇੱਕ ਮਹਾਨ ਵਿਦਵਾਨ ਸਨ। ਦਮਦਮਾ ਸਾਹਿਬ ਵਿਖੇ ਜਦੋਂ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਬਾਣੀ ਉਚਾਰਦੇ ਗਏ, ਉਨ੍ਹਾਂ ਨੇ ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਜੀ ਲਿਖੇ, ਜੋ ਇੱਕ ਅਨਮੋਲ ਬੀੜ ਹੈ ਅਤੇ ਦਮਦਮੀ ਬੀੜ ਵਜੋਂ ਜਾਣੀ ਜਾਂਦੀ ਹੈ।",
"ਬਾਅਦ ਵਿੱਚ ਉਹ ਅੰਮ੍ਰਿਤਸਰ ਵਿਖੇ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਦੇ ਮੁੱਖ ਗ੍ਰੰਥੀ ਬਣੇ, ਅਤੇ ਬਹੁਤ ਔਖੇ ਸਮਿਆਂ ਵਿੱਚ ਸਿੱਖਾਂ ਦੀ ਸੰਭਾਲ ਕੀਤੀ।",
"1738 ਵਿੱਚ ਉਨ੍ਹਾਂ ਨੇ ਲਾਹੌਰ ਦੇ ਸੂਬੇਦਾਰ ਤੋਂ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਵਿਖੇ ਦੀਵਾਲੀ ਦਾ ਇਕੱਠ ਕਰਨ ਦੀ ਆਗਿਆ ਮੰਗੀ। ਸੂਬੇਦਾਰ ਮੰਨ ਗਿਆ, ਪਰ ਇਸ ਸ਼ਰਤ ਉੱਤੇ ਕਿ ਪੰਜ ਹਜ਼ਾਰ ਰੁਪਏ ਦਾ ਵੱਡਾ ਟੈਕਸ ਦਿੱਤਾ ਜਾਵੇ। ਭਾਈ ਮਨੀ ਸਿੰਘ ਜੀ ਨੂੰ ਆਸ ਸੀ ਕਿ ਉਹ ਸੰਗਤ ਦੀ ਭੇਟਾ ਵਿੱਚੋਂ ਇਹ ਟੈਕਸ ਭਰ ਦੇਣਗੇ।",
"ਪਰ ਸੂਬੇਦਾਰ ਨੇ ਚੋਰੀ-ਚੋਰੀ ਇਕੱਠ ਉੱਤੇ ਹਮਲਾ ਕਰਨ ਦੀ ਸਾਜ਼ਿਸ਼ ਬਣਾਈ। ਭਾਈ ਮਨੀ ਸਿੰਘ ਜੀ ਨੂੰ ਪਤਾ ਲੱਗ ਗਿਆ ਅਤੇ ਉਨ੍ਹਾਂ ਨੇ ਸਿੱਖਾਂ ਦੀ ਸੁਰੱਖਿਆ ਲਈ ਉਨ੍ਹਾਂ ਨੂੰ ਨਾ ਆਉਣ ਦਾ ਸੁਨੇਹਾ ਭੇਜ ਦਿੱਤਾ। ਇਕੱਠ ਨਾ ਹੋਣ ਕਰਕੇ ਭੇਟਾ ਨਾ ਆਈ, ਅਤੇ ਉਹ ਟੈਕਸ ਨਾ ਭਰ ਸਕੇ।",
"ਉਨ੍ਹਾਂ ਨੂੰ ਗ੍ਰਿਫ਼ਤਾਰ ਕਰ ਲਿਆ ਗਿਆ ਅਤੇ ਕਿਹਾ ਗਿਆ ਕਿ ਧਰਮ ਛੱਡੋ ਜਾਂ ਬੰਦ-ਬੰਦ ਕਟਵਾਉਣ ਦੀ ਬੇਰਹਿਮ ਮੌਤ ਲਈ ਤਿਆਰ ਹੋ ਜਾਓ। ਉਨ੍ਹਾਂ ਨੇ ਸ਼ਾਂਤੀ ਨਾਲ ਇਨਕਾਰ ਕਰ ਦਿੱਤਾ, ਅਤੇ ਅੰਤ ਤੱਕ ਜਪੁਜੀ ਸਾਹਿਬ ਦਾ ਪਾਠ ਕਰਦੇ ਰਹੇ। ਸਿੱਖ ਹਰ ਰੋਜ਼ ਅਰਦਾਸ ਵਿੱਚ ਉਨ੍ਹਾਂ ਨੂੰ ਯਾਦ ਕਰਦੇ ਹਨ।"],
l:"ਦੂਜਿਆਂ ਦੀ ਰੱਖਿਆ ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਹੈ। ਵਿੱਦਿਆ, ਸੇਵਾ ਅਤੇ ਬਹਾਦਰੀ ਮਿਲ ਕੇ ਸੱਚਾ ਸਿੱਖ ਬਣਾਉਂਦੇ ਹਨ।"};

PA["ranjit-singh-stone"]={t:[
"ਮਹਾਰਾਜਾ ਰਣਜੀਤ ਸਿੰਘ ਸਿੱਖ ਰਾਜ ਦੇ ਹਾਕਮ ਸਨ, ਅਤੇ ਉਨ੍ਹਾਂ ਦੀ ਰਾਜਧਾਨੀ ਲਾਹੌਰ ਸੀ। ਉਹ ਆਪਣੀ ਪਰਜਾ ਨਾਲ ਇਨਸਾਫ਼ ਅਤੇ ਖੁੱਲ੍ਹ-ਦਿਲੀ ਲਈ ਜਾਣੇ ਜਾਂਦੇ ਸਨ, ਭਾਵੇਂ ਕਿਸੇ ਦਾ ਕੋਈ ਵੀ ਧਰਮ ਹੋਵੇ।",
"ਇੱਕ ਦਿਨ ਜਦੋਂ ਉਹ ਆਪਣੇ ਸਿਪਾਹੀਆਂ ਨਾਲ ਗਲੀਆਂ ਵਿੱਚੋਂ ਲੰਘ ਰਹੇ ਸਨ, ਅਚਾਨਕ ਇੱਕ ਰੋੜਾ ਹਵਾ ਵਿੱਚ ਉੱਡਦਾ ਆਇਆ ਅਤੇ ਉਨ੍ਹਾਂ ਦੇ ਵੱਜਿਆ। ਸਿਪਾਹੀ ਹੈਰਾਨ ਰਹਿ ਗਏ ਅਤੇ ਰੋੜਾ ਮਾਰਨ ਵਾਲੇ ਨੂੰ ਲੱਭਣ ਲਈ ਭੱਜੇ।",
"ਉਹ ਇੱਕ ਬਜ਼ੁਰਗ ਮਾਈ ਅਤੇ ਉਸ ਦੇ ਛੋਟੇ ਪੁੱਤਰ ਨੂੰ ਫੜ ਲਿਆਏ, ਜੋ ਡਰ ਨਾਲ ਕੰਬ ਰਹੇ ਸਨ। \"ਮਹਾਰਾਜ,\" ਮਾਈ ਨੇ ਤਰਲਾ ਕੀਤਾ, \"ਮੇਰੇ ਪੁੱਤਰ ਨੇ ਬੇਰੀ ਤੋਂ ਬੇਰ ਝਾੜਨ ਲਈ ਰੋੜਾ ਮਾਰਿਆ ਸੀ, ਕਿਉਂਕਿ ਸਾਨੂੰ ਭੁੱਖ ਲੱਗੀ ਸੀ। ਭੁਲੇਖੇ ਨਾਲ ਤੁਹਾਡੇ ਵੱਜ ਗਿਆ। ਸਾਨੂੰ ਮਾਫ਼ ਕਰ ਦਿਓ!\"",
"ਸਭ ਸਜ਼ਾ ਦੀ ਉਡੀਕ ਕਰ ਰਹੇ ਸਨ। ਪਰ ਮਹਾਰਾਜੇ ਨੇ ਮੁਸਕਰਾ ਕੇ ਆਪਣੇ ਖ਼ਜ਼ਾਨਚੀ ਨੂੰ ਹੁਕਮ ਦਿੱਤਾ ਕਿ ਉਨ੍ਹਾਂ ਨੂੰ ਪੈਸੇ ਅਤੇ ਰਸਦ ਦਿੱਤੀ ਜਾਵੇ।",
"ਸਿਪਾਹੀ ਹੈਰਾਨ ਹੋਏ। ਮਹਾਰਾਜੇ ਨੇ ਸਮਝਾਇਆ, \"ਜਦੋਂ ਰੁੱਖ ਦੇ ਰੋੜਾ ਵੱਜਦਾ ਹੈ, ਤਾਂ ਉਹ ਮਿੱਠਾ ਫਲ ਦਿੰਦਾ ਹੈ। ਜੇ ਇੱਕ ਰੁੱਖ ਇੰਨਾ ਦਿਆਲੂ ਹੋ ਸਕਦਾ ਹੈ, ਤਾਂ ਮੈਂ, ਇੱਕ ਮਹਾਰਾਜਾ ਹੋ ਕੇ, ਉਸ ਤੋਂ ਘੱਟ ਕਿਵੇਂ ਦੇ ਸਕਦਾ ਹਾਂ?\""],
l:"ਗ਼ਲਤੀਆਂ ਦਾ ਜਵਾਬ ਦਇਆ ਨਾਲ ਦਿਓ। ਚੰਗਾ ਆਗੂ ਫਲਦਾਰ ਰੁੱਖ ਵਾਂਗ ਖੁੱਲ੍ਹੇ ਦਿਲ ਵਾਲਾ ਹੁੰਦਾ ਹੈ।"};
