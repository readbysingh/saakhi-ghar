{id:"companion-mardana",title:"Bhai Mardana, the Guru's Companion",gur:"ਭਾਈ ਮਰਦਾਨਾ",cat:"Guru Nanak Dev Ji",age:"Kids",where:"Sultanpur Lodhi to Lahore",mins:2,c:"#F0702A",c2:"#3B5BDB",h:395,art:"rabab",
year:1504,approx:1,loc:["sultanpur","lahore"],themes:["Sewa","Humility"],
summary:"A musician with a rabab walks beside Guru Nanak for many years. On their very first journey, he learns a lesson about gifts.",
text:["Bhai Mardana was Guru Nanak Dev Ji's closest companion. He was about nine years older than the Guru, and he walked beside him for most of his life: through freezing mountains, burning deserts and thick jungles.","He came from a Muslim family of Mirasis, people who carried messages from village to village and sang as they travelled. Bhai Mardana played the rabab, a stringed instrument, beautifully. Whenever Guru Nanak sang the words that came to him, Bhai Mardana played the tune.","After Guru Ji left his job at Sultanpur, the two set out on foot towards Lahore. Every morning they woke early and bathed. Bhai Mardana played his rabab, and Guru Ji sang in praise of Waheguru. Then Bhai Mardana went to the nearest village to ask for some food.","The villagers treated them like holy men. Along with food, they gave Bhai Mardana clothes and other gifts. He tied them all up in a big bundle and carried it back, very pleased.","Guru Ji smiled and said, 'Bhai Mardana, share these clothes with the poor. If we keep piling up the gifts people give us, we will become greedy, and a greedy person cannot do any good for the world.' Bhai Mardana gave away everything they did not need, and from then on they kept only what they needed for the day."],
lesson:"Keep only what you need and share the rest. Greed grows when we hold on to more than we need.",
think:["Why did Guru Ji ask Bhai Mardana to give the clothes away?","Have you ever shared something you had extra of? How did it feel?"],
words:[["Rabab","A stringed instrument that Bhai Mardana played."],["Mirasi","A family of travelling singers and message-carriers."]],
quiz:[["What instrument did Bhai Mardana play?",["Rabab","Dhol","Flute"],0],["What did the villagers give him with the food?",["Clothes and gifts","A horse","Books"],0],["What did Guru Ji ask him to do with the extra things?",["Share them with the poor","Sell them","Keep them safe"],0]],
pa:{t:["ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦੇ ਸਭ ਤੋਂ ਨੇੜਲੇ ਸਾਥੀ ਸਨ। ਉਹ ਗੁਰੂ ਜੀ ਤੋਂ ਲਗਭਗ ਨੌਂ ਸਾਲ ਵੱਡੇ ਸਨ, ਅਤੇ ਉਨ੍ਹਾਂ ਨੇ ਬਰਫ਼ੀਲੇ ਪਹਾੜਾਂ, ਤਪਦੇ ਰੇਗਿਸਤਾਨਾਂ ਅਤੇ ਸੰਘਣੇ ਜੰਗਲਾਂ ਵਿੱਚ, ਲਗਭਗ ਸਾਰੀ ਉਮਰ ਗੁਰੂ ਜੀ ਦਾ ਸਾਥ ਦਿੱਤਾ।","ਉਹ ਮਿਰਾਸੀਆਂ ਦੇ ਇੱਕ ਮੁਸਲਮਾਨ ਪਰਿਵਾਰ ਵਿੱਚੋਂ ਸਨ, ਜੋ ਪਿੰਡ-ਪਿੰਡ ਸੁਨੇਹੇ ਲੈ ਕੇ ਜਾਂਦੇ ਅਤੇ ਰਾਹ ਵਿੱਚ ਗਾਉਂਦੇ ਸਨ। ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਬਹੁਤ ਸੋਹਣੀ ਰਬਾਬ ਵਜਾਉਂਦੇ ਸਨ। ਜਦੋਂ ਵੀ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਬਾਣੀ ਉਚਾਰਦੇ, ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਰਬਾਬ ਉੱਤੇ ਸੁਰ ਛੇੜਦੇ।","ਸੁਲਤਾਨਪੁਰ ਦੀ ਨੌਕਰੀ ਛੱਡਣ ਤੋਂ ਬਾਅਦ ਦੋਵੇਂ ਪੈਦਲ ਲਾਹੌਰ ਵੱਲ ਤੁਰ ਪਏ। ਹਰ ਸਵੇਰ ਉਹ ਜਲਦੀ ਉੱਠ ਕੇ ਇਸ਼ਨਾਨ ਕਰਦੇ। ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਰਬਾਬ ਵਜਾਉਂਦੇ ਅਤੇ ਗੁਰੂ ਜੀ ਵਾਹਿਗੁਰੂ ਦੀ ਸਿਫ਼ਤ ਗਾਉਂਦੇ। ਫਿਰ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਨੇੜਲੇ ਪਿੰਡ ਤੋਂ ਖਾਣ ਲਈ ਕੁਝ ਮੰਗ ਲਿਆਉਂਦੇ।","ਪਿੰਡ ਵਾਲੇ ਉਨ੍ਹਾਂ ਨੂੰ ਸਾਧੂ-ਸੰਤ ਸਮਝ ਕੇ ਆਦਰ ਦਿੰਦੇ। ਭੋਜਨ ਦੇ ਨਾਲ ਉਨ੍ਹਾਂ ਨੇ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਨੂੰ ਕੱਪੜੇ ਅਤੇ ਹੋਰ ਚੀਜ਼ਾਂ ਵੀ ਦਿੱਤੀਆਂ। ਉਨ੍ਹਾਂ ਨੇ ਸਭ ਕੁਝ ਇੱਕ ਵੱਡੀ ਗੱਠੜੀ ਵਿੱਚ ਬੰਨ੍ਹਿਆ ਅਤੇ ਬੜੇ ਖ਼ੁਸ਼ ਹੋ ਕੇ ਵਾਪਸ ਲੈ ਆਏ।","ਗੁਰੂ ਜੀ ਨੇ ਮੁਸਕਰਾ ਕੇ ਕਿਹਾ, 'ਭਾਈ ਮਰਦਾਨਿਆ, ਇਹ ਕੱਪੜੇ ਗਰੀਬਾਂ ਵਿੱਚ ਵੰਡ ਦੇ। ਜੇ ਅਸੀਂ ਲੋਕਾਂ ਦੀਆਂ ਦਿੱਤੀਆਂ ਚੀਜ਼ਾਂ ਇਕੱਠੀਆਂ ਕਰਦੇ ਰਹਾਂਗੇ, ਤਾਂ ਲਾਲਚੀ ਹੋ ਜਾਵਾਂਗੇ, ਅਤੇ ਲਾਲਚੀ ਮਨੁੱਖ ਦੁਨੀਆ ਦਾ ਕੋਈ ਭਲਾ ਨਹੀਂ ਕਰ ਸਕਦਾ।' ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਨੇ ਲੋੜ ਤੋਂ ਵੱਧ ਸਭ ਕੁਝ ਵੰਡ ਦਿੱਤਾ, ਅਤੇ ਉਸ ਤੋਂ ਬਾਅਦ ਉਹ ਸਿਰਫ਼ ਦਿਨ ਭਰ ਦੀ ਲੋੜ ਜਿੰਨਾ ਹੀ ਰੱਖਦੇ।"],l:"ਜਿੰਨੀ ਲੋੜ ਹੈ ਓਨਾ ਰੱਖੋ ਅਤੇ ਬਾਕੀ ਵੰਡ ਦਿਓ। ਲੋੜ ਤੋਂ ਵੱਧ ਜੋੜਨ ਨਾਲ ਲਾਲਚ ਵਧਦਾ ਹੈ।"}},

{id:"true-prayer",title:"The Prayer in the Mosque",gur:"ਸੱਚੀ ਨਮਾਜ਼",cat:"Guru Nanak Dev Ji",age:"Kids",where:"Sultanpur Lodhi",mins:3,c:"#1FA38A",c2:"#F2B229",h:400,art:"mosque",
year:1499,approx:1,loc:["sultanpur"],themes:["Honesty","Equality","Faith"],
summary:"Guru Nanak is invited to pray in the mosque with the Nawab. Afterwards, he tells them where their minds really were.",
text:["While Guru Nanak Dev Ji worked as the storekeeper at Sultanpur, he went to bathe in the river Bein every morning. One morning he went into the water and did not come out. People searched everywhere, but he could not be found. The whole town was sad.","Three days later, Guru Ji appeared again. The first words he spoke were, 'There is no Hindu and no Muslim.' He meant that we are all children of the same one God.","Nawab Daulat Khan and the Qazi, the town's Muslim judge, heard about this. 'If you believe we are all the same,' they said, 'then come and pray with us in the mosque.' Guru Ji went with them. But when everyone began the namaz, the prayer, he stood quietly and did not join in.","Afterwards the Nawab asked, 'Why didn't you pray with us?' Guru Ji answered gently, 'Whom should I have prayed with? Your body was here, but your mind was in Kandahar, buying horses.' Then he turned to the Qazi: 'And your mind was at home, worrying that your new foal might fall into the well in your yard.'","The Qazi was amazed. 'It's true,' he admitted. 'That is exactly what I was thinking about.' Guru Ji said, 'A prayer is only true when the mind and the body are both in it. Prayer without the mind is only a show.' The Nawab and the Qazi bowed their heads, and from that day they respected Guru Nanak even more."],
lesson:"When we pray, our heart and mind should be in it too. Saying words while thinking of other things is not true prayer.",
think:["Where were the Nawab's thoughts during the prayer?","What helps you keep your mind on your prayers?"],
words:[["Namaz","The Muslim prayer, said five times a day."],["Qazi","A Muslim judge."],["Nawab","A ruler or governor of an area."]],
quiz:[["What did Guru Ji say when he came back from the river?",["There is no Hindu and no Muslim","I am very tired","Bring me food"],0],["Where was the Nawab's mind during the prayer?",["Buying horses in Kandahar","At the river","In the kitchen"],0],["What was the Qazi worried about?",["His new foal falling into a well","His shop","The rain"],0]],
pa:{t:["ਜਦੋਂ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਸੁਲਤਾਨਪੁਰ ਵਿੱਚ ਮੋਦੀਖ਼ਾਨੇ ਦਾ ਕੰਮ ਕਰਦੇ ਸਨ, ਉਹ ਹਰ ਸਵੇਰ ਵੇਈਂ ਨਦੀ ਵਿੱਚ ਇਸ਼ਨਾਨ ਕਰਨ ਜਾਂਦੇ ਸਨ। ਇੱਕ ਸਵੇਰ ਉਹ ਪਾਣੀ ਵਿੱਚ ਗਏ ਅਤੇ ਬਾਹਰ ਨਾ ਆਏ। ਲੋਕਾਂ ਨੇ ਹਰ ਪਾਸੇ ਲੱਭਿਆ, ਪਰ ਉਹ ਨਾ ਮਿਲੇ। ਸਾਰਾ ਸ਼ਹਿਰ ਉਦਾਸ ਹੋ ਗਿਆ।","ਤਿੰਨ ਦਿਨਾਂ ਬਾਅਦ ਗੁਰੂ ਜੀ ਫਿਰ ਪ੍ਰਗਟ ਹੋਏ। ਉਨ੍ਹਾਂ ਦੇ ਪਹਿਲੇ ਬੋਲ ਸਨ, 'ਨਾ ਕੋਈ ਹਿੰਦੂ, ਨਾ ਮੁਸਲਮਾਨ।' ਭਾਵ ਅਸੀਂ ਸਾਰੇ ਇੱਕੋ ਰੱਬ ਦੇ ਬੱਚੇ ਹਾਂ।","ਨਵਾਬ ਦੌਲਤ ਖ਼ਾਨ ਅਤੇ ਸ਼ਹਿਰ ਦੇ ਕਾਜ਼ੀ ਨੇ ਇਹ ਗੱਲ ਸੁਣੀ। ਉਨ੍ਹਾਂ ਕਿਹਾ, 'ਜੇ ਤੁਸੀਂ ਮੰਨਦੇ ਹੋ ਕਿ ਅਸੀਂ ਸਾਰੇ ਇੱਕ ਹਾਂ, ਤਾਂ ਸਾਡੇ ਨਾਲ ਮਸੀਤ ਵਿੱਚ ਨਮਾਜ਼ ਪੜ੍ਹੋ।' ਗੁਰੂ ਜੀ ਉਨ੍ਹਾਂ ਨਾਲ ਚਲੇ ਗਏ। ਪਰ ਜਦੋਂ ਸਾਰਿਆਂ ਨੇ ਨਮਾਜ਼ ਸ਼ੁਰੂ ਕੀਤੀ, ਗੁਰੂ ਜੀ ਚੁੱਪ-ਚਾਪ ਖੜ੍ਹੇ ਰਹੇ।","ਬਾਅਦ ਵਿੱਚ ਨਵਾਬ ਨੇ ਪੁੱਛਿਆ, 'ਤੁਸੀਂ ਸਾਡੇ ਨਾਲ ਨਮਾਜ਼ ਕਿਉਂ ਨਹੀਂ ਪੜ੍ਹੀ?' ਗੁਰੂ ਜੀ ਨੇ ਪਿਆਰ ਨਾਲ ਕਿਹਾ, 'ਮੈਂ ਕਿਸ ਦੇ ਨਾਲ ਪੜ੍ਹਦਾ? ਤੁਹਾਡਾ ਸਰੀਰ ਇੱਥੇ ਸੀ, ਪਰ ਮਨ ਕੰਧਾਰ ਵਿੱਚ ਘੋੜੇ ਖ਼ਰੀਦ ਰਿਹਾ ਸੀ।' ਫਿਰ ਕਾਜ਼ੀ ਵੱਲ ਮੁੜ ਕੇ ਕਿਹਾ, 'ਅਤੇ ਤੁਹਾਡਾ ਮਨ ਘਰ ਵਿੱਚ ਸੀ, ਇਹ ਸੋਚਦਾ ਕਿ ਨਵੀਂ ਜੰਮੀ ਵਛੇਰੀ ਵਿਹੜੇ ਦੇ ਖੂਹ ਵਿੱਚ ਨਾ ਡਿੱਗ ਪਵੇ।'","ਕਾਜ਼ੀ ਹੈਰਾਨ ਰਹਿ ਗਿਆ। ਉਸ ਨੇ ਮੰਨਿਆ, 'ਇਹ ਸੱਚ ਹੈ, ਮੈਂ ਇਹੀ ਸੋਚ ਰਿਹਾ ਸੀ।' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਨਮਾਜ਼ ਤਾਂ ਹੀ ਸੱਚੀ ਹੈ ਜਦੋਂ ਮਨ ਅਤੇ ਸਰੀਰ ਦੋਵੇਂ ਉਸ ਵਿੱਚ ਹੋਣ। ਮਨ ਤੋਂ ਬਿਨਾਂ ਨਮਾਜ਼ ਸਿਰਫ਼ ਦਿਖਾਵਾ ਹੈ।' ਨਵਾਬ ਅਤੇ ਕਾਜ਼ੀ ਨੇ ਸਿਰ ਝੁਕਾ ਲਿਆ, ਅਤੇ ਉਸ ਦਿਨ ਤੋਂ ਉਹ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦਾ ਹੋਰ ਵੀ ਸਤਿਕਾਰ ਕਰਨ ਲੱਗੇ।"],l:"ਅਰਦਾਸ ਕਰਦਿਆਂ ਸਾਡਾ ਦਿਲ ਅਤੇ ਮਨ ਵੀ ਉਸ ਵਿੱਚ ਹੋਣਾ ਚਾਹੀਦਾ ਹੈ। ਹੋਰ ਗੱਲਾਂ ਸੋਚਦਿਆਂ ਸਿਰਫ਼ ਸ਼ਬਦ ਬੋਲਣਾ ਸੱਚੀ ਅਰਦਾਸ ਨਹੀਂ।"}},

{id:"bhoomiya-thief",title:"Bhoomiya Keeps His Word",gur:"ਭੂਮੀਆ ਚੋਰ",cat:"Guru Nanak Dev Ji",age:"Kids",where:"Near Dhaka, on the way to Assam",mins:3,c:"#8E3FB8",c2:"#F2B229",h:390,art:"palace",
year:1508,approx:1,loc:["dhaka"],themes:["Honesty"],
summary:"A landlord robs travellers and then feeds them. Guru Nanak asks him to keep just three promises.",
text:["On his journey to the east, Guru Nanak Dev Ji came to a village near Dhaka. A rich landlord named Bhoomiya lived there. By day he robbed travellers, and by night he broke into houses. But he also ran a free kitchen where every traveller was given food and a bed.","Bhoomiya brought food for Guru Ji and Bhai Mardana himself. Before eating, Guru Ji asked, 'Brother, how do you earn your living?' Bhoomiya told the truth: 'I steal. But I give a lot of it away, so I think it's all right.'","Guru Ji said, 'We cannot eat your food unless you make us three promises. Never rob the poor. Always speak the truth. And never cheat anyone whose salt you have eaten.' Stealing was Bhoomiya's family trade, and he could not give it up all at once, but he agreed to these three promises. Then Guru Ji ate with him.","One night Bhoomiya dressed in fine clothes and went to rob the king's palace. The guard asked, 'Who are you?' Bhoomiya remembered his promise and said, 'A thief.' The guard laughed, thinking it was a joke, and let him in. Inside, Bhoomiya gathered up precious things. Then he saw a golden plate and tasted what was on it. It was salt! He had eaten the king's salt, so he left everything behind and went home.","The next morning, the king's men began beating poor people to find the thief. Bhoomiya could not bear it. He went to the king and said, 'I am the thief. Punish me, and leave these innocent people alone.' When the king heard the whole story, he was so impressed by Bhoomiya's honesty that he forgave him and made him a minister. Bhoomiya gave up stealing for good."],
lesson:"Even one small promise kept with honesty can change a whole life. Truth is the best medicine for a wrong life.",
think:["Which of the three promises was hardest for Bhoomiya to keep?","Why did Bhoomiya go to the king himself?"],
words:[["Salt","In old times, eating someone's salt meant you owed them loyalty."],["Minister","An important helper and adviser to a king."]],
quiz:[["What did Bhoomiya do for travellers?",["Fed them and gave them a bed","Sold them horses","Taught them songs"],0],["What did Bhoomiya say when the guard asked who he was?",["A thief","A prince","A guest"],0],["Why did he leave the palace without taking anything?",["He had tasted the king's salt","He heard a noise","He was tired"],0]],
pa:{t:["ਪੂਰਬ ਦੀ ਯਾਤਰਾ ਦੌਰਾਨ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਢਾਕੇ ਨੇੜੇ ਇੱਕ ਪਿੰਡ ਪਹੁੰਚੇ। ਉੱਥੇ ਭੂਮੀਆ ਨਾਂ ਦਾ ਇੱਕ ਅਮੀਰ ਜ਼ਿਮੀਂਦਾਰ ਰਹਿੰਦਾ ਸੀ। ਦਿਨੇ ਉਹ ਰਾਹੀਆਂ ਨੂੰ ਲੁੱਟਦਾ ਅਤੇ ਰਾਤ ਨੂੰ ਘਰਾਂ ਵਿੱਚ ਚੋਰੀ ਕਰਦਾ। ਪਰ ਉਸ ਨੇ ਇੱਕ ਲੰਗਰ ਵੀ ਚਲਾਇਆ ਹੋਇਆ ਸੀ, ਜਿੱਥੇ ਹਰ ਰਾਹੀ ਨੂੰ ਭੋਜਨ ਅਤੇ ਰਾਤ ਕੱਟਣ ਲਈ ਮੰਜਾ ਮਿਲਦਾ।","ਭੂਮੀਆ ਆਪ ਗੁਰੂ ਜੀ ਅਤੇ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਲਈ ਭੋਜਨ ਲੈ ਕੇ ਆਇਆ। ਭੋਜਨ ਛਕਣ ਤੋਂ ਪਹਿਲਾਂ ਗੁਰੂ ਜੀ ਨੇ ਪੁੱਛਿਆ, 'ਭਾਈ, ਤੂੰ ਕਮਾਈ ਕਿਵੇਂ ਕਰਦਾ ਹੈਂ?' ਭੂਮੀਏ ਨੇ ਸੱਚ ਦੱਸਿਆ, 'ਮੈਂ ਚੋਰੀ ਕਰਦਾ ਹਾਂ। ਪਰ ਬਹੁਤਾ ਦਾਨ ਵੀ ਕਰ ਦਿੰਦਾ ਹਾਂ, ਇਸ ਲਈ ਸੋਚਦਾ ਹਾਂ ਕਿ ਕੋਈ ਗੱਲ ਨਹੀਂ।'","ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਜਦ ਤੱਕ ਤੂੰ ਤਿੰਨ ਪ੍ਰਣ ਨਹੀਂ ਕਰਦਾ, ਅਸੀਂ ਤੇਰਾ ਭੋਜਨ ਨਹੀਂ ਛਕਾਂਗੇ। ਗਰੀਬ ਨੂੰ ਕਦੇ ਨਾ ਲੁੱਟੀਂ। ਹਮੇਸ਼ਾ ਸੱਚ ਬੋਲੀਂ। ਅਤੇ ਜਿਸ ਦਾ ਲੂਣ ਖਾਧਾ ਹੋਵੇ, ਉਸ ਨਾਲ ਕਦੇ ਧੋਖਾ ਨਾ ਕਰੀਂ।' ਚੋਰੀ ਭੂਮੀਏ ਦਾ ਖ਼ਾਨਦਾਨੀ ਕੰਮ ਸੀ ਅਤੇ ਉਹ ਇੱਕਦਮ ਨਹੀਂ ਛੱਡ ਸਕਦਾ ਸੀ, ਪਰ ਉਹ ਇਹ ਤਿੰਨ ਪ੍ਰਣ ਮੰਨ ਗਿਆ। ਫਿਰ ਗੁਰੂ ਜੀ ਨੇ ਉਸ ਨਾਲ ਭੋਜਨ ਛਕਿਆ।","ਇੱਕ ਰਾਤ ਭੂਮੀਆ ਸੋਹਣੇ ਕੱਪੜੇ ਪਾ ਕੇ ਰਾਜੇ ਦੇ ਮਹਿਲ ਵਿੱਚ ਚੋਰੀ ਕਰਨ ਗਿਆ। ਪਹਿਰੇਦਾਰ ਨੇ ਪੁੱਛਿਆ, 'ਤੂੰ ਕੌਣ ਹੈਂ?' ਭੂਮੀਏ ਨੂੰ ਆਪਣਾ ਪ੍ਰਣ ਯਾਦ ਆਇਆ ਅਤੇ ਬੋਲਿਆ, 'ਚੋਰ।' ਪਹਿਰੇਦਾਰ ਮਜ਼ਾਕ ਸਮਝ ਕੇ ਹੱਸ ਪਿਆ ਅਤੇ ਅੰਦਰ ਜਾਣ ਦਿੱਤਾ। ਅੰਦਰ ਭੂਮੀਏ ਨੇ ਕੀਮਤੀ ਚੀਜ਼ਾਂ ਇਕੱਠੀਆਂ ਕੀਤੀਆਂ। ਫਿਰ ਉਸ ਨੇ ਇੱਕ ਸੋਨੇ ਦੀ ਥਾਲੀ ਵੇਖੀ ਅਤੇ ਉਸ ਵਿੱਚ ਪਈ ਚੀਜ਼ ਚੱਖੀ। ਉਹ ਲੂਣ ਸੀ! ਉਸ ਨੇ ਰਾਜੇ ਦਾ ਲੂਣ ਖਾ ਲਿਆ ਸੀ, ਇਸ ਲਈ ਸਭ ਕੁਝ ਉੱਥੇ ਛੱਡ ਕੇ ਘਰ ਮੁੜ ਆਇਆ।","ਅਗਲੀ ਸਵੇਰ ਰਾਜੇ ਦੇ ਸਿਪਾਹੀ ਚੋਰ ਲੱਭਣ ਲਈ ਗਰੀਬ ਲੋਕਾਂ ਨੂੰ ਕੁੱਟਣ ਲੱਗੇ। ਭੂਮੀਏ ਤੋਂ ਇਹ ਸਹਾਰਿਆ ਨਾ ਗਿਆ। ਉਹ ਰਾਜੇ ਕੋਲ ਗਿਆ ਅਤੇ ਬੋਲਿਆ, 'ਚੋਰ ਮੈਂ ਹਾਂ। ਮੈਨੂੰ ਸਜ਼ਾ ਦਿਓ ਅਤੇ ਇਨ੍ਹਾਂ ਬੇਕਸੂਰ ਲੋਕਾਂ ਨੂੰ ਛੱਡ ਦਿਓ।' ਸਾਰੀ ਗੱਲ ਸੁਣ ਕੇ ਰਾਜਾ ਉਸ ਦੀ ਈਮਾਨਦਾਰੀ ਤੋਂ ਇੰਨਾ ਪ੍ਰਭਾਵਿਤ ਹੋਇਆ ਕਿ ਉਸ ਨੂੰ ਮਾਫ਼ ਕਰ ਕੇ ਆਪਣਾ ਵਜ਼ੀਰ ਬਣਾ ਲਿਆ। ਭੂਮੀਏ ਨੇ ਸਦਾ ਲਈ ਚੋਰੀ ਛੱਡ ਦਿੱਤੀ।"],l:"ਈਮਾਨਦਾਰੀ ਨਾਲ ਨਿਭਾਇਆ ਇੱਕ ਛੋਟਾ ਜਿਹਾ ਪ੍ਰਣ ਵੀ ਸਾਰੀ ਜ਼ਿੰਦਗੀ ਬਦਲ ਸਕਦਾ ਹੈ। ਸੱਚ ਹਰ ਰੋਗ ਦੀ ਦਵਾਈ ਹੈ।"}},

{id:"jagannath-idol",title:"Who Feeds Us All?",gur:"ਇੱਕ ਕਰਤਾ, ਇੱਕ ਪਾਲਣਹਾਰ",cat:"Guru Nanak Dev Ji",age:"Kids",where:"Jagannath Puri, Orissa",mins:2,c:"#F2B229",c2:"#8E3FB8",h:385,art:"temple",
year:1508,approx:1,loc:["puri"],themes:["Faith","Honesty"],
summary:"A man claims he can see the three worlds with his eyes closed. Guru Nanak gives him a gentle test.",
text:["On his travels, Guru Nanak Dev Ji came to Jagannath Puri, a famous temple town by the sea. A big fair was going on, and crowds had come to worship.","Guru Ji noticed a man sitting cross-legged in front of an idol, with his eyes closed and a rosary in his hand. People were placing money in front of the idol. Guru Ji asked him, 'Why do you close your eyes, when the idol is right in front of you?' The man said proudly, 'When I close my eyes, I can see all three worlds.' Then he shut his eyes again.","Quietly, Guru Ji picked up the idol and placed it behind the man. When the man opened his eyes, the idol was gone! He began shouting for help. Guru Ji said kindly, 'Why shout? Just close your eyes and look. You said you can see all three worlds.'","The man hung his head. 'I can't see anything when I close my eyes,' he admitted. 'I was only pretending, so that people would give money to the idol and I could live on it.' Guru Ji said, 'The idol does not feed you. It is the one God, the Creator, who feeds everyone. Give up pretending and remember Him.'","The man threw away his pretence and began to sing God's praises with a true heart. People who passed by still left offerings for him, and he lived simply and honestly from then on. He had learned that the One who made us all also takes care of us all."],
lesson:"God, who created everyone, takes care of everyone. We don't need to pretend or trick others to live.",
think:["Why did Guru Ji move the idol?","What does it mean that God is the one who feeds us all?"],
words:[["Idol","A statue that people worship."],["Rosary","A string of beads used while praying."]],
quiz:[["What did the man claim he could see with his eyes closed?",["The three worlds","The sea","His home"],0],["What did Guru Ji do with the idol?",["Put it behind the man","Took it away","Broke it"],0],["Who did Guru Ji say feeds everyone?",["The one God, the Creator","The idol","The king"],0]],
pa:{t:["ਯਾਤਰਾ ਦੌਰਾਨ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਸਮੁੰਦਰ ਕੰਢੇ ਮੰਦਰਾਂ ਦੇ ਪ੍ਰਸਿੱਧ ਸ਼ਹਿਰ ਜਗਨਨਾਥ ਪੁਰੀ ਪਹੁੰਚੇ। ਉੱਥੇ ਵੱਡਾ ਮੇਲਾ ਲੱਗਾ ਹੋਇਆ ਸੀ ਅਤੇ ਪੂਜਾ ਲਈ ਭੀੜਾਂ ਆਈਆਂ ਹੋਈਆਂ ਸਨ।","ਗੁਰੂ ਜੀ ਨੇ ਵੇਖਿਆ ਕਿ ਇੱਕ ਆਦਮੀ ਮੂਰਤੀ ਅੱਗੇ ਚੌਂਕੜਾ ਮਾਰ ਕੇ, ਅੱਖਾਂ ਮੀਟ ਕੇ ਅਤੇ ਹੱਥ ਵਿੱਚ ਮਾਲਾ ਫੜ ਕੇ ਬੈਠਾ ਸੀ। ਲੋਕ ਮੂਰਤੀ ਅੱਗੇ ਪੈਸੇ ਰੱਖ ਰਹੇ ਸਨ। ਗੁਰੂ ਜੀ ਨੇ ਪੁੱਛਿਆ, 'ਜਦੋਂ ਮੂਰਤੀ ਤੇਰੇ ਸਾਹਮਣੇ ਹੈ, ਤਾਂ ਤੂੰ ਅੱਖਾਂ ਕਿਉਂ ਮੀਟਦਾ ਹੈਂ?' ਉਸ ਨੇ ਮਾਣ ਨਾਲ ਕਿਹਾ, 'ਅੱਖਾਂ ਮੀਟ ਕੇ ਮੈਨੂੰ ਤਿੰਨੇ ਲੋਕ ਦਿਸਦੇ ਹਨ।' ਅਤੇ ਫਿਰ ਅੱਖਾਂ ਮੀਟ ਲਈਆਂ।","ਗੁਰੂ ਜੀ ਨੇ ਚੁੱਪ-ਚਾਪ ਮੂਰਤੀ ਚੁੱਕ ਕੇ ਉਸ ਦੇ ਪਿੱਛੇ ਰੱਖ ਦਿੱਤੀ। ਜਦੋਂ ਉਸ ਨੇ ਅੱਖਾਂ ਖੋਲ੍ਹੀਆਂ, ਮੂਰਤੀ ਗ਼ਾਇਬ ਸੀ! ਉਹ ਰੌਲਾ ਪਾਉਣ ਲੱਗਾ। ਗੁਰੂ ਜੀ ਨੇ ਪਿਆਰ ਨਾਲ ਕਿਹਾ, 'ਰੌਲਾ ਕਿਉਂ ਪਾਉਂਦਾ ਹੈਂ? ਅੱਖਾਂ ਮੀਟ ਕੇ ਵੇਖ ਲੈ। ਤੂੰ ਤਾਂ ਕਹਿੰਦਾ ਸੀ ਕਿ ਤੈਨੂੰ ਤਿੰਨੇ ਲੋਕ ਦਿਸਦੇ ਹਨ।'","ਉਸ ਆਦਮੀ ਨੇ ਸਿਰ ਝੁਕਾ ਲਿਆ। ਉਸ ਨੇ ਮੰਨਿਆ, 'ਅੱਖਾਂ ਮੀਟ ਕੇ ਮੈਨੂੰ ਕੁਝ ਨਹੀਂ ਦਿਸਦਾ। ਮੈਂ ਸਿਰਫ਼ ਦਿਖਾਵਾ ਕਰਦਾ ਸੀ, ਤਾਂ ਜੋ ਲੋਕ ਮੂਰਤੀ ਅੱਗੇ ਪੈਸੇ ਰੱਖਣ ਅਤੇ ਮੇਰਾ ਗੁਜ਼ਾਰਾ ਚੱਲੇ।' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਤੈਨੂੰ ਮੂਰਤੀ ਰੋਟੀ ਨਹੀਂ ਦਿੰਦੀ। ਸਭ ਨੂੰ ਰੋਜ਼ੀ ਦੇਣ ਵਾਲਾ ਇੱਕ ਕਰਤਾ ਹੈ। ਦਿਖਾਵਾ ਛੱਡ ਅਤੇ ਉਸ ਨੂੰ ਯਾਦ ਕਰ।'","ਉਸ ਆਦਮੀ ਨੇ ਦਿਖਾਵਾ ਛੱਡ ਦਿੱਤਾ ਅਤੇ ਸੱਚੇ ਦਿਲ ਨਾਲ ਰੱਬ ਦੀ ਸਿਫ਼ਤ ਗਾਉਣ ਲੱਗਾ। ਲੰਘਦੇ ਲੋਕ ਫਿਰ ਵੀ ਉਸ ਅੱਗੇ ਭੇਟਾ ਰੱਖਦੇ, ਅਤੇ ਉਹ ਉਸ ਤੋਂ ਬਾਅਦ ਸਾਦਗੀ ਅਤੇ ਈਮਾਨਦਾਰੀ ਨਾਲ ਜੀਵਿਆ। ਉਹ ਸਮਝ ਗਿਆ ਸੀ ਕਿ ਜਿਸ ਨੇ ਸਾਨੂੰ ਸਾਰਿਆਂ ਨੂੰ ਬਣਾਇਆ ਹੈ, ਉਹੀ ਸਭ ਦੀ ਸੰਭਾਲ ਕਰਦਾ ਹੈ।"],l:"ਜਿਸ ਰੱਬ ਨੇ ਸਭ ਨੂੰ ਬਣਾਇਆ ਹੈ, ਉਹੀ ਸਭ ਦੀ ਸੰਭਾਲ ਕਰਦਾ ਹੈ। ਗੁਜ਼ਾਰੇ ਲਈ ਦਿਖਾਵੇ ਜਾਂ ਧੋਖੇ ਦੀ ਲੋੜ ਨਹੀਂ।"}},

{id:"kauda",title:"Kauda in the Forest",gur:"ਕੌਡਾ ਰਾਖਸ਼",cat:"Guru Nanak Dev Ji",age:"Kids",where:"A forest in southern India",mins:3,c:"#2FA45A",c2:"#F0702A",h:400,art:"forest",
year:1510,approx:1,loc:[],themes:["Courage","Faith"],
summary:"A hungry Bhai Mardana wanders off in a wild forest, and is caught by the fearsome Kauda.",
text:["Guru Nanak Dev Ji and Bhai Mardana were walking through a thick forest in the south of India. The people there did no farming. They hunted wild animals and ate wild fruit. For two whole days, Bhai Mardana found nothing to eat.","'I can't bear this hunger any more,' he said. 'Let me go and look for some fruit.' Guru Ji said, 'This forest is full of dangers. Stay with me. We'll soon reach a village.' But Bhai Mardana was too hungry to listen, and he went off on his own.","Deep in the forest lived a fearsome man named Kauda. People said he caught travellers and ate them. Kauda grabbed Bhai Mardana, tied him up in his hut, and put a big pan of oil on the fire. Then he went off to collect more firewood.","When Bhai Mardana didn't come back, Guru Ji went looking for him and found the hut. When Kauda returned with his wood and saw Guru Ji standing there, calm and fearless, the wood fell from his arms. Something in Guru Ji's peaceful face melted his hard heart. He ran and untied Bhai Mardana, and the fire under the pan went out.","Kauda fell at Guru Ji's feet. 'Forgive me. I have done terrible things,' he said. Guru Ji said, 'We have walked hundreds of miles to show you a better way to live.' Kauda promised to change his life. Then he brought food for his guests, and Bhai Mardana finally ate his fill."],
lesson:"Love and calm courage can change even the hardest heart. It's also wise to listen when someone who cares warns us of danger.",
think:["What should Bhai Mardana have done when Guru Ji warned him?","What changed Kauda's heart?"],
words:[["Kauda","A fearsome man from the forest who changed his ways."]],
quiz:[["Why did Bhai Mardana go off alone?",["He was very hungry","He wanted to explore","He was angry"],0],["What did Kauda put on the fire?",["A pan of oil","A pot of rice","Some bread"],0],["What happened when Kauda saw Guru Ji?",["The wood fell from his arms and his heart changed","He ran away","He shouted"],0]],
pa:{t:["ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਅਤੇ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਦੱਖਣੀ ਭਾਰਤ ਦੇ ਇੱਕ ਸੰਘਣੇ ਜੰਗਲ ਵਿੱਚੋਂ ਲੰਘ ਰਹੇ ਸਨ। ਉੱਥੋਂ ਦੇ ਲੋਕ ਖੇਤੀ ਨਹੀਂ ਕਰਦੇ ਸਨ, ਜੰਗਲੀ ਜਾਨਵਰਾਂ ਦਾ ਸ਼ਿਕਾਰ ਕਰਦੇ ਅਤੇ ਜੰਗਲੀ ਫਲ ਖਾਂਦੇ ਸਨ। ਦੋ ਦਿਨ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਨੂੰ ਖਾਣ ਲਈ ਕੁਝ ਨਾ ਮਿਲਿਆ।","ਉਨ੍ਹਾਂ ਕਿਹਾ, 'ਮੈਥੋਂ ਹੋਰ ਭੁੱਖ ਸਹਾਰੀ ਨਹੀਂ ਜਾਂਦੀ। ਮੈਨੂੰ ਕੋਈ ਫਲ ਲੱਭਣ ਜਾਣ ਦਿਓ।' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਇਹ ਜੰਗਲ ਖ਼ਤਰਿਆਂ ਨਾਲ ਭਰਿਆ ਹੈ। ਮੇਰੇ ਨਾਲ ਰਹੁ। ਅਸੀਂ ਛੇਤੀ ਕਿਸੇ ਪਿੰਡ ਪਹੁੰਚ ਜਾਵਾਂਗੇ।' ਪਰ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਨੂੰ ਇੰਨੀ ਭੁੱਖ ਲੱਗੀ ਸੀ ਕਿ ਉਹ ਇਕੱਲੇ ਹੀ ਚਲੇ ਗਏ।","ਜੰਗਲ ਦੇ ਅੰਦਰ ਕੌਡਾ ਨਾਂ ਦਾ ਇੱਕ ਡਰਾਉਣਾ ਆਦਮੀ ਰਹਿੰਦਾ ਸੀ। ਲੋਕ ਕਹਿੰਦੇ ਸਨ ਕਿ ਉਹ ਰਾਹੀਆਂ ਨੂੰ ਫੜ ਕੇ ਖਾ ਜਾਂਦਾ ਹੈ। ਕੌਡੇ ਨੇ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਨੂੰ ਫੜ ਕੇ ਆਪਣੀ ਝੌਂਪੜੀ ਵਿੱਚ ਬੰਨ੍ਹ ਦਿੱਤਾ ਅਤੇ ਅੱਗ ਉੱਤੇ ਤੇਲ ਦਾ ਵੱਡਾ ਕੜਾਹਾ ਰੱਖ ਦਿੱਤਾ। ਫਿਰ ਉਹ ਹੋਰ ਲੱਕੜਾਂ ਲੈਣ ਚਲਾ ਗਿਆ।","ਜਦੋਂ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਵਾਪਸ ਨਾ ਆਏ, ਗੁਰੂ ਜੀ ਉਨ੍ਹਾਂ ਨੂੰ ਲੱਭਦੇ ਹੋਏ ਝੌਂਪੜੀ ਤੱਕ ਪਹੁੰਚ ਗਏ। ਜਦੋਂ ਕੌਡਾ ਲੱਕੜਾਂ ਲੈ ਕੇ ਮੁੜਿਆ ਅਤੇ ਗੁਰੂ ਜੀ ਨੂੰ ਸ਼ਾਂਤ ਅਤੇ ਨਿਡਰ ਖੜ੍ਹੇ ਵੇਖਿਆ, ਲੱਕੜਾਂ ਉਸ ਦੇ ਹੱਥੋਂ ਡਿੱਗ ਪਈਆਂ। ਗੁਰੂ ਜੀ ਦੇ ਸ਼ਾਂਤ ਮੁੱਖ ਨੇ ਉਸ ਦਾ ਕਠੋਰ ਦਿਲ ਪਿਘਲਾ ਦਿੱਤਾ। ਉਸ ਨੇ ਦੌੜ ਕੇ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਨੂੰ ਖੋਲ੍ਹ ਦਿੱਤਾ, ਅਤੇ ਕੜਾਹੇ ਹੇਠਲੀ ਅੱਗ ਬੁਝ ਗਈ।","ਕੌਡਾ ਗੁਰੂ ਜੀ ਦੇ ਚਰਨਾਂ ਉੱਤੇ ਡਿੱਗ ਪਿਆ ਅਤੇ ਬੋਲਿਆ, 'ਮੈਨੂੰ ਮਾਫ਼ ਕਰ ਦਿਓ। ਮੈਂ ਬਹੁਤ ਬੁਰੇ ਕੰਮ ਕੀਤੇ ਹਨ।' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਅਸੀਂ ਸੈਂਕੜੇ ਮੀਲ ਤੁਰ ਕੇ ਤੈਨੂੰ ਜੀਣ ਦਾ ਚੰਗਾ ਰਾਹ ਵਿਖਾਉਣ ਆਏ ਹਾਂ।' ਕੌਡੇ ਨੇ ਆਪਣਾ ਜੀਵਨ ਬਦਲਣ ਦਾ ਪ੍ਰਣ ਕੀਤਾ। ਫਿਰ ਉਹ ਆਪਣੇ ਮਹਿਮਾਨਾਂ ਲਈ ਭੋਜਨ ਲੈ ਕੇ ਆਇਆ, ਅਤੇ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਨੇ ਆਖ਼ਰ ਰੱਜ ਕੇ ਭੋਜਨ ਛਕਿਆ।"],l:"ਪਿਆਰ ਅਤੇ ਸ਼ਾਂਤ ਹੌਸਲਾ ਸਭ ਤੋਂ ਕਠੋਰ ਦਿਲ ਨੂੰ ਵੀ ਬਦਲ ਸਕਦਾ ਹੈ। ਜਦੋਂ ਕੋਈ ਪਿਆਰ ਕਰਨ ਵਾਲਾ ਖ਼ਤਰੇ ਤੋਂ ਸਾਵਧਾਨ ਕਰੇ, ਤਾਂ ਉਸ ਦੀ ਗੱਲ ਮੰਨਣੀ ਸਿਆਣਪ ਹੈ।"}},

{id:"kurukshetra-eclipse",title:"The Fire at Kurukshetra",gur:"ਕੁਰੂਕਸ਼ੇਤਰ ਦਾ ਗ੍ਰਹਿਣ",cat:"Guru Nanak Dev Ji",age:"Kids",where:"Kurukshetra",mins:3,c:"#1E1E24",c2:"#F0702A",h:395,art:"eclipse",
year:1501,approx:1,loc:["kurukshetra"],themes:["Honesty","Faith"],
summary:"Huge crowds gather to wash away their sins during a solar eclipse. Guru Nanak lights a cooking fire, and everyone is furious.",
text:["Guru Nanak Dev Ji and Bhai Mardana reached Kurukshetra on the day of a solar eclipse. Huge crowds had gathered there, because people believed that bathing and giving charity during an eclipse would wash away all their sins.","As soon as the eclipse began, rich people started heaping money into the hands of the priests, even though many of them never gave anything to the poor on other days. Guru Ji sat quietly in an open place and watched.","A young prince arrived and offered Guru Ji the deer he had hunted on the way. Guru Ji asked Bhai Mardana to light a fire and cook it. When the priests saw the smoke, they came running. 'It's a great sin to light a fire during an eclipse!' they shouted.","Guru Ji answered calmly, 'Cooking to feed the hungry is not a sin. Cheating people by telling lies is a sin. An eclipse happens because of the way the sun and moon move. No god is in danger, and nobody's sins are washed away just by bathing here or giving money to priests.'","'The only way to wash away wrong deeds,' Guru Ji said, 'is to remember God, and to live truthfully every day.' The crowd grew quiet and thought about his words. Many of them understood that being good is about how we live, not about special days."],
lesson:"Wrong deeds aren't washed away by a ritual on a special day. What matters is living truthfully and remembering God every day.",
think:["What do you think causes an eclipse?","Why did Guru Ji say cooking for the hungry was not a sin?"],
words:[["Eclipse","When the moon passes in front of the sun and blocks its light."],["Kurukshetra","A holy place where many pilgrims gather."]],
quiz:[["What did people believe about the eclipse?",["Bathing then would wash away their sins","It meant rain","It was a festival of lights"],0],["What made the priests angry?",["Guru Ji lit a cooking fire","Guru Ji sang loudly","Guru Ji went to sleep"],0],["What did Guru Ji say really washes away wrong deeds?",["Remembering God and living truthfully","Giving money to priests","Bathing in the river"],0]],
pa:{t:["ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਅਤੇ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਸੂਰਜ ਗ੍ਰਹਿਣ ਵਾਲੇ ਦਿਨ ਕੁਰੂਕਸ਼ੇਤਰ ਪਹੁੰਚੇ। ਉੱਥੇ ਭਾਰੀ ਭੀੜ ਇਕੱਠੀ ਸੀ, ਕਿਉਂਕਿ ਲੋਕ ਮੰਨਦੇ ਸਨ ਕਿ ਗ੍ਰਹਿਣ ਵੇਲੇ ਇਸ਼ਨਾਨ ਅਤੇ ਦਾਨ ਕਰਨ ਨਾਲ ਸਾਰੇ ਪਾਪ ਧੁਲ ਜਾਂਦੇ ਹਨ।","ਗ੍ਰਹਿਣ ਲੱਗਦਿਆਂ ਹੀ ਅਮੀਰ ਲੋਕ ਪੁਜਾਰੀਆਂ ਦੇ ਹੱਥਾਂ ਵਿੱਚ ਪੈਸਿਆਂ ਦੇ ਢੇਰ ਲਾਉਣ ਲੱਗੇ, ਭਾਵੇਂ ਉਨ੍ਹਾਂ ਵਿੱਚੋਂ ਬਹੁਤੇ ਹੋਰ ਦਿਨਾਂ ਵਿੱਚ ਗਰੀਬਾਂ ਨੂੰ ਕੁਝ ਨਹੀਂ ਦਿੰਦੇ ਸਨ। ਗੁਰੂ ਜੀ ਇੱਕ ਖੁੱਲ੍ਹੀ ਥਾਂ ਉੱਤੇ ਸ਼ਾਂਤ ਬੈਠੇ ਸਭ ਵੇਖਦੇ ਰਹੇ।","ਇੱਕ ਨੌਜਵਾਨ ਰਾਜਕੁਮਾਰ ਆਇਆ ਅਤੇ ਰਾਹ ਵਿੱਚ ਸ਼ਿਕਾਰ ਕੀਤਾ ਹਿਰਨ ਗੁਰੂ ਜੀ ਨੂੰ ਭੇਟ ਕੀਤਾ। ਗੁਰੂ ਜੀ ਨੇ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਨੂੰ ਅੱਗ ਬਾਲ ਕੇ ਉਸ ਨੂੰ ਪਕਾਉਣ ਲਈ ਕਿਹਾ। ਧੂੰਆਂ ਵੇਖ ਕੇ ਪੁਜਾਰੀ ਦੌੜੇ ਆਏ ਅਤੇ ਚੀਕੇ, 'ਗ੍ਰਹਿਣ ਵੇਲੇ ਅੱਗ ਬਾਲਣਾ ਵੱਡਾ ਪਾਪ ਹੈ!'","ਗੁਰੂ ਜੀ ਨੇ ਸ਼ਾਂਤੀ ਨਾਲ ਜਵਾਬ ਦਿੱਤਾ, 'ਭੁੱਖਿਆਂ ਲਈ ਭੋਜਨ ਪਕਾਉਣਾ ਪਾਪ ਨਹੀਂ। ਝੂਠ ਬੋਲ ਕੇ ਲੋਕਾਂ ਨੂੰ ਠੱਗਣਾ ਪਾਪ ਹੈ। ਗ੍ਰਹਿਣ ਸੂਰਜ ਅਤੇ ਚੰਦ ਦੀ ਚਾਲ ਕਾਰਨ ਲੱਗਦਾ ਹੈ। ਕਿਸੇ ਦੇਵਤੇ ਨੂੰ ਕੋਈ ਖ਼ਤਰਾ ਨਹੀਂ, ਅਤੇ ਸਿਰਫ਼ ਇੱਥੇ ਨਹਾਉਣ ਜਾਂ ਪੁਜਾਰੀਆਂ ਨੂੰ ਪੈਸੇ ਦੇਣ ਨਾਲ ਕਿਸੇ ਦੇ ਪਾਪ ਨਹੀਂ ਧੁਲਦੇ।'","ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਬੁਰੇ ਕਰਮ ਧੋਣ ਦਾ ਇੱਕੋ ਰਾਹ ਹੈ ਰੱਬ ਨੂੰ ਯਾਦ ਕਰਨਾ ਅਤੇ ਹਰ ਰੋਜ਼ ਸੱਚਾ ਜੀਵਨ ਜੀਣਾ।' ਭੀੜ ਚੁੱਪ ਹੋ ਗਈ ਅਤੇ ਉਨ੍ਹਾਂ ਦੇ ਬਚਨਾਂ ਬਾਰੇ ਸੋਚਣ ਲੱਗੀ। ਬਹੁਤੇ ਸਮਝ ਗਏ ਕਿ ਚੰਗਾ ਹੋਣਾ ਖ਼ਾਸ ਦਿਨਾਂ ਉੱਤੇ ਨਹੀਂ, ਸਗੋਂ ਸਾਡੇ ਜੀਣ ਦੇ ਢੰਗ ਉੱਤੇ ਨਿਰਭਰ ਕਰਦਾ ਹੈ।"],l:"ਕਿਸੇ ਖ਼ਾਸ ਦਿਨ ਦੀ ਰਸਮ ਨਾਲ ਬੁਰੇ ਕਰਮ ਨਹੀਂ ਧੁਲਦੇ। ਅਸਲ ਗੱਲ ਹੈ ਹਰ ਰੋਜ਼ ਸੱਚਾ ਜੀਵਨ ਜੀਣਾ ਅਤੇ ਰੱਬ ਨੂੰ ਯਾਦ ਕਰਨਾ।"}},

{id:"paisa-of-truth",title:"A Paisa of Truth",gur:"ਪੈਸੇ ਦਾ ਸੱਚ",cat:"Guru Nanak Dev Ji",age:"Kids",where:"Sialkot",mins:3,c:"#3B5BDB",c2:"#F2B229",h:405,art:"dome",
year:1517,approx:1,loc:["sialkot"],themes:["Honesty","Humility"],
summary:"An angry holy man wants a whole city to be destroyed. Guru Nanak sends Bhai Mardana to the market to buy some truth.",
text:["Guru Nanak Dev Ji and Bhai Mardana reached the city of Sialkot. A crowd was upset outside the home of a holy man named Pir Hamza Ghaus. He had shut himself inside his dome for forty days without food, praying for the whole city to be destroyed.","'Why are you so angry?' Guru Ji asked when the Pir came out. He said, 'A rich man promised to give me his son if God blessed him with one. The son was born, but the man broke his promise. Everyone in this city is a liar!'","Guru Ji said, 'Let's find out if there are any truthful people here.' He gave Bhai Mardana two paisa coins and said, 'Go to the market. Buy one paisa of truth, and one paisa of falsehood.' Shopkeeper after shopkeeper laughed at Bhai Mardana. Then he came to the shop of Mool Chand. Mool Chand took the coins and wrote on a slip of paper: 'Life is false. Death is true.'","Guru Ji showed the paper to the Pir. 'You see? There are wise and truthful people in this city.' The Pir said, 'People say wise words, but they don't live by them.' So Guru Ji called Mool Chand and said, 'If you believe death is true, then leave your home and serve the Pir.' Mool Chand agreed straight away, handed his shop to his sons, and came to serve.","The Pir's anger melted away. Guru Ji told him, 'God is great. Holy people should accept His will and do good, and never wish harm on anyone He has made.' The Pir gave up his anger, and the people of Sialkot went home in peace."],
lesson:"Anger makes us wish harm on others, but a holy person should wish good for everyone. One truthful person can save many.",
think:["What did Mool Chand write on the paper? What does it mean?","How did Mool Chand prove he meant what he wrote?"],
words:[["Paisa","A small coin."],["Pir","A Muslim holy man or spiritual guide."]],
quiz:[["What did the Pir want to happen to the city?",["For it to be destroyed","For it to grow","For a fair to be held"],0],["What did Guru Ji ask Bhai Mardana to buy?",["One paisa of truth and one of falsehood","Some bread","A new rabab"],0],["What did Mool Chand write?",["Life is false, death is true","Thank you","Come again"],0]],
pa:{t:["ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਅਤੇ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਸਿਆਲਕੋਟ ਪਹੁੰਚੇ। ਪੀਰ ਹਮਜ਼ਾ ਗੌਸ ਦੇ ਡੇਰੇ ਬਾਹਰ ਲੋਕ ਬਹੁਤ ਪਰੇਸ਼ਾਨ ਖੜ੍ਹੇ ਸਨ। ਪੀਰ ਨੇ ਚਾਲੀ ਦਿਨਾਂ ਲਈ ਭੁੱਖਾ ਰਹਿ ਕੇ ਆਪਣੇ ਆਪ ਨੂੰ ਗੁੰਬਦ ਵਿੱਚ ਬੰਦ ਕਰ ਲਿਆ ਸੀ, ਅਤੇ ਸਾਰੇ ਸ਼ਹਿਰ ਦੇ ਨਾਸ਼ ਲਈ ਦੁਆ ਕਰ ਰਿਹਾ ਸੀ।","ਜਦੋਂ ਪੀਰ ਬਾਹਰ ਆਇਆ, ਗੁਰੂ ਜੀ ਨੇ ਪੁੱਛਿਆ, 'ਤੁਸੀਂ ਇੰਨੇ ਗੁੱਸੇ ਕਿਉਂ ਹੋ?' ਉਸ ਨੇ ਕਿਹਾ, 'ਇੱਕ ਅਮੀਰ ਆਦਮੀ ਨੇ ਵਾਅਦਾ ਕੀਤਾ ਸੀ ਕਿ ਜੇ ਰੱਬ ਉਸ ਨੂੰ ਪੁੱਤਰ ਦੇਵੇ ਤਾਂ ਉਹ ਪੁੱਤਰ ਮੈਨੂੰ ਸੌਂਪ ਦੇਵੇਗਾ। ਪੁੱਤਰ ਜੰਮ ਪਿਆ, ਪਰ ਉਹ ਵਾਅਦੇ ਤੋਂ ਮੁੱਕਰ ਗਿਆ। ਇਸ ਸ਼ਹਿਰ ਦੇ ਸਾਰੇ ਲੋਕ ਝੂਠੇ ਹਨ!'","ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਆਓ ਵੇਖੀਏ ਕਿ ਇੱਥੇ ਕੋਈ ਸੱਚਾ ਮਨੁੱਖ ਹੈ ਜਾਂ ਨਹੀਂ।' ਉਨ੍ਹਾਂ ਨੇ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਨੂੰ ਦੋ ਪੈਸੇ ਦਿੱਤੇ ਅਤੇ ਕਿਹਾ, 'ਬਾਜ਼ਾਰ ਜਾ ਕੇ ਇੱਕ ਪੈਸੇ ਦਾ ਸੱਚ ਅਤੇ ਇੱਕ ਪੈਸੇ ਦਾ ਝੂਠ ਲੈ ਆ।' ਇੱਕ ਤੋਂ ਬਾਅਦ ਇੱਕ ਦੁਕਾਨਦਾਰ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਉੱਤੇ ਹੱਸਿਆ। ਫਿਰ ਉਹ ਮੂਲ ਚੰਦ ਦੀ ਦੁਕਾਨ ਉੱਤੇ ਪਹੁੰਚੇ। ਮੂਲ ਚੰਦ ਨੇ ਪੈਸੇ ਲਏ ਅਤੇ ਇੱਕ ਪਰਚੀ ਉੱਤੇ ਲਿਖਿਆ: 'ਜੀਣਾ ਝੂਠ ਹੈ, ਮਰਨਾ ਸੱਚ ਹੈ।'","ਗੁਰੂ ਜੀ ਨੇ ਪਰਚੀ ਪੀਰ ਨੂੰ ਵਿਖਾਈ ਅਤੇ ਕਿਹਾ, 'ਵੇਖੋ, ਇਸ ਸ਼ਹਿਰ ਵਿੱਚ ਸਿਆਣੇ ਅਤੇ ਸੱਚੇ ਲੋਕ ਵੀ ਹਨ।' ਪੀਰ ਨੇ ਕਿਹਾ, 'ਲੋਕ ਸਿਆਣੀਆਂ ਗੱਲਾਂ ਕਰਦੇ ਹਨ, ਪਰ ਉਨ੍ਹਾਂ ਉੱਤੇ ਚੱਲਦੇ ਨਹੀਂ।' ਇਸ ਲਈ ਗੁਰੂ ਜੀ ਨੇ ਮੂਲ ਚੰਦ ਨੂੰ ਸੱਦਿਆ ਅਤੇ ਕਿਹਾ, 'ਜੇ ਤੂੰ ਮੰਨਦਾ ਹੈਂ ਕਿ ਮਰਨਾ ਸੱਚ ਹੈ, ਤਾਂ ਘਰ ਛੱਡ ਕੇ ਪੀਰ ਦੀ ਸੇਵਾ ਕਰ।' ਮੂਲ ਚੰਦ ਝੱਟ ਮੰਨ ਗਿਆ, ਦੁਕਾਨ ਪੁੱਤਰਾਂ ਨੂੰ ਸੌਂਪੀ ਅਤੇ ਸੇਵਾ ਲਈ ਆ ਗਿਆ।","ਪੀਰ ਦਾ ਗੁੱਸਾ ਠੰਢਾ ਹੋ ਗਿਆ। ਗੁਰੂ ਜੀ ਨੇ ਉਸ ਨੂੰ ਸਮਝਾਇਆ, 'ਰੱਬ ਮਹਾਨ ਹੈ। ਸੰਤਾਂ ਨੂੰ ਉਸ ਦਾ ਭਾਣਾ ਮੰਨਣਾ ਚਾਹੀਦਾ ਹੈ, ਭਲਾ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ, ਅਤੇ ਉਸ ਦੀ ਬਣਾਈ ਕਿਸੇ ਜਿੰਦ ਦਾ ਬੁਰਾ ਨਹੀਂ ਸੋਚਣਾ ਚਾਹੀਦਾ।' ਪੀਰ ਨੇ ਗੁੱਸਾ ਛੱਡ ਦਿੱਤਾ, ਅਤੇ ਸਿਆਲਕੋਟ ਦੇ ਲੋਕ ਸ਼ਾਂਤੀ ਨਾਲ ਘਰਾਂ ਨੂੰ ਮੁੜ ਗਏ।"],l:"ਗੁੱਸਾ ਸਾਨੂੰ ਦੂਜਿਆਂ ਦਾ ਬੁਰਾ ਸੋਚਣ ਲਾਉਂਦਾ ਹੈ, ਪਰ ਸੰਤ ਸਭ ਦਾ ਭਲਾ ਮੰਗਦਾ ਹੈ। ਇੱਕ ਸੱਚਾ ਮਨੁੱਖ ਬਹੁਤਿਆਂ ਨੂੰ ਬਚਾ ਸਕਦਾ ਹੈ।"}},

{id:"yogis-of-sumer",title:"The Yogis on the Mountain",gur:"ਸੁਮੇਰ ਪਰਬਤ ਦੇ ਜੋਗੀ",cat:"Guru Nanak Dev Ji",age:"Kids",where:"Mount Sumer, high in the Himalayas",mins:3,c:"#1590B0",c2:"#F2B229",h:395,art:"mountains",
year:1515,approx:1,loc:["sumer"],themes:["Faith","Humility"],
summary:"High in the snowy mountains, yogis who have left the world ask Guru Nanak how he reached them.",
text:["Guru Nanak Dev Ji and Bhai Mardana climbed high into the snowy Himalaya mountains. Up there lived yogis who had left their homes and families. They believed that living far away from people was the only way to become free from worldly desires.","The yogis were surprised. 'How did you get here?' they asked. 'Only people with magic powers can reach these mountains.' Guru Ji replied, 'We came here by the knowledge of Truth.'","One yogi, Bharthari, who had once been a king, said, 'Pierce your ears and wear big earrings like us. Shave your head and leave your home. Then you will be free.' Guru Ji said, 'You gave up your kingdom and your home, but you have not given up your pride. You are still showing off what you have given up.'","Bharthari offered Guru Ji a cup of drugged drink. 'Drink this,' he said. 'It will make you forget hunger, thirst and all the sorrows of the world.' Guru Ji said, 'Someone who deals in Truth doesn't need this. God's Name is enough to fill me with joy and take away all sorrow.'","Another yogi asked, 'How did you conquer anger, greed and pride?' Guru Ji said, 'By remembering God, by keeping the company of good people, and by feeling God's presence always.' Then he asked them, 'Why do you run away from the world, when God lives in everyone? You are needed down there, helping people, not hiding up here.'"],
lesson:"We don't need to run away from the world to find God. God lives in everyone, so we find Him by living well among people and helping them.",
think:["Why did Guru Ji say the yogis should come down from the mountains?","What helped Guru Ji stay free of anger and greed?"],
words:[["Yogi","Someone who follows yoga and often lives away from people."],["Himalayas","The highest mountains in the world."]],
quiz:[["Where did the yogis live?",["High in the snowy mountains","In a big city","By the sea"],0],["What did Bharthari offer Guru Ji?",["A drugged drink","Some fruit","A blanket"],0],["Where did Guru Ji say God lives?",["In everyone","Only in the mountains","Only in temples"],0]],
pa:{t:["ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਅਤੇ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਬਰਫ਼ੀਲੇ ਹਿਮਾਲਿਆ ਪਹਾੜਾਂ ਵਿੱਚ ਬਹੁਤ ਉੱਚੇ ਚੜ੍ਹ ਗਏ। ਉੱਥੇ ਉਹ ਜੋਗੀ ਰਹਿੰਦੇ ਸਨ ਜਿਨ੍ਹਾਂ ਨੇ ਆਪਣੇ ਘਰ-ਪਰਿਵਾਰ ਛੱਡ ਦਿੱਤੇ ਸਨ। ਉਹ ਮੰਨਦੇ ਸਨ ਕਿ ਲੋਕਾਂ ਤੋਂ ਦੂਰ ਰਹਿ ਕੇ ਹੀ ਦੁਨਿਆਵੀ ਇੱਛਾਵਾਂ ਤੋਂ ਛੁਟਕਾਰਾ ਮਿਲ ਸਕਦਾ ਹੈ।","ਜੋਗੀ ਹੈਰਾਨ ਹੋਏ ਅਤੇ ਪੁੱਛਿਆ, 'ਤੁਸੀਂ ਇੱਥੇ ਕਿਵੇਂ ਪਹੁੰਚੇ? ਇਨ੍ਹਾਂ ਪਹਾੜਾਂ ਤੱਕ ਸਿਰਫ਼ ਕਰਾਮਾਤੀ ਸ਼ਕਤੀਆਂ ਵਾਲੇ ਹੀ ਪਹੁੰਚ ਸਕਦੇ ਹਨ।' ਗੁਰੂ ਜੀ ਨੇ ਜਵਾਬ ਦਿੱਤਾ, 'ਅਸੀਂ ਸੱਚ ਦੇ ਗਿਆਨ ਨਾਲ ਇੱਥੇ ਪਹੁੰਚੇ ਹਾਂ।'","ਇੱਕ ਜੋਗੀ, ਭਰਥਰੀ, ਜੋ ਕਦੇ ਰਾਜਾ ਹੁੰਦਾ ਸੀ, ਬੋਲਿਆ, 'ਸਾਡੇ ਵਾਂਗ ਕੰਨ ਪੜਵਾ ਕੇ ਮੁੰਦਰਾਂ ਪਾਓ, ਸਿਰ ਮੁਨਾਓ ਅਤੇ ਘਰ ਛੱਡੋ। ਤਾਂ ਮੁਕਤੀ ਮਿਲੇਗੀ।' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਤੁਸੀਂ ਰਾਜ ਅਤੇ ਘਰ ਤਾਂ ਛੱਡ ਦਿੱਤਾ, ਪਰ ਹੰਕਾਰ ਨਹੀਂ ਛੱਡਿਆ। ਤੁਸੀਂ ਅਜੇ ਵੀ ਆਪਣੇ ਤਿਆਗ ਦਾ ਦਿਖਾਵਾ ਕਰ ਰਹੇ ਹੋ।'","ਭਰਥਰੀ ਨੇ ਗੁਰੂ ਜੀ ਨੂੰ ਨਸ਼ੇ ਵਾਲਾ ਪਿਆਲਾ ਦਿੱਤਾ ਅਤੇ ਕਿਹਾ, 'ਇਹ ਪੀ ਲਓ। ਇਸ ਨਾਲ ਭੁੱਖ, ਪਿਆਸ ਅਤੇ ਦੁਨੀਆ ਦੇ ਸਾਰੇ ਦੁੱਖ ਭੁੱਲ ਜਾਣਗੇ।' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਜੋ ਸੱਚ ਦਾ ਵਪਾਰ ਕਰਦਾ ਹੈ, ਉਸ ਨੂੰ ਇਸ ਦੀ ਲੋੜ ਨਹੀਂ। ਰੱਬ ਦਾ ਨਾਮ ਹੀ ਮੈਨੂੰ ਖ਼ੁਸ਼ੀ ਨਾਲ ਭਰ ਦਿੰਦਾ ਹੈ ਅਤੇ ਸਾਰੇ ਦੁੱਖ ਦੂਰ ਕਰ ਦਿੰਦਾ ਹੈ।'","ਇੱਕ ਹੋਰ ਜੋਗੀ ਨੇ ਪੁੱਛਿਆ, 'ਤੁਸੀਂ ਕ੍ਰੋਧ, ਲੋਭ ਅਤੇ ਹੰਕਾਰ ਉੱਤੇ ਕਿਵੇਂ ਜਿੱਤ ਪਾਈ?' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਰੱਬ ਨੂੰ ਯਾਦ ਕਰ ਕੇ, ਚੰਗੇ ਲੋਕਾਂ ਦੀ ਸੰਗਤ ਕਰ ਕੇ, ਅਤੇ ਹਰ ਵੇਲੇ ਰੱਬ ਨੂੰ ਅੰਗ-ਸੰਗ ਮਹਿਸੂਸ ਕਰ ਕੇ।' ਫਿਰ ਉਨ੍ਹਾਂ ਨੇ ਜੋਗੀਆਂ ਨੂੰ ਪੁੱਛਿਆ, 'ਜਦੋਂ ਰੱਬ ਹਰ ਕਿਸੇ ਵਿੱਚ ਵੱਸਦਾ ਹੈ, ਤਾਂ ਤੁਸੀਂ ਦੁਨੀਆ ਤੋਂ ਕਿਉਂ ਭੱਜਦੇ ਹੋ? ਤੁਹਾਡੀ ਲੋੜ ਹੇਠਾਂ ਲੋਕਾਂ ਦੀ ਮਦਦ ਕਰਨ ਲਈ ਹੈ, ਇੱਥੇ ਲੁਕ ਕੇ ਬੈਠਣ ਲਈ ਨਹੀਂ।'"],l:"ਰੱਬ ਨੂੰ ਲੱਭਣ ਲਈ ਦੁਨੀਆ ਤੋਂ ਭੱਜਣ ਦੀ ਲੋੜ ਨਹੀਂ। ਰੱਬ ਹਰ ਕਿਸੇ ਵਿੱਚ ਵੱਸਦਾ ਹੈ, ਇਸ ਲਈ ਉਹ ਲੋਕਾਂ ਵਿੱਚ ਚੰਗਾ ਜੀਵਨ ਜੀ ਕੇ ਅਤੇ ਉਨ੍ਹਾਂ ਦੀ ਮਦਦ ਕਰ ਕੇ ਮਿਲਦਾ ਹੈ।"}},

{id:"king-karu",title:"King Karu's Gold",gur:"ਰਾਜਾ ਕਾਰੂ",cat:"Guru Nanak Dev Ji",age:"Kids",where:"A faraway kingdom",mins:3,c:"#F2B229",c2:"#DC3B32",h:390,art:"coins",
year:1515,approx:1,loc:[],themes:["Honesty","Sewa"],
summary:"A greedy king takes every scrap of gold and silver in his land. Guru Nanak asks him to help carry some pieces to the next world.",
text:["Guru Nanak Dev Ji and Bhai Mardana came to a land ruled by a cruel king named Karu. He loved gold and silver more than anything. If he heard that anyone had even one silver coin, he took it away by force.","One day his minister found out that, in that land, families placed a silver coin in the mouth of a person who had died, before burying them. Karu was so greedy that he ordered every grave to be dug up, and he took those coins too.","Guru Ji went to the palace and sat outside with a small heap of broken pottery pieces. When the king came out, he asked, 'Holy man, what are these for?' Guru Ji said, 'I am going to take them with me to the next world.' The king laughed. 'How can anyone take things to the next world?' Guru Ji answered, 'The same way you plan to take all your gold.'","The king stopped laughing. He thought of the coins taken from the graves. Not one of those people had been able to take even one small coin with them. 'You are right,' he said quietly. 'Please teach me how to get free of this greed.'","Guru Ji said, 'All the gold you can see will stay here when you die. Only your good deeds and your bad deeds go with you. Stop being cruel, and use the wealth you have collected to feed the poor.' King Karu opened his treasure houses and started a langar, a free kitchen, for all his people."],
lesson:"We can't take money with us when we die, but our good deeds go with us. Wealth is best used to help others.",
think:["Why did Guru Ji bring broken pottery to the palace?","What did King Karu do with his gold in the end?"],
words:[["Treasure house","A strong room where a king keeps gold and riches."],["Langar","The free community kitchen where everyone eats together."]],
quiz:[["What did King Karu love most?",["Gold and silver","Horses","Music"],0],["What did Guru Ji say he would take to the next world?",["Pieces of broken pottery","A bag of rice","His rabab"],0],["What did the king do with his wealth in the end?",["Started a langar for the poor","Buried it","Built a bigger palace"],0]],
pa:{t:["ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਅਤੇ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਇੱਕ ਅਜਿਹੇ ਦੇਸ਼ ਪਹੁੰਚੇ ਜਿੱਥੇ ਕਾਰੂ ਨਾਂ ਦਾ ਇੱਕ ਜ਼ਾਲਮ ਰਾਜਾ ਰਾਜ ਕਰਦਾ ਸੀ। ਉਸ ਨੂੰ ਸੋਨੇ-ਚਾਂਦੀ ਨਾਲ ਸਭ ਤੋਂ ਵੱਧ ਪਿਆਰ ਸੀ। ਜੇ ਉਹ ਸੁਣਦਾ ਕਿ ਕਿਸੇ ਕੋਲ ਚਾਂਦੀ ਦਾ ਇੱਕ ਸਿੱਕਾ ਵੀ ਹੈ, ਤਾਂ ਉਹ ਜ਼ੋਰ ਨਾਲ ਖੋਹ ਲੈਂਦਾ।","ਇੱਕ ਦਿਨ ਉਸ ਦੇ ਵਜ਼ੀਰ ਨੂੰ ਪਤਾ ਲੱਗਾ ਕਿ ਉਸ ਦੇਸ਼ ਵਿੱਚ ਲੋਕ ਮਰਨ ਵਾਲੇ ਦੇ ਮੂੰਹ ਵਿੱਚ ਚਾਂਦੀ ਦਾ ਇੱਕ ਸਿੱਕਾ ਰੱਖ ਕੇ ਦਫ਼ਨਾਉਂਦੇ ਹਨ। ਕਾਰੂ ਇੰਨਾ ਲਾਲਚੀ ਸੀ ਕਿ ਉਸ ਨੇ ਸਾਰੀਆਂ ਕਬਰਾਂ ਪੁਟਵਾ ਦਿੱਤੀਆਂ ਅਤੇ ਉਹ ਸਿੱਕੇ ਵੀ ਕਢਵਾ ਲਏ।","ਗੁਰੂ ਜੀ ਮਹਿਲ ਗਏ ਅਤੇ ਠੀਕਰੀਆਂ ਦੀ ਇੱਕ ਛੋਟੀ ਢੇਰੀ ਲੈ ਕੇ ਬਾਹਰ ਬੈਠ ਗਏ। ਜਦੋਂ ਰਾਜਾ ਬਾਹਰ ਆਇਆ, ਉਸ ਨੇ ਪੁੱਛਿਆ, 'ਸੰਤ ਜੀ, ਇਹ ਕਾਹਦੇ ਲਈ ਹਨ?' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਇਹ ਮੈਂ ਅਗਲੇ ਜਹਾਨ ਨਾਲ ਲੈ ਕੇ ਜਾਣੀਆਂ ਹਨ।' ਰਾਜਾ ਹੱਸਿਆ, 'ਕੋਈ ਅਗਲੇ ਜਹਾਨ ਚੀਜ਼ਾਂ ਕਿਵੇਂ ਲੈ ਜਾ ਸਕਦਾ ਹੈ?' ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਉਵੇਂ ਹੀ, ਜਿਵੇਂ ਤੁਸੀਂ ਆਪਣਾ ਸਾਰਾ ਸੋਨਾ ਲੈ ਕੇ ਜਾਣ ਦੀ ਸੋਚਦੇ ਹੋ।'","ਰਾਜੇ ਦਾ ਹਾਸਾ ਰੁਕ ਗਿਆ। ਉਸ ਨੂੰ ਕਬਰਾਂ ਵਿੱਚੋਂ ਕੱਢੇ ਸਿੱਕੇ ਯਾਦ ਆਏ। ਉਨ੍ਹਾਂ ਵਿੱਚੋਂ ਕੋਈ ਵੀ ਇੱਕ ਛੋਟਾ ਜਿਹਾ ਸਿੱਕਾ ਵੀ ਨਾਲ ਨਹੀਂ ਲੈ ਜਾ ਸਕਿਆ ਸੀ। ਉਸ ਨੇ ਹੌਲੀ ਜਿਹੀ ਕਿਹਾ, 'ਤੁਸੀਂ ਠੀਕ ਕਹਿੰਦੇ ਹੋ। ਮੈਨੂੰ ਇਸ ਲਾਲਚ ਤੋਂ ਛੁਟਕਾਰੇ ਦਾ ਰਾਹ ਦੱਸੋ।'","ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਜਿੰਨਾ ਸੋਨਾ ਤੁਸੀਂ ਵੇਖਦੇ ਹੋ, ਮਰਨ ਵੇਲੇ ਸਭ ਇੱਥੇ ਹੀ ਰਹਿ ਜਾਵੇਗਾ। ਨਾਲ ਸਿਰਫ਼ ਚੰਗੇ ਅਤੇ ਮਾੜੇ ਕਰਮ ਜਾਂਦੇ ਹਨ। ਜ਼ੁਲਮ ਛੱਡ ਦਿਓ, ਅਤੇ ਇਕੱਠੇ ਕੀਤੇ ਧਨ ਨਾਲ ਗਰੀਬਾਂ ਨੂੰ ਭੋਜਨ ਛਕਾਓ।' ਰਾਜਾ ਕਾਰੂ ਨੇ ਆਪਣੇ ਖ਼ਜ਼ਾਨੇ ਖੋਲ੍ਹ ਦਿੱਤੇ ਅਤੇ ਸਾਰੀ ਪਰਜਾ ਲਈ ਲੰਗਰ ਸ਼ੁਰੂ ਕਰ ਦਿੱਤਾ।"],l:"ਮਰਨ ਵੇਲੇ ਪੈਸਾ ਨਾਲ ਨਹੀਂ ਜਾਂਦਾ, ਪਰ ਚੰਗੇ ਕਰਮ ਨਾਲ ਜਾਂਦੇ ਹਨ। ਧਨ ਦੀ ਸਭ ਤੋਂ ਚੰਗੀ ਵਰਤੋਂ ਦੂਜਿਆਂ ਦੀ ਮਦਦ ਹੈ।"}},

{id:"baghdad-skies",title:"Skies Beyond Skies",gur:"ਪਾਤਾਲਾ ਪਾਤਾਲ ਲਖ ਆਗਾਸਾ ਆਗਾਸ",cat:"Guru Nanak Dev Ji",age:"Kids",where:"Baghdad",mins:3,c:"#1E1E24",c2:"#1FA38A",h:405,art:"stars",
year:1520,approx:1,loc:["baghdad"],themes:["Faith","Humility"],
summary:"In Baghdad, a Pir hears Guru Nanak sing that there are countless skies and worlds. He asks to be shown.",
text:["On his long journey to the west, Guru Nanak Dev Ji and Bhai Mardana camped outside the city of Baghdad. Some people there believed that singing and music were wrong. When they heard Guru Ji singing, an angry crowd came out with stones.","But as they came closer, the sweet music of Guru Ji's shabad made them stop. The stones dropped from their hands. Guru Ji said kindly, 'Music that sings God's praises is not bad. Only music that fills the mind with bad thoughts is bad.' The crowd asked his forgiveness and welcomed him into the city.","The next morning, Guru Ji recited Japji Sahib. The Pir of Baghdad, a holy man named Dastgir, heard the line that says there are hundreds of thousands of worlds below and skies above, and no one can count them all. He was amazed, because he had been taught there were only seven skies and seven worlds below.","'Show me these countless skies, and then I'll believe you,' said the Pir. Guru Ji took the hand of the Pir's young son and asked him to close his eyes. When the boy opened them again, he said he had seen worlds upon worlds and skies upon skies, more than he could ever count.","The Pir bowed to Guru Ji. Today there is a small shrine in Baghdad where people remember Guru Nanak's visit. Guru Ji's words are still sung every morning: God's creation is so vast that nobody can ever measure it."],
lesson:"God's creation is bigger than we can imagine. We should stay humble and keep learning.",
think:["Why did the stones drop from the people's hands?","What do you think the boy saw?"],
words:[["Japji Sahib","The first prayer in Sri Guru Granth Sahib Ji, recited every morning."],["Baghdad","A great old city, now in Iraq."]],
quiz:[["Why did some people come with stones?",["They thought music was wrong","They wanted to play a game","They were building a house"],0],["Which prayer did Guru Ji recite in the morning?",["Japji Sahib","Rehras Sahib","Kirtan Sohila"],0],["What did the Pir learn about the skies?",["There are countless skies and worlds","There are only seven","There is only one"],0]],
pa:{t:["ਪੱਛਮ ਦੀ ਲੰਮੀ ਯਾਤਰਾ ਦੌਰਾਨ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਅਤੇ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਨੇ ਬਗ਼ਦਾਦ ਸ਼ਹਿਰ ਦੇ ਬਾਹਰ ਡੇਰਾ ਲਾਇਆ। ਉੱਥੇ ਕੁਝ ਲੋਕ ਮੰਨਦੇ ਸਨ ਕਿ ਗਾਉਣਾ-ਵਜਾਉਣਾ ਗ਼ਲਤ ਹੈ। ਗੁਰੂ ਜੀ ਨੂੰ ਗਾਉਂਦਿਆਂ ਸੁਣ ਕੇ ਗੁੱਸੇ ਵਿੱਚ ਭਰੀ ਭੀੜ ਪੱਥਰ ਲੈ ਕੇ ਆ ਗਈ।","ਪਰ ਜਿਵੇਂ-ਜਿਵੇਂ ਉਹ ਨੇੜੇ ਆਏ, ਗੁਰੂ ਜੀ ਦੇ ਸ਼ਬਦ ਦੇ ਮਿੱਠੇ ਸੁਰ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਰੋਕ ਲਿਆ। ਪੱਥਰ ਉਨ੍ਹਾਂ ਦੇ ਹੱਥਾਂ ਵਿੱਚੋਂ ਡਿੱਗ ਪਏ। ਗੁਰੂ ਜੀ ਨੇ ਪਿਆਰ ਨਾਲ ਕਿਹਾ, 'ਜੋ ਸੰਗੀਤ ਰੱਬ ਦੀ ਸਿਫ਼ਤ ਗਾਉਂਦਾ ਹੈ, ਉਹ ਮਾੜਾ ਨਹੀਂ। ਮਾੜਾ ਸਿਰਫ਼ ਉਹ ਸੰਗੀਤ ਹੈ ਜੋ ਮਨ ਵਿੱਚ ਬੁਰੇ ਖ਼ਿਆਲ ਭਰੇ।' ਭੀੜ ਨੇ ਮਾਫ਼ੀ ਮੰਗੀ ਅਤੇ ਗੁਰੂ ਜੀ ਨੂੰ ਸ਼ਹਿਰ ਵਿੱਚ ਲੈ ਗਈ।","ਅਗਲੀ ਸਵੇਰ ਗੁਰੂ ਜੀ ਨੇ ਜਪੁਜੀ ਸਾਹਿਬ ਦਾ ਪਾਠ ਕੀਤਾ। ਬਗ਼ਦਾਦ ਦੇ ਪੀਰ ਦਸਤਗੀਰ ਨੇ ਉਹ ਤੁਕ ਸੁਣੀ: ਪਾਤਾਲਾ ਪਾਤਾਲ ਲਖ ਆਗਾਸਾ ਆਗਾਸ, ਭਾਵ ਹੇਠਾਂ ਲੱਖਾਂ ਪਾਤਾਲ ਹਨ ਅਤੇ ਉੱਪਰ ਲੱਖਾਂ ਆਕਾਸ਼, ਜਿਨ੍ਹਾਂ ਨੂੰ ਕੋਈ ਗਿਣ ਨਹੀਂ ਸਕਦਾ। ਉਹ ਹੈਰਾਨ ਰਹਿ ਗਿਆ, ਕਿਉਂਕਿ ਉਸ ਨੂੰ ਸਿਖਾਇਆ ਗਿਆ ਸੀ ਕਿ ਸਿਰਫ਼ ਸੱਤ ਆਕਾਸ਼ ਅਤੇ ਸੱਤ ਪਾਤਾਲ ਹਨ।","ਪੀਰ ਨੇ ਕਿਹਾ, 'ਮੈਨੂੰ ਇਹ ਅਣਗਿਣਤ ਆਕਾਸ਼ ਵਿਖਾਓ, ਫਿਰ ਮੰਨਾਂਗਾ।' ਗੁਰੂ ਜੀ ਨੇ ਪੀਰ ਦੇ ਛੋਟੇ ਪੁੱਤਰ ਦਾ ਹੱਥ ਫੜਿਆ ਅਤੇ ਅੱਖਾਂ ਮੀਟਣ ਲਈ ਕਿਹਾ। ਜਦੋਂ ਮੁੰਡੇ ਨੇ ਅੱਖਾਂ ਖੋਲ੍ਹੀਆਂ, ਉਸ ਨੇ ਦੱਸਿਆ ਕਿ ਉਸ ਨੇ ਮੰਡਲਾਂ ਉੱਤੇ ਮੰਡਲ ਅਤੇ ਆਕਾਸ਼ਾਂ ਉੱਤੇ ਆਕਾਸ਼ ਵੇਖੇ ਹਨ, ਜਿੰਨੇ ਉਹ ਕਦੇ ਗਿਣ ਨਹੀਂ ਸਕਦਾ।","ਪੀਰ ਨੇ ਗੁਰੂ ਜੀ ਅੱਗੇ ਸਿਰ ਝੁਕਾਇਆ। ਅੱਜ ਵੀ ਬਗ਼ਦਾਦ ਵਿੱਚ ਇੱਕ ਛੋਟੀ ਯਾਦਗਾਰ ਹੈ ਜਿੱਥੇ ਲੋਕ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦੀ ਫੇਰੀ ਨੂੰ ਯਾਦ ਕਰਦੇ ਹਨ। ਗੁਰੂ ਜੀ ਦੇ ਬਚਨ ਅੱਜ ਵੀ ਹਰ ਸਵੇਰ ਪੜ੍ਹੇ ਜਾਂਦੇ ਹਨ: ਰੱਬ ਦੀ ਰਚਨਾ ਇੰਨੀ ਵਿਸ਼ਾਲ ਹੈ ਕਿ ਕੋਈ ਉਸ ਨੂੰ ਮਿਣ ਨਹੀਂ ਸਕਦਾ।"],l:"ਰੱਬ ਦੀ ਰਚਨਾ ਸਾਡੀ ਸੋਚ ਤੋਂ ਵੀ ਵੱਡੀ ਹੈ। ਸਾਨੂੰ ਨਿਮਰ ਰਹਿਣਾ ਅਤੇ ਸਿੱਖਦੇ ਰਹਿਣਾ ਚਾਹੀਦਾ ਹੈ।"}},

{id:"shah-suhagan",title:"The Hermit in Red",gur:"ਸ਼ਾਹ ਸੁਹਾਗਣ",cat:"Guru Nanak Dev Ji",age:"Kids",where:"Dinga, near Gujrat",mins:3,c:"#DC3B32",c2:"#F2B229",h:395,art:"flowers",
year:1520,approx:1,loc:[],themes:["Honesty","Humility"],
summary:"A hermit dresses like a bride and says God visits him every full moon. Guru Nanak comes to meet him.",
text:["In the town of Dinga lived a hermit called Shah Suhagan. He always wore red clothes, like a new bride, because he wanted people to believe that God was his husband and came to visit him. Crowds came to see him and gave him rich offerings.","Guru Nanak Dev Ji said, 'Come, Bhai Mardana, let's go and meet this Shah Suhagan whom everyone praises.' On the day of the full moon, they reached his hermitage. It was as busy as a fair. People were handing their gifts to a servant at the door.","'On the full moon,' the people explained, 'Shah Suhagan scatters flowers in his courtyard and shuts himself inside, because God comes to visit him.' Guru Ji sent a message: 'Two fakirs have come to see you.' The reply came back: 'I can't see anyone today. I am waiting for God. Come tomorrow.'","Guru Ji said, 'If he had truly met God, he would see God in everyone who comes to his door.' As they walked away, a fight broke out at the hermitage. People realised the visits from God were a trick. They trampled the flowers, and the hermit ran away and hurt his leg.","The next morning a limping man in plain clothes came and fell at Guru Ji's feet. It was Shah Suhagan. 'It was all a fraud,' he said. 'Please forgive me, and come to my hermitage.' Guru Ji went with him, and that day people came to the same place to listen to the truth."],
lesson:"Pretending to be holy is a kind of lie. God is found by seeing God in everyone, not by showing off.",
think:["How would someone who truly loves God treat visitors?","Why did the people get so angry?"],
words:[["Hermit","Someone who lives alone for religious reasons."],["Fakir","A holy person who lives simply."]],
quiz:[["What colour clothes did Shah Suhagan wear?",["Red, like a bride","White","Blue"],0],["What did he say when Guru Ji asked to meet him?",["Come tomorrow, I'm waiting for God","Come in","Go away forever"],0],["What did Guru Ji say someone who truly met God would do?",["See God in everyone","Stay inside","Wear red"],0]],
pa:{t:["ਡਿੰਗੇ ਸ਼ਹਿਰ ਵਿੱਚ ਸ਼ਾਹ ਸੁਹਾਗਣ ਨਾਂ ਦਾ ਇੱਕ ਫ਼ਕੀਰ ਰਹਿੰਦਾ ਸੀ। ਉਹ ਹਮੇਸ਼ਾ ਨਵੀਂ ਵਿਆਹੀ ਦੁਲਹਨ ਵਾਂਗ ਲਾਲ ਕੱਪੜੇ ਪਾਉਂਦਾ ਸੀ, ਕਿਉਂਕਿ ਉਹ ਚਾਹੁੰਦਾ ਸੀ ਕਿ ਲੋਕ ਮੰਨਣ ਕਿ ਰੱਬ ਉਸ ਦਾ ਪਤੀ ਹੈ ਅਤੇ ਉਸ ਨੂੰ ਮਿਲਣ ਆਉਂਦਾ ਹੈ। ਭੀੜਾਂ ਉਸ ਨੂੰ ਵੇਖਣ ਆਉਂਦੀਆਂ ਅਤੇ ਕੀਮਤੀ ਭੇਟਾਂ ਚੜ੍ਹਾਉਂਦੀਆਂ।","ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਨੇ ਕਿਹਾ, 'ਆ ਭਾਈ ਮਰਦਾਨਿਆ, ਇਸ ਸ਼ਾਹ ਸੁਹਾਗਣ ਨੂੰ ਮਿਲੀਏ, ਜਿਸ ਦੀ ਸਾਰੇ ਸਿਫ਼ਤ ਕਰਦੇ ਹਨ।' ਪੂਰਨਮਾਸ਼ੀ ਵਾਲੇ ਦਿਨ ਉਹ ਉਸ ਦੇ ਡੇਰੇ ਪਹੁੰਚੇ। ਉੱਥੇ ਮੇਲੇ ਵਰਗੀ ਰੌਣਕ ਸੀ। ਲੋਕ ਦਰਵਾਜ਼ੇ ਉੱਤੇ ਖੜ੍ਹੇ ਸੇਵਾਦਾਰ ਨੂੰ ਭੇਟਾਂ ਦੇ ਰਹੇ ਸਨ।","ਲੋਕਾਂ ਨੇ ਦੱਸਿਆ, 'ਪੂਰਨਮਾਸ਼ੀ ਨੂੰ ਸ਼ਾਹ ਸੁਹਾਗਣ ਵਿਹੜੇ ਵਿੱਚ ਫੁੱਲ ਵਿਛਾ ਕੇ ਅੰਦਰ ਬੰਦ ਹੋ ਜਾਂਦਾ ਹੈ, ਕਿਉਂਕਿ ਰੱਬ ਉਸ ਨੂੰ ਮਿਲਣ ਆਉਂਦਾ ਹੈ।' ਗੁਰੂ ਜੀ ਨੇ ਸੁਨੇਹਾ ਭੇਜਿਆ, 'ਦੋ ਫ਼ਕੀਰ ਤੁਹਾਨੂੰ ਮਿਲਣ ਆਏ ਹਨ।' ਜਵਾਬ ਆਇਆ, 'ਅੱਜ ਮੈਂ ਕਿਸੇ ਨੂੰ ਨਹੀਂ ਮਿਲ ਸਕਦਾ। ਮੈਂ ਰੱਬ ਦੀ ਉਡੀਕ ਕਰ ਰਿਹਾ ਹਾਂ। ਕੱਲ੍ਹ ਆਉਣਾ।'","ਗੁਰੂ ਜੀ ਨੇ ਕਿਹਾ, 'ਜੇ ਇਸ ਨੂੰ ਸੱਚਮੁੱਚ ਰੱਬ ਮਿਲਿਆ ਹੁੰਦਾ, ਤਾਂ ਇਸ ਨੂੰ ਦਰ ਉੱਤੇ ਆਏ ਹਰ ਕਿਸੇ ਵਿੱਚ ਰੱਬ ਦਿਸਦਾ।' ਜਦੋਂ ਉਹ ਤੁਰ ਪਏ, ਡੇਰੇ ਵਿੱਚ ਝਗੜਾ ਹੋ ਗਿਆ। ਲੋਕ ਸਮਝ ਗਏ ਕਿ ਰੱਬ ਦੇ ਆਉਣ ਦੀ ਗੱਲ ਧੋਖਾ ਸੀ। ਉਨ੍ਹਾਂ ਨੇ ਫੁੱਲ ਮਿੱਧ ਦਿੱਤੇ, ਅਤੇ ਫ਼ਕੀਰ ਭੱਜ ਗਿਆ ਅਤੇ ਉਸ ਦੀ ਲੱਤ ਉੱਤੇ ਸੱਟ ਲੱਗ ਗਈ।","ਅਗਲੀ ਸਵੇਰ ਸਾਦੇ ਕੱਪੜਿਆਂ ਵਿੱਚ ਇੱਕ ਲੰਗੜਾਉਂਦਾ ਆਦਮੀ ਆਇਆ ਅਤੇ ਗੁਰੂ ਜੀ ਦੇ ਚਰਨਾਂ ਉੱਤੇ ਡਿੱਗ ਪਿਆ। ਉਹ ਸ਼ਾਹ ਸੁਹਾਗਣ ਸੀ। ਉਸ ਨੇ ਕਿਹਾ, 'ਉਹ ਸਭ ਧੋਖਾ ਸੀ। ਮੈਨੂੰ ਮਾਫ਼ ਕਰੋ ਅਤੇ ਮੇਰੇ ਡੇਰੇ ਚੱਲੋ।' ਗੁਰੂ ਜੀ ਉਸ ਨਾਲ ਗਏ, ਅਤੇ ਉਸ ਦਿਨ ਲੋਕ ਉਸੇ ਥਾਂ ਉੱਤੇ ਸੱਚ ਸੁਣਨ ਆਏ।"],l:"ਪਵਿੱਤਰ ਹੋਣ ਦਾ ਦਿਖਾਵਾ ਵੀ ਇੱਕ ਝੂਠ ਹੈ। ਰੱਬ ਦਿਖਾਵੇ ਨਾਲ ਨਹੀਂ, ਹਰ ਕਿਸੇ ਵਿੱਚ ਰੱਬ ਵੇਖਣ ਨਾਲ ਮਿਲਦਾ ਹੈ।"}},

{id:"babar-vani",title:"Babar's Invasion",gur:"ਬਾਬਰ ਬਾਣੀ",cat:"Guru Nanak Dev Ji",age:"Youth",where:"Saidpur (Eminabad)",mins:3,c:"#4867D6",c2:"#F0702A",h:400,art:"chakki",
year:1521,loc:["eminabad"],themes:["Courage","Equality"],
summary:"Guru Nanak warns that Babar's army is coming. When the city falls, he is made a prisoner, and speaks up for the people.",
text:["On his way back from the west, Guru Nanak Dev Ji had seen Babar, the ruler of Kabul, getting his army ready to invade India. Guru Ji came to Saidpur, now called Eminabad, and stayed with his friend Bhai Lalo. He sang a shabad warning people that Babar was coming, and that terrible suffering would follow.","The rulers of the city did not prepare to defend it. Instead, they paid people to recite prayers, hoping that would be enough. When Babar's army arrived, it captured the city easily. Homes were looted, and many people were killed or taken prisoner.","Guru Nanak Dev Ji and Bhai Mardana were taken prisoner too. The prisoners were made to grind grain on heavy stone hand-mills to make flour for the army. Guru Ji worked alongside them, sharing their hardship, and sang shabads that gave them strength and hope.","Guru Ji did not stay silent about what he saw. In his shabads, now known as Babar Vani, he spoke up for the suffering people: Khurasan khasmana kia, Hindustan daraia. Babar had taken Khurasan and terrified Hindustan. He even asked God why there was so much suffering. These shabads are in Sri Guru Granth Sahib Ji.","When Babar heard about the holy man among the prisoners, he came to meet him. Guru Ji spoke to him fearlessly about justice and mercy. Babar was moved, and at Guru Ji's request he set the prisoners of Saidpur free."],
lesson:"It takes courage to speak up for people who are suffering, even in front of someone powerful. We should share others' hardships, not look away.",
think:["Why did Guru Ji grind grain alongside the other prisoners?","What do you think Guru Ji said to Babar?"],
words:[["Chakki","A heavy stone hand-mill for grinding grain into flour."],["Babar Vani","Guru Nanak Dev Ji's shabads about Babar's invasion."],["Invade","When an army attacks and enters another land."]],
quiz:[["Who did Guru Ji stay with in Saidpur?",["Bhai Lalo","Duni Chand","Mool Chand"],0],["What work were the prisoners made to do?",["Grind grain on hand-mills","Build walls","Carry water"],0],["What did Babar do after meeting Guru Ji?",["Set the prisoners free","Built a fort","Left without a word"],0]],
pa:{t:["ਪੱਛਮ ਤੋਂ ਵਾਪਸੀ ਵੇਲੇ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਨੇ ਕਾਬਲ ਦੇ ਹਾਕਮ ਬਾਬਰ ਨੂੰ ਹਿੰਦੁਸਤਾਨ ਉੱਤੇ ਹਮਲੇ ਦੀ ਤਿਆਰੀ ਕਰਦਿਆਂ ਵੇਖਿਆ ਸੀ। ਗੁਰੂ ਜੀ ਸੈਦਪੁਰ, ਜਿਸ ਨੂੰ ਹੁਣ ਐਮਨਾਬਾਦ ਕਹਿੰਦੇ ਹਨ, ਆਏ ਅਤੇ ਆਪਣੇ ਮਿੱਤਰ ਭਾਈ ਲਾਲੋ ਜੀ ਕੋਲ ਠਹਿਰੇ। ਉਨ੍ਹਾਂ ਨੇ ਸ਼ਬਦ ਗਾ ਕੇ ਲੋਕਾਂ ਨੂੰ ਸਾਵਧਾਨ ਕੀਤਾ ਕਿ ਬਾਬਰ ਆ ਰਿਹਾ ਹੈ ਅਤੇ ਭਿਆਨਕ ਦੁੱਖ ਆਉਣਗੇ।","ਸ਼ਹਿਰ ਦੇ ਹਾਕਮਾਂ ਨੇ ਬਚਾਅ ਦੀ ਤਿਆਰੀ ਨਾ ਕੀਤੀ। ਸਗੋਂ ਉਨ੍ਹਾਂ ਨੇ ਕੁਝ ਲੋਕਾਂ ਨੂੰ ਪੈਸੇ ਦੇ ਕੇ ਪਾਠ ਕਰਵਾਏ, ਇਹ ਸੋਚ ਕੇ ਕਿ ਇਹੀ ਕਾਫ਼ੀ ਹੈ। ਜਦੋਂ ਬਾਬਰ ਦੀ ਫ਼ੌਜ ਆਈ, ਉਸ ਨੇ ਸੌਖਿਆਂ ਹੀ ਸ਼ਹਿਰ ਉੱਤੇ ਕਬਜ਼ਾ ਕਰ ਲਿਆ। ਘਰ ਲੁੱਟੇ ਗਏ, ਅਤੇ ਬਹੁਤ ਸਾਰੇ ਲੋਕ ਮਾਰੇ ਗਏ ਜਾਂ ਕੈਦ ਕਰ ਲਏ ਗਏ।","ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਅਤੇ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਨੂੰ ਵੀ ਕੈਦ ਕਰ ਲਿਆ ਗਿਆ। ਕੈਦੀਆਂ ਤੋਂ ਫ਼ੌਜ ਲਈ ਆਟਾ ਬਣਾਉਣ ਵਾਸਤੇ ਭਾਰੀ ਪੱਥਰ ਦੀਆਂ ਚੱਕੀਆਂ ਪਿਸਵਾਈਆਂ ਗਈਆਂ। ਗੁਰੂ ਜੀ ਨੇ ਵੀ ਉਨ੍ਹਾਂ ਨਾਲ ਚੱਕੀ ਪੀਸੀ, ਉਨ੍ਹਾਂ ਦਾ ਦੁੱਖ ਵੰਡਾਇਆ, ਅਤੇ ਸ਼ਬਦ ਗਾ ਕੇ ਉਨ੍ਹਾਂ ਨੂੰ ਹੌਸਲਾ ਅਤੇ ਆਸ ਦਿੱਤੀ।","ਗੁਰੂ ਜੀ ਨੇ ਜੋ ਵੇਖਿਆ ਉਸ ਬਾਰੇ ਚੁੱਪ ਨਹੀਂ ਰਹੇ। ਆਪਣੇ ਸ਼ਬਦਾਂ ਵਿੱਚ, ਜਿਨ੍ਹਾਂ ਨੂੰ ਹੁਣ ਬਾਬਰ ਬਾਣੀ ਕਿਹਾ ਜਾਂਦਾ ਹੈ, ਉਨ੍ਹਾਂ ਨੇ ਦੁਖੀ ਲੋਕਾਂ ਦੇ ਹੱਕ ਵਿੱਚ ਆਵਾਜ਼ ਚੁੱਕੀ: ਖੁਰਾਸਾਨ ਖਸਮਾਨਾ ਕੀਆ ਹਿੰਦੁਸਤਾਨੁ ਡਰਾਇਆ। ਉਨ੍ਹਾਂ ਨੇ ਰੱਬ ਤੋਂ ਵੀ ਪੁੱਛਿਆ ਕਿ ਇੰਨਾ ਦੁੱਖ ਕਿਉਂ ਹੈ। ਇਹ ਸ਼ਬਦ ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਜੀ ਵਿੱਚ ਦਰਜ ਹਨ।","ਜਦੋਂ ਬਾਬਰ ਨੇ ਕੈਦੀਆਂ ਵਿੱਚ ਇੱਕ ਸੰਤ ਬਾਰੇ ਸੁਣਿਆ, ਉਹ ਉਨ੍ਹਾਂ ਨੂੰ ਮਿਲਣ ਆਇਆ। ਗੁਰੂ ਜੀ ਨੇ ਨਿਡਰ ਹੋ ਕੇ ਉਸ ਨਾਲ ਇਨਸਾਫ਼ ਅਤੇ ਰਹਿਮ ਦੀ ਗੱਲ ਕੀਤੀ। ਬਾਬਰ ਦਾ ਦਿਲ ਪਸੀਜ ਗਿਆ, ਅਤੇ ਗੁਰੂ ਜੀ ਦੇ ਕਹਿਣ ਉੱਤੇ ਉਸ ਨੇ ਸੈਦਪੁਰ ਦੇ ਕੈਦੀ ਛੱਡ ਦਿੱਤੇ।"],l:"ਦੁਖੀ ਲੋਕਾਂ ਲਈ ਬੋਲਣ ਨੂੰ ਹੌਸਲਾ ਚਾਹੀਦਾ ਹੈ, ਭਾਵੇਂ ਸਾਹਮਣੇ ਕੋਈ ਤਾਕਤਵਰ ਹੋਵੇ। ਸਾਨੂੰ ਦੂਜਿਆਂ ਦਾ ਦੁੱਖ ਵੰਡਾਉਣਾ ਚਾਹੀਦਾ ਹੈ, ਮੂੰਹ ਨਹੀਂ ਫੇਰਨਾ ਚਾਹੀਦਾ।"}},

{id:"leper-hut",title:"The Light in the Hut",gur:"ਕੋੜ੍ਹੀ ਦਾ ਉਧਾਰ",cat:"Guru Nanak Dev Ji",age:"Kids",where:"Near Dipalpur",mins:2,c:"#1590B0",c2:"#F0702A",h:390,art:"hut",
year:1520,approx:1,loc:["dipalpur"],themes:["Equality","Sewa"],
summary:"On a rainy night, no one in the village will give Guru Nanak shelter. A lamp is glowing in a lonely hut outside.",
text:["One evening Guru Nanak Dev Ji and Bhai Mardana reached a village near Dipalpur. It was raining hard and getting dark. Bhai Mardana went from house to house, asking for a place to stay for the night.","But nobody would let them in. 'If you were both Hindus, a Hindu would keep you,' people said. 'If you were both Muslims, a Muslim would. But who will keep a Hindu and a Muslim together?' Bhai Mardana walked back sadly through the rain.","On the way, he saw a small lamp glowing in a hut outside the village. A man lived there who had leprosy, a disease of the skin. His own family had sent him away, because they were afraid of catching it. They left food and water for him, but nobody ever came near him.","Guru Ji and Bhai Mardana went to the hut. The man was amazed. 'Nobody has come near me for years,' he cried. 'Even the birds fly away from me. Why have you come?' Guru Ji sat beside him with love. Bhai Mardana played the rabab and Guru Ji sang a shabad, and the man's lonely heart filled with peace.","By morning, the man's sores had healed. He bowed to Guru Ji with tears of joy. When the villagers saw him well again, they were ashamed of how they had treated him, and of how they had turned away two holy guests just because of their religions."],
lesson:"Never push anyone away because they are ill, poor, or different. Love and kindness can heal hearts that have been lonely for a long time.",
think:["Why did the villagers refuse Guru Ji and Bhai Mardana?","How do you think the sick man felt when they came to his hut?"],
words:[["Leprosy","A disease of the skin and nerves, which can now be cured with medicine."],["Shelter","A safe place to stay."]],
quiz:[["Why wouldn't the villagers give them shelter?",["One was Hindu and one was Muslim","They had no money","It was too late"],0],["Who lived in the hut outside the village?",["A man with leprosy","A farmer","A soldier"],0],["What happened by morning?",["The man was healed","The hut fell down","The rain got heavier"],0]],
pa:{t:["ਇੱਕ ਸ਼ਾਮ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਅਤੇ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਦੀਪਾਲਪੁਰ ਨੇੜੇ ਇੱਕ ਪਿੰਡ ਪਹੁੰਚੇ। ਜ਼ੋਰਦਾਰ ਮੀਂਹ ਪੈ ਰਿਹਾ ਸੀ ਅਤੇ ਹਨੇਰਾ ਹੋ ਰਿਹਾ ਸੀ। ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਘਰ-ਘਰ ਜਾ ਕੇ ਰਾਤ ਕੱਟਣ ਲਈ ਥਾਂ ਮੰਗਣ ਲੱਗੇ।","ਪਰ ਕਿਸੇ ਨੇ ਅੰਦਰ ਨਾ ਆਉਣ ਦਿੱਤਾ। ਲੋਕ ਕਹਿੰਦੇ, 'ਜੇ ਤੁਸੀਂ ਦੋਵੇਂ ਹਿੰਦੂ ਹੁੰਦੇ ਤਾਂ ਕੋਈ ਹਿੰਦੂ ਰੱਖ ਲੈਂਦਾ। ਜੇ ਦੋਵੇਂ ਮੁਸਲਮਾਨ ਹੁੰਦੇ ਤਾਂ ਕੋਈ ਮੁਸਲਮਾਨ ਰੱਖ ਲੈਂਦਾ। ਪਰ ਇੱਕ ਹਿੰਦੂ ਅਤੇ ਇੱਕ ਮੁਸਲਮਾਨ ਨੂੰ ਇਕੱਠੇ ਕੌਣ ਰੱਖੇ?' ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਉਦਾਸ ਹੋ ਕੇ ਮੀਂਹ ਵਿੱਚ ਵਾਪਸ ਤੁਰ ਪਏ।","ਰਾਹ ਵਿੱਚ ਉਨ੍ਹਾਂ ਨੂੰ ਪਿੰਡੋਂ ਬਾਹਰ ਇੱਕ ਝੌਂਪੜੀ ਵਿੱਚ ਛੋਟਾ ਜਿਹਾ ਦੀਵਾ ਬਲਦਾ ਦਿਸਿਆ। ਉੱਥੇ ਕੋੜ੍ਹ ਦੀ ਬਿਮਾਰੀ ਵਾਲਾ ਇੱਕ ਆਦਮੀ ਰਹਿੰਦਾ ਸੀ। ਉਸ ਦੇ ਆਪਣੇ ਪਰਿਵਾਰ ਨੇ ਬਿਮਾਰੀ ਲੱਗਣ ਦੇ ਡਰੋਂ ਉਸ ਨੂੰ ਘਰੋਂ ਕੱਢ ਦਿੱਤਾ ਸੀ। ਉਹ ਉਸ ਲਈ ਭੋਜਨ-ਪਾਣੀ ਰੱਖ ਜਾਂਦੇ, ਪਰ ਕੋਈ ਉਸ ਦੇ ਨੇੜੇ ਨਾ ਆਉਂਦਾ।","ਗੁਰੂ ਜੀ ਅਤੇ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਝੌਂਪੜੀ ਵਿੱਚ ਗਏ। ਉਹ ਆਦਮੀ ਹੈਰਾਨ ਹੋ ਗਿਆ ਅਤੇ ਰੋ ਪਿਆ, 'ਸਾਲਾਂ ਤੋਂ ਕੋਈ ਮੇਰੇ ਨੇੜੇ ਨਹੀਂ ਆਇਆ। ਪੰਛੀ ਵੀ ਮੈਥੋਂ ਉੱਡ ਜਾਂਦੇ ਹਨ। ਤੁਸੀਂ ਕਿਉਂ ਆਏ ਹੋ?' ਗੁਰੂ ਜੀ ਪਿਆਰ ਨਾਲ ਉਸ ਦੇ ਕੋਲ ਬੈਠ ਗਏ। ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਨੇ ਰਬਾਬ ਵਜਾਈ ਅਤੇ ਗੁਰੂ ਜੀ ਨੇ ਸ਼ਬਦ ਗਾਇਆ, ਅਤੇ ਉਸ ਦੇ ਇਕੱਲੇ ਦਿਲ ਵਿੱਚ ਸ਼ਾਂਤੀ ਭਰ ਗਈ।","ਸਵੇਰ ਤੱਕ ਉਸ ਦੇ ਜ਼ਖ਼ਮ ਠੀਕ ਹੋ ਗਏ। ਉਸ ਨੇ ਖ਼ੁਸ਼ੀ ਦੇ ਹੰਝੂਆਂ ਨਾਲ ਗੁਰੂ ਜੀ ਅੱਗੇ ਸਿਰ ਨਿਵਾਇਆ। ਜਦੋਂ ਪਿੰਡ ਵਾਲਿਆਂ ਨੇ ਉਸ ਨੂੰ ਤੰਦਰੁਸਤ ਵੇਖਿਆ, ਉਹ ਸ਼ਰਮਿੰਦੇ ਹੋਏ ਕਿ ਉਨ੍ਹਾਂ ਨੇ ਉਸ ਨਾਲ ਕਿਹੋ ਜਿਹਾ ਸਲੂਕ ਕੀਤਾ ਸੀ, ਅਤੇ ਸਿਰਫ਼ ਧਰਮ ਕਰਕੇ ਦੋ ਪਵਿੱਤਰ ਮਹਿਮਾਨਾਂ ਨੂੰ ਮੋੜ ਦਿੱਤਾ ਸੀ।"],l:"ਕਿਸੇ ਨੂੰ ਬਿਮਾਰੀ, ਗਰੀਬੀ ਜਾਂ ਵੱਖਰੇਪਣ ਕਰਕੇ ਕਦੇ ਦੂਰ ਨਾ ਕਰੋ। ਪਿਆਰ ਅਤੇ ਦਇਆ ਲੰਮੇ ਸਮੇਂ ਤੋਂ ਇਕੱਲੇ ਦਿਲਾਂ ਨੂੰ ਵੀ ਠੀਕ ਕਰ ਸਕਦੇ ਹਨ।"}},

{id:"flowers-at-kartarpur",title:"Flowers Under the Sheet",gur:"ਜੋਤੀ ਜੋਤਿ",cat:"Guru Nanak Dev Ji",age:"Kids",where:"Kartarpur, on the Ravi",mins:2,c:"#2FA45A",c2:"#F2B229",h:395,art:"sheet",
year:1539,loc:["kartarpur_r"],themes:["Equality","Faith"],
summary:"When Guru Nanak leaves this world, his Hindu and Muslim followers argue over what to do. Then they lift the sheet.",
text:["When Guru Nanak Dev Ji was seventy years old, he chose his most devoted Sikh, Bhai Lehna, to carry on his work. He named him Angad, which means 'part of my own body', and made him the second Guru.","In September 1539, at Kartarpur, Guru Ji told the sangat that the time had come for him to merge with God. 'There is no difference between me and Guru Angad,' he said. Then he lay down and covered himself with a sheet.","Guru Nanak's followers were both Hindus and Muslims. For him, nobody had been just a Hindu or just a Muslim; everyone was a child of the one God. But now an argument began. The Hindus said, 'We will cremate him by our custom.' The Muslims said, 'He was our Pir. We will bury him and build a tomb.'","A wise visitor said, 'Before you argue, lift the sheet and see.' They lifted it. Instead of Guru Ji's body, they found only fresh flowers lying there.","Everyone fell silent. Then they shared the flowers. The Hindus took half and the Muslims took half, and each honoured him in their own way. Even at the very end, Guru Nanak Dev Ji had taught them to stop quarrelling and to share."],
lesson:"Guru Nanak Dev Ji belongs to everyone. Instead of arguing over our differences, we should share and live together in love.",
think:["What do you think the flowers meant?","Why was this argument the very thing Guru Ji had spent his life trying to end?"],
words:[["Sangat","The community of people who gather together."],["Jyoti jot","Merging with God's light; how Sikhs speak of a Guru leaving this world."]],
quiz:[["Who did Guru Nanak choose as the next Guru?",["Bhai Lehna (Guru Angad Dev Ji)","Bhai Mardana","Baba Sri Chand"],0],["What did they find under the sheet?",["Fresh flowers","A book","Nothing at all"],0],["What did the Hindus and Muslims do with the flowers?",["Shared them","Threw them away","Kept arguing"],0]],
pa:{t:["ਜਦੋਂ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਸੱਤਰ ਸਾਲ ਦੇ ਹੋਏ, ਉਨ੍ਹਾਂ ਨੇ ਆਪਣਾ ਕੰਮ ਅੱਗੇ ਤੋਰਨ ਲਈ ਆਪਣੇ ਸਭ ਤੋਂ ਸ਼ਰਧਾਵਾਨ ਸਿੱਖ, ਭਾਈ ਲਹਿਣਾ ਜੀ, ਨੂੰ ਚੁਣਿਆ। ਉਨ੍ਹਾਂ ਨੇ ਉਨ੍ਹਾਂ ਦਾ ਨਾਂ ਅੰਗਦ ਰੱਖਿਆ, ਭਾਵ 'ਮੇਰਾ ਆਪਣਾ ਅੰਗ', ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਦੂਜੇ ਗੁਰੂ ਥਾਪਿਆ।","ਸਤੰਬਰ 1539 ਵਿੱਚ ਕਰਤਾਰਪੁਰ ਵਿਖੇ ਗੁਰੂ ਜੀ ਨੇ ਸੰਗਤ ਨੂੰ ਦੱਸਿਆ ਕਿ ਉਨ੍ਹਾਂ ਦਾ ਰੱਬ ਵਿੱਚ ਸਮਾਉਣ ਦਾ ਸਮਾਂ ਆ ਗਿਆ ਹੈ। ਉਨ੍ਹਾਂ ਨੇ ਕਿਹਾ, 'ਮੇਰੇ ਅਤੇ ਗੁਰੂ ਅੰਗਦ ਵਿੱਚ ਕੋਈ ਫ਼ਰਕ ਨਹੀਂ।' ਫਿਰ ਉਹ ਲੇਟ ਗਏ ਅਤੇ ਆਪਣੇ ਉੱਤੇ ਚਾਦਰ ਲੈ ਲਈ।","ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦੇ ਸ਼ਰਧਾਲੂ ਹਿੰਦੂ ਵੀ ਸਨ ਅਤੇ ਮੁਸਲਮਾਨ ਵੀ। ਗੁਰੂ ਜੀ ਲਈ ਕੋਈ ਸਿਰਫ਼ ਹਿੰਦੂ ਜਾਂ ਸਿਰਫ਼ ਮੁਸਲਮਾਨ ਨਹੀਂ ਸੀ; ਸਭ ਇੱਕ ਰੱਬ ਦੇ ਬੱਚੇ ਸਨ। ਪਰ ਹੁਣ ਝਗੜਾ ਸ਼ੁਰੂ ਹੋ ਗਿਆ। ਹਿੰਦੂਆਂ ਨੇ ਕਿਹਾ, 'ਅਸੀਂ ਆਪਣੀ ਰੀਤ ਅਨੁਸਾਰ ਸਸਕਾਰ ਕਰਾਂਗੇ।' ਮੁਸਲਮਾਨਾਂ ਨੇ ਕਿਹਾ, 'ਉਹ ਸਾਡੇ ਪੀਰ ਸਨ। ਅਸੀਂ ਦਫ਼ਨਾ ਕੇ ਮਜ਼ਾਰ ਬਣਾਵਾਂਗੇ।'","ਇੱਕ ਸਿਆਣੇ ਆਏ ਹੋਏ ਸੱਜਣ ਨੇ ਕਿਹਾ, 'ਝਗੜਨ ਤੋਂ ਪਹਿਲਾਂ ਚਾਦਰ ਚੁੱਕ ਕੇ ਤਾਂ ਵੇਖੋ।' ਉਨ੍ਹਾਂ ਨੇ ਚਾਦਰ ਚੁੱਕੀ। ਗੁਰੂ ਜੀ ਦੇ ਸਰੀਰ ਦੀ ਥਾਂ ਉੱਥੇ ਸਿਰਫ਼ ਤਾਜ਼ੇ ਫੁੱਲ ਪਏ ਸਨ।","ਸਾਰੇ ਚੁੱਪ ਹੋ ਗਏ। ਫਿਰ ਉਨ੍ਹਾਂ ਨੇ ਫੁੱਲ ਵੰਡ ਲਏ। ਅੱਧੇ ਹਿੰਦੂਆਂ ਨੇ ਲਏ ਅਤੇ ਅੱਧੇ ਮੁਸਲਮਾਨਾਂ ਨੇ, ਅਤੇ ਹਰ ਇੱਕ ਨੇ ਆਪਣੇ ਢੰਗ ਨਾਲ ਗੁਰੂ ਜੀ ਦਾ ਸਤਿਕਾਰ ਕੀਤਾ। ਅਖ਼ੀਰਲੇ ਵੇਲੇ ਵੀ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਝਗੜਾ ਛੱਡ ਕੇ ਵੰਡ ਕੇ ਰਹਿਣਾ ਸਿਖਾਇਆ।"],l:"ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਸਭ ਦੇ ਸਾਂਝੇ ਹਨ। ਵਖਰੇਵਿਆਂ ਉੱਤੇ ਝਗੜਨ ਦੀ ਥਾਂ ਸਾਨੂੰ ਵੰਡ ਕੇ ਪਿਆਰ ਨਾਲ ਰਹਿਣਾ ਚਾਹੀਦਾ ਹੈ।"}}
]);
