{"id": "mai-bhago", "title": "Mai Bhago Leads the Way", "gur": "ਮਾਈ ਭਾਗੋ ਜੀ", "cat": "Guru Gobind Singh Ji", "age": "Youth", "where": "Khidrana (Sri Muktsar Sahib), 1705", "mins": 3, "c": "#5B2C83", "c2": "#F08A1C", "h": 400, "summary": "Forty Sikhs leave the Guru in a hard time. A brave woman from their area brings them back.", "text": ["During the long siege of Anandpur Sahib, food ran out and life became very hard. A group of forty Sikhs from the Majha region told Guru Gobind Singh Ji they wanted to go home. The Guru asked them to write a note, a bedava, saying they were no longer his Sikhs. They signed it and left.", "When they reached home, Mai Bhago Ji, a brave woman from the village of Jhabal, heard what had happened. She told them firmly that they had turned their backs on the Guru when he needed them most. Her words moved them deeply. Mai Bhago Ji put on armour and led the forty back to find the Guru.", "They reached the Guru near a pool called Khidrana just as Mughal forces were approaching. The forty, with Mai Bhago Ji, fought with great courage. Almost all of the forty became shaheed.", "Guru Ji went to each one. The last, Bhai Mahan Singh, was still alive and asked the Guru to tear up the bedava. The Guru did so, and forgave them all. He called them the Chali Mukte, the Forty Liberated Ones. The place became known as Sri Muktsar Sahib.", "Mai Bhago Ji was wounded but survived. She stayed with the Guru and is remembered as one of the bravest women in Sikh history."], "lesson": "It is never too late to come back and do the right thing. Courage can come from anyone.", "think": ["How did Mai Bhago Ji's words change the forty Sikhs?", "Why do you think the Guru forgave them?"], "words": [["Bedava", "A written note giving up one's tie to the Guru."], ["Chali Mukte", "The Forty Liberated Ones."], ["Shaheed", "A martyr; one who gives their life for truth."]], "n": 73, "seal": "", "who": "Guru Gobind Singh Ji"},

{"id": "chhote-sahibzade", "title": "The Younger Sahibzade", "gur": "ਛੋਟੇ ਸਾਹਿਬਜ਼ਾਦੇ", "cat": "Guru Gobind Singh Ji", "age": "Youth", "where": "Sirhind, 1704", "mins": 4, "c": "#16224D", "c2": "#EFE6D2", "h": 420, "summary": "Two young sons of Guru Gobind Singh Ji, and their grandmother, Mata Gujri Ji, stand firm in their faith.", "text": ["When the Sikhs left Anandpur Sahib in the cold winter of 1704, the Guru's family was separated while crossing the flooded Sirsa river. The two youngest sons of Guru Gobind Singh Ji, Baba Zorawar Singh Ji, about nine years old, and Baba Fateh Singh Ji, about six, went with their grandmother, Mata Gujri Ji.", "A former servant named Gangu offered them shelter, but he betrayed them to the officials. The three were taken to Sirhind and kept in the Thanda Burj, a cold, open tower, through freezing December nights. Mata Gujri Ji kept the boys warm with her love and told them stories of their grandfather, Guru Tegh Bahadur Ji, and great-great-grandfather, Guru Arjan Dev Ji.", "The boys were brought to the court of the governor, Wazir Khan. They walked in and greeted the court with a loud \"Waheguru Ji Ka Khalsa, Waheguru Ji Ki Fateh!\" They were offered riches and comfort if they gave up their faith. They refused, again and again, without fear.", "The governor ordered that they be bricked alive into a wall. The young Sahibzade stayed calm and kept their faith to the end, and became shaheed. When Mata Gujri Ji heard the news, she too left this world.", "A rich man, Diwan Todar Mal, honoured them by buying land for their cremation, covering it with gold coins as the price demanded. Today, Gurdwara Fatehgarh Sahib stands at Sirhind, and every December Sikhs around the world remember their courage."], "lesson": "Courage does not depend on age. The Sahibzade showed that faith and truth are worth more than any reward.", "think": ["Where did the Sahibzade find their courage?", "What does it mean to stand up for what you believe, even when it's hard?"], "words": [["Sahibzade", "The sons of the Guru."], ["Thanda Burj", "The 'cold tower' in Sirhind."], ["Fateh", "Victory."]], "n": 74, "seal": "", "who": "Guru Gobind Singh Ji"},

{"id": "vadde-sahibzade", "title": "The Elder Sahibzade at Chamkaur", "gur": "ਵੱਡੇ ਸਾਹਿਬਜ਼ਾਦੇ", "cat": "Guru Gobind Singh Ji", "age": "Youth", "where": "Chamkaur Sahib, 1704", "mins": 3, "c": "#7A1F2B", "c2": "#E9B021", "h": 405, "summary": "In a small mud fort, forty Sikhs face a huge army. The Guru's two elder sons ask to go out and fight.", "text": ["After leaving Anandpur Sahib in December 1704, Guru Gobind Singh Ji reached Chamkaur with his two elder sons and about forty Sikhs. They took shelter in a small mud fortress, a garhi. A huge Mughal army surrounded them.", "The Sikhs went out in small groups of five to face the army, so the others could defend the fort. Each group fought with great courage.", "The Guru's elder son, Baba Ajit Singh Ji, about seventeen years old, asked his father for permission to go out and fight. The Guru blessed him, and he fought bravely until he became shaheed.", "Then the younger brother, Baba Jujhar Singh Ji, only about fourteen, asked to go too. The Guru hugged him, blessed him, and sent him out. He too fought bravely and became shaheed. The Guru watched both his sons with calm and pride, thanking Waheguru.", "That night, the remaining Sikhs, acting as the Panj Pyare, ordered the Guru to leave the fort so that he could keep guiding the Khalsa. The Guru obeyed the Khalsa's command. Gurdwara Katalgarh Sahib now stands at Chamkaur Sahib."], "lesson": "The Guru gave everything, even his own sons, for truth and justice. The Khalsa's word was respected even by the Guru.", "think": ["Why did the Sikhs go out in small groups?", "Why did the Guru obey the Sikhs and leave the fort?"], "words": [["Garhi", "A small mud fortress."], ["Sahibzade", "The sons of the Guru."]], "n": 75, "seal": "", "who": "Guru Gobind Singh Ji"},

{"id": "budhu-shah", "title": "Pir Budhu Shah's Gift", "gur": "ਪੀਰ ਬੁੱਧੂ ਸ਼ਾਹ", "cat": "Guru Gobind Singh Ji", "age": "Kids", "where": "Sadhaura and Bhangani, 1688", "mins": 3, "c": "#3E8E4A", "c2": "#EFE6D2", "h": 390, "summary": "A Muslim saint stands by the Guru when others run away. The Guru gives him a precious keepsake.", "text": ["Pir Budhu Shah was a respected Sufi saint from Sadhaura. He loved and admired Guru Gobind Singh Ji, and the two often met.", "Once, Pir Budhu Shah asked the Guru to give work to five hundred Pathan soldiers who had been sent away from the Mughal army. The Guru agreed, and gave them a place in his army.", "In 1688, the hill kings attacked the Guru at Bhangani. On the eve of the battle, most of the Pathan soldiers ran away to join the other side. When Pir Budhu Shah heard this, he was ashamed. He came to the battlefield himself with his four sons and seven hundred followers to fight beside the Guru.", "The Guru's side won, but two of Pir Budhu Shah's sons gave their lives in the battle. The Guru was deeply touched by his loyalty.", "The Guru wanted to thank him. Pir Budhu Shah asked only for the comb the Guru had just used. Guru Ji gave him the comb with some of his hair still in it, a turban and a kirpan. These keepsakes were treasured by his family for generations."], "lesson": "True friendship crosses every boundary of faith. Loyalty means standing by someone when it matters most.", "think": ["Why was Pir Budhu Shah ashamed?", "What does this story teach about friendship between people of different faiths?"], "words": [["Pir", "A Muslim holy man or saint."], ["Kangha", "A wooden comb, one of the five Ks."]], "n": 76, "seal": "", "who": "Guru Gobind Singh Ji"},

{"id": "banda-singh", "title": "Baba Banda Singh Bahadur", "gur": "ਬਾਬਾ ਬੰਦਾ ਸਿੰਘ ਬਹਾਦਰ", "cat": "Sikh Heroes", "who": "Baba Banda Singh Bahadur", "age": "Youth", "where": "Nanded and Punjab, 1708–1716", "mins": 3, "c": "#C2410C", "c2": "#1B2A5E", "h": 410, "summary": "A proud hermit tries to test Guru Gobind Singh Ji with his powers. Instead, he becomes the Guru's servant, and a great leader.", "text": ["Lachhman Dev was born in 1670 in the hills of Rajouri. As a young man, he went hunting and shot a deer that was about to give birth. Deeply sad, he gave up worldly life and became a hermit called Madho Das. He lived beside the Godavari river at Nanded, and people said he had magical powers.", "In 1708, Guru Gobind Singh Ji came to Nanded and sat on Madho Das's seat. Madho Das was angry and tried to use his powers to throw the Guru off, but nothing worked. Then he looked into the Guru's calm eyes and understood who he was. He fell at the Guru's feet and said, \"I am your banda, your servant.\"", "The Guru gave him Amrit and a new name, Banda Singh. He gave him five arrows, a drum and a Nishan Sahib, sent five Sikhs with him, and asked him to go to Punjab to protect the poor from cruelty.", "Banda Singh Bahadur gathered farmers and ordinary people and won many battles. In 1710, he set up the first Sikh rule, made coins in the names of Guru Nanak Dev Ji and Guru Gobind Singh Ji, and gave land to the farmers who worked it, instead of to rich landlords.", "In 1716, he was captured and taken to Delhi, where he became shaheed, refusing to give up his faith. He is remembered as one of the greatest Sikh heroes."], "lesson": "Even a proud person can change and become a servant of truth. Real leaders protect ordinary people.", "think": ["What did Madho Das say when he understood who the Guru was?", "Why was giving land to the farmers so important?"], "words": [["Banda", "A servant."], ["Nishan Sahib", "The Sikh flag."], ["Bairagi", "A hermit who has given up worldly life."]], "n": 77, "seal": ""},

{"id": "baba-deep-singh", "title": "Baba Deep Singh Ji", "gur": "ਬਾਬਾ ਦੀਪ ਸਿੰਘ ਜੀ", "cat": "Sikh Heroes", "who": "Baba Deep Singh Ji", "age": "Youth", "where": "Damdama Sahib to Amritsar, 1757", "mins": 3, "c": "#1F3A7A", "c2": "#E9B021", "h": 420, "summary": "A scholar who copies Guru Granth Sahib Ji by hand picks up his sword at seventy-five to protect Harmandir Sahib.", "text": ["Baba Deep Singh Ji took Amrit from Guru Gobind Singh Ji himself. He became a great scholar at Damdama Sahib, where he taught Gurbani and carefully wrote out copies of Guru Granth Sahib Ji by hand, so the Guru's word could reach Sikhs everywhere.", "In 1757, an Afghan commander named Jahan Khan attacked Amritsar. His soldiers damaged Harmandir Sahib and filled the sacred sarovar with rubble.", "Baba Deep Singh Ji was about seventy-five years old. When he heard the news, he drew a line on the ground and said, \"Only those who are ready to give their lives for Harmandir Sahib should cross this line.\" Thousands of Sikhs stepped across.", "They marched towards Amritsar and met a huge army near the village of Gohalwar. Baba Deep Singh Ji fought fearlessly with his heavy khanda. He had vowed to reach Harmandir Sahib.", "The story says that even after being badly wounded in the neck, he kept going, holding his head on the palm of his hand, and fell only when he reached the parikrama around Harmandir Sahib. Gurdwara Shaheed Baba Deep Singh Ji stands in Amritsar today."], "lesson": "Keep your promises with all your heart. Protecting what is sacred takes courage at any age.", "think": ["What work did Baba Deep Singh Ji do before the battle?", "What did the line on the ground mean?"], "words": [["Khanda", "A heavy, double-edged sword."], ["Parikrama", "The walkway around the sarovar at Harmandir Sahib."]], "n": 78, "seal": ""},

{"id": "bhai-taru-singh", "title": "Bhai Taru Singh Ji", "gur": "ਭਾਈ ਤਾਰੂ ਸਿੰਘ ਜੀ", "cat": "Sikh Heroes", "who": "Bhai Taru Singh Ji", "age": "Youth", "where": "Poohla and Lahore, 1745", "mins": 3, "c": "#3A2F6E", "c2": "#F08A1C", "h": 390, "summary": "A young farmer secretly feeds Sikhs hiding in the forests. When he's caught, he refuses to give up his hair.", "text": ["Bhai Taru Singh Ji was a young farmer from the village of Poohla, near Amritsar. He lived with his mother and sister, and they shared everything they grew.", "In those days, the governor of Lahore, Zakariya Khan, was hunting down Sikhs, and many hid in the forests. Bhai Taru Singh Ji and his family secretly brought them food, even though it was very dangerous.", "Someone reported him, and he was arrested and taken to Lahore. Zakariya Khan told him, \"Cut your hair and give up your faith, and you will be free.\"", "Bhai Taru Singh Ji replied calmly that his kesh, his uncut hair, was a gift from the Guru, and he would keep it with his last breath. The angry governor ordered that his hair be removed together with his scalp. Bhai Taru Singh Ji stayed calm, reciting Japji Sahib.", "He lived on for twenty-two days, peaceful and prayerful. The story says that Zakariya Khan himself fell ill and died before him. Bhai Taru Singh Ji is remembered for his kindness to the hungry and his love for his kesh."], "lesson": "Share with those in need, even when it is hard. Keeping the Guru's gifts with love is true faith.", "think": ["How did Bhai Taru Singh Ji help the hiding Sikhs?", "Why was his kesh so precious to him?"], "words": [["Kesh", "Uncut hair, kept as a gift from God."], ["Langar", "The free community kitchen where everyone eats together."]], "n": 79, "seal": ""},

{"id": "bhai-mani-singh", "title": "Bhai Mani Singh Ji", "gur": "ਭਾਈ ਮਨੀ ਸਿੰਘ ਜੀ", "cat": "Sikh Heroes", "who": "Bhai Mani Singh Ji", "age": "Youth", "where": "Damdama Sahib, Amritsar and Lahore", "mins": 3, "c": "#0F5A55", "c2": "#EFE6D2", "h": 400, "summary": "The Guru's childhood friend becomes a great scholar. When he cannot pay an unfair tax, he faces a cruel sentence with calm.", "text": ["Bhai Mani Singh Ji grew up alongside Guru Gobind Singh Ji and served him all his life. He was a great scholar. At Damdama Sahib, he wrote down Guru Granth Sahib Ji as Guru Gobind Singh Ji recited it, a precious copy known as the Damdami Bir.", "Later, he became the head Granthi of Harmandir Sahib in Amritsar, caring for the Sikhs in very difficult times.", "In 1738, he asked the governor of Lahore for permission to hold a Diwali gathering at Harmandir Sahib. The governor agreed, but only if he paid a large tax of five thousand rupees. Bhai Mani Singh Ji hoped to pay it from the offerings of the sangat.", "But the governor secretly planned to attack the gathering. Bhai Mani Singh Ji found out and sent word to the Sikhs to stay away, to keep them safe. With no gathering, there were no offerings, and he could not pay the tax.", "He was arrested and told to give up his faith or face a cruel death, being cut limb by limb. He calmly refused, reciting Japji Sahib to the end. He is remembered in the Sikh Ardas every day."], "lesson": "Protecting others comes first. Learning, sewa and courage together make a true Sikh.", "think": ["Why did Bhai Mani Singh Ji tell the Sikhs to stay away?", "What precious copy did he write?"], "words": [["Granthi", "A person who reads and cares for Guru Granth Sahib Ji."], ["Bir", "A volume or copy of Guru Granth Sahib Ji."]], "n": 80, "seal": ""},

{"id": "ranjit-singh-stone", "title": "The Maharaja and the Stone", "gur": "ਮਹਾਰਾਜਾ ਰਣਜੀਤ ਸਿੰਘ", "cat": "Sikh Heroes", "who": "Maharaja Ranjit Singh", "age": "Kids", "where": "Lahore", "mins": 2, "c": "#E9B021", "c2": "#3E8E4A", "t": "#1b1b1b", "h": 380, "summary": "A stone hits the Maharaja as he rides by. His soldiers expect punishment, but he does something very different.", "text": ["Maharaja Ranjit Singh was the ruler of the Sikh Empire, with his capital at Lahore. He was known for being fair and generous to his people, whatever their faith.", "One day, as he rode through the streets with his soldiers, a stone suddenly flew through the air and hit him. The soldiers were shocked and rushed to find who had thrown it.", "They came back with an old woman and her young son, trembling with fear. \"Maharaja,\" the woman cried, \"my son threw a stone at the ber tree to knock down some fruit, because we were hungry. It hit you by mistake. Please forgive us!\"", "Everyone waited for the punishment. But the Maharaja smiled and ordered his treasurer to give them money and food.", "The soldiers were surprised. The Maharaja explained, \"When a stone hits a tree, the tree gives sweet fruit. If a tree can be so generous, how can I, a Maharaja, give anything less?\""], "lesson": "Answer mistakes with kindness. A good leader is generous, like a fruit tree.", "think": ["Why had the boy thrown the stone?", "What did the Maharaja learn from the tree?"], "words": [["Maharaja", "A great king."], ["Ber", "A small fruit tree (jujube)."]], "n": 81, "seal": ""}
];

function toast(msg){
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg; t.setAttribute("role","status");

}
function copyText(text, done){
  const fallback=()=>{ const sh=openSheet(`<div class="sharesheet"><h3>Copy this</h3><div class="field"><textarea readonly id="copybox" style="min-height:120px">${esc(text)}</textarea></div><p class="note">Select the text above and copy it.</p></div>`); const b=sh.querySelector("#copybox"); b.focus(); b.select(); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>toast(done)).catch(fallback); } else fallback();
}

  const sc=document.createElement("div"); sc.className="scrim";
  sc.innerHTML=`<div class="sheet ${cls||""}" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div><button class="close" data-x>Close</button>${html}</div>`;
  sc.addEventListener("click",e=>{ if(e.target===sc || e.target.closest("[data-x]")) closeSheet(); });
  document.body.appendChild(sc); document.addEventListener("keydown",escClose);
  sc.querySelector(".close").focus({preventScroll:true});
  return sc.querySelector(".sheet");
}

/* ---------- Read aloud (uses the device's built-in voices) ---------- */
const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined";
const speech = {on:false, paused:false, idx:0, paras:[], onchange:null};
function pickVoice(lang){
  const vs = canSpeak ? speechSynthesis.getVoices() : [];
  if(lang==="pa") return vs.find(v=>/^pa/i.test(v.lang)) || null;
  return vs.find(v=>/en[-_]IN/i.test(v.lang)) || vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if(canSpeak){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){} }
function stopSpeech(){
  if(!canSpeak) return;
  speech.on=false; speech.paused=false; try{ speechSynthesis.cancel(); }catch(e){}
  document.querySelectorAll(".story p.speaking").forEach(p=>p.classList.remove("speaking"));
  speech.onchange && speech.onchange();
}
function speakFrom(i){
  if(!speech.on) return;
  if(i>=speech.paras.length){ stopSpeech(); return; }
  speech.idx=i;
  document.querySelectorAll(".story p").forEach((p,k)=>p.classList.toggle("speaking",k===i));
  const u=new SpeechSynthesisUtterance(speech.paras[i]); const v=pickVoice();
  if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-IN";
  u.rate=.92;
  u.onend=()=>{ if(speech.on && !speech.paused) speakFrom(i+1); };
  speechSynthesis.speak(u);
}
function sayWord(term){
  if(!canSpeak) return;
  stopSpeech();
  const g=GLOSS[term.toLowerCase()]; const pa=pickVoice("pa");
  const u=new SpeechSynthesisUtterance(pa && g ? g[0] : term);
  const v=pa && g ? pa : pickVoice(); if(v){ u.voice=v; u.lang=v.lang; }
  u.rate=.75; speechSynthesis.speak(u);
}

/* ---------- Shelf ---------- */
function plateLines(cat){
  if(!/^Guru /.test(cat)) return cat.toUpperCase().split(" ");
  const w = cat.replace(/^Guru\s+/,"").replace(/\s+Ji$/,"").toUpperCase().split(" ");
  if(w[0]==="HAR" && w.length>2) w.splice(0,2,w[0]+" "+w[1]);
  const last = w.pop();
  return ["GURU", ...w, ...(last.length>6 ? [last,"JI"] : [last+" JI"])];
}

const slotFor = s => document.querySelector(".shelfsec .cardslot");

/* The shelf drifts slowly by itself, back and forth; any touch, scroll or hover pauses it for a few seconds */
let driftStop=null;
/* Books nearer the middle of the view are drawn in front, so side covers hide behind their neighbours like a real shelf */
/* Thin spines: widen (then shrink the text of) any book whose title doesn't fit */
function fitTitles(sc){
  const go=()=>{ let changed=false;
    for(const b of sc.querySelectorAll(".book")){
      const t=b.querySelector(".ttl"); if(!t) continue;
      let wk=parseFloat(b.style.getPropertyValue("--wk"))||1, n=0;
      while(t.offsetWidth>b.offsetWidth-6 && n<10){ if(wk<1.6){ wk=+(wk+.06).toFixed(2); b.style.setProperty("--wk",wk); void b.offsetWidth; } else { const fs=parseFloat(getComputedStyle(t).fontSize); t.style.fontSize=(fs*.92)+"px"; } n++; changed=true; }
    }
    if(changed && sc._measure) sc._measure();
  };
  go(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(go);
  let rt; addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(go,200); });
}
function depthSort(sc){
  let books=[...sc.querySelectorAll(".book")], queued=false;
  const sec=sc.closest(".shelfsec"), board=sec&&sec.querySelector(".board");
  const flat=reduce();
  /* Draw the shelf board so its top edge follows the same curve as the books */
  const drawBoard=()=>{ if(!board) return;
    const cd=parseFloat(getComputedStyle(board).getPropertyValue("--cd"))||22, h=board.clientHeight||1, t=(flat?0:cd)/h*100, lip=Math.max(0,(h-cd)/h*100)*.0;
    const top=`M0 0 Q500 ${t*2} 1000 0`, bot=t+ (100-t);
    board.querySelector(".bd").setAttribute("d",`${top} L1000 100 L0 100 Z`);
    board.querySelector(".lip").setAttribute("d",top);
    board.querySelector(".low").setAttribute("d",`M0 ${100-(t>0?Math.min(30,100-t):30)} Q500 ${100+((t>0?t:0)*0)} 1000 ${100-(t>0?Math.min(30,100-t):30)}`);
  };
  /* Book positions never change while scrolling, so measure them once.
     Each frame only the books on screen get a new transform (no CSS variables, so the browser does no restyling). */
  let geo=[], last=-1, cd=8;
  const measure=()=>{ geo=books.map(b=>({b, c:b.offsetLeft+b.offsetWidth/2, hw:b.offsetWidth/2, t:"", z:"", n:false})); cd=board?(parseFloat(getComputedStyle(board).getPropertyValue("--cd"))||8):8; last=-1; };
  const run=()=>{ const sl=sc.scrollLeft; if(sl===last) return; last=sl;
    const w=sc.clientWidth, mid=sl+w/2, half=w/2, edge=half+80;
    for(const g of geo){
      const dx=g.c-mid, near=Math.abs(dx)<=edge+g.hw;
      if(near!==g.n){ g.b.classList.toggle("near",near); g.n=near; }
      if(!near) continue;
      const u=Math.max(-1.3,Math.min(1.3,dx/half));
      const z=String(2000-Math.round(Math.abs(dx)/24));
      if(z!==g.z){ g.b.style.zIndex=(g.b===picked)?"9999":z; g.z=z; }
      if(flat) continue;
      const t=`translateY(${(-cd*u*u).toFixed(1)}px) rotateY(${(u*11).toFixed(2)}deg)`;
      if(t!==g.t){ g.b.style.transform=t; g.t=t; }
    }
  };
  sc._curve=run; sc._measure=()=>{ measure(); run(); };
  sc.addEventListener("scroll",run,{passive:true});
  addEventListener("resize",()=>{ measure(); drawBoard(); run(); });
  measure(); drawBoard(); run();
}
function autoDrift(sc){
  if(driftStop) driftStop();
  if(reduce()) return;
  const SPEED=26; /* pixels per second, the same on every screen */
  let pos=sc.scrollLeft, dir=1, pauseUntil=performance.now()+1800, hovering=false, raf=0, alive=true, last=0;
  const pause=ms=>{ pauseUntil=performance.now()+ms; pos=sc.scrollLeft; };
  ["touchstart","wheel"].forEach(ev=>sc.addEventListener(ev,()=>pause(5000),{passive:true}));
  sc.addEventListener("pointerdown",e=>pause(5000),{passive:true});
  sc.addEventListener("scroll",()=>{ if(Math.abs(sc.scrollLeft-pos)>4) pause(5000); },{passive:true});
  /* Only a real mouse counts as hovering; taps on phones must not freeze the shelf */
  sc.addEventListener("pointerenter",e=>{ if(e.pointerType==="mouse") hovering=true; });
  sc.addEventListener("pointerleave",e=>{ if(e.pointerType==="mouse"){ hovering=false; pause(1500); } });
  const tick=t=>{
    if(!alive) return;
    const dt=last?Math.min(t-last,100):16; last=t;
    const max=sc.scrollWidth-sc.clientWidth;
    if(max>0 && !hovering && !state.open && !state.busy && !picked && t>pauseUntil && !document.hidden){
      pos+=dir*SPEED*dt/1000;
      if(pos>=max){pos=max;dir=-1;pauseUntil=t+1500}
      if(pos<=0){pos=0;dir=1;pauseUntil=t+1500}
      sc.scrollLeft=pos; if(sc._curve) sc._curve();
    } else if(hovering || state.open || state.busy || picked) { pos=sc.scrollLeft; }
    raf=requestAnimationFrame(tick);
  };
  raf=requestAnimationFrame(tick);
  driftStop=()=>{ alive=false; cancelAnimationFrame(raf); };
}

/* Moving the mouse across a shelf glides it along, so books near the edge come into view */
function hoverScroll(sc){
  if(!matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  let target=null, raf=0;
  const step=()=>{ if(target==null || picked){raf=0;return} const d=target-sc.scrollLeft; if(Math.abs(d)<.5){raf=0;return} sc.scrollLeft+=d*(reduce()?1:.09); raf=requestAnimationFrame(step); };
  sc.addEventListener("mousemove",e=>{
    if(picked || state.busy){ target=null; return; }
    const max=sc.scrollWidth-sc.clientWidth; if(max<=0) return;
    const r=sc.getBoundingClientRect(); let p=(e.clientX-r.left)/r.width;
    p=Math.min(1,Math.max(0,(p-.12)/.76)); target=p*max;
    if(!raf) raf=requestAnimationFrame(step);
  });
  sc.addEventListener("mouseleave",()=>{target=null});
}

/* Fly a copy of the book between the shelf and the cover position */
function vpRect(el, dy){ const r=el.getBoundingClientRect(); return {x:r.left, y:r.top+(dy||0), w:r.width, h:r.height}; }
const finalScroll = y => Math.max(0, Math.min(y, document.documentElement.scrollHeight - innerHeight));
function docRect(el){ const r=el.getBoundingClientRect(); return {x:r.left+scrollX, y:r.top+scrollY, w:r.width, h:r.height}; }
function makeFlyer(s,S,C){ const f=document.createElement("div"); f.className="flyer";
  f.innerHTML=`<div class="face book${s.t?" light":""}" style="${vars(s)};width:${S.w}px;height:${S.h}px">${spineInner(s)}</div><div class="face cover" style="${vars(s)};width:${C.w}px;height:${C.h}px">${coverInner(s)}</div>`; return f; }
let preFly=null;
function fly(s, from, to, toCover){
  /* Transform + opacity only (graphics chip does the work). Opening follows a little gravity arc and turns the book to its cover. */
  return new Promise(res=>{
    if(reduce()) return res();
    const a=from, b=to;
    let f, S, C;
    if(toCover && preFly && preFly.id===s.id){ f=preFly.el; S=preFly.S; C=preFly.C; preFly=null; f.style.visibility=""; }
    else {
      S = toCover ? {w:a.w,h:a.h} : {w:b.w,h:b.h}; C = toCover ? {w:b.w,h:b.h} : {w:a.w,h:a.h};
      f=makeFlyer(s,S,C); document.body.appendChild(f);
    }
    const [sp,cv]=f.querySelectorAll(".face");
    const lerp=(p,q,t)=>p+(q-p)*t;
    const outCubic=t=>1-Math.pow(1-t,3), inOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    /* where the book is at time t (0..1) */
    const at = toCover
      ? t=>{ const x=outCubic(t);                                    /* glides sideways early */
             const fall=t, y=1-Math.pow(1-fall,3)*(1-fall*.35);   /* smooth fall that eases into place, no bounce */
             const bounce=0;
             const sz=inOut(t);
             return {x:lerp(a.x,b.x,x), y:lerp(a.y,b.y,Math.min(y,1))+bounce*b.h, w:lerp(a.w,b.w,sz), h:lerp(a.h,b.h,sz), turn:inOut(Math.min(1,Math.max(0,(t-.08)/.6)))}; }
      : t=>{ const e=inOut(t), lift=Math.sin(t*Math.PI)*-34;
             return {x:lerp(a.x,b.x,e), y:lerp(a.y,b.y,e)+lift, w:lerp(a.w,b.w,e), h:lerp(a.h,b.h,e), turn:1-inOut(Math.min(1,Math.max(0,(t-.3)/.6)))}; };
    const N=40, dur=toCover?1100:850, ks=[], kc=[];
    for(let n=0;n<=N;n++){
      const t=n/N, p=at(t), ang=p.turn*180;              /* 0 = spine facing you, 180 = cover facing you */
      const base=(sz,deg)=>`translate3d(${(p.x+p.w/2).toFixed(2)}px,${p.y.toFixed(2)}px,0) perspective(1200px) rotateY(${deg.toFixed(2)}deg) translateX(${(-p.w/2).toFixed(2)}px) scale(${(p.w/sz.w).toFixed(4)},${(p.h/sz.h).toFixed(4)})`;
      ks.push({transform:base(S,-ang),offset:t, opacity: ang<90?1:0});
      kc.push({transform:base(C,180-ang),offset:t, opacity: ang>=90?1:0});
    }
    sp.animate(ks,{duration:dur,easing:"linear",fill:"forwards"});
    const anim=cv.animate(kc,{duration:dur,easing:"linear",fill:"forwards"});
    anim.onfinish=()=>{ f.remove(); res(); };
  });
}
/* Pull a book forward and write its name under the shelf, with an arrow pointing up at it */
let picked=null, pickedAt=0;
document.addEventListener("click",e=>{ if(picked && !state.busy && !e.target.closest(".book")) unpickBook(); });
function pickBook(book){
  if(picked===book) return; unpickBook();
  if(!book) return; prebuild(book); picked=book; const psc=book.closest(".scroller"); pickedAt=psc?psc.scrollLeft:0; book.classList.add("settle","pick"); book.dataset.z=book.style.zIndex; book.style.zIndex="9999";
  const sec=book.closest(".shelfsec"); if(!sec) return;
  let n=sec.querySelector(".pickname");

function meaningOf(s, term){ const own=s.words.find(w=>w[0].toLowerCase()===term.toLowerCase()); if(own) return own[1]; const g=GLOSS[term.toLowerCase()]; return (g&&g[2])||""; }
function linkWords(s){
  const marks=[]; let txt=s.text.map(esc).join("\u0001");
  const own=s.words.map(w=>w[0]);
  const terms=[...own, ...GLOBAL_WORDS.filter(g=>!own.some(o=>o.toLowerCase()===g.toLowerCase()))]
    .filter(t=>GLOSS[t.toLowerCase()]).sort((a,b)=>b.length-a.length);
  terms.forEach(t=>{
    const re=new RegExp("(^|[^A-Za-z\\u0002])("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![A-Za-z])","i");
    txt=txt.replace(re,(m,pre,w)=>{ marks.push([t,w]); return pre+"\u0002"+(marks.length-1)+"\u0003"; });
  });
  txt=txt.replace(/\u0002(\d+)\u0003/g,(m,i)=>`<span class="w" role="button" tabindex="0" data-w="${esc(marks[i][0])}">${marks[i][1]}</span>`);

}

let dlPromise=null;
function getDownloads(){
  if(!dlPromise) dlPromise = Promise.resolve({save:({filename,data})=>{
    const u=URL.createObjectURL(data), a=document.createElement("a");
    a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000); return Promise.resolve({status:"saved"});
  }});
  return dlPromise;
}

function svgImage(svg){
  return new Promise((res,rej)=>{
    const src=svg.replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" ');
    const u=URL.createObjectURL(new Blob([src],{type:"image/svg+xml"}));
    const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=u;
  });
}
function rr(x,X,Y,w,h,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }
function wrapText(x,text,X,Y,maxW,lh,maxLines){
  const words=text.split(" "); let line="", n=0;
  for(let i=0;i<words.length;i++){
    const test=line?line+" "+words[i]:words[i];
    if(x.measureText(test).width>maxW && line){ x.fillText(line,X,Y); Y+=lh; line=words[i]; if(++n>=maxLines-1){ line=words.slice(i).join(" "); break; } }
    else line=test;
  }
  x.fillText(line,X,Y); return Y;
}
async function makeCard(s){
  const W=1080,H=1350, cv=document.createElement("canvas"); cv.width=W; cv.height=H; const x=cv.getContext("2d");
  try{ await Promise.all(["96px 'Caveat Brush'","34px 'Patrick Hand SC'","700 44px 'Mukta Mahee'"].map(f=>document.fonts.load(f))); }catch(e){}
  x.fillStyle="#0A0A0B"; x.fillRect(0,0,W,H);
  x.fillStyle=s.c; x.fillRect(0,0,W,16);
  if("letterSpacing" in x) x.letterSpacing="6px";
  x.fillStyle="#A8A396"; x.font="36px 'Patrick Hand SC', sans-serif"; x.fillText("SAAKHI GHAR",80,100);
  if("letterSpacing" in x) x.letterSpacing="0px";
  x.fillStyle="#F08A1C"; x.font="700 40px 'Mukta Mahee', sans-serif"; x.textAlign="right"; x.fillText("ਸਾਖੀ ਘਰ",W-80,100); x.textAlign="left";
  const ax=80, ay=150, aw=W-160, ah=Math.round(aw*.8);
  x.save(); rr(x,ax,ay,aw,ah,30); x.clip(); x.fillStyle=s.c; x.fillRect(ax,ay,aw,ah);
  try{ const im=await svgImage(artFor(s)); x.drawImage(im,ax,ay,aw,ah); }catch(e){}

  x.fillStyle="#F3EEE2"; x.font="100px 'Caveat Brush', cursive"; y=wrapText(x,s.title,80,y,W-160,96,2);
  x.fillStyle="#F08A1C"; x.font="700 44px 'Mukta Mahee', sans-serif"; x.fillText(s.gur,80,y+74);
  if("letterSpacing" in x) x.letterSpacing="4px";
  x.fillStyle="#A8A396"; x.font="34px 'Patrick Hand SC', sans-serif"; x.fillText(s.cat.toUpperCase(),80,y+138);
  x.fillStyle="#F3EEE2"; x.fillText("READ IT ON SAAKHI GHAR",80,H-64); x.textAlign="right"; x.fillStyle="#F08A1C"; x.fillText("@READBYSINGH",W-80,H-64); x.textAlign="left";
  return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error("no image")),"image/png"));
}

          const badge=/is born/.test(text)?"Birth":`${g.n} Guru`;
          return `<div class="ev gm" style="--gc:${g.c}"><span class="clip" aria-hidden="true"><span class="wm">${parseInt(g.n)}</span></span>
            <div class="top"><span class="big">${y}</span><span class="badge">${badge}</span></div>
            <div class="t">${esc(text)}</div><div class="gn" lang="pa">${g.gur}</div><div class="life">${g.life}</div></div>`;
        }
        return `<div class="ev gm special"><span class="clip" aria-hidden="true"><span class="kh">${khanda("#F2C14E")}</span></span>
          <div class="top"><span class="big">${y}</span><span class="badge">Milestone</span></div>
          <div class="t">${esc(text)}</div></div>`;
      }
      const s=e.s, g=GURU_BY[s.cat]; return `<div class="ev" style="--gc:${g?g.c:s.c}"><span class="yr">${s.approx?"c. ":""}${s.year}</span>${miniCard(s)}</div>`;
    }).join("")}</div></section></div>`;
}

/* ---------- Map ---------- */
const MAPB={lon0:73.4,lon1:77.35,lat0:30.3,lat1:32.3};
const proj=(lat,lon)=>[ +((lon-MAPB.lon0)/(MAPB.lon1-MAPB.lon0)*400).toFixed(1), +(14+(MAPB.lat1-lat)*125).toFixed(1) ];
const RIVERS={
 Ravi:[[32.3,75.8],[32.15,75.4],[32.0,75.05],[31.85,74.75],[31.62,74.32],[31.4,74.0],[31.1,73.6],[30.95,73.4]],
 Beas:[[32.3,76.4],[32.05,75.95],[31.8,75.55],[31.6,75.3],[31.42,75.13],[31.25,75.06],[31.15,74.98]],
 Sutlej:[[31.6,77.0],[31.42,76.75],[31.28,76.55],[31.1,76.5],[30.97,76.45],[30.95,76.1],[31.0,75.7],[31.1,75.3],[31.15,74.98],[31.0,74.6],[30.9,74.3],[30.7,73.95],[30.45,73.65],[30.3,73.45]],
 Chenab:[[32.3,73.95],[32.05,73.6],[31.85,73.4]]
};
const RIVERLAB={Ravi:[31.95,74.95],Beas:[31.85,75.72],Sutlej:[31.02,75.95],Chenab:[32.2,73.68]};
const placeStories = k => STORIES.filter(s=>s.loc.includes(k));
let mapSel="amritsar";
function mapPage(){
  const keys=Object.keys(PLACES).filter(k=>placeStories(k).length);
  const pts=d=>d.map(p=>proj(p[0],p[1]).join(",")).join(" ");
  const pin=k=>{
    const p=PLACES[k], n=placeStories(k).length, sel=k===mapSel;
    let X,Y,lx,ly,anchor="middle";
    if(p.far){ X=p.x; Y=292+(p.row||0)*40; lx=X; ly=Y+22; }
    else { [X,Y]=proj(p.lat,p.lon); X+=p.dx||0; Y+=p.dy||0; const L=p.lab;
      if(L==="b"){lx=X;ly=Y+21} else if(L==="t"){lx=X;ly=Y-13} else if(L==="l"){lx=X-12;ly=Y+4;anchor="end"} else if(L==="r"){lx=X+12;ly=Y+4;anchor="start"} else if(L==="bl"){lx=X-12;ly=Y+21;anchor="start"} else if(L==="tl"){lx=X-9;ly=Y-9;anchor="end"} else if(L==="bk"){lx=X+8;ly=Y+21;anchor="end"} else {lx=X+9;ly=Y-11;anchor="start"} }
    return `<g class="pin" tabindex="0" role="button" data-p="${k}" aria-label="${esc(p.name)}, ${n} ${n===1?"saakhi":"saakhis"}" aria-pressed="${sel}">
      <circle r="15" cx="${X}" cy="${Y}" fill="transparent"/>
      <circle class="dot" r="${sel?10:8.5}" cx="${X}" cy="${Y}" fill="${sel?"#EFE6D2":"#F08A1C"}" stroke="#11151A" stroke-width="2"/>
      <text x="${X}" y="${Y+3.6}" text-anchor="middle" font-size="10" font-family="Patrick Hand SC, sans-serif" fill="#141414">${n}</text>
      <text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="11" font-family="Patrick Hand SC, sans-serif" fill="${sel?"#F08A1C":"#F3EEE2"}" paint-order="stroke" stroke="#11151A" stroke-width="3">${esc(p.name)}</text></g>`;
  };
  app.innerHTML=`<div class="pad"><section class="page"><h1>Map</h1><p class="lead">Where the saakhis happened. Most are in Punjab, between its five rivers. Tap a place to see its saakhis.</p>
    <div class="mapwrap"><svg viewBox="0 0 400 404" role="group" aria-label="Map of places in the saakhis">
      <rect width="400" height="404" fill="#11151A"/>
      <text x="290" y="60" font-family="Caveat Brush, cursive" font-size="30" fill="#1E2833">Punjab</text>
      ${Object.entries(RIVERS).map(([n,d])=>`<polyline points="${pts(d)}" fill="none" stroke="#2E6E9C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>`).join("")}
      ${Object.entries(RIVERLAB).map(([n,p])=>{ const [x,y]=proj(p[0],p[1]); return `<text x="${x}" y="${y}" font-size="9.5" font-style="italic" font-family="Literata, serif" fill="#5E95BD">${n}</text>`; }).join("")}
      <line x1="0" y1="268" x2="400" y2="268" stroke="#26303B" stroke-dasharray="4 4"/>
      <text x="200" y="264" text-anchor="middle" font-size="9" font-family="Patrick Hand SC, sans-serif" fill="#6E7A86" letter-spacing="1">FURTHER AWAY</text>
      ${keys.map(pin).join("")}
    </svg></div>
    <div class="chips placechips" role="group" aria-label="Places">${keys.map(k=>`<button class="chip small" data-pc="${k}" aria-pressed="${k===mapSel}">${esc(PLACES[k].name)} (${placeStories(k).length})</button>`).join("")}</div>
    <div class="placelist" id="placelist"></div></section></div>`;
  const pick=k=>{ mapSel=k; mapPage(); const pl=document.getElementById("placelist"); pl.scrollIntoView({behavior:reduce()?"auto":"smooth",block:"nearest"}); };
  app.querySelectorAll(".pin").forEach(g=>{ g.onclick=()=>pick(g.dataset.p); g.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(g.dataset.p); } }; });
  app.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>pick(b.dataset.pc));
  const p=PLACES[mapSel], list=placeStories(mapSel);
  document.getElementById("placelist").innerHTML=`<h2>${esc(p.name)}</h2><p class="sub">${p.sub?esc(p.sub)+" · ":""}${p.far?"Further away, "+esc(p.far)+" · ":""}${list.length} ${list.length===1?"saakhi":"saakhis"}</p><div class="plist">${list.map(miniCard).join("")}</div>`;
}

/* ---------- Meet the Gurus ---------- */
function gurusPage(){
  app.innerHTML=`<div class="pad"><section class="page"><h1>Meet the Gurus</h1><p class="lead">The ten Sikh Gurus, from Guru Nanak Dev Ji to Guru Gobind Singh Ji, and the eternal Guru, Sri Guru Granth Sahib Ji.</p>
    <div class="gurus">${GURUS.map(g=>{ const n=STORIES.filter(s=>s.cat===g.cat).length; return `<article class="gcard" style="--gc:${g.c}">
      <header class="gh"><span class="num" aria-hidden="true">${parseInt(g.n)}</span><div class="ord">${g.n} Guru</div><h2>${esc(g.cat)}</h2><div class="gn" lang="pa">${g.gur}</div></header>
      <div class="gb">
        <dl class="facts"><div><dt>Lived</dt><dd>${g.life}</dd></div><div><dt>Guru</dt><dd>${esc(g.guru.replace(/^Guru from /,""))}</dd></div><div class="wide"><dt>Born</dt><dd>${esc(g.born)}</dd></div></dl>
        <h3>Remembered for</h3>
        <ul>${g.pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
        ${n?`<button class="pill" data-g="${esc(g.cat)}">Read ${n} ${n===1?"saakhi":"saakhis"} →</button>`:`<span class="soon">Saakhis coming soon</span>`}
      </div></article>`; }).join("")}
    <article class="gcard granth"><header class="gh"><span class="kh" aria-hidden="true">${khanda("#F2C14E")}</span><div class="ord">The eternal Guru</div><h2>Sri Guru Granth Sahib Ji</h2><div class="gn" lang="pa">${GRANTH.gur}</div></header>
      <div class="gb"><p>${esc(GRANTH.text)}</p></div></article>
    </div></section></div>`;
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ Object.assign(state,{cat:b.dataset.g,theme:"All",age:"All",fav:false,q:"",open:null}); location.hash="shelf"; });
}

/* ---------- Send a saakhi ---------- */
function sendPage(){
  const d=store("sg-draft",{});
  app.innerHTML=`<div class="pad"><section class="page"><h1>Send a saakhi</h1>
    <p class="lead">Know a saakhi that belongs on the shelf? Send it to Saakhi Ghar by email. Write the whole saakhi, or just its name, a link, or a few words about it. Every saakhi is read and checked before it's added.</p>
    <form class="form" id="sform" novalidate>
      <div class="field"><label for="f-title">Title of the saakhi <small>(optional)</small></label><input id="f-title" value="${esc(d.title||"")}"><span class="err" id="e-title"></span></div>
      <div class="field"><label for="f-guru">Which Guru or time is it about? <small>(optional)</small></label><select id="f-guru"><option value="">Not sure</option>${GURUS.map(g=>`<option${d.guru===g.cat?" selected":""}>${esc(g.cat)}</option>`).join("")}<option${d.guru==="Other Sikh history"?" selected":""}>Other Sikh history</option></select><span class="err" id="e-guru"></span></div>
      <div class="field"><label for="f-story">The saakhi, a link, or anything about it</label><textarea id="f-story" placeholder="Write the saakhi in simple words, or paste a link">${esc(d.story||"")}</textarea><span class="count2" id="c-story"></span><span class="err" id="e-story"></span></div>
      <div class="field"><label for="f-source">Where did you read or hear it? <small>(optional)</small></label><input id="f-source" placeholder="A book, Gurdwara katha, your family" value="${esc(d.source||"")}"></div>
      <div class="field"><label for="f-name">Your name <small>(optional)</small></label><input id="f-name" value="${esc(d.name||"")}"></div>
      <button class="cta" type="submit">Get it ready to send</button>
    </form><div id="ready"></div></section></div>`;
  const $=id=>document.getElementById(id);
  const save=()=>{ keep("sg-draft",{title:$("f-title").value,guru:$("f-guru").value,story:$("f-story").value,source:$("f-source").value,name:$("f-name").value}); $("c-story").textContent=`${$("f-story").value.trim().length} characters`; };
  ["f-title","f-guru","f-story","f-source","f-name"].forEach(id=>$(id).addEventListener("input",()=>{ save(); const e=$("e-"+id.slice(2)); if(e) e.textContent=""; }));
  save();
  $("sform").onsubmit=e=>{
    e.preventDefault();
    const t=$("f-title").value.trim(), g=$("f-guru").value, st=$("f-story").value.trim();
    const src=$("f-source").value.trim(), nm=$("f-name").value.trim();
    if(!t && !st && !src){ $("e-story").textContent="Write something first: a title, a few words, or a link."; $("f-story").focus(); return; }
    const text=`Saakhi Ghar: a new saakhi\n${t?`\nTitle: ${t}`:""}${g?`\nGuru: ${g}`:""}${src?`\nSource: ${src}`:""}${nm?`\nFrom: ${nm}`:""}${st?`\n\n${st}`:""}`;
    const mail=`mailto:${SUBMIT_EMAIL}?subject=${encodeURIComponent("New saakhi"+(t?": "+t:""))}&body=${encodeURIComponent(text)}`;
    $("ready").innerHTML=`<div class="ready"><h2>Your saakhi is ready</h2><p>Tap <b style="font-weight:600">Send by email</b> to open your email app with the saakhi already written in. Then just press send. Thank you for sharing!</p>
      <div class="btns"><a class="pill" href="${mail}" style="background:var(--chitta);border-color:var(--chitta);color:#141414">Send by email</a><button class="pill" id="copysakhi">Copy the saakhi</button><button class="pill" id="clearsakhi">Start a new one</button></div>
      <p style="margin:14px 0 6px;font-size:.95rem">If your email app doesn't open, or the saakhi looks cut off, copy the saakhi and email it to:</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span id="mailaddr" style="user-select:all;font-family:var(--body);font-size:1.05rem;color:var(--kesri);word-break:break-all">${SUBMIT_EMAIL}</span><button class="pill" id="copymail" style="min-height:38px;padding:4px 14px;font-size:.9rem">Copy address</button></div></div>`;
    $("copysakhi").onclick=()=>copyText(text,"Saakhi copied");
    $("copymail").onclick=()=>copyText(SUBMIT_EMAIL,"Email address copied");
    $("clearsakhi").onclick=()=>{ keep("sg-draft",{}); sendPage(); };
    $("ready").scrollIntoView({behavior:reduce()?"auto":"smooth",block:"start"});
  };
}

/* ---------- Routing ---------- */
let lastStory=null;
function route(){
  stopSpeech(); closeSheet(); speech.onchange=null;
  if(driftStop){ driftStop(); driftStop=null; }
  const h = location.hash.slice(1);
  const s = byId(h);
  let tab="shelf";
  if (s){ lastStory=s.id; reader(s); window.scrollTo(0,0); }
  else if(h==="timeline"){ lastStory=null; tab=h; timeline(); window.scrollTo(0,0); }
  else if(h==="map"){ lastStory=null; tab=h; mapPage(); window.scrollTo(0,0); }
  else if(h==="gurus"){ lastStory=null; tab=h; gurusPage(); window.scrollTo(0,0); }
  else if(h==="send"){ lastStory=null; tab=h; sendPage(); window.scrollTo(0,0); }
  else {
    home();
    if(lastStory && h==="shelf"){ const id=lastStory; lastStory=null;
      const b=document.querySelector(`.book[data-id="${id}"]`); if(b){ b.scrollIntoView({block:"center",inline:"center"}); openBook(id,true); } }
    else if(h==="shelf") window.scrollTo(0,0);
  }
  document.querySelectorAll(".nav a").forEach(a=>a.setAttribute("aria-current", a.dataset.nav===tab?"page":"false"));
}
try{const v=store("sg-size",null); if(v) document.documentElement.style.setProperty("--read", v+"rem");}catch(e){}
addEventListener("hashchange", route);
route();
</script>
