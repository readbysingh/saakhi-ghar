text:["Guru Amar Das Ji was born in 1479 in the village of Basarke, near Amritsar. His father, Tej Bhan Ji, was a farmer and trader, and his mother was Mata Lakhmi Ji. In 1503 he married Ram Kaur Ji, and they had two sons, Mohan and Mohri, and two daughters, Bibi Bhani and Bibi Dani.","Like his father, Amar Das was a deeply religious man. Every day he said his prayers, gave to charity and celebrated every festival. At the age of forty-two he went on pilgrimage to Haridwar to bathe in the holy river Ganga, and after that he went every single year.","In 1541, on the way home from his twenty-first pilgrimage, he stopped at an inn in the village of Mehre. While he rested in the afternoon, a Pandit named Durga noticed the lines on the soles of his feet. 'These lines say that one day you will be a great saint,' he said.","A sadhu staying at the inn heard this. He was very strict and always cooked his own food, never eating what anyone else had made. But now he decided to travel with Amar Das, and happily shared the meals Amar Das cooked. They walked together, stopping at the same places each night, all the way to Basarke.","After a few days, as the sadhu was leaving, he asked, 'Who is your Guru, your spiritual teacher?' Amar Das replied honestly, 'I haven't found a Guru yet.'","The sadhu was very upset. 'I have been eating food from someone who has no Guru! All my prayers and pilgrimages have gone to waste!' he cried, and he went away. Amar Das was left thinking deeply. Who could be his Guru?"],
lesson:"Learning needs a teacher. A hard question, even one that stings, can set us on the right path.",
think:["Why was the sadhu so upset?","Who are the teachers who guide you in your life?"],
words:[["Sadhu","A holy person who has given up worldly life."],["Pilgrimage","A journey to a holy place."],["Haridwar","A holy city on the river Ganga."]]},

{id:"bibi-amros-song",n:27,title:"Bibi Amro's Song",gur:"ਬੀਬੀ ਅਮਰੋ",seal:"ਅ",cat:"Guru Amar Das Ji",age:"Kids",who:"Guru Amar Das Ji",where:"Basarke and Khadur, 1541",mins:3,
c:"#F08A1C",c2:"#2747A8",h:385,
summary:"Unable to sleep, Amar Das hears a beautiful hymn at dawn. It leads him to his Guru.",
text:["After the sadhu left, Amar Das could not stop thinking. 'He was right,' he thought. 'Just as we need a teacher to learn anything, we need a Guru to find peace of mind.' He lay awake the whole night.","Early in the morning, he heard a sweet voice singing as she churned milk. It was Bibi Amro, the daughter of Guru Angad Dev Ji, who had recently married Amar Das's nephew and come to live with the family. She was singing a shabad of Gurbani that begins 'Karni kagad man masvani': 'Our actions are the paper, and our mind is the ink. On this paper, both good and bad deeds are written.' (Guru Granth Sahib, Ang 990)","Amar Das listened to every word. The shabad said that a person's mind can be burned up by greed, anger and pride, but a true Guru can turn that mind into gold, like a touch that turns iron into gold. 'Whoever wrote this,' he thought, 'is the Guru I am looking for.'","As soon as it was light, he asked Bibi Amro, 'Whose words were those?' She said, 'They are Guru Nanak Dev Ji's. Before he left this world, he gave the responsibility of guiding the Sikhs to my father, Guru Angad Dev Ji. He lives at Khadur.'","Amar Das asked Bibi Amro to take him there. At Khadur, he bowed at Guru Angad Dev Ji's feet and said, 'Please accept me as your Sikh.' Guru Ji blessed him with the Guru's word.","Amar Das was sixty-two years old, but he felt as if he were beginning a new life. From that day, he let go of any pride about his caste or family, served everyone who came, and treated everyone as his own brother or sister."],
lesson:"It is never too late to learn and to change. Gurbani can guide us to the right path.",
think:["What did the shabad say about paper and ink?","Amar Das became a Sikh at sixty-two. What does that teach us?"],
words:[["Shabad","A hymn of Gurbani."],["Madhani","A wooden churner for making butter from curd."],["Ang","A page of the Guru Granth Sahib."]]},

{id:"shelter-of-the-shelterless",n:28,title:"Shelter of the Shelterless",gur:"ਨਿਥਾਵਿਆਂ ਦੀ ਥਾਂ",seal:"ਅ",cat:"Guru Amar Das Ji",age:"Kids",who:"Guru Amar Das Ji",where:"Khadur Sahib, 1552",mins:3,
c:"#2B4F7A",c2:"#E9B021",h:410,
summary:"For years, Amar Das carries water for the Guru before dawn. One stormy morning, unkind words are spoken.",
text:["At Khadur, Amar Das saw Sikhs happily doing sewa without being asked: washing dishes in the langar, bringing firewood from the forest, and doing all kinds of other jobs. He asked the langar cook, Bhai Jodh, for sewa, and was given the job of fetching water for the langar.","He ate sitting in pangat alongside everyone, and any feeling of high and low left his heart. In his spare time, he scrubbed the pots while listening to and reciting Gurbani.","He also took on a special sewa. Every morning before dawn, he carried a big pitcher of water from the well for Guru Angad Dev Ji's bath. He did this every single day for about eleven years.","In 1552, when Amar Das was over seventy, he was carrying the water one dark morning through pouring rain. Near a weaver's house, his foot hit a wooden peg and he fell. The weaver woke up and called out, 'Who's there at this hour?' His wife grumbled, 'Who else would be out in this rain? Only that homeless Amru. Go back to sleep.'","Amar Das replied, 'Foolish woman, I am not homeless. I live under the shelter of the Guru, who looks after the whole world!' Then he carried the water on and helped the Guru with his bath.","After that morning, the weaver's wife began to act strangely, as if her mind was troubled. The worried weaver brought her to the Guru's darbar, told everyone what had happened, and asked for forgiveness. Guru Angad Dev Ji told the sangat, 'Never speak badly of anyone.' He forgave the woman, and she became well again. Guru Ji blessed Amar Das as the home of the homeless and the shelter of those who have no shelter."],
lesson:"Sewa done every day, in sun or rain, is precious. Words matter too: we should never speak badly of anyone.",
think:["Why did Amar Das say he was not homeless?","Why did Guru Ji tell the sangat never to speak badly of anyone?"],
words:[["Pangat","Sitting together in rows to eat, as equals."],["Nithavan","Homeless; someone with no place to go."],["Darbar","The Guru's court or gathering."]]},

{id:"gentle-answer",n:29,title:"The Guru's Gentle Answer",gur:"ਗੁਰੂ ਜੀ ਦੀ ਨਿਮਰਤਾ",seal:"ਅ",cat:"Guru Amar Das Ji",age:"Kids",who:"Guru Amar Das Ji",where:"Goindwal, 1556",mins:3,
c:"#EFE6D2",c2:"#7A1F2B",t:"#1b1b1b",h:390,
summary:"A jealous son of Guru Angad Dev Ji pushes Guru Amar Das Ji off his seat. The Guru's reply surprises everyone.",
text:["In 1552, Guru Angad Dev Ji made Amar Das the third Guru and asked him to make Goindwal his home. Baba Budha Ji and many Sikhs went with him, and soon the sangat began travelling to Goindwal to see the Guru.","Guru Angad Dev Ji's son Dasu declared himself Guru and stayed at Khadur, but nobody came to him, and he grew angry. His mother, Mata Khivi Ji, told her sons, 'Guruship is not property that you inherit. It is foolish to be an enemy of the Guru.' Dasu listened and gave up his claim. But his brother Datu did not.","Guru Amar Das Ji sent Sikhs to faraway places to share Guru Nanak's message, and the sangat grew quickly. Sikhs treated everyone as equal, whatever their caste. Some people who had lost respect and income because of this became jealous. In 1556, they went to Datu and said, 'We can help you become the Guru.'","Datu came to Goindwal with them. When he saw the huge sangat around Guru Amar Das Ji, he became so jealous that he kicked the old Guru from behind, knocking him off his seat, and sat on it himself.","Guru Amar Das Ji did not get angry. He gently held Datu's foot, pressed it and said, 'Respected Datu, I hope your soft foot is not hurt by my old, hard bones.' Datu answered, 'I am the rightful heir to this seat. Leave this village quietly.'","That same night, Guru Ji quietly left Goindwal and went to his old village, Basarke. The Sikhs went home too. Datu sat on the seat for three or four days, but not a single Sikh came to bow to him. In the end, he gave up and went back to Khadur."],
lesson:"Humility is stronger than anger. Sitting on a seat cannot make someone a Guru; only true goodness can.",
think:["How did Guru Amar Das Ji respond when Datu kicked him?","Why did no Sikh come to Datu, even though he sat on the Guru's seat?"],
words:[["Gaddi","The seat of the Guru."],["Nimrata","Humility."]]},

{id:"baoli-at-goindwal",n:30,title:"The Baoli at Goindwal",gur:"ਬਾਉਲੀ ਸਾਹਿਬ",seal:"ਅ",cat:"Guru Amar Das Ji",age:"Kids",who:"Guru Amar Das Ji",where:"Goindwal, 1559",mins:3,
c:"#1F8E6E",c2:"#EFE6D2",h:415,
summary:"The Guru builds a great step-well for everyone. A clever langar plan shows who is truly honest.",
text:["In 1558, Guru Amar Das Ji set out on a long journey to share Guru Nanak's message. At Kurukshetra, thousands of people, including yogis, came to listen to him. At the river Yamuna, the men who collected tolls at the bridge were so moved that they bowed to the Guru and let all his Sikhs cross for free.","At Kankhal and Haridwar, he taught that lust, anger, greed, attachment and pride are our five great enemies, and that following the Guru's teachings helps us overcome them. After eight days at Haridwar, he returned home to Goindwal.","So many people now came to Goindwal that the village's single well was not enough. So the Guru began building a baoli, a deep step-well with stairs going down to the water. The Sikhs worked with great joy. Bhai Jetha Ji, the Guru's son-in-law, who would later become Guru Ram Das Ji, carried baskets of sand on his head, showing everyone how to serve.","When the baoli was finished in 1559, Guru Ji held a big langar. He announced that everyone who sat in the pangat and ate would receive one rupee. Many people who had never sat down to eat with others of different castes now did. At noon, the gift went up to five rupees, and even more people came.","But one man, a sadhu named Hari Ram, who often spoke against the Guru, refused to come, even when invited. In the afternoon, the Guru raised the gift to a gold coin. Hari Ram could not resist. He secretly sent his little son to eat in the langar and collect the coin.","The sevadars noticed the boy, and being small, he told them everything. Soon the whole village knew that Hari Ram, who acted so holy, was really longing for money, like a crane standing still in the water, pretending to pray while waiting to catch a fish. Guru Ram Das Ji later wrote about this in Gauri Di Vaar. Today the baoli at Goindwal has eighty-four steps, and Sikhs still visit it with love."],
lesson:"Eating together in pangat makes everyone equal. Being truly honest matters more than looking holy.",
think:["Why did the Guru offer a reward for eating in the langar?","What does it mean to be 'like a crane waiting for a fish'?"],
words:[["Baoli","A step-well with stairs leading down to the water."],["Pangat","Sitting together in rows to eat, as equals."],["Toll","Money paid to cross a bridge or road."]]},

{id:"jetha-chickpea-seller",n:31,title:"Jetha, the Chickpea Seller",gur:"ਭਾਈ ਜੇਠਾ",seal:"ਰ",cat:"Guru Ram Das Ji",age:"Kids",who:"Guru Ram Das Ji",where:"Lahore, Basarke and Goindwal",mins:3,
c:"#E9B021",c2:"#B5612E",t:"#1b1b1b",h:395,
summary:"An orphaned boy sells boiled chickpeas to earn his living, and grows up to serve with all his heart.",
text:["Guru Ram Das Ji was born in 1534 in Chuna Mandi, a street in Lahore. His father was Hardas Sodhi Ji. He was named Ram Das, but because he was the eldest child, everyone at home called him Jetha, which means 'the firstborn'.","When Jetha was only seven, both his parents passed away. His grandmother took him to live with her in the village of Basarke. To earn his living, little Jetha sold boiled, salted chickpeas, called ghunganiyan, around the village.","In 1546, Bhai Amar Das came to Basarke to take his family to the new town of Goindwal, and he took Jetha along too. At Goindwal, Jetha went back to selling his chickpeas, and after his rounds every day, he served the sangat that gathered to hear the Guru's teachings.","In 1552, Amar Das became the third Guru. One day, his wife, Mata Mansa Devi Ji, said, 'It's time to find a good husband for our daughter, Bibi Bhani.' 'What kind of person should we look for?' asked the Guru. Just then, Jetha walked by. Mata Ji pointed and said, 'Someone like him.' The Guru smiled. 'There is only one like him: he himself.' And so Jetha and Bibi Bhani were married.","Later, when the baoli was being built at Goindwal, Jetha carried baskets of sand on his head, working side by side with everyone. One day, some relatives from Lahore passed through on their way to Haridwar and saw him. They were shocked. 'You are making your son-in-law work like a common labourer!' they told the Guru angrily. 'This is not proper.'","Jetha went to the Guru with folded hands. 'Please don't be angry with them,' he said. 'They don't understand. Sewa is greater than caste, family or pride.'"],
lesson:"No honest work is too humble. Sewa is greater than any pride of family or status.",
think:["How did young Jetha earn his living?","What did Jetha mean when he said sewa is greater than pride?"],
words:[["Jetha","The firstborn child."],["Ghunganiyan","Boiled chickpeas with salt and spices."],["Sodhi","The family name of Guru Ram Das Ji."]]},

{id:"answers-in-akbars-court",n:32,title:"Answers in Akbar's Court",gur:"ਅਕਬਰ ਦਾ ਦਰਬਾਰ",seal:"ਰ",cat:"Guru Ram Das Ji",age:"Kids",who:"Guru Ram Das Ji",where:"Lahore, 1566",mins:3,
c:"#5B2C83",c2:"#F08A1C",h:410,
summary:"Some people complain to Emperor Akbar about the Sikhs. Bhai Jetha goes to Lahore to answer for the Guru.",
text:["After the baoli was built at Goindwal in 1559, Guru Nanak's message spread even faster. At Goindwal, everyone ate together in pangat and bathed at the same place, whatever their caste. People who visited went home and began living the same way in their own villages.","Not everyone was happy about this. Some people had always been treated as higher than others because of their caste, and they did not like the idea that everyone was equal. In 1566, when the Mughal Emperor Akbar was staying in Lahore, they gave him a list of complaints against Guru Amar Das Ji. Akbar sent a message asking the Guru to come and answer them.","Guru Amar Das Ji sent Bhai Jetha to Lahore to answer on his behalf. In the emperor's court, Bhai Jetha listened to each complaint and answered calmly, one by one.","'The Sikhs don't say the old prayers at the set times each day,' said the first complaint. Bhai Jetha replied, 'Guru Nanak's teaching is for people of every caste and faith. It asks us to remember God all the time, not only at fixed hours.'","'The Sikhs don't follow the caste system,' said another. Bhai Jetha answered, 'All people are children of the same Creator. No one is born higher or lower than anyone else.' To the complaint that Sikhs don't worship idols, he said, 'The Sikhs believe God is alive and present everywhere, at every moment.' And to the complaint that Sikhs don't go on pilgrimages, he said, 'A place becomes holy because wise people teach there and share true knowledge.'","Akbar was impressed by his clear and gentle answers, and honoured Bhai Jetha with a robe of honour. Before leaving, Bhai Jetha asked the emperor to stop the special taxes that Hindus had to pay, including the tax on pilgrims. The story says that Akbar agreed."],
lesson:"Answer criticism calmly and clearly. Standing up for equality helps everyone, not just ourselves.",
think:["How did Bhai Jetha answer the complaints?","Why did Bhai Jetha ask Akbar to stop the taxes on Hindus?"],
words:[["Pangat","Sitting together in rows to eat, as equals."],["Siropa","A robe or scarf given as a mark of honour."],["Jizya","A special tax that non-Muslims had to pay under some rulers."]]},

{id:"founding-of-amritsar",n:33,title:"The Founding of Amritsar",gur:"ਗੁਰੂ ਕਾ ਚੱਕ",seal:"ਰ",cat:"Guru Ram Das Ji",age:"Kids",who:"Guru Ram Das Ji",where:"Guru Ka Chakk (Amritsar), 1570",mins:3,
c:"#0F6E8C",c2:"#E9B021",h:385,
summary:"Guru Amar Das Ji chooses a special place for a new town, and gives Bhai Jetha the job of building it.",
text:["In 1570, Guru Amar Das Ji took Bhai Jetha with him and met the headmen of the nearby villages: Gumtala, Tung, Sultanwind and Gilwali. He told them he wanted to build a new town. They all agreed happily and offered the land. The Guru paid for it, had it written in his name, and the town was named Guru Ka Chakk.","The foundation stone was laid at a special spot. Long before, in 1497, Guru Nanak Dev Ji had rested there with Bhai Mardana on his first great journey. He had said, 'Mardana, one day a great city will grow here, and it will spread the message of truth.' Now his words were coming true.","Guru Amar Das Ji explained to Bhai Jetha how the town should be built, then went back to Goindwal and left him in charge. Bhai Jetha first built a house, which became known as Guru Ke Kothe. Then he began digging a pool, Santokhsar.","The work was going to take a long time, so the Sikhs and workers began building homes for themselves nearby. Bhai Jetha started a langar, where every worker and every hungry person could eat as much as they needed.","One day, Bhai Jetha went to Goindwal and told the Guru that the new town was growing well. Guru Amar Das Ji was very pleased, and in 1574 he made him the fourth Guru, Guru Ram Das Ji, and asked him to move to the new town with his family.","Now the sangat came to the new town to see the Guru. People of all kinds of trades came to live there, and the town became known as Chakk Ram Das. In 1577, the Guru bought more land from the village of Tung so the town could grow. And when the great pool of Amrit was built, the town became famous as Amritsar, the Pool of Nectar."],
lesson:"Great things are built step by step, with patience and sewa. A town with a langar welcomes everyone.",
think:["What had Guru Nanak said about this place long ago?","Why do you think Bhai Jetha started a langar for the workers?"],
words:[["Chakk","A new settlement or town."],["Amritsar","'The Pool of Nectar'."],["Santokhsar","'The Pool of Contentment', a sarovar in Amritsar."]]},

{id:"bibi-rajnis-faith",n:34,title:"Bibi Rajni's Faith",gur:"ਦੁੱਖ ਭੰਜਨੀ ਬੇਰੀ",seal:"ਰ",cat:"Guru Ram Das Ji",age:"Kids",who:"Guru Ram Das Ji",where:"Amritsar, 1577",mins:3,
c:"#1F8E6E",c2:"#EFE6D2",h:400,
summary:"A girl believes that God gives to everyone. Her angry father tests her faith, and a small pond changes everything.",
text:["In the village of Patti lived a rich landlord named Duni Chand, who had five daughters. One day he asked them, 'Who gives you your food?' Four of the daughters said, 'You do, Father.' But the youngest, Rajni, said, 'God gives food to everyone, including me.'","Duni Chand was furious. 'Let's see how God feeds you, then!' he said. When Rajni grew up, he married her to a man who was very ill and could not walk, and sent her away from home.","Rajni did not complain. She carried her husband in a basket on her head from village to village and lived on whatever people gave her, always trusting God.","One day, she set the basket down in the shade of a ber tree beside a small pond and went to the nearby village to find food. While she was gone, her husband saw something amazing: black crows dipped into the pond and flew out white, like doves! He crawled to the water and dipped in, and he was healed.","When Rajni came back, she found a healthy man sitting under the tree. 'I am your husband,' he said. But Rajni couldn't believe it, so she took him to Guru Ram Das Ji. 'Rajni, he truly is your husband,' said the Guru. 'Your faith in God has healed him.'","Guru Ji told the sangat, 'This is the holy place that Guru Amar Das Ji spoke of.' The very next morning, together with Baba Budha Ji, he began digging the great pool there. That pool is the sarovar around Harmandir Sahib, and the ber tree, called Dukh Bhanjani Beri, the tree that removes suffering, still stands beside it today."],
lesson:"God looks after everyone. Keeping faith, even in hard times, brings blessings.",
think:["What did Rajni say when her father asked who gave her food?","How did Rajni show her faith during hard times?"],
words:[["Ber","A small fruit tree (jujube)."],["Dukh Bhanjani","'Remover of suffering'."],["Sarovar","A holy pool at a Gurdwara."]]},

{id:"yogis-question",n:35,title:"The Yogis' Question",gur:"ਜੋਗੀਆਂ ਨਾਲ ਗੋਸ਼ਟ",seal:"ਰ",cat:"Guru Ram Das Ji",age:"Kids",who:"Guru Ram Das Ji",where:"Amritsar",mins:3,
c:"#7A1F2B",c2:"#EFE6D2",h:380,
summary:"A group of yogis say Sikhs can't find peace without yoga. Guru Ram Das Ji answers with a question of his own.",
text:["While Guru Ram Das Ji was building the holy pool at Amritsar, a group of yogis came to see him. Guru Ji welcomed them warmly, gave them a place to sit, and asked why they had come.","Their leader said, 'Guru Ji, your Sikhs don't practise yoga. Without yoga, how can they control their minds? And without a calm mind, how can they find God? If they stay busy with worldly life, what is the use of being your Sikhs?'","Guru Ji answered, 'We teach our Sikhs to love God. Without kindness and love, no one can know God. When love for God grows in the heart, a person sees God everywhere in creation. They stay calm and joyful, their pride melts away, and they don't get caught up in greed, even while working and living a family life.'","Then Guru Ji asked a question of his own. 'If yogis find peace of mind, why do they go away to live in the mountains and forests? Why don't they stay among people and help those who are suffering?' The yogis had no answer.","Guru Ji then sang a shabad (Guru Granth Sahib, Ang 368), which gently said: 'O yogi, playing instruments for show is not enough. Learn from the Guru, sing God's praises, and let your mind rest in Him. Teach people the way to become one with God, who is everywhere.'","The yogis listened quietly, then rose and went away, with much to think about."],
lesson:"Love and kindness are the path to God, and we can walk it while living among people and helping them.",
think:["What did the yogis think was needed to find God, and what did the Guru say?","Why did Guru Ji ask why yogis live away in the mountains?"],
words:[["Yogi","A person who practises yoga, often living apart from the world."],["Grihasti","A person who lives a family life."],["Shabad","A hymn of Gurbani."]]},

{id:"diwali-lights",n:36,title:"Lights for the Guru's Return",gur:"ਬੰਦੀ ਛੋੜ ਦਿਵਸ",seal:"ਹ",cat:"Guru Hargobind Sahib Ji",age:"Kids",who:"Guru Hargobind Sahib Ji",where:"Gwalior and Amritsar",mins:3,
c:"#16224D",c2:"#F2C14E",h:400,
summary:"The Guru is kept far away in Gwalior fort. When he finally comes home, all of Amritsar glows with lamps.",
text:["Diwali is an old festival of India, a festival of lights. For Sikhs, it also has a special meaning, because of something that happened in the time of Guru Hargobind Sahib Ji, the sixth Guru.","Guru Hargobind Sahib Ji taught his Sikhs to be strong as well as prayerful. He trained them to defend themselves, built Lohgarh fort outside Amritsar, and in 1609 built the Akal Takht, where he sat to listen to people's problems and settle them fairly.","The new governor of Lahore, Murtaza Khan, grew worried and sent reports to the Mughal emperor, Jahangir. Jahangir ordered that the Guru be kept in the fort of Gwalior, far away from Punjab.","The Sikhs missed their Guru terribly. Many walked about 450 miles, all the way to Gwalior. They could not go inside, so they bowed to the walls of the fort, and then walked all the way home again.","Sain Mian Mir, a Sufi saint from Lahore and a friend of the Gurus, saw this deep love. He went to Agra and spoke to Jahangir about Guru Arjan Dev Ji and Guru Hargobind Sahib Ji. After listening to him, Jahangir ordered that the Guru be set free.","Guru Hargobind Sahib Ji reached Amritsar on the day of Diwali. The joyful Sikhs lit lamps all over the city and set off fireworks to welcome him home. Ever since, Sikhs have celebrated this day as Bandi Chhor Divas, the Day of Freedom, with lights at Harmandir Sahib and in Gurdwaras all over the world."],
lesson:"Love and patience are powerful. For Sikhs, Diwali is Bandi Chhor Divas, a day of freedom and joy.",
think:["Why did the Sikhs walk all the way to Gwalior, even though they couldn't see the Guru?","How does your family celebrate Bandi Chhor Divas?"],
words:[["Bandi Chhor","The one who frees prisoners; Bandi Chhor Divas is the Day of Freedom."],["Gwalior","A city in central India with a huge hill fort."],["Diwali","The festival of lights."]]},

{id:"two-swords",n:37,title:"The Two Swords",gur:"ਮੀਰੀ ਪੀਰੀ",seal:"ਹ",cat:"Guru Hargobind Sahib Ji",age:"Kids",who:"Guru Hargobind Sahib Ji",where:"Guru Ki Wadali and Amritsar, 1606",mins:3,
c:"#E37A14",c2:"#1B2A5E",h:415,
summary:"At only eleven, the new Guru asks for two swords: one for the world, and one for the spirit.",
text:["Guru Hargobind Sahib Ji was born in 1595 in the village of Wadali, near Amritsar. His father was Guru Arjan Dev Ji and his mother was Mata Ganga Ji.","Before he was born, Mata Ganga Ji walked to see Baba Budha Ji, carrying simple food she had made with her own hands: missi roti and onions. Baba Budha Ji was pleased. Crushing an onion in his fist, he blessed her: 'You will have a son who is great and brave, who will stand up against cruelty.'","Young Hargobind had a wide education. Baba Budha Ji taught him reading, medicine, farming and how to lead people. Bhai Paraga taught him to use weapons, Bhai Jetha taught him the skills of defence, and Bhai Ganga Sehgal taught him to ride horses.","In 1606, Emperor Jahangir called Guru Arjan Dev Ji to Lahore. Before leaving, Guru Arjan Dev Ji made his son the next Guru and told him, 'Sit on the Guru's seat wearing weapons, build an army, and stand firm against cruelty.' In Lahore, Guru Arjan Dev Ji became the first Sikh shaheed. His son was only eleven years old, but he was not afraid.","At the ceremony to become Guru, he asked Baba Budha Ji for two swords. One was called Miri, for leading people in the world. The other was called Piri, for guiding their hearts and minds. He also wore a turban with a kalgi, a plume, like the kings of that time.","He told the sangat, 'From now on, bring good horses and weapons as your offerings. We must be ready to protect people from cruelty.' Young Sikhs came from far and wide to join him, asking only for two meals a day and new clothes twice a year. After morning prayers they practised in front of Harmandir Sahib, and Dhadi singers sang vaars about brave heroes to fill everyone with courage."],
lesson:"A Sikh is both a saint and a soldier: prayerful inside, and brave enough to protect others.",
think:["What did the two swords, Miri and Piri, stand for?","Why do you think the Guru wanted his Sikhs to be both prayerful and strong?"],
words:[["Miri","Worldly leadership; looking after people in daily life."],["Piri","Spiritual leadership; guiding people's hearts and minds."],["Kalgi","A plume worn on a turban, a sign of royalty."],["Dhadi","Singers who sing vaars about brave deeds, with the dhad drum and sarangi."]]},

{id:"cloak-of-52",n:38,title:"The Cloak of 52 Tassels",gur:"ਦਾਤਾ ਬੰਦੀ ਛੋੜ",seal:"ਹ",cat:"Guru Hargobind Sahib Ji",age:"Kids",who:"Guru Hargobind Sahib Ji",where:"Amritsar and Gwalior fort",mins:3,
c:"#8E5A2E",c2:"#EFE6D2",h:390,
summary:"Set free from Gwalior fort, the Guru refuses to leave alone. He finds a clever way to free 52 kings too.",
text:["Guru Hargobind Sahib Ji taught a simple rule: be afraid of no one, and frighten no one. Sikhs brought fine horses and weapons as offerings, and brave young people joined his army. Even Pathan soldiers, like Subedar Yaar Khan, who had been turned out of the Mughal army, came to serve him. Some men who had become robbers gave up their old ways and joined too. The Guru's home became a home for the homeless.","The Guru chose fifty-two skilled soldiers to train the new Sikhs. In 1609, he built the Akal Takht opposite Harmandir Sahib. Every evening he sat there like a king and settled people's quarrels fairly, so they no longer had to depend on unfair officials. He also built a fort, Lohgarh, to protect Amritsar.","Some people grew jealous and afraid of the Guru's growing strength. The governor of Lahore complained to Emperor Jahangir, who ordered that the Guru be held in the fort of Gwalior. Fifty-two Rajas, local kings, were already prisoners there.","Inside the fort, the Guru held prayers every morning and evening. The Rajas, and even the guards, found peace in his company. Meanwhile, holy men like Sain Mian Mir spoke out against this injustice, and at last Jahangir ordered that the Guru be set free.","But the Guru said, 'I will not leave unless these kings are freed too.' Jahangir thought of a trick. 'Any Raja who can hold on to the Guru's clothes may leave with him,' he said, thinking only a few could do so.","So the Guru had a special chola, a cloak, made with fifty-two tassels. Each Raja held on to one tassel, and all fifty-two walked out of the fort together behind the Guru! From then on, he was lovingly called Data Bandi Chhor, the generous one who frees prisoners."],
lesson:"Real freedom is something we share with others. Kind and clever thinking can find a way where there seems to be none.",
think:["Why didn't the Guru want to leave the fort alone?","How did the cloak help free all 52 kings?"],
words:[["Akal Takht","'Throne of the Timeless One', built opposite Harmandir Sahib."],["Lohgarh","'Fort of iron', built to protect Amritsar."],["Chola","A long robe or cloak."]]},

{id:"true-king",n:39,title:"Who Is the True King?",gur:"ਸੱਚਾ ਪਾਤਸ਼ਾਹ",seal:"ਹ",cat:"Guru Hargobind Sahib Ji",age:"Kids",who:"Guru Hargobind Sahib Ji",where:"Agra",mins:3,
c:"#3E8E4A",c2:"#E9B021",h:380,
summary:"Emperor Jahangir wonders why people call the Guru the True King. A poor grass-cutter gives him the answer.",
text:["After hearing Sain Mian Mir speak about Guru Arjan Dev Ji and Guru Hargobind Sahib Ji, Emperor Jahangir realised he had made a terrible mistake. He sent his minister, Wazir Khan, to bring Guru Hargobind Sahib Ji from Gwalior to Agra with great respect.","In Agra, Jahangir seated the Guru beside him on a sandalwood seat. He could see that the Guru, wearing his two swords, was calm and dignified, and not afraid of anyone.","Jahangir brought forward Chandu, the man who had turned him against Guru Arjan Dev Ji, in chains. 'Here is the one to blame,' said Jahangir. The Guru had Chandu's chains untied, handed him over to his Sikhs, and said, 'Who was truly to blame will be decided in God's court.'","Jahangir asked the Guru to stay with him for a while. One day he asked, 'Why do people call you the True King, while I am only called king?' The Guru replied, 'I don't tell anyone what to call me. People call us what they see in us.' Jahangir was not satisfied.","The next day they went hunting together. At noon, the Guru rested under one tree and Jahangir under another. A poor grass-cutter had heard that the Guru was in the forest. Thinking Jahangir was the Guru, he placed a bundle of grass and a two-paisa coin in front of him and prayed, 'O True King, please look after me at the end of my life.'","Jahangir said, 'I am the king of this world. I can give you riches, but I cannot help you at the end of your life. Your True King is sitting under that tree.' The grass-cutter picked up his bundle and his coin, went to the Guru and bowed. After that day, Jahangir never again asked why the Sikhs called the Guru the True King."],
lesson:"Worldly kings rule for a while, but a true king rules people's hearts and looks after their souls.",
think:["What did Jahangir say he could and couldn't do for the grass-cutter?","Why do you think people called the Guru the True King?"],
words:[["Sacha Patshah","'The True King', a loving name for the Guru."],["Paisa","A small coin; a hundred paise make one rupee."]]},

{id:"nanakmatta-tree",n:40,title:"The Pipal Tree of Nanakmatta",gur:"ਨਾਨਕਮਤਾ",seal:"ਹ",cat:"Guru Hargobind Sahib Ji",age:"Kids",who:"Guru Hargobind Sahib Ji",where:"Nanakmatta",mins:3,
c:"#EFE6D2",c2:"#1F8E6E",t:"#1b1b1b",h:405,
summary:"Some yogis set fire to the tree where Guru Nanak once sat. Guru Hargobind Sahib Ji rides out to save it.",
text:["After the Guru's return from Gwalior, Guru Nanak's teachings spread freely across the land. At Nanakmatta, far to the east of Punjab, a Sikh named Baba Almast looked after the place where Guru Nanak Dev Ji had once sat under a pipal tree and talked with yogis.","Baba Almast cared for the place and shared Guru Nanak's message with visitors. But some followers of the yogi Gorakhnath did not like this. They took the place over, drove Baba Almast away, and set fire to the old pipal tree.","When Guru Hargobind Sahib Ji heard the news, he set out for Nanakmatta with a group of horsemen. When the yogis saw the Guru's Sikhs coming, they ran away.","The tree was still smouldering when the Guru arrived. He sat down beside it and sang Gurbani. Then he mixed saffron and sandalwood in water and sprinkled it over the burnt tree.","The story says that, before everyone's eyes, the tree came back to life. New leaves sprouted with yellow marks like kesar and white marks like sandalwood. People say these marks can still be seen on its leaves today.","Hearing this, the yogis came back. 'We have given up the world to live here,' they said. 'Why do family people like you come to trouble us?' The Guru asked gently, 'If you have truly given up the world, why are you fighting over this place?' The yogis had no answer, and they went away."],
lesson:"Holy places are for everyone to share. Calm truth is stronger than anger.",
think:["What question did the Guru ask the yogis?","Why was this tree so special to the Sikhs?"],
words:[["Pipal","A sacred fig tree with heart-shaped leaves."],["Nanakmatta","A Gurdwara town in Uttarakhand, where Guru Nanak Dev Ji met yogis."],["Kesar","Saffron; a golden-orange spice and colour."]]},

{id:"kiratpur-medicine",n:41,title:"Medicine for Dara Shikoh",gur:"ਕੀਰਤਪੁਰ ਦਾ ਦਵਾਖ਼ਾਨਾ",seal:"ਹ",cat:"Guru Har Rai Sahib Ji",age:"Kids",who:"Guru Har Rai Sahib Ji",where:"Kiratpur Sahib",mins:3,
c:"#3E8E4A",c2:"#EFE6D2",h:400,
summary:"The emperor's favourite son falls ill, and no royal doctor can cure him. The medicine he needs is at the Guru's free hospital.",
text:["Guru Har Rai Sahib Ji was born in 1630 at Kiratpur. His father was Baba Gurditta Ji, the eldest son of Guru Hargobind Sahib Ji. His grandfather kept him close and taught him both the scriptures and the skills of a horseman. Whenever young Har Rai had a chance to do sewa, he did it with great joy. Before he left this world in 1644, Guru Hargobind Sahib Ji made him the seventh Guru.","Guru Har Rai Sahib Ji kept 2,200 horsemen ready to protect the sangat, and built Patalgarh fort near Kiratpur. In the afternoons he rode into the forest with his Sikhs, so the hill people would see them and feel brave too.","He also opened a big dawakhana, a hospital, at Kiratpur. He hired skilled healers and gathered medicines from all over the country, and every needy person was treated for free. He asked for free clinics to be run at other Sikh centres too, and soon the Kiratpur dawakhana was famous across India.","Emperor Shah Jahan loved his eldest son, Dara Shikoh, very much. One day Dara fell seriously ill with a stomach illness, and the royal doctors could not cure him. They told the emperor, 'The right medicine can be found at the dawakhana in Kiratpur.'","Shah Jahan hesitated. 'How can I ask the Sikhs for help, when I have sent armies against them?' But Pir Hassan Ali told him, 'Guru Nanak's house is no one's enemy. They always do good to others.' So Shah Jahan wrote a letter to the Guru.","Guru Har Rai Sahib Ji sent the medicine straight away, and Dara Shikoh got well. Dara came to Kiratpur himself, bringing gifts to thank the Guru."],
lesson:"Kindness and healing are for everyone, even those who have not been kind to us.",
think:["Why did Shah Jahan hesitate to ask the Guru for help?","What does it mean that Guru Nanak's house is no one's enemy?"],
words:[["Dawakhana","A place where medicines are given; a clinic or hospital."],["Kiratpur","A town on the river Sutlej, where Guru Har Rai Sahib Ji was born."]]},

{id:"mai-taabo",n:42,title:"Mother Taabo's Pancakes",gur:"ਮਾਈ ਤਾਬੋ",seal:"ਹ",cat:"Guru Har Rai Sahib Ji",age:"Kids",who:"Guru Har Rai Sahib Ji",where:"Near Kiratpur Sahib",mins:2,
c:"#E9B021",c2:"#7A1F2B",t:"#1b1b1b",h:385,
summary:"An old woman makes sweet pancakes, hoping the Guru will come. One day, he stops at her door.",
text:["One day, while out riding with his Sikhs, Guru Har Rai Sahib Ji stopped outside a small hut. An old woman, Mai Taabo, came out.","'Mother, I am very hungry,' said the Guru. 'Please give me whatever you have cooked for me.' Mai Taabo was amazed. She had made sweet pude, Punjabi pancakes, hoping that one day the Guru would pass by. She brought them out, wrapped in a cloth.","Without even getting off his horse, the Guru unwrapped the pancakes and ate them happily. Handing back the cloth, he smiled and said, 'Mother, the pancakes were delicious!' Mai Taabo's heart overflowed with joy.","The next day, a Sikh packed some food to take on the ride, thinking the Guru might get hungry again. When he offered it, the Guru said, 'Meals are eaten in the langar, sitting together. There is a proper way to eat.'","The Sikh asked respectfully, 'But Guru Ji, yesterday you ate on horseback, without even washing your hands.' The Guru answered, 'That was because of that old mother's love. She had made that food for me and was waiting. Her love pulled me there.'"],
lesson:"The Guru is drawn by love. A small gift made with a loving heart means more than anything.",
think:["Why did the Guru eat Mai Taabo's pancakes on horseback?","What is something you could make for someone with love?"],
words:[["Mai","Mother; a respectful way to speak to an older woman."],["Pude","Sweet Punjabi pancakes."],["Langar","The free community kitchen where everyone eats together."]]},

{id:"peace-above-kingdom",n:43,title:"Peace Above a Kingdom",gur:"ਦਾਰਾ ਸ਼ਿਕੋਹ",seal:"ਹ",cat:"Guru Har Rai Sahib Ji",age:"Kids",who:"Guru Har Rai Sahib Ji",where:"Goindwal, 1658",mins:3,
c:"#0F6E8C",c2:"#E9B021",h:410,
summary:"A prince running from his brother's army is offered help to win the throne. He asks the Guru for something else.",
text:["Emperor Shah Jahan fell seriously ill in 1657, and wanted his eldest son, Dara Shikoh, to rule after him. But his younger son, Aurangzeb, wanted the throne for himself. The brothers' armies met near Agra, and Dara Shikoh was defeated. Aurangzeb locked his father in Agra fort and made himself emperor.","Dara Shikoh was very different from his brother. He loved the company of saints and holy men. He followed the Sufi path of love taught by Sain Mian Mir, and he often visited the Guru's house.","As he travelled towards Lahore in 1658, Dara Shikoh stopped at Goindwal to meet Guru Har Rai Sahib Ji. The Guru asked him, 'If you wish, I can help you win the throne of Delhi.'","Dara Shikoh replied, 'O True King, what would I do with the throne of Delhi, where there is fighting and quarrelling day and night? You once cured my body. Now please cure my soul and give me peace.'","The Guru said, 'Peace comes from accepting God's will, bhana. And that is only possible when you truly love God, with a love so great that you would give everything for it.' These words echo Guru Nanak Dev Ji: if you want to play the game of love, come to me with your head on your palm.","Dara Shikoh said, 'I have found what I came for,' and went on his way with a peaceful heart. He later lost his struggle with Aurangzeb, but he is remembered as a prince who loved wisdom and peace more than power."],
lesson:"Peace of mind is worth more than any kingdom. True love for God means giving it our all.",
think:["Why didn't Dara Shikoh want the throne?","What did the Guru say brings peace?"],
words:[["Sufi","A Muslim tradition of deep love for God."],["Bhana","God's will; accepting what happens with peace."],["Sain Mian Mir","A Sufi saint of Lahore and a friend of the Gurus."]]},

{id:"emperors-invitation",n:44,title:"The Emperor's Invitation",gur:"ਔਰੰਗਜ਼ੇਬ ਦਾ ਸੱਦਾ",seal:"ਹ",cat:"Guru Har Rai Sahib Ji",age:"Kids",who:"Guru Har Rai Sahib Ji",where:"Kiratpur Sahib",mins:3,
c:"#7A1F2B",c2:"#E9B021",h:395,
summary:"Aurangzeb orders the Guru to come to Delhi. The Guru calmly says no, and armies sent against him never arrive.",
text:["Once Aurangzeb had made himself emperor, he began to worry about the growing strength of the Sikhs. He sent a message ordering Guru Har Rai Sahib Ji to come to Delhi.","The Guru did not think it right to go. He wrote back, 'I have not taken any of your land, and I owe you nothing. Why should I come to you?' Angry, Aurangzeb told the governor of Lahore to bring the Guru by force.","Three times the governor sent an army towards Kiratpur, and three times it never arrived. The first commander fell ill and died on the way. The second was killed by his own enemies before he got there. The third army was struck by a terrible sickness, and the soldiers refused to go any further. After that, no general was willing to march on Kiratpur.","Aurangzeb realised he could not bring the Guru by force. So he sent Diwan Shiv Dayal, a man who respected the Guru, to invite him politely.","At Kiratpur, the Diwan said, 'Guru Ji, please come to Delhi to bless the sangat there, and show the emperor the path of truth.' The Guru replied, 'I have decided not to go before the emperor. But I will send my elder son, Ram Rai, with you.'","Ram Rai was only eleven. Before he left, the Guru told him, 'Stand firm in your faith. If you do, all will be well.'"],
lesson:"Stand firm for what is right, calmly and without fear.",
think:["Why didn't the Guru want to go to Delhi?","What did the Guru tell Ram Rai before he left?"],
words:[["Diwan","A minister or official at a royal court."],["Sangat","The community of people who gather together."]]},

{id:"ram-rai-word",n:45,title:"Ram Rai Changes a Word",gur:"ਬਾਬਾ ਰਾਮ ਰਾਇ",seal:"ਹ",cat:"Guru Har Rai Sahib Ji",age:"Kids",who:"Guru Har Rai Sahib Ji",where:"Delhi",mins:3,
c:"#5B2C83",c2:"#EFE6D2",h:380,
summary:"In the emperor's court, the Guru's clever young son wins praise and gifts. Then he changes one word of Gurbani.",
text:["Ram Rai was only eleven, but he was clever and quick with words. The Guru sent wise Sikhs and twenty-two horsemen with him to Delhi, where they stayed at Majnu Ka Tilla, beside the river Yamuna.","In the emperor's court, Aurangzeb was amazed by the bright young boy. He seated Ram Rai beside him and asked him many questions, and Ram Rai answered them all cleverly. The emperor treated him with great honour. Slowly, Ram Rai began to forget that this respect came from the Guru's blessing, and started to think it was all because of himself.","Aurangzeb asked him to show miracles, and to please the emperor, Ram Rai did, again and again, and received rich gifts. He forgot an important teaching of the Guru's house: Sikhs do not show miracles to impress people, because only God's will should be done.","Then the emperor's advisers pointed to a line by Guru Nanak Dev Ji in Asa Di Vaar. It says that the clay of a Musalman's grave can end up in a potter's hands, shaped into pots and bricks and baked in the fire. Guru Ji's meaning was that every body returns to the earth, and only our deeds matter. But Aurangzeb asked, 'Why did Guru Nanak write this about Muslims?'","Ram Rai wanted to keep the emperor happy. 'Guru Nanak really wrote beiman, a dishonest person, not Musalman,' he said. 'The writer made a mistake.' He had changed the Guru's words to please a king.","When Guru Har Rai Sahib Ji heard this in Kiratpur, he was deeply saddened. He sent Ram Rai a message: 'Do not show me your face again. You have given up the truth for the sake of honour and gifts.' Later, the Guru chose his younger son, Harkrishan, to be the next Guru."],
lesson:"The Guru's words must never be changed, not even to please the most powerful person in the world.",
think:["How did Ram Rai change as he received more praise and gifts?","Why was changing even one word of Gurbani so serious?"],
words:[["Majnu Ka Tilla","A place beside the Yamuna in Delhi, now a Gurdwara."],["Beiman","A dishonest person."],["Asa Di Vaar","A long hymn by Guru Nanak Dev Ji, sung every morning in Gurdwaras."]]},

{id:"five-year-old-guru",n:46,title:"The Five-Year-Old Guru",gur:"ਬਾਲਾ ਪ੍ਰੀਤਮ",seal:"ਹ",cat:"Guru Harkrishan Sahib Ji",age:"Kids",who:"Guru Harkrishan Sahib Ji",where:"Kiratpur Sahib, 1661",mins:3,
c:"#1F8E6E",c2:"#F2C14E",h:395,
summary:"Some people laugh that a five-year-old cannot be the Guru. A sick man and a simple handkerchief prove them wrong.",
text:["Guru Harkrishan Sahib Ji was born in 1656 at Kiratpur. His mother was Mata Krishan Kaur Ji and his father was Guru Har Rai Sahib Ji. In 1661, his father made him the eighth Guru. He was only five years old.","His elder brother, Ram Rai, was very upset. Some masands told him, 'We can make you the Guru instead.' So Ram Rai went to Emperor Aurangzeb and asked for help to take the Guruship.","But Aurangzeb said, 'I cannot make you the Guru. It is for the Sikhs to decide whom they follow.' Instead, he gave Ram Rai some villages near where the city of Dehradun stands today.","Some people doubted that such a young child could truly be the Guru. Guru Har Rai Sahib Ji had taught, 'The Guru is a light, not a body,' but they did not understand. As a joke, they told a man suffering from leprosy, a painful skin illness, 'Go to the Sikhs' Guru. He will make you well!'","The poor man lay down on the path where the young Guru was passing, and cried, 'O Guru, please heal me!' Guru Harkrishan Sahib Ji gave him his own handkerchief and said, 'Remember God's name, and wipe this handkerchief over your body.' The man did so, and he was healed. The people who had played the joke were deeply ashamed.","News of this spread far and wide. Sick people came from near and far to the Guru, received medicine from the Guru's dawakhana, and went home well and happy. Many people who had fallen into bad habits, like gambling and stealing, gave them up and began a new life in the Guru's sangat."],
lesson:"Wisdom and goodness don't depend on age. The Guru is a light, not a body.",
think:["Why did some people doubt the young Guru?","What did the Guru tell the sick man to do with the handkerchief?"],
words:[["Bala Pritam","'The beloved child', a loving name for Guru Harkrishan Sahib Ji."],["Rumal","A handkerchief."],["Masand","A person once appointed to collect offerings."]]},

{id:"chhajju-gita",n:47,title:"Chhajju Explains the Gita",gur:"ਛੱਜੂ ਝੀਵਰ",seal:"ਹ",cat:"Guru Harkrishan Sahib Ji",age:"Kids",who:"Guru Harkrishan Sahib Ji",where:"Panjokhra, near Ambala, 1664",mins:3,
c:"#B5612E",c2:"#EFE6D2",h:405,
summary:"A proud scholar dares the young Guru to explain the Gita. The Guru sends for a water-carrier instead.",
text:["Emperor Aurangzeb had heard that the Sikhs' love for their young Guru grew stronger every day. He wanted to meet the Guru himself, so he asked Mirza Raja Jai Singh, a Rajput king at his court who loved the Guru's house, to invite the Guru to Delhi.","The Raja sent his minister, Diwan Paras Ram, to Kiratpur. The Guru agreed to come to Delhi to meet the sangat there, but said, 'I will not go before the emperor. This was my father's command, and I will keep it.'","On the day of Basant, the spring festival, the Guru set out from Kiratpur with many Sikhs. When they stopped at the village of Panjokhra, near Ambala, a learned man named Pandit Lal Chand saw the grand group pass by and asked who it was.","When a Sikh told him it was Guru Harkrishan, the Pandit said, 'Anyone can call himself Krishan! Let me see if he truly has wisdom.' The Sikh took him to the Guru. The Pandit said, 'You share your name with Krishna, who taught the Gita. Can you explain even one verse of the Gita?'","The young Guru smiled. 'Even if I explain it, you may not be satisfied. Go and bring anyone from the village, and he will answer your questions.' The Pandit came back with Chhajju, a simple water-carrier who had never learned to read.","With the Guru's blessing, Chhajju began to explain the deep meanings of the Gita's verses as clearly as a great scholar. Pandit Lal Chand was amazed. His pride melted away, he bowed at the Guru's feet, and he became a Sikh. Today, Gurdwara Panjokhra Sahib stands at this place."],
lesson:"Pride in our learning can blind us. True wisdom is a gift that the Guru can give to anyone, however humble.",
think:["Why do you think the Guru sent for an ordinary villager?","How did Pandit Lal Chand change by the end?"],
words:[["Gita","The Bhagavad Gita, a holy book of Hinduism."],["Basant","The spring festival."],["Jheevar","A water-carrier."]]},

{id:"queen-in-disguise",n:48,title:"The Queen in Disguise",gur:"ਬੰਗਲਾ ਸਾਹਿਬ",seal:"ਹ",cat:"Guru Harkrishan Sahib Ji",age:"Kids",who:"Guru Harkrishan Sahib Ji",where:"Delhi, 1664",mins:3,
c:"#7A1F2B",c2:"#E9B021",h:385,
summary:"The emperor tests the young Guru: can he spot a queen dressed as a maid? Then the emperor's son comes with a request.",
text:["When Guru Harkrishan Sahib Ji reached Delhi, Mirza Raja Jai Singh welcomed him and gave him his own bungalow to stay in. That place is now Gurdwara Bangla Sahib. The Guru told the Raja, 'I have come because of the love of the Sikhs here. I will not meet Aurangzeb.'","Aurangzeb was surprised. He sent the Guru costly gifts: precious stones, pearls, fine clothes and a mala, a string of prayer beads. The Guru kept only the mala and sent everything else back. Aurangzeb understood that the Guru was not greedy for riches, and not afraid of a king.","Then the emperor thought of a test. He asked Mirza Raja Jai Singh to dress his queen in plain clothes, like a maid, and have her sit among the servants of the palace. 'Let us see if the Guru can recognise her,' he said.","The Raja invited the Guru to the palace. The young Guru walked past all the women until he came to the queen. He touched her head gently with his small cane and said, 'Why should a queen dress as a maid?' The queen was amazed, and the test was over.","Next, Aurangzeb sent his son, Prince Muazzam, to visit the Guru. The prince was amazed by the busy langar, where anyone could eat at any time, and the story says the Guru gave him fruit from the garden that was not even in season.","The prince asked whether the Guru would meet his father. The Guru answered with the words of Guru Nanak Dev Ji: food and fine clothes are wasted on a person who does not keep the True One in their mind (Guru Granth Sahib, Ang 142). He wrote these words down for the prince to take to the emperor."],
lesson:"Riches and tests cannot sway a true Guru. What matters most is keeping God in our mind.",
think:["Why did the Guru keep only the mala and send back the jewels?","What message did the Guru send to the emperor?"],
words:[["Bangla Sahib","'The bungalow', now a famous Gurdwara in Delhi."],["Mala","A string of prayer beads."],["Mirza Raja Jai Singh","A Rajput king at the Mughal court."]]},

{id:"healing-delhi",n:49,title:"Healing the Sick of Delhi",gur:"ਬਾਬਾ ਬਕਾਲੇ",seal:"ਹ",cat:"Guru Harkrishan Sahib Ji",age:"Kids",who:"Guru Harkrishan Sahib Ji",where:"Delhi, 1664",mins:3,
c:"#EFE6D2",c2:"#2747A8",t:"#1b1b1b",h:410,
summary:"A terrible sickness spreads through Delhi. The young Guru keeps his promise and serves the sick until the very end.",
text:["Prince Muazzam went back and told his father, 'The Guru's court is grander than a king's! Food is served to everyone at any time, sick people get well, and God's praises are sung all day long.' Now Aurangzeb wanted even more to see the Guru.","One morning, Aurangzeb came to Bangla Sahib all alone. Diwan Durga Mal told the Guru, who said, 'Close the door, and tell him that the Guru will not meet him.' After waiting a while, the emperor went away.","Around this time, Tegh Bahadur Ji, the Guru's grandfather's brother, came from Bakala to visit. He stayed for three days, and then returned to Bakala.","Soon the Guru moved to the inn of Bhai Kalyana, in the middle of the city. At that time, a terrible sickness called smallpox was spreading through Delhi. Sick people came to the Guru from all over the city, crowding around him day and night, and the Guru cared for them all. Many got well.","Then the young Guru himself fell ill with a high fever. On 30 March 1664, he asked for a coconut and five coins to be brought on a plate. He circled them with his right hand, bowed his head, and said, 'Baba Bakale', which means the next Guru is the elder at Bakala. Then, at only seven years old, he left this world and merged with Waheguru. He had kept his promise: he never once came before the emperor.","His last words led the Sikhs to Guru Tegh Bahadur Ji at Bakala. Today, Gurdwara Bangla Sahib stands where the young Guru stayed in Delhi, and people from all over the world still come there to pray."],
lesson:"Serve others with a loving heart, and keep your promises, even when it is hard.",
think:["How did the Guru help the people of Delhi?","What did the words 'Baba Bakale' tell the Sikhs?"],
words:[["Smallpox","A dangerous illness that once spread quickly from person to person."],["Baba Bakale","'The elder at Bakala', the Guru's last words."],["Sarai","An inn where travellers stay."]]}
];

function toast(msg){
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg; t.setAttribute("role","status");
  document.body.appendChild(t); setTimeout(()=>t.remove(), 1900);
}
function copyText(text, done){
  const fallback=()=>{ const sh=openSheet(`<div class="sharesheet"><h3>Copy this</h3><div class="field"><textarea readonly id="copybox" style="min-height:120px">${esc(text)}</textarea></div><p class="note">Select the text above and copy it.</p></div>`); const b=sh.querySelector("#copybox"); b.focus(); b.select(); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>toast(done)).catch(fallback); } else fallback();
}

/* ---------- Bottom sheet ---------- */
function escClose(e){ if(e.key==="Escape") closeSheet(); }
function closeSheet(){ document.querySelectorAll(".scrim").forEach(x=>x.remove()); document.removeEventListener("keydown",escClose); }
function openSheet(html, cls){
  closeSheet();
  const sc=document.createElement("div"); sc.className="scrim";
  sc.innerHTML=`<div class="sheet ${cls||""}" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div><button class="close" data-x>Close</button>${html}</div>`;

}

/* ---------- Read aloud (uses the device's built-in voices) ---------- */
const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined";
const speech = {on:false, paused:false, idx:0, paras:[], onchange:null};
function pickVoice(lang){
  const vs = canSpeak ? speechSynthesis.getVoices() : [];
  if(lang==="pa") return vs.find(v=>/^pa/i.test(v.lang)) || null;
  return vs.find(v=>/en[-_]IN/i.test(v.lang)) || vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if(canSpeak){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){} }
function stopSpeech(){
  if(!canSpeak) return;
  speech.on=false; speech.paused=false; try{ speechSynthesis.cancel(); }catch(e){}
  document.querySelectorAll(".story p.speaking").forEach(p=>p.classList.remove("speaking"));
  speech.onchange && speech.onchange();
}
function speakFrom(i){
  if(!speech.on) return;
  if(i>=speech.paras.length){ stopSpeech(); return; }
  speech.idx=i;
  document.querySelectorAll(".story p").forEach((p,k)=>p.classList.toggle("speaking",k===i));
  const u=new SpeechSynthesisUtterance(speech.paras[i]); const v=pickVoice();
  if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-IN";
  u.rate=.92;
  u.onend=()=>{ if(speech.on && !speech.paused) speakFrom(i+1); };
  speechSynthesis.speak(u);
}
function sayWord(term){
  if(!canSpeak) return;
  stopSpeech();
  const g=GLOSS[term.toLowerCase()]; const pa=pickVoice("pa");
  const u=new SpeechSynthesisUtterance(pa && g ? g[0] : term);
  const v=pa && g ? pa : pickVoice(); if(v){ u.voice=v; u.lang=v.lang; }
  u.rate=.75; speechSynthesis.speak(u);
}

  const last = w.pop();
  return ["GURU", ...w, ...(last.length>6 ? [last,"JI"] : [last+" JI"])];
}

/* The shelf drifts slowly by itself, back and forth; any touch, scroll or hover pauses it for a few seconds */
let driftStop=null;
function autoDrift(sc){
  if(driftStop) driftStop();
  if(reduce()) return;
  const SPEED=26; /* pixels per second, the same on every screen */
  let pos=sc.scrollLeft, dir=1, pauseUntil=performance.now()+1800, hovering=false, raf=0, alive=true, last=0;
  const pause=ms=>{ pauseUntil=performance.now()+ms; pos=sc.scrollLeft; };
  ["touchstart","wheel"].forEach(ev=>sc.addEventListener(ev,()=>pause(5000),{passive:true}));
  sc.addEventListener("pointerdown",e=>pause(5000),{passive:true});
  sc.addEventListener("scroll",()=>{ if(Math.abs(sc.scrollLeft-pos)>4) pause(5000); },{passive:true});
  /* Only a real mouse counts as hovering; taps on phones must not freeze the shelf */
  sc.addEventListener("pointerenter",e=>{ if(e.pointerType==="mouse") hovering=true; });
  sc.addEventListener("pointerleave",e=>{ if(e.pointerType==="mouse"){ hovering=false; pause(1500); } });
  const tick=t=>{
    if(!alive) return;
    const dt=last?Math.min(t-last,100):16; last=t;
    const max=sc.scrollWidth-sc.clientWidth;
    if(max>0 && !hovering && !state.open && !state.busy && t>pauseUntil && !document.hidden){
      pos+=dir*SPEED*dt/1000;
      if(pos>=max){pos=max;dir=-1;pauseUntil=t+1500}
      if(pos<=0){pos=0;dir=1;pauseUntil=t+1500}
      sc.scrollLeft=pos;
    } else if(hovering || state.open || state.busy) { pos=sc.scrollLeft; }
    raf=requestAnimationFrame(tick);
  };
  raf=requestAnimationFrame(tick);
  driftStop=()=>{ alive=false; cancelAnimationFrame(raf); };
}

/* Moving the mouse across a shelf glides it along, so books near the edge come into view */
function hoverScroll(sc){
  if(!matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  let target=null, raf=0;
  const step=()=>{ if(target==null){raf=0;return} const d=target-sc.scrollLeft; if(Math.abs(d)<.5){raf=0;return} sc.scrollLeft+=d*(reduce()?1:.09); raf=requestAnimationFrame(step); };
  sc.addEventListener("mousemove",e=>{
    const max=sc.scrollWidth-sc.clientWidth; if(max<=0) return;
    const r=sc.getBoundingClientRect(); let p=(e.clientX-r.left)/r.width;
    p=Math.min(1,Math.max(0,(p-.12)/.76)); target=p*max;
    if(!raf) raf=requestAnimationFrame(step);
  });
  sc.addEventListener("mouseleave",()=>{target=null});
}

/* Fly a copy of the book between the shelf and the cover position */
function docRect(el){ const r=el.getBoundingClientRect(); return {x:r.left+scrollX, y:r.top+scrollY, w:r.width, h:r.height}; }
function fly(s, from, to, toCover){
  return new Promise(res=>{
    if(reduce()) return res();
    const f=document.createElement("div"); f.className="flyer"; f.style.cssText=`left:0;top:0;width:${from.w}px;height:${from.h}px;transform:translate(${from.x}px,${from.y}px)`;
    f.innerHTML=`<div class="inner"><div class="face book${s.t?" light":""}" style="${vars(s)}">${spineInner(s)}</div><div class="face cover" style="${vars(s)}">${coverInner(s)}</div></div>`;
    document.body.appendChild(f);
    const a=from, b=to;
    const lift = toCover ? {x:a.x, y:a.y-40, w:a.w, h:a.h} : {x:b.x, y:b.y-40, w:b.w, h:b.h};
    const mk = r=>({transform:`translate(${r.x}px,${r.y}px)`, width:r.w+"px", height:r.h+"px"});
    const frames = toCover ? [ {...mk(a),offset:0}, {...mk(lift),offset:.22}, {...mk(b),offset:1} ] : [ {...mk(a),offset:0}, {...mk(lift),offset:.78}, {...mk(b),offset:1} ];
    const dur=900, ease="cubic-bezier(.55,.05,.25,1)";
    const anim=f.animate(frames,{duration:dur,easing:ease,fill:"forwards"});
    const [sp,cv]=f.querySelectorAll(".face");
    const tilt = toCover
      ? [{transform:"rotateY(0deg) rotateZ(0deg)"},{transform:"rotateY(0deg) rotateZ(-4deg)",offset:.22},{transform:"rotateY(-35deg) rotateZ(2deg)",offset:.6},{transform:"rotateY(0deg) rotateZ(0deg)"}]
      : [{transform:"rotateY(0deg)"},{transform:"rotateY(-35deg) rotateZ(2deg)",offset:.4},{transform:"rotateY(0deg) rotateZ(-4deg)",offset:.78},{transform:"rotateY(0deg)"}];
    f.querySelector(".inner").animate(tilt,{duration:dur,easing:ease,fill:"forwards"});
    const show = toCover?[{opacity:0},{opacity:0,offset:.38},{opacity:1,offset:.62},{opacity:1}]:[{opacity:1},{opacity:1,offset:.38},{opacity:0,offset:.62},{opacity:0}];
    const hide = toCover?[{opacity:1},{opacity:1,offset:.38},{opacity:0,offset:.62},{opacity:0}]:[{opacity:0},{opacity:0,offset:.38},{opacity:1,offset:.62},{opacity:1}];
    cv.animate(show,{duration:dur,fill:"forwards"}); sp.animate(hide,{duration:dur,fill:"forwards"});
    anim.onfinish=()=>{ f.remove(); res(); };
  });
}
async function openBook(id, instant){
  const s=byId(id); if(!s || state.busy) return;
  state.busy=true;
  if(state.open){ const prev=byId(state.open); const ps=slotFor(prev); if(ps) ps.innerHTML=""; const pb=document.querySelector(`.book[data-id="${prev.id}"]`); pb&&pb.classList.remove("out"); }
  state.open=id;
  const slot=slotFor(s); const book=document.querySelector(`.book[data-id="${id}"]`);
  slot.innerHTML=cardHTML(s, !instant && !reduce()); wireCard(s);
  const cover=slot.querySelector(".cover");
  const from=docRect(book); book.classList.add("out");
  const card=slot.querySelector(".card"); const cr=card.getBoundingClientRect();
  if(cr.bottom>innerHeight-80 || cr.top<0){
    const y = Math.max(0, scrollY + cr.top - Math.min(140, innerHeight*.18));
    scrollTo({top:y, behavior:(instant||reduce())?"auto":"smooth"});
  }
  if(!instant){ await fly(s, from, docRect(cover), true); }
  cover.classList.remove("wait");
  state.busy=false;
}
async function closeBook(){
  const s=byId(state.open); if(!s || state.busy) return;
  state.busy=true;
  const slot=slotFor(s); const cover=slot.querySelector(".cover"); const book=document.querySelector(`.book[data-id="${s.id}"]`);
  const from=docRect(cover); book.classList.remove("out"); const to=docRect(book); book.classList.add("out");
  cover.classList.add("wait");
  const card=slot.querySelector(".card");
  const br=book.getBoundingClientRect();
  if(br.top<0) scrollTo({top:Math.max(0,scrollY+br.top-80),behavior:reduce()?"auto":"smooth"});
  const flying=fly(s, from, to, false);
  setTimeout(()=>card.classList.add("leaving"), 150);
  await flying;
  slot.innerHTML=""; book.classList.remove("out"); state.open=null; state.busy=false;
}
function refreshSpine(s){ const b=document.querySelector(`.book[data-id="${s.id}"]`); if(b) b.innerHTML=spineInner(s); }
function toggleFav(s){
  favSet.has(s.id)?favSet.delete(s.id):favSet.add(s.id); saveFav();
  const fc=document.getElementById("favchip"); if(fc) fc.innerHTML=`${HEART(true)}Favourites (${favSet.size})`;
  toast(favSet.has(s.id)?"Added to your favourites":"Removed from favourites");
  return favSet.has(s.id);
}
function wireCard(s){
  const card=slotFor(s).querySelector(".card");
  const list=filtered(); const i=list.indexOf(s);
  card.querySelector('[data-act="mark"]').onclick=e=>{
    readSet.has(s.id)?readSet.delete(s.id):readSet.add(s.id); saveRead();
    e.target.textContent=readSet.has(s.id)?"Marked as read ✓":"Mark as read"; refreshSpine(s);
  };
  const go=d=>{ const n=list[(i+d+list.length)%list.length]; const nb=document.querySelector(`.book[data-id="${n.id}"]`);
    nb.scrollIntoView({behavior:reduce()?"auto":"smooth",block:"nearest",inline:"center"}); setTimeout(()=>openBook(n.id), reduce()?0:300); };
  card.querySelector('[data-act="prev"]').onclick=()=>go(-1);
  card.querySelector('[data-act="next"]').onclick=()=>go(1);
  card.querySelector('[data-act="shelve"]').onclick=()=>closeBook();
  card.querySelector('[data-act="share"]').onclick=()=>shareSheet(s);
  card.querySelector('[data-act="copy"]').onclick=()=>copyText(storyLink(s),"Link copied");
  card.querySelector('[data-act="fav"]').onclick=e=>{ const on=toggleFav(s); const b=e.currentTarget; b.classList.toggle("on",on); b.setAttribute("aria-pressed",on); b.textContent=on?"Favourite ✓":"Favourite"; refreshSpine(s); if(state.fav && !on){ state.open=null; drawShelves(); } };
}

function meaningOf(s, term){ const own=s.words.find(w=>w[0].toLowerCase()===term.toLowerCase()); if(own) return own[1]; const g=GLOSS[term.toLowerCase()]; return (g&&g[2])||""; }
function linkWords(s){
  const marks=[]; let txt=s.text.map(esc).join("\u0001");
  const own=s.words.map(w=>w[0]);
  const terms=[...own, ...GLOBAL_WORDS.filter(g=>!own.some(o=>o.toLowerCase()===g.toLowerCase()))]
    .filter(t=>GLOSS[t.toLowerCase()]).sort((a,b)=>b.length-a.length);
  terms.forEach(t=>{
    const re=new RegExp("(^|[^A-Za-z\\u0002])("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![A-Za-z])","i");
    txt=txt.replace(re,(m,pre,w)=>{ marks.push([t,w]); return pre+"\u0002"+(marks.length-1)+"\u0003"; });
  });
  txt=txt.replace(/\u0002(\d+)\u0003/g,(m,i)=>`<span class="w" role="button" tabindex="0" data-w="${esc(marks[i][0])}">${marks[i][1]}</span>`);
  return txt.split("\u0001").map(p=>`<p>${p}</p>`).join("");
}
function wordSheet(s, term){
  const g=GLOSS[term.toLowerCase()]||["","",""];
  const sh=openSheet(`<div class="wordsheet">${g[0]?`<div class="big" lang="pa">${g[0]}</div>`:""}<div class="en">${esc(term)}</div>${g[1]?`<div class="say">Say it: <b>${esc(g[1])}</b></div>`:""}<p class="mean">${esc(meaningOf(s,term))}</p>${canSpeak?`<button class="pill" data-hear>${ICON.listen.replace('<svg','<svg width="18" height="18"')} Hear it</button>`:""}</div>`);
  const h=sh.querySelector("[data-hear]"); if(h) h.onclick=()=>sayWord(term);
}
function shuffled(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function quizHTML(s){
  if(!s.quiz) return "";
  return `<section class="quiz" id="quiz"><h2>Quick quiz</h2><p class="sub">${badgeSet.has(s.id)?"You've earned this Khanda badge. Play again any time!":"Get every answer right to earn a Khanda badge."}</p>
    ${s.quiz.map((q,i)=>`<div class="qitem" data-q="${i}"><p><b>Q${i+1}</b>${esc(q[0])}</p><div class="opts">${shuffled(q[1].map((o,k)=>[o,k])).map(([o,k])=>`<button class="opt" data-k="${k}">${esc(o)}<span class="mk"></span></button>`).join("")}</div></div>`).join("")}
    <div class="qresult" id="qresult" hidden></div></section>`;
}
function wireQuiz(s){
  const box=document.getElementById("quiz"); if(!box) return;
  let answered=0, right=0;
  box.querySelectorAll(".qitem").forEach(item=>{
    const q=s.quiz[+item.dataset.q];
    item.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k;
      item.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.k===q[2]){ x.classList.add("right"); x.querySelector(".mk").textContent="Correct"; } });
      if(k!==q[2]){ b.classList.add("wrong"); b.querySelector(".mk").textContent="Not this one"; } else right++;
      if(++answered===s.quiz.length) finish();
    });
  });
  function finish(){
    const r=document.getElementById("qresult"); r.hidden=false;
    const all=right===s.quiz.length, fresh=all && !badgeSet.has(s.id);
    if(all){ badgeSet.add(s.id); saveBadges(); readSet.add(s.id); saveRead(); }
    r.innerHTML=`<span class="score">${right} / ${s.quiz.length}</span><button class="pill" id="qagain">Try again</button>
      ${all?`<div class="badgewin" style="flex-basis:100%">${khanda("#F2C14E")}<div><b>${fresh?"Khanda badge earned!":"Full marks again!"}</b>You have ${badgeSet.size} of ${STORIES.length} Khanda badges.</div></div>`
           :`<span style="color:var(--muted);letter-spacing:.06em;flex-basis:100%">Read the story again and have another go.</span>`}`;
    document.getElementById("qagain").onclick=()=>{
      const n=document.createElement("div"); n.innerHTML=quizHTML(s); box.replaceWith(n.firstElementChild); wireQuiz(s);
      document.getElementById("quiz").scrollIntoView({behavior:reduce()?"auto":"smooth",block:"start"});
    };
  }
}

let dlPromise=null;
function getDownloads(){
  if(!dlPromise) dlPromise = Promise.resolve({save:({filename,data})=>{
    const u=URL.createObjectURL(data), a=document.createElement("a");
    a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000); return Promise.resolve({status:"saved"});
  }});
  return dlPromise;
}

function svgImage(svg){
  return new Promise((res,rej)=>{
    const src=svg.replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" ');
    const u=URL.createObjectURL(new Blob([src],{type:"image/svg+xml"}));
    const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=u;
  });
}
function rr(x,X,Y,w,h,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }
function wrapText(x,text,X,Y,maxW,lh,maxLines){
  const words=text.split(" "); let line="", n=0;
  for(let i=0;i<words.length;i++){
    const test=line?line+" "+words[i]:words[i];
    if(x.measureText(test).width>maxW && line){ x.fillText(line,X,Y); Y+=lh; line=words[i]; if(++n>=maxLines-1){ line=words.slice(i).join(" "); break; } }
    else line=test;
  }
  x.fillText(line,X,Y); return Y;
}
async function makeCard(s){
  const W=1080,H=1350, cv=document.createElement("canvas"); cv.width=W; cv.height=H; const x=cv.getContext("2d");
  try{ await Promise.all(["96px 'Caveat Brush'","34px 'Patrick Hand SC'","700 44px 'Mukta Mahee'"].map(f=>document.fonts.load(f))); }catch(e){}
  x.fillStyle="#0A0A0B"; x.fillRect(0,0,W,H);
  x.fillStyle=s.c; x.fillRect(0,0,W,16);
  if("letterSpacing" in x) x.letterSpacing="6px";
  x.fillStyle="#A8A396"; x.font="36px 'Patrick Hand SC', sans-serif"; x.fillText("SAAKHI GHAR",80,100);
  if("letterSpacing" in x) x.letterSpacing="0px";
  x.fillStyle="#F08A1C"; x.font="700 40px 'Mukta Mahee', sans-serif"; x.textAlign="right"; x.fillText("ਸਾਖੀ ਘਰ",W-80,100); x.textAlign="left";
  const ax=80, ay=150, aw=W-160, ah=Math.round(aw*.8);
  x.save(); rr(x,ax,ay,aw,ah,30); x.clip(); x.fillStyle=s.c; x.fillRect(ax,ay,aw,ah);
  try{ const im=await svgImage(artFor(s)); x.drawImage(im,ax,ay,aw,ah); }catch(e){}
  x.restore();
  let y=ay+ah+112;
  x.fillStyle="#F3EEE2"; x.font="100px 'Caveat Brush', cursive"; y=wrapText(x,s.title,80,y,W-160,96,2);
  x.fillStyle="#F08A1C"; x.font="700 44px 'Mukta Mahee', sans-serif"; x.fillText(s.gur,80,y+74);
  if("letterSpacing" in x) x.letterSpacing="4px";
  x.fillStyle="#A8A396"; x.font="34px 'Patrick Hand SC', sans-serif"; x.fillText(s.cat.toUpperCase(),80,y+138);
  x.fillStyle="#F3EEE2"; x.fillText("READ IT ON SAAKHI GHAR",80,H-64); x.textAlign="right"; x.fillStyle="#F08A1C"; x.fillText("@READBYSINGH",W-80,H-64); x.textAlign="left";
  return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error("no image")),"image/png"));
}

  app.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>pick(b.dataset.pc));

}

function gurusPage(){
  app.innerHTML=`<div class="pad"><section class="page"><h1>Meet the Gurus</h1><p class="lead">The ten Sikh Gurus, from Guru Nanak Dev Ji to Guru Gobind Singh Ji, and the eternal Guru, Sri Guru Granth Sahib Ji.</p>
    <div class="gurus">${GURUS.map(g=>{ const n=STORIES.filter(s=>s.cat===g.cat).length; return `<article class="gcard" style="--gc:${g.c}">
      <header class="gh"><span class="num" aria-hidden="true">${parseInt(g.n)}</span><div class="ord">${g.n} Guru</div><h2>${esc(g.cat)}</h2><div class="gn" lang="pa">${g.gur}</div></header>
      <div class="gb">
        <dl class="facts"><div><dt>Lived</dt><dd>${g.life}</dd></div><div><dt>Guru</dt><dd>${esc(g.guru.replace(/^Guru from /,""))}</dd></div><div class="wide"><dt>Born</dt><dd>${esc(g.born)}</dd></div></dl>
        <h3>Remembered for</h3>
        <ul>${g.pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
        ${n?`<button class="pill" data-g="${esc(g.cat)}">Read ${n} ${n===1?"saakhi":"saakhis"} →</button>`:`<span class="soon">Saakhis coming soon</span>`}
      </div></article>`; }).join("")}
    <article class="gcard granth"><header class="gh"><span class="kh" aria-hidden="true">${khanda("#F2C14E")}</span><div class="ord">The eternal Guru</div><h2>Sri Guru Granth Sahib Ji</h2><div class="gn" lang="pa">${GRANTH.gur}</div></header>
      <div class="gb"><p>${esc(GRANTH.text)}</p></div></article>
    </div></section></div>`;
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ Object.assign(state,{cat:b.dataset.g,theme:"All",age:"All",fav:false,q:"",open:null}); location.hash="shelf"; });
}

/* ---------- Send a saakhi ---------- */
function sendPage(){
  const d=store("sg-draft",{});
  app.innerHTML=`<div class="pad"><section class="page"><h1>Send a saakhi</h1>
    <p class="lead">Know a saakhi that belongs on the shelf? Write it here and send it to Saakhi Ghar by email. Every saakhi is read and checked before it's added.</p>
    <form class="form" id="sform" novalidate>
      <div class="field"><label for="f-title">Title of the saakhi</label><input id="f-title" maxlength="80" value="${esc(d.title||"")}"><span class="err" id="e-title"></span></div>
      <div class="field"><label for="f-guru">Which Guru or time is it about?</label><select id="f-guru"><option value="">Choose one</option>${GURUS.map(g=>`<option${d.guru===g.cat?" selected":""}>${esc(g.cat)}</option>`).join("")}<option${d.guru==="Other Sikh history"?" selected":""}>Other Sikh history</option></select><span class="err" id="e-guru"></span></div>
      <div class="field"><label for="f-story">The saakhi <small>(in simple words, for children)</small></label><textarea id="f-story" maxlength="6000">${esc(d.story||"")}</textarea><span class="count2" id="c-story"></span><span class="err" id="e-story"></span></div>
      <div class="field"><label for="f-source">Where did you read or hear it? <small>(optional)</small></label><input id="f-source" maxlength="120" placeholder="A book, Gurdwara katha, your family" value="${esc(d.source||"")}"></div>
      <div class="field"><label for="f-name">Your name <small>(optional)</small></label><input id="f-name" maxlength="60" value="${esc(d.name||"")}"></div>
      <button class="cta" type="submit">Get it ready to send</button>
    </form><div id="ready"></div></section></div>`;
  const $=id=>document.getElementById(id);
  const save=()=>{ keep("sg-draft",{title:$("f-title").value,guru:$("f-guru").value,story:$("f-story").value,source:$("f-source").value,name:$("f-name").value}); $("c-story").textContent=`${$("f-story").value.trim().length} characters`; };
  ["f-title","f-guru","f-story","f-source","f-name"].forEach(id=>$(id).addEventListener("input",()=>{ save(); const e=$("e-"+id.slice(2)); if(e) e.textContent=""; }));
  save();
  $("sform").onsubmit=e=>{
    e.preventDefault();
    const t=$("f-title").value.trim(), g=$("f-guru").value, st=$("f-story").value.trim();
    let ok=true;
    if(!t){ $("e-title").textContent="Give your saakhi a title."; ok=false; }
    if(!g){ $("e-guru").textContent="Choose the Guru or time it's about."; ok=false; }
    if(st.length<120){ $("e-story").textContent="Write a little more: at least a few sentences, so it can be checked."; ok=false; }
    if(!ok){ const first=document.querySelector(".err:not(:empty)"); first && first.previousElementSibling && first.parentElement.querySelector("input,select,textarea").focus(); return; }
    const src=$("f-source").value.trim(), nm=$("f-name").value.trim();
    const text=`Saakhi Ghar: a new saakhi\n\nTitle: ${t}\nGuru: ${g}${src?`\nSource: ${src}`:""}${nm?`\nFrom: ${nm}`:""}\n\n${st}`;
    const mail=`mailto:${SUBMIT_EMAIL}?subject=${encodeURIComponent("New saakhi: "+t)}&body=${encodeURIComponent(text)}`;
    $("ready").innerHTML=`<div class="ready"><h2>Your saakhi is ready</h2><p>Tap <b style="font-weight:600">Send by email</b> to open your email app with the saakhi already written in. Then just press send. Thank you for sharing!</p>
      <div class="btns"><a class="pill" href="${mail}" style="background:var(--chitta);border-color:var(--chitta);color:#141414">Send by email</a><button class="pill" id="copysakhi">Copy the saakhi</button><button class="pill" id="clearsakhi">Start a new one</button></div>
      <p style="margin:14px 0 6px;font-size:.95rem">If your email app doesn't open, or the saakhi looks cut off, copy the saakhi and email it to:</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span id="mailaddr" style="user-select:all;font-family:var(--body);font-size:1.05rem;color:var(--kesri);word-break:break-all">${SUBMIT_EMAIL}</span><button class="pill" id="copymail" style="min-height:38px;padding:4px 14px;font-size:.9rem">Copy address</button></div></div>`;
    $("copysakhi").onclick=()=>copyText(text,"Saakhi copied");
    $("copymail").onclick=()=>copyText(SUBMIT_EMAIL,"Email address copied");
    $("clearsakhi").onclick=()=>{ keep("sg-draft",{}); sendPage(); };
    $("ready").scrollIntoView({behavior:reduce()?"auto":"smooth",block:"start"});
  };
}

/* ---------- Routing ---------- */
let lastStory=null;
function route(){
  stopSpeech(); closeSheet(); speech.onchange=null;
  if(driftStop){ driftStop(); driftStop=null; }
  const h = location.hash.slice(1);
  const s = byId(h);
  let tab="shelf";
  if (s){ lastStory=s.id; reader(s); window.scrollTo(0,0); }
  else if(h==="timeline"){ lastStory=null; tab=h; timeline(); window.scrollTo(0,0); }
  else if(h==="map"){ lastStory=null; tab=h; mapPage(); window.scrollTo(0,0); }
  else if(h==="gurus"){ lastStory=null; tab=h; gurusPage(); window.scrollTo(0,0); }
  else if(h==="send"){ lastStory=null; tab=h; sendPage(); window.scrollTo(0,0); }
  else {
    home();
    if(lastStory && h==="shelf"){ const id=lastStory; lastStory=null;
      const b=document.querySelector(`.book[data-id="${id}"]`); if(b){ b.scrollIntoView({block:"center",inline:"center"}); openBook(id,true); } }
    else if(h==="shelf") window.scrollTo(0,0);
  }
  document.querySelectorAll(".nav a").forEach(a=>a.setAttribute("aria-current", a.dataset.nav===tab?"page":"false"));
}
try{const v=store("sg-size",null); if(v) document.documentElement.style.setProperty("--read", v+"rem");}catch(e){}
addEventListener("hashchange", route);
route();
</script>

</body>
</html>
