text:["After the baoli was built at Goindwal in 1559, Guru Nanak's message spread even faster. At Goindwal, everyone ate together in pangat and bathed at the same place, whatever their caste. People who visited went home and began living the same way in their own villages.","Not everyone was happy about this. Some people had always been treated as higher than others because of their caste, and they did not like the idea that everyone was equal. In 1566, when the Mughal Emperor Akbar was staying in Lahore, they gave him a list of complaints against Guru Amar Das Ji. Akbar sent a message asking the Guru to come and answer them.","Guru Amar Das Ji sent Bhai Jetha to Lahore to answer on his behalf. In the emperor's court, Bhai Jetha listened to each complaint and answered calmly, one by one.","'The Sikhs don't say the old prayers at the set times each day,' said the first complaint. Bhai Jetha replied, 'Guru Nanak's teaching is for people of every caste and faith. It asks us to remember God all the time, not only at fixed hours.'","'The Sikhs don't follow the caste system,' said another. Bhai Jetha answered, 'All people are children of the same Creator. No one is born higher or lower than anyone else.' To the complaint that Sikhs don't worship idols, he said, 'The Sikhs believe God is alive and present everywhere, at every moment.' And to the complaint that Sikhs don't go on pilgrimages, he said, 'A place becomes holy because wise people teach there and share true knowledge.'","Akbar was impressed by his clear and gentle answers, and honoured Bhai Jetha with a robe of honour. Before leaving, Bhai Jetha asked the emperor to stop the special taxes that Hindus had to pay, including the tax on pilgrims. The story says that Akbar agreed."],
lesson:"Answer criticism calmly and clearly. Standing up for equality helps everyone, not just ourselves.",
think:["How did Bhai Jetha answer the complaints?","Why did Bhai Jetha ask Akbar to stop the taxes on Hindus?"],
words:[["Pangat","Sitting together in rows to eat, as equals."],["Siropa","A robe or scarf given as a mark of honour."],["Jizya","A special tax that non-Muslims had to pay under some rulers."]]},

{id:"founding-of-amritsar",n:33,title:"The Founding of Amritsar",gur:"ਗੁਰੂ ਕਾ ਚੱਕ",seal:"ਰ",cat:"Guru Ram Das Ji",age:"Kids",who:"Guru Ram Das Ji",where:"Guru Ka Chakk (Amritsar), 1570",mins:3,
c:"#0F6E8C",c2:"#E9B021",h:385,
summary:"Guru Amar Das Ji chooses a special place for a new town, and gives Bhai Jetha the job of building it.",
text:["In 1570, Guru Amar Das Ji took Bhai Jetha with him and met the headmen of the nearby villages: Gumtala, Tung, Sultanwind and Gilwali. He told them he wanted to build a new town. They all agreed happily and offered the land. The Guru paid for it, had it written in his name, and the town was named Guru Ka Chakk.","The foundation stone was laid at a special spot. Long before, in 1497, Guru Nanak Dev Ji had rested there with Bhai Mardana on his first great journey. He had said, 'Mardana, one day a great city will grow here, and it will spread the message of truth.' Now his words were coming true.","Guru Amar Das Ji explained to Bhai Jetha how the town should be built, then went back to Goindwal and left him in charge. Bhai Jetha first built a house, which became known as Guru Ke Kothe. Then he began digging a pool, Santokhsar.","The work was going to take a long time, so the Sikhs and workers began building homes for themselves nearby. Bhai Jetha started a langar, where every worker and every hungry person could eat as much as they needed.","One day, Bhai Jetha went to Goindwal and told the Guru that the new town was growing well. Guru Amar Das Ji was very pleased, and in 1574 he made him the fourth Guru, Guru Ram Das Ji, and asked him to move to the new town with his family.","Now the sangat came to the new town to see the Guru. People of all kinds of trades came to live there, and the town became known as Chakk Ram Das. In 1577, the Guru bought more land from the village of Tung so the town could grow. And when the great pool of Amrit was built, the town became famous as Amritsar, the Pool of Nectar."],
lesson:"Great things are built step by step, with patience and sewa. A town with a langar welcomes everyone.",
think:["What had Guru Nanak said about this place long ago?","Why do you think Bhai Jetha started a langar for the workers?"],
words:[["Chakk","A new settlement or town."],["Amritsar","'The Pool of Nectar'."],["Santokhsar","'The Pool of Contentment', a sarovar in Amritsar."]]},

{id:"bibi-rajnis-faith",n:34,title:"Bibi Rajni's Faith",gur:"ਦੁੱਖ ਭੰਜਨੀ ਬੇਰੀ",seal:"ਰ",cat:"Guru Ram Das Ji",age:"Kids",who:"Guru Ram Das Ji",where:"Amritsar, 1577",mins:3,
c:"#1F8E6E",c2:"#EFE6D2",h:400,
summary:"A girl believes that God gives to everyone. Her angry father tests her faith, and a small pond changes everything.",
text:["In the village of Patti lived a rich landlord named Duni Chand, who had five daughters. One day he asked them, 'Who gives you your food?' Four of the daughters said, 'You do, Father.' But the youngest, Rajni, said, 'God gives food to everyone, including me.'","Duni Chand was furious. 'Let's see how God feeds you, then!' he said. When Rajni grew up, he married her to a man who was very ill and could not walk, and sent her away from home.","Rajni did not complain. She carried her husband in a basket on her head from village to village and lived on whatever people gave her, always trusting God.","One day, she set the basket down in the shade of a ber tree beside a small pond and went to the nearby village to find food. While she was gone, her husband saw something amazing: black crows dipped into the pond and flew out white, like doves! He crawled to the water and dipped in, and he was healed.","When Rajni came back, she found a healthy man sitting under the tree. 'I am your husband,' he said. But Rajni couldn't believe it, so she took him to Guru Ram Das Ji. 'Rajni, he truly is your husband,' said the Guru. 'Your faith in God has healed him.'","Guru Ji told the sangat, 'This is the holy place that Guru Amar Das Ji spoke of.' The very next morning, together with Baba Budha Ji, he began digging the great pool there. That pool is the sarovar around Harmandir Sahib, and the ber tree, called Dukh Bhanjani Beri, the tree that removes suffering, still stands beside it today."],
lesson:"God looks after everyone. Keeping faith, even in hard times, brings blessings.",
think:["What did Rajni say when her father asked who gave her food?","How did Rajni show her faith during hard times?"],
words:[["Ber","A small fruit tree (jujube)."],["Dukh Bhanjani","'Remover of suffering'."],["Sarovar","A holy pool at a Gurdwara."]]},

{id:"yogis-question",n:35,title:"The Yogis' Question",gur:"ਜੋਗੀਆਂ ਨਾਲ ਗੋਸ਼ਟ",seal:"ਰ",cat:"Guru Ram Das Ji",age:"Kids",who:"Guru Ram Das Ji",where:"Amritsar",mins:3,
c:"#7A1F2B",c2:"#EFE6D2",h:380,
summary:"A group of yogis say Sikhs can't find peace without yoga. Guru Ram Das Ji answers with a question of his own.",
text:["While Guru Ram Das Ji was building the holy pool at Amritsar, a group of yogis came to see him. Guru Ji welcomed them warmly, gave them a place to sit, and asked why they had come.","Their leader said, 'Guru Ji, your Sikhs don't practise yoga. Without yoga, how can they control their minds? And without a calm mind, how can they find God? If they stay busy with worldly life, what is the use of being your Sikhs?'","Guru Ji answered, 'We teach our Sikhs to love God. Without kindness and love, no one can know God. When love for God grows in the heart, a person sees God everywhere in creation. They stay calm and joyful, their pride melts away, and they don't get caught up in greed, even while working and living a family life.'","Then Guru Ji asked a question of his own. 'If yogis find peace of mind, why do they go away to live in the mountains and forests? Why don't they stay among people and help those who are suffering?' The yogis had no answer.","Guru Ji then sang a shabad (Guru Granth Sahib, Ang 368), which gently said: 'O yogi, playing instruments for show is not enough. Learn from the Guru, sing God's praises, and let your mind rest in Him. Teach people the way to become one with God, who is everywhere.'","The yogis listened quietly, then rose and went away, with much to think about."],
lesson:"Love and kindness are the path to God, and we can walk it while living among people and helping them.",
think:["What did the yogis think was needed to find God, and what did the Guru say?","Why did Guru Ji ask why yogis live away in the mountains?"],
words:[["Yogi","A person who practises yoga, often living apart from the world."],["Grihasti","A person who lives a family life."],["Shabad","A hymn of Gurbani."]]},

{id:"diwali-lights",n:36,title:"Lights for the Guru's Return",gur:"ਬੰਦੀ ਛੋੜ ਦਿਵਸ",seal:"ਹ",cat:"Guru Hargobind Sahib Ji",age:"Kids",who:"Guru Hargobind Sahib Ji",where:"Gwalior and Amritsar",mins:3,
c:"#16224D",c2:"#F2C14E",h:400,
summary:"The Guru is kept far away in Gwalior fort. When he finally comes home, all of Amritsar glows with lamps.",
text:["Diwali is an old festival of India, a festival of lights. For Sikhs, it also has a special meaning, because of something that happened in the time of Guru Hargobind Sahib Ji, the sixth Guru.","Guru Hargobind Sahib Ji taught his Sikhs to be strong as well as prayerful. He trained them to defend themselves, built the Akal Takht in 1606, where he sat to listen to people's problems and settle them fairly, and later built Lohgarh fort to protect Amritsar.","The new governor of Lahore, Murtaza Khan, grew worried and sent reports to the Mughal emperor, Jahangir. Jahangir ordered that the Guru be kept in the fort of Gwalior, far away from Punjab.","The Sikhs missed their Guru terribly. Many walked about 450 miles, all the way to Gwalior. They could not go inside, so they bowed to the walls of the fort, and then walked all the way home again.","Sain Mian Mir, a Sufi saint from Lahore and a friend of the Gurus, saw this deep love. He went to Agra and spoke to Jahangir about Guru Arjan Dev Ji and Guru Hargobind Sahib Ji. After listening to him, Jahangir ordered that the Guru be set free.","Guru Hargobind Sahib Ji reached Amritsar on the day of Diwali. The joyful Sikhs lit lamps all over the city and set off fireworks to welcome him home. Ever since, Sikhs have celebrated this day as Bandi Chhor Divas, the Day of Freedom, with lights at Harmandir Sahib and in Gurdwaras all over the world."],
lesson:"Love and patience are powerful. For Sikhs, Diwali is Bandi Chhor Divas, a day of freedom and joy.",
think:["Why did the Sikhs walk all the way to Gwalior, even though they couldn't see the Guru?","How does your family celebrate Bandi Chhor Divas?"],
words:[["Bandi Chhor","The one who frees prisoners; Bandi Chhor Divas is the Day of Freedom."],["Gwalior","A city in central India with a huge hill fort."],["Diwali","The festival of lights."]]},

{id:"two-swords",n:37,title:"The Two Swords",gur:"ਮੀਰੀ ਪੀਰੀ",seal:"ਹ",cat:"Guru Hargobind Sahib Ji",age:"Kids",who:"Guru Hargobind Sahib Ji",where:"Guru Ki Wadali and Amritsar, 1606",mins:3,
c:"#E37A14",c2:"#1B2A5E",h:415,
summary:"At only eleven, the new Guru asks for two swords: one for the world, and one for the spirit.",
text:["Guru Hargobind Sahib Ji was born in 1595 in the village of Wadali, near Amritsar. His father was Guru Arjan Dev Ji and his mother was Mata Ganga Ji.","Before he was born, Mata Ganga Ji walked to see Baba Budha Ji, carrying simple food she had made with her own hands: missi roti and onions. Baba Budha Ji was pleased. Crushing an onion in his fist, he blessed her: 'You will have a son who is great and brave, who will stand up against cruelty.'","Young Hargobind had a wide education. Baba Budha Ji taught him reading, medicine, farming and how to lead people. Bhai Paraga taught him to use weapons, Bhai Jetha taught him the skills of defence, and Bhai Ganga Sehgal taught him to ride horses.","In 1606, Emperor Jahangir called Guru Arjan Dev Ji to Lahore. Before leaving, Guru Arjan Dev Ji made his son the next Guru and told him, 'Sit on the Guru's seat wearing weapons, build an army, and stand firm against cruelty.' In Lahore, Guru Arjan Dev Ji became the first Sikh shaheed. His son was only eleven years old, but he was not afraid.","At the ceremony to become Guru, he asked Baba Budha Ji for two swords. One was called Miri, for leading people in the world. The other was called Piri, for guiding their hearts and minds. He also wore a turban with a kalgi, a plume, like the kings of that time.","He told the sangat, 'From now on, bring good horses and weapons as your offerings. We must be ready to protect people from cruelty.' Young Sikhs came from far and wide to join him, asking only for two meals a day and new clothes twice a year. After morning prayers they practised in front of Harmandir Sahib, and Dhadi singers sang vaars about brave heroes to fill everyone with courage."],
lesson:"A Sikh is both a saint and a soldier: prayerful inside, and brave enough to protect others.",
think:["What did the two swords, Miri and Piri, stand for?","Why do you think the Guru wanted his Sikhs to be both prayerful and strong?"],
words:[["Miri","Worldly leadership; looking after people in daily life."],["Piri","Spiritual leadership; guiding people's hearts and minds."],["Kalgi","A plume worn on a turban, a sign of royalty."],["Dhadi","Singers who sing vaars about brave deeds, with the dhad drum and sarangi."]]},

{id:"cloak-of-52",n:38,title:"The Cloak of 52 Tassels",gur:"ਦਾਤਾ ਬੰਦੀ ਛੋੜ",seal:"ਹ",cat:"Guru Hargobind Sahib Ji",age:"Kids",who:"Guru Hargobind Sahib Ji",where:"Amritsar and Gwalior fort",mins:3,
c:"#8E5A2E",c2:"#EFE6D2",h:390,
summary:"Set free from Gwalior fort, the Guru refuses to leave alone. He finds a clever way to free 52 kings too.",
text:["Guru Hargobind Sahib Ji taught a simple rule: be afraid of no one, and frighten no one. Sikhs brought fine horses and weapons as offerings, and brave young people joined his army. Even Pathan soldiers, like Subedar Yaar Khan, who had been turned out of the Mughal army, came to serve him. Some men who had become robbers gave up their old ways and joined too. The Guru's home became a home for the homeless.","The Guru chose fifty-two skilled soldiers to train the new Sikhs. In 1606, he built the Akal Takht opposite Harmandir Sahib. Every evening he sat there like a king and settled people's quarrels fairly, so they no longer had to depend on unfair officials. He also built a fort, Lohgarh, to protect Amritsar.","Some people grew jealous and afraid of the Guru's growing strength. The governor of Lahore complained to Emperor Jahangir, who ordered that the Guru be held in the fort of Gwalior. Fifty-two Rajas, local kings, were already prisoners there.","Inside the fort, the Guru held prayers every morning and evening. The Rajas, and even the guards, found peace in his company. Meanwhile, holy men like Sain Mian Mir spoke out against this injustice, and at last Jahangir ordered that the Guru be set free.","But the Guru said, 'I will not leave unless these kings are freed too.' Jahangir thought of a trick. 'Any Raja who can hold on to the Guru's clothes may leave with him,' he said, thinking only a few could do so.","So the Guru had a special chola, a cloak, made with fifty-two tassels. Each Raja held on to one tassel, and all fifty-two walked out of the fort together behind the Guru! From then on, he was lovingly called Data Bandi Chhor, the generous one who frees prisoners."],
lesson:"Real freedom is something we share with others. Kind and clever thinking can find a way where there seems to be none.",
think:["Why didn't the Guru want to leave the fort alone?","How did the cloak help free all 52 kings?"],
words:[["Akal Takht","'Throne of the Timeless One', built opposite Harmandir Sahib."],["Lohgarh","'Fort of iron', built to protect Amritsar."],["Chola","A long robe or cloak."]]},

{id:"true-king",n:39,title:"Who Is the True King?",gur:"ਸੱਚਾ ਪਾਤਸ਼ਾਹ",seal:"ਹ",cat:"Guru Hargobind Sahib Ji",age:"Kids",who:"Guru Hargobind Sahib Ji",where:"Agra",mins:3,
c:"#3E8E4A",c2:"#E9B021",h:380,
summary:"Emperor Jahangir wonders why people call the Guru the True King. A poor grass-cutter gives him the answer.",
text:["Emperor Jahangir had ordered that Guru Hargobind Sahib Ji be held in the fort of Gwalior. Then the Sufi saint Sain Mian Mir spoke to him about Guru Arjan Dev Ji and Guru Hargobind Sahib Ji, and Jahangir realised he had made a terrible mistake. He sent his minister, Wazir Khan, to bring Guru Hargobind Sahib Ji from Gwalior to Agra with great respect.","In Agra, Jahangir seated the Guru beside him on a sandalwood seat. He could see that the Guru, wearing his two swords, was calm and dignified, and not afraid of anyone.","Jahangir brought forward Chandu, the man who had turned him against Guru Arjan Dev Ji, in chains. 'Here is the one to blame,' said Jahangir. The Guru had Chandu's chains untied, handed him over to his Sikhs, and said, 'Who was truly to blame will be decided in God's court.'","Jahangir asked the Guru to stay with him for a while. One day he asked, 'Why do people call you the True King, while I am only called king?' The Guru replied, 'I don't tell anyone what to call me. People call us what they see in us.' Jahangir was not satisfied.","The next day they went hunting together. At noon, the Guru rested under one tree and Jahangir under another. A poor grass-cutter had heard that the Guru was in the forest. Thinking Jahangir was the Guru, he placed a bundle of grass and a two-paisa coin in front of him and prayed, 'O True King, please look after me at the end of my life.'","Jahangir said, 'I am the king of this world. I can give you riches, but I cannot help you at the end of your life. Your True King is sitting under that tree.' The grass-cutter picked up his bundle and his coin, went to the Guru and bowed. After that day, Jahangir never again asked why the Sikhs called the Guru the True King."],
lesson:"Worldly kings rule for a while, but a true king rules people's hearts and looks after their souls.",
think:["What did Jahangir say he could and couldn't do for the grass-cutter?","Why do you think people called the Guru the True King?"],
words:[["Sacha Patshah","'The True King', a loving name for the Guru."],["Paisa","A small coin; a hundred paise make one rupee."]]},

{id:"nanakmatta-tree",n:40,title:"The Pipal Tree of Nanakmatta",gur:"ਨਾਨਕਮਤਾ",seal:"ਹ",cat:"Guru Hargobind Sahib Ji",age:"Kids",who:"Guru Hargobind Sahib Ji",where:"Nanakmatta",mins:3,
c:"#EFE6D2",c2:"#1F8E6E",t:"#1b1b1b",h:405,
summary:"Some yogis set fire to the tree where Guru Nanak once sat. Guru Hargobind Sahib Ji rides out to save it.",
text:["In the time of Guru Hargobind Sahib Ji, the sixth Guru, after he came back from the fort of Gwalior, Guru Nanak's teachings spread freely across the land. At Nanakmatta, far to the east of Punjab, a Sikh named Baba Almast looked after the place where Guru Nanak Dev Ji had once sat under a pipal tree and talked with yogis.","Baba Almast cared for the place and shared Guru Nanak's message with visitors. But some followers of the yogi Gorakhnath did not like this. They took the place over, drove Baba Almast away, and set fire to the old pipal tree.","When Guru Hargobind Sahib Ji heard the news, he set out for Nanakmatta with a group of horsemen. When the yogis saw the Guru's Sikhs coming, they ran away.","The tree was still smouldering when the Guru arrived. He sat down beside it and sang Gurbani. Then he mixed saffron and sandalwood in water and sprinkled it over the burnt tree.","The story says that, before everyone's eyes, the tree came back to life. New leaves sprouted with yellow marks like kesar and white marks like sandalwood. People say these marks can still be seen on its leaves today.","Hearing this, the yogis came back. 'We have given up the world to live here,' they said. 'Why do family people like you come to trouble us?' The Guru asked gently, 'If you have truly given up the world, why are you fighting over this place?' The yogis had no answer, and they went away."],
lesson:"Holy places are for everyone to share. Calm truth is stronger than anger.",
think:["What question did the Guru ask the yogis?","Why was this tree so special to the Sikhs?"],
words:[["Pipal","A sacred fig tree with heart-shaped leaves."],["Nanakmatta","A Gurdwara town in Uttarakhand, where Guru Nanak Dev Ji met yogis."],["Kesar","Saffron; a golden-orange spice and colour."]]},

{id:"kiratpur-medicine",n:41,title:"Medicine for Dara Shikoh",gur:"ਕੀਰਤਪੁਰ ਦਾ ਦਵਾਖ਼ਾਨਾ",seal:"ਹ",cat:"Guru Har Rai Sahib Ji",age:"Kids",who:"Guru Har Rai Sahib Ji",where:"Kiratpur Sahib",mins:3,
c:"#3E8E4A",c2:"#EFE6D2",h:400,
summary:"The emperor's favourite son falls ill, and no royal doctor can cure him. The medicine he needs is at the Guru's free hospital.",
text:["Guru Har Rai Sahib Ji was born in 1630 at Kiratpur. His father was Baba Gurditta Ji, the eldest son of Guru Hargobind Sahib Ji. His grandfather kept him close and taught him both the scriptures and the skills of a horseman. Whenever young Har Rai had a chance to do sewa, he did it with great joy. Before he left this world in 1644, Guru Hargobind Sahib Ji made him the seventh Guru.","Guru Har Rai Sahib Ji kept 2,200 horsemen ready to protect the sangat, and built Patalgarh fort near Kiratpur. In the afternoons he rode into the forest with his Sikhs, so the hill people would see them and feel brave too.","He also opened a big dawakhana, a hospital, at Kiratpur. He hired skilled healers and gathered medicines from all over the country, and every needy person was treated for free. He asked for free clinics to be run at other Sikh centres too, and soon the Kiratpur dawakhana was famous across India.","Emperor Shah Jahan loved his eldest son, Dara Shikoh, very much. One day Dara fell seriously ill with a stomach illness, and the royal doctors could not cure him. They told the emperor, 'The right medicine can be found at the dawakhana in Kiratpur.'","Shah Jahan hesitated. 'How can I ask the Sikhs for help, when I have sent armies against them?' But Pir Hassan Ali told him, 'Guru Nanak's house is no one's enemy. They always do good to others.' So Shah Jahan wrote a letter to the Guru.","Guru Har Rai Sahib Ji sent the medicine straight away, and Dara Shikoh got well. Dara came to Kiratpur himself, bringing gifts to thank the Guru."],
lesson:"Kindness and healing are for everyone, even those who have not been kind to us.",
think:["Why did Shah Jahan hesitate to ask the Guru for help?","What does it mean that Guru Nanak's house is no one's enemy?"],
words:[["Dawakhana","A place where medicines are given; a clinic or hospital."],["Kiratpur","A town on the river Sutlej, where Guru Har Rai Sahib Ji was born."]]},

{id:"mai-taabo",n:42,title:"Mother Taabo's Pancakes",gur:"ਮਾਈ ਤਾਬੋ",seal:"ਹ",cat:"Guru Har Rai Sahib Ji",age:"Kids",who:"Guru Har Rai Sahib Ji",where:"Near Kiratpur Sahib",mins:2,
c:"#E9B021",c2:"#7A1F2B",t:"#1b1b1b",h:385,
summary:"An old woman makes sweet pancakes, hoping the Guru will come. One day, he stops at her door.",
text:["One day, while out riding with his Sikhs, Guru Har Rai Sahib Ji stopped outside a small hut. An old woman, Mai Taabo, came out.","'Mother, I am very hungry,' said the Guru. 'Please give me whatever you have cooked for me.' Mai Taabo was amazed. She had made sweet pude, Punjabi pancakes, hoping that one day the Guru would pass by. She brought them out, wrapped in a cloth.","Without even getting off his horse, the Guru unwrapped the pancakes and ate them happily. Handing back the cloth, he smiled and said, 'Mother, the pancakes were delicious!' Mai Taabo's heart overflowed with joy.","The next day, a Sikh packed some food to take on the ride, thinking the Guru might get hungry again. When he offered it, the Guru said, 'Meals are eaten in the langar, sitting together. There is a proper way to eat.'","The Sikh asked respectfully, 'But Guru Ji, yesterday you ate on horseback, without even washing your hands.' The Guru answered, 'That was because of that old mother's love. She had made that food for me and was waiting. Her love pulled me there.'"],
lesson:"The Guru is drawn by love. A small gift made with a loving heart means more than anything.",
think:["Why did the Guru eat Mai Taabo's pancakes on horseback?","What is something you could make for someone with love?"],
words:[["Mai","Mother; a respectful way to speak to an older woman."],["Pude","Sweet Punjabi pancakes."],["Langar","The free community kitchen where everyone eats together."]]},

{id:"peace-above-kingdom",n:43,title:"Peace Above a Kingdom",gur:"ਦਾਰਾ ਸ਼ਿਕੋਹ",seal:"ਹ",cat:"Guru Har Rai Sahib Ji",age:"Kids",who:"Guru Har Rai Sahib Ji",where:"Goindwal, 1658",mins:3,
c:"#0F6E8C",c2:"#E9B021",h:410,
summary:"A prince running from his brother's army is offered help to win the throne. He asks the Guru for something else.",
text:["Emperor Shah Jahan fell seriously ill in 1657, and wanted his eldest son, Dara Shikoh, to rule after him. But his younger son, Aurangzeb, wanted the throne for himself. The brothers' armies met near Agra, and Dara Shikoh was defeated. Aurangzeb locked his father in Agra fort and made himself emperor.","Dara Shikoh was very different from his brother. He loved the company of saints and holy men. He followed the Sufi path of love taught by Sain Mian Mir, and he often visited the Guru's house.","As he travelled towards Lahore in 1658, Dara Shikoh stopped at Goindwal to meet Guru Har Rai Sahib Ji. The Guru asked him, 'If you wish, I can help you win the throne of Delhi.'","Dara Shikoh replied, 'O True King, what would I do with the throne of Delhi, where there is fighting and quarrelling day and night? You once cured my body. Now please cure my soul and give me peace.'","The Guru said, 'Peace comes from accepting God's will, bhana. And that is only possible when you truly love God, with a love so great that you would give everything for it.' These words echo Guru Nanak Dev Ji: if you want to play the game of love, come to me with your head on your palm (Guru Granth Sahib, Ang 1412).","Dara Shikoh said, 'I have found what I came for,' and went on his way with a peaceful heart. He later lost his struggle with Aurangzeb, but he is remembered as a prince who loved wisdom and peace more than power."],
lesson:"Peace of mind is worth more than any kingdom. True love for God means giving it our all.",
think:["Why didn't Dara Shikoh want the throne?","What did the Guru say brings peace?"],
words:[["Sufi","A Muslim tradition of deep love for God."],["Bhana","God's will; accepting what happens with peace."],["Sain Mian Mir","A Sufi saint of Lahore and a friend of the Gurus."]]},

{id:"emperors-invitation",n:44,title:"The Emperor's Invitation",gur:"ਔਰੰਗਜ਼ੇਬ ਦਾ ਸੱਦਾ",seal:"ਹ",cat:"Guru Har Rai Sahib Ji",age:"Kids",who:"Guru Har Rai Sahib Ji",where:"Kiratpur Sahib",mins:3,
c:"#7A1F2B",c2:"#E9B021",h:395,
summary:"Aurangzeb orders the Guru to come to Delhi. The Guru calmly says no, and armies sent against him never arrive.",
text:["Once Aurangzeb had made himself emperor, he began to worry about the growing strength of the Sikhs. He sent a message ordering Guru Har Rai Sahib Ji to come to Delhi.","The Guru did not think it right to go. He wrote back, 'I have not taken any of your land, and I owe you nothing. Why should I come to you?' Angry, Aurangzeb told the governor of Lahore to bring the Guru by force.","Three times the governor sent an army towards Kiratpur, and three times it never arrived. The first commander fell ill and died on the way. The second was killed by his own enemies before he got there. The third army was struck by a terrible sickness, and the soldiers refused to go any further. After that, no general was willing to march on Kiratpur.","Aurangzeb realised he could not bring the Guru by force. So he sent Diwan Shiv Dayal, a man who respected the Guru, to invite him politely.","At Kiratpur, the Diwan said, 'Guru Ji, please come to Delhi to bless the sangat there, and show the emperor the path of truth.' The Guru replied, 'I have decided not to go before the emperor. But I will send my elder son, Ram Rai, with you.'","Ram Rai was only eleven. Before he left, the Guru told him, 'Stand firm in your faith. If you do, all will be well.'"],
lesson:"Stand firm for what is right, calmly and without fear.",
think:["Why didn't the Guru want to go to Delhi?","What did the Guru tell Ram Rai before he left?"],
words:[["Diwan","A minister or official at a royal court."],["Sangat","The community of people who gather together."]]},

{id:"ram-rai-word",n:45,title:"Ram Rai Changes a Word",gur:"ਬਾਬਾ ਰਾਮ ਰਾਇ",seal:"ਹ",cat:"Guru Har Rai Sahib Ji",age:"Kids",who:"Guru Har Rai Sahib Ji",where:"Delhi",mins:3,
c:"#5B2C83",c2:"#EFE6D2",h:380,
summary:"In the emperor's court, the Guru's clever young son wins praise and gifts. Then he changes one word of Gurbani.",
text:["Emperor Aurangzeb wanted Guru Har Rai Sahib Ji, the seventh Guru, to come to his court in Delhi. The Guru would not go before the emperor, so he sent his elder son, Ram Rai, instead. Ram Rai was only eleven, but he was clever and quick with words. The Guru sent wise Sikhs and twenty-two horsemen with him to Delhi, where they stayed at Majnu Ka Tilla, beside the river Yamuna.","In the emperor's court, Aurangzeb was amazed by the bright young boy. He seated Ram Rai beside him and asked him many questions, and Ram Rai answered them all cleverly. The emperor treated him with great honour. Slowly, Ram Rai began to forget that this respect came from the Guru's blessing, and started to think it was all because of himself.","Aurangzeb asked him to show miracles, and to please the emperor, Ram Rai did, again and again, and received rich gifts. He forgot an important teaching of the Guru's house: Sikhs do not show miracles to impress people, because only God's will should be done.","Then the emperor's advisers pointed to a line by Guru Nanak Dev Ji in Asa Di Vaar. It says that the clay of a Musalman's grave can end up in a potter's hands, shaped into pots and bricks and baked in the fire (Guru Granth Sahib, Ang 466). Guru Ji's meaning was that every body returns to the earth, and only our deeds matter. But Aurangzeb asked, 'Why did Guru Nanak write this about Muslims?'","Ram Rai wanted to keep the emperor happy. 'Guru Nanak really wrote beiman, a dishonest person, not Musalman,' he said. 'The writer made a mistake.' He had changed the Guru's words to please a king.","When Guru Har Rai Sahib Ji heard this in Kiratpur, he was deeply saddened. He sent Ram Rai a message: 'Do not show me your face again. You have given up the truth for the sake of honour and gifts.' Later, the Guru chose his younger son, Harkrishan, to be the next Guru."],
lesson:"The Guru's words must never be changed, not even to please the most powerful person in the world.",
think:["How did Ram Rai change as he received more praise and gifts?","Why was changing even one word of Gurbani so serious?"],
words:[["Majnu Ka Tilla","A place beside the Yamuna in Delhi, now a Gurdwara."],["Beiman","A dishonest person."],["Asa Di Vaar","A long hymn by Guru Nanak Dev Ji, sung every morning in Gurdwaras."]]},

{id:"five-year-old-guru",n:46,title:"The Five-Year-Old Guru",gur:"ਬਾਲਾ ਪ੍ਰੀਤਮ",seal:"ਹ",cat:"Guru Harkrishan Sahib Ji",age:"Kids",who:"Guru Harkrishan Sahib Ji",where:"Kiratpur Sahib, 1661",mins:3,
c:"#1F8E6E",c2:"#F2C14E",h:395,
summary:"Some people laugh that a five-year-old cannot be the Guru. A sick man and a simple handkerchief prove them wrong.",
text:["Guru Harkrishan Sahib Ji was born in 1656 at Kiratpur. His mother was Mata Krishan Kaur Ji and his father was Guru Har Rai Sahib Ji. In 1661, his father made him the eighth Guru. He was only five years old.","His elder brother, Ram Rai, was very upset. Some masands told him, 'We can make you the Guru instead.' So Ram Rai went to Emperor Aurangzeb and asked for help to take the Guruship.","But Aurangzeb said, 'I cannot make you the Guru. It is for the Sikhs to decide whom they follow.' Instead, he gave Ram Rai some villages near where the city of Dehradun stands today.","Some people doubted that such a young child could truly be the Guru. Guru Har Rai Sahib Ji had taught, 'The Guru is a light, not a body,' but they did not understand. As a joke, they told a man suffering from leprosy, a painful skin illness, 'Go to the Sikhs' Guru. He will make you well!'","The poor man lay down on the path where the young Guru was passing, and cried, 'O Guru, please heal me!' Guru Harkrishan Sahib Ji gave him his own handkerchief and said, 'Remember God's name, and wipe this handkerchief over your body.' The man did so, and he was healed. The people who had played the joke were deeply ashamed.","News of this spread far and wide. Sick people came from near and far to the Guru, received medicine from the Guru's dawakhana, and went home well and happy. Many people who had fallen into bad habits, like gambling and stealing, gave them up and began a new life in the Guru's sangat."],
lesson:"Wisdom and goodness don't depend on age. The Guru is a light, not a body.",
think:["Why did some people doubt the young Guru?","What did the Guru tell the sick man to do with the handkerchief?"],
words:[["Bala Pritam","'The beloved child', a loving name for Guru Harkrishan Sahib Ji."],["Rumal","A handkerchief."],["Masand","A person once appointed to collect offerings."]]},

{id:"chhajju-gita",n:47,title:"Chhajju Explains the Gita",gur:"ਛੱਜੂ ਝੀਵਰ",seal:"ਹ",cat:"Guru Harkrishan Sahib Ji",age:"Kids",who:"Guru Harkrishan Sahib Ji",where:"Panjokhra, near Ambala, 1664",mins:3,
c:"#B5612E",c2:"#EFE6D2",h:405,
summary:"A proud scholar dares the young Guru to explain the Gita. The Guru sends for a water-carrier instead.",
text:["Emperor Aurangzeb had heard that the Sikhs' love for their young Guru grew stronger every day. He wanted to meet the Guru himself, so he asked Mirza Raja Jai Singh, a Rajput king at his court who loved the Guru's house, to invite the Guru to Delhi.","The Raja sent his minister, Diwan Paras Ram, to Kiratpur. The Guru agreed to come to Delhi to meet the sangat there, but said, 'I will not go before the emperor. This was my father's command, and I will keep it.'","On the day of Basant, the spring festival, the Guru set out from Kiratpur with many Sikhs. When they stopped at the village of Panjokhra, near Ambala, a learned man named Pandit Lal Chand saw the grand group pass by and asked who it was.","When a Sikh told him it was Guru Harkrishan, the Pandit said, 'Anyone can call himself Krishan! Let me see if he truly has wisdom.' The Sikh took him to the Guru. The Pandit said, 'You share your name with Krishna, who taught the Gita. Can you explain even one verse of the Gita?'","The young Guru smiled. 'Even if I explain it, you may not be satisfied. Go and bring anyone from the village, and he will answer your questions.' The Pandit came back with Chhajju, a simple water-carrier who had never learned to read.","With the Guru's blessing, Chhajju began to explain the deep meanings of the Gita's verses as clearly as a great scholar. Pandit Lal Chand was amazed. His pride melted away, he bowed at the Guru's feet, and he became a Sikh. Today, Gurdwara Panjokhra Sahib stands at this place."],
lesson:"Pride in our learning can blind us. True wisdom is a gift that the Guru can give to anyone, however humble.",
think:["Why do you think the Guru sent for an ordinary villager?","How did Pandit Lal Chand change by the end?"],
words:[["Gita","The Bhagavad Gita, a holy book of Hinduism."],["Basant","The spring festival."],["Jheevar","A water-carrier."]]},

{id:"queen-in-disguise",n:48,title:"The Queen in Disguise",gur:"ਬੰਗਲਾ ਸਾਹਿਬ",seal:"ਹ",cat:"Guru Harkrishan Sahib Ji",age:"Kids",who:"Guru Harkrishan Sahib Ji",where:"Delhi, 1664",mins:3,
c:"#7A1F2B",c2:"#E9B021",h:385,
summary:"The emperor tests the young Guru: can he spot a queen dressed as a maid? Then the emperor's son comes with a request.",
text:["When Guru Harkrishan Sahib Ji reached Delhi, Mirza Raja Jai Singh welcomed him and gave him his own bungalow to stay in. That place is now Gurdwara Bangla Sahib. The Guru told the Raja, 'I have come because of the love of the Sikhs here. I will not meet Aurangzeb.'","Aurangzeb was surprised. He sent the Guru costly gifts: precious stones, pearls, fine clothes and a mala, a string of prayer beads. The Guru kept only the mala and sent everything else back. Aurangzeb understood that the Guru was not greedy for riches, and not afraid of a king.","Then the emperor thought of a test. He asked Mirza Raja Jai Singh to dress his queen in plain clothes, like a maid, and have her sit among the servants of the palace. 'Let us see if the Guru can recognise her,' he said.","The Raja invited the Guru to the palace. The young Guru walked past all the women until he came to the queen. He touched her head gently with his small cane and said, 'Why should a queen dress as a maid?' The queen was amazed, and the test was over.","Next, Aurangzeb sent his son, Prince Muazzam, to visit the Guru. The prince was amazed by the busy langar, where anyone could eat at any time, and the story says the Guru gave him fruit from the garden that was not even in season.","The prince asked whether the Guru would meet his father. The Guru answered with the words of Guru Nanak Dev Ji: food and fine clothes are wasted on a person who does not keep the True One in their mind (Guru Granth Sahib, Ang 142). He wrote these words down for the prince to take to the emperor."],
lesson:"Riches and tests cannot sway a true Guru. What matters most is keeping God in our mind.",
think:["Why did the Guru keep only the mala and send back the jewels?","What message did the Guru send to the emperor?"],
words:[["Bangla Sahib","'The bungalow', now a famous Gurdwara in Delhi."],["Mala","A string of prayer beads."],["Mirza Raja Jai Singh","A Rajput king at the Mughal court."]]},

{id:"healing-delhi",n:49,title:"Healing the Sick of Delhi",gur:"ਬਾਬਾ ਬਕਾਲੇ",seal:"ਹ",cat:"Guru Harkrishan Sahib Ji",age:"Kids",who:"Guru Harkrishan Sahib Ji",where:"Delhi, 1664",mins:3,
c:"#EFE6D2",c2:"#2747A8",t:"#1b1b1b",h:410,
summary:"A terrible sickness spreads through Delhi. The young Guru keeps his promise and serves the sick until the very end.",
text:["When young Guru Harkrishan Sahib Ji came to Delhi, Emperor Aurangzeb sent his son, Prince Muazzam, to visit him. The prince went back and told his father, 'The Guru's court is grander than a king's! Food is served to everyone at any time, sick people get well, and God's praises are sung all day long.' Now Aurangzeb wanted even more to see the Guru.","One morning, Aurangzeb came to Bangla Sahib all alone. Diwan Durga Mal told the Guru, who said, 'Close the door, and tell him that the Guru will not meet him.' After waiting a while, the emperor went away.","Around this time, Tegh Bahadur Ji, the Guru's grandfather's brother, came from Bakala to visit. He stayed for three days, and then returned to Bakala.","Soon the Guru moved to the inn of Bhai Kalyana, in the middle of the city. At that time, a terrible sickness called smallpox was spreading through Delhi. Sick people came to the Guru from all over the city, crowding around him day and night, and the Guru cared for them all. Many got well.","Then the young Guru himself fell ill with a high fever. On 30 March 1664, he asked for a coconut and five coins to be brought on a plate. He circled them with his right hand, bowed his head, and said, 'Baba Bakale', which means the next Guru is the elder at Bakala. Then, at only seven years old, he left this world and merged with Waheguru. He had kept his promise: he never once came before the emperor.","His last words led the Sikhs to Guru Tegh Bahadur Ji at Bakala. Today, Gurdwara Bangla Sahib stands where the young Guru stayed in Delhi, and people from all over the world still come there to pray."],
lesson:"Serve others with a loving heart, and keep your promises, even when it is hard.",
think:["How did the Guru help the people of Delhi?","What did the words 'Baba Bakale' tell the Sikhs?"],
words:[["Smallpox","A dangerous illness that once spread quickly from person to person."],["Baba Bakale","'The elder at Bakala', the Guru's last words."],["Sarai","An inn where travellers stay."]]},

{"id": "bhai-lalo", "title": "Bhai Lalo's Bread", "gur": "ਭਾਈ ਲਾਲੋ", "cat": "Guru Nanak Dev Ji", "age": "Kids", "where": "Saidpur (Eminabad)", "mins": 3, "c": "#B5612E", "c2": "#EFE6D2", "h": 395, "summary": "A poor carpenter and a rich official both invite Guru Nanak to eat. Only one meal is made with honest work.", "text": ["On his travels, Guru Nanak Dev Ji came to the town of Saidpur, now called Eminabad. There lived a poor carpenter named Bhai Lalo. He worked hard all day and earned very little, but he was honest and kind. Guru Ji chose to stay in Bhai Lalo's simple home and happily ate his plain, coarse bread.", "In the same town lived a rich official called Malik Bhago. He had become wealthy by cheating people and taking more than was fair from the poor. Malik Bhago held a grand feast and invited all the holy men of the area. Everyone came, except Guru Nanak.", "Malik Bhago was upset. He sent for Guru Ji and asked, \"Why do you eat dry bread at a carpenter's house and refuse my rich food?\"", "Guru Ji asked for a piece of bread from each house. He held Bhai Lalo's bread in one hand and Malik Bhago's in the other, and pressed them. The story says that milk came out of Bhai Lalo's bread, while blood came out of Malik Bhago's.", "Guru Ji explained that Bhai Lalo's food was made with honest work, so it was pure like milk. Malik Bhago's food was made from the suffering of others. Malik Bhago felt ashamed. He changed his ways and began to live honestly."], "lesson": "Kirat karni means earning an honest living. Food and money earned honestly carry blessings; what is taken from others does not.", "think": ["What made Bhai Lalo's simple bread special?", "How can you be honest in small things, like games or schoolwork?"], "words": [["Kirat", "Honest work; kirat karni means earning an honest living."], ["Malik", "A title for a rich official or landlord."]], "n": 50, "seal": "", "who": "Guru Nanak Dev Ji"},

{"id": "sweet-reethas", "title": "The Sweet Reethas", "gur": "ਮਿੱਠੇ ਰੀਠੇ", "cat": "Guru Nanak Dev Ji", "age": "Kids", "where": "Reetha Sahib, in the hills", "mins": 2, "c": "#3E8E4A", "c2": "#E9B021", "h": 380, "summary": "Bhai Mardana is hungry in the hills, and the only tree nearby has bitter fruit.", "text": ["Guru Nanak Dev Ji travelled with his friend and companion, Bhai Mardana, who played the rabab while Guru Ji sang. One day, as they walked through the hills far to the east of Punjab, Bhai Mardana grew very hungry.", "\"Guru Ji, I'm so hungry, I can't walk any further,\" he said. But there were no villages and no food anywhere nearby, only a tree full of reethas. Reethas, or soapnuts, are so bitter that people use them for washing clothes and hair, not for eating.", "Guru Ji smiled and said, \"Mardana, eat the fruit of this tree.\" Bhai Mardana was surprised, but he trusted the Guru. He picked a reetha and took a bite.", "The story says that the reetha tasted as sweet as honey! Bhai Mardana ate happily until he was full.", "Today, Gurdwara Reetha Sahib stands at that place, in Uttarakhand. People say the reethas from the tree there are still sweet, and they are shared with visitors as prashad."], "lesson": "Trust the Guru, even when things seem hard. Waheguru looks after those who walk the right path.", "think": ["Why was Bhai Mardana surprised when Guru Ji told him to eat the reethas?", "Can you remember a time when trusting someone helped you?"], "words": [["Reetha", "A soapnut; a bitter fruit used for washing."], ["Rabab", "A stringed instrument played by Bhai Mardana."]], "n": 51, "seal": "", "who": "Guru Nanak Dev Ji"},

{"id": "duni-chands-needle", "title": "Duni Chand's Needle", "gur": "ਦੁਨੀ ਚੰਦ ਦੀ ਸੂਈ", "cat": "Guru Nanak Dev Ji", "age": "Kids", "where": "Lahore", "mins": 3, "c": "#E9B021", "c2": "#7A1F2B", "t": "#1b1b1b", "h": 400, "summary": "A rich man proudly shows off his wealth. Guru Nanak gives him a tiny needle, and a big question.", "text": ["In Lahore lived a very rich man named Duni Chand. Above his house fluttered many flags. Each flag showed that he owned another hundred thousand rupees, and he was very proud of them.", "When Guru Nanak Dev Ji came to Lahore, Duni Chand invited him home for a feast. He showed Guru Ji all his riches and pointed proudly at the flags.", "Guru Ji handed him a small sewing needle. \"Please keep this needle safe for me,\" he said. \"I will ask you for it in the next world, after this life.\"", "Duni Chand took the needle and went to his wife. \"The Guru wants me to give it back to him after I die,\" he said. His wife asked gently, \"How can you take a needle with you when you die? We cannot take even our gold.\"", "Duni Chand ran back to Guru Ji. \"I cannot take this needle with me,\" he said. Guru Ji replied, \"Then how will you take all your wealth? Only the good you do, and your love for Waheguru, go with you.\" Duni Chand understood. He began to share his wealth with the poor and to remember God."], "lesson": "We cannot take riches with us. What we share, and the good we do, matter most.", "think": ["Why couldn't Duni Chand take the needle with him?", "What could you share with others this week?"], "words": [["Suee", "A needle."], ["Daan", "Giving or sharing with others."]], "n": 52, "seal": "", "who": "Guru Nanak Dev Ji"},

{"id": "sajjan-thag", "title": "Sajjan the Thug", "gur": "ਸੱਜਣ ਠੱਗ", "cat": "Guru Nanak Dev Ji", "age": "Kids", "where": "Talumba, near Multan", "mins": 3, "c": "#2B4F7A", "c2": "#E9B021", "h": 390, "summary": "A friendly innkeeper pretends to be holy, but secretly robs his guests. A shabad shows him the truth.", "text": ["In the town of Talumba, near Multan, lived a man named Sajjan. His name means 'friend', and he seemed very kind. He had built a place of prayer for Hindus and one for Muslims, and an inn where travellers could rest for free.", "But Sajjan had a terrible secret. At night, he robbed the travellers who stayed at his inn, and they were never seen again. So people secretly called him Sajjan Thag, Sajjan the thug.", "Guru Nanak Dev Ji and Bhai Mardana stopped at the inn. Sajjan saw that Guru Ji's face shone with peace, and thought he must be carrying something precious. He waited for the night.", "When the night came, Guru Ji began to sing a shabad (Guru Granth Sahib, Ang 729). It said that bronze can shine brightly, but when you rub it, its black shows through. Washing the outside cannot make it clean inside. A true friend is the one who stays with you to the end.", "Sajjan heard every word. He felt as if the shabad was about him. He fell at Guru Ji's feet, cried, and asked for forgiveness. Guru Ji told him to give back what he had taken and to spend his life helping others. Sajjan did, and his inn became one of the first dharamsalas, a place where everyone was truly welcome."], "lesson": "Being good on the outside is not enough. We must be honest and kind on the inside too.", "think": ["What did the shabad say about shiny bronze?", "Why do you think Sajjan changed?"], "words": [["Sajjan", "A friend."], ["Thag", "A thug or cheat."], ["Dharamsala", "A place where the sangat gathered; an early Gurdwara."]], "n": 53, "seal": "", "who": "Guru Nanak Dev Ji"},

{"id": "panja-sahib", "title": "The Rock at Panja Sahib", "gur": "ਪੰਜਾ ਸਾਹਿਬ", "cat": "Guru Nanak Dev Ji", "age": "Kids", "where": "Hasan Abdal", "mins": 3, "c": "#5E8A7E", "c2": "#EFE6D2", "h": 405, "summary": "A thirsty Bhai Mardana is refused water three times. Then a great rock comes rolling down the hill.", "text": ["On a hot summer day, Guru Nanak Dev Ji and Bhai Mardana reached Hasan Abdal, a place now in Pakistan. Bhai Mardana was very thirsty, but the only spring of water was at the top of a hill, where a holy man named Wali Kandhari lived.", "Bhai Mardana climbed up and asked for water. Wali Kandhari refused. \"If your teacher is so great, let him give you water,\" he said. Bhai Mardana climbed down. Guru Ji sent him up again, and again, but each time Wali Kandhari said no.", "Guru Ji smiled and told Bhai Mardana to lift a stone from the ground near them. When he did, cool, clear water bubbled up. At the same moment, the story says, Wali Kandhari's spring began to dry up.", "Wali Kandhari grew angry. He pushed a huge boulder down the hill towards Guru Ji. As it rolled close, Guru Ji calmly raised his hand and stopped the rock. The story says his handprint was pressed into the stone.", "Wali Kandhari saw his mistake and came down to ask forgiveness. Today, Gurdwara Panja Sahib stands there. Its name means 'the hand', and the spring of water still flows beside the rock."], "lesson": "Water, like kindness, should be shared with everyone. Calm and patience are stronger than anger.", "think": ["Why did Wali Kandhari refuse to give water?", "What does the name Panja Sahib mean?"], "words": [["Panja", "The palm of the hand."], ["Chashma", "A spring of water."]], "n": 54, "seal": "", "who": "Guru Nanak Dev Ji"},

{"id": "water-to-the-west", "title": "Water to the West", "gur": "ਖੇਤਾਂ ਨੂੰ ਪਾਣੀ", "cat": "Guru Nanak Dev Ji", "age": "Kids", "where": "Haridwar", "mins": 2, "c": "#0F6E8C", "c2": "#F2C14E", "h": 375, "summary": "At the river Ganga, everyone throws water towards the rising sun. Guru Nanak turns the other way.", "text": ["Guru Nanak Dev Ji visited Haridwar, a holy city on the river Ganga. Early in the morning, many people stood in the river, throwing handfuls of water towards the rising sun in the east, as an offering for their ancestors.", "Guru Ji walked into the river too, but he turned to face the west and began throwing water in that direction.", "People were amazed. \"What are you doing?\" they asked. \"You are facing the wrong way!\"", "Guru Ji smiled. \"My fields in Punjab are dry, in the west. I am sending water to them.\" The people laughed. \"How can water reach your fields, hundreds of miles away?\"", "Guru Ji replied gently, \"If my water cannot reach my fields in Punjab, how can yours reach the sun, or your ancestors, so much further away?\" The people grew quiet and thought about his words. Guru Ji taught them that remembering God with love and doing good deeds matter more than the direction we face."], "lesson": "It's important to understand why we do things, not just do them because everyone else does.", "think": ["Why did Guru Ji throw water to the west?", "Why do you think the people grew quiet?"], "words": [["Ganga", "A great river of India, holy to Hindus."], ["Haridwar", "A holy city on the river Ganga."]], "n": 55, "seal": "", "who": "Guru Nanak Dev Ji"},

{"id": "feet-towards-makkah", "title": "Where God Is Not", "gur": "ਮੱਕੇ ਦੀ ਯਾਤਰਾ", "cat": "Guru Nanak Dev Ji", "age": "Kids", "where": "Makkah", "mins": 2, "c": "#3A2F6E", "c2": "#E9B021", "h": 410, "summary": "Tired after a long journey, Guru Nanak lies down to rest. A watchman is upset about which way his feet are pointing.", "text": ["On one of his long journeys, Guru Nanak Dev Ji travelled all the way to Makkah, the holiest city of Islam, together with Bhai Mardana. He wore the blue robes of a pilgrim.", "Tired after the long journey, Guru Ji lay down to rest, with his feet pointing towards the Kaaba, the holy house of prayer.", "A caretaker named Jiwan saw this and was upset. He woke Guru Ji and said, \"Who are you, lying with your feet towards the house of God?\"", "Guru Ji answered calmly, \"I am tired, brother. Please turn my feet to the direction where God is not.\"", "The story says that wherever Jiwan turned Guru Ji's feet, the holy house seemed to be there too. Jiwan understood what Guru Ji meant: God is everywhere, in every direction. The people gathered there listened to Guru Ji, and many came to respect him deeply."], "lesson": "God is everywhere. Every place and every direction belongs to the One Creator.", "think": ["What did Guru Ji ask Jiwan to do?", "What does it mean that God is everywhere?"], "words": [["Makkah", "The holiest city of Islam."], ["Kaaba", "The holy house of prayer at the centre of Makkah."]], "n": 56, "seal": "", "who": "Guru Nanak Dev Ji"},

{"id": "two-villages", "title": "Two Villages, Two Blessings", "gur": "ਵੱਸਦੇ ਰਹੋ, ਉੱਜੜ ਜਾਓ", "cat": "Guru Nanak Dev Ji", "age": "Kids", "where": "On Guru Nanak Dev Ji's travels", "mins": 2, "c": "#7A1F2B", "c2": "#F2C14E", "h": 385, "summary": "One village is rude to the Guru, and another is kind. His blessings for them surprise Bhai Mardana.", "text": ["On their travels, Guru Nanak Dev Ji and Bhai Mardana came to a village where the people were rude. They would not give the travellers food or a place to rest, and they laughed at them.", "As they left, Guru Ji raised his hand and blessed them: \"May you stay settled here, in this village.\"", "At the next village, the people were kind and generous. They welcomed Guru Ji, fed him, and listened to his words with love. As he left, Guru Ji said: \"May you be scattered far and wide.\"", "Bhai Mardana was puzzled. \"Guru Ji, you blessed the rude people to stay together, and told the kind people to be scattered. Shouldn't it be the other way round?\"", "Guru Ji explained, \"If the rude people stay in one place, their unkindness won't spread. But if the kind people go everywhere, they will carry kindness and good values wherever they live, like seeds carried by the wind.\""], "lesson": "Goodness is meant to be spread. Wherever we go, we can carry kindness with us.", "think": ["Why did Guru Ji want the kind people to be scattered?", "How can you spread kindness where you live?"], "words": [["Vasde raho", "Stay settled; live on here."], ["Ujjar jao", "Be scattered; spread far and wide."]], "n": 57, "seal": "", "who": "Guru Nanak Dev Ji"},

{"id": "mata-khivi", "title": "Mata Khivi Ji's Kitchen", "gur": "ਮਾਤਾ ਖੀਵੀ ਜੀ ਦਾ ਲੰਗਰ", "cat": "Guru Angad Dev Ji", "age": "Kids", "where": "Khadur Sahib", "mins": 2, "c": "#E37A14", "c2": "#EFE6D2", "h": 400, "summary": "The wife of Guru Angad Dev Ji makes the langar a place of warmth, where every guest is fed with love.", "text": ["Mata Khivi Ji was the wife of Guru Angad Dev Ji, the second Guru. At Khadur Sahib, many people came every day to hear the Guru's teachings, and Mata Khivi Ji took charge of the langar, the community kitchen.", "She made sure that everyone who came was fed, rich or poor, of any caste, Sikh or not. Nobody was turned away. She was known for making rich, creamy kheer, a rice pudding, so that even the poorest visitor could eat food usually kept for special days.", "Mata Khivi Ji did not only cook. She greeted every person kindly and made them feel at home. Under her care, the langar became a place where people learned that all human beings are equal.", "Her sewa is so loved that she is praised in Guru Granth Sahib Ji. In their vaar, the musicians Satta and Balwand wrote that, under Mata Khivi Ji, the langar was like a cool, leafy shade where everyone found comfort (Ang 967). She is the only woman named in this way in Guru Granth Sahib Ji."], "lesson": "Sewa done with love makes everyone feel equal and welcome.", "think": ["Why do you think Mata Khivi Ji served kheer to everyone?", "How can you help make a guest feel welcome?"], "words": [["Kheer", "A sweet rice pudding made with milk."], ["Sewa", "Selfless service, done without expecting a reward."]], "n": 58, "seal": "", "who": "Guru Angad Dev Ji"},

{"id": "akbar-pangat", "title": "The Emperor Sits on the Floor", "gur": "ਪਹਿਲੇ ਪੰਗਤ ਪਾਛੇ ਸੰਗਤ", "cat": "Guru Amar Das Ji", "age": "Kids", "where": "Goindwal", "mins": 2, "c": "#5B2C83", "c2": "#E9B021", "h": 390, "summary": "The great Emperor Akbar comes to meet the Guru. First, he must eat in the langar like everyone else.", "text": ["Guru Amar Das Ji, the third Guru, lived at Goindwal. He made a rule: \"Pehle pangat, pachhe sangat\". First sit in the pangat, then join the sangat. Anyone who wished to meet him had to eat in the langar first, sitting on the floor in rows with everyone else.", "One day, the Mughal Emperor Akbar, one of the most powerful rulers in the world, came to visit the Guru. His servants expected special treatment. But the Sikhs politely told him about the Guru's rule.", "Akbar did not get angry. He sat down on the floor beside farmers, workers and travellers, and ate the same simple food as them. He was deeply impressed that kings and poor people were treated exactly the same.", "Afterwards, Akbar met the Guru and offered land and wealth for the langar. Guru Ji gently said no. He explained that the langar should be run by the offerings and sewa of the sangat, not by gifts from a king."], "lesson": "In the Guru's house, everyone is equal. No one is too important to sit on the floor with others.", "think": ["Why did the Guru want everyone to eat together first?", "Why do you think Guru Ji said no to the emperor's gift?"], "words": [["Pangat", "Sitting together in rows to eat, as equals."], ["Sangat", "The community of people who gather together."]], "n": 59, "seal": "", "who": "Guru Amar Das Ji"},

{"id": "bibi-bhani", "title": "Bibi Bhani's Steady Hand", "gur": "ਬੀਬੀ ਭਾਨੀ ਜੀ ਦੀ ਸੇਵਾ", "cat": "Guru Amar Das Ji", "age": "Kids", "where": "Goindwal", "mins": 2, "c": "#C2410C", "c2": "#EFE6D2", "h": 375, "summary": "While her father meditates, a leg of his wooden seat breaks. Bibi Bhani quietly holds it up herself.", "text": ["Bibi Bhani Ji was the younger daughter of Guru Amar Das Ji. She served her father with great love every day, and later married Bhai Jetha, who became Guru Ram Das Ji.", "One early morning, Guru Amar Das Ji was sitting in deep meditation on a small wooden seat, a chowki. Bibi Bhani noticed that one of its legs had cracked, and the seat was starting to tip.", "She did not want to disturb her father. So she quietly knelt down and held up the corner of the chowki with her own hand, keeping it steady. She stayed like that for a long time, even though the broken wood hurt her hand.", "When Guru Ji opened his eyes, he saw what she had done and saw her hurt hand. He was deeply moved. \"Ask for anything you wish,\" he said.", "Bibi Bhani asked that the Guru's light might always stay in her family. Guru Ji granted her wish, but warned that it would also bring great tests and sacrifices. Her son became Guru Arjan Dev Ji, and every Guru after him came from her family."], "lesson": "Quiet, loving sewa, done without being asked, is precious. Real love thinks of others first.", "think": ["Why didn't Bibi Bhani wake her father?", "What do you think 'sewa without being asked' means?"], "words": [["Chowki", "A small, low wooden seat or stool."], ["Bibi", "A respectful title for a Sikh woman."]], "n": 60, "seal": "", "who": "Guru Amar Das Ji"},

{"id": "sri-chand-beard", "title": "A Beard to Wipe Your Feet", "gur": "ਬਾਬਾ ਸ੍ਰੀ ਚੰਦ ਜੀ", "cat": "Guru Ram Das Ji", "age": "Kids", "where": "Amritsar", "mins": 2, "c": "#EFE6D2", "c2": "#B5612E", "t": "#1b1b1b", "h": 395, "summary": "Guru Nanak's elder son comes to visit, and teases the Guru about his long beard. The answer moves him to tears.", "text": ["Baba Sri Chand Ji was the elder son of Guru Nanak Dev Ji. He was a respected holy man who had given up worldly life, and he founded the Udasi order of saints. He was now very old.", "One day, Baba Sri Chand Ji came to visit Guru Ram Das Ji. The Guru welcomed him warmly, bowed to him with respect, and sat with him.", "Baba Sri Chand Ji looked at Guru Ram Das Ji's long, flowing beard and asked with a smile, \"Why have you grown such a long beard?\"", "Guru Ram Das Ji answered with deep humility, \"To wipe the feet of holy people like you.\" And he bent down and began to gently wipe Baba Sri Chand Ji's dusty feet with his beard.", "Baba Sri Chand Ji quickly drew back his feet, his eyes full of tears. \"Now I understand why you sit on my father's seat,\" he said. \"Your humility is truly great.\""], "lesson": "The greatest people are the most humble. Respect others, especially the old and the wise.", "think": ["How did Guru Ram Das Ji answer the question about his beard?", "Why do you think Baba Sri Chand Ji had tears in his eyes?"], "words": [["Udasi", "An order of saints founded by Baba Sri Chand Ji."], ["Nimrata", "Humility."]], "n": 61, "seal": "", "who": "Guru Ram Das Ji"},

{"id": "four-doors", "title": "Four Doors for Everyone", "gur": "ਚਾਰ ਦਰਵਾਜ਼ੇ", "cat": "Guru Arjan Dev Ji", "age": "Kids", "where": "Amritsar, 1588", "mins": 3, "c": "#E9B021", "c2": "#0F6E8C", "t": "#1b1b1b", "h": 420, "summary": "Guru Arjan Dev Ji builds Harmandir Sahib in a way no one has seen before: low, and open on every side.", "text": ["Guru Arjan Dev Ji, the fifth Guru, wanted to build a beautiful house of God in the middle of the pool at Amritsar. It would be called Harmandir Sahib.", "In 1588, the foundation stone was laid. Sikh tradition remembers that Guru Ji invited his friend, Sain Mian Mir, a Muslim Sufi saint from Lahore, to lay it. In this way, people of different faiths came together from the very beginning.", "Most temples of that time were built high up, so people had to climb steps to reach them. But Guru Ji built Harmandir Sahib lower than the land around it, so that everyone would have to step down to enter. It taught humility: we must bow our pride to come close to God.", "Guru Ji also gave it four doors, one on each side: north, south, east and west. This meant that people from every direction, every caste and every faith were welcome. No one was ever to be turned away.", "In 1604, the work was finished, and Guru Ji placed the Adi Granth, the holy scripture he had compiled, inside it. Today it is often called the Golden Temple, and its doors are still open to everyone, day and night."], "lesson": "The Guru's house is open to everyone. We come close to God when we are humble.", "think": ["Why was Harmandir Sahib built lower than the land around it?", "What do the four doors stand for?"], "words": [["Harmandir Sahib", "The Golden Temple in Amritsar."], ["Neeh pathar", "A foundation stone."]], "n": 62, "seal": "", "who": "Guru Arjan Dev Ji"},

{"id": "arjan-shaheedi", "title": "Sweet Is Your Will", "gur": "ਤੇਰਾ ਕੀਆ ਮੀਠਾ ਲਾਗੈ", "cat": "Guru Arjan Dev Ji", "age": "Youth", "where": "Lahore, 1606", "mins": 3, "c": "#7A1F2B", "c2": "#F08A1C", "h": 405, "summary": "The fifth Guru is arrested and made to suffer terribly. Even then, he sings that God's will is sweet.", "text": ["As more and more people came to Guru Arjan Dev Ji, some powerful people grew jealous. In 1606, the new Mughal emperor, Jahangir, ordered that the Guru be arrested and punished. Chandu, an official who held a grudge against the Guru, was among those who turned the emperor against him.", "Guru Ji was taken to Lahore. He was asked to change the Adi Granth and to give up his faith. He refused.", "For several days, Guru Ji was tortured with terrible heat in the burning summer sun. Through it all, he stayed calm and kept repeating the words of Gurbani: \"Tera kiya meetha laage\", whatever You do feels sweet to me (Guru Granth Sahib, Ang 394).", "Sain Mian Mir, the Guru's Sufi friend, came to see him and offered to plead with the emperor. Guru Ji gently refused, saying that he accepted God's will with a peaceful heart.", "Guru Ji then asked to bathe in the river Ravi. He walked into its waters and left this world. He became the first Sikh shaheed. Gurdwara Dera Sahib in Lahore stands at this place, and Sikhs remember his shaheedi every summer by serving cool, sweet drinks, called chhabeel, to everyone who passes by."], "lesson": "True faith stays calm and sweet, even in the hardest times. Sikhs answer cruelty by serving others.", "think": ["What words did Guru Ji repeat during his suffering?", "Why do you think Sikhs serve cool drinks to remember his shaheedi?"], "words": [["Shaheedi", "Giving one's life for truth; martyrdom."], ["Chhabeel", "Cool sweet drinks served free to everyone."], ["Bhana", "God's will; accepting what happens with peace."]], "n": 63, "seal": "", "who": "Guru Arjan Dev Ji"},

{"id": "dilbagh-gulbagh", "title": "Bhai Bidhi Chand and the Two Horses", "gur": "ਦਿਲਬਾਗ ਤੇ ਗੁਲਬਾਗ", "cat": "Guru Hargobind Sahib Ji", "age": "Kids", "where": "Lahore", "mins": 3, "c": "#1B2A5E", "c2": "#E9B021", "h": 410, "summary": "Two beautiful horses meant for the Guru are seized by officials. A clever Sikh in disguise brings them home.", "text": ["Some Sikhs from Kabul were bringing two magnificent horses, named Dilbagh and Gulbagh, as a gift for Guru Hargobind Sahib Ji. But on the way, Mughal officials seized the horses and took them to the royal stables in Lahore fort.", "Bhai Bidhi Chand, a brave and clever Sikh, said, \"Guru Ji, I will bring them back.\" He went to Lahore dressed as a poor grass-cutter and got a job looking after the horses in the fort.", "Every day he fed and cared for the horses, and they grew to love him. Every night, he threw a heavy stone into the river below the fort wall. At first the guards jumped up at the loud splash, but soon they got used to it and stopped checking.", "One dark night, Bhai Bidhi Chand climbed onto Dilbagh and leapt from the fort wall into the river Ravi. The guards heard only the usual splash! He swam the horse across and rode back to the Guru.", "Later he returned in another disguise, this time as an astrologer, and cleverly brought back Gulbagh too. The Guru was delighted and praised Bhai Bidhi Chand's courage and quick thinking."], "lesson": "Courage works best with patience and clever thinking.", "think": ["Why did Bhai Bidhi Chand throw a stone into the river every night?", "Which disguise would you have chosen, and why?"], "words": [["Ghasiara", "A grass-cutter."], ["Najoomi", "An astrologer."]], "n": 64, "seal": "", "who": "Guru Hargobind Sahib Ji"},

{"id": "flower-and-robe", "title": "The Flower and the Robe", "gur": "ਫੁੱਲ ਤੇ ਚੋਲਾ", "cat": "Guru Har Rai Sahib Ji", "age": "Kids", "where": "Kiratpur Sahib", "mins": 2, "c": "#E06A8A", "c2": "#3E8E4A", "h": 380, "summary": "Young Har Rai runs through the garden, and his robe breaks a flower. His grandfather's words stay with him forever.", "text": ["When Guru Har Rai Sahib Ji was a young boy, he lived with his grandfather, Guru Hargobind Sahib Ji, at Kiratpur. The Guru had a lovely garden full of flowers and trees.", "One day, young Har Rai was running happily through the garden, wearing a long, loose robe called a chola. As he ran past a bush, his robe caught on a flower, and the flower broke and fell to the ground.", "Har Rai stopped and looked at the broken flower. He felt very sad. Just then, his grandfather walked up.", "Guru Hargobind Sahib Ji said gently, \"If you wear a long robe, you must carry it carefully, so that it doesn't hurt anything.\" Har Rai understood that his grandfather meant more than just a robe: we must move through the world gently, without harming anything.", "From that day on, Har Rai always held his robe close as he walked. He grew up to love nature deeply. As the seventh Guru, he kept gardens and animals, and ran a free hospital with healing herbs."], "lesson": "Be gentle with all living things. Even a small careless act can hurt something beautiful.", "think": ["How did Har Rai feel when the flower broke?", "What can you do to be gentle with plants and animals?"], "words": [["Chola", "A long robe or cloak."], ["Phull", "A flower."]], "n": 65, "seal": "", "who": "Guru Har Rai Sahib Ji"},

{"id": "bibi-kaulan", "title": "Bibi Kaulan's Pool", "gur": "ਬੀਬੀ ਕੌਲਾਂ", "cat": "Guru Hargobind Sahib Ji", "age": "Kids", "where": "Lahore and Amritsar", "mins": 3, "c": "#0F6E8C", "c2": "#EFE6D2", "h": 395, "summary": "A girl in Lahore loves singing Gurbani, but her guardian forbids it. She finds shelter with the Guru.", "text": ["Bibi Kaulan was brought up in the house of a Qazi, a Muslim judge in Lahore. As a girl, she often visited Sain Mian Mir, the kind Sufi saint, and there she heard the hymns of the Sikh Gurus. She loved them so much that she began to sing them every day.", "The Qazi was angry. He forbade her from singing the Gurus' hymns and threatened to punish her if she did not stop. But Bibi Kaulan could not give up the words that filled her heart with peace.", "Sain Mian Mir knew she was in danger. He arranged for her to be taken safely to Guru Hargobind Sahib Ji in Amritsar.", "The Guru welcomed her with kindness and gave her a safe home. She spent the rest of her life in prayer, meditation and sewa.", "Guru Hargobind Sahib Ji built a sarovar, a holy pool, near Harmandir Sahib and named it Kaulsar, after her. It is still there today, and pilgrims to Amritsar remember her devotion."], "lesson": "Everyone is free to love God in their own way. The Guru's house gives shelter to all.", "think": ["Why was Bibi Kaulan in danger?", "How did Sain Mian Mir help her?"], "words": [["Qazi", "A Muslim judge."], ["Kaulsar", "A holy pool in Amritsar named after Bibi Kaulan."]], "n": 66, "seal": "", "who": "Guru Hargobind Sahib Ji"},

{"id": "three-companions", "title": "Three Who Stood Firm", "gur": "ਭਾਈ ਮਤੀ ਦਾਸ, ਸਤੀ ਦਾਸ, ਦਿਆਲਾ ਜੀ", "cat": "Guru Tegh Bahadur Ji", "age": "Youth", "where": "Chandni Chowk, Delhi, 1675", "mins": 3, "c": "#3E5A8C", "c2": "#F08A1C", "h": 405, "summary": "Guru Tegh Bahadur Ji's three companions are given a choice: give up their faith, or give their lives.", "text": ["When Guru Tegh Bahadur Ji set out for Delhi to stand up for the Kashmiri Pandits, three devoted Sikhs went with him: two brothers, Bhai Mati Das Ji and Bhai Sati Das Ji, and their friend Bhai Dayala Ji.", "They were all arrested and brought to Chandni Chowk in Delhi. The officials thought that if they frightened the Guru's companions, the Guru would give in. So each Sikh was offered riches and freedom if he gave up his faith.", "Each one refused. Bhai Mati Das Ji said calmly that he would never leave the Guru's path. He asked only to face his Guru at the end.", "One by one, the three companions were put to death in terribly cruel ways, in front of the Guru. Not one of them cried out in fear. To the very end, each kept reciting Gurbani, the words of Japji Sahib and the Guru's hymns.", "Their courage did not break Guru Tegh Bahadur Ji. It only showed how strong faith can be. Today, the Bhai Mati Das Museum stands near Gurdwara Sis Ganj Sahib in Chandni Chowk, and Sikhs remember all three in their daily Ardas."], "lesson": "True courage is staying calm and faithful, even when it costs everything.", "think": ["Why did the officials try to frighten the companions first?", "How do Sikhs remember them today?"], "words": [["Ardas", "The Sikh prayer said with the sangat."], ["Japji Sahib", "Guru Nanak Dev Ji's prayer, recited every morning."]], "n": 67, "seal": "", "who": "Guru Tegh Bahadur Ji"},

{"id": "bhai-jaita", "title": "Rangrete Guru Ke Bete", "gur": "ਰੰਘਰੇਟੇ ਗੁਰੂ ਕੇ ਬੇਟੇ", "cat": "Guru Tegh Bahadur Ji", "age": "Youth", "where": "Delhi to Anandpur Sahib, 1675", "mins": 3, "c": "#1E2A4A", "c2": "#E9B021", "h": 390, "summary": "After Guru Tegh Bahadur Ji's shaheedi, a brave Sikh risks everything to carry the Guru's sacred head home.", "text": ["After Guru Tegh Bahadur Ji gave his life in Chandni Chowk in November 1675, the emperor's soldiers guarded the place closely. No one was allowed to take the Guru's body.", "That evening, a dust storm swept through Delhi. In the darkness, a brave Sikh named Bhai Jaita crept forward, gently lifted the Guru's sacred head, his sees, and wrapped it in cloth.", "At the same time, another Sikh, Lakhi Shah Vanjara, and his sons carried away the Guru's body on their carts. To give the Guru a proper cremation without being caught, Lakhi Shah set fire to his own house. Gurdwara Rakab Ganj Sahib stands at that place in Delhi today.", "Bhai Jaita travelled for days, hiding from soldiers, all the way to Kiratpur near Anandpur Sahib. There, young Guru Gobind Rai, the son of Guru Tegh Bahadur Ji, received his father's head with deep love and sorrow.", "Bhai Jaita came from a community that people unfairly looked down upon. But the young Guru embraced him and said, \"Rangrete Guru ke bete\": the Rangretas are the Guru's own sons. Bhai Jaita later took Amrit and became Bhai Jiwan Singh, a great Sikh warrior."], "lesson": "Courage and love make a person great, not caste or birth. Everyone is equal in the Guru's family.", "think": ["What did Lakhi Shah Vanjara do so the Guru's body could be cremated?", "What did 'Rangrete Guru ke bete' tell everyone about equality?"], "words": [["Sees", "The head; the Guru's sacred head."], ["Rangreta", "A community whose members were unfairly treated as lower caste."]], "n": 68, "seal": "", "who": "Guru Tegh Bahadur Ji"},

{"id": "vaisakhi-1699", "title": "The Day of the Khalsa", "gur": "ਖ਼ਾਲਸਾ ਸਾਜਨਾ", "cat": "Guru Gobind Singh Ji", "age": "Kids", "where": "Anandpur Sahib, 1699", "mins": 3, "c": "#F08A1C", "c2": "#1B2A5E", "h": 415, "summary": "Thousands gather for Vaisakhi. The Guru asks a question nobody expects, and five Sikhs step forward.", "text": ["On Vaisakhi in 1699, thousands of Sikhs gathered at Anandpur Sahib. Guru Gobind Singh Ji came out before the sangat holding a sword and asked, \"Is there anyone here willing to give their head for the Guru?\"", "The crowd fell silent. Then Bhai Daya Ram stood up. The Guru took him into a tent, came out again with his sword, and asked for another head. One by one, four more stood up: Bhai Dharam Das, Bhai Himmat Rai, Bhai Mohkam Chand and Bhai Sahib Chand. They came from different castes and different parts of India.", "Then the Guru brought all five out, alive and dressed in saffron. These five became known as the Panj Pyare, the Five Beloved Ones.", "Guru Ji prepared Amrit in an iron bowl, stirring water with a double-edged khanda while reciting Gurbani. Mata Sahib Kaur Ji added sweet patashe to the water. The five drank the Amrit and were given the name Singh. They became the first members of the Khalsa.", "Then something remarkable happened. The Guru asked the Panj Pyare to give Amrit to him. In this way, the Guru showed that the Khalsa and the Guru are one. Gobind Rai became Guru Gobind Singh."], "lesson": "The Khalsa was built on courage, equality and commitment. Even the Guru bowed to the Panj Pyare.", "think": ["Why do you think the Panj Pyare came from different castes and places?", "What did it mean when the Guru asked the Panj Pyare for Amrit?"], "words": [["Panj Pyare", "The Five Beloved Ones, the first members of the Khalsa."], ["Patashe", "Small sugar puffs."], ["Khalsa", "The community of initiated Sikhs; it means 'pure'."]], "n": 69, "seal": "", "who": "Guru Gobind Singh Ji"},

{"id": "bhai-kanhaiya", "title": "Water for Everyone", "gur": "ਭਾਈ ਘਨੱਈਆ ਜੀ", "cat": "Guru Gobind Singh Ji", "age": "Kids", "where": "Anandpur Sahib", "mins": 3, "c": "#1F8E6E", "c2": "#EFE6D2", "h": 395, "summary": "During a battle, one Sikh gives water to every wounded soldier, even those fighting against the Sikhs.", "text": ["Bhai Kanhaiya Ji, also called Bhai Ghanaiya Ji, was a Sikh of Guru Gobind Singh Ji. During the battles at Anandpur Sahib, he carried a leather water bag, a mashak, and walked among the wounded soldiers, giving them water to drink.", "Some Sikhs noticed something surprising. Bhai Kanhaiya Ji was giving water not only to Sikh soldiers but also to the enemy soldiers. They were upset and complained to the Guru: \"He is helping the enemy get better so they can fight us again!\"", "Guru Gobind Singh Ji called Bhai Kanhaiya Ji and asked him about it. Bhai Kanhaiya Ji answered with folded hands, \"Guru Ji, when I look at the wounded, I do not see friend or enemy. I see only your light in every face.\"", "The Guru was very pleased. He gave Bhai Kanhaiya Ji a box of healing ointment, called marham, and said, \"From now on, put this on their wounds as well.\"", "Today, Bhai Kanhaiya Ji is remembered as a pioneer of caring for everyone who is hurt, long before the Red Cross was founded. Sikh groups that bring aid to people in need around the world still follow his example."], "lesson": "Sarbat da bhala: wish well for everyone. Kindness has no enemies.", "think": ["What did Bhai Kanhaiya Ji see when he looked at the wounded?", "How can you show kindness to someone you don't get along with?"], "words": [["Mashak", "A leather bag for carrying water."], ["Marham", "A healing ointment for wounds."], ["Sarbat da bhala", "The good of all people."]], "n": 70, "seal": "", "who": "Guru Gobind Singh Ji"},

{"id": "donkey-lion-skin", "title": "The Donkey in a Lion's Skin", "gur": "ਸ਼ੇਰ ਦੀ ਖੱਲ ਵਿੱਚ ਖੋਤਾ", "cat": "Guru Gobind Singh Ji", "age": "Kids", "where": "Anandpur Sahib", "mins": 2, "c": "#C98A2B", "c2": "#7A1F2B", "h": 385, "summary": "A strange 'lion' scares everyone in Anandpur, until it opens its mouth. The Guru uses it to teach the Khalsa.", "text": ["One day, Guru Gobind Singh Ji had a lion's skin placed over a potter's donkey and let it wander around Anandpur.", "Everyone who saw it thought it was a real lion! People ran indoors, and the farmers' animals scattered. The 'lion' walked happily through the fields, eating whatever crops it liked, and no one dared to stop it.", "Then the donkey heard the potter calling, and it opened its mouth and brayed loudly: \"Hee-haw! Hee-haw!\" At once, everyone knew it was only a donkey. The potter came running, pulled off the lion skin, and led his donkey home.", "Guru Ji gathered his Sikhs and said, \"You have seen the donkey in a lion's skin. Wearing the look of a lion did not make it brave. In the same way, wearing the Khalsa's form is not enough. A true Khalsa must also have a lion's heart: brave, truthful, kind and ready to protect others.\"", "The Sikhs laughed at the funny donkey, but they never forgot the lesson."], "lesson": "What we are inside matters more than how we look outside. A true Sikh's actions match their appearance.", "think": ["How did everyone find out the lion was really a donkey?", "What qualities make someone a 'lion' on the inside?"], "words": [["Khalsa", "The community of initiated Sikhs; it means 'pure'."], ["Ghumiar", "A potter."]], "n": 71, "seal": "", "who": "Guru Gobind Singh Ji"},
